<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 240" width="830" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="830" height="240" fill="none"/>
<text x="20" y="24" font-size="14">Four real protocols, same blocks (details from the vendor guides in the collection).</text><text x="24" y="50" font-size="12.5" fill="#23282d" font-weight="bold"></text><text x="124" y="50" font-size="12.5" fill="#23282d" font-weight="bold">TruSeq PCR-free</text><text x="274" y="50" font-size="12.5" fill="#23282d" font-weight="bold">NEBNext Ultra II FS PCR-free</text><text x="504" y="50" font-size="12.5" fill="#23282d" font-weight="bold">Illumina DNA Prep</text><text x="684" y="50" font-size="12.5" fill="#23282d" font-weight="bold">Nextera XT</text><line x1="20" y1="58" x2="810" y2="58" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="24" y="80" font-size="12.5" fill="#8a8f94">fragment</text><text x="124" y="80" font-size="12.5" fill="#23282d">Covaris</text><text x="274" y="80" font-size="12.5" fill="#23282d">enzymatic, with end prep</text><text x="504" y="80" font-size="12.5" fill="#23282d">bead-linked Tn5</text><text x="684" y="80" font-size="12.5" fill="#23282d">Tn5</text><text x="24" y="106" font-size="12.5" fill="#8a8f94">input</text><text x="124" y="106" font-size="12.5" fill="#23282d">about 1 to 2 µg</text><text x="274" y="106" font-size="12.5" fill="#23282d">100 to 500 ng</text><text x="504" y="106" font-size="12.5" fill="#23282d">1 to 500 ng</text><text x="684" y="106" font-size="12.5" fill="#23282d">1 ng</text><text x="24" y="132" font-size="12.5" fill="#8a8f94">handle</text><text x="124" y="132" font-size="12.5" fill="#23282d">ligate full-length</text><text x="274" y="132" font-size="12.5" fill="#23282d">ligate full-length</text><text x="504" y="132" font-size="12.5" fill="#23282d">transposed + PCR</text><text x="684" y="132" font-size="12.5" fill="#23282d">transposed + PCR</text><text x="24" y="158" font-size="12.5" fill="#8a8f94">PCR</text><text x="124" y="158" font-size="12.5" fill="#2e6b3f">none</text><text x="274" y="158" font-size="12.5" fill="#2e6b3f">none</text><text x="504" y="158" font-size="12.5" fill="#23282d">5 to 12 cycles</text><text x="684" y="158" font-size="12.5" fill="#23282d">12 cycles</text><text x="24" y="184" font-size="12.5" fill="#8a8f94">sizing</text><text x="124" y="184" font-size="12.5" fill="#23282d">bead size selection</text><text x="274" y="184" font-size="12.5" fill="#23282d">bead size selection</text><text x="504" y="184" font-size="12.5" fill="#23282d">double-sided beads</text><text x="684" y="184" font-size="12.5" fill="#23282d">bead clean-up</text><text x="24" y="210" font-size="12.5" fill="#8a8f94">quant.</text><text x="124" y="210" font-size="12.5" fill="#23282d">qPCR required</text><text x="274" y="210" font-size="12.5" fill="#23282d">see guide</text><text x="504" y="210" font-size="12.5" fill="#23282d">bead-normalised</text><text x="684" y="210" font-size="12.5" fill="#23282d">bead-normalised</text>
</svg>
