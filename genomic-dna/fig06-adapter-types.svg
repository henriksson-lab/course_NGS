<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="196" fill="none"/>
<text x="20" y="24" font-size="14">Why PCR-free adapters are full length.</text><text x="40" y="54" font-size="13" fill="#2e6b3f" font-weight="bold">PCR-free: everything is ligated on</text><rect x="40" y="62" width="38" height="24" rx="2" fill="#c98a2b" stroke="none"/><text x="59.0" y="78" font-size="11.5" text-anchor="middle" fill="#ffffff">P5</text><rect x="80" y="62" width="28" height="24" rx="2" fill="#b4532a" stroke="none"/><text x="94.0" y="78" font-size="11.5" text-anchor="middle" fill="#ffffff">i5</text><rect x="110" y="62" width="48" height="24" rx="2" fill="#4a6b8a" stroke="none"/><text x="134.0" y="78" font-size="11.5" text-anchor="middle" fill="#ffffff">R1</text><rect x="160" y="62" width="148" height="24" rx="2" fill="#1f3b57" stroke="none"/><text x="234.0" y="78" font-size="11.5" text-anchor="middle" fill="#ffffff">insert</text><rect x="310" y="62" width="48" height="24" rx="2" fill="#4a6b8a" stroke="none"/><text x="334.0" y="78" font-size="11.5" text-anchor="middle" fill="#ffffff">R2</text><rect x="360" y="62" width="28" height="24" rx="2" fill="#b4532a" stroke="none"/><text x="374.0" y="78" font-size="11.5" text-anchor="middle" fill="#ffffff">i7</text><rect x="390" y="62" width="38" height="24" rx="2" fill="#c98a2b" stroke="none"/><text x="409.0" y="78" font-size="11.5" text-anchor="middle" fill="#ffffff">P7</text><text x="40" y="130" font-size="13" fill="#a33a28" font-weight="bold">With PCR: stub adapters, the primers add the rest (outlined)</text><rect x="40" y="138" width="38" height="24" rx="2" fill="none" stroke="#8a8f94"/><text x="59.0" y="154" font-size="11.5" text-anchor="middle" fill="#8a8f94">P5</text><rect x="80" y="138" width="28" height="24" rx="2" fill="none" stroke="#8a8f94"/><text x="94.0" y="154" font-size="11.5" text-anchor="middle" fill="#8a8f94">i5</text><rect x="110" y="138" width="48" height="24" rx="2" fill="#4a6b8a" stroke="none"/><text x="134.0" y="154" font-size="11.5" text-anchor="middle" fill="#ffffff">R1</text><rect x="160" y="138" width="148" height="24" rx="2" fill="#1f3b57" stroke="none"/><text x="234.0" y="154" font-size="11.5" text-anchor="middle" fill="#ffffff">insert</text><rect x="310" y="138" width="48" height="24" rx="2" fill="#4a6b8a" stroke="none"/><text x="334.0" y="154" font-size="11.5" text-anchor="middle" fill="#ffffff">R2</text><rect x="360" y="138" width="28" height="24" rx="2" fill="none" stroke="#8a8f94"/><text x="374.0" y="154" font-size="11.5" text-anchor="middle" fill="#8a8f94">i7</text><rect x="390" y="138" width="38" height="24" rx="2" fill="none" stroke="#8a8f94"/><text x="409.0" y="154" font-size="11.5" text-anchor="middle" fill="#8a8f94">P7</text><text x="520" y="82" font-size="12.5" fill="#8a8f94">goes straight to the flow cell,</text><text x="520" y="98" font-size="12.5" fill="#8a8f94">must be quantified by qPCR</text><text x="520" y="158" font-size="12.5" fill="#8a8f94">amplification also rescues</text><text x="520" y="174" font-size="12.5" fill="#8a8f94">low input, but adds bias</text>
</svg>
