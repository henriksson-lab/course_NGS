<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 234" width="810" height="234" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="234" fill="none"/>
<text x="20" y="24" font-size="14">A small efficiency difference per cycle compounds (illustrative: 90% vs 80% per cycle).</text><rect x="70" y="198" width="34" height="2" rx="2" fill="#1f3b57" stroke="none"/><rect x="110" y="198" width="34" height="2" rx="2" fill="#b4532a" stroke="none"/><text x="107" y="218" font-size="12.5" text-anchor="middle" fill="#8a8f94">0 cycles</text><text x="87" y="193" font-size="11.5" text-anchor="middle" fill="#1f3b57">1x</text><text x="127" y="193" font-size="11.5" text-anchor="middle" fill="#b4532a">1x</text><rect x="210" y="150.24815549320925" width="34" height="49.75184450679073" rx="2" fill="#1f3b57" stroke="none"/><rect x="250" y="154.43905320918964" width="34" height="45.56094679081037" rx="2" fill="#b4532a" stroke="none"/><text x="247" y="218" font-size="12.5" text-anchor="middle" fill="#8a8f94">4 cycles</text><text x="227" y="145.24815549320925" font-size="11.5" text-anchor="middle" fill="#1f3b57">13x</text><text x="267" y="149.43905320918964" font-size="11.5" text-anchor="middle" fill="#b4532a">10x</text><rect x="350" y="100.49631098641855" width="34" height="99.50368901358145" rx="2" fill="#1f3b57" stroke="none"/><rect x="390" y="108.87810641837926" width="34" height="91.12189358162074" rx="2" fill="#b4532a" stroke="none"/><text x="387" y="218" font-size="12.5" text-anchor="middle" fill="#8a8f94">8 cycles</text><text x="367" y="95.49631098641855" font-size="11.5" text-anchor="middle" fill="#1f3b57">170x</text><text x="407" y="103.87810641837926" font-size="11.5" text-anchor="middle" fill="#b4532a">110x</text><rect x="490" y="50.74446647962782" width="34" height="149.25553352037218" rx="2" fill="#1f3b57" stroke="none"/><rect x="530" y="63.317159627568884" width="34" height="136.68284037243112" rx="2" fill="#b4532a" stroke="none"/><text x="527" y="218" font-size="12.5" text-anchor="middle" fill="#8a8f94">12 cycles</text><text x="507" y="45.74446647962782" font-size="11.5" text-anchor="middle" fill="#1f3b57">2213x</text><text x="547" y="58.317159627568884" font-size="11.5" text-anchor="middle" fill="#b4532a">1157x</text><line x1="60" y1="200" x2="574" y2="200" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="640" y="60" width="12" height="12" rx="2" fill="#1f3b57" stroke="none"/><text x="658" y="71" font-size="12.5">90% per cycle</text><rect x="640" y="82" width="12" height="12" rx="2" fill="#b4532a" stroke="none"/><text x="658" y="93" font-size="12.5">80% per cycle</text><text x="640" y="130" font-size="12.5" fill="#23282d">After 12 cycles the first</text><text x="640" y="146" font-size="12.5" fill="#23282d">is 1.9 times the second.</text><text x="640" y="170" font-size="11.5" fill="#8a8f94">(bars on a log scale)</text>
</svg>
