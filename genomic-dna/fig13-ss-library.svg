<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="800" height="260" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="260" fill="none"/>
<text x="20" y="24" font-size="14">Single-stranded library: every strand is a template, nicked or not.</text><text x="30" y="52" font-size="13.5" fill="#23282d" font-weight="bold">1 Denature</text><line x1="30" y1="90" x2="150" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="112" x2="150" y2="112" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><path d="M 50 142 L 110 142" stroke="#1f3b57" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 70 164 L 130 164" stroke="#4a6b8a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="30" y="196" font-size="12" fill="#8a8f94">duplex becomes two</text><text x="30" y="211" font-size="12" fill="#8a8f94">single strands</text><line x1="180" y1="120" x2="207" y2="120" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 212 120 L 207 116.5 L 207 123.5 Z" fill="#8a8f94"/><text x="220" y="52" font-size="13.5" fill="#23282d" font-weight="bold">2 Ligate adapter 1</text><line x1="220" y1="90" x2="310" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="310" y="86" width="24" height="8" rx="2" fill="#c98a2b" stroke="none"/><circle cx="346" cy="90" r="6" fill="#b4532a"/><line x1="220" y1="130" x2="290" y2="130" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="290" y="126" width="24" height="8" rx="2" fill="#c98a2b" stroke="none"/><circle cx="326" cy="130" r="6" fill="#b4532a"/><text x="220" y="196" font-size="12" fill="#8a8f94">to each 3' end</text><text x="220" y="211" font-size="12" fill="#8a8f94">(on streptavidin beads)</text><line x1="370" y1="120" x2="397" y2="120" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 402 120 L 397 116.5 L 397 123.5 Z" fill="#8a8f94"/><text x="410" y="52" font-size="13.5" fill="#23282d" font-weight="bold">3 Copy strand</text><line x1="410" y1="90" x2="500" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="500" y="86" width="24" height="8" rx="2" fill="#c98a2b" stroke="none"/><circle cx="536" cy="90" r="6" fill="#b4532a"/><line x1="416" y1="104" x2="524" y2="104" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="410" y1="144" x2="480" y2="144" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="480" y="140" width="24" height="8" rx="2" fill="#c98a2b" stroke="none"/><circle cx="516" cy="144" r="6" fill="#b4532a"/><line x1="416" y1="158" x2="504" y2="158" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="410" y="196" font-size="12" fill="#8a8f94">primer extension</text><text x="410" y="211" font-size="12" fill="#8a8f94">makes a duplex</text><line x1="560" y1="120" x2="587" y2="120" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 592 120 L 587 116.5 L 587 123.5 Z" fill="#8a8f94"/><text x="600" y="52" font-size="13.5" fill="#23282d" font-weight="bold">4 Ligate adapter 2</text><rect x="590" y="86" width="20" height="8" rx="2" fill="#c98a2b" stroke="none"/><line x1="610" y1="90" x2="700" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="700" y="86" width="24" height="8" rx="2" fill="#c98a2b" stroke="none"/><line x1="610" y1="104" x2="700" y2="104" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="700" y="100" width="24" height="8" rx="2" fill="none" stroke="#c98a2b"/><text x="600" y="196" font-size="12" fill="#8a8f94">blunt, to the copy;</text><text x="600" y="211" font-size="12" fill="#8a8f94">release, then PCR</text><text x="20" y="244" font-size="13.5" fill="#23282d">Ancient DNA is short, nicked and often lacks usable duplex ends: ligating to single strands recovers more of it.</text>
</svg>
