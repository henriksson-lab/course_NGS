<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 807 270" width="807" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="270" fill="none"/>
<text x="20" y="24" font-size="14">PTA: terminating nucleotides keep every copy a copy of the original.</text><text x="30" y="52" font-size="13.5" fill="#a33a28" font-weight="bold">MDA</text><line x1="30" y1="70" x2="330" y2="70" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="82" x2="230" y2="82" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round"/><line x1="110" y1="92" x2="310" y2="92" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round"/><line x1="170" y1="102" x2="290" y2="102" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round"/><path d="M 240 100 C 260 108 270 120 300 124" stroke="#a33a28" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="350" y="90" font-size="12.5" fill="#a33a28">copies of copies: errors spread</text><text x="30" y="160" font-size="13.5" fill="#2e6b3f" font-weight="bold">PTA</text><line x1="30" y1="178" x2="330" y2="178" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="50" y1="190" x2="120" y2="190" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round"/><rect x="120" y="185" width="5" height="10" rx="2" fill="#a33a28" stroke="none"/><line x1="130" y1="200" x2="220" y2="200" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round"/><rect x="220" y="195" width="5" height="10" rx="2" fill="#a33a28" stroke="none"/><line x1="200" y1="190" x2="260" y2="190" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round"/><rect x="260" y="185" width="5" height="10" rx="2" fill="#a33a28" stroke="none"/><line x1="250" y1="200" x2="320" y2="200" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round"/><rect x="320" y="195" width="5" height="10" rx="2" fill="#a33a28" stroke="none"/><text x="350" y="194" font-size="12.5" fill="#2e6b3f">short products end in a blocked 3' end:</text><text x="350" y="210" font-size="12.5" fill="#2e6b3f">they cannot be extended or used as templates</text><text x="30" y="252" font-size="13.5" fill="#23282d">Alpha-thio-ddNTPs are mixed with dNTPs; each terminated copy is exonuclease-resistant, so phi29 cannot repair it.</text>
</svg>
