<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 290" width="980" height="290" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="980" height="290" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">TruSeq DNA PCR-free: the construct after every block. 1 µg of blood DNA.</text><text x="40" y="67" font-size="12.5" fill="#23282d">1  shear to ~350 bp</text><rect x="250" y="52" width="230" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="365.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">genomic insert, ragged ends</text><text x="620" y="67" font-size="11.5" fill="#8a8f94">mixed 5'-P / 5'-OH, overhangs</text><text x="40" y="101" font-size="12.5" fill="#23282d">2  end repair</text><rect x="250" y="86" width="230" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="365.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert, blunt, 5'-P and 3'-OH</text><text x="620" y="101" font-size="11.5" fill="#8a8f94">every end now the same</text><text x="40" y="135" font-size="12.5" fill="#23282d">2  dA-tail</text><rect x="250" y="120" width="14" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="257.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#b4532a">A</text><rect x="264" y="120" width="230" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="379.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="494" y="120" width="14" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="501.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#b4532a">A</text><text x="620" y="135" font-size="11.5" fill="#8a8f94">one 3' A, so only a T can ligate</text><text x="40" y="169" font-size="12.5" fill="#23282d">3  ligate the full adapter</text><rect x="250" y="154" width="66" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="283.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="316" y="154" width="230" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="431.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="546" y="154" width="66" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="579.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="620" y="169" font-size="11.5" fill="#8a8f94">forked adapter, already full length</text><text x="40" y="203" font-size="12.5" fill="#23282d">4  no PCR</text><rect x="250" y="188" width="66" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="283.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="316" y="188" width="230" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="431.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="546" y="188" width="66" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="579.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="620" y="203" font-size="11.5" fill="#8a8f94">nothing to add: the ends are complete</text><text x="40" y="237" font-size="12.5" fill="#23282d">5  size select, qPCR, load</text><rect x="250" y="222" width="66" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="283.0" y="237.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="316" y="222" width="230" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="431.0" y="237.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="546" y="222" width="66" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="579.0" y="237.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="620" y="237" font-size="11.5" fill="#8a8f94">unchanged since block 3</text><text x="40" y="270" font-size="13.5" fill="#b4532a">The molecule that was ligated is the molecule that is read. That is what PCR-free buys, and why block 4 can be nothing.</text>
</svg>
