<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 250" width="864" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="250" fill="none"/>
<text x="20" y="24" font-size="14">Uracil from deamination, and what UDG treatment leaves (schematic, one read).</text><text x="130" y="67" font-size="13.5" text-anchor="end" fill="#23282d" font-weight="bold">untreated</text><line x1="146" y1="62" x2="466" y2="62" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="156" cy="62" r="5.5" fill="#a33a28"/><circle cx="176" cy="62" r="5.5" fill="#a33a28"/><circle cx="216" cy="62" r="5.5" fill="#a33a28"/><circle cx="296" cy="62" r="5.5" fill="#a33a28"/><circle cx="356" cy="62" r="5.5" fill="#a33a28"/><circle cx="436" cy="62" r="5.5" fill="#a33a28"/><circle cx="456" cy="62" r="5.5" fill="#a33a28"/><text x="480" y="67" font-size="12.5" fill="#8a8f94">all damage kept</text><text x="130" y="113" font-size="13.5" text-anchor="end" fill="#23282d" font-weight="bold">full UDG</text><line x1="146" y1="108" x2="466" y2="108" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="480" y="113" font-size="12.5" fill="#8a8f94">damage removed everywhere</text><text x="130" y="159" font-size="13.5" text-anchor="end" fill="#23282d" font-weight="bold">partial UDG</text><line x1="146" y1="154" x2="466" y2="154" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="156" cy="154" r="5.5" fill="#a33a28"/><circle cx="176" cy="154" r="5.5" fill="#a33a28"/><circle cx="436" cy="154" r="5.5" fill="#a33a28"/><circle cx="456" cy="154" r="5.5" fill="#a33a28"/><text x="480" y="159" font-size="12.5" fill="#8a8f94">damage kept at the ends only</text><text x="20" y="214" font-size="13.5" fill="#23282d">Full UDG gives clean variant calls but removes the signal that proves the DNA is ancient. Partial UDG keeps it at the ends.</text><text x="20" y="234" font-size="13.5" fill="#23282d">Methylated CpG deaminates to T, not U, so UDG cannot remove those changes.</text>
</svg>
