<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 146" width="808" height="146" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="146" fill="none"/>
<text x="30" y="26" font-size="14">Every genomic library is the same five blocks; the sample decides which variant of each.</text><rect x="30" y="46" width="132" height="42" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="96.0" y="71.55" font-size="13" text-anchor="middle" fill="#23282d">1 Fragment</text><line x1="165" y1="67.0" x2="180" y2="67.0" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 185 67.0 L 180 63.5 L 180 70.5 Z" fill="#8a8f94"/><rect x="188" y="46" width="132" height="42" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="254.0" y="71.55" font-size="13" text-anchor="middle" fill="#23282d">2 End chemistry</text><line x1="323" y1="67.0" x2="338" y2="67.0" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 343 67.0 L 338 63.5 L 338 70.5 Z" fill="#8a8f94"/><rect x="346" y="46" width="132" height="42" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="412.0" y="71.55" font-size="13" text-anchor="middle" fill="#23282d">3 Handle</text><line x1="481" y1="67.0" x2="496" y2="67.0" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 501 67.0 L 496 63.5 L 496 70.5 Z" fill="#8a8f94"/><rect x="504" y="46" width="132" height="42" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="570.0" y="71.55" font-size="13" text-anchor="middle" fill="#23282d">4 Amplify?</text><line x1="639" y1="67.0" x2="654" y2="67.0" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 659 67.0 L 654 63.5 L 654 70.5 Z" fill="#8a8f94"/><rect x="662" y="46" width="132" height="42" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="728.0" y="71.55" font-size="13" text-anchor="middle" fill="#23282d">5 QC</text><text x="96" y="112" font-size="12" text-anchor="middle" fill="#8a8f94">size, randomness</text><text x="96" y="128" font-size="12" text-anchor="middle" fill="#8a8f94">shear / enzyme / Tn5</text><text x="254" y="112" font-size="12" text-anchor="middle" fill="#8a8f94">blunt, 5'-P, A-tail</text><text x="254" y="128" font-size="12" text-anchor="middle" fill="#8a8f94">or none (Tn5)</text><text x="412" y="112" font-size="12" text-anchor="middle" fill="#8a8f94">ligate adapter</text><text x="412" y="128" font-size="12" text-anchor="middle" fill="#8a8f94">or transpose it in</text><text x="570" y="112" font-size="12" text-anchor="middle" fill="#8a8f94">PCR cycles: 0 to 15</text><text x="570" y="128" font-size="12" text-anchor="middle" fill="#8a8f94">or whole-genome amp.</text><text x="728" y="112" font-size="12" text-anchor="middle" fill="#8a8f94">size, yield, dup. rate</text><text x="728" y="128" font-size="12" text-anchor="middle" fill="#8a8f94">GC curve, coverage</text>
</svg>
