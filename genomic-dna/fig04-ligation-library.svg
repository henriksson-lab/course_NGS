<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 743 226" width="743" height="226" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="640" height="226" fill="none"/>
<text x="20" y="24" font-size="14">Ligation library: repair, A-tail, then ligate a forked adapter.</text><line x1="220" y1="92" x2="440" y2="92" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="220" y1="106" x2="440" y2="106" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="444" y="97" font-size="15" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">A</text><text x="216" y="112" font-size="15" text-anchor="end" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">A</text><text x="330" y="130" font-size="12.5" text-anchor="middle" fill="#8a8f94">insert, ends repaired, one A on each 3' end</text><line x1="196" y1="92" x2="174" y2="92" stroke="#c98a2b" stroke-width="3" stroke-linecap="round"/><line x1="196" y1="106" x2="174" y2="106" stroke="#c98a2b" stroke-width="3" stroke-linecap="round"/><line x1="174" y1="92" x2="146" y2="66" stroke="#c98a2b" stroke-width="3" stroke-linecap="round"/><line x1="174" y1="106" x2="146" y2="132" stroke="#c98a2b" stroke-width="3" stroke-linecap="round"/><line x1="468" y1="92" x2="490" y2="92" stroke="#c98a2b" stroke-width="3" stroke-linecap="round"/><line x1="468" y1="106" x2="490" y2="106" stroke="#c98a2b" stroke-width="3" stroke-linecap="round"/><line x1="490" y1="92" x2="518" y2="66" stroke="#c98a2b" stroke-width="3" stroke-linecap="round"/><line x1="490" y1="106" x2="518" y2="132" stroke="#c98a2b" stroke-width="3" stroke-linecap="round"/><text x="196" y="100" font-size="15" text-anchor="end" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">T</text><text x="468" y="114" font-size="15" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">T</text><text x="100" y="62" font-size="12.5" text-anchor="middle" fill="#c98a2b">forked adapter</text><text x="100" y="160" font-size="12.5" text-anchor="middle" fill="#8a8f94">arms stay unpaired: the fork</text><text x="20" y="190" font-size="13.5" fill="#23282d">A/T overhangs stop insert-insert and adapter-adapter joining. Each fragment gets an adapter at both ends.</text><text x="20" y="210" font-size="13.5" fill="#23282d">A full-length adapter (P5/P7 and index already present) makes PCR unnecessary.</text>
</svg>
