<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 256" width="730" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="730" height="256" fill="none"/>
<text x="20" y="24" font-size="14">From sample to library: a decision sketch.</text><rect x="20" y="44" width="210" height="36" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="125.0" y="66.375" font-size="12.5" text-anchor="middle" fill="#23282d">100 ng or more, intact</text><line x1="236" y1="62" x2="271" y2="62" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><path d="M 276 62 L 271 58.5 L 271 65.5 Z" fill="#2e6b3f"/><rect x="282" y="44" width="430" height="36" rx="4" fill="#eef2f6" stroke="#2e6b3f" stroke-width="1.2"/><text x="497.0" y="66.375" font-size="12.5" text-anchor="middle" fill="#23282d">fragment, ligate full-length adapters, no PCR</text><rect x="20" y="96" width="210" height="36" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="125.0" y="118.375" font-size="12.5" text-anchor="middle" fill="#23282d">1 to 100 ng, intact</text><line x1="236" y1="114" x2="271" y2="114" stroke="#c98a2b" stroke-width="1.6" stroke-linecap="round"/><path d="M 276 114 L 271 110.5 L 271 117.5 Z" fill="#c98a2b"/><rect x="282" y="96" width="430" height="36" rx="4" fill="#eef2f6" stroke="#c98a2b" stroke-width="1.2"/><text x="497.0" y="118.375" font-size="12.5" text-anchor="middle" fill="#23282d">tagmentation or ligation, few PCR cycles</text><rect x="20" y="148" width="210" height="36" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="125.0" y="170.375" font-size="12.5" text-anchor="middle" fill="#23282d">short, nicked, damaged</text><line x1="236" y1="166" x2="271" y2="166" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 276 166 L 271 162.5 L 271 169.5 Z" fill="#b4532a"/><rect x="282" y="148" width="430" height="36" rx="4" fill="#eef2f6" stroke="#b4532a" stroke-width="1.2"/><text x="497.0" y="170.375" font-size="12.5" text-anchor="middle" fill="#23282d">single-stranded library; consider partial UDG</text><rect x="20" y="200" width="210" height="36" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="125.0" y="222.375" font-size="12.5" text-anchor="middle" fill="#23282d">one cell, or picograms</text><line x1="236" y1="218" x2="271" y2="218" stroke="#a33a28" stroke-width="1.6" stroke-linecap="round"/><path d="M 276 218 L 271 214.5 L 271 221.5 Z" fill="#a33a28"/><rect x="282" y="200" width="430" height="36" rx="4" fill="#eef2f6" stroke="#a33a28" stroke-width="1.2"/><text x="497.0" y="222.375" font-size="12.5" text-anchor="middle" fill="#23282d">whole-genome amplification first (MDA, MALBAC, PTA)</text>
</svg>
