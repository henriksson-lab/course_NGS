<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 208" width="830" height="208" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="830" height="208" fill="none"/>
<text x="20" y="24" font-size="14">MALBAC: copies close into loops and stop being templates.</text><text x="30" y="56" font-size="12.5" fill="#8a8f94">random primer</text><rect x="30" y="64" width="92" height="12" rx="2" fill="#c98a2b" stroke="none"/><rect x="122" y="64" width="56" height="12" rx="2" fill="#b4532a" stroke="none"/><text x="76" y="94" font-size="11.5" text-anchor="middle" fill="#c98a2b">27 nt common tag</text><text x="150" y="110" font-size="11.5" text-anchor="middle" fill="#b4532a">8 random nt</text><line x1="210" y1="70" x2="270" y2="70" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="240" y="56" font-size="12" text-anchor="middle" fill="#8a8f94">genomic template</text><line x1="290" y1="70" x2="315" y2="70" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 320 70 L 315 66.5 L 315 73.5 Z" fill="#8a8f94"/><text x="330" y="56" font-size="12.5" fill="#8a8f94">full amplicon: tag at both ends</text><rect x="330" y="64" width="40" height="12" rx="2" fill="#c98a2b" stroke="none"/><line x1="370" y1="70" x2="520" y2="70" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="520" y="64" width="40" height="12" rx="2" fill="none" stroke="#c98a2b"/><line x1="580" y1="70" x2="605" y2="70" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 610 70 L 605 66.5 L 605 73.5 Z" fill="#8a8f94"/><path d="M 630 70 L 650 70 C 680 70 690 30 720 30 C 750 30 760 70 790 70 L 810 70" stroke="#1f3b57" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="630" y="64" width="20" height="12" rx="2" fill="#c98a2b" stroke="none"/><rect x="790" y="64" width="20" height="12" rx="2" fill="none" stroke="#c98a2b"/><text x="720" y="20" font-size="12.5" text-anchor="middle" fill="#b4532a">loop: the two ends anneal</text><text x="30" y="150" font-size="13.5" fill="#23282d">Only five cycles, so yield grows roughly linearly with cycle number, not doubling each time.</text><text x="30" y="170" font-size="13.5" fill="#23282d">Looped products cannot be copied again, which limits the bias that exponential amplification builds up.</text><text x="30" y="190" font-size="13.5" fill="#23282d">Then ordinary PCR on the common tag makes the library.</text>
</svg>
