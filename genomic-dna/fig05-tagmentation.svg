<text x="20" y="24" font-size="14">Tagmentation: a loaded Tn5 dimer cuts and joins adapters to the 5' ends.</text><line x1="30" y1="70" x2="340" y2="70" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="84" x2="340" y2="84" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="150" y="48" width="70" height="58" rx="8" fill="#f7e7dd" stroke="#b4532a"/><text x="185" y="80" font-size="14" text-anchor="middle" fill="#b4532a" font-weight="bold">Tn5</text><text x="185" y="136" font-size="12" text-anchor="middle" fill="#8a8f94">dimer, adapters loaded</text><line x1="160" y1="40" x2="160" y2="48" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><line x1="210" y1="106" x2="210" y2="114" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><text x="154" y="46" font-size="11.5" text-anchor="end" fill="#b4532a">cut</text><text x="216" y="114" font-size="11.5" fill="#b4532a">cut</text><line x1="360" y1="78" x2="395" y2="78" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 400 78 L 395 74.5 L 395 81.5 Z" fill="#8a8f94"/><line x1="420" y1="62" x2="640" y2="62" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="432" y1="96" x2="652" y2="96" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="404" y="57" width="16" height="10" rx="2" fill="#c98a2b" stroke="none"/><rect x="652" y="91" width="16" height="10" rx="2" fill="#c98a2b" stroke="none"/><line x1="420" y1="96" x2="432" y2="96" stroke="#a33a28" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="640" y1="62" x2="652" y2="62" stroke="#a33a28" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3"/><text x="412" y="52" font-size="11.5" fill="#c98a2b">adapter</text><text x="536" y="124" font-size="12" text-anchor="middle" fill="#a33a28">9 nt gap on each side</text><text x="536" y="140" font-size="12" text-anchor="middle" fill="#8a8f94">filled by polymerase at 72 °C</text><text x="20" y="18