<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 232" width="780" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="232" fill="none"/>
<text x="20" y="24" font-size="14">Three ways to cut genomic DNA to size, and what each leaves on the ends.</text><text x="20" y="56" font-size="13" fill="#23282d" font-weight="bold">Acoustic shearing (Covaris)</text><line x1="40" y1="78" x2="107" y2="78" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="107" y1="78" x2="102" y2="73" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><line x1="113" y1="78" x2="187" y2="78" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="113" y1="78" x2="118" y2="83" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><line x1="187" y1="78" x2="182" y2="73" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><line x1="193" y1="78" x2="227" y2="78" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="193" y1="78" x2="198" y2="83" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><line x1="227" y1="78" x2="222" y2="73" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><line x1="233" y1="78" x2="327" y2="78" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="233" y1="78" x2="238" y2="83" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><line x1="327" y1="78" x2="322" y2="73" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><line x1="333" y1="78" x2="380" y2="78" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="333" y1="78" x2="338" y2="83" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><text x="400" y="82" font-size="12.5" fill="#23282d">random breaks, ragged ends: needs end repair + A-tailing</text><text x="20" y="118" font-size="13" fill="#23282d" font-weight="bold">Enzymatic (e.g. NEBNext FS)</text><line x1="40" y1="140" x2="107" y2="140" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="113" y1="140" x2="187" y2="140" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="193" y1="140" x2="227" y2="140" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="233" y1="140" x2="327" y2="140" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="333" y1="140" x2="380" y2="140" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="400" y="144" font-size="12.5" fill="#23282d">ends repaired and A-tailed in the same tube</text><text x="20" y="180" font-size="13" fill="#23282d" font-weight="bold">Tn5 tagmentation</text><line x1="40" y1="202" x2="107" y2="202" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="107" y="197" width="5" height="10" rx="2" fill="#c98a2b" stroke="none"/><line x1="113" y1="202" x2="187" y2="202" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="108" y="197" width="5" height="10" rx="2" fill="#c98a2b" stroke="none"/><rect x="187" y="197" width="5" height="10" rx="2" fill="#c98a2b" stroke="none"/><line x1="193" y1="202" x2="227" y2="202" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="188" y="197" width="5" height="10" rx="2" fill="#c98a2b" stroke="none"/><rect x="227" y="197" width="5" height="10" rx="2" fill="#c98a2b" stroke="none"/><line x1="233" y1="202" x2="327" y2="202" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="228" y="197" width="5" height="10" rx="2" fill="#c98a2b" stroke="none"/><rect x="327" y="197" width="5" height="10" rx="2" fill="#c98a2b" stroke="none"/><line x1="333" y1="202" x2="380" y2="202" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="328" y="197" width="5" height="10" rx="2" fill="#c98a2b" stroke="none"/><text x="400" y="206" font-size="12.5" fill="#c98a2b">cut and adapter attached in one step</text>
</svg>
