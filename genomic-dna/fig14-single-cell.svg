<text x="20" y="24" font-size="14">One cell, two copies of every locus: three ways amplification misleads.</text><text x="30" y="52" font-size="13.5" fill="#2e6b3f" font-weight="bold">Both alleles copied</text><text x="30" y="70" font-size="11.5" fill="#8a8f94">cell</text><line x1="64" y1="66" x2="124" y2="66" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="64" y1="82" x2="124" y2="82" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><line x1="130" y1="74" x2="151" y2="74" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 156 74 L 151 70.5 L 151 77.5 Z" fill="#8a8f94"/><text x="30" y="112" font-size="11.5" fill="#8a8f94">reads</text><rect x="64" y="100" width="6" height="6" rx="2" fill="#1f3b57" stroke="none"/><rect x="73" y="100" width="6" height="6" rx="2" fill="#1f3b57" stroke="none"/><rect x="82" y="100" width="6" height="6" rx="2" fill="#1f3b57" stroke="none"/><rect x="91" y="100" width="6" height="6" rx="2" fill="#1f3b57" stroke="none"/><rect x="100" y="100" width="6" height="6" rx="2" fill="#1f3b57" stroke="none"/><rect x="109" y="100" width="6" height="6" rx="2" fill="#1f3b57" stroke="none"/><rect x="64" y="112" width="6" height="6" rx="2" fill="#4a6b8a" stroke="none"/><rect x="73" y="112" width="6" height="6" rx="2" fill="#4a6b8a" stroke="none"/><rect x="82" y="112" width="6" height="6" rx="2" fill="#4a6b8a" stroke="none"/><rect x="91" y="112" width="6" height="6" rx="2" fill="#4a6b8a" stroke="none"/><rect x="100" y="112" width="6" height="6" rx="2" fill="#4a6b8a" stroke="none"/><rect x="109" y="112" width="6" height="6" rx="2" fill="#4a6b8a" stroke="none"/><text x="30" y="150" font-size="12.5" fill="#2e6b3f">heterozygous call</text><text x="280" y="52" font-size="13.5" fill="#a33a28" font-weight="bold">One allele not copied</text><text x="280" y="70" font-size="11.5" fill="#8a8f94">cell</text><line x1="314" y1="66" x2="374" y2="66" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="314" y1=