<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 244" width="760" height="244" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="244" fill="none"/>
<text x="20" y="24" font-size="14">Reads piled on a reference: which stacks are real?</text><line x1="40" y1="190" x2="700" y2="190" stroke="#23282d" stroke-width="2" stroke-linecap="round"/><text x="24" y="194" font-size="11.5" text-anchor="end" fill="#8a8f94">ref</text><line x1="70" y1="170" x2="160" y2="170" stroke="#a33a28" stroke-width="5" stroke-linecap="round"/><line x1="70" y1="156" x2="160" y2="156" stroke="#a33a28" stroke-width="5" stroke-linecap="round"/><line x1="70" y1="142" x2="160" y2="142" stroke="#a33a28" stroke-width="5" stroke-linecap="round"/><line x1="70" y1="128" x2="160" y2="128" stroke="#a33a28" stroke-width="5" stroke-linecap="round"/><text x="70" y="90" font-size="13.5" fill="#a33a28" font-weight="bold">PCR duplicates</text><text x="70" y="108" font-size="12" fill="#8a8f94">one molecule, several copies;</text><text x="70" y="122" font-size="12" fill="#8a8f94">identical start and end</text><line x1="270" y1="170" x2="360" y2="170" stroke="#b4532a" stroke-width="5" stroke-linecap="round"/><line x1="270" y1="156" x2="360" y2="156" stroke="#b4532a" stroke-width="5" stroke-linecap="round"/><text x="270" y="90" font-size="13.5" fill="#b4532a" font-weight="bold">chance coincidence</text><text x="270" y="108" font-size="12" fill="#8a8f94">two molecules cut at</text><text x="270" y="122" font-size="12" fill="#8a8f94">the same place</text><line x1="470" y1="170" x2="560" y2="170" stroke="#2e6b3f" stroke-width="5" stroke-linecap="round"/><line x1="500" y1="156" x2="600" y2="156" stroke="#2e6b3f" stroke-width="5" stroke-linecap="round"/><line x1="530" y1="142" x2="590" y2="142" stroke="#2e6b3f" stroke-width="5" stroke-linecap="round"/><text x="470" y="90" font-size="13.5" fill="#2e6b3f" font-weight="bold">distinct molecules</text><text x="470" y="108" font-size="12" fill="#8a8f94">different start and end:</text><text x="470" y="122" font-size="12" fill="#8a8f94">independent evidence</text><text x="20" y="226" font-size="13.5" fill="#23282d">Marking duplicates by coordinates cannot tell the first two apart. A random UMI can.</text>
</svg>
