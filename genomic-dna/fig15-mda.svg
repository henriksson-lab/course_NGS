<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 208" width="780" height="208" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="208" fill="none"/>
<text x="20" y="24" font-size="14">MDA: phi29 displaces the strand ahead of it, and the displaced copy is primed again.</text><line x1="40" y1="130" x2="380" y2="130" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="90" y1="124" x2="126" y2="124" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round"/><circle cx="90" cy="124" r="3.5" fill="#b4532a"/><line x1="180" y1="124" x2="216" y2="124" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round"/><circle cx="180" cy="124" r="3.5" fill="#b4532a"/><line x1="270" y1="124" x2="306" y2="124" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round"/><circle cx="270" cy="124" r="3.5" fill="#b4532a"/><path d="M 126 124 C 150 100 170 88 200 82" stroke="#b4532a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 216 124 C 240 100 260 88 290 82" stroke="#b4532a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 200 82 C 215 70 230 64 255 60" stroke="#4a6b8a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 200 82 C 215 92 228 96 252 98" stroke="#4a6b8a" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="396" y="112" font-size="12.5" fill="#8a8f94">random primers anneal everywhere</text><text x="396" y="130" font-size="12.5" fill="#8a8f94">isothermal, about 30 °C</text><text x="396" y="148" font-size="12.5" fill="#8a8f94">products up to tens of kb, hyperbranched</text><text x="40" y="190" font-size="13.5" fill="#23282d">Long, high-fidelity copies; but coverage is uneven and chimeras form where branches re-prime on each other.</text>
</svg>
