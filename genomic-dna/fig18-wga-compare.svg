<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="220" fill="none"/>
<text x="20" y="24" font-size="14">Single-cell whole-genome amplification: what each method trades.</text><text x="26" y="52" font-size="13.5" fill="#23282d" font-weight="bold"></text><text x="116" y="52" font-size="13.5" fill="#23282d" font-weight="bold">MDA (phi29)</text><text x="326" y="52" font-size="13.5" fill="#23282d" font-weight="bold">MALBAC</text><text x="576" y="52" font-size="13.5" fill="#23282d" font-weight="bold">PTA</text><line x1="20" y1="60" x2="790" y2="60" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="26" y="86" font-size="12.5" fill="#8a8f94">mode</text><text x="116" y="86" font-size="12.5" fill="#23282d">isothermal, exponential</text><text x="326" y="86" font-size="12.5" fill="#23282d">5 quasi-linear cycles, then PCR</text><text x="576" y="86" font-size="12.5" fill="#23282d">limited, terminated copies</text><text x="26" y="120" font-size="12.5" fill="#8a8f94">strength</text><text x="116" y="120" font-size="12.5" fill="#23282d">long, accurate copies</text><text x="326" y="120" font-size="12.5" fill="#23282d">more even depth: copy number</text><text x="576" y="120" font-size="12.5" fill="#23282d">even depth: SNV calls</text><text x="26" y="154" font-size="12.5" fill="#8a8f94">weakness</text><text x="116" y="154" font-size="12.5" fill="#23282d">uneven, chimeras</text><text x="326" y="154" font-size="12.5" fill="#23282d">polymerase errors</text><text x="576" y="154" font-size="12.5" fill="#23282d">newer, fewer benchmarks</text><text x="20" y="202" font-size="13" fill="#23282d">Claims about error rates are from the papers' own benchmarks: compare like with like before choosing.</text>
</svg>
