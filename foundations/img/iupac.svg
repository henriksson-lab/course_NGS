<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="560" height="262" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="560" height="262" fill="none"/>
<text x="50" y="34" font-size="13" fill="#8a8f94">code</text><text x="110" y="34" font-size="13" fill="#8a8f94">means</text><text x="230" y="34" font-size="13" fill="#8a8f94">used for</text><text x="50" y="60" font-size="15" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">N</text><text x="110" y="60" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A C G T</text><text x="230" y="60" font-size="13" fill="#8a8f94">anything — UMIs, random primers</text><text x="50" y="84" font-size="15" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">V</text><text x="110" y="84" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A C G</text><text x="230" y="84" font-size="13" fill="#8a8f94">'not T' — blocks the poly(A) tail</text><text x="50" y="108" font-size="15" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">B</text><text x="110" y="108" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C G T</text><text x="230" y="108" font-size="13" fill="#8a8f94">'not A'</text><text x="50" y="132" font-size="15" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">W</text><text x="110" y="132" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A T</text><text x="230" y="132" font-size="13" fill="#8a8f94">weak (2 H-bonds)</text><text x="50" y="156" font-size="15" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">S</text><text x="110" y="156" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C G</text><text x="230" y="156" font-size="13" fill="#8a8f94">strong (3 H-bonds)</text><text x="50" y="180" font-size="15" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">R</text><text x="110" y="180" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A G</text><text x="230" y="180" font-size="13" fill="#8a8f94">purines</text><text x="50" y="204" font-size="15" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">Y</text><text x="110" y="204" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C T</text><text x="230" y="204" font-size="13" fill="#8a8f94">pyrimidines</text><text x="50" y="244" font-size="14" fill="#23282d">Degenerate positions are ordered as a mixture: one tube, many sequences.</text>
</svg>
