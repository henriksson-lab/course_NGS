<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 230" width="818" height="230" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="230" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Accuracy comes from reading the same molecule many times.</text><circle cx="110" cy="108" r="44" fill="none" stroke="#1f3b57" stroke-width="2.6"/><text x="110" y="113" font-size="11.5" text-anchor="middle" fill="#8a8f94">one insert</text><line x1="164" y1="108" x2="195" y2="108" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 200 108 L 195 104.5 L 195 111.5 Z" fill="#b4532a"/><line x1="230" y1="70" x2="420" y2="70" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><circle cx="258" cy="70" r="3.2" fill="#a33a28"/><circle cx="349" cy="70" r="3.2" fill="#a33a28"/><line x1="230" y1="94" x2="420" y2="94" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><circle cx="295" cy="94" r="3.2" fill="#a33a28"/><circle cx="386" cy="94" r="3.2" fill="#a33a28"/><line x1="230" y1="118" x2="420" y2="118" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><circle cx="332" cy="118" r="3.2" fill="#a33a28"/><circle cx="273" cy="118" r="3.2" fill="#a33a28"/><line x1="230" y1="142" x2="420" y2="142" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><circle cx="369" cy="142" r="3.2" fill="#a33a28"/><circle cx="310" cy="142" r="3.2" fill="#a33a28"/><text x="230" y="56" font-size="12" fill="#8a8f94">passes, each with random errors</text><line x1="436" y1="106" x2="465" y2="106" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 470 106 L 465 102.5 L 465 109.5 Z" fill="#8a8f94"/><line x1="486" y1="106" x2="676" y2="106" stroke="#2e6b3f" stroke-width="3" stroke-linecap="round"/><text x="486" y="88" font-size="12" fill="#2e6b3f">consensus: the errors do not agree, the sequence does</text><text x="40" y="186" font-size="14" fill="#23282d">A short insert gets many passes and very high accuracy; a long insert gets few passes and less.</text><text x="40" y="210" font-size="13.5" fill="#b4532a">So on PacBio, insert length and accuracy are the same decision — and size selection is how you make it.</text>
</svg>
