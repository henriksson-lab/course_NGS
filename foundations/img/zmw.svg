<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="740" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="240" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">One polymerase, watched in real time.</text><rect x="60" y="56" width="150" height="96" fill="#eceff1" stroke="#8a8f94"/><rect x="96" y="56" width="78" height="96" fill="#ffffff" stroke="#8a8f94"/><text x="135" y="48" font-size="11.5" text-anchor="middle" fill="#8a8f94">zero-mode waveguide</text><circle cx="135" cy="140" r="9" fill="#1f3b57"/><text x="135" y="168" font-size="11.5" text-anchor="middle" fill="#8a8f94">polymerase fixed at the bottom</text><text x="135" y="184" font-size="11.5" text-anchor="middle" fill="#8a8f94">only this tiny volume is lit</text><line x1="260" y1="140" x2="620" y2="140" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><polyline points="286,140 287,140 288,139 289,136 290,131 291,123 292,112 293,102 294,98 295,102 296,112 297,123 298,131 299,136 300,139 301,140 302,140" fill="none" stroke="#2e6b3f" stroke-width="2.2"/><polyline points="344,140 345,140 346,139 347,136 348,131 349,123 350,112 351,102 352,98 353,102 354,112 355,123 356,131 357,136 358,139 359,140 360,140" fill="none" stroke="#b4532a" stroke-width="2.2"/><polyline points="402,140 403,140 404,139 405,136 406,131 407,123 408,112 409,102 410,98 411,102 412,112 413,123 414,131 415,136 416,139 417,140 418,140" fill="none" stroke="#1f3b57" stroke-width="2.2"/><polyline points="460,140 461,140 462,139 463,136 464,131 465,123 466,112 467,102 468,98 469,102 470,112 471,123 472,131 473,136 474,139 475,140 476,140" fill="none" stroke="#4a6b8a" stroke-width="2.2"/><polyline points="518,140 521,140 524,139 526,136 529,131 532,123 534,112 537,102 540,98 543,102 546,112 548,123 551,131 554,136 556,139 559,140 562,140" fill="none" stroke="#2e6b3f" stroke-width="2.2"/><polyline points="590,140 591,140 592,139 593,136 594,131 595,123 596,112 597,102 598,98 599,102 600,112 601,123 602,131 603,136 604,139 605,140 606,140" fill="none" stroke="#b4532a" stroke-width="2.2"/><text x="260" y="60" font-size="12" fill="#23282d">each base gives a flash of its own colour</text><text x="510" y="96" font-size="11.5" fill="#b4532a">a long gap</text><text x="510" y="112" font-size="11.5" fill="#b4532a">before this one</text><text x="40" y="196" font-size="14" fill="#23282d">The timing between flashes is data too: a modified base on the template slows the polymerase down.</text><text x="40" y="220" font-size="13.5" fill="#2e6b3f">That is how PacBio calls 5mC and 6mA without any conversion chemistry at all.</text>
</svg>
