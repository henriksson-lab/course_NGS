<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 871 226" width="871" height="226" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="226" fill="none"/>
<text x="40" y="28" font-size="14" fill="#23282d">One cycle = one base, on every cluster at once.</text><rect x="42" y="56" width="132" height="96" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="108" y="80" font-size="14.5" text-anchor="middle" fill="#b4532a" font-weight="bold">add</text><text x="108" y="102" font-size="11.5" text-anchor="middle" fill="#8a8f94">all four bases,</text><text x="108" y="118" font-size="11.5" text-anchor="middle" fill="#8a8f94">each dye-labelled and</text><text x="108" y="134" font-size="11.5" text-anchor="middle" fill="#8a8f94">3'-blocked</text><line x1="178" y1="104" x2="193" y2="104" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 198 104 L 193 100.5 L 193 107.5 Z" fill="#8a8f94"/><rect x="202" y="56" width="132" height="96" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="268" y="80" font-size="14.5" text-anchor="middle" fill="#b4532a" font-weight="bold">image</text><text x="268" y="102" font-size="11.5" text-anchor="middle" fill="#8a8f94">one colour per cluster</text><text x="268" y="118" font-size="11.5" text-anchor="middle" fill="#8a8f94">tells you the base</text><line x1="338" y1="104" x2="353" y2="104" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 358 104 L 353 100.5 L 353 107.5 Z" fill="#8a8f94"/><rect x="362" y="56" width="132" height="96" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="428" y="80" font-size="14.5" text-anchor="middle" fill="#b4532a" font-weight="bold">cleave</text><text x="428" y="102" font-size="11.5" text-anchor="middle" fill="#8a8f94">remove the dye and</text><text x="428" y="118" font-size="11.5" text-anchor="middle" fill="#8a8f94">the 3' block</text><line x1="498" y1="104" x2="513" y2="104" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 518 104 L 513 100.5 L 513 107.5 Z" fill="#8a8f94"/><rect x="522" y="56" width="132" height="96" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="588" y="80" font-size="14.5" text-anchor="middle" fill="#b4532a" font-weight="bold">repeat</text><text x="588" y="102" font-size="11.5" text-anchor="middle" fill="#8a8f94">next cycle adds</text><text x="588" y="118" font-size="11.5" text-anchor="middle" fill="#8a8f94">exactly one more base</text><text x="40" y="182" font-size="14" fill="#23282d">The 3' block is what makes it stepwise: without it a polymerase would run to the end and you would see nothing.</text><text x="40" y="206" font-size="13.5" fill="#8a8f94">Read length is limited by how well the block and dye are removed — errors accumulate, so quality falls with cycle number.</text>
</svg>
