<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 775 234" width="775" height="234" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="680" height="234" fill="none"/>
<text x="40" y="28" font-size="14" fill="#23282d">The flow cell is a lawn of two oligos.</text><rect x="40" y="150" width="600" height="14" fill="#dfe3e6"/><line x1="52" y1="150" x2="52" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="77" y1="150" x2="77" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="102" y1="150" x2="102" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="127" y1="150" x2="127" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="152" y1="150" x2="152" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="177" y1="150" x2="177" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="202" y1="150" x2="202" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="227" y1="150" x2="227" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="252" y1="150" x2="252" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="277" y1="150" x2="277" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="302" y1="150" x2="302" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="327" y1="150" x2="327" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="352" y1="150" x2="352" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="377" y1="150" x2="377" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="402" y1="150" x2="402" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="427" y1="150" x2="427" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="452" y1="150" x2="452" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="477" y1="150" x2="477" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="502" y1="150" x2="502" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="527" y1="150" x2="527" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="552" y1="150" x2="552" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="577" y1="150" x2="577" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="602" y1="150" x2="602" y2="124" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="627" y1="150" x2="627" y2="124" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><text x="52" y="182" font-size="12.5" fill="#1f3b57">P5</text><text x="77" y="182" font-size="12.5" fill="#a33a28">P7</text><text x="120" y="182" font-size="12.5" fill="#8a8f94">grafted by their 5' ends, so the 3' ends are free to be extended</text><line x1="220" y1="62" x2="420" y2="62" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="176" y="52" width="46" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="199.0" y="66.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5'</text><rect x="418" y="52" width="46" height="20" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="441.0" y="66.2" font-size="12" text-anchor="middle" fill="#a33a28">P7'</text><text x="320" y="44" font-size="12.5" text-anchor="middle" fill="#8a8f94">insert</text><line x1="200" y1="96" x2="205" y2="96" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><path d="M 200 96 L 205 92.5 L 205 99.5 Z" fill="#1f3b57"/><path d="M 199 80 L 199 112" stroke="#1f3b57" stroke-width="1.4" stroke-dasharray="4 3"/><text x="214" y="104" font-size="12.5" fill="#1f3b57">anneals to a P5 lawn oligo</text><text x="40" y="214" font-size="14" fill="#b4532a">A molecule with the same end at both ends, or with only one, cannot bridge — and never forms a cluster.</text>
</svg>
