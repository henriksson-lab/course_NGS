<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 290" width="824" height="290" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="290" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Each platform fails in its own way.</text><text x="56" y="62" font-size="13" fill="#1f3b57" font-weight="bold">Illumina / MGI / AVITI</text><text x="56" y="80" font-size="11.5" fill="#8a8f94">substitutions, rising with cycle number</text><rect x="330" y="51" width="200" height="12" fill="#eceff1"/><rect x="330" y="51" width="180" height="12" fill="#1f3b57" opacity="0.8"/><text x="56" y="106" font-size="13" fill="#8a8f94" font-weight="bold">Ultima</text><text x="56" y="124" font-size="11.5" fill="#8a8f94">homopolymer length: AAAAA read as AAAA</text><rect x="330" y="95" width="200" height="12" fill="#eceff1"/><rect x="330" y="95" width="100" height="12" fill="#8a8f94" opacity="0.8"/><text x="56" y="150" font-size="13" fill="#2e6b3f" font-weight="bold">PacBio HiFi</text><text x="56" y="168" font-size="11.5" fill="#8a8f94">few, random, mostly indels — and consensus removes them</text><rect x="330" y="139" width="200" height="12" fill="#eceff1"/><rect x="330" y="139" width="190" height="12" fill="#2e6b3f" opacity="0.8"/><text x="56" y="194" font-size="13" fill="#b4532a" font-weight="bold">Nanopore</text><text x="56" y="212" font-size="11.5" fill="#8a8f94">indels, worst in homopolymers; improving each chemistry</text><rect x="330" y="183" width="200" height="12" fill="#eceff1"/><rect x="330" y="183" width="120" height="12" fill="#b4532a" opacity="0.8"/><text x="330" y="44" font-size="11.5" fill="#8a8f94">accuracy of a single raw read</text><text x="40" y="246" font-size="14" fill="#23282d">This decides whether you need UMIs or consensus reads, and whether a variant call can be trusted.</text><text x="40" y="270" font-size="13.5" fill="#8a8f94">A library cannot fix a platform's error mode — but it can give you a second copy of the molecule to check against.</text>
</svg>
