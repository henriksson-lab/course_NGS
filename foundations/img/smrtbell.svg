ne x1="245.5" y1="74" x2="245.5" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="259.0" y1="74" x2="259.0" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><path d="M 120 70 C 76 70, 76 100, 120 100" fill="none" stroke="#b4532a" stroke-width="2.6"/><path d="M 268.5 70 C 312.5 70, 312.5 100, 268.5 100" fill="none" stroke="#b4532a" stroke-width="2.6"/><text x="76" y="126" font-size="12" text-anchor="middle" fill="#b4532a">hairpin</text><text x="312.5" y="126" font-size="12" text-anchor="middle" fill="#b4532a">hairpin</text><text x="194.25" y="142" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><text x="40" y="176" font-size="14" fill="#23282d">Both strands and both adapters are now one covalently closed single-stranded circle.</text><text x="40" y="200" font-size="13.5" fill="#8a8f94">The polymerase can go round it as many times as the insert is short enough to allow.</text><text x="40" y="230" font-size="13.5" fill="#b4532a">A nick anywhere in the insert ends the read: input DNA quality matters more here than for short reads.</text>
