<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 825 230" width="825" height="230" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="230" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Calling cards: the protein leaves a permanent record.</text><line x1="30" y1="82" x2="690" y2="82" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><rect x="297" y="59" width="16" height="16" rx="3" fill="#b4532a"/><rect x="277" y="30" width="56" height="18" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="305.0" y="43.025" font-size="11.5" text-anchor="middle" fill="#a33a28">PB</text><text x="345" y="42" font-size="12" fill="#a33a28">transposase fused to the TF</text><path d="M 230 78 l 0 -14 l 8 0 l 0 14" fill="none" stroke="#b4532a" stroke-width="2.4"/><path d="M 266 78 l 0 -14 l 8 0 l 0 14" fill="none" stroke="#b4532a" stroke-width="2.4"/><path d="M 340 78 l 0 -14 l 8 0 l 0 14" fill="none" stroke="#b4532a" stroke-width="2.4"/><path d="M 380 78 l 0 -14 l 8 0 l 0 14" fill="none" stroke="#b4532a" stroke-width="2.4"/><text x="305" y="112" font-size="12" text-anchor="middle" fill="#b4532a">new insertions cluster near the TF's sites</text><text x="30" y="140" font-size="12.5" fill="#23282d">1  express the TF-transposase fusion; the transposon (the 'card') inserts nearby</text><text x="30" y="160" font-size="12.5" fill="#23282d">2  cells can be kept, sorted or differentiated; the insertions are in the genome for good</text><text x="30" y="180" font-size="12.5" fill="#23282d">3  later, recover the junction between transposon and genome by PCR and sequence it</text><text x="30" y="214" font-size="12.5" fill="#b4532a">A read is a transposon insertion point. Unlike a ChIP snapshot, it integrates binding over the time the fusion was expressed.</text>
</svg>
