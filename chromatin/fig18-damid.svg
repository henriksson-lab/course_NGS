<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 825 264" width="825" height="264" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="264" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">DamID: the protein writes a mark; you read the mark.</text><line x1="30" y1="90" x2="690" y2="90" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="70" y1="80" x2="70" y2="100" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round"/><line x1="130" y1="80" x2="130" y2="100" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round"/><line x1="190" y1="80" x2="190" y2="100" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round"/><line x1="250" y1="80" x2="250" y2="100" stroke="#b4532a" stroke-width="2.4" stroke-linecap="round"/><circle cx="250" cy="72" r="3.8" fill="#b4532a"/><line x1="310" y1="80" x2="310" y2="100" stroke="#b4532a" stroke-width="2.4" stroke-linecap="round"/><circle cx="310" cy="72" r="3.8" fill="#b4532a"/><line x1="370" y1="80" x2="370" y2="100" stroke="#b4532a" stroke-width="2.4" stroke-linecap="round"/><circle cx="370" cy="72" r="3.8" fill="#b4532a"/><line x1="430" y1="80" x2="430" y2="100" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round"/><line x1="490" y1="80" x2="490" y2="100" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round"/><line x1="550" y1="80" x2="550" y2="100" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round"/><line x1="610" y1="80" x2="610" y2="100" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round"/><line x1="660" y1="80" x2="660" y2="100" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round"/><rect x="301" y="104" width="18" height="18" rx="3" fill="#b4532a"/><rect x="290" y="130" width="40" height="16" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="310.0" y="142.025" font-size="11.5" text-anchor="middle" fill="#a33a28">Dam</text><text x="30" y="48" font-size="12" fill="#8a8f94">GATC sites (ticks); methylated adenine near the fusion protein (dots)</text><text x="30" y="176" font-size="12.5" fill="#23282d">1  Express Dam fused to the protein of interest, at low dose</text><text x="30" y="196" font-size="12.5" fill="#23282d">2  DpnI cuts GATC only when methylated; ligate an adapter to those ends</text><text x="30" y="216" font-size="12.5" fill="#23282d">3  cut with DpnII (unmethylated GATC only), then PCR from the adapter</text><text x="30" y="250" font-size="12.5" fill="#b4532a">No antibody and no crosslinking. A Dam-only control corrects for where Dam goes by itself; resolution is set by GATC spacing.</text>
</svg>
