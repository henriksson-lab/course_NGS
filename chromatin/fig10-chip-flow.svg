<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" width="720" height="266" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="266" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">ChIP-seq: fix, break up, pull down, release.</text><rect x="30" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="89.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1  crosslink</text><text x="89.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">formaldehyde</text><text x="89.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">freezes contacts</text><line x1="150" y1="75" x2="159" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 164 75 L 159 71.5 L 159 78.5 Z" fill="#8a8f94"/><rect x="166" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2  fragment</text><text x="225.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">sonicate to</text><text x="225.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">200-700 bp</text><line x1="286" y1="75" x2="295" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 300 75 L 295 71.5 L 295 78.5 Z" fill="#8a8f94"/><rect x="302" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="361.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3  pull down</text><text x="361.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">antibody + beads</text><text x="361.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">catch one protein</text><line x1="422" y1="75" x2="431" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 436 75 L 431 71.5 L 431 78.5 Z" fill="#8a8f94"/><rect x="438" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="497.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4  wash</text><text x="497.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">everything</text><text x="497.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">unbound leaves</text><line x1="558" y1="75" x2="567" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 572 75 L 567 71.5 L 567 78.5 Z" fill="#8a8f94"/><rect x="574" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="633.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">5  release</text><text x="633.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">65 °C, protease:</text><text x="633.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">reverse, free DNA</text><line x1="30" y1="160" x2="250" y2="160" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><rect x="132" y="137" width="16" height="16" rx="3" fill="#b4532a"/><text x="260" y="164" font-size="12.5" fill="#23282d">the protein stays on the DNA through steps 2 to 4</text><line x1="30" y1="200" x2="250" y2="200" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><text x="260" y="204" font-size="12.5" fill="#8a8f94">no protein here: washed away at step 4</text><text x="30" y="252" font-size="12.5" fill="#b4532a">Then end repair, A-tailing, adapter ligation and PCR: an ordinary DNA library.</text>
</svg>
