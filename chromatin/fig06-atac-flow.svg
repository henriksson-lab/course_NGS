<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="230" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">ATAC-seq: everything happens in one tube of nuclei.</text><rect x="30" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="89.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1  nuclei</text><text x="89.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">50,000 cells,</text><text x="89.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">lysed, spun</text><line x1="150" y1="75" x2="159" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 164 75 L 159 71.5 L 159 78.5 Z" fill="#8a8f94"/><rect x="166" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2  tagment</text><text x="225.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">Tn5, 37 °C,</text><text x="225.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">30 min</text><line x1="286" y1="75" x2="295" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 300 75 L 295 71.5 L 295 78.5 Z" fill="#8a8f94"/><rect x="302" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="361.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3  clean up</text><text x="361.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">purify DNA</text><text x="361.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">from the enzyme</text><line x1="422" y1="75" x2="431" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 436 75 L 431 71.5 L 431 78.5 Z" fill="#8a8f94"/><rect x="438" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="497.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4  PCR</text><text x="497.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">72 °C gap fill,</text><text x="497.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">then cycles</text><line x1="558" y1="75" x2="567" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 572 75 L 567 71.5 L 567 78.5 Z" fill="#8a8f94"/><rect x="574" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="633.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">5  sequence</text><text x="633.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">paired-end,</text><text x="633.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">short reads</text><text x="30" y="142" font-size="13" fill="#23282d" font-weight="bold">Which fragments become library?</text><rect x="30" y="157" width="28" height="18" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="44.0" y="169.85" font-size="11" text-anchor="middle" fill="#1f3b57">A</text><line x1="58" y1="166" x2="150" y2="166" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><rect x="150" y="157" width="28" height="18" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="164.0" y="169.85" font-size="11" text-anchor="middle" fill="#a33a28">B</text><text x="196" y="170" font-size="12" fill="#23282d">adapter A on one end, B on the other</text><text x="440" y="170" font-size="12" fill="#2e6b3f">amplifies with both primers</text><rect x="30" y="187" width="28" height="18" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="44.0" y="199.85" font-size="11" text-anchor="middle" fill="#1f3b57">A</text><line x1="58" y1="196" x2="150" y2="196" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><rect x="150" y="187" width="28" height="18" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="164.0" y="199.85" font-size="11" text-anchor="middle" fill="#1f3b57">A</text><text x="196" y="200" font-size="12" fill="#23282d">A at both ends, or B at both</text><text x="440" y="200" font-size="12" fill="#a33a28">one primer fits; amplifies poorly</text>
</svg>
