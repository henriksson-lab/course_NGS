<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="262" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Two crosslinkers, two reaches.</text><line x1="30" y1="130" x2="690" y2="130" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><rect x="166" y="97" width="28" height="28" rx="3" fill="#b4532a"/><text x="180" y="80" font-size="12" text-anchor="middle" fill="#b4532a">TF A (binds DNA)</text><rect x="286" y="55" width="28" height="28" rx="3" fill="#6b5b8a"/><text x="300" y="46" font-size="12" text-anchor="middle" fill="#6b5b8a">TF B (binds A, not DNA)</text><line x1="180" y1="130" x2="180" y2="108" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><text x="196" y="152" font-size="12" fill="#b4532a">formaldehyde: ~2 Å, protein-DNA and close protein-protein</text><line x1="194" y1="100" x2="288" y2="76" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="5 3"/><text x="330" y="96" font-size="12" fill="#a33a28">DSG: 7.7 Å spacer, protein-protein only</text><text x="30" y="204" font-size="12.5" fill="#23282d">Formaldehyde alone often misses factors held in place by a partner; adding DSG as well catches them.</text><text x="30" y="226" font-size="12.5" fill="#23282d">Reversal: heat at 65 °C breaks the formaldehyde links; protease digests the proteins; the DNA is free.</text><text x="30" y="248" font-size="12.5" fill="#8a8f94">Too much crosslinking masks the epitope and makes chromatin hard to shear.</text>
</svg>
