<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 738 226" width="738" height="226" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="226" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">DAP-seq: take the chromatin out of the question.</text><rect x="30" y="40" width="118" height="80" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="89.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1  genomic DNA</text><text x="89.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">extract, fragment,</text><text x="89.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">add adapters:</text><text x="89.0" y="106" font-size="11.5" text-anchor="middle" fill="#8a8f94">a library</text><line x1="150" y1="80" x2="159" y2="80" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 164 80 L 159 76.5 L 159 83.5 Z" fill="#8a8f94"/><rect x="166" y="40" width="118" height="80" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2  protein</text><text x="225.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">express a tagged TF</text><text x="225.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">in a test tube</text><line x1="286" y1="80" x2="295" y2="80" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 300 80 L 295 76.5 L 295 83.5 Z" fill="#8a8f94"/><rect x="302" y="40" width="118" height="80" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="361.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3  mix</text><text x="361.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">TF binds DNA</text><text x="361.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">in the tube</text><line x1="422" y1="80" x2="431" y2="80" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 436 80 L 431 76.5 L 431 83.5 Z" fill="#8a8f94"/><rect x="438" y="40" width="118" height="80" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="497.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4  pull down</text><text x="497.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">capture by the tag,</text><text x="497.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">wash, elute</text><line x1="558" y1="80" x2="567" y2="80" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 572 80 L 567 76.5 L 567 83.5 Z" fill="#8a8f94"/><rect x="574" y="40" width="118" height="80" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="633.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">5  sequence</text><text x="633.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">reads = sequences</text><text x="633.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">the TF can bind</text><text x="30" y="158" font-size="12.5" fill="#23282d">Nucleosomes, histone marks and competing factors are all absent, so the</text><text x="30" y="178" font-size="12.5" fill="#23282d">map shows what the DNA sequence allows, not what the cell uses.</text><text x="30" y="210" font-size="12.5" fill="#8a8f94">The 2016 paper used Arabidopsis; the logic applies to any genome. PCR-amplified libraries lose DNA methylation.</text>
</svg>
