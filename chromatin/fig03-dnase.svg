<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 272" width="756" height="272" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="272" fill="none"/>
