1" width="50" height="18" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="485.0" y="153.85" font-size="11" text-anchor="middle" fill="#a33a28">linker I</text><circle cx="200" cy="132" r="4" fill="#2e6b3f"/><text x="212" y="128" font-size="11" fill="#2e6b3f">biotin</text><text x="30" y="154" font-size="13" fill="#b4532a" font-weight="bold">2</text><text x="48" y="188" font-size="12.5" fill="#23282d">ligate a biotinylated linker, which carries an MmeI site</text><rect x="190" y="213" width="50" height="18" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="215.0" y="225.85" font-size="11" text-anchor="middle" fill="#a33a28">linker I</text><line x1="240" y1="222" x2="290" y2="222" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="288" y1="214" x2="296" y2="230" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="296" y1="214" x2="288" y2="230" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><text x="310" y="226" font-size="12" fill="#8a8f94">MmeI cuts a fixed distance into the DNA: a short tag of the open-DNA end</text><text x="30" y="226" font-size="13" fill="#b4532a" font-weight="bold">3</text><text x="48" y="256" font-size="12.5" fill="#23282d">capture on streptavidin, add linker II, PCR, sequence the ~20 bp tag</text>
</svg>
