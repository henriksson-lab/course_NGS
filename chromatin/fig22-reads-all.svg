<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="270" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">What one read means, method by method.</text><rect x="30" y="32" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="47.2" font-size="12" text-anchor="middle" fill="#1f3b57">ATAC-seq</text><text x="152" y="48" font-size="12.5" fill="#23282d">a Tn5 insertion, so an accessible base</text><rect x="30" y="60" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="75.2" font-size="12" text-anchor="middle" fill="#1f3b57">DNase-seq</text><text x="152" y="76" font-size="12.5" fill="#23282d">a DNase I cut, so an accessible base</text><rect x="30" y="88" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="103.2" font-size="12" text-anchor="middle" fill="#1f3b57">MNase-seq</text><text x="152" y="104" font-size="12.5" fill="#23282d">the edge of DNA a nucleosome protected</text><rect x="30" y="116" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="131.2" font-size="12" text-anchor="middle" fill="#1f3b57">ChIP-seq</text><text x="152" y="132" font-size="12.5" fill="#23282d">the end of a sonicated fragment that carried the protein</text><rect x="30" y="144" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="159.2" font-size="12" text-anchor="middle" fill="#1f3b57">CUT&amp;RUN</text><text x="152" y="160" font-size="12.5" fill="#23282d">the edge of DNA protected by a bound protein</text><rect x="30" y="172" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="187.2" font-size="12" text-anchor="middle" fill="#1f3b57">CUT&amp;Tag</text><text x="152" y="188" font-size="12.5" fill="#23282d">a Tn5 insertion beside the antibody</text><rect x="30" y="200" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="215.2" font-size="12" text-anchor="middle" fill="#1f3b57">DamID</text><text x="152" y="216" font-size="12.5" fill="#23282d">a GATC that was methylated near the fusion</text><rect x="30" y="228" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="243.2" font-size="12" text-anchor="middle" fill="#1f3b57">Calling cards</text><text x="152" y="244" font-size="12.5" fill="#23282d">a transposon insertion near where the TF had been</text>
</svg>
