<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" width="720" height="278" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="278" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Pick the method from the question.</text><rect x="30" y="34" width="330" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="195.0" y="52.375" font-size="12.5" text-anchor="middle" fill="#23282d">Where is DNA open, in many samples?</text><line x1="366" y1="48" x2="387" y2="48" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 392 48 L 387 44.5 L 387 51.5 Z" fill="#8a8f94"/><rect x="398" y="34" width="290" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="543.0" y="52.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">ATAC-seq / Omni-ATAC</text><rect x="30" y="74" width="330" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="195.0" y="92.375" font-size="12.5" text-anchor="middle" fill="#23282d">Open, and which TF motifs are occupied?</text><line x1="366" y1="88" x2="387" y2="88" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 392 88 L 387 84.5 L 387 91.5 Z" fill="#8a8f94"/><rect x="398" y="74" width="290" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="543.0" y="92.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">ATAC or DNase, deep, footprints</text><rect x="30" y="114" width="330" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="195.0" y="132.375" font-size="12.5" text-anchor="middle" fill="#23282d">Nucleosome positions?</text><line x1="366" y1="128" x2="387" y2="128" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 392 128 L 387 124.5 L 387 131.5 Z" fill="#8a8f94"/><rect x="398" y="114" width="290" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="543.0" y="132.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">MNase-seq</text><rect x="30" y="154" width="330" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="195.0" y="172.375" font-size="12.5" text-anchor="middle" fill="#23282d">Open vs closed on the same single molecule?</text><line x1="366" y1="168" x2="387" y2="168" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 392 168 L 387 164.5 L 387 171.5 Z" fill="#8a8f94"/><rect x="398" y="154" width="290" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="543.0" y="172.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">methyltransferase footprinting</text><rect x="30" y="194" width="330" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="195.0" y="212.375" font-size="12.5" text-anchor="middle" fill="#23282d">Where is a histone mark, from few cells?</text><line x1="366" y1="208" x2="387" y2="208" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 392 208 L 387 204.5 L 387 211.5 Z" fill="#8a8f94"/><rect x="398" y="194" width="290" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="543.0" y="212.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">CUT&amp;Tag</text><rect x="30" y="234" width="330" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="195.0" y="252.375" font-size="12.5" text-anchor="middle" fill="#23282d">Where is a TF, no good antibody?</text><line x1="366" y1="248" x2="387" y2="248" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 392 248 L 387 244.5 L 387 251.5 Z" fill="#8a8f94"/><rect x="398" y="234" width="290" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="543.0" y="252.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">DamID, calling cards, tagged protein</text>
</svg>
