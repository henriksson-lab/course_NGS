<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" width="720" height="278" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="278" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Cut where the antibody is, not everywhere.</text><text x="30" y="54" font-size="13" fill="#23282d" font-weight="bold">ChIP: break everything, then fish</text><line x1="30" y1="150" x2="330" y2="150" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="butt"/><line x1="56" y1="143" x2="64" y2="157" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="64" y1="143" x2="56" y2="157" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="116" y1="143" x2="124" y2="157" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="124" y1="143" x2="116" y2="157" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="176" y1="143" x2="184" y2="157" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="184" y1="143" x2="176" y2="157" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="236" y1="143" x2="244" y2="157" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="244" y1="143" x2="236" y2="157" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="296" y1="143" x2="304" y2="157" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="304" y1="143" x2="296" y2="157" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><rect x="143" y="128" width="14" height="14" rx="3" fill="#b4532a"/><text x="30" y="190" font-size="12" fill="#8a8f94">random fragmentation; the target</text><text x="30" y="206" font-size="12" fill="#8a8f94">is a few fragments among all</text><text x="390" y="54" font-size="13" fill="#23282d" font-weight="bold">Tethered enzyme: break only at the target</text><line x1="390" y1="150" x2="690" y2="150" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="butt"/><rect x="533" y="128" width="14" height="14" rx="3" fill="#b4532a"/><line x1="540" y1="126" x2="540" y2="110" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 540 110 L 528 96 L 552 96 Z" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><text x="560" y="106" font-size="11.5" fill="#1f3b57">antibody</text><rect x="512" y="66" width="56" height="18" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="540.0" y="79.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">pA</text><rect x="568" y="66" width="76" height="18" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="606.0" y="79.025" font-size="11.5" text-anchor="middle" fill="#a33a28">MNase / Tn5</text><line x1="496" y1="141" x2="504" y2="159" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="504" y1="141" x2="496" y2="159" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="576" y1="141" x2="584" y2="159" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="584" y1="141" x2="576" y2="159" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><text x="390" y="190" font-size="12" fill="#8a8f94">the enzyme is brought to the protein, so</text><text x="390" y="206" font-size="12" fill="#8a8f94">cuts and the signal are the same thing</text><text x="30" y="240" font-size="12.5" fill="#23282d">Protein A binds the antibody's Fc region, so one fusion protein works with any rabbit or mouse antibody.</text><text x="30" y="262" font-size="12.5" fill="#b4532a">The enzyme swap decides the product: MNase releases a fragment; Tn5 tags it with sequencing adapters.</text>
</svg>
