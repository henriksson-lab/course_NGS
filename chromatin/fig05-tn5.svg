<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" width="720" height="306" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="306" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Tn5 cuts and ligates in one step: tagmentation.</text><line x1="30" y1="87" x2="690" y2="87" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="30" y1="97" x2="690" y2="97" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><ellipse cx="300" cy="92" rx="52" ry="22" fill="#f5eae6" stroke="#a33a28" stroke-width="1.4"/><text x="300" y="96" font-size="12" text-anchor="middle" fill="#a33a28">Tn5 dimer</text><rect x="250" y="38" width="44" height="16" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="272.0" y="49.675" font-size="10.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="306" y="38" width="44" height="16" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="328.0" y="49.675" font-size="10.5" text-anchor="middle" fill="#1f3b57">adapter</text><text x="30" y="136" font-size="12.5" fill="#23282d">Tn5 loaded with two adapters binds DNA and cuts both strands, staggered by 9 nt</text><line x1="30" y1="181" x2="290" y2="181" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="30" y1="191" x2="290" y2="191" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><line x1="380" y1="181" x2="690" y2="181" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="380" y1="191" x2="690" y2="191" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><line x1="290" y1="181" x2="305" y2="181" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><line x1="365" y1="191" x2="380" y2="191" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><rect x="262" y="150" width="56" height="16" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="290.0" y="161.675" font-size="10.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="352" y="204" width="56" height="16" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="380.0" y="215.675" font-size="10.5" text-anchor="middle" fill="#1f3b57">adapter</text><text x="336" y="240" font-size="12" text-anchor="middle" fill="#b4532a">9 nt single-stranded gap on each side</text><text x="30" y="268" font-size="12.5" fill="#23282d">Each adapter is joined to one 5' end only. The gap is filled in later, by the 72 °C step before PCR.</text><text x="30" y="290" font-size="12.5" fill="#8a8f94">A Tn5 insertion is one point in the genome; the read starts next to it.</text>
</svg>
