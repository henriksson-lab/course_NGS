<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 246" width="720" height="246" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="246" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">CUT&amp;Tag: the cut and the library adapters happen together.</text><rect x="30" y="40" width="118" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="89.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1  bind</text><text x="89.0" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">cells on beads,</text><text x="89.0" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">permeabilise</text><line x1="150" y1="83" x2="159" y2="83" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 164 83 L 159 79.5 L 159 86.5 Z" fill="#8a8f94"/><rect x="166" y="40" width="118" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2  antibody</text><text x="225.0" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">primary, secondary,</text><text x="225.0" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">then pA-Tn5</text><text x="225.0" y="106" font-size="11" text-anchor="middle" fill="#8a8f94">(adapters loaded)</text><line x1="286" y1="83" x2="295" y2="83" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 300 83 L 295 79.5 L 295 86.5 Z" fill="#8a8f94"/><rect x="302" y="40" width="118" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="361.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3  wash</text><text x="361.0" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">high salt keeps</text><text x="361.0" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">pA-Tn5 only where</text><text x="361.0" y="106" font-size="11" text-anchor="middle" fill="#8a8f94">the antibody is</text><line x1="422" y1="83" x2="431" y2="83" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 436 83 L 431 79.5 L 431 86.5 Z" fill="#8a8f94"/><rect x="438" y="40" width="118" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="497.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4  activate</text><text x="497.0" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">add Mg2+: Tn5</text><text x="497.0" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">tagments the DNA</text><text x="497.0" y="106" font-size="11" text-anchor="middle" fill="#8a8f94">next to the protein</text><line x1="558" y1="83" x2="567" y2="83" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 572 83 L 567 79.5 L 567 86.5 Z" fill="#8a8f94"/><rect x="574" y="40" width="118" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="633.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">5  PCR</text><text x="633.0" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">release DNA, 72 °C</text><text x="633.0" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">gap fill, indexed</text><text x="633.0" y="106" font-size="11" text-anchor="middle" fill="#8a8f94">PCR</text><line x1="30" y1="168" x2="690" y2="168" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="butt"/><line x1="30" y1="176" x2="690" y2="176" stroke="#4a6b8a" stroke-width="2.6" stroke-linecap="butt"/><rect x="352" y="143" width="16" height="16" rx="3" fill="#b4532a"/><rect x="316" y="140" width="28" height="12" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="316" y="186" width="28" height="12" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><rect x="376" y="140" width="28" height="12" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="376" y="186" width="28" height="12" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="300" y="212" font-size="12" fill="#b4532a">adapters are already on the ends: no repair, no ligation</text><text x="30" y="232" font-size="12.5" fill="#23282d">Reads are cheap because almost nothing but the target is tagged: a few million per sample can be enough.</text>
</svg>
