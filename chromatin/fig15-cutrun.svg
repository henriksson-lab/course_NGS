<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 819 246" width="819" height="246" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="246" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">CUT&amp;RUN: cut out the protected piece, and let it diffuse away.</text><rect x="30" y="40" width="118" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="89.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1  bind</text><text x="89.0" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">cells or nuclei on</text><text x="89.0" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">lectin beads, open</text><text x="89.0" y="106" font-size="11" text-anchor="middle" fill="#8a8f94">the membrane</text><line x1="150" y1="83" x2="159" y2="83" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 164 83 L 159 79.5 L 159 86.5 Z" fill="#8a8f94"/><rect x="166" y="40" width="118" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2  antibody</text><text x="225.0" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">primary antibody,</text><text x="225.0" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">then pA-MNase,</text><text x="225.0" y="106" font-size="11" text-anchor="middle" fill="#8a8f94">cold, no calcium</text><line x1="286" y1="83" x2="295" y2="83" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 300 83 L 295 79.5 L 295 86.5 Z" fill="#8a8f94"/><rect x="302" y="40" width="118" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="361.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3  activate</text><text x="361.0" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">add Ca2+: MNase</text><text x="361.0" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">cuts on both sides</text><text x="361.0" y="106" font-size="11" text-anchor="middle" fill="#8a8f94">of the protein</text><line x1="422" y1="83" x2="431" y2="83" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 436 83 L 431 79.5 L 431 86.5 Z" fill="#8a8f94"/><rect x="438" y="40" width="118" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="497.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4  release</text><text x="497.0" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">cut piece leaves</text><text x="497.0" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">the nucleus; keep</text><text x="497.0" y="106" font-size="11" text-anchor="middle" fill="#8a8f94">the supernatant</text><line x1="558" y1="83" x2="567" y2="83" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 572 83 L 567 79.5 L 567 86.5 Z" fill="#8a8f94"/><rect x="574" y="40" width="118" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="633.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">5  library</text><text x="633.0" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">extract DNA,</text><text x="633.0" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">small fragments,</text><text x="633.0" y="106" font-size="11" text-anchor="middle" fill="#8a8f94">standard library</text><line x1="30" y1="172" x2="690" y2="172" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="butt"/><rect x="352" y="149" width="16" height="16" rx="3" fill="#b4532a"/><line x1="326" y1="163" x2="334" y2="181" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="334" y1="163" x2="326" y2="181" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="386" y1="163" x2="394" y2="181" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="394" y1="163" x2="386" y2="181" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="333" y1="184" x2="387" y2="184" stroke="#b4532a" stroke-width="4" stroke-linecap="butt"/><text x="300" y="206" font-size="12" fill="#b4532a">this piece is the library; the rest stays in the nucleus</text><text x="30" y="232" font-size="12.5" fill="#23282d">No crosslinking and no sonication in the standard protocol; background is low because the rest of the DNA is never released.</text>
</svg>
