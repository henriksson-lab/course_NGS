<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 761 232" width="761" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="680" height="232" fill="none"/>
<text x="40" y="28" font-size="14" fill="#23282d">Unknown inserts, identical ends — so one primer reads them all.</text><rect x="60" y="62" width="52" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="86.0" y="76.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="112" y="62" width="150" height="20" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="187.0" y="76.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert A</text><rect x="262" y="62" width="52" height="20" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="288.0" y="76.2" font-size="12" text-anchor="middle" fill="#a33a28">P7</text><line x1="76" y1="94" x2="117" y2="94" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 122 94 L 117 90.5 L 117 97.5 Z" fill="#b4532a"/><text x="130" y="98" font-size="12" fill="#8a8f94">same primer, same site</text><rect x="60" y="108" width="52" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="86.0" y="122.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="112" y="108" width="95" height="20" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="159.5" y="122.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert B</text><rect x="207" y="108" width="52" height="20" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="233.0" y="122.2" font-size="12" text-anchor="middle" fill="#a33a28">P7</text><line x1="76" y1="140" x2="117" y2="140" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 122 140 L 117 136.5 L 117 143.5 Z" fill="#b4532a"/><text x="130" y="144" font-size="12" fill="#8a8f94">same primer, same site</text><rect x="60" y="154" width="52" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="86.0" y="168.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="112" y="154" width="210" height="20" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="217.0" y="168.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert C</text><rect x="322" y="154" width="52" height="20" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="348.0" y="168.2" font-size="12" text-anchor="middle" fill="#a33a28">P7</text><line x1="76" y1="186" x2="117" y2="186" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 122 186 L 117 182.5 L 117 189.5 Z" fill="#b4532a"/><text x="130" y="190" font-size="12" fill="#8a8f94">same primer, same site</text><text x="40" y="212" font-size="14" fill="#b4532a">This is the whole reason a library exists: the sequencer only knows how to read the ends you gave it.</text>
</svg>
