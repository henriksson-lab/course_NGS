<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 216" width="764" height="216" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="690" height="216" fill="none"/>
<text x="131" y="28" font-size="13" text-anchor="middle" fill="#23282d">1. copy, keep the copy</text><rect x="36" y="150" width="190" height="10" fill="#dfe3e6"/><line x1="76" y1="150" x2="76" y2="70" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><text x="82" y="64" font-size="11.5" fill="#8a8f94">copied strand, now attached</text><text x="346" y="28" font-size="13" text-anchor="middle" fill="#23282d">2. bend over and bridge</text><rect x="251" y="150" width="190" height="10" fill="#dfe3e6"/><path d="M 291 150 C 291 80, 391 80, 391 150" fill="none" stroke="#1f3b57" stroke-width="2.6"/><line x1="391" y1="150" x2="391" y2="142" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><text x="341" y="64" font-size="11.5" text-anchor="middle" fill="#8a8f94">free end finds a</text><text x="341" y="78" font-size="11.5" text-anchor="middle" fill="#8a8f94">P7 oligo nearby</text><text x="561" y="28" font-size="13" text-anchor="middle" fill="#23282d">3. repeat → a cluster</text><rect x="466" y="150" width="190" height="10" fill="#dfe3e6"/><line x1="484" y1="150" x2="484" y2="116" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="503" y1="150" x2="503" y2="108" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><line x1="522" y1="150" x2="522" y2="100" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="541" y1="150" x2="541" y2="116" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><line x1="560" y1="150" x2="560" y2="108" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="579" y1="150" x2="579" y2="100" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><line x1="598" y1="150" x2="598" y2="116" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="617" y1="150" x2="617" y2="108" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><line x1="636" y1="150" x2="636" y2="100" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><text x="561" y="70" font-size="11.5" text-anchor="middle" fill="#8a8f94">~1000 copies, all identical</text><text x="36" y="196" font-size="14" fill="#23282d">Amplification is local: the copies stay where they were made, which is why one cluster gives one read.</text>
</svg>
