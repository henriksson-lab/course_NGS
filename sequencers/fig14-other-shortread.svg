<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 242" width="824" height="242" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="242" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Two other ways to read a cluster.</text><rect x="46" y="50" width="300" height="118" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="196" y="74" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">Element AVITI — sequencing by avidity</text><text x="196" y="98" font-size="11.5" text-anchor="middle" fill="#8a8f94">a multivalent probe carries many copies of</text><text x="196" y="114" font-size="11.5" text-anchor="middle" fill="#8a8f94">one base, so it binds a polony very tightly</text><text x="196" y="138" font-size="11.5" text-anchor="middle" fill="#23282d">bright signal from little reagent;</text><text x="196" y="154" font-size="11.5" text-anchor="middle" fill="#23282d">binding is separated from incorporation</text><rect x="362" y="50" width="300" height="118" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="512" y="74" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">Ultima — flow-based, no terminator</text><text x="512" y="98" font-size="11.5" text-anchor="middle" fill="#8a8f94">beads on an open wafer; one base flows at a</text><text x="512" y="114" font-size="11.5" text-anchor="middle" fill="#8a8f94">time and is incorporated until it runs out</text><text x="512" y="138" font-size="11.5" text-anchor="middle" fill="#23282d">signal height counts homopolymer length,</text><text x="512" y="154" font-size="11.5" text-anchor="middle" fill="#23282d">so homopolymers are the weak spot</text><text x="40" y="198" font-size="14" fill="#23282d">Both read short, accurate reads and both want the same thing from you: a library with the platform's own ends.</text><text x="40" y="222" font-size="13.5" fill="#8a8f94">The chemistry differs; the library design problem does not.</text>
</svg>
