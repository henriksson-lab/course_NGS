<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 242" width="1000" height="242" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="1000" height="242" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Three other ways to read a short library.</text><rect x="30" y="50" width="300" height="118" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="180" y="74" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">Element AVITI — avidity</text><text x="180" y="98" font-size="11" text-anchor="middle" fill="#8a8f94">a probe carrying many copies of one base</text><text x="180" y="114" font-size="11" text-anchor="middle" fill="#8a8f94">grips a polony: a clonal cluster of copies</text><text x="180" y="138" font-size="11" text-anchor="middle" fill="#23282d">bright signal from little reagent;</text><text x="180" y="154" font-size="11" text-anchor="middle" fill="#23282d">binding is separated from incorporation</text><rect x="348" y="50" width="300" height="118" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="498" y="74" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">Ultima — flow-based, no terminator</text><text x="498" y="98" font-size="11" text-anchor="middle" fill="#8a8f94">beads on an open wafer; one base flows</text><text x="498" y="114" font-size="11" text-anchor="middle" fill="#8a8f94">at a time and adds until it runs out</text><text x="498" y="138" font-size="11" text-anchor="middle" fill="#23282d">signal height counts homopolymer length,</text><text x="498" y="154" font-size="11" text-anchor="middle" fill="#23282d">so homopolymers are the weak spot</text><rect x="666" y="50" width="300" height="118" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="816" y="74" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">Ion Torrent — no optics at all</text><text x="816" y="98" font-size="11" text-anchor="middle" fill="#8a8f94">each well sits on a transistor that senses</text><text x="816" y="114" font-size="11" text-anchor="middle" fill="#8a8f94">the H+ released when a base is added</text><text x="816" y="138" font-size="11" text-anchor="middle" fill="#23282d">bases also flow one at a time, so it shares</text><text x="816" y="154" font-size="11" text-anchor="middle" fill="#23282d">Ultima's homopolymer problem</text><text x="30" y="198" font-size="14" fill="#23282d">All three read short, accurate reads, and all three want the same thing from you: a library with the platform's own ends.</text><text x="30" y="222" font-size="13.5" fill="#8a8f94">The chemistry differs; the library design problem does not.</text>
</svg>
