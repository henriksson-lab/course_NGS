<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 776 234" width="776" height="234" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="234" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">No polymerase, no copying: the molecule itself is the signal.</text><rect x="60" y="96" width="330" height="12" fill="#dfe3e6"/><text x="60" y="88" font-size="11.5" fill="#8a8f94">membrane</text><path d="M 216 96 L 204 78 L 248 78 L 236 96 L 236 108 L 248 126 L 204 126 L 216 108 Z" fill="#eef1f3" stroke="#1f3b57" stroke-width="1.6"/><text x="226" y="146" font-size="11.5" text-anchor="middle" fill="#1f3b57">pore</text><path d="M 120 52 C 170 52, 180 70, 226 78" fill="none" stroke="#8a8f94" stroke-width="2.4"/><circle cx="150" cy="56" r="8" fill="#b4532a"/><text x="150" y="40" font-size="11.5" fill="#b4532a">motor protein ratchets the strand through</text><line x1="226" y1="126" x2="226" y2="160" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round"/><polyline points="420,104 422,112 423,118 424,123 426,125 428,126 429,124 430,120 432,114 434,106 435,99 436,91 438,85 440,80 441,77 442,77 444,78 446,82 447,86 448,92 450,97 452,102 453,105 454,107 456,106 458,104 459,100 460,94 462,88 464,82 465,77 466,73 468,71 470,71 471,73 472,78 474,84 476,91 477,99 478,107 480,114 482,119 483,122 484,123 486,122 488,118 489,113 490,107 492,100 494,94 495,89 496,86 498,84 500,85 501,88 502,92 504,96 506,102 507,107 508,111 510,113 512,113 513,111 514,107 516,102 518,95 519,87 520,80 522,74 524,69 525,67 526,66 528,68 530,73 531,79 532,86 534,93 536,101 537,107 538,112 540,115 542,115 543,114 544,110 546,106 548,100 549,95 550,90 552,87 554,85 555,86 556,88 558,92 560,98 561,104 562,110 564,115 566,119 567,121 568,121 570,119 572,114 573,108 574,100 576,92 578,85 579,78 580,73 582,70 584,69 585,70 586,74 588,79 590,85 591,92 592,98 594,103 596,106 597,108 598,107 600,104 602,100 603,95 604,90 606,85 608,81 609,79 610,79 612,81 614,85 615,91 616,97 618,105 620,112 621,118 622,123 624,126 626,126 627,124 628,119 630,113 632,106 633,98 634,91 636,85 638,80 639,77 640,77 642,78 644,82 645,87 646,92 648,97 650,102 651,105 652,107 654,106 656,104 657,99 658,94 660,88 662,82 663,76 664,73 666,70 668,71 669,73 670,78 672,84 674,92" fill="none" stroke="#1f3b57" stroke-width="1.8"/><text x="420" y="58" font-size="12" fill="#23282d">current through the pore</text><text x="420" y="142" font-size="11.5" fill="#8a8f94">a neural network turns the squiggle into bases</text><text x="40" y="190" font-size="14" fill="#23282d">Read length is simply how long the molecule was — so how you pipette becomes how long your reads are.</text><text x="40" y="214" font-size="13.5" fill="#2e6b3f">Modified bases change the current too, so they can be called from the same signal, with no conversion step.</text>
</svg>
