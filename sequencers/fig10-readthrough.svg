<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 789 266" width="789" height="266" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="266" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">If the insert is shorter than the read, the read runs into the adapter.</text><rect x="60" y="70" width="60" height="22" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="90.0" y="84.85" font-size="11" text-anchor="middle" fill="#8a8f94">adapter</text><rect x="120" y="70" width="230" height="22" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="235.0" y="85.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="350" y="70" width="60" height="22" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="380.0" y="84.85" font-size="11" text-anchor="middle" fill="#8a8f94">adapter</text><line x1="120" y1="108" x2="285" y2="108" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 290 108 L 285 104.5 L 285 111.5 Z" fill="#b4532a"/><text x="124" y="126" font-size="11.5" fill="#b4532a">read, 150 bases</text><text x="330" y="85" font-size="12.5" fill="#2e6b3f">insert longer than the read — fine</text><rect x="60" y="156" width="60" height="22" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="90.0" y="170.85" font-size="11" text-anchor="middle" fill="#8a8f94">adapter</text><rect x="120" y="156" width="90" height="22" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="165.0" y="171.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="210" y="156" width="60" height="22" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="240.0" y="170.85" font-size="11" text-anchor="middle" fill="#8a8f94">adapter</text><line x1="120" y1="194" x2="285" y2="194" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 290 194 L 285 190.5 L 285 197.5 Z" fill="#b4532a"/><text x="124" y="212" font-size="11.5" fill="#b4532a">read, 150 bases</text><rect x="210" y="186" width="80" height="16" fill="#a33a28" opacity="0.18"/><text x="276" y="212" font-size="11.5" fill="#a33a28">adapter bases — must be trimmed off</text><text x="350" y="171" font-size="12.5" fill="#a33a28">insert shorter — read-through</text><text x="40" y="246" font-size="14" fill="#23282d">Adapter content in a QC report is this, and it tells you your fragment size, not your sequencing quality.</text>
</svg>
