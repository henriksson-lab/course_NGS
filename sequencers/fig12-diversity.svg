x="556" y="114" width="16" height="18" fill="#1f3b57" opacity="0.85"/><rect x="556" y="96" width="16" height="18" fill="#b4532a" opacity="0.85"/><rect x="556" y="78" width="16" height="18" fill="#4a6b8a" opacity="0.85"/><text x="564" y="166" font-size="10" text-anchor="middle" fill="#8a8f94">9</text><rect x="578" y="132" width="16" height="18" fill="#2e6b3f" opacity="0.85"/><rect x="578" y="114" width="16" height="18" fill="#1f3b57" opacity="0.85"/><rect x="578" y="96" width="16" height="18" fill="#b4532a" opacity="0.85"/><rect x="578" y="78" width="16" height="18" fill="#4a6b8a" opacity="0.85"/><text x="586" y="166" font-size="10" text-anchor="middle" fill="#8a8f94">10</text><text x="490" y="186" font-size="11.5" text-anchor="middle" fill="#8a8f94">cycle</text><text x="40" y="216" font-size="14" fill="#23282d">All-identical early bases blind the instrument: it cannot tell clusters apart or set its colour thresholds.</text><text x="40" y="240" font-size="13.5" fill="#2e6b3f">Fixes: spike in PhiX, order primers with 0–3 extra bases so libraries are out of phase, or use a varied index set.</text>
