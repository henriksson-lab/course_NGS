<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 782 226" width="782" height="226" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="710" height="226" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">MGI: make a circle, copy it hundreds of times into one ball.</text><rect x="42" y="52" width="140" height="100" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="112" y="76" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">adapters +</text><text x="112" y="92" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">splint</text><text x="112" y="114" font-size="11.5" text-anchor="middle" fill="#8a8f94">ligate the ends</text><text x="112" y="130" font-size="11.5" text-anchor="middle" fill="#8a8f94">together</text><line x1="186" y1="102" x2="197" y2="102" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 202 102 L 197 98.5 L 197 105.5 Z" fill="#8a8f94"/><rect x="204" y="52" width="140" height="100" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="274" y="76" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">ssDNA circle</text><text x="274" y="114" font-size="11.5" text-anchor="middle" fill="#8a8f94">exonuclease removes</text><text x="274" y="130" font-size="11.5" text-anchor="middle" fill="#8a8f94">anything still linear</text><line x1="348" y1="102" x2="359" y2="102" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 364 102 L 359 98.5 L 359 105.5 Z" fill="#8a8f94"/><rect x="366" y="52" width="140" height="100" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="436" y="76" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">rolling circle</text><text x="436" y="114" font-size="11.5" text-anchor="middle" fill="#8a8f94">phi29 copies round</text><text x="436" y="130" font-size="11.5" text-anchor="middle" fill="#8a8f94">and round</text><line x1="510" y1="102" x2="521" y2="102" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 526 102 L 521 98.5 L 521 105.5 Z" fill="#8a8f94"/><rect x="528" y="52" width="140" height="100" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="598" y="76" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">DNA nanoball</text><text x="598" y="114" font-size="11.5" text-anchor="middle" fill="#8a8f94">one long concatemer,</text><text x="598" y="130" font-size="11.5" text-anchor="middle" fill="#8a8f94">folded up</text><text x="40" y="182" font-size="14" fill="#2e6b3f">No PCR on the flow cell, so no PCR duplicates from clustering and no index hopping of the Illumina kind.</text><text x="40" y="206" font-size="13.5" fill="#8a8f94">The balls sit on a patterned array and are read by probe-anchor ligation, not by a processive polymerase.</text>
</svg>
