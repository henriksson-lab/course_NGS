<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 212" width="720" height="212" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="212" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">How the sequencer gets to the other end of the insert.</text><rect x="40" y="52" width="152" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="116" y="86" font-size="11.5" text-anchor="middle" fill="#23282d">Read 1 and both</text><text x="116" y="103" font-size="11.5" text-anchor="middle" fill="#23282d">index reads are done</text><text x="116" y="66" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1</text><line x1="196" y1="95" x2="207" y2="95" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 212 95 L 207 91.5 L 207 98.5 Z" fill="#8a8f94"/><rect x="210" y="52" width="152" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="286" y="86" font-size="11.5" text-anchor="middle" fill="#23282d">strip the new strand;</text><text x="286" y="103" font-size="11.5" text-anchor="middle" fill="#23282d">the template bridges again</text><text x="286" y="66" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2</text><line x1="366" y1="95" x2="377" y2="95" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 382 95 L 377 91.5 L 377 98.5 Z" fill="#8a8f94"/><rect x="380" y="52" width="152" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="456" y="86" font-size="11.5" text-anchor="middle" fill="#23282d">copy it, then remove</text><text x="456" y="103" font-size="11.5" text-anchor="middle" fill="#23282d">the strand just read</text><text x="456" y="66" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3</text><line x1="536" y1="95" x2="547" y2="95" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 552 95 L 547 91.5 L 547 98.5 Z" fill="#8a8f94"/><rect x="550" y="52" width="152" height="86" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="626" y="86" font-size="11.5" text-anchor="middle" fill="#23282d">Read 2 primer anneals</text><text x="626" y="103" font-size="11.5" text-anchor="middle" fill="#23282d">and reads the other end</text><text x="626" y="66" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4</text><text x="40" y="168" font-size="14" fill="#23282d">Read 2 is a fresh copy of the opposite strand — it is not the same molecule read backwards.</text><text x="40" y="192" font-size="13.5" fill="#8a8f94">This costs time and chemistry, which is why paired-end runs cost more than single-end.</text>
</svg>
