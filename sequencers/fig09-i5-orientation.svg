<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 292" width="824" height="292" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="292" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">The i5 index is read in one of two directions, depending on the instrument.</text><text x="50" y="64" font-size="13.5" fill="#b4532a" font-weight="bold">forward-strand workflow</text><text x="50" y="86" font-size="12" fill="#8a8f94">ordered:</text><text x="130" y="86" font-size="13.5" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AGGATAGG</text><text x="250" y="86" font-size="12" fill="#8a8f94">sample sheet needs:</text><text x="400" y="86" font-size="13.5" fill="#2e6b3f" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AGGATAGG</text><text x="50" y="106" font-size="11.5" fill="#8a8f94">MiSeq, HiSeq 2000/2500, NovaSeq 6000 v1.0</text><text x="50" y="142" font-size="13.5" fill="#b4532a" font-weight="bold">reverse-complement workflow</text><text x="50" y="164" font-size="12" fill="#8a8f94">ordered:</text><text x="130" y="164" font-size="13.5" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AGGATAGG</text><text x="250" y="164" font-size="12" fill="#8a8f94">sample sheet needs:</text><text x="400" y="164" font-size="13.5" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>CCTATCCT</text><text x="50" y="184" font-size="11.5" fill="#8a8f94">iSeq, MiniSeq, NextSeq, HiSeq 3000/4000/X, NovaSeq 6000 v1.5, NovaSeq X</text><text x="40" y="224" font-size="13" fill="#8a8f94">The sample sheet is the file that tells the instrument which index belongs to which sample.</text><text x="40" y="248" font-size="14" fill="#b4532a">Get this wrong and the run looks empty: every read lands in Undetermined, the bin for reads matching no index.</text><text x="40" y="272" font-size="13" fill="#8a8f94">Always check the current instrument documentation — the lists change with reagent versions.</text>
</svg>
