<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 236" width="831" height="236" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="236" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Free adapter in the pool can give a read the wrong sample index.</text><rect x="50" y="54" width="150" height="56" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="125" y="76" font-size="12.5" text-anchor="middle" fill="#23282d">pooled libraries</text><text x="125" y="96" font-size="12" text-anchor="middle" fill="#8a8f94">sample A  +  sample B</text><text x="125" y="128" font-size="12" text-anchor="middle" fill="#a33a28">+ leftover free adapter</text><line x1="210" y1="86" x2="245" y2="86" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 250 86 L 245 82.5 L 245 89.5 Z" fill="#8a8f94"/><rect x="260" y="54" width="180" height="56" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="350" y="78" font-size="12" text-anchor="middle" fill="#23282d">on the flow cell the free</text><text x="350" y="96" font-size="12" text-anchor="middle" fill="#23282d">index primes a molecule</text><line x1="450" y1="86" x2="485" y2="86" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 490 86 L 485 82.5 L 485 89.5 Z" fill="#8a8f94"/><rect x="500" y="54" width="150" height="56" rx="4" fill="#fdf3f0" stroke="#a33a28" stroke-width="1.2"/><text x="575" y="78" font-size="12" text-anchor="middle" fill="#a33a28">sample A read filed</text><text x="575" y="96" font-size="12" text-anchor="middle" fill="#a33a28">under sample B</text><text x="40" y="162" font-size="13.5" fill="#8a8f94">Worse on patterned flow cells with ExAmp chemistry. Typically 0.1–2% of reads.</text><text x="40" y="192" font-size="14" fill="#2e6b3f">Fix: unique dual indexes — a hopped read then carries a pair that belongs to no sample, so it can be discarded.</text><text x="40" y="216" font-size="13.5" fill="#8a8f94">And clean up thoroughly: free adapter is the fuel.</text>
</svg>
