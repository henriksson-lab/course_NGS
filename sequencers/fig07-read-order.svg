<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 218" width="904" height="218" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="586" height="218" fill="none"/>
<text x="36" y="26" font-size="14" fill="#23282d">Four reads, four primers, one molecule — in this order.</text><rect x="60" y="92" width="48" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="84.0" y="108.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5</text><rect x="108" y="92" width="40" height="24" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="128.0" y="108.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">i5</text><rect x="148" y="92" width="70" height="24" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="183.0" y="108.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R1 site</text><rect x="218" y="92" width="150" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="293.0" y="108.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="368" y="92" width="70" height="24" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="403.0" y="108.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R2 site</text><rect x="438" y="92" width="40" height="24" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="458.0" y="108.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">i7</text><rect x="478" y="92" width="48" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="502.0" y="108.025" font-size="11.5" text-anchor="middle" fill="#a33a28">P7</text><line x1="218" y1="132" x2="333" y2="132" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 338 132 L 333 128.5 L 333 135.5 Z" fill="#b4532a"/><text x="346" y="136" font-size="12" fill="#b4532a">1  Read 1 → into the insert</text><line x1="478" y1="76" x2="443" y2="76" stroke="#6b5b8a" stroke-width="1.6" stroke-linecap="round"/><path d="M 438 76 L 443 72.5 L 443 79.5 Z" fill="#6b5b8a"/><text x="484" y="80" font-size="12" fill="#6b5b8a">2  Index 1 (i7)</text><line x1="108" y1="76" x2="143" y2="76" stroke="#6b5b8a" stroke-width="1.6" stroke-linecap="round"/><path d="M 148 76 L 143 72.5 L 143 79.5 Z" fill="#6b5b8a"/><text x="60" y="64" font-size="12" fill="#6b5b8a">3  Index 2 (i5)</text><line x1="368" y1="160" x2="253" y2="160" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 248 160 L 253 156.5 L 253 163.5 Z" fill="#b4532a"/><text x="240" y="164" font-size="12" text-anchor="end" fill="#b4532a">4  Read 2 ← from the other end</text><text x="36" y="198" font-size="14" fill="#23282d">The indexes are read because they are sequence like any other — that is why a sample index must sit next to a primer site.</text>
</svg>
