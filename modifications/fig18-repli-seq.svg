<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 266" width="800" height="266" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="266" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Repli-seq: label new DNA with BrdU, sort cells by position in S phase, sequence the labelled DNA.</text><rect x="40" y="40" width="120" height="26" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="100.0" y="57.55" font-size="13" text-anchor="middle" fill="#23282d">G1</text><rect x="160" y="40" width="140" height="26" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="230.0" y="57.55" font-size="13" text-anchor="middle" fill="#23282d">early S</text><rect x="300" y="40" width="140" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="370.0" y="57.55" font-size="13" text-anchor="middle" fill="#23282d">late S</text><rect x="440" y="40" width="100" height="26" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="490.0" y="57.55" font-size="13" text-anchor="middle" fill="#23282d">G2/M</text><text x="230" y="86" font-size="11.5" text-anchor="middle" fill="#8a8f94">BrdU pulse, then sort by DNA content</text><line x1="40" y1="220" x2="540" y2="220" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><polyline points="40,143 66,139 91,135 116,139 142,167 168,203 193,211 218,207 244,187 270,151 295,139 320,135 346,147 372,175 397,207 422,215 448,211 474,183 499,147 524,139" fill="none" stroke="#23282d" stroke-width="2"/><line x1="40" y1="175" x2="540" y2="175" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="34" y="179" font-size="11.5" text-anchor="end" fill="#8a8f94">0</text><text x="580" y="134" font-size="12.5" fill="#23282d">log2(early / late)</text><text x="120" y="128" font-size="11.5" text-anchor="middle" fill="#b4532a">early-replicating domain</text><text x="210" y="232" font-size="11.5" text-anchor="middle" fill="#1f3b57">late-replicating domain</text><text x="40" y="252.0" font-size="11.5" fill="#8a8f94">chromosome position</text><text x="580" y="156" font-size="12" fill="#23282d">Domains of hundreds of kb to Mb;</text><text x="580" y="172" font-size="12" fill="#23282d">stable between cell types, with</text><text x="580" y="188" font-size="12" fill="#23282d">differentiation-linked exceptions.</text>
</svg>
