<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 242" width="780" height="242" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="242" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Structure probing: a reagent modifies the bases that are free to react.</text><text x="30" y="60" font-size="12.5" fill="#8a8f94">RNA with adduct (orange)</text><line x1="230" y1="56" x2="450" y2="56" stroke="#23282d" stroke-width="2.4" stroke-linecap="round"/><circle cx="340" cy="56" r="6" fill="#b4532a"/><text x="30" y="112.0" font-size="12.5" fill="#23282d" font-weight="bold">truncation</text><line x1="450" y1="108" x2="353" y2="108" stroke="#1f3b57" stroke-width="2.2" stroke-linecap="round"/><path d="M 348 108 L 353 104.5 L 353 111.5 Z" fill="#1f3b57"/><text x="470" y="112" font-size="12" fill="#8a8f94">stops one base before: DMS-seq, icSHAPE</text><text x="30" y="154.0" font-size="12.5" fill="#23282d" font-weight="bold">mutation</text><line x1="450" y1="150" x2="235" y2="150" stroke="#1f3b57" stroke-width="2.2" stroke-linecap="round"/><path d="M 230 150 L 235 146.5 L 235 153.5 Z" fill="#1f3b57"/><circle cx="340" cy="150" r="5" fill="#a33a28"/><text x="470" y="154" font-size="12" fill="#8a8f94">reads through, miscopies: SHAPE-MaP, DMS-MaPseq</text><text x="30" y="204.0" font-size="13.5" fill="#23282d">DMS methylates unpaired A and C. SHAPE reagents acylate the 2'-OH of flexible nucleotides.</text><text x="30" y="224.0" font-size="13.5" fill="#23282d">Mutational profiling keeps full-length reads, so one molecule shows several modified positions.</text>
</svg>
