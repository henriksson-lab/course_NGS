<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 202" width="800" height="202" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="202" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">The CLIP family: freeze the protein on the RNA, then read the footprint.</text><rect x="30" y="40" width="142.0" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="101.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">UV crosslink in cells</text><line x1="175.0" y1="54.0" x2="194.0" y2="54.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 199.0 54.0 L 194.0 50.5 L 194.0 57.5 Z" fill="#8a8f94"/><rect x="202.0" y="40" width="100.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="252.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">lyse, trim RNA</text><line x1="305.0" y1="54.0" x2="324.0" y2="54.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 329.0 54.0 L 324.0 50.5 L 324.0 57.5 Z" fill="#8a8f94"/><rect x="332.0" y="40" width="166.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="415.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">immunoprecipitate protein</text><line x1="501.0" y1="54.0" x2="520.0" y2="54.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 525.0 54.0 L 520.0 50.5 L 520.0 57.5 Z" fill="#8a8f94"/><rect x="528.0" y="40" width="118.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="587.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">ligate 3' adapter</text><rect x="30" y="100" width="166.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="113.0" y="118.2" font-size="12" text-anchor="middle" fill="#23282d">gel, cut RNA-protein band</text><line x1="199.0" y1="114.0" x2="218.0" y2="114.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 223.0 114.0 L 218.0 110.5 L 218.0 117.5 Z" fill="#8a8f94"/><rect x="226.0" y="100" width="88.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="270.0" y="118.2" font-size="12" text-anchor="middle" fill="#23282d">proteinase K</text><line x1="317.0" y1="114.0" x2="336.0" y2="114.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 341.0 114.0 L 336.0 110.5 L 336.0 117.5 Z" fill="#8a8f94"/><rect x="344.0" y="100" width="124.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="406.0" y="118.2" font-size="12" text-anchor="middle" fill="#23282d">reverse transcribe</text><line x1="471.0" y1="114.0" x2="490.0" y2="114.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 495.0 114.0 L 490.0 110.5 L 490.0 117.5 Z" fill="#8a8f94"/><rect x="498.0" y="100" width="106.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="551.0" y="118.2" font-size="12" text-anchor="middle" fill="#23282d">5' adapter, PCR</text><text x="30" y="164.0" font-size="13" fill="#23282d">UV makes a zero-length bond, so only RNA touching the protein survives the washes. Proteinase K leaves</text><text x="30" y="183.0" font-size="13" fill="#23282d">a peptide stub on the nucleotide that was crosslinked, and that stub is what the enzyme reacts to.</text>
</svg>
