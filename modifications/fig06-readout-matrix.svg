<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 304" width="780" height="304" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="304" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">What each base reads as in the sequence data after the method has been applied.</text><line x1="30" y1="40" x2="750" y2="40" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="61.0" font-size="13" fill="#23282d" font-weight="bold">method</text><text x="286" y="61.0" font-size="13" fill="#23282d" font-weight="bold">unmodified C</text><text x="396" y="61.0" font-size="13" fill="#23282d" font-weight="bold">5mC</text><text x="466" y="61.0" font-size="13" fill="#23282d" font-weight="bold">5hmC</text><text x="536" y="61.0" font-size="13" fill="#23282d" font-weight="bold">a C in the read marks</text><line x1="30" y1="70" x2="750" y2="70" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="91.0" font-size="13" fill="#23282d">BS-seq</text><text x="286" y="91.0" font-size="13" fill="#1f3b57">T</text><text x="396" y="91.0" font-size="13" fill="#b4532a">C</text><text x="466" y="91.0" font-size="13" fill="#b4532a">C</text><text x="536" y="91.0" font-size="13" fill="#23282d">5mC or 5hmC</text><line x1="30" y1="100" x2="750" y2="100" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="121.0" font-size="13" fill="#23282d">oxBS-seq</text><text x="286" y="121.0" font-size="13" fill="#1f3b57">T</text><text x="396" y="121.0" font-size="13" fill="#b4532a">C</text><text x="466" y="121.0" font-size="13" fill="#1f3b57">T</text><text x="536" y="121.0" font-size="13" fill="#23282d">5mC only</text><line x1="30" y1="130" x2="750" y2="130" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="151.0" font-size="13" fill="#23282d">TAB-seq</text><text x="286" y="151.0" font-size="13" fill="#1f3b57">T</text><text x="396" y="151.0" font-size="13" fill="#1f3b57">T</text><text x="466" y="151.0" font-size="13" fill="#b4532a">C</text><text x="536" y="151.0" font-size="13" fill="#23282d">5hmC only</text><line x1="30" y1="160" x2="750" y2="160" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="181.0" font-size="13" fill="#23282d">EM-seq</text><text x="286" y="181.0" font-size="13" fill="#1f3b57">T</text><text x="396" y="181.0" font-size="13" fill="#b4532a">C</text><text x="466" y="181.0" font-size="13" fill="#b4532a">C</text><text x="536" y="181.0" font-size="13" fill="#23282d">5mC or 5hmC</text><line x1="30" y1="190" x2="750" y2="190" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="211.0" font-size="13" fill="#23282d">TAPS</text><text x="286" y="211.0" font-size="13" fill="#b4532a">C</text><text x="396" y="211.0" font-size="13" fill="#1f3b57">T</text><text x="466" y="211.0" font-size="13" fill="#1f3b57">T</text><text x="536" y="211.0" font-size="13" fill="#23282d">unmodified C</text><line x1="30" y1="220" x2="750" y2="220" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="241.0" font-size="13" fill="#23282d">TAPS with beta-glucosyltransferase</text><text x="286" y="241.0" font-size="13" fill="#b4532a">C</text><text x="396" y="241.0" font-size="13" fill="#1f3b57">T</text><text x="466" y="241.0" font-size="13" fill="#b4532a">C</text><text x="536" y="241.0" font-size="13" fill="#23282d">unmodified C and 5hmC</text><line x1="30" y1="250" x2="750" y2="250" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="30" y="272.0" font-size="13.5" fill="#23282d">Subtract oxBS from BS and what is left is 5hmC. TAPS inverts the logic: the modified base is the one that</text><text x="30" y="290.9" font-size="13.5" fill="#23282d">changes.</text>
</svg>
