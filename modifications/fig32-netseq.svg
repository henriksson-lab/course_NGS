<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 206" width="750" height="206" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="750" height="206" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Two handles on the same object, the engaged polymerase.</text><rect x="30" y="38" width="330" height="150" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="40" y="60" font-size="13.5" fill="#b4532a" font-weight="bold">run-on (GRO-seq, PRO-seq)</text><text x="40" y="82" font-size="12" fill="#23282d">label: nucleotides the polymerase adds</text><text x="40" y="100.0" font-size="12" fill="#23282d">read: the labelled RNA</text><text x="40" y="118.0" font-size="12" fill="#23282d">needs: polymerase able to extend</text><text x="40" y="136.0" font-size="12" fill="#23282d">caveat: only active polymerases</text><text x="40" y="154.0" font-size="12" fill="#23282d">contribute to the signal</text><rect x="380" y="38" width="330" height="150" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="390" y="60" font-size="13.5" fill="#1f3b57" font-weight="bold">NET-seq, mNET-seq</text><text x="390" y="82" font-size="12" fill="#23282d">label: none; IP of the polymerase</text><text x="390" y="100" font-size="12" fill="#23282d">read: 3' end of RNA inside the complex</text><text x="390" y="118" font-size="12" fill="#23282d">needs: a good Pol II antibody</text><text x="390" y="136" font-size="12" fill="#23282d">caveat: includes polymerases</text><text x="390" y="154" font-size="12" fill="#23282d">that are paused or backtracked</text>
</svg>
