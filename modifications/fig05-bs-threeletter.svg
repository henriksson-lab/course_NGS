<text x="30" y="26" font-size="14" fill="#23282d">After conversion, two different loci can have the same sequence.</text><text x="30" y="66" font-size="12.5" fill="#8a8f94">locus X (genome)</text><text x="190.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="203.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="217.0" y="66" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="230.5" y="66" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="244.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="257.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="271.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="284.5" y="66" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="298.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="311.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="30" y="96" font-size="12.5" fill="#8a8f94">locus Y (genome)</text><text x="190.0" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="203.5" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="217.0" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="230.5" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="244.0" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="257.5" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="271.0" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="284.5" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="298.0" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="311.5" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><line x1="340" y1="66" x2="395" y2="66" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 400 66 L 395 62.5 L 395 69.5 Z" fill="#8a8f94"/><text x="410" y="66" font-size="12.5" fill="#8a8f94">X, all C unmethylated:</text><text x="570.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="583.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="597.0" y="66" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="610.5" y="66" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="624.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="637.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="651.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="664.5" y="66" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="678.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="691.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="410" y="96" font-size="12.5" fill="#8a8f94">Y, unchanged:</text><text x="570.0" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="583.5" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="597.0" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="610.5" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="624.0" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="637.5" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="651.0" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="664.5" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="678.0" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="691.5" y="96" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="30" y="150.0" font-size="13.5" fill="#23282d">The aligner converts reads and genome in silico (C to T on one strand, G to A on the other) and aligns in a</text><text x="30" y="168.9" font-size="13.5" fill="#23282d">three-letter alphabet.</text><text x="30" y="187.8" font-size="13.5" fill="#b4532a">Fewer letters means less unique sequence: repeats multiply, mapping rates fall, and some loci can no longer</text><text x="30" y="206.70000000000002" font-size="13.5" fill="#b4532a">be told apart.</text>
</svg>
