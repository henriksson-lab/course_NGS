<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 258" width="820" height="258" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="258" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">miCLIP: UV crosslinks the antibody to the m6A, so reverse transcription leaves a mark at the site.</text><text x="30" y="66" font-size="12.5" fill="#8a8f94">RNA, 5' to 3'</text><text x="190.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="203.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="217.0" y="66" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="230.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="244.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="257.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="271.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="284.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="221.0" y="46" font-size="11.5" text-anchor="middle" fill="#b4532a">m6A</text><circle cx="221.0" cy="80" r="4" fill="#b4532a"/><line x1="221.0" y1="84" x2="221.0" y2="94" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><text x="231.0" y="98" font-size="11.5" fill="#b4532a">peptide left by the crosslinked antibody</text><text x="30" y="146.0" font-size="12.5" fill="#23282d" font-weight="bold">truncation</text><text x="190.0" y="146" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="203.5" y="146" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="217.0" y="146" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="230.5" y="146" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="244.0" y="146" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="257.5" y="146" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="271.0" y="146" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="284.5" y="146" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><line x1="298.0" y1="162" x2="235.5" y2="162" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 230.5 162 L 235.5 158.5 L 235.5 165.5 Z" fill="#1f3b57"/><text x="316.0" y="150" font-size="12" fill="#8a8f94">cDNA stops at the adduct, so the read starts at the +1 base</text><text x="30" y="200.0" font-size="12.5" fill="#23282d" font-weight="bold">mutation</text><text x="190.0" y="200" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="203.5" y="200" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="217.0" y="200" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="230.5" y="200" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="244.0" y="200" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="257.5" y="200" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="271.0" y="200" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="284.5" y="200" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="316.0" y="200" font-size="12" fill="#8a8f94">read-through: the C at +1 is read as T</text><text x="30" y="240.0" font-size="13.5" fill="#23282d">Both marks are scored against a motif: m6A lives in DRACH sequences, so a call away from one is suspect.</text>
</svg>
