<text x="30" y="24" font-size="14" fill="#23282d">GLORI: the RNA counterpart of bisulfite. Unmodified A is deaminated, m6A resists.</text><text x="210" y="52" font-size="12.5" fill="#8a8f94">1. glyoxal protects G</text><text x="370" y="52" font-size="12.5" fill="#8a8f94">2. nitrite deaminates</text><text x="530" y="52" font-size="12.5" fill="#8a8f94">3. RT and PCR</text><text x="30" y="85" font-size="13" fill="#23282d" font-weight="bold">A</text><rect x="80" y="66" width="70" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="115.0" y="84.375" font-size="12.5" text-anchor="middle" fill="#23282d">A</text><line x1="154" y1="80" x2="201" y2="80" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><path d="M 206 80 L 201 76.5 L 201 83.5 Z" fill="#8a8f94"/><rect x="210" y="66" width="70" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="245.0" y="84.375" font-size="12.5" text-anchor="middle" fill="#23282d">A</text><line x1="284" y1="80" x2="361" y2="80" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><path d="M 366 80 L 361 76.5 L 361 83.5 Z" fill="#8a8f94"/><rect x="370" y="66" width="70" height="28" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="405.0" y="84.375" font-size="12.5" text-anchor="middle" fill="#23282d">I</text><line x1="444" y1="80" x2="521" y2="80" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><path d="M 526 80 L 521 76.5 L 521 83.5 Z" fill="#8a8f94"/><rect x="530" y="66" width="70" height="28" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="565.0" y="84.375" font-size="12.5" text-anchor="middle" fill="#23282d">G</text><text x="30" y="125.0" font-size="13" fill="#23282d" font-weight="bold">m6A</text><rect x="80" y="106" width="70" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="115.0" y="124.375" font-size="12.5" text-anchor="middle" fill="#23282d">m6A</text><line x1="154" y1="120" x2="201" y2="120