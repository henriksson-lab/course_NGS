<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 216" width="740" height="216" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="216" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">GUIDE-seq: a blunt double-stranded tag integrates into breaks in living cells and marks them.</text><line x1="40" y1="62" x2="700" y2="62" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="142" y="55" width="16" height="14" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="150" y="46" font-size="11.5" text-anchor="middle" fill="#b4532a">on-target</text><rect x="352" y="55" width="16" height="14" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="360" y="46" font-size="11.5" text-anchor="middle" fill="#b4532a">off-target 1</text><rect x="552" y="55" width="16" height="14" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="560" y="46" font-size="11.5" text-anchor="middle" fill="#b4532a">off-target 2</text><text x="40" y="92" font-size="12" fill="#8a8f94">Cas9 + guide cut; the dsODN tag (orange) is joined into each break by NHEJ</text><text x="40" y="128.0" font-size="12.5" fill="#23282d" font-weight="bold">shear, ligate adapters, PCR from the tag outward:</text><line x1="60" y1="160" x2="200" y2="160" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="290" y1="160" x2="430" y2="160" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="200" y="152" width="90" height="16" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="245.0" y="164.2" font-size="12" text-anchor="middle" fill="#23282d">tag</text><line x1="196" y1="182" x2="75" y2="182" stroke="#1f3b57" stroke-width="1.8" stroke-linecap="round"/><path d="M 70 182 L 75 178.5 L 75 185.5 Z" fill="#1f3b57"/><line x1="294" y1="182" x2="415" y2="182" stroke="#1f3b57" stroke-width="1.8" stroke-linecap="round"/><path d="M 420 182 L 415 178.5 L 415 185.5 Z" fill="#1f3b57"/><text x="133" y="200" font-size="11.5" text-anchor="middle" fill="#1f3b57">read into genome</text><text x="357" y="200" font-size="11.5" text-anchor="middle" fill="#1f3b57">read into genome</text><text x="480" y="150" font-size="12.5" fill="#23282d">Only molecules that contain the tag</text><text x="480" y="168" font-size="12.5" fill="#23282d">are amplified: background cuts and</text><text x="480" y="186" font-size="12.5" fill="#23282d">unbroken DNA give nothing.</text>
</svg>
