<text x="30" y="26" font-size="14" fill="#23282d">Five answers to 'where is m6A?', each paying a different price.</text><line x1="30" y1="40" x2="890" y2="40" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">method</text><text x="226" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">handle</text><text x="486" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">resolution</text><text x="636" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">antibody</text><text x="736" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">quantitative</text><line x1="30" y1="70" x2="890" y2="70" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="91.0" font-size="12.5" fill="#23282d">m6A-seq (MeRIP)</text><text x="226" y="91.0" font-size="12.5" fill="#23282d">IP of fragments</text><text x="486" y="91.0" font-size="12.5" fill="#23282d">100-200 nt</text><text x="636" y="91.0" font-size="12.5" fill="#23282d">yes</text><text x="736" y="91.0" font-size="12.5" fill="#23282d">relative</text><line x1="30" y1="100" x2="890" y2="100" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="121.0" font-size="12.5" fill="#23282d">miCLIP</text><text x="226" y="121.0" font-size="12.5" fill="#23282d">crosslinked antibody</text><text x="486" y="121.0" font-size="12.5" fill="#23282d">single base</text><text x="636" y="121.0" font-size="12.5" fill="#23282d">yes</text><text x="736" y="121.0" font-size="12.5" fill="#23282d">relative</text><line x1="30" y1="130" x2="890" y2="130" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="151.0" font-size="12.5" fill="#23282d">MAZTER-seq</text><text x="226" y="151.0" font-size="12.5" fill="#23282d">MazF cuts unmethylated ACA</text><text x="486" y="151.0" font-size="12.5" fill="#23282d">ACA sites only</text><text x="636" y="151.0" font-size="12.5" fill="#23282d">no</text><text x="736" y="151.0" font-size="12.5" fill="#23282d">yes</text><line x1="30" y1="160" x2="890" y2="160" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="181.0" font-size="12.5" fill="#23282d">GLORI</text><text x="226" y="181.0" font-size="12.5" fill="#23282d">deamination of A</text><text x="486" y="181.0" font-size="12.5" fill="#23282d">single base</text><text x="636" y="181.0" font-size="12.5" fill="#23282d">no</text><text x="736" y="181.0" font-size="12.5" fill="#23282d">yes, absolute</text><line x1="30" y1="190" x2="890" y2="190" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="211.0" font-size="12.5" fill="#23282d">nanopore direct RNA</text><text x="226" y="211.0" font-size="12.5" fill="#23282d">current signal, no RT</text><text x="486" y="211.0" font-size="12.5" fill="#23282d">statistical</text><text x="636" y="211.0" font-size="12.5" fill="#23282d">no</text><text x="736" y="211.0" font-size="12.5" fill="#23282d">model-dependent</text><line x1="30" y1="220" x2="890" y2="220" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/>
