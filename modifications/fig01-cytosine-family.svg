<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 228" width="766" height="228" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="228" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Five forms of cytosine. The edge that pairs with guanine is the same in all of them.</text><polygon points="90.0,86.0 112.5,99.0 112.5,125.0 90.0,138.0 67.5,125.0 67.5,99.0" fill="none" stroke="#1f3b57" stroke-width="1.6"/><line x1="90" y1="86" x2="90" y2="66" stroke="#23282d" stroke-width="2" stroke-linecap="round"/><text x="90" y="60" font-size="14" text-anchor="middle" fill="#23282d" font-weight="bold">H</text><line x1="112.51599999999999" y1="99.0" x2="128.516" y2="89.0" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><text x="130.516" y="91.0" font-size="11.5" fill="#1f3b57">NH2</text><text x="90" y="158" font-size="14" text-anchor="middle" fill="#23282d" font-weight="bold">C</text><polygon points="240.0,86.0 262.5,99.0 262.5,125.0 240.0,138.0 217.5,125.0 217.5,99.0" fill="none" stroke="#1f3b57" stroke-width="1.6"/><line x1="240" y1="86" x2="240" y2="66" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><text x="240" y="60" font-size="14" text-anchor="middle" fill="#b4532a" font-weight="bold">CH3</text><line x1="262.516" y1="99.0" x2="278.516" y2="89.0" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><text x="280.516" y="91.0" font-size="11.5" fill="#1f3b57">NH2</text><text x="240" y="158" font-size="14" text-anchor="middle" fill="#b4532a" font-weight="bold">5mC</text><polygon points="390.0,86.0 412.5,99.0 412.5,125.0 390.0,138.0 367.5,125.0 367.5,99.0" fill="none" stroke="#1f3b57" stroke-width="1.6"/><line x1="390" y1="86" x2="390" y2="66" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><text x="390" y="60" font-size="14" text-anchor="middle" fill="#b4532a" font-weight="bold">CH2OH</text><line x1="412.516" y1="99.0" x2="428.516" y2="89.0" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><text x="430.516" y="91.0" font-size="11.5" fill="#1f3b57">NH2</text><text x="390" y="158" font-size="14" text-anchor="middle" fill="#b4532a" font-weight="bold">5hmC</text><polygon points="540.0,86.0 562.5,99.0 562.5,125.0 540.0,138.0 517.5,125.0 517.5,99.0" fill="none" stroke="#1f3b57" stroke-width="1.6"/><line x1="540" y1="86" x2="540" y2="66" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><text x="540" y="60" font-size="14" text-anchor="middle" fill="#b4532a" font-weight="bold">CHO</text><line x1="562.516" y1="99.0" x2="578.516" y2="89.0" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><text x="580.516" y="91.0" font-size="11.5" fill="#1f3b57">NH2</text><text x="540" y="158" font-size="14" text-anchor="middle" fill="#b4532a" font-weight="bold">5fC</text><polygon points="690.0,86.0 712.5,99.0 712.5,125.0 690.0,138.0 667.5,125.0 667.5,99.0" fill="none" stroke="#1f3b57" stroke-width="1.6"/><line x1="690" y1="86" x2="690" y2="66" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><text x="690" y="60" font-size="14" text-anchor="middle" fill="#b4532a" font-weight="bold">COOH</text><line x1="712.516" y1="99.0" x2="728.516" y2="89.0" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><text x="730.516" y="91.0" font-size="11.5" fill="#1f3b57">NH2</text><text x="690" y="158" font-size="14" text-anchor="middle" fill="#b4532a" font-weight="bold">5caC</text><text x="30" y="196.0" font-size="13.5" fill="#b4532a">Position 5 carries the mark and points away from the base-pairing edge, so a polymerase copies every one of</text><text x="30" y="214.9" font-size="13.5" fill="#b4532a">them as C.</text>
</svg>
