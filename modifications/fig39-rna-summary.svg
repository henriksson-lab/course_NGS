<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 264" width="930" height="264" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="930" height="264" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">RNA marks and dynamics: each protocol is a handle plus a readout.</text><line x1="30" y1="40" x2="920" y2="40" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="61.0" font-size="13" fill="#23282d" font-weight="bold">question</text><text x="266" y="61.0" font-size="13" fill="#23282d" font-weight="bold">the handle</text><text x="596" y="61.0" font-size="13" fill="#23282d" font-weight="bold">protocols</text><line x1="30" y1="70" x2="920" y2="70" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="91.0" font-size="13" fill="#23282d">Where is a mark?</text><text x="266" y="91.0" font-size="13" fill="#23282d">antibody, or chemistry that spares it</text><text x="596" y="91.0" font-size="13" fill="#23282d">m6A-seq, miCLIP, GLORI</text><line x1="30" y1="100" x2="920" y2="100" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="121.0" font-size="13" fill="#23282d">Where does a protein bind?</text><text x="266" y="121.0" font-size="13" fill="#23282d">UV crosslink, then read the stub</text><text x="596" y="121.0" font-size="13" fill="#23282d">HITS-CLIP, PAR-CLIP, iCLIP, eCLIP</text><line x1="30" y1="130" x2="920" y2="130" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="151.0" font-size="13" fill="#23282d">What was made just now?</text><text x="266" y="151.0" font-size="13" fill="#23282d">label with 4sU, enrich or convert</text><text x="596" y="151.0" font-size="13" fill="#23282d">TT-seq, SLAM-seq</text><line x1="30" y1="160" x2="920" y2="160" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="181.0" font-size="13" fill="#23282d">Where are polymerases?</text><text x="266" y="181.0" font-size="13" fill="#23282d">run-on labelling, or IP of Pol II</text><text x="596" y="181.0" font-size="13" fill="#23282d">GRO-seq, PRO-seq, NET-seq</text><line x1="30" y1="190" x2="920" y2="190" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="211.0" font-size="13" fill="#23282d">Where do transcripts start?</text><text x="266" y="211.0" font-size="13" fill="#23282d">keep the cap</text><text x="596" y="211.0" font-size="13" fill="#23282d">CAGE, PRO-cap</text><line x1="30" y1="220" x2="920" y2="220" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="241.0" font-size="13" fill="#23282d">Which bases are paired?</text><text x="266" y="241.0" font-size="13" fill="#23282d">modify the unpaired ones</text><text x="596" y="241.0" font-size="13" fill="#23282d">DMS-seq, icSHAPE, SHAPE-MaP</text><line x1="30" y1="250" x2="920" y2="250" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/>
</svg>
