<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 238" width="800" height="238" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="238" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Metabolic labelling: add 4-thiouridine (4sU) for a short time; only RNA made in that window carries it.</text><text x="30" y="54" font-size="13" fill="#b4532a" font-weight="bold">enrich</text><rect x="30" y="62" width="70.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="65.0" y="80.2" font-size="12" text-anchor="middle" fill="#23282d">4sU pulse</text><line x1="103.0" y1="76.0" x2="122.0" y2="76.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 127.0 76.0 L 122.0 72.5 L 122.0 79.5 Z" fill="#8a8f94"/><rect x="130.0" y="62" width="118.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="189.0" y="80.2" font-size="12" text-anchor="middle" fill="#23282d">extract, fragment</text><line x1="251.0" y1="76.0" x2="270.0" y2="76.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 275.0 76.0 L 270.0 72.5 L 270.0 79.5 Z" fill="#8a8f94"/><rect x="278.0" y="62" width="142.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="349.0" y="80.2" font-size="12" text-anchor="middle" fill="#23282d">biotinylate the thiol</text><line x1="423.0" y1="76.0" x2="442.0" y2="76.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 447.0 76.0 L 442.0 72.5 L 442.0 79.5 Z" fill="#8a8f94"/><rect x="450.0" y="62" width="148.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="524.0" y="80.2" font-size="12" text-anchor="middle" fill="#23282d">streptavidin pull-down</text><text x="30" y="128.0" font-size="13" fill="#b4532a" font-weight="bold">convert</text><rect x="30" y="136" width="70.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="65.0" y="154.2" font-size="12" text-anchor="middle" fill="#23282d">4sU pulse</text><line x1="103.0" y1="150.0" x2="122.0" y2="150.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 127.0 150.0 L 122.0 146.5 L 122.0 153.5 Z" fill="#8a8f94"/><rect x="130.0" y="136" width="160.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="210.0" y="154.2" font-size="12" text-anchor="middle" fill="#23282d">alkylate (iodoacetamide)</text><line x1="293.0" y1="150.0" x2="312.0" y2="150.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 317.0 150.0 L 312.0 146.5 L 312.0 153.5 Z" fill="#8a8f94"/><rect x="320.0" y="136" width="124.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="382.0" y="154.2" font-size="12" text-anchor="middle" fill="#23282d">reverse transcribe</text><line x1="447.0" y1="150.0" x2="466.0" y2="150.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 471.0 150.0 L 466.0 146.5 L 466.0 153.5 Z" fill="#8a8f94"/><rect x="474.0" y="136" width="94.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="521.0" y="154.2" font-size="12" text-anchor="middle" fill="#23282d">4sU read as C</text><text x="30" y="200.0" font-size="13" fill="#23282d">Enrichment: separate new from old RNA physically (TT-seq, with fragmentation first). Conversion: no</text><text x="30" y="219.0" font-size="13" fill="#23282d">separation, the new RNA is the reads with T-to-C mismatches (SLAM-seq, TimeLapse-seq).</text>
</svg>
