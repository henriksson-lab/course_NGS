<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 240" width="724" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="240" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Repair-seq: knock down one repair gene per cell, cut one fixed site, read the outcomes.</text><rect x="30" y="40" width="214.0" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="137.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">pool of cells, one knockdown each</text><line x1="247.0" y1="54.0" x2="266.0" y2="54.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 271.0 54.0 L 266.0 50.5 L 266.0 57.5 Z" fill="#8a8f94"/><rect x="274.0" y="40" width="166.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="357.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">Cas9 cuts the same target</text><line x1="443.0" y1="54.0" x2="462.0" y2="54.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 467.0 54.0 L 462.0 50.5 L 462.0 57.5 Z" fill="#8a8f94"/><rect x="470.0" y="40" width="238.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="589.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">amplicon: knockdown barcode + outcome</text><text x="30" y="104.0" font-size="12.5" fill="#8a8f94">outcome spectrum per knockdown (schematic)</text><rect x="40" y="112" width="60" height="50" fill="#b4532a"/><rect x="40" y="161.5" width="60" height="27" fill="#1f3b57"/><rect x="40" y="188.5" width="60" height="14" fill="#c9cdd1"/><text x="70" y="222" font-size="11.5" text-anchor="middle" fill="#23282d">control</text><rect x="160" y="112" width="60" height="18" fill="#b4532a"/><rect x="160" y="130.0" width="60" height="50" fill="#1f3b57"/><rect x="160" y="179.5" width="60" height="22" fill="#c9cdd1"/><text x="190" y="222" font-size="11.5" text-anchor="middle" fill="#23282d">knockdown A</text><rect x="280" y="112" width="60" height="63" fill="#b4532a"/><rect x="280" y="175.0" width="60" height="9" fill="#1f3b57"/><rect x="280" y="184.0" width="60" height="18" fill="#c9cdd1"/><text x="310" y="222" font-size="11.5" text-anchor="middle" fill="#23282d">knockdown B</text><rect x="440" y="116" width="12" height="12" fill="#b4532a"/><text x="458" y="127" font-size="12" fill="#23282d">short insertions</text><rect x="440" y="138" width="12" height="12" fill="#1f3b57"/><text x="458" y="149" font-size="12" fill="#23282d">deletions with microhomology</text><rect x="440" y="160" width="12" height="12" fill="#c9cdd1"/><text x="458" y="171" font-size="12" fill="#23282d">other / unedited</text><text x="440" y="200" font-size="12" fill="#23282d">A change in the mix, not the total, tells you</text><text x="440" y="218" font-size="12" fill="#23282d">what the knocked-down gene does.</text>
</svg>
