<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 206" width="780" height="206" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="206" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">E/L Repli-seq builds the library first and selects the labelled DNA afterwards.</text><rect x="30" y="40" width="184.0" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="122.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">sorted early or late S cells</text><line x1="217.0" y1="54.0" x2="236.0" y2="54.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 241.0 54.0 L 236.0 50.5 L 236.0 57.5 Z" fill="#8a8f94"/><rect x="244.0" y="40" width="100.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="294.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">lyse, sonicate</text><line x1="347.0" y1="54.0" x2="366.0" y2="54.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 371.0 54.0 L 366.0 50.5 L 366.0 57.5 Z" fill="#8a8f94"/><rect x="374.0" y="40" width="196.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="472.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">end-prep, ligate adapter, USER</text><rect x="30" y="100" width="64.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="62.0" y="118.2" font-size="12" text-anchor="middle" fill="#23282d">denature</text><line x1="97.0" y1="114.0" x2="116.0" y2="114.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 121.0 114.0 L 116.0 110.5 L 116.0 117.5 Z" fill="#8a8f94"/><rect x="124.0" y="100" width="190.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="219.0" y="118.2" font-size="12" text-anchor="middle" fill="#23282d">anti-BrdU immunoprecipitation</text><line x1="317.0" y1="114.0" x2="336.0" y2="114.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 341.0 114.0 L 336.0 110.5 L 336.0 117.5 Z" fill="#8a8f94"/><rect x="344.0" y="100" width="124.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="406.0" y="118.2" font-size="12" text-anchor="middle" fill="#23282d">release, index PCR</text><text x="30" y="168.0" font-size="13" fill="#23282d">Why this order: BrdU is only a handle for pulling DNA down. The adapters are already on, so the</text><text x="30" y="186.2" font-size="13" fill="#23282d">pulled-down strands can be amplified directly. Adapters cannot easily be added to single-stranded DNA.</text>
</svg>
