<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 240" width="820" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="240" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Finding transcription start sites: keep only RNA that still has its cap.</text><text x="30" y="56" font-size="12.5" fill="#23282d">capped, full-length</text><circle cx="200" cy="52" r="6" fill="#b4532a"/><line x1="206" y1="52" x2="520" y2="52" stroke="#23282d" stroke-width="2.4" stroke-linecap="round"/><text x="30" y="86" font-size="12.5" fill="#23282d">broken, no cap</text><line x1="300" y1="82" x2="520" y2="82" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round"/><text x="540" y="56" font-size="12" fill="#b4532a">5' end of read = start site</text><text x="540" y="86" font-size="12" fill="#8a8f94">5' end = a cut, not a start</text><rect x="30" y="116" width="208.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="134.0" y="134.2" font-size="12" text-anchor="middle" fill="#23282d">periodate-oxidise cap and 3' end</text><line x1="241.0" y1="130.0" x2="260.0" y2="130.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 265.0 130.0 L 260.0 126.5 L 260.0 133.5 Z" fill="#8a8f94"/><rect x="268.0" y="116" width="82.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="309.0" y="134.2" font-size="12" text-anchor="middle" fill="#23282d">biotinylate</text><line x1="353.0" y1="130.0" x2="372.0" y2="130.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 377.0 130.0 L 372.0 126.5 L 372.0 133.5 Z" fill="#8a8f94"/><rect x="380.0" y="116" width="94.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="427.0" y="134.2" font-size="12" text-anchor="middle" fill="#23282d">RNase I trims</text><line x1="477.0" y1="130.0" x2="496.0" y2="130.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 501.0 130.0 L 496.0 126.5 L 496.0 133.5 Z" fill="#8a8f94"/><rect x="504.0" y="116" width="166.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="587.0" y="134.2" font-size="12" text-anchor="middle" fill="#23282d">streptavidin keeps capped</text><rect x="30" y="164" width="268.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="164.0" y="182.2" font-size="12" text-anchor="middle" fill="#23282d">or: reverse transcriptase adds Cs at a cap</text><line x1="301.0" y1="178.0" x2="320.0" y2="178.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 325.0 178.0 L 320.0 174.5 L 320.0 181.5 Z" fill="#8a8f94"/><rect x="328.0" y="164" width="214.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="435.0" y="182.2" font-size="12" text-anchor="middle" fill="#23282d">template-switch oligo (GGG) pairs</text><line x1="545.0" y1="178.0" x2="564.0" y2="178.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 569.0 178.0 L 564.0 174.5 L 564.0 181.5 Z" fill="#8a8f94"/><rect x="572.0" y="164" width="166.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="655.0" y="182.2" font-size="12" text-anchor="middle" fill="#23282d">5' end enters the library</text><text x="30" y="222.0" font-size="13.5" fill="#23282d">CAGE: cap trapping. Template switching: the enzyme adds extra Cs preferentially at a cap.</text>
</svg>
