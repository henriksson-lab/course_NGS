<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 206" width="800" height="206" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="206" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Three ways of finding where a nuclease cuts. Each one has a different handle.</text><rect x="30" y="38" width="245" height="150" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="40" y="60" font-size="13.5" fill="#1f3b57" font-weight="bold">GUIDE-seq</text><text x="40" y="82" font-size="12" fill="#23282d">where: living cells</text><text x="40" y="100.0" font-size="12" fill="#23282d">handle: dsODN integrated at breaks</text><text x="40" y="118.0" font-size="12" fill="#23282d">needs: transfection of the tag</text><text x="40" y="136.0" font-size="12" fill="#23282d">misses: cells that do not take</text><text x="40" y="154.0" font-size="12" fill="#23282d">up the tag; tag bias at sites</text><rect x="285" y="38" width="245" height="150" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="295" y="60" font-size="13.5" fill="#b4532a" font-weight="bold">CHANGE-seq</text><text x="295" y="82" font-size="12" fill="#23282d">where: naked genomic DNA</text><text x="295" y="100" font-size="12" fill="#23282d">handle: circle opened by Cas9</text><text x="295" y="118" font-size="12" fill="#23282d">needs: no cells at all</text><text x="295" y="136" font-size="12" fill="#23282d">misses: chromatin context,</text><text x="295" y="154" font-size="12" fill="#23282d">so reports potential sites</text><rect x="540" y="38" width="245" height="150" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="550" y="60" font-size="13.5" fill="#2e6b3f" font-weight="bold">DISCOVER-seq</text><text x="550" y="82" font-size="12" fill="#23282d">where: cells or tissue in vivo</text><text x="550" y="100" font-size="12" fill="#23282d">handle: MRE11 ChIP-seq</text><text x="550" y="118" font-size="12" fill="#23282d">needs: no tag, no delivery</text><text x="550" y="136" font-size="12" fill="#23282d">misses: sites repaired before</text><text x="550" y="154" font-size="12" fill="#23282d">the factor is captured</text>
</svg>
