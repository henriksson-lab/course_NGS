y="166" width="121.5" height="6" fill="#1f3b57"/><rect x="281.0" y="165" width="13.5" height="8" fill="#a33a28"/><rect x="254.0" y="176" width="67.5" height="6" fill="#1f3b57"/><rect x="281.0" y="175" width="13.5" height="8" fill="#a33a28"/><text x="380.0" y="172" font-size="12" fill="#8a8f94">T to C in every read that covers the 4-thiouridine</text><text x="30" y="210.0" font-size="13.5" fill="#23282d">Truncation needs the enzyme to stop and the library to keep the truncated molecules.</text><text x="30" y="230.0" font-size="13.5" fill="#23282d">Mutation needs the enzyme to read through and miscopy. The two are often both present.</text>
