<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 254" width="740" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="254" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">GRO-seq: isolate nuclei, let the engaged polymerases run on briefly with labelled nucleotides.</text><line x1="40" y1="96" x2="700" y2="96" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><line x1="64" y1="88" x2="64" y2="104" stroke="#1f3b57" stroke-width="2.2" stroke-linecap="round"/><text x="44" y="80" font-size="11.5" fill="#8a8f94">promoter</text><line x1="140" y1="76" x2="225" y2="76" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 230 76 L 225 72.5 L 225 79.5 Z" fill="#8a8f94"/><text x="238" y="80" font-size="11" fill="#8a8f94">direction of transcription</text><circle cx="200" cy="96" r="8" fill="#1f3b57"/><line x1="166" y1="140" x2="184.7" y2="120.2" stroke="#23282d" stroke-width="1.6" stroke-linecap="round"/><line x1="184.7" y1="120.2" x2="200" y2="104" stroke="#b4532a" stroke-width="4.0" stroke-linecap="round"/><circle cx="380" cy="96" r="8" fill="#1f3b57"/><line x1="310" y1="140" x2="348.5" y2="120.2" stroke="#23282d" stroke-width="1.6" stroke-linecap="round"/><line x1="348.5" y1="120.2" x2="380" y2="104" stroke="#b4532a" stroke-width="4.0" stroke-linecap="round"/><circle cx="560" cy="96" r="8" fill="#1f3b57"/><line x1="508" y1="140" x2="536.6" y2="120.2" stroke="#23282d" stroke-width="1.6" stroke-linecap="round"/><line x1="536.6" y1="120.2" x2="560" y2="104" stroke="#b4532a" stroke-width="4.0" stroke-linecap="round"/><text x="170" y="166" font-size="12" fill="#b4532a">labelled run-on RNA (orange): the 3' piece each polymerase added after the label went in</text><text x="40" y="196.0" font-size="12.5" fill="#23282d">anti-BrdU beads capture labelled RNA only</text><text x="40" y="216.0" font-size="12.5" fill="#23282d">Reads are strand-specific, so each polymerase is placed on one strand.</text><text x="40" y="236.0" font-size="12.5" fill="#23282d">Promoters show a sense peak (pausing) and an antisense peak (divergent transcription).</text>
</svg>
