<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 244" width="740" height="244" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="244" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">GRO-seq: isolate nuclei, let the engaged polymerases run on briefly with labelled nucleotides.</text><line x1="40" y1="90" x2="700" y2="90" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><text x="60" y="78" font-size="11.5" fill="#8a8f94">promoter</text><line x1="100" y1="108" x2="175" y2="108" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 180 108 L 175 104.5 L 175 111.5 Z" fill="#8a8f94"/><text x="190" y="112" font-size="11" fill="#8a8f94">direction of transcription</text><circle cx="170" cy="90" r="8" fill="#1f3b57"/><line x1="170" y1="98" x2="142" y2="126" stroke="#23282d" stroke-width="1.6" stroke-linecap="round"/><line x1="142" y1="126" x2="136" y2="130" stroke="#b4532a" stroke-width="4.0" stroke-linecap="round"/><circle cx="330" cy="90" r="8" fill="#1f3b57"/><line x1="330" y1="98" x2="270" y2="126" stroke="#23282d" stroke-width="1.6" stroke-linecap="round"/><line x1="270" y1="126" x2="264" y2="130" stroke="#b4532a" stroke-width="4.0" stroke-linecap="round"/><circle cx="520" cy="90" r="8" fill="#1f3b57"/><line x1="520" y1="98" x2="476" y2="126" stroke="#23282d" stroke-width="1.6" stroke-linecap="round"/><line x1="476" y1="126" x2="470" y2="130" stroke="#b4532a" stroke-width="4.0" stroke-linecap="round"/><text x="190" y="150" font-size="12" fill="#b4532a">labelled run-on RNA (orange), extended from where each polymerase was</text><text x="40" y="186.0" font-size="12.5" fill="#23282d">anti-BrdU beads capture labelled RNA only</text><text x="40" y="206.0" font-size="12.5" fill="#23282d">Reads are strand-specific, so each polymerase is placed on one strand.</text><text x="40" y="226.0" font-size="12.5" fill="#23282d">Promoters show a sense peak (pausing) and an antisense peak (divergent transcription).</text>
</svg>
