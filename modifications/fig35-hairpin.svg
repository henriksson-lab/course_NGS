4" height="1" fill="#8a8f94"/><rect x="182" y="183.0" width="24" height="7" fill="#8a8f94"/><rect x="216" y="190.0" width="24" height="1" fill="#8a8f94"/><rect x="250" y="127.0" width="24" height="63" fill="#b4532a"/><rect x="284" y="120.0" width="24" height="70" fill="#b4532a"/><rect x="318" y="134.0" width="24" height="56" fill="#b4532a"/><rect x="352" y="190.0" width="24" height="1" fill="#8a8f94"/><rect x="386" y="183.0" width="24" height="7" fill="#8a8f94"/><rect x="420" y="183.0" width="24" height="7" fill="#8a8f94"/><text x="110" y="190" font-size="12" text-anchor="end" fill="#8a8f94">DMS signal</text><text x="110" y="106" font-size="12" text-anchor="end" fill="#8a8f94">sequence</text><text x="490" y="170" font-size="12" fill="#8a8f94">G and U give no signal: DMS acts on A and C only</text><text x="30" y="222.0" font-size="13" fill="#23282d">Loop A residues are high; stem C residues are low. A sequence that is paired in the model but reactive in the</text><text x="30" y="240.2" font-size="13" fill="#23282d">data is a clue the model is wrong.</text>
