<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 270" width="1060" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="1060" height="270" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">EM-seq: an ordinary library, converted after the adapters are on.</text><text x="40" y="67" font-size="12" fill="#23282d">1-2  fragment, end repair, dA-tail</text><rect x="300" y="52" width="14" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="307.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#b4532a">A</text><rect x="314" y="52" width="210" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="419.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="524" y="52" width="14" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="531.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#b4532a">A</text><text x="700" y="67" font-size="11.5" fill="#8a8f94">controls spiked in here</text><text x="40" y="101.0" font-size="12" fill="#23282d">3 ligate the 5mC adapter</text><rect x="300" y="86" width="84" height="22" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="342.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">adapter 5mC</text><rect x="384" y="86" width="210" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="489.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="594" y="86" width="84" height="22" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="636.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">adapter 5mC</text><text x="700" y="101" font-size="11.5" fill="#8a8f94">its cytosines are methylated</text><text x="40" y="135.0" font-size="12" fill="#23282d">4 TET2 + BGT protect</text><rect x="300" y="120" width="84" height="22" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="342.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">adapter 5mC</text><rect x="384" y="120" width="210" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="489.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert, 5mC protected</text><rect x="594" y="120" width="84" height="22" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="636.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">adapter 5mC</text><text x="700" y="135" font-size="11.5" fill="#8a8f94">5mC and 5hmC made unreadable to the deaminase</text><text x="40" y="169.0" font-size="12" fill="#23282d">5 APOBEC3A deaminates</text><rect x="300" y="154" width="84" height="22" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="342.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">adapter 5mC</text><rect x="384" y="154" width="210" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="489.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#b4532a">insert, every bare C now U</text><rect x="594" y="154" width="84" height="22" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="636.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">adapter 5mC</text><text x="700" y="169" font-size="11.5" fill="#8a8f94">adapters survive; the insert does not</text><text x="40" y="203.0" font-size="12" fill="#23282d">6 amplify and index</text><rect x="300" y="188" width="64" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="332.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="364" y="188" width="210" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="469.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#b4532a">insert, U read as T</text><rect x="574" y="188" width="64" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="606.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="700" y="203" font-size="11.5" fill="#8a8f94">uracil-tolerant polymerase</text><text x="40" y="238.0" font-size="13.5" fill="#b4532a">The adapter is on before the chemistry starts, so the molecule that goes into the deaminase is already a</text><text x="40" y="256.9" font-size="13.5" fill="#b4532a">library.</text>
</svg>
