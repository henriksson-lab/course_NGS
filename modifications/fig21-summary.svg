<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 294" width="860" height="294" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="294" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Every method is a way of turning a chemical difference into a sequence difference.</text><line x1="30" y1="40" x2="840" y2="40" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="61.0" font-size="13" fill="#23282d" font-weight="bold">question</text><text x="266" y="61.0" font-size="13" fill="#23282d" font-weight="bold">the handle</text><text x="596" y="61.0" font-size="13" fill="#23282d" font-weight="bold">protocols</text><line x1="30" y1="70" x2="840" y2="70" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="91.0" font-size="13" fill="#23282d">Which C is methylated?</text><text x="266" y="91.0" font-size="13" fill="#23282d">a base change that depends on the mark</text><text x="596" y="91.0" font-size="13" fill="#23282d">BS-seq, EM-seq, TAPS</text><line x1="30" y1="100" x2="840" y2="100" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="121.0" font-size="13" fill="#23282d">5mC or 5hmC?</text><text x="266" y="121.0" font-size="13" fill="#23282d">protect one, convert the other</text><text x="596" y="121.0" font-size="13" fill="#23282d">oxBS-seq, TAB-seq</text><line x1="30" y1="130" x2="840" y2="130" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="151.0" font-size="13" fill="#23282d">Which CpG, cheaply?</text><text x="266" y="151.0" font-size="13" fill="#23282d">restriction enzyme enrichment</text><text x="596" y="151.0" font-size="13" fill="#23282d">RRBS</text><line x1="30" y1="160" x2="840" y2="160" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="181.0" font-size="13" fill="#23282d">Where is DNA broken?</text><text x="266" y="181.0" font-size="13" fill="#23282d">the free end is the handle</text><text x="596" y="181.0" font-size="13" fill="#23282d">END-seq, BLESS</text><line x1="30" y1="190" x2="840" y2="190" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="211.0" font-size="13" fill="#23282d">Where does a nuclease cut?</text><text x="266" y="211.0" font-size="13" fill="#23282d">tag the break, or open a circle</text><text x="596" y="211.0" font-size="13" fill="#23282d">GUIDE-seq, CHANGE-seq</text><line x1="30" y1="220" x2="840" y2="220" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="241.0" font-size="13" fill="#23282d">How was it repaired?</text><text x="266" y="241.0" font-size="13" fill="#23282d">sequence across the cut</text><text x="596" y="241.0" font-size="13" fill="#23282d">Repair-seq</text><line x1="30" y1="250" x2="840" y2="250" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="271.0" font-size="13" fill="#23282d">When does it replicate?</text><text x="266" y="271.0" font-size="13" fill="#23282d">label the new strand, or count copies</text><text x="596" y="271.0" font-size="13" fill="#23282d">E/L Repli-seq</text><line x1="30" y1="280" x2="840" y2="280" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/>
</svg>
