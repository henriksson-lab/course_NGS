<text x="30" y="18" font-size="14" fill="#23282d">Resection moves the end away from the break. END-seq reads start at the end that is left.</text><line x1="340" y1="50" x2="340" y2="130" stroke="#b4532a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><text x="340" y="44" font-size="11.5" text-anchor="middle" fill="#b4532a">original break</text><text x="30" y="66" font-size="12" fill="#8a8f94">after resection</text><line x1="40" y1="70" x2="340" y2="70" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="butt"/><line x1="40" y1="78" x2="260" y2="78" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="butt"/><line x1="420" y1="70" x2="640" y2="70" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="butt"/><line x1="340" y1="78" x2="640" y2="78" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="butt"/><text x="300" y="98" font-size="11" text-anchor="middle" fill="#8a8f94">3' overhang</text><text x="380" y="98" font-size="11" text-anchor="middle" fill="#8a8f94">3' overhang</text><text x="30" y="150.0" font-size="12" fill="#8a8f94">ExoVII + ExoT remove the overhang</text><line x1="40" y1="156" x2="260" y2="156" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="butt"/><line x1="40" y1="164" x2="260" y2="164" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="butt"/><line x1="420" y1="156" x2="640" y2="156" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="butt"/><line x1="420" y1="164" x2="640" y2="164" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="butt"/><line x1="258" y1="186" x2="175" y2="186" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><path d="M 170 186 L 175 182.5 L 175 189.5 Z" fill="#b4532a"/><line x1="422" y1="186" x2="505" y2="186" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><path d="M 510 186 L 505 182.5 L 505 189.5 Z" fill="#b4532a"/><text x="215" y="206" font-size="12" text-anchor="middle" fill="#b4532a">read 1</text><text x="465" y="206" font-size="12" text-anchor="middle" fill="#b4532a">read 1</text><line x1="260" y1="176" x2="260" y2="224" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="420" y1="176" x2="420" y2="224" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="262" y1="222" x2="418" y2="222" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><text x="340" y="240" font-size="12" text-anchor="middle" fill="#2e6b3f">gap = resected DNA on both sides</text>
