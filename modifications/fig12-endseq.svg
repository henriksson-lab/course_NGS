<text x="30" y="22" font-size="14" fill="#23282d">END-seq: the first adapter goes on in the agarose plug, before any fragmenting.</text><text x="30" y="46" font-size="12.5" fill="#23282d" font-weight="bold">1. cells in agarose</text><text x="190" y="46" font-size="12.5" fill="#23282d" font-weight="bold">2. blunt, A-tail, hairpin 1</text><text x="350" y="46" font-size="12.5" fill="#23282d" font-weight="bold">3. sonicate</text><text x="510" y="46" font-size="12.5" fill="#23282d" font-weight="bold">4. streptavidin</text><text x="670" y="46" font-size="12.5" fill="#23282d" font-weight="bold">5. hairpin 2, USER, PCR</text><line x1="30" y1="84" x2="85" y2="84" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="butt"/><line x1="30" y1="91" x2="85" y2="91" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="butt"/><line x1="105" y1="84" x2="160" y2="84" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="butt"/><line x1="105" y1="91" x2="160" y2="91" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="butt"/><text x="95" y="118" font-size="11.5" text-anchor="middle" fill="#b4532a">break</text><line x1="190" y1="84" x2="240" y2="84" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="butt"/><line x1="190" y1="91" x2="240" y2="91" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="butt"/><rect x="240" y="81" width="12" height="13" fill="#b4532a" opacity="0.9"/><line x1="274" y1="84" x2="324" y2="84" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="butt"/><line x1="274" y1="91" x2="324" y2="91" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="butt"/><rect x="262" y="81" width="12" height="13" fill="#b4532a" opacity="0.9"/><circle cx="246" cy="79" r="3.5" fill="#a33a28"/><circle cx="268" cy="79" r="3.5" fill="#a33a28"/><text x="257" y="118" font-size="11.5" text-anchor="middle" fill="#a33a28">biotin</text><line x1="350" y1="84" x2="380" y2="84" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="butt"/><line x1="350" y1="91" x2="380" y2="91" stroke="#4a6b8a" stroke-widt