<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 779 236" width="779" height="236" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="236" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">No label needed: in S phase, early-replicating DNA has already been copied, so its copy number is higher.</text><text x="30" y="62" font-size="12.5" fill="#23282d" font-weight="bold">G1</text><text x="30" y="128.0" font-size="12.5" fill="#23282d" font-weight="bold">mid-S</text><text x="160.0" y="46" font-size="11.5" text-anchor="middle" fill="#b4532a">early</text><line x1="90" y1="60" x2="222" y2="60" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="90" y1="68" x2="222" y2="68" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="90" y1="110" x2="222" y2="110" stroke="#b4532a" stroke-width="3" stroke-linecap="butt"/><line x1="90" y1="118" x2="222" y2="118" stroke="#b4532a" stroke-width="3" stroke-linecap="butt"/><line x1="90" y1="126" x2="222" y2="126" stroke="#b4532a" stroke-width="3" stroke-linecap="butt"/><line x1="90" y1="134" x2="222" y2="134" stroke="#b4532a" stroke-width="3" stroke-linecap="butt"/><text x="300.0" y="46" font-size="11.5" text-anchor="middle" fill="#1f3b57">late</text><line x1="230" y1="60" x2="362" y2="60" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="230" y1="68" x2="362" y2="68" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="230" y1="110" x2="362" y2="110" stroke="#1f3b57" stroke-width="3" stroke-linecap="butt"/><line x1="230" y1="118" x2="362" y2="118" stroke="#1f3b57" stroke-width="3" stroke-linecap="butt"/><text x="440.0" y="46" font-size="11.5" text-anchor="middle" fill="#b4532a">early</text><line x1="370" y1="60" x2="502" y2="60" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="370" y1="68" x2="502" y2="68" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="370" y1="110" x2="502" y2="110" stroke="#b4532a" stroke-width="3" stroke-linecap="butt"/><line x1="370" y1="118" x2="502" y2="118" stroke="#b4532a" stroke-width="3" stroke-linecap="butt"/><line x1="370" y1="126" x2="502" y2="126" stroke="#b4532a" stroke-width="3" stroke-linecap="butt"/><line x1="370" y1="134" x2="502" y2="134" stroke="#b4532a" stroke-width="3" stroke-linecap="butt"/><text x="580.0" y="46" font-size="11.5" text-anchor="middle" fill="#1f3b57">late</text><line x1="510" y1="60" x2="642" y2="60" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="510" y1="68" x2="642" y2="68" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="510" y1="110" x2="642" y2="110" stroke="#1f3b57" stroke-width="3" stroke-linecap="butt"/><line x1="510" y1="118" x2="642" y2="118" stroke="#1f3b57" stroke-width="3" stroke-linecap="butt"/><text x="30" y="196.0" font-size="13.5" fill="#23282d">Coverage ratio S / G1: about 2 in early regions, about 1 in late regions.</text><text x="30" y="218.0" font-size="13.5" fill="#23282d">Single cells work the same way: one S-phase cell gives a binary early/late map per bin.</text>
</svg>
