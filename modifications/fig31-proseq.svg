<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 222" width="760" height="222" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="222" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">PRO-seq: one biotin nucleotide is added, so the read's 3' end is the polymerase's position.</text><text x="30" y="66" font-size="12.5" fill="#8a8f94">nascent RNA in a polymerase</text><text x="230.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="243.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="257.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="270.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="284.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="297.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="311.0" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="324.5" y="66" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="338.0" y="66" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><circle cx="342.0" cy="46" r="5" fill="#b4532a"/><text x="352.0" y="44" font-size="12" fill="#b4532a">biotin-NTP</text><text x="375.5" y="66" font-size="12" fill="#8a8f94">polymerase stops: the biotin nucleotide is a poor</text><text x="375.5" y="84" font-size="12" fill="#8a8f94">substrate for the next addition</text><text x="30" y="128.0" font-size="12.5" fill="#23282d">read maps with its 3' end at</text><line x1="230" y1="134" x2="351.5" y2="134" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="351.5" cy="134" r="4" fill="#b4532a"/><text x="365.5" y="138" font-size="12" fill="#b4532a">single-nucleotide position of the active site</text><text x="30" y="184.0" font-size="13" fill="#23282d">GRO-seq (BrUTP) labels a longer stretch, so its 3' end is less precise. PRO-cap adds enrichment of</text><text x="30" y="203.0" font-size="13" fill="#23282d">capped 5' ends, which maps start sites of the transcripts that polymerases have just begun.</text>
</svg>
