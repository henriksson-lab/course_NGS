<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 238" width="780" height="238" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="238" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Spike-in controls: unmethylated lambda DNA measures how much unmethylated C survives as C.</text><text x="30" y="52" font-size="13" fill="#8a8f94">Suppose 0.5% of unmethylated C stays C (conversion 99.5%).</text><text x="30" y="76" font-size="12" fill="#8a8f94">true level</text><text x="150" y="76" font-size="12" fill="#8a8f94">blue bar = true, orange bar = apparent</text><text x="30" y="104.0" font-size="12.5" fill="#23282d">2%</text><rect x="150" y="90" width="8.0" height="11" fill="#1f3b57"/><rect x="150" y="103" width="10.0" height="11" fill="#b4532a"/><text x="167.96" y="112" font-size="12" fill="#b4532a">2.5%</text><text x="30" y="138.0" font-size="12.5" fill="#23282d">20%</text><rect x="150" y="124" width="80.0" height="11" fill="#1f3b57"/><rect x="150" y="137" width="81.6" height="11" fill="#b4532a"/><text x="239.60000000000002" y="146" font-size="12" fill="#b4532a">20.4%</text><text x="30" y="172.0" font-size="12.5" fill="#23282d">80%</text><rect x="150" y="158" width="320.0" height="11" fill="#1f3b57"/><rect x="150" y="171" width="320.4" height="11" fill="#b4532a"/><text x="478.40000000000003" y="180" font-size="12" fill="#b4532a">80.1%</text><text x="30" y="206.0" font-size="13.5" fill="#23282d">At a 2% site the error is a quarter of the signal; at 80% it hardly matters. The same control in reverse</text><text x="30" y="224.9" font-size="13.5" fill="#23282d">(CpG-methylated pUC19) checks that protection worked.</text>
</svg>
