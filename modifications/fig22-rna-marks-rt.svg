<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="960" height="260" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">RNA marks are mostly silent to the enzyme that makes the library.</text><line x1="30" y1="40" x2="950" y2="40" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">mark</text><text x="186" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">what reverse transcriptase does</text><text x="516" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">what you can do about it</text><line x1="30" y1="70" x2="950" y2="70" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="91.0" font-size="12.5" fill="#23282d">m6A</text><text x="186" y="91.0" font-size="12.5" fill="#23282d">copies it as A (reads straight through)</text><text x="516" y="91.0" font-size="12.5" fill="#23282d">antibody, or chemistry that treats A and m6A differently</text><line x1="30" y1="100" x2="950" y2="100" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="121.0" font-size="12.5" fill="#b4532a">inosine (A-to-I)</text><text x="186" y="121.0" font-size="12.5" fill="#23282d">copies it as G</text><text x="516" y="121.0" font-size="12.5" fill="#23282d">read the A-to-G mismatch directly</text><line x1="30" y1="130" x2="950" y2="130" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="151.0" font-size="12.5" fill="#23282d">m5C</text><text x="186" y="151.0" font-size="12.5" fill="#23282d">copies it as C</text><text x="516" y="151.0" font-size="12.5" fill="#23282d">bisulfite works on RNA as on DNA</text><line x1="30" y1="160" x2="950" y2="160" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="181.0" font-size="12.5" fill="#23282d">pseudouridine</text><text x="186" y="181.0" font-size="12.5" fill="#23282d">copies it as U</text><text x="516" y="181.0" font-size="12.5" fill="#23282d">chemical adduct that stops the enzyme</text><line x1="30" y1="190" x2="950" y2="190" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="211.0" font-size="12.5" fill="#b4532a">m1A</text><text x="186" y="211.0" font-size="12.5" fill="#23282d">stalls or misreads (blocks pairing)</text><text x="516" y="211.0" font-size="12.5" fill="#23282d">use the stop or the mismatch</text><line x1="30" y1="220" x2="950" y2="220" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="30" y="244.0" font-size="13" fill="#b4532a">Orange: marks that show up without any special treatment.</text>
</svg>
