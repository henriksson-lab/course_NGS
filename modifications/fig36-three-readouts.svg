<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 224" width="800" height="224" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="224" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Three ways a reverse transcriptase can report a mark.</text><line x1="30" y1="40" x2="810" y2="40" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="62.4" font-size="13" fill="#23282d" font-weight="bold">readout</text><text x="146" y="62.4" font-size="13" fill="#23282d" font-weight="bold">what the enzyme does</text><text x="376" y="62.4" font-size="13" fill="#23282d" font-weight="bold">needs</text><text x="626" y="62.4" font-size="13" fill="#23282d" font-weight="bold">examples</text><line x1="30" y1="72" x2="810" y2="72" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="94.4" font-size="13" fill="#23282d">stop</text><text x="146" y="94.4" font-size="13" fill="#23282d">cDNA ends before the adduct</text><text x="376" y="94.4" font-size="13" fill="#23282d">keep truncated cDNA</text><text x="626" y="94.4" font-size="13" fill="#23282d">iCLIP, icSHAPE</text><line x1="30" y1="104" x2="810" y2="104" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="126.4" font-size="13" fill="#23282d">mismatch</text><text x="146" y="126.4" font-size="13" fill="#23282d">reads through, miscopies</text><text x="376" y="126.4" font-size="13" fill="#23282d">a tolerant enzyme</text><text x="626" y="126.4" font-size="13" fill="#23282d">PAR-CLIP, SHAPE-MaP</text><line x1="30" y1="136" x2="810" y2="136" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="158.4" font-size="13" fill="#23282d">conversion</text><text x="146" y="158.4" font-size="13" fill="#23282d">the base itself has changed</text><text x="376" y="158.4" font-size="13" fill="#23282d">a chemical that spares the mark</text><text x="626" y="158.4" font-size="13" fill="#23282d">GLORI, bisulfite</text><line x1="30" y1="168" x2="810" y2="168" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="30" y="192.0" font-size="13.5" fill="#23282d">The same enzyme-and-chemistry reasoning applies to a CLIP footprint, a structure probe or a base</text><text x="30" y="210.9" font-size="13.5" fill="#23282d">modification.</text>
</svg>
