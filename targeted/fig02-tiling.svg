<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 204" width="820" height="204" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="204" fill="none"/>
<text x="20" y="24" font-size="14">Tiled amplicons: overlapping products, alternate ones in separate pools.</text><line x1="30" y1="60" x2="780" y2="60" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><text x="30" y="48" font-size="12" fill="#8a8f94">region to cover (for example a gene, or a viral genome)</text><rect x="30" y="90" width="150" height="12" rx="2" fill="#2e6b3f" stroke="none"/><text x="105" y="100" font-size="10.5" text-anchor="middle" fill="#ffffff">1</text><rect x="130" y="120" width="150" height="12" rx="2" fill="#b4532a" stroke="none"/><text x="205" y="130" font-size="10.5" text-anchor="middle" fill="#ffffff">2</text><rect x="230" y="90" width="150" height="12" rx="2" fill="#2e6b3f" stroke="none"/><text x="305" y="100" font-size="10.5" text-anchor="middle" fill="#ffffff">3</text><rect x="330" y="120" width="150" height="12" rx="2" fill="#b4532a" stroke="none"/><text x="405" y="130" font-size="10.5" text-anchor="middle" fill="#ffffff">4</text><rect x="430" y="90" width="150" height="12" rx="2" fill="#2e6b3f" stroke="none"/><text x="505" y="100" font-size="10.5" text-anchor="middle" fill="#ffffff">5</text><rect x="530" y="120" width="150" height="12" rx="2" fill="#b4532a" stroke="none"/><text x="605" y="130" font-size="10.5" text-anchor="middle" fill="#ffffff">6</text><rect x="630" y="90" width="150" height="12" rx="2" fill="#2e6b3f" stroke="none"/><text x="705" y="100" font-size="10.5" text-anchor="middle" fill="#ffffff">7</text><text x="30" y="168" font-size="12.5" fill="#2e6b3f">pool 1: amplicons 1, 3, 5, 7</text><text x="30" y="184" font-size="12.5" fill="#b4532a">pool 2: amplicons 2, 4, 6</text><text x="300" y="168" font-size="12.5" fill="#8a8f94">Neighbours overlap, so a failed amplicon leaves a gap only if both</text><text x="300" y="184" font-size="12.5" fill="#8a8f94">sides fail; separate pools stop overlapping primers from priming each other.</text>
</svg>
