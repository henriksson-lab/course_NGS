<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 196" width="800" height="196" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="196" fill="none"/>
<text x="20" y="24" font-size="14">SureSelect XT HS2: the molecular barcode is on the adapter, so it survives capture.</text><rect x="20" y="50" width="112" height="46" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="76" y="72" font-size="12" text-anchor="middle" fill="#23282d">fragment</text><line x1="134" y1="73" x2="143" y2="73" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 148 73 L 143 69.5 L 143 76.5 Z" fill="#8a8f94"/><rect x="150" y="50" width="112" height="46" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="206" y="63" font-size="12" text-anchor="middle" fill="#23282d">end repair</text><text x="206" y="78" font-size="12" text-anchor="middle" fill="#23282d">A-tail</text><line x1="264" y1="73" x2="273" y2="73" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 278 73 L 273 69.5 L 273 76.5 Z" fill="#8a8f94"/><rect x="280" y="50" width="112" height="46" rx="4" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="336" y="63" font-size="12" text-anchor="middle" fill="#23282d">ligate adapter</text><text x="336" y="78" font-size="12" text-anchor="middle" fill="#23282d">(with MBC)</text><line x1="394" y1="73" x2="403" y2="73" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 408 73 L 403 69.5 L 403 76.5 Z" fill="#8a8f94"/><rect x="410" y="50" width="112" height="46" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="466" y="72" font-size="12" text-anchor="middle" fill="#23282d">index PCR</text><line x1="524" y1="73" x2="533" y2="73" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 538 73 L 533 69.5 L 533 76.5 Z" fill="#8a8f94"/><rect x="540" y="50" width="112" height="46" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="596" y="63" font-size="12" text-anchor="middle" fill="#23282d">pool,</text><text x="596" y="78" font-size="12" text-anchor="middle" fill="#23282d">hybridise baits</text><line x1="654" y1="73" x2="663" y2="73" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 668 73 L 663 69.5 L 663 76.5 Z" fill="#8a8f94"/><rect x="670" y="50" width="112" height="46" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="726" y="63" font-size="12" text-anchor="middle" fill="#23282d">post-capture</text><text x="726" y="78" font-size="12" text-anchor="middle" fill="#23282d">PCR</text><text x="20" y="134" font-size="13" fill="#23282d">Order of the steps: tag first, amplify, capture, amplify again. All PCR duplicates of one</text><text x="20" y="152" font-size="13" fill="#23282d">molecule keep its tag, so reads can be grouped back to the original molecule.</text><text x="20" y="178" font-size="13" fill="#8a8f94">Pooling indexed libraries before capture lets one capture reaction serve many samples.</text>
</svg>
