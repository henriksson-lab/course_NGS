<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 216" width="820" height="216" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="216" fill="none"/>
<text x="20" y="24" font-size="14">Reduced representation: a restriction enzyme chooses the same fragments in every sample.</text><line x1="30" y1="70" x2="780" y2="70" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="100" y1="58" x2="100" y2="82" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="58" x2="150" y2="82" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="165" y1="58" x2="165" y2="82" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="250" y1="58" x2="250" y2="82" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="360" y1="58" x2="360" y2="82" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="375" y1="58" x2="375" y2="82" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="500" y1="58" x2="500" y2="82" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="590" y1="58" x2="590" y2="82" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="605" y1="58" x2="605" y2="82" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="730" y1="58" x2="730" y2="82" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><rect x="130" y="94" width="60" height="10" rx="2" fill="#e3efe6" stroke="#2e6b3f"/><text x="160" y="118" font-size="12" text-anchor="middle" fill="#2e6b3f">CpG island</text><rect x="340" y="94" width="60" height="10" rx="2" fill="#e3efe6" stroke="#2e6b3f"/><rect x="570" y="94" width="60" height="10" rx="2" fill="#e3efe6" stroke="#2e6b3f"/><text x="30" y="50" font-size="12.5" fill="#b4532a">MspI cuts at C^CGG: it finds CpG-rich DNA</text><rect x="150" y="140" width="15" height="12" rx="2" fill="#2e6b3f" stroke="none"/><rect x="360" y="140" width="15" height="12" rx="2" fill="#2e6b3f" stroke="none"/><rect x="590" y="140" width="15" height="12" rx="2" fill="#2e6b3f" stroke="none"/><text x="30" y="150" font-size="12" fill="#2e6b3f">kept</text><text x="30" y="182" font-size="13" fill="#23282d">Short fragments between close-by sites are retained; the rest of the genome is never sequenced.</text><text x="30" y="200" font-size="13" fill="#23282d">The same idea with one or two enzymes gives RAD, ddRAD and GBS for genotyping.</text>
</svg>
