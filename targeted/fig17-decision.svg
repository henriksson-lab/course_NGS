<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 288" width="740" height="288" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="288" fill="none"/>
<text x="20" y="24" font-size="14">From question to targeting method: a decision sketch.</text><rect x="20" y="44" width="250" height="34" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="145.0" y="65.375" font-size="12.5" text-anchor="middle" fill="#23282d">a few loci, many samples</text><line x1="276" y1="61" x2="311" y2="61" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><path d="M 316 61 L 311 57.5 L 311 64.5 Z" fill="#2e6b3f"/><rect x="322" y="44" width="400" height="34" rx="4" fill="#eef2f6" stroke="#2e6b3f" stroke-width="1.2"/><text x="522.0" y="65.375" font-size="12.5" text-anchor="middle" fill="#23282d">multiplex PCR, tiled amplicons</text><rect x="20" y="92" width="250" height="34" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="145.0" y="113.375" font-size="12.5" text-anchor="middle" fill="#23282d">tens to thousands of genes</text><line x1="276" y1="109" x2="311" y2="109" stroke="#c98a2b" stroke-width="1.6" stroke-linecap="round"/><path d="M 316 109 L 311 105.5 L 311 112.5 Z" fill="#c98a2b"/><rect x="322" y="92" width="400" height="34" rx="4" fill="#eef2f6" stroke="#c98a2b" stroke-width="1.2"/><text x="522.0" y="113.375" font-size="12.5" text-anchor="middle" fill="#23282d">hybrid capture, with UMIs if rare variants</text><rect x="20" y="140" width="250" height="34" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="145.0" y="161.375" font-size="12.5" text-anchor="middle" fill="#23282d">tiny panel, very low input</text><line x1="276" y1="157" x2="311" y2="157" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 316 157 L 311 153.5 L 311 160.5 Z" fill="#b4532a"/><rect x="322" y="140" width="400" height="34" rx="4" fill="#eef2f6" stroke="#b4532a" stroke-width="1.2"/><text x="522.0" y="161.375" font-size="12.5" text-anchor="middle" fill="#23282d">smMIPs or padlock probes</text><rect x="20" y="188" width="250" height="34" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="145.0" y="209.375" font-size="12.5" text-anchor="middle" fill="#23282d">methylation at CpG-rich regions</text><line x1="276" y1="205" x2="311" y2="205" stroke="#a33a28" stroke-width="1.6" stroke-linecap="round"/><path d="M 316 205 L 311 201.5 L 311 208.5 Z" fill="#a33a28"/><rect x="322" y="188" width="400" height="34" rx="4" fill="#eef2f6" stroke="#a33a28" stroke-width="1.2"/><text x="522.0" y="209.375" font-size="12.5" text-anchor="middle" fill="#23282d">RRBS: restriction enzyme + bisulfite</text><rect x="20" y="236" width="250" height="34" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="145.0" y="257.375" font-size="12.5" text-anchor="middle" fill="#23282d">a locus in native long DNA</text><line x1="276" y1="253" x2="311" y2="253" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 316 253 L 311 249.5 L 311 256.5 Z" fill="#8a8f94"/><rect x="322" y="236" width="400" height="34" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="522.0" y="257.375" font-size="12.5" text-anchor="middle" fill="#23282d">Cas9-guided enrichment, nanopore</text>
