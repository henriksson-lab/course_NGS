<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 240" width="840" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="840" height="240" fill="none"/>
<text x="20" y="24" font-size="14">Where the tag goes decides what it protects against.</text><text x="20" y="52" font-size="13" fill="#23282d" font-weight="bold">protocol</text><text x="230" y="52" font-size="13" fill="#23282d" font-weight="bold">where the tag enters</text><text x="600" y="52" font-size="13" fill="#23282d" font-weight="bold">what it can correct</text><line x1="20" y1="60" x2="800" y2="60" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="20" y="84" font-size="12.5" fill="#b4532a" font-weight="bold">Safe-SeqS</text><text x="230" y="84" font-size="12.5" fill="#23282d">gene-specific primer with a random tag, first PCR cycles</text><text x="600" y="84" font-size="12.5" fill="#8a8f94">amplification errors</text><text x="20" y="114" font-size="12.5" fill="#b4532a" font-weight="bold">smMIP</text><text x="230" y="114" font-size="12.5" fill="#23282d">random tag is inside the probe, before any PCR</text><text x="600" y="114" font-size="12.5" fill="#8a8f94">amplification and capture</text><text x="20" y="144" font-size="12.5" fill="#b4532a" font-weight="bold">SureSelect XT HS2 (MBC)</text><text x="230" y="144" font-size="12.5" fill="#23282d">adapter carries the tag, before capture and PCR</text><text x="600" y="144" font-size="12.5" fill="#8a8f94">amplification and capture</text><text x="20" y="174" font-size="12.5" fill="#b4532a" font-weight="bold">Duplex sequencing</text><text x="230" y="174" font-size="12.5" fill="#23282d">tag on both strands, strand-linked</text><text x="600" y="174" font-size="12.5" fill="#8a8f94">also damage on one strand</text><text x="20" y="224" font-size="13.5" fill="#23282d">A tag added after PCR cannot tell PCR copies from distinct molecules.</text>
</svg>
