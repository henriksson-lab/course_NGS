<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 870 246" width="870" height="246" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="870" height="246" fill="none"/>
<text x="20" y="24" font-size="14">Targeting methods side by side (qualitative).</text><text x="24" y="50" font-size="12.5" fill="#23282d" font-weight="bold"></text><text x="134" y="50" font-size="12.5" fill="#23282d" font-weight="bold">Tiled amplicon</text><text x="304" y="50" font-size="12.5" fill="#23282d" font-weight="bold">Hybrid capture</text><text x="474" y="50" font-size="12.5" fill="#23282d" font-weight="bold">smMIP / padlock</text><text x="644" y="50" font-size="12.5" fill="#23282d" font-weight="bold">Cas9 + nanopore</text><line x1="20" y1="58" x2="840" y2="58" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="24" y="80" font-size="12.5" fill="#8a8f94">target size</text><text x="134" y="80" font-size="12.5" fill="#23282d">small to medium</text><text x="304" y="80" font-size="12.5" fill="#23282d">kb to tens of Mb</text><text x="474" y="80" font-size="12.5" fill="#23282d">kb to Mb</text><text x="644" y="80" font-size="12.5" fill="#23282d">a few loci</text><text x="24" y="106" font-size="12.5" fill="#8a8f94">input</text><text x="134" y="106" font-size="12.5" fill="#23282d">ng or less</text><text x="304" y="106" font-size="12.5" fill="#23282d">10 to 200 ng typical</text><text x="474" y="106" font-size="12.5" fill="#23282d">tens of ng</text><text x="644" y="106" font-size="12.5" fill="#23282d">µg</text><text x="24" y="132" font-size="12.5" fill="#8a8f94">uniformity</text><text x="134" y="132" font-size="12.5" fill="#23282d">primer dependent</text><text x="304" y="132" font-size="12.5" fill="#23282d">good, bait dependent</text><text x="474" y="132" font-size="12.5" fill="#23282d">probe dependent</text><text x="644" y="132" font-size="12.5" fill="#23282d">n/a</text><text x="24" y="158" font-size="12.5" fill="#8a8f94">sequence-specific</text><text x="134" y="158" font-size="12.5" fill="#23282d">primers per target</text><text x="304" y="158" font-size="12.5" fill="#23282d">bait tiling</text><text x="474" y="158" font-size="12.5" fill="#23282d">probe per target</text><text x="644" y="158" font-size="12.5" fill="#23282d">guide per target</text><text x="24" y="184" font-size="12.5" fill="#8a8f94">UMI possible</text><text x="134" y="184" font-size="12.5" fill="#23282d">yes, in primer</text><text x="304" y="184" font-size="12.5" fill="#23282d">yes, in adapter</text><text x="474" y="184" font-size="12.5" fill="#23282d">yes, in probe</text><text x="644" y="184" font-size="12.5" fill="#23282d">not standard</text><text x="24" y="210" font-size="12.5" fill="#8a8f94">strength</text><text x="134" y="210" font-size="12.5" fill="#23282d">cheap, fast</text><text x="304" y="210" font-size="12.5" fill="#23282d">flexible, big panels</text><text x="474" y="210" font-size="12.5" fill="#23282d">tiny input, accurate</text><text x="644" y="210" font-size="12.5" fill="#23282d">long, modified DNA</text>
</svg>
