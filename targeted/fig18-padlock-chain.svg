<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 268" width="950" height="268" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="950" height="268" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d">One padlock probe, followed through. The first four steps are always the same.</text><rect x="20" y="50" width="150" height="54" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="95" y="72" font-size="12" text-anchor="middle" fill="#b4532a" font-weight="bold">1  arms hybridise</text><text x="95" y="90" font-size="10.5" text-anchor="middle" fill="#8a8f94">one each side of a gap</text><rect x="196" y="50" width="150" height="54" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="271" y="72" font-size="12" text-anchor="middle" fill="#b4532a" font-weight="bold">2  polymerase fills</text><text x="271" y="90" font-size="10.5" text-anchor="middle" fill="#8a8f94">the gap, to the probe's end</text><rect x="372" y="50" width="150" height="54" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="447" y="72" font-size="12" text-anchor="middle" fill="#b4532a" font-weight="bold">3  ligase closes</text><text x="447" y="90" font-size="10.5" text-anchor="middle" fill="#8a8f94">the circle: now covalent</text><rect x="548" y="50" width="150" height="54" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="623" y="72" font-size="12" text-anchor="middle" fill="#b4532a" font-weight="bold">4  exonuclease</text><text x="623" y="90" font-size="10.5" text-anchor="middle" fill="#8a8f94">destroys everything linear</text><line x1="174" y1="77" x2="207" y2="77" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 212 77 L 207 73.5 L 207 80.5 Z" fill="#b4532a"/><line x1="350" y1="77" x2="383" y2="77" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 388 77 L 383 73.5 L 383 80.5 Z" fill="#b4532a"/><line x1="526" y1="77" x2="559" y2="77" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 564 77 L 559 73.5 L 559 80.5 Z" fill="#b4532a"/><text x="20" y="124" font-size="12" fill="#23282d">Only the target gives both arms a place to sit, so only the target makes a circle. The background is destroyed, not diluted.</text><line x1="623" y1="136" x2="440" y2="166" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><line x1="623" y1="136" x2="790" y2="166" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><rect x="300" y="168" width="280" height="62" rx="4" fill="none" stroke="#1f3b57" stroke-width="1.2"/><text x="440" y="190" font-size="12" text-anchor="middle" fill="#1f3b57" font-weight="bold">PCR from the backbone</text><text x="440" y="208" font-size="11" text-anchor="middle" fill="#23282d">one amplicon per target: a panel</text><text x="440" y="223" font-size="11" text-anchor="middle" fill="#8a8f94">read in a tube  (smMIP)</text><rect x="650" y="168" width="280" height="62" rx="4" fill="none" stroke="#2e6b3f" stroke-width="1.2"/><text x="790" y="190" font-size="12" text-anchor="middle" fill="#2e6b3f" font-weight="bold">phi29 rolling circle</text><text x="790" y="208" font-size="11" text-anchor="middle" fill="#23282d">a rolony: many copies, pinned</text><text x="790" y="223" font-size="11" text-anchor="middle" fill="#8a8f94">read in the tissue  (STARmap)</text><text x="20" y="254" font-size="12.5" fill="#23282d">The last step alone decides whether the answer is a panel of variants or a transcript located in a tissue.</text>
</svg>
