<text x="20" y="24" font-size="14">Reads per UMI family: the shape tells you whether the library is deep enough.</text><line x1="50" y1="190" x2="460" y2="190" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="60" y="151.19269044335" width="24" height="38.80730955665002" rx="2" fill="#a33a28" stroke="none"/><text x="72" y="208" font-size="11.5" text-anchor="middle" fill="#8a8f94">1</text><rect x="94" y="112.38538088669996" width="24" height="77.61461911330004" rx="2" fill="#1f3b57" stroke="none"/><text x="106" y="208" font-size="11.5" text-anchor="middle" fill="#8a8f94">2</text><rect x="128" y="86.51384118226662" width="24" height="103.48615881773338" rx="2" fill="#1f3b57" stroke="none"/><text x="140" y="208" font-size="11.5" text-anchor="middle" fill="#8a8f94">3</text><rect x="162" y="86.51384118226662" width="24" height="103.48615881773338" rx="2" fill="#1f3b57" stroke="none"/><text x="174" y="208" font-size="11.5" text-anchor="middle" fill="#8a8f94">4</text><rect x="196" y="107.2110729458133" width="24" height="82.7889270541867" rx="2" fill="#1f3b57" stroke="none"/><text x="208" y="208" font-size="11.5" text-anchor="middle" fill="#8a8f94">5</text><rect x="230" y="134.8073819638755" width="24" height="55.19261803612447" rx="2" fill="#1f3b57" stroke="none"/><text x="242" y="208" font-size="11.5" text-anchor="middle" fill="#8a8f94">6</text><rect x="264" y="158.46136112221458" width="24" height="31.53863887778541" rx="2" fill="#1f3b57" stroke="none"/><text x="276" y="208" font-size="11.5" text-anchor="middle" fill="#8a8f94">7</text><rect x="298" y="174.2306805611073" width="24" height="15.769319438892705" rx="2" fill="#1f3b57" stroke="none"/><text x="310" y="208" font-size="11.5" text-anchor="middle" fill="#8a8f94">8</text><rect x="332" y="182.99141358271436" width="24" height="7.008586417285647" rx="2" fill="#1f3b57" stroke="none"/><text x="344" y="208" font-size="11.5" text-anchor="middle" fill="#8a8f94">9</text><rect x="366" y="187.19656543308574" width="24" height="2.8034345669142584" rx="2" fill="#1f3b57" stroke="none"/><text x="378" y="208" font-size="11.5" text-anchor="middle" fill="#8a8f94">10</text><rect x="400" y="188.98056924839483" width="24" height="1.019430751605185" rx="2" fill="#1f3b57" stroke="none"/><text x="412" y="208" font-size="11.5" text-anchor="middle" fill="#8a8f94">11</text><text x="250" y="230" font-size="12.5" text-anchor="middle" fill="#8a8f94">reads in the family</text><text x="500" y="80" font-size="13" fill="#a33a28">Families of one read cannot be</text><text x="500" y="98" font-size="13" fill="#a33a28">corrected: they carry the error.</text><text x="500" y="128" font-size="12.5" fill="#8a8f94">Counts are zero-truncated Poisson,</text><text x="500" y="144" font-size="12.5" fill="#8a8f94">mean 4 reads per molecule.</text><text x="500" y="174" font-size="12.5" fill="#23282d">Large families = deep, but you</text><text x="500" y="190" font-size="12.5" fill="#23282d">need many molecules as well.</text>
</svg>
