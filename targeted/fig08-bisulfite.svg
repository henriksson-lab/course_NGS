nospace'>T</text><text x="230" y="126" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="246" y="66" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="246" y="126" font-size="14" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">T</text><line x1="250" y1="72" x2="250" y2="112" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><text x="262" y="66" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="262" y="126" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="278" y="66" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><circle cx="282" cy="90" r="4" fill="#b4532a"/><text x="278" y="126" font-size="14" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">C</text><line x1="282" y1="72" x2="282" y2="112" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 3"/><text x="294" y="66" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="294" y="126" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="310" y="66" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="310" y="126" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="326" y="66" font-size="14" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="326" y="126" font-size="14" fill="#23282d" font-family=