<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 832 240" width="832" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="240" fill="none"/>
<text x="20" y="24" font-size="14">How multiplex PCR fails, and what you would see.</text><text x="20" y="56" font-size="13.5" fill="#a33a28" font-weight="bold">primer dimer</text><text x="160" y="56" font-size="12.5" fill="#23282d">two primers anneal to each other</text><text x="470" y="56" font-size="12.5" fill="#8a8f94">short peak, wasted reads</text><text x="20" y="90" font-size="13.5" fill="#a33a28" font-weight="bold">allele dropout</text><text x="160" y="90" font-size="12.5" fill="#23282d">a variant under a primer prevents annealing</text><text x="470" y="90" font-size="12.5" fill="#8a8f94">one allele missing: false homozygote</text><text x="20" y="124" font-size="13.5" fill="#b4532a" font-weight="bold">uneven efficiency</text><text x="160" y="124" font-size="12.5" fill="#23282d">some primer pairs work better</text><text x="470" y="124" font-size="12.5" fill="#8a8f94">10-fold spread in depth</text><text x="20" y="158" font-size="13.5" fill="#b4532a" font-weight="bold">cross-products</text><text x="160" y="158" font-size="12.5" fill="#23282d">primers from different pairs join</text><text x="470" y="158" font-size="12.5" fill="#8a8f94">chimeric, off-target reads</text><line x1="120" y1="200" x2="340" y2="200" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="150" y1="190" x2="235" y2="190" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><path d="M 240 190 L 235 186.5 L 235 193.5 Z" fill="#2e6b3f"/><circle cx="260" cy="200" r="6" fill="#a33a28"/><text x="260" y="224" font-size="12" text-anchor="middle" fill="#a33a28">SNP in primer site</text><text x="380" y="200" font-size="12.5" fill="#23282d">The primer is 20 nt; one mismatch near its 3' end can stop it priming.</text>
</svg>
