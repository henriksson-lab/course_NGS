<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 224" width="800" height="224" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="224" fill="none"/>
<text x="20" y="24" font-size="14">A real variant at 0.1% and a sequencing error look the same.</text><line x1="60" y1="190" x2="490" y2="190" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="70" y="81.98437321074452" width="50" height="108.01562678925548" rx="2" fill="#1f3b57" stroke="none"/><text x="95" y="208" font-size="12" text-anchor="middle" fill="#8a8f94">A (true)</text><rect x="170" y="172.82363483009215" width="50" height="17.176365169907847" rx="2" fill="#a33a28" stroke="none"/><text x="195" y="208" font-size="12" text-anchor="middle" fill="#8a8f94">G: error</text><rect x="270" y="179.16292015609667" width="50" height="10.837079843903323" rx="2" fill="#a33a28" stroke="none"/><text x="295" y="208" font-size="12" text-anchor="middle" fill="#8a8f94">C: error</text><rect x="370" y="179.16292015609667" width="50" height="10.837079843903323" rx="2" fill="#b4532a" stroke="none"/><text x="395" y="208" font-size="12" text-anchor="middle" fill="#8a8f94">T: variant</text><text x="70" y="52" font-size="12.5" fill="#8a8f94">reads at one position, 1000 reads (counts illustrative; log height)</text><text x="500" y="100" font-size="13" fill="#23282d">The one true variant read cannot</text><text x="500" y="118" font-size="13" fill="#23282d">be told apart from the errors that</text><text x="500" y="136" font-size="13" fill="#23282d">have the same count.</text><text x="500" y="164" font-size="12.5" fill="#8a8f94">Error rate is of the order of 0.1%</text><text x="500" y="180" font-size="12.5" fill="#8a8f94">per base for Illumina data.</text>
</svg>
