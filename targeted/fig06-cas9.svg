<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 741 224" width="741" height="224" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="224" fill="none"/>
<text x="20" y="24" font-size="14">Cas9-guided enrichment: cut where you want to read, and ligate adapters only there.</text><line x1="30" y1="80" x2="640" y2="80" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="30" y1="90" x2="640" y2="90" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="85" r="4" fill="#8a8f94"/><circle cx="140" cy="85" r="4" fill="#8a8f94"/><circle cx="220" cy="85" r="4" fill="#8a8f94"/><circle cx="440" cy="85" r="4" fill="#8a8f94"/><circle cx="520" cy="85" r="4" fill="#8a8f94"/><circle cx="600" cy="85" r="4" fill="#8a8f94"/><text x="30" y="66" font-size="12.5" fill="#8a8f94">1 Dephosphorylate all ends: background cannot ligate</text><line x1="300" y1="60" x2="300" y2="112" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="380" y1="60" x2="380" y2="112" stroke="#b4532a" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 3"/><text x="340" y="130" font-size="12.5" text-anchor="middle" fill="#b4532a">2 Cas9 cuts both sides of the target,</text><text x="340" y="146" font-size="12.5" text-anchor="middle" fill="#b4532a">leaving 5'-phosphate ends</text><rect x="296" y="160" width="10" height="10" rx="2" fill="#c98a2b" stroke="none"/><line x1="306" y1="165" x2="374" y2="165" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="374" y="160" width="10" height="10" rx="2" fill="#c98a2b" stroke="none"/><text x="396" y="169" font-size="12.5" fill="#c98a2b">3 Ligate sequencing adapters: only cut ends take them</text><text x="20" y="208" font-size="13" fill="#23282d">Read by nanopore, so long reads and modifications are preserved. See nCATS (Gilpatrick et al.).</text>
</svg>
