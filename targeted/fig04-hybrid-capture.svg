<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 236" width="820" height="236" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="236" fill="none"/>
<text x="20" y="24" font-size="14">Hybrid capture: library first, then pull down what a bait matches.</text><text x="24" y="52" font-size="13.5" fill="#23282d" font-weight="bold">1 Library</text><rect x="24" y="80" width="8" height="8" rx="2" fill="#c98a2b" stroke="none"/><line x1="32" y1="84" x2="124" y2="84" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="124" y="80" width="8" height="8" rx="2" fill="#c98a2b" stroke="none"/><rect x="24" y="98" width="8" height="8" rx="2" fill="#c98a2b" stroke="none"/><line x1="32" y1="102" x2="124" y2="102" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="124" y="98" width="8" height="8" rx="2" fill="#c98a2b" stroke="none"/><rect x="24" y="116" width="8" height="8" rx="2" fill="#c98a2b" stroke="none"/><line x1="32" y1="120" x2="124" y2="120" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="124" y="116" width="8" height="8" rx="2" fill="#c98a2b" stroke="none"/><text x="24" y="166" font-size="12" fill="#8a8f94">fragments with</text><text x="24" y="181" font-size="12" fill="#8a8f94">adapters on both ends</text><line x1="174" y1="100" x2="203" y2="100" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 208 100 L 203 96.5 L 203 103.5 Z" fill="#8a8f94"/><text x="224" y="52" font-size="13.5" fill="#23282d" font-weight="bold">2 Hybridise</text><rect x="224" y="80" width="8" height="8" rx="2" fill="#c98a2b" stroke="none"/><line x1="232" y1="84" x2="324" y2="84" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="324" y="80" width="8" height="8" rx="2" fill="#c98a2b" stroke="none"/><line x1="244" y1="92" x2="312" y2="92" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><circle cx="314" cy="92" r="5" fill="#b4532a"/><line x1="232" y1="114" x2="324" y2="114" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><text x="334" y="90" font-size="11.5" fill="#2e6b3f">match</text><text x="334" y="118" font-size="11.5" fill="#8a8f94">no match</text><text x="224" y="166" font-size="12" fill="#8a8f94">biotinylated baits anneal</text><text x="224" y="181" font-size="12" fill="#8a8f94">to target-derived fragments</text><line x1="374" y1="100" x2="403" y2="100" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 408 100 L 403 96.5 L 403 103.5 Z" fill="#8a8f94"/><text x="424" y="52" font-size="13.5" fill="#23282d" font-weight="bold">3 Streptavidin beads</text><circle cx="464" cy="98" r="18" fill="#d6dce2"/><line x1="464" y1="98" x2="504" y2="84" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="432" y1="124" x2="524" y2="124" stroke="#8a8f94" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 4"/><text x="536" y="128" font-size="11.5" fill="#8a8f94">washed out</text><text x="424" y="166" font-size="12" fill="#8a8f94">bind biotin; wash away</text><text x="424" y="181" font-size="12" fill="#8a8f94">the rest of the genome</text><line x1="574" y1="100" x2="603" y2="100" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 608 100 L 603 96.5 L 603 103.5 Z" fill="#8a8f94"/><text x="624" y="52" font-size="13.5" fill="#23282d" font-weight="bold">4 PCR</text><line x1="624" y1="90" x2="724" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="624" y1="100" x2="724" y2="100" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="736" y="98" font-size="12" fill="#8a8f94">x 8 to 12</text><text x="624" y="166" font-size="12" fill="#8a8f94">amplify the captured</text><text x="624" y="181" font-size="12" fill="#8a8f94">library; sequence</text><text x="24" y="218" font-size="13" fill="#23282d">Blocking oligos against the adapters prevent library fragments pulling each other down.</text>
</svg>
