<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 326" width="980" height="326" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="980" height="326" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">CAPP-Seq on plasma: the molecule after every step. A few nanograms of cell-free DNA.</text><text x="40" y="67" font-size="12" fill="#23282d">1  plasma draw</text><rect x="250" y="52" width="260" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="380.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">cell-free DNA, about 165 bp</text><text x="660" y="67" font-size="11.5" fill="#8a8f94">already library-sized; a few thousand genomes</text><text x="40" y="101" font-size="12" fill="#23282d">2  end repair, dA-tail</text><rect x="250" y="86" width="14" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="257.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#b4532a">A</text><rect x="264" y="86" width="232" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="380.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert, blunt, 5'-P</text><rect x="496" y="86" width="14" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="503.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#b4532a">A</text><text x="660" y="101" font-size="11.5" fill="#8a8f94">no shearing step: nothing to cut, nothing to lose</text><text x="40" y="135" font-size="12" fill="#23282d">3  long ligation, excess adapter</text><rect x="250" y="120" width="60" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="280.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="310" y="120" width="240" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="430.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="550" y="120" width="60" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="580.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="660" y="135" font-size="11.5" fill="#8a8f94">long incubation, excess adapter: keep every molecule</text><text x="40" y="169" font-size="12" fill="#23282d">4  PCR, then pool</text><rect x="250" y="154" width="60" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="280.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="310" y="154" width="240" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="430.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="550" y="154" width="60" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="580.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="660" y="169" font-size="11.5" fill="#8a8f94">one library per patient, indexed, then pooled</text><text x="40" y="203" font-size="12" fill="#23282d">5  capture with the selector</text><rect x="250" y="188" width="60" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="280.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="310" y="188" width="240" height="22" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="430.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">insert from a selector region</text><rect x="550" y="188" width="60" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="580.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="660" y="203" font-size="11.5" fill="#8a8f94">baits over recurrently mutated regions only</text><text x="40" y="237" font-size="12" fill="#23282d">6  PCR after capture</text><rect x="250" y="222" width="60" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="280.0" y="237.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="310" y="222" width="240" height="22" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="430.0" y="237.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">insert from a selector region</text><rect x="550" y="222" width="60" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="580.0" y="237.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="660" y="237" font-size="11.5" fill="#8a8f94">on-target library, ready to load</text><text x="40" y="271" font-size="12" fill="#23282d">7  the tagged version</text><rect x="250" y="256" width="60" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="280.0" y="271.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="310" y="256" width="32" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="326.0" y="271.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">UMI</text><rect x="342" y="256" width="176" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="430.0" y="271.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="518" y="256" width="32" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="534.0" y="271.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">UMI</text><rect x="550" y="256" width="60" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="580.0" y="271.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="660" y="271" font-size="11.5" fill="#8a8f94">tag on the adapter, so it precedes every cycle</text><text x="40" y="306" font-size="13.5" fill="#b4532a">Every choice above is forced by the sample: short fragments, few molecules, and the variant on three of them.</text>
</svg>
