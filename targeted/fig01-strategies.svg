<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 204" width="820" height="204" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="204" fill="none"/>
<text x="20" y="24" font-size="14">Three ways to look at 1% of the genome: amplify it, catch it, or copy it out.</text><text x="20" y="56" font-size="13.5" fill="#23282d" font-weight="bold">Amplicon PCR</text><text x="20" y="72" font-size="12" fill="#8a8f94">primer pairs flank each target</text><line x1="20" y1="120" x2="260" y2="120" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="100" y="112" width="80" height="16" rx="2" fill="#e3efe6" stroke="#2e6b3f"/><text x="140" y="106" font-size="11.5" text-anchor="middle" fill="#2e6b3f">target</text><line x1="58" y1="100" x2="93" y2="100" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 98 100 L 93 96.5 L 93 103.5 Z" fill="#b4532a"/><line x1="222" y1="142" x2="187" y2="142" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 182 142 L 187 138.5 L 187 145.5 Z" fill="#b4532a"/><text x="20" y="170" font-size="12" fill="#8a8f94">product: only the region between</text><text x="20" y="185" font-size="12" fill="#8a8f94">the two primers, exponentially</text><text x="290" y="56" font-size="13.5" fill="#23282d" font-weight="bold">Hybrid capture</text><text x="290" y="72" font-size="12" fill="#8a8f94">biotinylated baits pull fragments</text><line x1="290" y1="120" x2="530" y2="120" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="370" y="112" width="80" height="16" rx="2" fill="#e3efe6" stroke="#2e6b3f"/><text x="410" y="106" font-size="11.5" text-anchor="middle" fill="#2e6b3f">target</text><line x1="375" y1="112" x2="375" y2="90" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="445" y1="112" x2="445" y2="90" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><circle cx="375" cy="86" r="5" fill="#b4532a"/><circle cx="445" cy="86" r="5" fill="#b4532a"/><text x="290" y="170" font-size="12" fill="#8a8f94">everything else is washed away,</text><text x="290" y="185" font-size="12" fill="#8a8f94">then PCR amplifies what stayed</text><text x="560" y="56" font-size="13.5" fill="#23282d" font-weight="bold">Probe circularisation</text><text x="560" y="72" font-size="12" fill="#8a8f94">probe closes only on its target</text><line x1="560" y1="120" x2="800" y2="120" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="640" y="112" width="80" height="16" rx="2" fill="#e3efe6" stroke="#2e6b3f"/><text x="680" y="106" font-size="11.5" text-anchor="middle" fill="#2e6b3f">target</text><path d="M 642 112 C 620 80 740 80 718 112" stroke="#b4532a" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="560" y="170" font-size="12" fill="#8a8f94">ligase seals a circle; nucleases</text><text x="560" y="185" font-size="12" fill="#8a8f94">remove all linear DNA</text>
</svg>
