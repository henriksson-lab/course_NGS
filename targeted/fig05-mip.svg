<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 642 226" width="642" height="226" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="640" height="226" fill="none"/>
<text x="20" y="24" font-size="14">Molecular inversion probe: capture, gap fill, close into a circle.</text><line x1="60" y1="120" x2="560" y2="120" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><rect x="240" y="112" width="120" height="16" rx="2" fill="#e3efe6" stroke="#2e6b3f"/><text x="300" y="150" font-size="12" text-anchor="middle" fill="#2e6b3f">gap to be copied</text><line x1="200" y1="110" x2="240" y2="110" stroke="#b4532a" stroke-width="3.5" stroke-linecap="round"/><line x1="360" y1="110" x2="400" y2="110" stroke="#b4532a" stroke-width="3.5" stroke-linecap="round"/><path d="M 200 110 C 170 40 430 40 400 110" stroke="#c98a2b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="54" font-size="12.5" text-anchor="middle" fill="#c98a2b">backbone + random tag</text><text x="180" y="100" font-size="11.5" text-anchor="end" fill="#b4532a">arm 1</text><text x="420" y="100" font-size="11.5" fill="#b4532a">arm 2</text><line x1="246" y1="104" x2="345" y2="104" stroke="#4a6b8a" stroke-width="1.6" stroke-linecap="round"/><path d="M 350 104 L 345 100.5 L 345 107.5 Z" fill="#4a6b8a"/><text x="300" y="96" font-size="11.5" text-anchor="middle" fill="#4a6b8a">polymerase</text><text x="20" y="190" font-size="13.5" fill="#23282d">A ligase can close the circle only when both arms sit on the target and the gap is filled.</text><text x="20" y="210" font-size="13.5" fill="#23282d">Exonuclease then destroys all linear DNA, including the genome and unused probes.</text>
</svg>
