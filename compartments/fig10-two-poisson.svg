<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="300" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Cells and beads are two independent Poisson draws. Both must come out right.</text><text x="375.0" y="64" font-size="12.5" text-anchor="middle" fill="#8a8f94">beads per droplet</text><rect x="150" y="74" width="150" height="26" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="91.375" font-size="12.5" text-anchor="middle" fill="#23282d">0</text><rect x="300" y="74" width="150" height="26" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="375.0" y="91.375" font-size="12.5" text-anchor="middle" fill="#23282d">1</text><rect x="450" y="74" width="150" height="26" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="525.0" y="91.375" font-size="12.5" text-anchor="middle" fill="#23282d">2+</text><text x="138" y="120" font-size="12.5" text-anchor="end" fill="#8a8f94">cells</text><rect x="100" y="106" width="50" height="40" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="125.0" y="130.375" font-size="12.5" text-anchor="middle" fill="#23282d">0</text><rect x="150" y="106" width="150" height="40" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="122" font-size="12.5" text-anchor="middle" fill="#8a8f94">81.87%</text><text x="225.0" y="138" font-size="10.5" text-anchor="middle" fill="#8a8f94">empty</text><rect x="300" y="106" width="150" height="40" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="375.0" y="122" font-size="12.5" text-anchor="middle" fill="#8a8f94">8.19%</text><text x="375.0" y="138" font-size="10.5" text-anchor="middle" fill="#8a8f94">empty</text><rect x="450" y="106" width="150" height="40" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="525.0" y="122" font-size="12.5" text-anchor="middle" fill="#8a8f94">0.42%</text><text x="525.0" y="138" font-size="10.5" text-anchor="middle" fill="#8a8f94">empty</text><rect x="100" y="146" width="50" height="40" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="125.0" y="170.375" font-size="12.5" text-anchor="middle" fill="#23282d">1</text><rect x="150" y="146" width="150" height="40" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="162" font-size="12.5" text-anchor="middle" fill="#8a8f94">8.19%</text><text x="225.0" y="178" font-size="10.5" text-anchor="middle" fill="#8a8f94">lost</text><rect x="300" y="146" width="150" height="40" rx="4" fill="#e6f0e8" stroke="#dfe3e6" stroke-width="1.2"/><text x="375.0" y="162" font-size="12.5" text-anchor="middle" fill="#2e6b3f">0.82%</text><text x="375.0" y="178" font-size="10.5" text-anchor="middle" fill="#2e6b3f">usable</text><rect x="450" y="146" width="150" height="40" rx="4" fill="#f5eae6" stroke="#dfe3e6" stroke-width="1.2"/><text x="525.0" y="162" font-size="12.5" text-anchor="middle" fill="#a33a28">0.04%</text><text x="525.0" y="178" font-size="10.5" text-anchor="middle" fill="#a33a28">cell split over barcodes</text><rect x="100" y="186" width="50" height="40" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="125.0" y="210.375" font-size="12.5" text-anchor="middle" fill="#23282d">2+</text><rect x="150" y="186" width="150" height="40" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="202" font-size="12.5" text-anchor="middle" fill="#8a8f94">0.42%</text><text x="225.0" y="218" font-size="10.5" text-anchor="middle" fill="#8a8f94">lost</text><rect x="300" y="186" width="150" height="40" rx="4" fill="#f5eae6" stroke="#dfe3e6" stroke-width="1.2"/><text x="375.0" y="202" font-size="12.5" text-anchor="middle" fill="#a33a28">0.04%</text><text x="375.0" y="218" font-size="10.5" text-anchor="middle" fill="#a33a28">doublet</text><rect x="450" y="186" width="150" height="40" rx="4" fill="#f5eae6" stroke="#dfe3e6" stroke-width="1.2"/><text x="525.0" y="202" font-size="12.5" text-anchor="middle" fill="#a33a28">0.00%</text><text x="525.0" y="218" font-size="10.5" text-anchor="middle" fill="#a33a28">doublet</text><text x="40" y="258" font-size="13" fill="#23282d">At lambda = 0.1 for both, a droplet is usable less than 1 time in 100. Bead delivery is the</text><text x="40" y="276" font-size="13" fill="#23282d">reason some systems pack beads so that nearly every droplet has one.</text>
