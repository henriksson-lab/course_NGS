<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="260" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A nucleus is a ready-made compartment with its own membrane.</text><circle cx="150" cy="130" r="84" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="150" y="40" font-size="12" text-anchor="middle" fill="#8a8f94">cell</text><circle cx="150" cy="130" r="46" fill="#e8eef5" stroke="#1f3b57" stroke-width="2.4"/><circle cx="196.0" cy="130.0" r="3" fill="#8a8f94"/><circle cx="185.2" cy="159.6" r="3" fill="#8a8f94"/><circle cx="158.0" cy="175.3" r="3" fill="#8a8f94"/><circle cx="127.0" cy="169.8" r="3" fill="#8a8f94"/><circle cx="106.8" cy="145.7" r="3" fill="#8a8f94"/><circle cx="106.8" cy="114.3" r="3" fill="#8a8f94"/><circle cx="127.0" cy="90.2" r="3" fill="#8a8f94"/><circle cx="158.0" cy="84.7" r="3" fill="#8a8f94"/><circle cx="185.2" cy="100.4" r="3" fill="#8a8f94"/><circle cx="154.9" cy="163.5" r="3" fill="#1f3b57"/><circle cx="170.3" cy="150.7" r="3" fill="#1f3b57"/><circle cx="164.8" cy="138.8" r="3" fill="#1f3b57"/><circle cx="165.8" cy="129.9" r="3" fill="#1f3b57"/><circle cx="135.3" cy="111.8" r="3" fill="#1f3b57"/><circle cx="126.8" cy="137.0" r="3" fill="#1f3b57"/><circle cx="161.2" cy="159.4" r="3" fill="#1f3b57"/><circle cx="164.1" cy="138.9" r="3" fill="#1f3b57"/><circle cx="167.7" cy="132.2" r="3" fill="#1f3b57"/><circle cx="122.6" cy="148.0" r="3" fill="#1f3b57"/><text x="150" y="134" font-size="1"></text><line x1="260" y1="130" x2="325" y2="130" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 330 130 L 325 126.5 L 325 133.5 Z" fill="#8a8f94"/><text x="295" y="118" font-size="11.5" text-anchor="middle" fill="#8a8f94">lyse the cell,</text><text x="295" y="152" font-size="11.5" text-anchor="middle" fill="#8a8f94">keep the nucleus</text><circle cx="420" cy="130" r="46" fill="#e8eef5" stroke="#1f3b57" stroke-width="2.4"/><circle cx="424.9" cy="163.5" r="3" fill="#1f3b57"/><circle cx="440.3" cy="150.7" r="3" fill="#1f3b57"/><circle cx="434.8" cy="138.8" r="3" fill="#1f3b57"/><circle cx="435.8" cy="129.9" r="3" fill="#1f3b57"/><circle cx="405.3" cy="111.8" r="3" fill="#1f3b57"/><circle cx="396.8" cy="137.0" r="3" fill="#1f3b57"/><circle cx="431.2" cy="159.4" r="3" fill="#1f3b57"/><circle cx="434.1" cy="138.9" r="3" fill="#1f3b57"/><circle cx="437.7" cy="132.2" r="3" fill="#1f3b57"/><circle cx="392.6" cy="148.0" r="3" fill="#1f3b57"/><text x="420" y="204" font-size="12" text-anchor="middle" fill="#23282d">nucleus: DNA, chromatin and</text><text x="420" y="220" font-size="12" text-anchor="middle" fill="#23282d">nascent RNA stay inside</text><text x="560" y="100" font-size="12.5" fill="#2e6b3f">Good: frozen tissue,</text><text x="560" y="118" font-size="12.5" fill="#2e6b3f">cells too fragile or large</text><text x="560" y="136" font-size="12.5" fill="#2e6b3f">to pass a channel</text><text x="560" y="168" font-size="12.5" fill="#a33a28">Cost: cytoplasmic RNA</text><text x="560" y="186" font-size="12.5" fill="#a33a28">is left behind</text>
</svg>
