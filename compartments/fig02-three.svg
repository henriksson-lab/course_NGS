<text x="40" y="26" font-size="14" fill="#23282d">What is being kept together decides which compartment you need.</text><circle cx="120" cy="110" r="56" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><circle cx="122.3" cy="140.9" r="3.5" fill="#1f3b57"/><circle cx="97.7" cy="133.8" r="3.5" fill="#1f3b57"/><circle cx="112.4" cy="102.4" r="3.5" fill="#1f3b57"/><circle cx="158.3" cy="113.2" r="3.5" fill="#1f3b57"/><circle cx="118.8" cy="130.3" r="3.5" fill="#1f3b57"/><circle cx="148.8" cy="109.2" r="3.5" fill="#1f3b57"/><circle cx="135.0" cy="85.2" r="3.5" fill="#1f3b57"/><circle cx="109.5" cy="97.5" r="3.5" fill="#1f3b57"/><circle cx="94.1" cy="80.7" r="3.5" fill="#1f3b57"/><circle cx="84.2" cy="104.8" r="3.5" fill="#1f3b57"/><circle cx="115.0" cy="100.6" r="3.5" fill="#1f3b57"/><circle cx="121.7" cy="77.8" r="3.5" fill="#1f3b57"/><circle cx="117.7" cy="117.0" r="3.5" fill="#1f3b57"/><circle cx="139.2" cy="88.4" r="3.5" fill="#1f3b57"/><text x="120" y="192" font-size="14" text-anchor="middle" fill="#23282d">one cell</text><text x="120" y="210" font-size="12" text-anchor="middle" fill="#8a8f94">its RNAs together</text><circle cx="360" cy="110" r="56" fill="#f5eae6" stroke="#b4532a" stroke-width="1.4"/><path d="M 320 100 C 340 70, 380 150, 400 120" fill="none" stroke="#b4532a" stroke-width="3"/><line x1="335" y1="135" x2="385" y2="85" stroke="#b4532a" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="360" y="192" font-size="14" text-anchor="middle" fill="#23282d">one long fragment</text><text x="360" y="210" font-size="12" text-anchor="middle" fill="#8a8f94">its pieces together</text><circle cx="600" cy="110" r="56" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.4"/><circle cx="600" cy="110" r="18" fill="#2e6b3f" stroke="#2e6b3f" stroke-width="1.4"/><line x1="600" y1="110" x2="638.0" y2="110.0" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><circle cx="638.0" cy="110.0" r="5" fill="#b4532a"/><line x1="600" y1="110" x2="581.0" y2="142.9089653438087" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><circle cx="581.0" cy="142.9" r="5" fill="#b4532a"/><line x1="600" y1="110" x2="581.0" y2="77.09103465619134" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><circle cx="581.0" cy="77.1" r="5" fill="#b4532a"/><text x="600" y="192" font-size="14" text-anchor="middle" fill="#23282d">one complex</text><text x="600" y="210" font-size="12" text-anchor="middle" fill="#8a8f94">its bound DNA together</text><text x="40" y="246" font-size="14" fill="#b4532a">Cell: droplets, wells, nuclei.  Fragment: partitions.  Complex: split-and-pool.</text>
