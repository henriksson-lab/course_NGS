<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 256" width="740" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="256" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Mapping a read back to its compartment: match to a known list, allow for errors.</text><text x="40" y="66" font-size="13" fill="#8a8f94">observed barcode</text><text x="220" y="66" font-size="15" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ACGTTA</text><text x="330" y="66" font-size="13" fill="#a33a28">not in the whitelist</text><text x="40" y="106" font-size="13" fill="#8a8f94">whitelist neighbours</text><text x="220" y="106" font-size="15" fill="#2e6b3f" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ACGTTC</text><text x="330" y="106" font-size="13" fill="#2e6b3f">one base away, and the only one: correct to it</text><text x="220" y="130" font-size="15" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ACGTAC</text><text x="330" y="130" font-size="13" fill="#8a8f94">two bases away: ignored</text><text x="40" y="170" font-size="13" fill="#8a8f94">a different case</text><text x="220" y="170" font-size="15" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GATTCA</text><text x="330" y="170" font-size="13" fill="#a33a28">one base from two whitelisted barcodes: discard</text><text x="40" y="214.0" font-size="13.5" fill="#b4532a">Barcodes are designed to be several bases apart, so that one sequencing error can be</text><text x="40" y="232.5" font-size="13.5" fill="#b4532a">corrected and not mistaken for another compartment.</text>
</svg>
