<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="262" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Choosing a compartment: orders of magnitude, not guarantees.</text><rect x="40" y="40" width="120" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="100.0" y="59.375" font-size="12.5" text-anchor="middle" fill="#23282d">compartment</text><rect x="160" y="40" width="130" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="59.375" font-size="12.5" text-anchor="middle" fill="#23282d">cells per run</text><rect x="290" y="40" width="140" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="360.0" y="59.375" font-size="12.5" text-anchor="middle" fill="#23282d">doublets</text><rect x="430" y="40" width="140" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="500.0" y="59.375" font-size="12.5" text-anchor="middle" fill="#23282d">needs</text><rect x="570" y="40" width="170" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="655.0" y="59.375" font-size="12.5" text-anchor="middle" fill="#23282d">strength</text><rect x="40" y="70" width="120" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="100.0" y="89.375" font-size="12.5" text-anchor="middle" fill="#23282d">plate wells</text><rect x="160" y="70" width="130" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="89.375" font-size="12.5" text-anchor="middle" fill="#23282d">10^2 to 10^3</text><rect x="290" y="70" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="360.0" y="89.375" font-size="12.5" text-anchor="middle" fill="#23282d">none, if sorted</text><rect x="430" y="70" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="500.0" y="89.375" font-size="12.5" text-anchor="middle" fill="#23282d">sorting</text><rect x="570" y="70" width="170" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="655.0" y="89.375" font-size="12.5" text-anchor="middle" fill="#23282d">full length, imaging</text><rect x="40" y="100" width="120" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="100.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#23282d">microwells</text><rect x="160" y="100" width="130" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#23282d">10^3 to 10^4</text><rect x="290" y="100" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="360.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#23282d">Poisson</text><rect x="430" y="100" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="500.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#23282d">cheap kit</text><rect x="570" y="100" width="170" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="655.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#23282d">no pumps</text><rect x="40" y="130" width="120" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="100.0" y="149.375" font-size="12.5" text-anchor="middle" fill="#23282d">droplets</text><rect x="160" y="130" width="130" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="149.375" font-size="12.5" text-anchor="middle" fill="#23282d">10^3 to 10^5</text><rect x="290" y="130" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="360.0" y="149.375" font-size="12.5" text-anchor="middle" fill="#23282d">Poisson</text><rect x="430" y="130" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="500.0" y="149.375" font-size="12.5" text-anchor="middle" fill="#23282d">microfluidics</text><rect x="570" y="130" width="170" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="655.0" y="149.375" font-size="12.5" text-anchor="middle" fill="#23282d">speed, ease</text><rect x="40" y="160" width="120" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="100.0" y="179.375" font-size="12.5" text-anchor="middle" fill="#23282d">split-pool</text><rect x="160" y="160" width="130" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="179.375" font-size="12.5" text-anchor="middle" fill="#23282d">10^4 to 10^6</text><rect x="290" y="160" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="360.0" y="179.375" font-size="12.5" text-anchor="middle" fill="#23282d">barcode collision</text><rect x="430" y="160" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="500.0" y="179.375" font-size="12.5" text-anchor="middle" fill="#23282d">fixed cells</text><rect x="570" y="160" width="170" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="655.0" y="179.375" font-size="12.5" text-anchor="middle" fill="#23282d">scale, low cost</text><rect x="40" y="190" width="120" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="100.0" y="209.375" font-size="12.5" text-anchor="middle" fill="#23282d">capsules</text><rect x="160" y="190" width="130" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="209.375" font-size="12.5" text-anchor="middle" fill="#23282d">10^4 or more</text><rect x="290" y="190" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="360.0" y="209.375" font-size="12.5" text-anchor="middle" fill="#23282d">Poisson</text><rect x="430" y="190" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="500.0" y="209.375" font-size="12.5" text-anchor="middle" fill="#23282d">special reagents</text><rect x="570" y="190" width="170" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="655.0" y="209.375" font-size="12.5" text-anchor="middle" fill="#23282d">buffer exchange</text><text x="40" y="242" font-size="14" fill="#b4532a">The doublet rate is a design choice in every one of them.</text>
</svg>
