<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 254" width="790" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="254" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Microwells: cells and beads settle by gravity, one well at a time.</text><path d="M 60 80 L 60 130 L 104 130 L 104 80" fill="none" stroke="#8a8f94" stroke-width="1.6"/><text x="82" y="152" font-size="10.5" text-anchor="middle" fill="#8a8f94">empty</text><path d="M 122 80 L 122 130 L 166 130 L 166 80" fill="none" stroke="#8a8f94" stroke-width="1.6"/><circle cx="144" cy="118" r="9" fill="#f5eae6" stroke="#b4532a" stroke-width="1.6"/><circle cx="144" cy="100" r="8" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.6"/><text x="144" y="152" font-size="10.5" text-anchor="middle" fill="#2e6b3f">usable</text><path d="M 184 80 L 184 130 L 228 130 L 228 80" fill="none" stroke="#8a8f94" stroke-width="1.6"/><circle cx="206" cy="118" r="9" fill="#f5eae6" stroke="#b4532a" stroke-width="1.6"/><text x="206" y="152" font-size="10.5" text-anchor="middle" fill="#8a8f94">bead only</text><path d="M 246 80 L 246 130 L 290 130 L 290 80" fill="none" stroke="#8a8f94" stroke-width="1.6"/><circle cx="268" cy="117" r="8" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.6"/><text x="268" y="152" font-size="10.5" text-anchor="middle" fill="#8a8f94">cell only</text><path d="M 308 80 L 308 130 L 352 130 L 352 80" fill="none" stroke="#8a8f94" stroke-width="1.6"/><circle cx="330" cy="118" r="9" fill="#f5eae6" stroke="#b4532a" stroke-width="1.6"/><circle cx="330" cy="100" r="8" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.6"/><text x="330" y="152" font-size="10.5" text-anchor="middle" fill="#2e6b3f">usable</text><path d="M 370 80 L 370 130 L 414 130 L 414 80" fill="none" stroke="#8a8f94" stroke-width="1.6"/><text x="392" y="152" font-size="10.5" text-anchor="middle" fill="#8a8f94"></text><path d="M 432 80 L 432 130 L 476 130 L 476 80" fill="none" stroke="#8a8f94" stroke-width="1.6"/><text x="454" y="152" font-size="10.5" text-anchor="middle" fill="#8a8f94"></text><path d="M 494 80 L 494 130 L 538 130 L 538 80" fill="none" stroke="#8a8f94" stroke-width="1.6"/><circle cx="516" cy="118" r="9" fill="#f5eae6" stroke="#b4532a" stroke-width="1.6"/><circle cx="516" cy="100" r="8" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.6"/><text x="516" y="152" font-size="10.5" text-anchor="middle" fill="#2e6b3f">usable</text><path d="M 556 80 L 556 130 L 600 130 L 600 80" fill="none" stroke="#8a8f94" stroke-width="1.6"/><circle cx="578" cy="118" r="9" fill="#f5eae6" stroke="#b4532a" stroke-width="1.6"/><text x="578" y="152" font-size="10.5" text-anchor="middle" fill="#8a8f94">bead only</text><line x1="50" y1="130" x2="620" y2="130" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><text x="40" y="190" font-size="13.5" fill="#23282d">A semi-sealed array holds them while lysis buffer is added, and each well's bead captures its own cell's RNA.</text><text x="40" y="216" font-size="13" fill="#8a8f94">Seq-Well and Microwell-seq are examples. No pumps are needed, and the loading is still</text><text x="40" y="234" font-size="13" fill="#8a8f94">Poisson.</text>
</svg>
