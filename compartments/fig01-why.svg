<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 764 300" width="764" height="300" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="640" height="300" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A compartment is what lets a barcode say which cell a molecule came from.</text><text x="40" y="56" font-size="13" fill="#8a8f94">Bulk: everything mixed</text><rect x="40" y="66" width="190" height="110" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="74.3" cy="150.9" r="3" fill="#b4532a"/><circle cx="178.8" cy="99.9" r="3" fill="#1f3b57"/><circle cx="134.2" cy="116.7" r="3" fill="#b4532a"/><circle cx="160.2" cy="145.8" r="3" fill="#1f3b57"/><circle cx="67.6" cy="80.4" r="3" fill="#b4532a"/><circle cx="190.7" cy="115.2" r="3" fill="#1f3b57"/><circle cx="178.5" cy="78.2" r="3" fill="#b4532a"/><circle cx="125.9" cy="140.1" r="3" fill="#1f3b57"/><circle cx="90.0" cy="159.3" r="3" fill="#b4532a"/><circle cx="201.6" cy="80.6" r="3" fill="#1f3b57"/><circle cx="56.2" cy="124.6" r="3" fill="#b4532a"/><circle cx="207.9" cy="110.8" r="3" fill="#1f3b57"/><circle cx="88.0" cy="114.3" r="3" fill="#b4532a"/><circle cx="56.8" cy="97.1" r="3" fill="#1f3b57"/><circle cx="124.7" cy="120.6" r="3" fill="#b4532a"/><circle cx="90.7" cy="97.9" r="3" fill="#1f3b57"/><circle cx="88.3" cy="117.5" r="3" fill="#b4532a"/><circle cx="100.1" cy="79.8" r="3" fill="#1f3b57"/><circle cx="191.0" cy="125.9" r="3" fill="#b4532a"/><circle cx="158.6" cy="94.0" r="3" fill="#1f3b57"/><circle cx="216.8" cy="152.0" r="3" fill="#b4532a"/><circle cx="72.1" cy="106.6" r="3" fill="#1f3b57"/><circle cx="171.8" cy="139.2" r="3" fill="#b4532a"/><circle cx="207.4" cy="114.3" r="3" fill="#1f3b57"/><circle cx="189.8" cy="135.6" r="3" fill="#b4532a"/><circle cx="102.4" cy="128.5" r="3" fill="#1f3b57"/><circle cx="198.5" cy="150.8" r="3" fill="#b4532a"/><circle cx="135.9" cy="128.7" r="3" fill="#1f3b57"/><text x="40" y="196" font-size="12.5" fill="#a33a28">reads from cell A and B cannot be told apart</text><text x="300" y="56" font-size="13" fill="#8a8f94">Compartments: one barcode each</text><circle cx="350" cy="121" r="52" fill="none" stroke="#1f3b57" stroke-width="1.8"/><circle cx="327.0" cy="109.9" r="3" fill="#1f3b57"/><circle cx="334.4" cy="112.7" r="3" fill="#1f3b57"/><circle cx="363.7" cy="88.4" r="3" fill="#1f3b57"/><circle cx="341.1" cy="108.2" r="3" fill="#1f3b57"/><circle cx="327.9" cy="118.1" r="3" fill="#1f3b57"/><circle cx="350.0" cy="159.1" r="3" fill="#1f3b57"/><circle cx="358.2" cy="120.8" r="3" fill="#1f3b57"/><circle cx="369.3" cy="97.7" r="3" fill="#1f3b57"/><circle cx="334.7" cy="135.1" r="3" fill="#1f3b57"/><circle cx="338.0" cy="97.5" r="3" fill="#1f3b57"/><circle cx="337.6" cy="91.8" r="3" fill="#1f3b57"/><circle cx="372.9" cy="146.3" r="3" fill="#1f3b57"/><rect x="316" y="188" width="68" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="350.0" y="202.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">barcode 1</text><line x1="350" y1="173" x2="350" y2="188" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><circle cx="500" cy="121" r="52" fill="none" stroke="#b4532a" stroke-width="1.8"/><circle cx="472.1" cy="129.6" r="3" fill="#b4532a"/><circle cx="523.7" cy="108.8" r="3" fill="#b4532a"/><circle cx="470.1" cy="119.5" r="3" fill="#b4532a"/><circle cx="511.1" cy="146.6" r="3" fill="#b4532a"/><circle cx="476.2" cy="95.7" r="3" fill="#b4532a"/><circle cx="517.8" cy="133.0" r="3" fill="#b4532a"/><circle cx="529.5" cy="139.9" r="3" fill="#b4532a"/><circle cx="497.2" cy="113.5" r="3" fill="#b4532a"/><circle cx="538.1" cy="116.7" r="3" fill="#b4532a"/><circle cx="482.6" cy="95.8" r="3" fill="#b4532a"/><circle cx="502.6" cy="125.0" r="3" fill="#b4532a"/><circle cx="490.6" cy="119.3" r="3" fill="#b4532a"/><rect x="466" y="188" width="68" height="20" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="500.0" y="202.025" font-size="11.5" text-anchor="middle" fill="#b4532a">barcode 2</text><line x1="500" y1="173" x2="500" y2="188" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="300" y="232" font-size="12.5" fill="#2e6b3f">every read carries its compartment's barcode, so reads regroup by origin</text><text x="40" y="262" font-size="14" fill="#b4532a">Everything a single-cell, single-fragment or single-complex method does is a way of</text><text x="40" y="281" font-size="14" fill="#b4532a">keeping the barcode attached to the right molecules.</text>
</svg>
