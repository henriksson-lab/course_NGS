<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 284" width="780" height="284" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="284" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Split-and-pool: the barcode is the path a cell takes, not the tube it is in.</text><text x="116" y="52" font-size="12.5" text-anchor="middle" fill="#8a8f94">round 1</text><rect x="100" y="64" width="32" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="116.0" y="82.025" font-size="11.5" text-anchor="middle" fill="#23282d">1A</text><rect x="100" y="104" width="32" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="116.0" y="122.025" font-size="11.5" text-anchor="middle" fill="#23282d">1B</text><rect x="100" y="144" width="32" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="116.0" y="162.025" font-size="11.5" text-anchor="middle" fill="#23282d">1C</text><text x="306" y="52" font-size="12.5" text-anchor="middle" fill="#8a8f94">round 2</text><rect x="290" y="64" width="32" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="306.0" y="82.025" font-size="11.5" text-anchor="middle" fill="#23282d">2A</text><rect x="290" y="104" width="32" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="306.0" y="122.025" font-size="11.5" text-anchor="middle" fill="#23282d">2B</text><rect x="290" y="144" width="32" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="306.0" y="162.025" font-size="11.5" text-anchor="middle" fill="#23282d">2C</text><text x="496" y="52" font-size="12.5" text-anchor="middle" fill="#8a8f94">round 3</text><rect x="480" y="64" width="32" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="496.0" y="82.025" font-size="11.5" text-anchor="middle" fill="#23282d">3A</text><rect x="480" y="104" width="32" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="496.0" y="122.025" font-size="11.5" text-anchor="middle" fill="#23282d">3B</text><rect x="480" y="144" width="32" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="496.0" y="162.025" font-size="11.5" text-anchor="middle" fill="#23282d">3C</text><line x1="134" y1="118" x2="288" y2="78" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="324" y1="78" x2="478" y2="158" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="134" y1="158" x2="288" y2="78" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="324" y1="78" x2="478" y2="118" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="134" y1="118" x2="288" y2="158" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><line x1="324" y1="158" x2="478" y2="158" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><text x="40" y="212" font-size="12" fill="#8a8f94">pooled and redistributed between rounds</text><text x="640" y="80" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>cell 1: 1B2A3C</text><text x="640" y="104" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>cell 2: 1C2A3B</text><text x="640" y="128" font-size="13" fill="#2e6b3f" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>cell 3: 1B2C3C</text><text x="40" y="238.0" font-size="13.5" fill="#b4532a">Cells 1 and 3 share wells in rounds 1 and 3 and part only in round 2, so their barcodes still</text><text x="40" y="256.5" font-size="13.5" fill="#b4532a">differ. 96 x 96 x 96 wells give 884,736 distinct barcodes from 288 oligos.</text>
</svg>
