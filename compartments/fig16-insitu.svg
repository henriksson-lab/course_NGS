<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 262" width="740" height="262" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="262" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">In-situ reactions: add the barcode inside the nucleus, with nothing leaving.</text><circle cx="120" cy="110" r="52" fill="#e8eef5" stroke="#1f3b57" stroke-width="2.2"/><path d="M 90 100 C 110 70, 130 140, 150 110" fill="none" stroke="#8a8f94" stroke-width="2.4"/><path d="M 101 99 L 96 109 L 106 109 Z" fill="#1f3b57"/><path d="M 123 86 L 118 96 L 128 96 Z" fill="#1f3b57"/><path d="M 139 99 L 134 109 L 144 109 Z" fill="#1f3b57"/><text x="120" y="186" font-size="12" text-anchor="middle" fill="#1f3b57">barcode A on the enzyme</text><circle cx="300" cy="110" r="52" fill="#f5eae6" stroke="#b4532a" stroke-width="2.2"/><path d="M 270 100 C 290 70, 310 140, 330 110" fill="none" stroke="#8a8f94" stroke-width="2.4"/><path d="M 281 99 L 276 109 L 286 109 Z" fill="#b4532a"/><path d="M 303 86 L 298 96 L 308 96 Z" fill="#b4532a"/><path d="M 319 99 L 314 109 L 324 109 Z" fill="#b4532a"/><text x="300" y="186" font-size="12" text-anchor="middle" fill="#b4532a">barcode B on the enzyme</text><text x="420" y="84" font-size="12.5" fill="#23282d">Tagmentation or reverse transcription</text><text x="420" y="102" font-size="12.5" fill="#23282d">runs in intact nuclei, in separate wells.</text><text x="420" y="130" font-size="12.5" fill="#23282d">Nuclei are pooled afterwards; the</text><text x="420" y="148" font-size="12.5" fill="#23282d">barcode already sits on every fragment</text><text x="420" y="166" font-size="12.5" fill="#23282d">of its own nucleus.</text><text x="40" y="222.0" font-size="13.5" fill="#b4532a">The nuclear membrane is the compartment, so reagents must be small enough to enter and the</text><text x="40" y="240.5" font-size="13.5" fill="#b4532a">product must be large enough to stay.</text>
</svg>
