<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" width="740" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="270" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Droplets: a water-in-oil emulsion makes millions of private reaction vessels.</text><rect x="40" y="70" width="150" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="115.0" y="87.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">cells + beads in water</text><line x1="190" y1="83" x2="300" y2="83" stroke="#1f3b57" stroke-width="14" stroke-linecap="round"/><rect x="190" y="150" width="110" height="26" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="245.0" y="167.025" font-size="11.5" text-anchor="middle" fill="#b4532a">oil</text><line x1="245" y1="150" x2="245" y2="96" stroke="#b4532a" stroke-width="12" stroke-linecap="round"/><line x1="300" y1="83" x2="330" y2="83" stroke="#1f3b57" stroke-width="14" stroke-linecap="round"/><circle cx="360" cy="83" r="17" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><circle cx="356" cy="78" r="5" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><circle cx="366" cy="90" r="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.4"/><circle cx="404" cy="83" r="17" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><circle cx="404" cy="83" r="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.4"/><circle cx="448" cy="83" r="17" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="492" cy="83" r="17" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><circle cx="488" cy="78" r="5" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><circle cx="498" cy="90" r="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.4"/><circle cx="536" cy="83" r="17" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><circle cx="532" cy="78" r="5" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><circle cx="580" cy="83" r="17" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="624" cy="83" r="17" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><circle cx="620" cy="78" r="5" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><circle cx="630" cy="90" r="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.4"/><circle cx="668" cy="83" r="17" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><line x1="360" y1="102" x2="360" y2="115" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="360" y="126" font-size="11.5" text-anchor="middle" fill="#2e6b3f">usable</text><line x1="404" y1="102" x2="404" y2="134" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="404" y="145" font-size="11.5" text-anchor="middle" fill="#8a8f94">bead only</text><line x1="536" y1="102" x2="536" y2="115" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="536" y="126" font-size="11.5" text-anchor="middle" fill="#8a8f94">cell, no bead: lost</text><text x="40" y="206.0" font-size="13.5" fill="#23282d">Inside each droplet the cell is lysed, its RNA is captured on the bead, and reverse</text><text x="40" y="224.5" font-size="13.5" fill="#23282d">transcription runs. The oil keeps neighbours apart.</text><text x="40" y="252" font-size="14" fill="#b4532a">Cells and beads arrive at random, so droplet contents follow Poisson statistics.</text>
</svg>
