<text x="40" y="26" font-size="14" fill="#23282d">Rank the barcodes by reads: cells, then ambient RNA from empty droplets.</text><line x1="90" y1="220" x2="510" y2="220" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="90" y1="220" x2="90" y2="60" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><polyline points="90,92 94,92 98,92 103,92 107,92 111,93 115,93 119,93 124,93 128,93 132,93 136,94 140,94 145,94 149,94 153,94 157,94 161,95 166,95 170,95 174,95 178,95 182,95 187,95 191,96 195,96 199,96 203,96 208,96 212,96 216,97 220,97 224,97 229,97 233,97 237,97 241,98 245,98 250,98 254,98 258,98 262,98 266,99 271,99 275,99 279,99 283,99 287,99 292,99 296,100 300,100 304,100 308,100 313,100 317,100 321,101 325,101 329,101 334,101 338,101 342,101 346,102 350,102 355,102 359,102 363,102 367,102 371,103 376,103 380,103 384,103 388,103 392,103 397,103 401,104 405,104 409,108 413,112 418,117 422,121 426,125 430,130 434,134 439,138 443,142 447,147 451,151 455,155 460,159 464,163 468,167 472,170 476,174 481,177 485,180 489,184 493,186 497,189 502,192 506,194 510,196" fill="none" stroke="#1f3b57" stroke-width="2.4"/><line x1="407.3647050322261" y1="220" x2="407.3647050322261" y2="60" stroke="#a33a28" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3"/><text x="413.3647050322261" y="70" font-size="12" fill="#a33a28">the knee: keep barcodes to the left</text><text x="130" y="130" font-size="12.5" fill="#1f3b57">cells</text><text x="420" y="184" font-size="12.5" fill="#8a8f94">ambient</text><text x="300.0" y="240" font-size="12" text-anchor="middle" fill="#8a8f94">barcode rank (log)</text><text x="82" y="140.0" font-size="12" text-anchor="end" fill="#8a8f94">UMIs (log)</text><text x="40" y="262.0" font-size="13.5" fill="#b4532a">Barcodes below the knee are droplets that held free RNA, not a cell. Fixed cells leak</text><text x="40" y="280.5" font-size="13.5" fill="#b4532a">less, so the ambient floor is lower.</text>
