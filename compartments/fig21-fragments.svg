<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 258" width="720" height="258" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="258" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Compartments can keep a long fragment's pieces together too.</text><text x="40" y="46" font-size="12" fill="#8a8f94">two long DNA molecules, 100 kb or more</text><line x1="40" y1="62" x2="360" y2="62" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="40" y1="82" x2="360" y2="82" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><line x1="380" y1="72" x2="425" y2="72" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 430 72 L 425 68.5 L 425 75.5 Z" fill="#8a8f94"/><circle cx="500" cy="100" r="46" fill="none" stroke="#1f3b57" stroke-width="1.8"/><line x1="470" y1="80" x2="486" y2="88" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="490" y1="94" x2="506" y2="102" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="510" y1="108" x2="526" y2="116" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="460" y="160" width="80" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="500.0" y="174.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">barcode 1</text><circle cx="620" cy="100" r="46" fill="none" stroke="#b4532a" stroke-width="1.8"/><line x1="590" y1="80" x2="606" y2="88" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="610" y1="94" x2="626" y2="102" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="630" y1="108" x2="646" y2="116" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><rect x="580" y="160" width="80" height="20" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="620.0" y="174.025" font-size="11.5" text-anchor="middle" fill="#b4532a">barcode 2</text><text x="40" y="120" font-size="12.5" fill="#23282d">fragmented inside the</text><text x="40" y="138" font-size="12.5" fill="#23282d">partition, each piece gets</text><text x="40" y="156" font-size="12.5" fill="#23282d">the partition's barcode</text><text x="40" y="214.0" font-size="13.5" fill="#b4532a">Short reads with the same barcode came from the same long molecule, which recovers</text><text x="40" y="232.5" font-size="13.5" fill="#b4532a">haplotypes. Few molecules per partition keep it unambiguous.</text>
</svg>
