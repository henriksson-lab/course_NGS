<text x="40" y="26" font-size="14" fill="#23282d">How many cells does a droplet get? It depends on the mean, lambda.</text><text x="40" y="56" font-size="13.5" fill="#23282d">lambda = 0.1</text><rect x="40" y="90.5" width="34" height="99.5" fill="#8a8f94"/><text x="57" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">0</text><text x="57" y="85.46788401604445" font-size="10.5" text-anchor="middle" fill="#23282d">90.5%</text><rect x="90" y="180.0" width="34" height="10.0" fill="#2e6b3f"/><text x="107" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">1</text><text x="107" y="175.04678840160443" font-size="10.5" text-anchor="middle" fill="#23282d">9.0%</text><rect x="140" y="189.5" width="34" height="0.5" fill="#a33a28"/><text x="157" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">2</text><text x="157" y="184.50233942008023" font-size="10.5" text-anchor="middle" fill="#23282d">0.5%</text><rect x="190" y="190.0" width="34" height="0.0" fill="#a33a28"/><text x="207" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">3+</text><text x="207" y="184.98298816227089" font-size="10.5" text-anchor="middle" fill="#23282d">0.0%</text><line x1="36" y1="190" x2="240" y2="190" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="290" y="56" font-size="13.5" fill="#23282d">lambda = 0.5</text><rect x="290" y="123.3" width="34" height="66.7" fill="#8a8f94"/><text x="307" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">0</text><text x="307" y="118.28162743161032" font-size="10.5" text-anchor="middle" fill="#23282d">60.7%</text><rect x="340" y="156.6" width="34" height="33.4" fill="#2e6b3f"/><text x="357" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">1</text><text x="357" y="151.64081371580517" font-size="10.5" text-anchor="middle" fill="#23282d">30.3%</text><rect x="390" y="181.7" width="34" height="8.3" fill="#a33a28"/><text x="407" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">2</text><text x="407" y="176.6602034289513" font-size="10.5" text-anchor="middle" fill="#23282d">7.6%</text><rect x="440" y="188.4" width="34" height="1.6" fill="#a33a28"/><text x="457" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">3+</text><text x="457" y="183.4173554236332" font-size="10.5" text-anchor="middle" fill="#23282d">1.4%</text><line x1="286" y1="190" x2="490" y2="190" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="540" y="56" font-size="13.5" fill="#23282d">lambda = 1</text><rect x="540" y="149.5" width="34" height="40.5" fill="#8a8f94"/><text x="557" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">0</text><text x="557" y="144.53326147114134" font-size="10.5" text-anchor="middle" fill="#23282d">36.8%</text><rect x="590" y="149.5" width="34" height="40.5" fill="#2e6b3f"/><text x="607" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">1</text><text x="607" y="144.53326147114134" font-size="10.5" text-anchor="middle" fill="#23282d">36.8%</text><rect x="640" y="169.8" width="34" height="20.2" fill="#a33a28"/><text x="657" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">2</text><text x="657" y="164.7666307355707" font-size="10.5" text-anchor="middle" fill="#23282d">18.4%</text><rect x="690" y="181.2" width="34" height="8.8" fill="#a33a28"/><text x="707" y="206" font-size="12.5" text-anchor="middle" fill="#23282d">3+</text><text x="707" y="176.16684632214665" font-size="10.5" text-anchor="middle" fill="#23282d">8.0%</text><line x1="536" y1="190" x2="740" y2="190" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="40" y="230" font-size="12" fill="#8a8f94">cells per droplet</text><text x="40" y="258.0" font-size="13.5" fill="#b4532a">P(k) = e^(-lambda) lambda^k / k! Green is the droplet you want, red is a doublet or worse.</text>
