<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 276" width="760" height="276" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="276" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Complexes: tag every piece in a complex with the same barcode string.</text><circle cx="130" cy="104" r="40" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.8"/><line x1="162.9089653438087" y1="123.0" x2="183.69357503463522" y2="135.0" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><circle cx="183.7" cy="135.0" r="5" fill="#1f3b57"/><line x1="97.09103465619133" y1="123.0" x2="76.3064249653648" y2="135.0" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><circle cx="76.3" cy="135.0" r="5" fill="#1f3b57"/><line x1="130.0" y1="66.0" x2="130.0" y2="42.0" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><circle cx="130.0" cy="42.0" r="5" fill="#1f3b57"/><text x="130" y="200" font-size="13" text-anchor="middle" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>1A-2C-3B</text><circle cx="420" cy="104" r="40" fill="#f5eae6" stroke="#b4532a" stroke-width="1.8"/><line x1="452.9089653438087" y1="123.0" x2="473.6935750346352" y2="135.0" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><circle cx="473.7" cy="135.0" r="5" fill="#b4532a"/><line x1="387.0910346561913" y1="123.0" x2="366.3064249653648" y2="135.0" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><circle cx="366.3" cy="135.0" r="5" fill="#b4532a"/><line x1="420.0" y1="66.0" x2="420.0" y2="42.0" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><circle cx="420.0" cy="42.0" r="5" fill="#b4532a"/><text x="420" y="200" font-size="13" text-anchor="middle" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>1B-2A-3C</text><text x="250" y="100" font-size="12" text-anchor="middle" fill="#8a8f94">pieces of one complex</text><text x="250" y="118" font-size="12" text-anchor="middle" fill="#8a8f94">share the string</text><text x="40" y="238.0" font-size="13.5" fill="#b4532a">Crosslink, then split-pool: ligate a new tag in each round. DNA or RNA in the same complex</text><text x="40" y="256.5" font-size="13.5" fill="#b4532a">end up with identical barcodes; a different complex has another.</text><text x="560" y="90" font-size="12.5" fill="#23282d">SPRITE reads which</text><text x="560" y="108" font-size="12.5" fill="#23282d">regions share a complex,</text><text x="560" y="126" font-size="12.5" fill="#23282d">with no droplets or</text><text x="560" y="144" font-size="12.5" fill="#23282d">ligation of neighbours.</text>
</svg>
