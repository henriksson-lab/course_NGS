<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 274" width="760" height="274" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="274" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">The barcode is printed on the bead. One bead, one barcode, many UMIs.</text><circle cx="90" cy="130" r="56" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.8"/><text x="90" y="134" font-size="13" text-anchor="middle" fill="#1f3b57">bead</text><line x1="146" y1="100" x2="180" y2="76" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><rect x="180" y="66" width="90" height="20" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="80.2" font-size="12" text-anchor="middle" fill="#8a8f94">handle</text><rect x="270" y="66" width="110" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="325.0" y="80.2" font-size="12" text-anchor="middle" fill="#1f3b57">AGCTTG</text><rect x="380" y="66" width="50" height="20" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="405.0" y="80.2" font-size="12" text-anchor="middle" fill="#a33a28">TCA</text><rect x="430" y="66" width="70" height="20" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="465.0" y="80.2" font-size="12" text-anchor="middle" fill="#2e6b3f">TTTTTT</text><line x1="146" y1="118" x2="180" y2="112" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><rect x="180" y="102" width="90" height="20" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="116.2" font-size="12" text-anchor="middle" fill="#8a8f94">handle</text><rect x="270" y="102" width="110" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="325.0" y="116.2" font-size="12" text-anchor="middle" fill="#1f3b57">AGCTTG</text><rect x="380" y="102" width="50" height="20" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="405.0" y="116.2" font-size="12" text-anchor="middle" fill="#a33a28">GAT</text><rect x="430" y="102" width="70" height="20" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="465.0" y="116.2" font-size="12" text-anchor="middle" fill="#2e6b3f">TTTTTT</text><line x1="146" y1="136" x2="180" y2="148" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><rect x="180" y="138" width="90" height="20" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="152.2" font-size="12" text-anchor="middle" fill="#8a8f94">handle</text><rect x="270" y="138" width="110" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="325.0" y="152.2" font-size="12" text-anchor="middle" fill="#1f3b57">AGCTTG</text><rect x="380" y="138" width="50" height="20" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="405.0" y="152.2" font-size="12" text-anchor="middle" fill="#a33a28">CCG</text><rect x="430" y="138" width="70" height="20" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="465.0" y="152.2" font-size="12" text-anchor="middle" fill="#2e6b3f">TTTTTT</text><line x1="146" y1="154" x2="180" y2="184" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><rect x="180" y="174" width="90" height="20" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="188.2" font-size="12" text-anchor="middle" fill="#8a8f94">handle</text><rect x="270" y="174" width="110" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="325.0" y="188.2" font-size="12" text-anchor="middle" fill="#1f3b57">AGCTTG</text><rect x="380" y="174" width="50" height="20" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="405.0" y="188.2" font-size="12" text-anchor="middle" fill="#a33a28">ATA</text><rect x="430" y="174" width="70" height="20" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="465.0" y="188.2" font-size="12" text-anchor="middle" fill="#2e6b3f">TTTTTT</text><text x="290" y="54" font-size="12" fill="#1f3b57">same per bead</text><text x="390" y="54" font-size="12" fill="#a33a28">differs per oligo</text><line x1="580" y1="160" x2="525" y2="160" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 520 160 L 525 156.5 L 525 163.5 Z" fill="#8a8f94"/><text x="590" y="166" font-size="12.5" fill="#8a8f94">mRNA poly(A) tail</text><text x="180" y="230.0" font-size="13.5" fill="#b4532a">The cell barcode names the compartment; the UMI names the molecule. Reverse</text><text x="180" y="248.5" font-size="13.5" fill="#b4532a">transcription writes both into the cDNA.</text>
</svg>
