<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 270" width="800" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="270" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Two-stage: pre-index in wells, then overload droplets on purpose.</text><text x="40" y="56" font-size="12.5" fill="#8a8f94">Stage 1: wells give each nucleus an index</text><rect x="40" y="66" width="46" height="30" rx="4" fill="none" stroke="#1f3b57" stroke-width="1.2"/><text x="63.0" y="85.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">idx 1</text><rect x="100" y="66" width="46" height="30" rx="4" fill="none" stroke="#b4532a" stroke-width="1.2"/><text x="123.0" y="85.025" font-size="11.5" text-anchor="middle" fill="#b4532a">idx 2</text><rect x="160" y="66" width="46" height="30" rx="4" fill="none" stroke="#2e6b3f" stroke-width="1.2"/><text x="183.0" y="85.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">idx 3</text><rect x="220" y="66" width="46" height="30" rx="4" fill="none" stroke="#7a5aa0" stroke-width="1.2"/><text x="243.0" y="85.025" font-size="11.5" text-anchor="middle" fill="#7a5aa0">idx 4</text><line x1="290" y1="82" x2="345" y2="82" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 350 82 L 345 78.5 L 345 85.5 Z" fill="#8a8f94"/><text x="320" y="70" font-size="11.5" text-anchor="middle" fill="#8a8f94">pool</text><text x="380" y="56" font-size="12.5" fill="#8a8f94">Stage 2: many nuclei per droplet</text><circle cx="450" cy="130" r="58" fill="none" stroke="#8a8f94" stroke-width="1.6"/><circle cx="426" cy="114" r="10" fill="none" stroke="#1f3b57" stroke-width="2.2"/><circle cx="470" cy="110" r="10" fill="none" stroke="#b4532a" stroke-width="2.2"/><circle cx="446" cy="152" r="10" fill="none" stroke="#2e6b3f" stroke-width="2.2"/><circle cx="480" cy="146" r="10" fill="none" stroke="#7a5aa0" stroke-width="2.2"/><circle cx="420" cy="148" r="10" fill="none" stroke="#b4532a" stroke-width="2.2"/><rect x="400" y="200" width="100" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="450.0" y="214.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">droplet barcode</text><text x="590" y="100" font-size="12.5" fill="#23282d">Each nucleus: (index, droplet)</text><text x="590" y="118" font-size="12.5" fill="#23282d">A collision needs the same</text><text x="590" y="136" font-size="12.5" fill="#23282d">index in the same droplet.</text><text x="590" y="170" font-size="12.5" fill="#b4532a">5 nuclei per droplet,</text><text x="590" y="188" font-size="12.5" fill="#b4532a">96 indexes: about 4%</text><text x="590" y="206" font-size="12.5" fill="#b4532a">lost, not 96%.</text><text x="40" y="236" font-size="13" fill="#8a8f94">A nucleus can only collide with the other four, not with itself:</text><text x="40" y="256" font-size="13" fill="#8a8f94">1 - e^(-4/96) = 4.1% of nuclei share a droplet with a nucleus of the same index.</text>
</svg>
