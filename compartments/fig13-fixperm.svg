<text x="40" y="26" font-size="14" fill="#23282d">Fix and permeabilise: make the cell its own sealed reaction vessel.</text><text x="130" y="54" font-size="13" text-anchor="middle" fill="#23282d">1. live cell</text><circle cx="130" cy="120" r="52" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.8"/><circle cx="156.8" cy="101.9" r="3" fill="#1f3b57"/><circle cx="133.8" cy="83.1" r="3" fill="#1f3b57"/><circle cx="128.1" cy="151.0" r="3" fill="#1f3b57"/><circle cx="160.1" cy="99.5" r="3" fill="#1f3b57"/><circle cx="115.6" cy="112.9" r="3" fill="#1f3b57"/><circle cx="97.0" cy="140.5" r="3" fill="#1f3b57"/><circle cx="147.6" cy="133.3" r="3" fill="#1f3b57"/><circle cx="154.9" cy="111.9" r="3" fill="#1f3b57"/><circle cx="135.6" cy="141.2" r="3" fill="#1f3b57"/><circle cx="149.0" cy="107.7" r="3" fill="#1f3b57"/><text x="380" y="54" font-size="13" text-anchor="middle" fill="#23282d">2. fix</text><circle cx="380" cy="120" r="52" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.8"/><circle cx="396.5" cy="147.9" r="3" fill="#1f3b57"/><circle cx="362.1" cy="99.8" r="3" fill="#1f3b57"/><circle cx="387.4" cy="153.9" r="3" fill="#1f3b57"/><circle cx="389.9" cy="93.9" r="3" fill="#1f3b57"/><circle cx="361.1" cy="119.4" r="3" fill="#1f3b57"/><circle cx="403.8" cy="120.5" r="3" fill="#1f3b57"/><circle cx="371.2" cy="114.8" r="3" fill="#1f3b57"/><circle cx="385.1" cy="101.9" r="3" fill="#1f3b57"/><circle cx="380.9" cy="128.0" r="3" fill="#1f3b57"/><circle cx="413.5" cy="119.5" r="3" fill="#1f3b57"/><text x="416.0" y="124.0" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="409.1" y="145.2" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="391.1" y="158.2" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="368.9" y="158.2" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="350.9" y="145.2" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="344.0" y="124.0" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="350.9" y="102.8" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="368.9" y="89.8" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="391.1" y="89.8" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="409.1" y="102.8" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="630" y="54" font-size="13" text-anchor="middle" fill="#23282d">3. permeabilise, add reagents</text><circle cx="630" cy="120" r="52" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><circle cx="644.1" cy="116.2" r="3" fill="#1f3b57"/><circle cx="668.5" cy="125.8" r="3" fill="#1f3b57"/><circle cx="635.4" cy="132.4" r="3" fill="#1f3b57"/><circle cx="616.7" cy="101.3" r="3" fill="#1f3b57"/><circle cx="644.4" cy="108.0" r="3" fill="#1f3b57"/><circle cx="651.3" cy="114.4" r="3" fill="#1f3b57"/><circle cx="599.7" cy="97.7" r="3" fill="#1f3b57"/><circle cx="615.2" cy="85.6" r="3" fill="#1f3b57"/><circle cx="627.8" cy="111.7" r="3" fill="#1f3b57"/><circle cx="652.0" cy="99.7" r="3" fill="#1f3b57"/><circle cx="681.2" cy="129.0" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="656.0" cy="165.0" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="612.2" cy="168.9" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="581.1" cy="137.8" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="585.0" cy="94.0" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="621.0" cy="68.8" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="663.4" cy="80.2" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><line x1="730" y1="100" x2="683" y2="100" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 678 100 L 683 96.5 L 683 103.5 Z" fill="#b4532a"/><text x="686" y="92" font-size="11" fill="#b4532a">barcode oligo</text><text x="130" y="196" font-size="12" text-anchor="middle" fill="#a33a28">RNA free to leak</text><text x="380" y="196" font-size="12" text-anchor="middle" fill="#2e6b3f">RNA crosslinked in place</text><text x="630" y="196" font-size="12" text-anchor="middle" fill="#2e6b3f">big molecules stay, small ones enter</text><text x="40" y="228.0" font-size="13.5" fill="#b4532a">Fixation holds the molecules in; pores let the enzymes and oligos in. No droplet is</text><text x="40" y="246.5" font-size="13.5" fill="#b4532a">needed, and cells can be stored fixed and processed together.</text>
</svg>
