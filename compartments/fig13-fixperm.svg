"#b4532a">x</text><text x="344.4" y="98.1" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="366.4" y="82.2" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="393.6" y="82.2" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="415.6" y="98.1" font-size="10" text-anchor="middle" fill="#b4532a">x</text><text x="630" y="54" font-size="13" text-anchor="middle" fill="#23282d">3. permeabilise, add reagents</text><circle cx="630" cy="120" r="52" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><circle cx="641.9" cy="116.8" r="3" fill="#1f3b57"/><circle cx="662.6" cy="124.9" r="3" fill="#1f3b57"/><circle cx="634.6" cy="130.5" r="3" fill="#1f3b57"/><circle cx="618.7" cy="104.2" r="3" fill="#1f3b57"/><circle cx="642.2" cy="109.8" r="3" fill="#1f3b57"/><circle cx="648.1" cy="115.3" r="3" fill="#1f3b57"/><circle cx="604.4" cy="101.1" r="3" fill="#1f3b57"/><circle cx="617.5" cy="90.9" r="3" fill="#1f3b57"/><circle cx="628.1" cy="113.0" r="3" fill="#1f3b57"/><circle cx="648.6" cy="102.8" r="3" fill="#1f3b57"/><circle cx="681.2" cy="129.0" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="656.0" cy="165.0" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="612.2" cy="168.9" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="581.1" cy="137.8" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="585.0" cy="94.0" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="621.0" cy="68.8" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><circle cx="663.4" cy="80.2" r="3.5" fill="#ffffff" stroke="#8a8f94" stroke-width="1"/><line x1="730" y1="100" x2="683" y2="100" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 678 100 L 683 96.5 L 683 103.5 Z" fill="#b4532a"/><text x="686" y="92" font-size="11" fill="#b4532a">barcode oligo</text><text x="130" y="196" font-size="12" text-anchor="middle" fill="#a33a28">RNA free to leak</text><text x="380" y="196" font-size="12" text-anchor="middle" fill="#2e6b3f">RNA crosslinked in place</text><text x="630" y="196" font-size="12" text-anchor="middle" fill="#2e6b3f">big molecules stay, small ones enter</text><text x="40" y="228.0" font-size="13.5" fill="#b4532a">Fixation holds the molecules in; pores let the enzymes and oligos in. No droplet is</text><text x="40" y="246.5" font-size="13.5" fill="#b4532a">needed, and cells can be stored fixed and processed together.</text>
