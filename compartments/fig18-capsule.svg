<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 264" width="820" height="264" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="264" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Capsules and hydrogels: a compartment you can change the buffer around.</text><text x="40" y="56" font-size="13" fill="#8a8f94">Droplet: sealed by oil</text><circle cx="120" cy="130" r="50" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.8"/><circle cx="100.4" cy="125.1" r="3" fill="#1f3b57"/><circle cx="149.8" cy="135.7" r="3" fill="#1f3b57"/><circle cx="124.7" cy="148.4" r="3" fill="#1f3b57"/><circle cx="96.0" cy="148.1" r="3" fill="#1f3b57"/><circle cx="145.4" cy="128.2" r="3" fill="#1f3b57"/><circle cx="157.3" cy="128.5" r="3" fill="#1f3b57"/><circle cx="120.5" cy="140.1" r="3" fill="#1f3b57"/><circle cx="138.5" cy="159.0" r="3" fill="#1f3b57"/><text x="120" y="202" font-size="12" text-anchor="middle" fill="#23282d">contents are fixed at</text><text x="120" y="218" font-size="12" text-anchor="middle" fill="#23282d">encapsulation</text><text x="330" y="56" font-size="13" fill="#8a8f94">Capsule: a porous shell</text><circle cx="400" cy="130" r="50" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="3" stroke-dasharray="6 4"/><circle cx="412.5" cy="131.0" r="3" fill="#1f3b57"/><circle cx="375.8" cy="149.3" r="3" fill="#1f3b57"/><circle cx="408.1" cy="139.6" r="3" fill="#1f3b57"/><circle cx="403.7" cy="162.4" r="3" fill="#1f3b57"/><circle cx="419.4" cy="155.8" r="3" fill="#1f3b57"/><circle cx="392.7" cy="118.2" r="3" fill="#1f3b57"/><circle cx="375.5" cy="124.4" r="3" fill="#1f3b57"/><circle cx="368.1" cy="149.5" r="3" fill="#1f3b57"/><line x1="324.8" y1="157.4" x2="349.3" y2="148.5" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><circle cx="324.8" cy="157.4" r="3.5" fill="#b4532a"/><line x1="324.8" y1="102.6" x2="349.3" y2="111.5" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><circle cx="324.8" cy="102.6" r="3.5" fill="#b4532a"/><line x1="475.2" y1="102.6" x2="450.7" y2="111.5" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><circle cx="475.2" cy="102.6" r="3.5" fill="#b4532a"/><line x1="475.2" y1="157.4" x2="450.7" y2="148.5" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><circle cx="475.2" cy="157.4" r="3.5" fill="#b4532a"/><text x="400" y="222" font-size="12" text-anchor="middle" fill="#23282d">reagents pass in and out;</text><text x="400" y="238" font-size="12" text-anchor="middle" fill="#23282d">large DNA and RNA stay</text><text x="540" y="90.0" font-size="12.5" fill="#23282d">Steps with incompatible buffers, such as</text><text x="540" y="107.5" font-size="12.5" fill="#23282d">lysis then enzymatic reactions, can run</text><text x="540" y="125.0" font-size="12.5" fill="#23282d">in sequence without re-making the</text><text x="540" y="142.5" font-size="12.5" fill="#23282d">compartment.</text><text x="540" y="184.0" font-size="12.5" fill="#8a8f94">Particle-templated emulsification uses</text><text x="540" y="201.5" font-size="12.5" fill="#8a8f94">hydrogel beads to form droplets by</text><text x="540" y="219.0" font-size="12.5" fill="#8a8f94">vortexing, without a microfluidic chip.</text>
</svg>
