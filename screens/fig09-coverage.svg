<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" width="720" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="254" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">How many guides are missing, for an ideally even pool of 100,000 guides</text><text x="30" y="69" font-size="13" fill="#23282d">1x coverage</text><rect x="130" y="52" width="303" height="22" fill="#a33a28" opacity="0.8"/><text x="440.95902282489186" y="68" font-size="12.5" fill="#8a8f94">36,788 guides lost</text><text x="30" y="103" font-size="13" fill="#23282d">3x coverage</text><rect x="130" y="86" width="249" height="22" fill="#a33a28" opacity="0.8"/><text x="386.87706847467564" y="102" font-size="12.5" fill="#8a8f94">4,979 guides lost</text><text x="30" y="137" font-size="13" fill="#23282d">5x coverage</text><rect x="130" y="120" width="195" height="22" fill="#2e6b3f" opacity="0.8"/><text x="332.79511412445936" y="136" font-size="12.5" fill="#8a8f94">674 guides lost</text><text x="30" y="171" font-size="13" fill="#23282d">10x coverage</text><rect x="130" y="154" width="60" height="22" fill="#2e6b3f" opacity="0.8"/><text x="197.59022824891866" y="170" font-size="12.5" fill="#8a8f94">5 guides lost</text><text x="30" y="205" font-size="13" fill="#23282d">20x coverage</text><rect x="130" y="188" width="19" height="22" fill="#2e6b3f" opacity="0.8"/><text x="156.67924528301887" y="204" font-size="12.5" fill="#8a8f94">about 0 guides lost</text><text x="30" y="236" font-size="13.5" fill="#b4532a">Length is log10 of the number lost. Real pools are uneven, so aim well above 100x at every step.</text>
</svg>
