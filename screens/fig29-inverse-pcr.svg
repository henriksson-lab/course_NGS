<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 250" width="780" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="250" fill="none"/>
<text x="30" y="26" font-size="13.5" fill="#b4532a" font-weight="bold">1  Cut</text><line x1="30" y1="80" x2="230" y2="80" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="100" y="66" width="70" height="28" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="135.0" y="84.2" font-size="12" text-anchor="middle" fill="#b4532a">known</text><line x1="60" y1="56" x2="60" y2="104" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><line x1="205" y1="56" x2="205" y2="104" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><text x="60" y="50" font-size="11.5" text-anchor="middle" fill="#a33a28">site</text><text x="205" y="50" font-size="11.5" text-anchor="middle" fill="#a33a28">site</text><text x="30" y="176" font-size="12.5" fill="#8a8f94">restriction enzyme cuts</text><text x="30" y="193" font-size="12.5" fill="#8a8f94">in the flank and inside</text><text x="280" y="26" font-size="13.5" fill="#b4532a" font-weight="bold">2  Self-ligate</text><circle cx="380" cy="82" r="38" fill="none" stroke="#8a8f94" stroke-width="3"/><path d="M 348 64 A 38 38 0 0 1 412 64" fill="none" stroke="#b4532a" stroke-width="5"/><text x="380" y="80" font-size="11.5" text-anchor="middle" fill="#b4532a">known</text><text x="380" y="100" font-size="11.5" text-anchor="middle" fill="#8a8f94">unknown flank</text><text x="280" y="176" font-size="12.5" fill="#8a8f94">dilute, so ends join</text><text x="280" y="193" font-size="12.5" fill="#8a8f94">within one fragment</text><text x="530" y="26" font-size="13.5" fill="#b4532a" font-weight="bold">3  Outward primers</text><circle cx="630" cy="82" r="38" fill="none" stroke="#8a8f94" stroke-width="3"/><path d="M 598 64 A 38 38 0 0 1 662 64" fill="none" stroke="#b4532a" stroke-width="5"/><line x1="614" y1="44" x2="591" y2="44" stroke="#1f3b57" stroke-width="1.8" stroke-linecap="round"/><path d="M 586 44 L 591 40.5 L 591 47.5 Z" fill="#1f3b57"/><line x1="646" y1="44" x2="669" y2="44" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><path d="M 674 44 L 669 40.5 L 669 47.5 Z" fill="#a33a28"/><text x="630" y="140" font-size="11.5" text-anchor="middle" fill="#8a8f94">product spans the junction</text><text x="530" y="176" font-size="12.5" fill="#8a8f94">read from the known part</text><text x="530" y="193" font-size="12.5" fill="#8a8f94">into the unknown flank</text><text x="30" y="232" font-size="14" fill="#b4532a">Circularising turns the unknown flank into the sequence between two known ends.</text>
</svg>
