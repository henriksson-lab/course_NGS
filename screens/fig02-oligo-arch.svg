<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" width="760" height="214" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="214" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">One 74-nt member of a guide pool (the GeCKO v2 design)</text><rect x="40" y="50" width="140.6" height="30" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="110.3" y="69.375" font-size="12.5" text-anchor="middle" fill="#1f3b57">hU6 + G</text><rect x="180.6" y="50" width="148.0" height="30" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="254.6" y="69.375" font-size="12.5" text-anchor="middle" fill="#b4532a">guide</text><rect x="328.6" y="50" width="259.0" height="30" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="458.1" y="69.375" font-size="12.5" text-anchor="middle" fill="#1f3b57">scaffold</text><text x="40" y="112" font-size="9.5" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>TGGAAAGGACGAAACACCG</text><text x="182.6" y="112" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>NNNNNNNNNNNNNNNNNNNN</text><text x="332.6" y="112" font-size="9.5" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GTTTTAGAGCTAGAAATAGCAAGTTAAAATAAGGC</text><line x1="40" y1="92" x2="180.6" y2="92" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="40" y="90" font-size="11" fill="#8a8f94">19 nt</text><text x="184.6" y="90" font-size="11" fill="#b4532a">20 nt, one per oligo</text><text x="338.6" y="90" font-size="11" fill="#8a8f94">35 nt</text><text x="30" y="152" font-size="13.5" fill="#23282d">Constant ends, variable middle. The constant ends are what a pair of primers binds,</text><text x="30" y="172" font-size="13.5" fill="#23282d">so one primer pair can amplify every member of the pool, and also what lets each</text><text x="30" y="192" font-size="13.5" fill="#23282d">oligo be joined to a vector by homology.</text>
</svg>
