<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 254" width="720" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="254" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">What is in the tube: ~15 million guide copies diluted in 100 micrograms of genome</text><rect x="40" y="50" width="600" height="30" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="56" y="70" font-size="13" fill="#8a8f94">one diploid human genome: ~6.4 Gb, ~6.6 pg</text><rect x="410" y="50" width="4" height="30" fill="#b4532a"/><line x1="412" y1="80" x2="470" y2="120" stroke="#b4532a" stroke-width="1.2" stroke-linecap="round"/><text x="476" y="126" font-size="12.5" fill="#b4532a">one integrated guide cassette</text><text x="40" y="156" font-size="13.5" fill="#23282d">100 ug of DNA = 100e-6 / 6.6e-12 = ~1.5 x 10^7 genomes</text><text x="40" y="178" font-size="13.5" fill="#23282d">a pool of 70,000 guides then has ~200 cells per guide</text><text x="40" y="200" font-size="13.5" fill="#23282d">the guide region is ~100 bp of 6.4 Gb, about 1 part in 10^7, so PCR must pick it out</text><text x="30" y="236" font-size="14" fill="#b4532a">Readout is a purification problem as much as a counting problem.</text>
</svg>
