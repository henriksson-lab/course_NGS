<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 186" width="620" height="186" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="620" height="186" fill="none"/>
<text x="20" y="22" font-size="14" fill="#23282d">One particle, one variant: the protein and the gene that encodes it stay together</text><text x="20" y="54" font-size="13" fill="#b4532a" font-weight="bold">Phage display</text><rect x="20" y="70" width="170" height="58" rx="4" fill="#f4f6f8" stroke="#8a8f94" stroke-width="1.2"/><rect x="32" y="86" width="92" height="24" rx="4" fill="none" stroke="#1f3b57" stroke-width="1.2"/><text x="78.0" y="101.85" font-size="11" text-anchor="middle" fill="#23282d">its own DNA</text><text x="32" y="124" font-size="11" fill="#8a8f94">phage particle</text><circle cx="190" cy="99" r="6" fill="#b4532a"/><text x="190" y="62" font-size="11" text-anchor="middle" fill="#b4532a">variant</text><line x1="190" y1="68" x2="190" y2="91" stroke="#b4532a" stroke-width="1.2" stroke-linecap="round"/><text x="20" y="152" font-size="12" fill="#23282d">Protein on the coat,</text><text x="20" y="168" font-size="12" fill="#23282d">DNA inside</text><text x="240" y="54" font-size="13" fill="#b4532a" font-weight="bold">Ribosome display</text><line x1="248" y1="104" x2="366" y2="104" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><circle cx="306" cy="104" r="13" fill="#dfe6ec"/><text x="306" y="108" font-size="10" text-anchor="middle" fill="#8a8f94">ribo</text><line x1="312" y1="95" x2="338" y2="82" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><circle cx="342" cy="79" r="6" fill="#b4532a"/><text x="356" y="80" font-size="11" fill="#b4532a">nascent protein</text><text x="248" y="124" font-size="11" fill="#8a8f94">mRNA, no stop codon</text><text x="240" y="152" font-size="12" fill="#23282d">Nothing is released, so the</text><text x="240" y="168" font-size="12" fill="#23282d">complex is the link</text><text x="440" y="54" font-size="13" fill="#b4532a" font-weight="bold">mRNA and click display</text><line x1="448" y1="104" x2="548" y2="104" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><line x1="548" y1="104" x2="568" y2="86" stroke="#b4532a" stroke-width="2.0" stroke-linecap="round"/><circle cx="572" cy="82" r="6" fill="#b4532a"/><text x="540" y="82" font-size="11" text-anchor="end" fill="#b4532a">covalent linker</text><text x="448" y="124" font-size="11" fill="#8a8f94">mRNA or cDNA</text><text x="440" y="152" font-size="12" fill="#23282d">A chemical bond replaces</text><text x="440" y="168" font-size="12" fill="#23282d">the particle</text>
</svg>
