<text x="30" y="28" font-size="14" fill="#b4532a" font-weight="bold">Both flanks known: a guide cassette</text><line x1="40" y1="80" x2="600" y2="80" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="160" y="64" width="90" height="32" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="205.0" y="84.2" font-size="12" text-anchor="middle" fill="#1f3b57">U6 side</text><rect x="250" y="64" width="80" height="32" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="290.0" y="84.2" font-size="12" text-anchor="middle" fill="#b4532a">guide</text><rect x="330" y="64" width="90" height="32" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="375.0" y="84.2" font-size="12" text-anchor="middle" fill="#1f3b57">scaffold</text><line x1="165" y1="54" x2="230" y2="54" stroke="#1f3b57" stroke-width="1.8" stroke-linecap="round"/><path d="M 235 54 L 230 50.5 L 230 57.5 Z" fill="#1f3b57"/><line x1="420" y1="112" x2="355" y2="112" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><path d="M 350 112 L 355 108.5 L 355 115.5 Z" fill="#a33a28"/><text x="440" y="118" font-size="12.5" fill="#8a8f94">two primers, one PCR</text><text x="30" y="154" font-size="14" fill="#b4532a" font-weight="bold">One flank known: an integration site</text><line x1="40" y1="200" x2="600" y2="200" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="240" y="184" width="140" height="32" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="310.0" y="204.375" font-size="12.5" text-anchor="middle" fill="#b4532a">known LTR</text><text x="80" y="190" font-size="20" fill="#a33a28">?</text><text x="520" y="190" font-size="20" fill="#a33a28">?</text><text x="30" y="250" font-size="14" fill="#23282d">The first needs ordinary PCR design. The second needs a trick to give the unknown side a primer site.</text>
</svg>
