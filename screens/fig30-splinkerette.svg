<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 228" width="766" height="228" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="228" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Splinkerette: an adapter with a hairpin, so only copied molecules can be amplified</text><text x="30" y="60" font-size="13" fill="#b4532a" font-weight="bold">1  Ligate</text><line x1="40" y1="88" x2="200" y2="88" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="150" y="74" width="50" height="28" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="175.0" y="92.025" font-size="11.5" text-anchor="middle" fill="#b4532a">known</text><text x="30" y="118" font-size="12" fill="#8a8f94">genomic cut end + adapter with a loop</text><text x="280" y="60" font-size="13" fill="#b4532a" font-weight="bold">2  Extend from the LTR primer</text><line x1="290" y1="88" x2="450" y2="88" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><line x1="430" y1="74" x2="305" y2="74" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><path d="M 300 74 L 305 70.5 L 305 77.5 Z" fill="#b4532a"/><text x="290" y="118" font-size="12" fill="#8a8f94">copy runs through the flank and the adapter</text><text x="530" y="60" font-size="13" fill="#b4532a" font-weight="bold">3  PCR</text><line x1="540" y1="88" x2="635" y2="88" stroke="#1f3b57" stroke-width="1.8" stroke-linecap="round"/><path d="M 640 88 L 635 84.5 L 635 91.5 Z" fill="#1f3b57"/><line x1="660" y1="106" x2="565" y2="106" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><path d="M 560 106 L 565 102.5 L 565 109.5 Z" fill="#a33a28"/><text x="530" y="126" font-size="12" fill="#8a8f94">adapter primer can bind</text><text x="530" y="143" font-size="12" fill="#8a8f94">only the new copy</text><text x="30" y="186" font-size="13.5" fill="#23282d">The original adapter strand is held in a hairpin, so primer cannot bind it: no copy of the LTR, no product.</text><text x="30" y="206" font-size="13.5" fill="#23282d">Without that rule, genomic ends joined to adapters would amplify and swamp the one junction wanted.</text>
</svg>
