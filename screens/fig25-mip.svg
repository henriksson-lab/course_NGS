<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 786 250" width="786" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="250" fill="none"/>
<text x="30" y="26" font-size="13.5" fill="#b4532a" font-weight="bold">1  Hybridise</text><line x1="30" y1="100" x2="180" y2="100" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="88" x2="85" y2="88" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="125" y1="88" x2="170" y2="88" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><path d="M 40 88 C 30 44, 180 44, 170 88" fill="none" stroke="#4a6b8a" stroke-width="2"/><text x="30" y="150" font-size="12.5" fill="#8a8f94">both arms bind</text><text x="30" y="167" font-size="12.5" fill="#8a8f94">with a gap between</text><text x="210" y="26" font-size="13.5" fill="#b4532a" font-weight="bold">2  Fill and ligate</text><circle cx="280" cy="84" r="32" fill="none" stroke="#1f3b57" stroke-width="3"/><path d="M 248 84 A 32 32 0 0 1 280 52" fill="none" stroke="#2e6b3f" stroke-width="3"/><circle cx="280" cy="116" r="4" fill="#b4532a"/><text x="210" y="150" font-size="12.5" fill="#8a8f94">polymerase copies the gap,</text><text x="210" y="167" font-size="12.5" fill="#8a8f94">ligase closes a circle</text><text x="390" y="26" font-size="13.5" fill="#b4532a" font-weight="bold">3  Exonuclease</text><circle cx="430" cy="84" r="24" fill="none" stroke="#1f3b57" stroke-width="3"/><line x1="480" y1="64" x2="530" y2="64" stroke="#8a8f94" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="480" y1="104" x2="530" y2="104" stroke="#8a8f94" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="505" y="89" font-size="18" text-anchor="middle" fill="#a33a28">x</text><text x="390" y="150" font-size="12.5" fill="#8a8f94">linear DNA is destroyed,</text><text x="390" y="167" font-size="12.5" fill="#8a8f94">circles survive</text><text x="570" y="26" font-size="13.5" fill="#b4532a" font-weight="bold">4  Universal PCR</text><circle cx="640" cy="84" r="32" fill="none" stroke="#1f3b57" stroke-width="3"/><line x1="610" y1="44" x2="665" y2="44" stroke="#2e6b3f" stroke-width="1.8" stroke-linecap="round"/><path d="M 670 44 L 665 40.5 L 665 47.5 Z" fill="#2e6b3f"/><line x1="670" y1="124" x2="615" y2="124" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><path d="M 610 124 L 615 120.5 L 615 127.5 Z" fill="#a33a28"/><text x="570" y="150" font-size="12.5" fill="#8a8f94">primers on the backbone</text><text x="570" y="167" font-size="12.5" fill="#8a8f94">copy tag + target</text><text x="30" y="212" font-size="13.5" fill="#23282d">Each probe carries a random 12-nt tag, so every captured molecule gets its own label before any amplification.</text><text x="30" y="232" font-size="14" fill="#b4532a">Counting tags counts molecules, whatever the PCR did afterwards.</text>
</svg>
