<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 665 228" width="665" height="228" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="640" height="228" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Dark cycles: skip the constant stretch without imaging it</text><rect x="40" y="50" width="60" height="30" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="70.0" y="69.2" font-size="12" text-anchor="middle" fill="#2e6b3f">P5 + i5</text><rect x="100" y="50" width="126" height="30" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="163.0" y="69.2" font-size="12" text-anchor="middle" fill="#8a8f94">constant 21 nt</text><rect x="226" y="50" width="156" height="30" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="304.0" y="69.2" font-size="12" text-anchor="middle" fill="#b4532a">guide region</text><rect x="382" y="50" width="60" height="30" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="412.0" y="69.2" font-size="12" text-anchor="middle" fill="#2e6b3f">i7 + P7</text><line x1="100" y1="104" x2="226" y2="104" stroke="#8a8f94" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 3"/><text x="163" y="124" font-size="12.5" text-anchor="middle" fill="#8a8f94">21 dark cycles</text><line x1="226" y1="104" x2="377" y2="104" stroke="#1f3b57" stroke-width="2.2" stroke-linecap="round"/><path d="M 382 104 L 377 100.5 L 377 107.5 Z" fill="#1f3b57"/><text x="304" y="124" font-size="12.5" text-anchor="middle" fill="#1f3b57">26 read cycles</text><text x="40" y="156" font-size="13" fill="#23282d">Run: 21 dark + 26 read, then 8 cycles each for the two indexes.</text><text x="40" y="176" font-size="13" fill="#23282d">The constant stretch is the same in every cluster; reading it adds nothing but cost and noise.</text><text x="30" y="210" font-size="14" fill="#b4532a">The read starts exactly where the information starts.</text>
</svg>
