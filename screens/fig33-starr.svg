<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="232" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">STARR-seq: the candidate sits in the 3' UTR and writes itself into the RNA</text><rect x="40" y="56" width="100" height="30" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="90.0" y="75.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">core promoter</text><rect x="140" y="56" width="110" height="30" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="195.0" y="75.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">reporter ORF</text><rect x="250" y="56" width="150" height="30" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="325.0" y="75.025" font-size="11.5" text-anchor="middle" fill="#b4532a">candidate fragment</text><rect x="400" y="56" width="56" height="30" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="428.0" y="75.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">polyA</text><path d="M 255 54 C 255 10, 100 10, 100 54" fill="none" stroke="#b4532a" stroke-width="1.8"/><line x1="60" y1="120" x2="400" y2="120" stroke="#2e6b3f" stroke-width="2.2" stroke-linecap="round"/><text x="60" y="140" font-size="12.5" fill="#2e6b3f">transcript: reporter ORF, then the candidate itself, then poly(A)</text><text x="40" y="176" font-size="13" fill="#23282d">No tag is needed: sequencing the RNA reads the fragment, and its abundance is the activity.</text><text x="30" y="214" font-size="13.5" fill="#b4532a">The price: fragments must be cloned intact, and long ones amplify unevenly.</text>
</svg>
