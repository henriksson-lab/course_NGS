<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 212" width="620" height="212" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="620" height="212" fill="none"/>
<text x="20" y="22" font-size="14" fill="#23282d">Panning: enrich, then read the pool instead of picking clones</text><rect x="20" y="50" width="100" height="40" rx="4" fill="#f4f6f8" stroke="#8a8f94" stroke-width="1.2"/><text x="70.0" y="61" font-size="12" text-anchor="middle" fill="#23282d">pooled</text><text x="70.0" y="76" font-size="12" text-anchor="middle" fill="#23282d">variants</text><rect x="150" y="50" width="96" height="40" rx="4" fill="#f4f6f8" stroke="#8a8f94" stroke-width="1.2"/><text x="198.0" y="68" font-size="12" text-anchor="middle" fill="#23282d">bind target</text><rect x="272" y="50" width="74" height="40" rx="4" fill="#f4f6f8" stroke="#8a8f94" stroke-width="1.2"/><text x="309.0" y="68" font-size="12" text-anchor="middle" fill="#23282d">wash</text><rect x="376" y="50" width="74" height="40" rx="4" fill="#f4f6f8" stroke="#8a8f94" stroke-width="1.2"/><text x="413.0" y="68" font-size="12" text-anchor="middle" fill="#23282d">elute</text><rect x="486" y="50" width="92" height="40" rx="4" fill="#f4f6f8" stroke="#8a8f94" stroke-width="1.2"/><text x="532.0" y="68" font-size="12" text-anchor="middle" fill="#23282d">amplify</text><line x1="124" y1="70" x2="135" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 140 70 L 135 66.5 L 135 73.5 Z" fill="#b4532a"/><line x1="250" y1="70" x2="261" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 266 70 L 261 66.5 L 261 73.5 Z" fill="#b4532a"/><line x1="350" y1="70" x2="361" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 366 70 L 361 66.5 L 361 73.5 Z" fill="#b4532a"/><line x1="454" y1="70" x2="465" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 470 70 L 465 66.5 L 465 73.5 Z" fill="#b4532a"/><line x1="578" y1="70" x2="596" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="596" y1="70" x2="596" y2="112" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="596" y1="112" x2="70" y2="112" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="72" y1="112" x2="61" y2="112" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 56 112 L 61 108.5 L 61 115.5 Z" fill="#b4532a"/><text x="300" y="128" font-size="12" text-anchor="middle" fill="#8a8f94">repeat: each round costs diversity</text><line x1="300" y1="142" x2="300" y2="158" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3,3"/><rect x="150" y="160" width="300" height="40" rx="4" fill="none" stroke="#2e6b3f" stroke-width="1.2"/><text x="300" y="178" font-size="12" text-anchor="middle" fill="#2e6b3f">amplify the variable region, sequence it</text><text x="300" y="194" font-size="12" text-anchor="middle" fill="#2e6b3f">every variant is counted, not just the winners</text>
</svg>
