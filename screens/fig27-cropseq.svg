<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 723 234" width="723" height="234" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="234" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">CROP-seq: put the guide where a polyadenylated transcript will carry it</text><rect x="40" y="44" width="54" height="30" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="67.0" y="62.85" font-size="11" text-anchor="middle" fill="#a33a28">5' LTR</text><rect x="94" y="44" width="40" height="30" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="114.0" y="62.85" font-size="11" text-anchor="middle" fill="#8a8f94">...</text><rect x="134" y="44" width="90" height="30" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="179.0" y="62.85" font-size="11" text-anchor="middle" fill="#b4532a">U6 + guide</text><rect x="224" y="44" width="40" height="30" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="244.0" y="62.85" font-size="11" text-anchor="middle" fill="#1f3b57">EFS</text><rect x="264" y="44" width="50" height="30" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="289.0" y="62.85" font-size="11" text-anchor="middle" fill="#2e6b3f">puro</text><rect x="314" y="44" width="130" height="30" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="379.0" y="62.85" font-size="11" text-anchor="middle" fill="#a33a28">3' LTR + U6 + guide</text><line x1="264" y1="92" x2="446" y2="92" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><text x="264" y="108" font-size="12.5" fill="#2e6b3f">Pol II transcript: puro mRNA with the guide in its 3' UTR, then poly(A)</text><text x="40" y="150" font-size="12.5" fill="#8a8f94">capture:</text><rect x="110" y="134" width="190" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="205.0" y="150.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">bead oligo-dT + cell barcode</text><text x="310" y="151" font-size="12.5" fill="#8a8f94">reads the 3' end of the same message that carries the guide</text><text x="30" y="196" font-size="14" fill="#b4532a">One cell gives its whole transcriptome and the identity of its guide from an ordinary 3' library.</text><text x="30" y="216" font-size="13.5" fill="#23282d">A short enrichment PCR makes sure the guide, a rare part of the message, is seen.</text>
</svg>
