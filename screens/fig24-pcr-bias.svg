<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 264" width="760" height="264" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="264" fill="none"/>
<text x="40" y="28" font-size="13.5" fill="#b4532a" font-weight="bold">cells in the screen</text><rect x="40" y="80" width="22" height="90" fill="#1f3b57" opacity="0.85"/><rect x="70" y="80" width="22" height="90" fill="#b4532a" opacity="0.85"/><rect x="100" y="80" width="22" height="90" fill="#2e6b3f" opacity="0.85"/><rect x="130" y="80" width="22" height="90" fill="#4a6b8a" opacity="0.85"/><rect x="160" y="80" width="22" height="90" fill="#a33a28" opacity="0.85"/><rect x="190" y="80" width="22" height="90" fill="#7a5c99" opacity="0.85"/><line x1="40" y1="170" x2="220" y2="170" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="40" y="188" font-size="11.5" fill="#8a8f94">GC content: low</text><text x="220" y="188" font-size="11.5" text-anchor="end" fill="#8a8f94">high</text><text x="280" y="28" font-size="13.5" fill="#b4532a" font-weight="bold">reads after PCR</text><rect x="280" y="80" width="22" height="90" fill="#1f3b57" opacity="0.85"/><rect x="310" y="91" width="22" height="79" fill="#b4532a" opacity="0.85"/><rect x="340" y="102" width="22" height="68" fill="#2e6b3f" opacity="0.85"/><rect x="370" y="112" width="22" height="58" fill="#4a6b8a" opacity="0.85"/><rect x="400" y="121" width="22" height="49" fill="#a33a28" opacity="0.85"/><rect x="430" y="130" width="22" height="40" fill="#7a5c99" opacity="0.85"/><line x1="280" y1="170" x2="460" y2="170" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="280" y="188" font-size="11.5" fill="#8a8f94">GC content: low</text><text x="460" y="188" font-size="11.5" text-anchor="end" fill="#8a8f94">high</text><text x="520" y="28" font-size="13.5" fill="#b4532a" font-weight="bold">molecules counted (MIP/UMI)</text><rect x="520" y="80" width="22" height="90" fill="#1f3b57" opacity="0.85"/><rect x="550" y="80" width="22" height="90" fill="#b4532a" opacity="0.85"/><rect x="580" y="80" width="22" height="90" fill="#2e6b3f" opacity="0.85"/><rect x="610" y="80" width="22" height="90" fill="#4a6b8a" opacity="0.85"/><rect x="640" y="80" width="22" height="90" fill="#a33a28" opacity="0.85"/><rect x="670" y="80" width="22" height="90" fill="#7a5c99" opacity="0.85"/><line x1="520" y1="170" x2="700" y2="170" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="520" y="188" font-size="11.5" fill="#8a8f94">GC content: low</text><text x="700" y="188" font-size="11.5" text-anchor="end" fill="#8a8f94">high</text><text x="30" y="226" font-size="13.5" fill="#23282d">Six guides in equal numbers: high-GC amplicons amplify less, so counts reflect chemistry too.</text><text x="30" y="246" font-size="14" fill="#b4532a">Counting the molecules, not their PCR copies, removes that term.</text>
</svg>
