<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 250" width="766" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="250" fill="none"/>
<text x="30" y="26" font-size="14" fill="#b4532a" font-weight="bold">Barcode proxy (Perturb-seq 2016)</text><rect x="40" y="40" width="70" height="28" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="75.0" y="57.85" font-size="11" text-anchor="middle" fill="#b4532a">U6 guide</text><rect x="110" y="40" width="24" height="28" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="122.0" y="57.85" font-size="11" text-anchor="middle" fill="#8a8f94">...</text><rect x="134" y="40" width="120" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="194.0" y="57.85" font-size="11" text-anchor="middle" fill="#2e6b3f">EF1a puro BFP</text><rect x="254" y="40" width="56" height="28" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="282.0" y="57.85" font-size="11" text-anchor="middle" fill="#a33a28">barcode</text><rect x="310" y="40" width="46" height="28" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="333.0" y="57.85" font-size="11" text-anchor="middle" fill="#8a8f94">polyA</text><text x="40" y="96" font-size="12.5" fill="#8a8f94">A separate table pairs each guide with its barcode (dictionary).</text><text x="30" y="136" font-size="14" fill="#b4532a" font-weight="bold">Direct capture (2020)</text><line x1="40" y1="170" x2="330" y2="170" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><text x="335" y="174" font-size="12.5" fill="#8a8f94">guide RNA, no poly(A)</text><line x1="240" y1="156" x2="175" y2="156" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><path d="M 170 156 L 175 152.5 L 175 159.5 Z" fill="#2e6b3f"/><text x="175" y="148" font-size="12.5" fill="#2e6b3f">primer in the constant part</text><text x="40" y="200" font-size="12.5" fill="#8a8f94">Reverse transcriptase copies it, template switching adds the cell barcode and UMI.</text><text x="30" y="232" font-size="13.5" fill="#23282d">The proxy is read from a poly(A) transcript, but depends on a table; direct capture reads the guide itself.</text>
</svg>
