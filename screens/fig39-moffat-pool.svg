<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 608 224" width="608" height="224" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="560" height="224" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d">Cut the band, then pool by molarity, not by volume.</text><text x="30" y="52" font-size="12" fill="#b4532a" font-weight="bold">on the gel</text><rect x="30" y="62" width="86" height="108" rx="4" fill="#f7f8f9" stroke="#8a8f94" stroke-width="1.2"/><rect x="46" y="80" width="54" height="8" rx="2" fill="#8a8f94" opacity="0.45"/><text x="124" y="88" font-size="11" fill="#8a8f94">~600 bp carry-over</text><rect x="42" y="118" width="62" height="8" rx="2" fill="#1f3b57" opacity="1.00"/><text x="124" y="126" font-size="11" fill="#1f3b57">~200 bp product</text><rect x="53" y="150" width="40" height="8" rx="2" fill="#a33a28" opacity="0.80"/><text x="124" y="158" font-size="11" fill="#a33a28">primer dimer</text><text x="30" y="186" font-size="11.5" fill="#23282d">only the middle band is cut out</text><text x="300" y="52" font-size="12" fill="#b4532a" font-weight="bold">then pooled</text><rect x="300" y="70" width="40" height="46" rx="3" fill="#1f3b57" opacity="0.8"/><text x="320" y="132" font-size="12" text-anchor="middle" fill="#23282d">A</text><text x="320" y="148" font-size="11" text-anchor="middle" fill="#8a8f94">10 nM</text><rect x="366" y="70" width="40" height="46" rx="3" fill="#1f3b57" opacity="0.8"/><text x="386" y="132" font-size="12" text-anchor="middle" fill="#23282d">B</text><text x="386" y="148" font-size="11" text-anchor="middle" fill="#8a8f94">10 nM</text><rect x="432" y="93" width="40" height="23" rx="3" fill="#1f3b57" opacity="0.8"/><text x="452" y="132" font-size="12" text-anchor="middle" fill="#23282d">C</text><text x="452" y="148" font-size="11" text-anchor="middle" fill="#8a8f94">5 nM</text><text x="300" y="176" font-size="12" fill="#23282d">Sample C is pooled at half the molarity of its</text><text x="300" y="192" font-size="12" fill="#23282d">neighbours, so it gets half the reads — and depth</text><text x="300" y="208" font-size="12" fill="#23282d">is exactly what its rarest guides needed.</text>
</svg>
