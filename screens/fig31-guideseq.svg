<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="260" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">GUIDE-seq: a double-stranded tag pins the breaks that Cas9 makes</text><line x1="40" y1="70" x2="240" y2="70" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="240" y="56" width="50" height="28" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="265.0" y="74.375" font-size="12.5" text-anchor="middle" fill="#b4532a">tag</text><line x1="290" y1="70" x2="520" y2="70" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><text x="40" y="52" font-size="12" fill="#8a8f94">break in genome</text><text x="265" y="100" font-size="12" text-anchor="middle" fill="#b4532a">tag inserted at break</text><text x="30" y="134" font-size="13" fill="#23282d">Shear, ligate adapter with UMI, nested PCR from the tag and adapter</text><line x1="60" y1="174" x2="330" y2="174" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="290" y="160" width="40" height="28" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="310.0" y="178.2" font-size="12" text-anchor="middle" fill="#b4532a">tag</text><line x1="310" y1="152" x2="355" y2="152" stroke="#1f3b57" stroke-width="1.8" stroke-linecap="round"/><path d="M 360 152 L 355 148.5 L 355 155.5 Z" fill="#1f3b57"/><text x="60" y="212" font-size="12.5" fill="#8a8f94">known tag on one side; unknown genome next to it; adapter from the shear on the other</text><text x="30" y="242" font-size="14" fill="#b4532a">Every read that contains the tag next to genome names a break. A one-end-known problem again.</text>
</svg>
