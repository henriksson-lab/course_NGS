<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 232" width="640" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="640" height="232" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">After integration the cassette is known, and everything next to it is not</text><line x1="30" y1="90" x2="130" y2="90" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><line x1="410" y1="90" x2="510" y2="90" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="130" y="74" width="280" height="32" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="270.0" y="94.55" font-size="13" text-anchor="middle" fill="#b4532a">provirus: LTR to LTR, sequence known</text><text x="80" y="76" font-size="12.5" text-anchor="middle" fill="#8a8f94">host DNA</text><text x="80" y="120" font-size="12.5" text-anchor="middle" fill="#a33a28">unknown</text><text x="460" y="76" font-size="12.5" text-anchor="middle" fill="#8a8f94">host DNA</text><text x="460" y="120" font-size="12.5" text-anchor="middle" fill="#a33a28">unknown</text><line x1="150" y1="142" x2="85" y2="142" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><path d="M 80 142 L 85 138.5 L 85 145.5 Z" fill="#b4532a"/><text x="158" y="146" font-size="12.5" fill="#b4532a">primer in the LTR</text><text x="60" y="150" font-size="22" fill="#a33a28">?</text><text x="40" y="176" font-size="12.5" fill="#a33a28">no second primer site</text><text x="30" y="214" font-size="14" fill="#23282d">PCR needs two primer sites. Here there is one, and the job is to get a second one.</text>
</svg>
