<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="250" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">UMIs: count the original molecules, not the copies</text><rect x="40" y="50" width="70" height="26" rx="4" fill="none" stroke="#2e6b3f" stroke-width="1.2"/><text x="75.0" y="67.2" font-size="12" text-anchor="middle" fill="#2e6b3f">tag 1</text><rect x="40" y="86" width="70" height="26" rx="4" fill="none" stroke="#b4532a" stroke-width="1.2"/><text x="75.0" y="103.2" font-size="12" text-anchor="middle" fill="#b4532a">tag 2</text><rect x="40" y="122" width="70" height="26" rx="4" fill="none" stroke="#a33a28" stroke-width="1.2"/><text x="75.0" y="139.2" font-size="12" text-anchor="middle" fill="#a33a28">tag 3</text><line x1="116" y1="100" x2="195" y2="100" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 200 100 L 195 96.5 L 195 103.5 Z" fill="#8a8f94"/><text x="158" y="92" font-size="12.5" text-anchor="middle" fill="#8a8f94">PCR</text><rect x="210" y="64" width="16" height="44" fill="#2e6b3f" opacity="0.8"/><rect x="232" y="64" width="16" height="44" fill="#2e6b3f" opacity="0.8"/><rect x="254" y="64" width="16" height="44" fill="#2e6b3f" opacity="0.8"/><rect x="276" y="64" width="16" height="44" fill="#2e6b3f" opacity="0.8"/><rect x="298" y="64" width="16" height="44" fill="#b4532a" opacity="0.8"/><rect x="320" y="64" width="16" height="44" fill="#a33a28" opacity="0.8"/><rect x="342" y="64" width="16" height="44" fill="#a33a28" opacity="0.8"/><rect x="364" y="64" width="16" height="44" fill="#a33a28" opacity="0.8"/><rect x="386" y="64" width="16" height="44" fill="#a33a28" opacity="0.8"/><rect x="408" y="64" width="16" height="44" fill="#a33a28" opacity="0.8"/><text x="210" y="128" font-size="12.5" fill="#8a8f94">10 reads</text><line x1="436" y1="86" x2="495" y2="86" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 500 86 L 495 82.5 L 495 89.5 Z" fill="#8a8f94"/><text x="468" y="78" font-size="12.5" text-anchor="middle" fill="#8a8f94">collapse</text><rect x="560" y="64" width="16" height="44" fill="#2e6b3f" opacity="0.8"/><rect x="582" y="64" width="16" height="44" fill="#b4532a" opacity="0.8"/><rect x="604" y="64" width="16" height="44" fill="#a33a28" opacity="0.8"/><text x="560" y="128" font-size="12.5" fill="#8a8f94">3 molecules</text><text x="30" y="178" font-size="13.5" fill="#23282d">Read counts say 4 : 1 : 5. The truth is 1 : 1 : 1; the extra reads were copies.</text><text x="30" y="200" font-size="13.5" fill="#23282d">Needs a tag that is random, long enough to be unique among the molecules, and read.</text><text x="30" y="232" font-size="13.5" fill="#b4532a">Kivioja et al. 2012: the tag makes counting absolute, within the limits of the tag space.</text>
</svg>
