<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 220" width="696" height="220" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="520" height="220" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d">One sample, 100 ug of genomic DNA: the first round cannot be done in one tube.</text><rect x="20" y="50" width="150" height="46" rx="4" fill="#f4f6f8" stroke="#8a8f94" stroke-width="1.2"/><text x="95" y="70" font-size="12.5" text-anchor="middle" fill="#23282d" font-weight="bold">100 ug gDNA</text><text x="95" y="86" font-size="11" text-anchor="middle" fill="#8a8f94">one sample</text><line x1="176" y1="73" x2="201" y2="73" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 206 73 L 201 69.5 L 201 76.5 Z" fill="#b4532a"/><rect x="214" y="52" width="28" height="42" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><rect x="250" y="52" width="28" height="42" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><rect x="286" y="52" width="28" height="42" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><rect x="322" y="52" width="28" height="42" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><rect x="358" y="52" width="28" height="42" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><rect x="394" y="52" width="28" height="42" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><rect x="430" y="52" width="28" height="42" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="336" y="112" font-size="12" text-anchor="middle" fill="#23282d">about 29 reactions of 50 uL, 3.5 ug each</text><text x="336" y="130" font-size="11.5" text-anchor="middle" fill="#8a8f94">same plain primers, 25 cycles, pooled afterwards</text><text x="20" y="164" font-size="13.5" fill="#23282d">40 samples x 29 = over a thousand first-round reactions.</text><text x="20" y="186" font-size="12.5" fill="#8a8f94">That is the whole argument for keeping the index out of round 1: the long indexed primers would have to be</text><text x="20" y="204" font-size="12.5" fill="#8a8f94">bought and pipetted a thousand times instead of forty.</text>
</svg>
