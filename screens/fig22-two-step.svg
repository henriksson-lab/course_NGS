<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 250" width="720" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="250" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Moffat two-step readout: enrich first, index second</text><text x="30" y="66" font-size="13.5" fill="#b4532a" font-weight="bold">PCR 1</text><line x1="110" y1="62" x2="600" y2="62" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="240" y="46" width="70" height="30" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="275.0" y="65.2" font-size="12" text-anchor="middle" fill="#1f3b57">U6 side</text><rect x="310" y="46" width="60" height="30" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="340.0" y="65.2" font-size="12" text-anchor="middle" fill="#b4532a">guide</text><rect x="370" y="46" width="100" height="30" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="420.0" y="65.2" font-size="12" text-anchor="middle" fill="#1f3b57">scaffold side</text><line x1="250" y1="38" x2="305" y2="38" stroke="#1f3b57" stroke-width="1.8" stroke-linecap="round"/><path d="M 310 38 L 305 34.5 L 305 41.5 Z" fill="#1f3b57"/><line x1="420" y1="90" x2="365" y2="90" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><path d="M 360 90 L 365 86.5 L 365 93.5 Z" fill="#a33a28"/><text x="110" y="116" font-size="12.5" fill="#8a8f94">gDNA, 3.5 ug per 50 uL reaction, many reactions, 25 cycles.</text><text x="110" y="133" font-size="12.5" fill="#8a8f94">Locus-specific primers only. Product ~600 bp.</text><text x="30" y="176" font-size="13.5" fill="#b4532a" font-weight="bold">PCR 2</text><rect x="110" y="160" width="80" height="30" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="150.0" y="179.2" font-size="12" text-anchor="middle" fill="#2e6b3f">P5 + i5</text><rect x="190" y="160" width="130" height="30" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="255.0" y="179.2" font-size="12" text-anchor="middle" fill="#b4532a">guide region</text><rect x="320" y="160" width="80" height="30" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="360.0" y="179.2" font-size="12" text-anchor="middle" fill="#2e6b3f">i7 + P7</text><text x="110" y="212" font-size="12.5" fill="#8a8f94">A little PCR 1 product, 10 cycles, nested primers that carry the full indexed arms.</text><text x="110" y="229" font-size="12.5" fill="#8a8f94">Product ~200 bp, cut from a gel.</text>
</svg>
