<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="262" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Deep mutational scanning: every single-codon change in a stretch of one protein</text><text x="40" y="56" font-size="12.5" fill="#8a8f94">wild type</text><text x="120" y="56" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GAT  AAA  CGG  TTC</text><text x="40" y="80" font-size="12.5" fill="#8a8f94">library</text><text x="120" y="80" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>NNK AAA CGG TTC</text><text x="120" y="98" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GAT NNK CGG TTC</text><text x="120" y="116" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GAT AAA NNK TTC</text><text x="120" y="134" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GAT AAA CGG NNK</text><text x="330" y="80" font-size="12" fill="#8a8f94">NNK: any base, any base, G or T</text><text x="330" y="98" font-size="12" fill="#8a8f94">= 32 codons, all 20 amino acids,</text><text x="330" y="116" font-size="12" fill="#8a8f94">one stop, fewer unwanted stops</text><text x="40" y="170" font-size="12.5" fill="#8a8f94">select, then sequence before and after:</text><rect x="300" y="165" width="22" height="35" fill="#4a6b8a" opacity="0.8"/><rect x="324" y="165" width="22" height="35" fill="#b4532a" opacity="0.8"/><rect x="370" y="165" width="22" height="35" fill="#4a6b8a" opacity="0.8"/><rect x="394" y="190" width="22" height="10" fill="#b4532a" opacity="0.8"/><rect x="440" y="165" width="22" height="35" fill="#4a6b8a" opacity="0.8"/><rect x="464" y="144" width="22" height="56" fill="#b4532a" opacity="0.8"/><rect x="510" y="165" width="22" height="35" fill="#4a6b8a" opacity="0.8"/><rect x="534" y="166" width="22" height="34" fill="#b4532a" opacity="0.8"/><line x1="290" y1="200" x2="580" y2="200" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="30" y="226" font-size="13" fill="#23282d">Tiles that fit inside one read are read directly. Longer ones</text><text x="30" y="244" font-size="13" fill="#23282d">need a barcode linked to the variant, read once by long reads.</text>
</svg>
