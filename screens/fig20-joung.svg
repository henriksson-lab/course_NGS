<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 232" width="760" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="232" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Joung one-PCR readout: the integrated cassette becomes a sequencer-ready molecule in one reaction</text><rect x="40" y="56" width="40" height="32" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="60.0" y="76.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="80" y="56" width="70" height="32" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="115.0" y="76.2" font-size="12" text-anchor="middle" fill="#8a8f94">stagger</text><rect x="150" y="56" width="90" height="32" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="195.0" y="76.2" font-size="12" text-anchor="middle" fill="#1f3b57">U6 site</text><rect x="240" y="56" width="80" height="32" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="280.0" y="76.2" font-size="12" text-anchor="middle" fill="#b4532a">guide</text><rect x="320" y="56" width="100" height="32" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="370.0" y="76.2" font-size="12" text-anchor="middle" fill="#1f3b57">scaffold site</text><rect x="420" y="56" width="60" height="32" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="450.0" y="76.2" font-size="12" text-anchor="middle" fill="#2e6b3f">index</text><rect x="480" y="56" width="40" height="32" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="500.0" y="76.2" font-size="12" text-anchor="middle" fill="#1f3b57">P7</text><line x1="150" y1="108" x2="345" y2="108" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 350 108 L 345 104.5 L 345 111.5 Z" fill="#1f3b57"/><text x="190" y="128" font-size="12.5" fill="#1f3b57">Read 1: 80 cycles, runs through the U6 site into the guide</text><text x="40" y="156" font-size="13" fill="#23282d">Forward primers: P5 + staggered spacer + U6 binding. Reverse primers: P7 + index + scaffold binding.</text><text x="40" y="176" font-size="13" fill="#23282d">Both primers are long, so one PCR (about 12 cycles after a first denaturation) makes the finished library.</text><text x="30" y="214" font-size="14" fill="#b4532a">Binding sites sit on the vector's constant parts, so the same primers fit any guide.</text>
</svg>
