<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="280" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Cells receiving 0, 1 or 2+ copies, at three multiplicities of infection</text><text x="30" y="70" font-size="13" fill="#23282d">MOI 0.1</text><rect x="110.0" y="52" width="380.0" height="26" fill="#d5d8db"/><text x="300.0158577875515" y="70" font-size="12" text-anchor="middle" fill="#23282d">90%</text><rect x="490.0" y="52" width="38.0" height="26" fill="#2e6b3f"/><text x="509.0333013538582" y="70" font-size="12" text-anchor="middle" fill="#ffffff">9%</text><rect x="528.0" y="52" width="2.0" height="26" fill="#a33a28"/><text x="540" y="70" font-size="12.5" fill="#8a8f94">of infected cells, 5% have 2+</text><text x="30" y="126" font-size="13" fill="#23282d">MOI 0.3</text><rect x="110.0" y="108" width="311.1" height="26" fill="#d5d8db"/><text x="265.57182634316075" y="126" font-size="12" text-anchor="middle" fill="#23282d">74%</text><rect x="421.1" y="108" width="93.3" height="26" fill="#2e6b3f"/><text x="467.81520058926975" y="126" font-size="12" text-anchor="middle" fill="#ffffff">22%</text><rect x="514.5" y="108" width="15.5" height="26" fill="#a33a28"/><text x="540" y="126" font-size="12.5" fill="#8a8f94">of infected cells, 14% have 2+</text><text x="30" y="182" font-size="13" fill="#23282d">MOI 1</text><rect x="110.0" y="164" width="154.5" height="26" fill="#d5d8db"/><text x="187.2546826460029" y="182" font-size="12" text-anchor="middle" fill="#23282d">37%</text><rect x="264.5" y="164" width="154.5" height="26" fill="#2e6b3f"/><text x="341.7640479380087" y="182" font-size="12" text-anchor="middle" fill="#ffffff">37%</text><rect x="419.0" y="164" width="111.0" height="26" fill="#a33a28"/><text x="474.5093652920058" y="182" font-size="12" text-anchor="middle" fill="#ffffff">26%</text><text x="540" y="182" font-size="12.5" fill="#8a8f94">of infected cells, 42% have 2+</text><rect x="110" y="224" width="12" height="12" fill="#d5d8db"/><text x="126" y="235" font-size="12" fill="#8a8f94">none</text><rect x="170" y="224" width="12" height="12" fill="#2e6b3f"/><text x="186" y="235" font-size="12" fill="#8a8f94">one</text><rect x="226" y="224" width="12" height="12" fill="#a33a28"/><text x="242" y="235" font-size="12" fill="#8a8f94">two or more</text><text x="30" y="262" font-size="14" fill="#b4532a">Low MOI keeps one guide per cell; the price is that most cells are not transduced at all.</text>
