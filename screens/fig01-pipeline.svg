text><line x1="726" y1="60.0" x2="731" y2="60.0" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 736 60.0 L 731 56.5 L 731 63.5 Z" fill="#8a8f94"/><rect x="738" y="40" width="104" height="40" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="790.0" y="64.2" font-size="12" text-anchor="middle" fill="#a33a28">PCR, sequence</text><line x1="30" y1="100" x2="488" y2="100" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="30" y="120" font-size="13" fill="#1f3b57">building the library (this deck)</text><line x1="502" y1="100" x2="842" y2="100" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><text x="502" y="120" font-size="13" fill="#a33a28">reading it out (next deck)</text><text x="30" y="160" font-size="13" fill="#23282d">Each box is a bottleneck: a guide lost in any of them is gone for good,</text><text x="30" y="177" font-size="13" fill="#23282d">and the counts at the end only mean something if every box was kept wide.</text>
