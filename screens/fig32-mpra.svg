<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 268" width="780" height="268" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="268" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">MPRA: link each candidate sequence to a tag the cell will transcribe</text><rect x="40" y="46" width="90" height="30" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="85.0" y="65.025" font-size="11.5" text-anchor="middle" fill="#b4532a">candidate</text><rect x="130" y="46" width="110" height="30" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="185.0" y="65.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">minimal promoter</text><rect x="240" y="46" width="100" height="30" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="290.0" y="65.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">reporter ORF</text><rect x="340" y="46" width="44" height="30" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="362.0" y="65.025" font-size="11.5" text-anchor="middle" fill="#a33a28">tag</text><rect x="384" y="46" width="50" height="30" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="409.0" y="65.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">polyA</text><text x="40" y="106" font-size="12.5" fill="#8a8f94">DNA from the pool: how many plasmids carry each tag</text><text x="40" y="124" font-size="12.5" fill="#8a8f94">RNA from the cells: how many transcripts carry each tag</text><rect x="60" y="160" width="26" height="40" fill="#4a6b8a" opacity="0.8"/><rect x="90" y="134" width="26" height="66" fill="#b4532a" opacity="0.8"/><rect x="180" y="160" width="26" height="40" fill="#4a6b8a" opacity="0.8"/><rect x="210" y="172" width="26" height="28" fill="#b4532a" opacity="0.8"/><rect x="300" y="160" width="26" height="40" fill="#4a6b8a" opacity="0.8"/><rect x="330" y="166" width="26" height="34" fill="#b4532a" opacity="0.8"/><line x1="50" y1="200" x2="420" y2="200" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="70" y="220" font-size="12" fill="#8a8f94">tag A</text><text x="190" y="220" font-size="12" fill="#8a8f94">tag B</text><text x="310" y="220" font-size="12" fill="#8a8f94">tag C</text><text x="440" y="150" font-size="12" fill="#4a6b8a">blue: DNA copies</text><text x="440" y="168" font-size="12" fill="#b4532a">red: RNA copies</text><text x="440" y="190" font-size="12.5" fill="#23282d">activity = RNA / DNA</text><text x="30" y="250" font-size="13.5" fill="#b4532a">Many tags per candidate average out the effect of where in the vector and the plasmid each tag landed.</text>
</svg>
