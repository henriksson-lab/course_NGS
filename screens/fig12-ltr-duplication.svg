<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 240" width="740" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="240" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Reverse transcription copies the 3' LTR region into both ends</text><text x="30" y="64" font-size="12.5" fill="#8a8f94">RNA in the virion</text><rect x="150" y="48" width="32" height="28" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="166.0" y="66.2" font-size="12" text-anchor="middle" fill="#8a8f94">R</text><rect x="182" y="48" width="40" height="28" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="202.0" y="66.2" font-size="12" text-anchor="middle" fill="#8a8f94">U5</text><rect x="222" y="48" width="220" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="332.0" y="66.2" font-size="12" text-anchor="middle" fill="#1f3b57">everything in between</text><rect x="442" y="48" width="110" height="28" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="497.0" y="66.2" font-size="12" text-anchor="middle" fill="#b4532a">U3 + cassette</text><rect x="552" y="48" width="32" height="28" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="568.0" y="66.2" font-size="12" text-anchor="middle" fill="#8a8f94">R</text><text x="310" y="102" font-size="12.5" fill="#8a8f94">reverse transcription</text><text x="30" y="138" font-size="12.5" fill="#8a8f94">DNA</text><rect x="150" y="128" width="110" height="28" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="205.0" y="146.2" font-size="12" text-anchor="middle" fill="#b4532a">U3 + cassette</text><rect x="260" y="128" width="32" height="28" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="276.0" y="146.2" font-size="12" text-anchor="middle" fill="#8a8f94">R</text><rect x="292" y="128" width="40" height="28" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="312.0" y="146.2" font-size="12" text-anchor="middle" fill="#8a8f94">U5</text><rect x="522" y="128" width="110" height="28" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="577.0" y="146.2" font-size="12" text-anchor="middle" fill="#b4532a">U3 + cassette</text><rect x="632" y="128" width="32" height="28" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="648.0" y="146.2" font-size="12" text-anchor="middle" fill="#8a8f94">R</text><rect x="664" y="128" width="40" height="28" rx="4" fill="#eceff1" stroke="#8a8f94" stroke-width="1.2"/><text x="684.0" y="146.2" font-size="12" text-anchor="middle" fill="#8a8f94">U5</text><text x="340" y="146" font-size="14" fill="#8a8f94">...</text><line x1="338" y1="142" x2="516" y2="142" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="150" y="192" font-size="12.5" fill="#8a8f94">5' LTR</text><text x="522" y="192" font-size="12.5" fill="#8a8f94">3' LTR</text><text x="30" y="222" font-size="14" fill="#b4532a">A cassette placed in the 3' U3 is copied into the 5' LTR as well: the provirus carries it twice.</text>
</svg>
