<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="290" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d" font-weight="bold">RNA example: the order of kinase steps is the chemistry</text><text x="20" y="60" font-size="13" fill="#23282d" font-weight="bold">RNA fragment</text><line x1="200" y1="56" x2="330" y2="56" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><circle cx="194" cy="56" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><rect x="331" y="51" width="10" height="10" fill="#a33a28"/><text x="430" y="60" font-size="12" fill="#8a8f94">5'-OH, 2',3'-cyclic phosphate: nothing can ligate</text><text x="20" y="110" font-size="13" fill="#23282d" font-weight="bold">PNK, no ATP</text><line x1="200" y1="106" x2="330" y2="106" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><circle cx="194" cy="106" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><circle cx="336" cy="106" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><text x="430" y="110" font-size="12" fill="#8a8f94">3' phosphatase: 3'-OH; ready for the 3' adapter</text><text x="20" y="160" font-size="13" fill="#23282d" font-weight="bold">3' adapter ligated</text><line x1="200" y1="156" x2="330" y2="156" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><circle cx="194" cy="156" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><line x1="330" y1="156" x2="400" y2="156" stroke="#5b4b8a" stroke-width="4" stroke-linecap="round"/><text x="430" y="160" font-size="12" fill="#8a8f94">3' end is now the adapter</text><text x="20" y="210" font-size="13" fill="#23282d" font-weight="bold">PNK + ATP</text><line x1="200" y1="206" x2="330" y2="206" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><circle cx="194" cy="206" r="5" fill="#2e6b3f"/><line x1="330" y1="206" x2="400" y2="206" stroke="#5b4b8a" stroke-width="4" stroke-linecap="round"/><text x="430" y="210" font-size="12" fill="#8a8f94">5'-OH becomes 5'-P: ready for the 5' adapter</text><text x="20" y="270" font-size="13" fill="#b4532a">Doing the ATP step first would phosphorylate 5' ends, and the RNA could then circularise.</text>
</svg>
