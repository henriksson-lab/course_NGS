<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="230" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d" font-weight="bold">After tagmentation the new ends are not yet complete</text><line x1="40" y1="62" x2="200" y2="62" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="76" x2="236" y2="76" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="236" y="68" width="100" height="16" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="286.0" y="79.85" font-size="11" text-anchor="middle" fill="#23282d">adapter A</text><rect x="236" y="52" width="100" height="12" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><line x1="202" y1="62" x2="234" y2="62" stroke="#a33a28" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2"/><text x="350" y="70" font-size="12" fill="#a33a28">1  gap of 9 nt between 3'-OH and adapter</text><line x1="40" y1="126" x2="232" y2="126" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="140" x2="236" y2="140" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="236" y="132" width="100" height="16" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="286.0" y="143.85" font-size="11" text-anchor="middle" fill="#23282d">adapter A</text><rect x="236" y="116" width="100" height="12" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><line x1="200" y1="114" x2="225" y2="114" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 230 114 L 225 110.5 L 225 117.5 Z" fill="#b4532a"/><text x="350" y="134" font-size="12" fill="#b4532a">2  polymerase at 72 C extends the 3'-OH across the gap</text><text x="20" y="190" font-size="13" fill="#23282d">Until the gap is filled, the adapter strand that was never joined is held on only by base pairing,</text><text x="20" y="210" font-size="13" fill="#23282d">so it is lost on denaturing and the 3'-OH strand has no handle to copy.</text>
</svg>
