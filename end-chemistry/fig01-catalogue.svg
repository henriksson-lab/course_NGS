<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="940" height="320" fill="none"/>
<text x="20" y="24" font-size="12.5" fill="#8a8f94">end</text><text x="270" y="24" font-size="12.5" fill="#8a8f94">what the enzymes see</text><text x="520" y="24" font-size="12.5" fill="#8a8f94">where it comes from</text><rect x="12" y="34" width="916" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="54" font-size="13" fill="#23282d" font-weight="bold">5'-phosphate</text><text x="270" y="54" font-size="13" fill="#2e6b3f">ligation donor</text><text x="520" y="54" font-size="13" fill="#23282d">kinase product; restriction, DNase I</text><rect x="12" y="68" width="916" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="88" font-size="13" fill="#23282d" font-weight="bold">5'-OH</text><text x="270" y="88" font-size="13" fill="#a33a28">cannot ligate</text><text x="520" y="88" font-size="13" fill="#23282d">MNase, RNase A, alkali; or after CIP</text><rect x="12" y="102" width="916" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="122" font-size="13" fill="#23282d" font-weight="bold">5'-triphosphate / cap</text><text x="270" y="122" font-size="13" fill="#a33a28">cannot ligate</text><text x="520" y="122" font-size="13" fill="#23282d">primary transcripts: pyrophosphatase or decapping</text><rect x="12" y="136" width="916" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="156" font-size="13" fill="#23282d" font-weight="bold">3'-OH</text><text x="270" y="156" font-size="13" fill="#2e6b3f">extendable, ligation acceptor</text><text x="520" y="156" font-size="13" fill="#23282d">most enzymatic cuts; the working end</text><rect x="12" y="170" width="916" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="190" font-size="13" fill="#23282d" font-weight="bold">3'-phosphate</text><text x="270" y="190" font-size="13" fill="#a33a28">blocked</text><text x="520" y="190" font-size="13" fill="#23282d">MNase, damage; PNK or phosphatase removes it</text><rect x="12" y="204" width="916" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="224" font-size="13" fill="#23282d" font-weight="bold">2',3'-cyclic phosphate</text><text x="270" y="224" font-size="13" fill="#a33a28">blocked</text><text x="520" y="224" font-size="13" fill="#23282d">RNase A/T1, metal-ion hydrolysis of RNA</text><rect x="12" y="238" width="916" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="258" font-size="13" fill="#23282d" font-weight="bold">3'-ddN, C3, amino, inverted dT</text><text x="270" y="258" font-size="13" fill="#a33a28">blocked, permanently</text><text x="520" y="258" font-size="13" fill="#23282d">synthesised on purpose</text><text x="20" y="300" font-size="14" fill="#b4532a">Two atoms decide it: a phosphate on a 5' end is wanted, a phosphate or block on a 3' end is not.</text>
</svg>
