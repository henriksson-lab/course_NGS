<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="268" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d" font-weight="bold">Switch every pre-existing end off, then make only the ends you want</text><text x="20" y="54" font-size="12" fill="#8a8f94">1  genomic DNA, ends carry 5'-P</text><line x1="40" y1="72" x2="150" y2="72" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><circle cx="34" cy="72" r="5" fill="#2e6b3f"/><circle cx="156" cy="72" r="5" fill="#2e6b3f"/><line x1="180" y1="72" x2="330" y2="72" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><circle cx="174" cy="72" r="5" fill="#2e6b3f"/><circle cx="336" cy="72" r="5" fill="#2e6b3f"/><line x1="360" y1="72" x2="470" y2="72" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><circle cx="354" cy="72" r="5" fill="#2e6b3f"/><circle cx="476" cy="72" r="5" fill="#2e6b3f"/><text x="20" y="108" font-size="12" fill="#8a8f94">2  phosphatase (CIP, rSAP): every 5'-P becomes 5'-OH; ends cannot ligate to anything</text><line x1="40" y1="126" x2="150" y2="126" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><circle cx="34" cy="126" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><circle cx="156" cy="126" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><line x1="180" y1="126" x2="330" y2="126" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><circle cx="174" cy="126" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><circle cx="336" cy="126" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><line x1="360" y1="126" x2="470" y2="126" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><circle cx="354" cy="126" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><circle cx="476" cy="126" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><text x="20" y="162" font-size="12" fill="#8a8f94">3  Cas9 cuts: the new ends carry 5'-P</text><line x1="40" y1="180" x2="120" y2="180" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><circle cx="34" cy="180" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><circle cx="126" cy="180" r="5" fill="#2e6b3f"/><line x1="150" y1="180" x2="330" y2="180" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><circle cx="144" cy="180" r="5" fill="#2e6b3f"/><circle cx="336" cy="180" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><line x1="360" y1="180" x2="470" y2="180" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><circle cx="354" cy="180" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><circle cx="476" cy="180" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><text x="20" y="216" font-size="12" fill="#2e6b3f">4  adapter ligation: only the cut sites are tagged, so only they are sequenced</text><text x="20" y="250" font-size="12" fill="#8a8f94">green: 5'-P (ligatable)    open red: 5'-OH (inert)</text>
</svg>
