<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" width="720" height="226" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="226" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d" font-weight="bold">Methylated adapters survive bisulfite</text><text x="20" y="52" font-size="12" fill="#8a8f94">before: adapter carries 5mC at every C, insert carries ordinary C</text><rect x="30" y="62" width="120" height="20" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="90.0" y="76.2" font-size="12" text-anchor="middle" fill="#23282d">adapter: mC</text><rect x="152" y="62" width="150" height="20" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="227.0" y="76.2" font-size="12" text-anchor="middle" fill="#23282d">insert: C, mC</text><rect x="304" y="62" width="120" height="20" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="364.0" y="76.2" font-size="12" text-anchor="middle" fill="#23282d">adapter: mC</text><text x="20" y="118" font-size="12" fill="#b4532a">bisulfite: unmethylated C -> U (read as T); 5mC is protected</text><rect x="30" y="130" width="120" height="20" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="90.0" y="144.2" font-size="12" text-anchor="middle" fill="#23282d">adapter: mC kept</text><rect x="152" y="130" width="150" height="20" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="227.0" y="144.2" font-size="12" text-anchor="middle" fill="#23282d">insert: T, mC</text><rect x="304" y="130" width="120" height="20" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="364.0" y="144.2" font-size="12" text-anchor="middle" fill="#23282d">adapter: mC kept</text><text x="20" y="186" font-size="13" fill="#23282d">If the adapter had ordinary C, its sequence would change and the PCR primers would stop pairing.</text><text x="20" y="208" font-size="13" fill="#8a8f94">The alternative is to tag after conversion (PBAT) and avoid methylated adapters altogether.</text>
</svg>
