<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="268" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d" font-weight="bold">A blocked 3' end can give a ligation but cannot take one</text><text x="20" y="42" font-size="13" fill="#23282d" font-weight="bold">adapter, 5'-P and 3'-OH</text><circle cx="46" cy="70" r="5" fill="#2e6b3f"/><line x1="52" y1="70" x2="140" y2="70" stroke="#5b4b8a" stroke-width="4" stroke-linecap="round"/><circle cx="148" cy="70" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><circle cx="220" cy="70" r="5" fill="#2e6b3f"/><line x1="226" y1="70" x2="314" y2="70" stroke="#5b4b8a" stroke-width="4" stroke-linecap="round"/><circle cx="322" cy="70" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><text x="350" y="74" font-size="13" fill="#a33a28">adapter-adapter dimers form</text><text x="20" y="142" font-size="13" fill="#23282d" font-weight="bold">adapter, 5'-P and 3' block</text><circle cx="46" cy="170" r="5" fill="#2e6b3f"/><line x1="52" y1="170" x2="140" y2="170" stroke="#5b4b8a" stroke-width="4" stroke-linecap="round"/><rect x="143" y="165" width="10" height="10" fill="#a33a28"/><circle cx="220" cy="170" r="5" fill="#2e6b3f"/><line x1="226" y1="170" x2="314" y2="170" stroke="#5b4b8a" stroke-width="4" stroke-linecap="round"/><rect x="317" y="165" width="10" height="10" fill="#a33a28"/><text x="350" y="174" font-size="13" fill="#2e6b3f">adapter ligates to adapter: no</text><text x="20" y="250" font-size="13" fill="#b4532a">Pre-adenylated 3'-blocked adapters, splints and capture oligos all use this.</text>
</svg>
