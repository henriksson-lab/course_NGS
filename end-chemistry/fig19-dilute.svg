<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="240" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d" font-weight="bold">Concentration decides whether a DNA end finds its own other end</text><text x="30" y="54" font-size="13" fill="#23282d" font-weight="bold">concentrated: ends meet other molecules</text><line x1="30" y1="80" x2="110" y2="80" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="130" y1="90" x2="210" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="80" x2="310" y2="80" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="330" y1="90" x2="410" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="30" y="126" font-size="12" fill="#a33a28">chimeras and concatemers</text><text x="500" y="54" font-size="13" fill="#23282d" font-weight="bold">dilute: ends find each other</text><circle cx="570" cy="100" r="28" fill="none" stroke="#1f3b57" stroke-width="3"/><circle cx="670" cy="100" r="28" fill="none" stroke="#1f3b57" stroke-width="3"/><text x="500" y="150" font-size="12" fill="#2e6b3f">circles (intramolecular)</text><text x="20" y="180" font-size="13" fill="#23282d">- the rate between molecules scales with their concentration; within one molecule it does not</text><text x="20" y="200" font-size="13" fill="#23282d">- fragments shorter than about 150 bp are too stiff to bend into a circle at all</text><text x="20" y="220" font-size="13" fill="#23282d">- use it for circularisation, inverse PCR and proximity ligation; do not use it for adapters</text>
</svg>
