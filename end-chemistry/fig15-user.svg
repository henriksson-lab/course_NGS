<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 246" width="720" height="246" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="246" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d" font-weight="bold">dU in a hairpin adapter: cut it open after ligation</text><rect x="150" y="60" width="150" height="18" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="73.2" font-size="12" text-anchor="middle" fill="#23282d">insert</text><line x1="60" y1="64" x2="150" y2="64" stroke="#5b4b8a" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="74" x2="150" y2="74" stroke="#5b4b8a" stroke-width="3" stroke-linecap="round"/><line x1="300" y1="64" x2="390" y2="64" stroke="#5b4b8a" stroke-width="3" stroke-linecap="round"/><line x1="300" y1="74" x2="390" y2="74" stroke="#5b4b8a" stroke-width="3" stroke-linecap="round"/><path d="M 60 56.0 A 13.0 13.0 0 0 0 60 82.0" fill="none" stroke="#5b4b8a" stroke-width="3"/><path d="M 390 56.0 A 13.0 13.0 0 0 1 390 82.0" fill="none" stroke="#5b4b8a" stroke-width="3"/><circle cx="44" cy="69" r="4" fill="#b4532a"/><circle cx="406" cy="69" r="4" fill="#b4532a"/><text x="44" y="102" font-size="11" text-anchor="middle" fill="#b4532a">U in loop</text><text x="406" y="102" font-size="11" text-anchor="middle" fill="#b4532a">U in loop</text><text x="20" y="128" font-size="12" fill="#8a8f94">1  ligated: the hairpin is a closed loop, so nothing can be amplified yet</text><text x="20" y="150" font-size="12" fill="#b4532a">2  USER (UDG + endonuclease VIII) removes U and cuts: the loop opens into a fork</text><rect x="150" y="176" width="150" height="18" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="189.2" font-size="12" text-anchor="middle" fill="#23282d">insert</text><line x1="60" y1="180" x2="150" y2="180" stroke="#5b4b8a" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="190" x2="150" y2="190" stroke="#5b4b8a" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="180" x2="30" y2="170" stroke="#5b4b8a" stroke-width="2.4" stroke-linecap="round"/><line x1="60" y1="190" x2="30" y2="200" stroke="#5b4b8a" stroke-width="2.4" stroke-linecap="round"/><line x1="300" y1="180" x2="390" y2="180" stroke="#5b4b8a" stroke-width="3" stroke-linecap="round"/><line x1="300" y1="190" x2="390" y2="190" stroke="#5b4b8a" stroke-width="3" stroke-linecap="round"/><line x1="390" y1="180" x2="420" y2="170" stroke="#5b4b8a" stroke-width="2.4" stroke-linecap="round"/><line x1="390" y1="190" x2="420" y2="200" stroke="#5b4b8a" stroke-width="2.4" stroke-linecap="round"/><text x="20" y="228" font-size="13" fill="#23282d">One adapter and one enzyme step give the forked adapter: no strand-specific ligation needed.</text>
