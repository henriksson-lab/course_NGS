<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" width="940" height="320" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="940" height="320" fill="none"/>
<text x="20" y="24" font-size="12.5" fill="#8a8f94">how it was cut</text><text x="250" y="24" font-size="12.5" fill="#8a8f94">5' end</text><text x="420" y="24" font-size="12.5" fill="#8a8f94">3' end</text><text x="610" y="24" font-size="12.5" fill="#8a8f94">shape</text><rect x="12" y="34" width="886" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="54" font-size="13" fill="#23282d" font-weight="bold">acoustic shearing</text><text x="250" y="54" font-size="13" fill="#23282d">mixed</text><text x="420" y="54" font-size="13" fill="#23282d">mixed, some damaged</text><text x="610" y="54" font-size="13" fill="#23282d">ragged, all shapes</text><rect x="12" y="68" width="886" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="88" font-size="13" fill="#23282d" font-weight="bold">restriction enzyme</text><text x="250" y="88" font-size="13" fill="#2e6b3f">5'-P</text><text x="420" y="88" font-size="13" fill="#2e6b3f">3'-OH</text><text x="610" y="88" font-size="13" fill="#23282d">defined overhang or blunt</text><rect x="12" y="102" width="886" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="122" font-size="13" fill="#23282d" font-weight="bold">DNase I</text><text x="250" y="122" font-size="13" fill="#2e6b3f">5'-P</text><text x="420" y="122" font-size="13" fill="#2e6b3f">3'-OH</text><text x="610" y="122" font-size="13" fill="#23282d">mostly blunt or 1-nt overhang</text><rect x="12" y="136" width="886" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="156" font-size="13" fill="#23282d" font-weight="bold">micrococcal nuclease</text><text x="250" y="156" font-size="13" fill="#a33a28">5'-OH</text><text x="420" y="156" font-size="13" fill="#a33a28">3'-P</text><text x="610" y="156" font-size="13" fill="#23282d">needs repair of both ends</text><rect x="12" y="170" width="886" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="190" font-size="13" fill="#23282d" font-weight="bold">Cas9 in vitro</text><text x="250" y="190" font-size="13" fill="#2e6b3f">5'-P</text><text x="420" y="190" font-size="13" fill="#2e6b3f">3'-OH</text><text x="610" y="190" font-size="13" fill="#23282d">mostly blunt</text><rect x="12" y="204" width="886" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="224" font-size="13" fill="#23282d" font-weight="bold">Tn5 tagmentation</text><text x="250" y="224" font-size="13" fill="#23282d">adapter attached</text><text x="420" y="224" font-size="13" fill="#2e6b3f">3'-OH</text><text x="610" y="224" font-size="13" fill="#23282d">9-nt gap on each side</text><rect x="12" y="238" width="886" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="20" y="258" font-size="13" fill="#23282d" font-weight="bold">RNase A / alkali on RNA</text><text x="250" y="258" font-size="13" fill="#a33a28">5'-OH</text><text x="420" y="258" font-size="13" fill="#a33a28">2',3'-cyclic P</text><text x="610" y="258" font-size="13" fill="#23282d">needs PNK before ligation</text><text x="20" y="300" font-size="14" fill="#b4532a">The cutting method decides which repair steps the library preparation needs.</text>
</svg>
