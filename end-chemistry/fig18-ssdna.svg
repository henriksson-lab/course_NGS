<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 828 236" width="828" height="236" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="236" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d" font-weight="bold">Degraded or single-stranded input</text><text x="20" y="54" font-size="13" fill="#23282d" font-weight="bold">single-strand ligation</text><line x1="40" y1="74" x2="160" y2="74" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="164" cy="74" r="5" fill="#fff" stroke="#a33a28" stroke-width="2"/><rect x="176" y="66" width="60" height="16" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="206.0" y="77.85" font-size="11" text-anchor="middle" fill="#23282d">adapter</text><text x="250" y="78" font-size="12" fill="#8a8f94">adapter ligated to the 3'-OH of each denatured strand, then copy and ligate the second adapter</text><text x="20" y="124" font-size="13" fill="#23282d" font-weight="bold">adaptase</text><line x1="40" y1="144" x2="160" y2="144" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="162" y="148" font-size="12" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAA</text><rect x="212" y="136" width="60" height="16" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="242.0" y="147.85" font-size="11" text-anchor="middle" fill="#23282d">adapter</text><text x="286" y="148" font-size="12" fill="#8a8f94">template-independent tail, then the stub joins: one tube, no 3'-OH selection</text><text x="20" y="196" font-size="13" fill="#23282d">Both skip end repair and A-tailing: they work on molecules whose ends are too damaged to ligate in duplex.</text><text x="20" y="216" font-size="12" fill="#8a8f94">Gansauge and Meyer 2013 for the first; the second is used in snmC-seq2 (Luo et al. 2018).</text>
</svg>
