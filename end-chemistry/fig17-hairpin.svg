<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 212" width="720" height="212" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="212" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d" font-weight="bold">Hairpin adapters: close the ends, make one continuous strand</text><line x1="80" y1="60" x2="300" y2="60" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="80" y1="74" x2="300" y2="74" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><path d="M 80 60.0 A 7.0 7.0 0 0 0 80 74.0" fill="none" stroke="#5b4b8a" stroke-width="3"/><path d="M 300 60.0 A 7.0 7.0 0 0 1 300 74.0" fill="none" stroke="#5b4b8a" stroke-width="3"/><text x="190" y="100" font-size="12" text-anchor="middle" fill="#8a8f94">insert, both strands</text><text x="20" y="130" font-size="13" fill="#23282d">- a molecule with no free ends cannot be degraded by exonucleases: single-stranded or open</text><text x="20" y="150" font-size="13" fill="#23282d">  molecules can be digested away, leaving only complete circles (PacBio SMRTbell)</text><text x="20" y="172" font-size="13" fill="#23282d">- both strands are one read: a sequencer can read the same duplex twice</text><text x="20" y="194" font-size="13" fill="#23282d">- splinkerette: one hairpin end blocks priming, so only the correct end amplifies</text>
</svg>
