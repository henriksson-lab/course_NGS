<text x="30" y="24" font-size="14" fill="#23282d">Cycles needed against input (target 100 ng library, 25 % conversion, 90 % efficiency).</text><text x="30" y="57" font-size="13.5" fill="#23282d">1 ug</text><rect x="120.0" y="45.0" width="3.0" height="14.0" rx="3" fill="#2e6b3f" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="131" y="57" font-size="13" fill="#8a8f94">none: PCR-free</text><text x="30" y="85" font-size="13.5" fill="#23282d">100 ng</text><rect x="120.0" y="73.0" width="51.8" height="14.0" rx="3" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="179.835885679971" y="85" font-size="13" fill="#8a8f94">about 2 cycles</text><text x="30" y="113" font-size="13.5" fill="#23282d">10 ng</text><rect x="120.0" y="101.0" width="137.9" height="14.0" rx="3" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="265.9334281618036" y="113" font-size="13" fill="#8a8f94">about 6 cycles</text><text x="30" y="141" font-size="13.5" fill="#23282d">1 ng</text><rect x="120.0" y="129.0" width="224.0" height="14.0" rx="3" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="352.0309706436362" y="141" font-size="13" fill="#8a8f94">about 9 cycles</text><text x="30" y="169" font-size="13.5" fill="#23282d">100 pg</text><rect x="120.0" y="157.0" width="310.1" height="14.0" rx="3" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="438.12851312546877" y="169" font-size="13" fill="#8a8f94">about 13 cycles</text><text x="30" y="197" font-size="13.5" fill="#23282d">10 pg</text><rect x="120.0" y="185.0" width="396.2" height="14.0" rx="3" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="524.2260556073013" y="197" font-size="13" fill="#8a8f94">about 17 cycles</text><text x="30" y="234" font-size="13.5" fill="#23282d">Every ten-fold drop in input costs about 3.6 cycles. Hence the rule: use the input you have, then the fewest cycles.</text>
