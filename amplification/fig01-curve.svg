text x="500.0" y="234" font-size="12" text-anchor="middle" fill="#8a8f94">30</text><line x1="640.0" y1="214" x2="640.0" y2="219" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="640.0" y="234" font-size="12" text-anchor="middle" fill="#8a8f94">40</text><text x="360.0" y="252" font-size="12.5" text-anchor="middle" fill="#8a8f94">cycle</text><text x="72" y="203.83333333333331" font-size="12" text-anchor="end" fill="#8a8f94">1e3</text><text x="72" y="161.33333333333334" font-size="12" text-anchor="end" fill="#8a8f94">1e6</text><text x="72" y="118.83333333333333" font-size="12" text-anchor="end" fill="#8a8f94">1e9</text><text x="72" y="76.33333333333333" font-size="12" text-anchor="end" fill="#8a8f94">1e12</text><text x="108.0" y="72.33333333333333" font-size="12.5" fill="#b4532a">exponential: every copy is a template</text><text x="416.0" y="143.16666666666666" font-size="12.5" fill="#b4532a">plateau: primers and polymerase run out,</text><text x="416.0" y="159.16666666666666" font-size="12.5" fill="#b4532a">products anneal to each other</text><text x="108.0" y="90.33333333333333" font-size="12.5" fill="#8a8f94">dashed: perfect doubling</text><text x="30" y="280" font-size="14" fill="#23282d">Past the knee of the curve extra cycles add almost no product, and all the damage.</text>
