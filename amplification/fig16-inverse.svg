<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 766 250" width="766" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="250" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Inverse PCR: read outward from a known stretch into DNA you know nothing about.</text><text x="30" y="56" font-size="13" fill="#23282d" font-weight="bold">1. cut with an enzyme</text><text x="30" y="74" font-size="13" fill="#23282d" font-weight="bold">absent from the vector</text><line x1="30" y1="110" x2="270" y2="110" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="100.0" y="102.0" width="100.0" height="16.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1.2"/><text x="150" y="114" font-size="11.5" text-anchor="middle" fill="#b4532a">known vector</text><line x1="60" y1="94" x2="60" y2="126" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><text x="60" y="142" font-size="12" text-anchor="middle" fill="#8a8f94">cut</text><line x1="240" y1="94" x2="240" y2="126" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><text x="240" y="142" font-size="12" text-anchor="middle" fill="#8a8f94">cut</text><text x="330" y="56" font-size="13" fill="#23282d" font-weight="bold">2. dilute and ligate</text><text x="330" y="74" font-size="13" fill="#23282d" font-weight="bold">the fragment closes</text><circle cx="400.0" cy="130.0" r="32" fill="none" stroke="#4a6b8a" stroke-width="3"/><rect x="380.0" y="94.0" width="40.0" height="10.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1.2"/><text x="400" y="184" font-size="12" text-anchor="middle" fill="#8a8f94">junction now inside</text><text x="560" y="56" font-size="13" fill="#23282d" font-weight="bold">3. primers point outward</text><text x="560" y="74" font-size="13" fill="#23282d" font-weight="bold">from the known part</text><circle cx="630.0" cy="130.0" r="32" fill="none" stroke="#4a6b8a" stroke-width="3"/><rect x="610.0" y="94.0" width="40.0" height="10.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1.2"/><path d="M 620.1 91.2 A 40 40 0 0 0 590.1 127.2" fill="none" stroke="#2e6b3f" stroke-width="2.2"/><path d="M 590.1 127.2 L 585.6 133.9 L 593.6 134.4 Z" fill="#2e6b3f"/><path d="M 639.9 91.2 A 40 40 0 0 1 669.9 127.2" fill="none" stroke="#2e6b3f" stroke-width="2.2"/><path d="M 669.9 127.2 L 666.4 134.4 L 674.4 133.9 Z" fill="#2e6b3f"/><text x="30" y="214" font-size="13.5" fill="#23282d">The product contains the unknown flank, with known sequence at both ends. First used for transposon flanks;</text><text x="30" y="234" font-size="13.5" fill="#23282d">the same trick maps a transgene or provirus in human cells.</text>
</svg>
