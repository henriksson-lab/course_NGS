<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 807 298" width="807" height="298" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="298" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">When primers run out, products anneal to each other instead.</text><text x="30" y="60" font-size="12.5" fill="#1f3b57">insert X</text><line x1="80" y1="62" x2="170" y2="62" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="170" y1="62" x2="380" y2="62" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="380" y1="62" x2="470" y2="62" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><text x="30" y="116" font-size="12.5" fill="#4a6b8a">insert Y</text><line x1="80" y1="114" x2="170" y2="114" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="170" y1="114" x2="380" y2="114" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="380" y1="114" x2="470" y2="114" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><text x="510" y="90" font-size="13" fill="#23282d">denature, cool, the ends match</text><text x="510" y="110" font-size="13" fill="#23282d">and the middle does not</text><line x1="80" y1="190" x2="170" y2="190" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="80" y1="198" x2="170" y2="198" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="380" y1="190" x2="470" y2="190" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="380" y1="198" x2="470" y2="198" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><path d="M 170 190 C 212.0 164, 338.0 164, 380 190" fill="none" stroke="#1f3b57" stroke-width="2.4"/><path d="M 170 198 C 212.0 224, 338.0 224, 380 198" fill="none" stroke="#4a6b8a" stroke-width="2.4"/><text x="275" y="150" font-size="12.5" text-anchor="middle" fill="#8a8f94">bubble</text><text x="510" y="184" font-size="13" fill="#a33a28">heteroduplex: runs high on a gel,</text><text x="510" y="204" font-size="13" fill="#a33a28">can be extended into a chimera</text><text x="30" y="262" font-size="13.5" fill="#23282d">Symptoms: a smear above the expected peak, a quantity that falls short of the fluorescence, and swapped barcodes.</text><text x="30" y="282" font-size="13.5" fill="#23282d">Remedy: fewer cycles, or one extra cycle with fresh primers and polymerase to convert the bubbles back.</text>
</svg>
