<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="260" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">A splinkerette has a hairpin on one strand: its primer site is created only by a real read-through.</text><rect x="40.0" y="82.0" width="90.0" height="16.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1.2"/><text x="85" y="94" font-size="11.5" text-anchor="middle" fill="#b4532a">known end</text><line x1="130" y1="90" x2="520" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="130" y1="98" x2="520" y2="98" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="520.0" y="82.0" width="70.0" height="24.0" rx="3" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.2"/><line x1="590" y1="90" x2="612" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="626.0" cy="84.0" r="14" fill="none" stroke="#1f3b57" stroke-width="2.6"/><line x1="590" y1="98" x2="640" y2="98" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="570" y="134" font-size="12" text-anchor="middle" fill="#4a6b8a">splinkerette: hairpin on the top strand</text><line x1="50" y1="70" x2="105" y2="70" stroke="#2e6b3f" stroke-width="2.2" stroke-linecap="round"/><path d="M 110 70 L 105 66.5 L 105 73.5 Z" fill="#2e6b3f"/><text x="80" y="62" font-size="11.5" text-anchor="middle" fill="#2e6b3f">vector primer</text><text x="30" y="168" font-size="13.5" fill="#23282d">1. Vector primer copies across the junction into the adapter.</text><text x="30" y="190" font-size="13.5" fill="#23282d">2. Only that copy contains the adapter-primer site, so the adapter primer can bind.</text><text x="30" y="212" font-size="13.5" fill="#23282d">3. A fragment with adapters on both ends has no vector primer site, so it is never primed.</text><text x="30" y="244" font-size="13.5" fill="#8a8f94">Compare: a plain linker lets the linker primer copy both ends of any fragment, which is one-sided background.</text>
</svg>
