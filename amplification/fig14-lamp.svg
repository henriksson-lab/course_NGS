<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="272" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">LAMP: four to six primers make a self-priming dumbbell at one temperature.</text><line x1="50" y1="90" x2="400" y2="90" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><rect x="50.0" y="78.0" width="30.0" height="24.0" rx="3" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.2"/><text x="65.0" y="94" font-size="11.5" text-anchor="middle" fill="#23282d">F3</text><rect x="100.0" y="78.0" width="35.0" height="24.0" rx="3" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.2"/><text x="117.5" y="94" font-size="11.5" text-anchor="middle" fill="#23282d">F2</text><rect x="150.0" y="78.0" width="35.0" height="24.0" rx="3" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.2"/><text x="167.5" y="94" font-size="11.5" text-anchor="middle" fill="#23282d">F1</text><rect x="215.0" y="78.0" width="35.0" height="24.0" rx="3" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.2"/><text x="232.5" y="94" font-size="11.5" text-anchor="middle" fill="#23282d">B1</text><rect x="265.0" y="78.0" width="35.0" height="24.0" rx="3" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.2"/><text x="282.5" y="94" font-size="11.5" text-anchor="middle" fill="#23282d">B2</text><rect x="340.0" y="78.0" width="35.0" height="24.0" rx="3" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.2"/><text x="357.5" y="94" font-size="11.5" text-anchor="middle" fill="#23282d">B3</text><text x="50" y="68" font-size="12" fill="#8a8f94">target region (for example a viral sequence in human saliva)</text><line x1="500" y1="190" x2="640" y2="190" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="500" y1="198" x2="640" y2="198" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><circle cx="486.0" cy="194.0" r="20" fill="none" stroke="#1f3b57" stroke-width="2.4"/><circle cx="654.0" cy="194.0" r="20" fill="none" stroke="#4a6b8a" stroke-width="2.4"/><text x="570" y="224" font-size="12" text-anchor="middle" fill="#8a8f94">stem</text><text x="486" y="164" font-size="12" text-anchor="middle" fill="#b4532a">loop</text><text x="654" y="164" font-size="12" text-anchor="middle" fill="#b4532a">loop</text><text x="50" y="150" font-size="13" fill="#23282d">Bst polymerase, 60-65 C: it displaces strands</text><text x="50" y="172" font-size="13" fill="#23282d">as it goes, so no denaturation step is needed.</text><text x="50" y="204" font-size="13" fill="#23282d">Loop primers speed the reaction; the product</text><text x="50" y="226" font-size="13" fill="#23282d">is a ladder of stem-loop repeats.</text><text x="30" y="256" font-size="13.5" fill="#23282d">Used as a diagnostic readout from patient samples, and, with barcodes, as a library prep (LAMP-Seq).</text>
</svg>
