<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 874 252" width="874" height="252" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="252" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Tiled amplicons: overlapping products split across two tubes, so neighbours never compete.</text><line x1="60" y1="110" x2="700" y2="110" stroke="#1f3b57" stroke-width="5" stroke-linecap="round"/><text x="60" y="100" font-size="12.5" fill="#8a8f94">mitochondrial genome, 16.6 kb (human)</text><rect x="60.0" y="52.0" width="86.0" height="10.0" rx="3" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="103.0" y="48" font-size="11.5" text-anchor="middle" fill="#b4532a">1</text><rect x="134.0" y="150.0" width="92.0" height="10.0" rx="3" fill="#2e6b3f" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="180.0" y="174" font-size="11.5" text-anchor="middle" fill="#2e6b3f">2</text><rect x="214.0" y="52.0" width="92.0" height="10.0" rx="3" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="260.0" y="48" font-size="11.5" text-anchor="middle" fill="#b4532a">3</text><rect x="294.0" y="150.0" width="92.0" height="10.0" rx="3" fill="#2e6b3f" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="340.0" y="174" font-size="11.5" text-anchor="middle" fill="#2e6b3f">4</text><rect x="374.0" y="52.0" width="92.0" height="10.0" rx="3" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="420.0" y="48" font-size="11.5" text-anchor="middle" fill="#b4532a">5</text><rect x="454.0" y="150.0" width="92.0" height="10.0" rx="3" fill="#2e6b3f" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="500.0" y="174" font-size="11.5" text-anchor="middle" fill="#2e6b3f">6</text><rect x="534.0" y="52.0" width="92.0" height="10.0" rx="3" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="580.0" y="48" font-size="11.5" text-anchor="middle" fill="#b4532a">7</text><rect x="614.0" y="150.0" width="86.0" height="10.0" rx="3" fill="#2e6b3f" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="657.0" y="174" font-size="11.5" text-anchor="middle" fill="#2e6b3f">8</text><text x="706" y="62" font-size="12" fill="#b4532a">pool 1</text><text x="706" y="160" font-size="12" fill="#2e6b3f">pool 2</text><text x="30" y="214" font-size="13.5" fill="#23282d">Overlaps make sure every base is covered; alternate pools stop an amplicon's primer landing inside its neighbour's product.</text><text x="30" y="236" font-size="13.5" fill="#23282d">A dropped amplicon shows as a gap in coverage: the primer scheme is the first thing to check.</text>
</svg>
