<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="260" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Nested PCR: a second, inner primer pair re-selects the true product.</text><text x="30" y="74" font-size="13" fill="#8a8f94">round 1</text><line x1="120" y1="70" x2="700" y2="70" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="120" y1="56" x2="185" y2="56" stroke="#2e6b3f" stroke-width="2.2" stroke-linecap="round"/><path d="M 190 56 L 185 52.5 L 185 59.5 Z" fill="#2e6b3f"/><line x1="700" y1="86" x2="635" y2="86" stroke="#2e6b3f" stroke-width="2.2" stroke-linecap="round"/><path d="M 630 86 L 635 82.5 L 635 89.5 Z" fill="#2e6b3f"/><text x="155" y="50" font-size="11.5" text-anchor="middle" fill="#2e6b3f">outer F</text><text x="665" y="104" font-size="11.5" text-anchor="middle" fill="#2e6b3f">outer R</text><text x="30" y="150" font-size="13" fill="#8a8f94">round 2</text><line x1="220" y1="148" x2="600" y2="148" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="220" y1="134" x2="285" y2="134" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><path d="M 290 134 L 285 130.5 L 285 137.5 Z" fill="#b4532a"/><line x1="600" y1="164" x2="535" y2="164" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><path d="M 530 164 L 535 160.5 L 535 167.5 Z" fill="#b4532a"/><text x="255" y="128" font-size="11.5" text-anchor="middle" fill="#b4532a">inner F</text><text x="565" y="182" font-size="11.5" text-anchor="middle" fill="#b4532a">inner R</text><text x="30" y="222" font-size="13.5" fill="#23282d">A wrong product from round 1 is unlikely to carry the inner sites, so the mispriming is not amplified.</text><text x="30" y="244" font-size="13.5" fill="#23282d">Anchored PCR: if one end is unknown, add the second primer site yourself with a linker or a tail.</text>
</svg>
