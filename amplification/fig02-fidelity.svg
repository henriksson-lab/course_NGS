<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="252" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">An error made in cycle k is inherited by about 1 in 2^(k+1) of the final strands.</text><line x1="70" y1="174" x2="400" y2="174" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><line x1="70" y1="44" x2="70" y2="174" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="80.0" y="44.0" width="28.0" height="130.0" rx="2" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="94" y="192" font-size="12" text-anchor="middle" fill="#8a8f94">1</text><rect x="119.0" y="109.0" width="28.0" height="65.0" rx="2" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="133" y="192" font-size="12" text-anchor="middle" fill="#8a8f94">2</text><rect x="158.0" y="141.5" width="28.0" height="32.5" rx="2" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="172" y="192" font-size="12" text-anchor="middle" fill="#8a8f94">3</text><rect x="197.0" y="157.8" width="28.0" height="16.2" rx="2" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="211" y="192" font-size="12" text-anchor="middle" fill="#8a8f94">4</text><rect x="236.0" y="165.9" width="28.0" height="8.1" rx="2" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="250" y="192" font-size="12" text-anchor="middle" fill="#8a8f94">5</text><rect x="275.0" y="169.9" width="28.0" height="4.1" rx="2" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="289" y="192" font-size="12" text-anchor="middle" fill="#8a8f94">6</text><rect x="314.0" y="172.0" width="28.0" height="2.0" rx="2" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="328" y="192" font-size="12" text-anchor="middle" fill="#8a8f94">7</text><rect x="353.0" y="172.0" width="28.0" height="2.0" rx="2" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="367" y="192" font-size="12" text-anchor="middle" fill="#8a8f94">8</text><text x="235.0" y="210" font-size="12.5" text-anchor="middle" fill="#8a8f94">cycle in which the error occurs</text><text x="62" y="52" font-size="12" text-anchor="end" fill="#8a8f94">25 %</text><text x="430" y="70" font-size="13.5" fill="#23282d" font-weight="bold">Early errors are the expensive ones:</text><text x="430" y="92" font-size="13.5" fill="#23282d">they reach a large share of the product.</text><text x="430" y="126" font-size="13.5" fill="#23282d">Expected errors per molecule is roughly</text><text x="430" y="148" font-size="13.5" fill="#23282d">rate x length x doublings / 2.</text><text x="430" y="182" font-size="13.5" fill="#8a8f94">Polymerases without proofreading: 10 to</text><text x="430" y="202" font-size="13.5" fill="#8a8f94">several hundred times more errors.</text><text x="30" y="236" font-size="14" fill="#23282d">Fewer cycles is the cheapest way to improve fidelity, because it cuts the doublings.</text>
</svg>
