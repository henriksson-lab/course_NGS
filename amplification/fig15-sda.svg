<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 861 298" width="861" height="298" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="298" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Nicking-enzyme SDA: nick, extend with displacement, repeat, at one temperature.</text><text x="30" y="46" font-size="13" fill="#23282d" font-weight="bold">1. primer carrying a nicking site binds, a copy is made</text><text x="30" y="116" font-size="13" fill="#23282d" font-weight="bold">2. the nicking enzyme cuts the new strand only</text><text x="30" y="186" font-size="13" fill="#23282d" font-weight="bold">3. polymerase (exo-minus) extends from the nick and displaces the strand</text><line x1="60" y1="78" x2="400" y2="78" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="86" x2="400" y2="86" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="60.0" y="68.0" width="60.0" height="28.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1.2"/><text x="90" y="86" font-size="11.5" text-anchor="middle" fill="#b4532a">site</text><line x1="60" y1="148" x2="400" y2="148" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="156" x2="400" y2="156" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="60.0" y="138.0" width="60.0" height="28.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1.2"/><text x="90" y="156" font-size="11.5" text-anchor="middle" fill="#b4532a">site</text><line x1="140" y1="136" x2="140" y2="152" stroke="#b4532a" stroke-width="2.8" stroke-linecap="round"/><text x="148" y="134" font-size="12" fill="#b4532a">nick</text><line x1="60" y1="238" x2="140" y2="238" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="246" x2="400" y2="246" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="140" y1="238" x2="395" y2="238" stroke="#2e6b3f" stroke-width="3" stroke-linecap="round"/><path d="M 400 238 L 395 234.5 L 395 241.5 Z" fill="#2e6b3f"/><polyline points="240.0,238.0 270.0,214.0 330.0,214.0" fill="none" stroke="#1f3b57" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="340" y="212" font-size="12.5" fill="#1f3b57">displaced strand</text><text x="440" y="80" font-size="13" fill="#23282d">The displaced strand binds the</text><text x="440" y="100" font-size="13" fill="#23282d">opposite primer and the cycle</text><text x="440" y="120" font-size="13" fill="#23282d">repeats on both strands: growth</text><text x="440" y="140" font-size="13" fill="#23282d">is exponential, without heat.</text><text x="30" y="282" font-size="13.5" fill="#8a8f94">Walker et al. made the nick with a restriction enzyme and modified nucleotides; nicking enzymes do the same without them.</text>
</svg>
