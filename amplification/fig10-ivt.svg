<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 286" width="760" height="286" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="286" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">In vitro transcription: one DNA template, hundreds of RNA copies, none copied from a copy.</text><line x1="60" y1="100" x2="300" y2="100" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="60" y1="108" x2="300" y2="108" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><rect x="60.0" y="90.0" width="40.0" height="28.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1.4"/><text x="80" y="108" font-size="12.5" text-anchor="middle" fill="#b4532a">T7</text><text x="60" y="78" font-size="12.5" fill="#8a8f94">T7 promoter + template</text><line x1="104" y1="108" x2="112" y2="142" stroke="#8a8f94" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="112" y1="142" x2="249" y2="142" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 254 142 L 249 138.5 L 249 145.5 Z" fill="#2e6b3f"/><line x1="104" y1="108" x2="112" y2="156" stroke="#8a8f94" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="112" y1="156" x2="255" y2="156" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 260 156 L 255 152.5 L 255 159.5 Z" fill="#2e6b3f"/><line x1="104" y1="108" x2="112" y2="170" stroke="#8a8f94" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="112" y1="170" x2="261" y2="170" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 266 170 L 261 166.5 L 261 173.5 Z" fill="#2e6b3f"/><line x1="104" y1="108" x2="112" y2="184" stroke="#8a8f94" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="112" y1="184" x2="267" y2="184" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 272 184 L 267 180.5 L 267 187.5 Z" fill="#2e6b3f"/><line x1="104" y1="108" x2="112" y2="198" stroke="#8a8f94" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="112" y1="198" x2="273" y2="198" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 278 198 L 273 194.5 L 273 201.5 Z" fill="#2e6b3f"/><line x1="104" y1="108" x2="112" y2="212" stroke="#8a8f94" stroke-width="0.6" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="112" y1="212" x2="279" y2="212" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 284 212 L 279 208.5 L 279 215.5 Z" fill="#2e6b3f"/><text x="112" y="238" font-size="12.5" fill="#2e6b3f">RNA copies, antisense to the original mRNA</text><text x="350" y="90" font-size="13.5" fill="#23282d">Round 1: oligo-dT primer carrying the T7</text><text x="350" y="110" font-size="13.5" fill="#23282d">promoter makes cDNA, then double strand.</text><text x="350" y="142" font-size="13.5" fill="#23282d">Round 2: T7 polymerase copies the DNA</text><text x="350" y="162" font-size="13.5" fill="#23282d">repeatedly. Errors do not compound.</text><text x="350" y="194" font-size="13.5" fill="#8a8f94">Used in CEL-seq for single cells; the</text><text x="350" y="214" font-size="13.5" fill="#8a8f94">product is RNA, so it is 3'-biased.</text><text x="30" y="270" font-size="13.5" fill="#23282d">The cost: more steps, the 3' bias of a poly-dT primer, and a first strand that still limits yield.</text>
</svg>
