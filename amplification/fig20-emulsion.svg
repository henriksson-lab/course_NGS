8.99818902347523" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="584.5049484094961" y1="96.74460714170348" x2="587.0792046434939" y2="89.17009693696261" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="591.4494674553307" y1="101.94334467726696" x2="597.9920202869483" y2="97.33954163570522" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><text x="580" y="184" font-size="12.5" text-anchor="middle" fill="#a33a28">two templates: a mixed bead</text><text x="30" y="222" font-size="13.5" fill="#23282d">At 0.3 templates per droplet on average, Poisson gives 74 % empty, 22 % single, 4 % two or more.</text><text x="30" y="242" font-size="13.5" fill="#23282d">Dilution is a trade: fewer mixed beads, more empty droplets, and the sequencer enriches beads that carry DNA.</text>
