<text x="30" y="24" font-size="14" fill="#23282d">Emulsion PCR: one bead and, ideally, one template in each droplet.</text><circle cx="100.0" cy="110.0" r="52" fill="#eef3f7" stroke="#4a6b8a" stroke-width="1.6"/><circle cx="100.0" cy="110.0" r="14" fill="#caa780" stroke="#7a5a3a" stroke-width="1.4"/><text x="100" y="184" font-size="12.5" text-anchor="middle" fill="#8a8f94">empty</text><circle cx="340.0" cy="110.0" r="52" fill="#eef3f7" stroke="#4a6b8a" stroke-width="1.6"/><circle cx="340.0" cy="110.0" r="14" fill="#caa780" stroke="#7a5a3a" stroke-width="1.4"/><polyline points="356.7,127.2 356.3,138.5 345.1,149.4" fill="none" stroke="#1f3b57" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/><line x1="354.0" y1="110.0" x2="362.0" y2="110.0" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="351.31238511637014" y1="118.24802661119178" x2="357.77660518286734" y2="122.96118467472994" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="344.28143671729606" y1="123.32926478226722" x2="346.7279719843224" y2="130.94598751499134" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="335.60665216897564" y1="123.29279860810483" x2="333.09616769410457" y2="130.88868352702187" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="328.61867148060156" y1="118.15262909333714" x2="322.11505518380244" y2="122.8112742895298" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="326.0004947814012" y1="109.88229853685992" x2="318.00077751363045" y2="109.81504055792273" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="328.7573578806238" y1="101.6571588666913" x2="322.3329909552659" y2="96.88982107622918" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="335.83077702146915" y1="96.63521119675697" x2="333.44836389088005" y2="88.99818902347523" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="344.5049484094961" y1="96.744607141703