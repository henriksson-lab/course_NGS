<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" width="760" height="288" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="288" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Pre-amplify a few cycles, then split: every tube gets the same templates.</text><rect x="30.0" y="80.0" width="130.0" height="50.0" rx="3" fill="#e8eef4" stroke="#1f3b57" stroke-width="1.4"/><text x="95" y="100" font-size="13" text-anchor="middle" fill="#23282d">one low-input</text><text x="95" y="118" font-size="13" text-anchor="middle" fill="#23282d">sample</text><line x1="160" y1="105" x2="209" y2="105" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 214 105 L 209 101.5 L 209 108.5 Z" fill="#8a8f94"/><rect x="214.0" y="74.0" width="150.0" height="62.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1.4"/><text x="289" y="98" font-size="13" text-anchor="middle" fill="#b4532a">pre-amplification</text><text x="289" y="118" font-size="13" text-anchor="middle" fill="#b4532a">8 to 12 cycles</text><line x1="364" y1="105" x2="440" y2="56" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><rect x="440.0" y="40.0" width="130.0" height="32.0" rx="3" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.3"/><text x="505" y="60" font-size="13" text-anchor="middle" fill="#23282d">panel A</text><line x1="364" y1="105" x2="440" y2="102" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><rect x="440.0" y="86.0" width="130.0" height="32.0" rx="3" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.3"/><text x="505" y="106" font-size="13" text-anchor="middle" fill="#23282d">panel B</text><line x1="364" y1="105" x2="440" y2="148" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><rect x="440.0" y="132.0" width="130.0" height="32.0" rx="3" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.3"/><text x="505" y="152" font-size="13" text-anchor="middle" fill="#23282d">index set C</text><line x1="364" y1="105" x2="440" y2="194" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><rect x="440.0" y="178.0" width="130.0" height="32.0" rx="3" fill="#e8eef4" stroke="#8a8f94" stroke-width="1.3"/><text x="505" y="198" font-size="13" text-anchor="middle" fill="#23282d">reserve</text><text x="590" y="80" font-size="13" fill="#23282d">each tube: its own</text><text x="590" y="100" font-size="13" fill="#23282d">primers, few cycles</text><text x="30" y="252" font-size="13.5" fill="#23282d">A limited first round keeps the pool representative; the second round, in separate tubes, is specific.</text><text x="30" y="272" font-size="13.5" fill="#23282d">Used in single-cell and low-input work, for example the cDNA pre-amplification step of Smart-seq2.</text>
</svg>
