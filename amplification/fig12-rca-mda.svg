<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="236" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Phi29 copies by strand displacement at 30 degrees, with no thermal cycling.</text><text x="40" y="56" font-size="13.5" fill="#23282d" font-weight="bold">rolling circle (RCA)</text><circle cx="100.0" cy="120.0" r="34" fill="none" stroke="#1f3b57" stroke-width="3"/><circle cx="134" cy="120" r="4" fill="#b4532a"/><text x="100" y="124" font-size="12" text-anchor="middle" fill="#8a8f94">circle</text><line x1="134" y1="120" x2="335" y2="120" stroke="#2e6b3f" stroke-width="3" stroke-linecap="round"/><path d="M 340 120 L 335 116.5 L 335 123.5 Z" fill="#2e6b3f"/><line x1="170" y1="112" x2="170" y2="128" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><line x1="206" y1="112" x2="206" y2="128" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><line x1="242" y1="112" x2="242" y2="128" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><line x1="278" y1="112" x2="278" y2="128" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><line x1="314" y1="112" x2="314" y2="128" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><text x="240" y="150" font-size="12.5" text-anchor="middle" fill="#2e6b3f">one long strand of repeats</text><text x="400" y="56" font-size="13.5" fill="#23282d" font-weight="bold">multiple displacement (MDA)</text><line x1="400" y1="120" x2="700" y2="120" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="420" y1="110" x2="475" y2="110" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 480 110 L 475 106.5 L 475 113.5 Z" fill="#2e6b3f"/><circle cx="420" cy="110" r="3" fill="#b4532a"/><line x1="500" y1="110" x2="555" y2="110" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 560 110 L 555 106.5 L 555 113.5 Z" fill="#2e6b3f"/><circle cx="500" cy="110" r="3" fill="#b4532a"/><line x1="580" y1="110" x2="635" y2="110" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 640 110 L 635 106.5 L 635 113.5 Z" fill="#2e6b3f"/><circle cx="580" cy="110" r="3" fill="#b4532a"/><line x1="470" y1="94" x2="525" y2="94" stroke="#4a6b8a" stroke-width="1.8" stroke-linecap="round"/><path d="M 530 94 L 525 90.5 L 525 97.5 Z" fill="#4a6b8a"/><circle cx="470" cy="94" r="3" fill="#b4532a"/><line x1="560" y1="94" x2="615" y2="94" stroke="#4a6b8a" stroke-width="1.8" stroke-linecap="round"/><path d="M 620 94 L 615 90.5 L 615 97.5 Z" fill="#4a6b8a"/><circle cx="560" cy="94" r="3" fill="#b4532a"/><text x="550" y="150" font-size="12.5" text-anchor="middle" fill="#2e6b3f">random primers; displaced copies are primed again</text><text x="30" y="200" font-size="13.5" fill="#23282d">High processivity (tens of kb) and low error make it good for few-cell DNA. The copy-of-copy branching</text><text x="30" y="220" font-size="13.5" fill="#23282d">makes the coverage uneven, and chimeras form where a branch is re-primed.</text>
</svg>
