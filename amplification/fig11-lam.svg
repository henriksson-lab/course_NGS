<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" width="760" height="288" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="288" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">LAM-PCR: a one-primer reaction reads from a known end into unknown DNA.</text><text x="30" y="52" font-size="13.5" fill="#23282d" font-weight="bold">1. linear copying</text><text x="270" y="52" font-size="13.5" fill="#23282d" font-weight="bold">2. capture and second strand</text><text x="510" y="52" font-size="13.5" fill="#23282d" font-weight="bold">3. cut, ligate, nested PCR</text><line x1="30" y1="100" x2="230" y2="100" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><rect x="30.0" y="92.0" width="80.0" height="16.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1.2"/><text x="70" y="104" font-size="10.5" text-anchor="middle" fill="#b4532a">provirus end</text><line x1="62" y1="124" x2="195" y2="124" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 200 124 L 195 120.5 L 195 127.5 Z" fill="#2e6b3f"/><circle cx="62" cy="124" r="3" fill="#b4532a"/><line x1="62" y1="138" x2="200" y2="138" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 205 138 L 200 134.5 L 200 141.5 Z" fill="#2e6b3f"/><circle cx="62" cy="138" r="3" fill="#b4532a"/><line x1="62" y1="152" x2="205" y2="152" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 210 152 L 205 148.5 L 205 155.5 Z" fill="#2e6b3f"/><circle cx="62" cy="152" r="3" fill="#b4532a"/><line x1="62" y1="166" x2="210" y2="166" stroke="#2e6b3f" stroke-width="2.0" stroke-linecap="round"/><path d="M 215 166 L 210 162.5 L 210 169.5 Z" fill="#2e6b3f"/><circle cx="62" cy="166" r="3" fill="#b4532a"/><text x="30" y="196" font-size="12" fill="#8a8f94">biotinylated primer, many cycles:</text><text x="30" y="212" font-size="12" fill="#8a8f94">copies of the template only</text><circle cx="300.0" cy="106.0" r="12" fill="#caa780" stroke="#7a5a3a" stroke-width="1.4"/><text x="300" y="110" font-size="9.5" text-anchor="middle" fill="#fff">SA</text><line x1="312" y1="106" x2="330" y2="106" stroke="#b4532a" stroke-width="2.4" stroke-linecap="round"/><line x1="330" y1="106" x2="480" y2="106" stroke="#2e6b3f" stroke-width="3" stroke-linecap="round"/><line x1="330" y1="114" x2="480" y2="114" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="270" y="196" font-size="12" fill="#8a8f94">streptavidin beads keep only</text><text x="270" y="212" font-size="12" fill="#8a8f94">the copied strand</text><line x1="510" y1="106" x2="700" y2="106" stroke="#2e6b3f" stroke-width="3" stroke-linecap="round"/><line x1="510" y1="114" x2="700" y2="114" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="510.0" y="98.0" width="26.0" height="24.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1.2"/><rect x="684.0" y="98.0" width="26.0" height="24.0" rx="3" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.2"/><line x1="676" y1="94" x2="676" y2="126" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><text x="510" y="196" font-size="12" fill="#8a8f94">after the cut, a linker marks</text><text x="510" y="212" font-size="12" fill="#8a8f94">the unknown end</text><text x="30" y="252" font-size="13.5" fill="#23282d">Linear copying first means every product comes from a real genomic template and the background is low.</text><text x="30" y="272" font-size="13.5" fill="#23282d">The human application: where in the genome did a lentiviral vector land?</text>
</svg>
