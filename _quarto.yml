project:
  type: website
  output-dir: docs
  render:
    # One folder per unit, one level deep. Order is set by the sidebar below,
    # not by these globs. Teacher-only material is excluded from the site.
    - "index.qmd"
    - "*/*.qmd"
    - "!planning/"
    - "!oldpres/"
    - "!tools/"
    - "!CURRICULUM.md"
    - "!AUDIENCE.md"
    - "!README.md"

website:
  title: "NGS library preparation"
  navbar:
    left:
      - href: index.qmd
        text: Home
  sidebar:
    style: docked
    search: true
    contents:
      - text: Home
        href: index.qmd
      # ----------------------------------------------------------------------
      # Order is defined HERE, not in filenames. To reorder a unit, move its
      # block; never rename its folder. The plan is in CURRICULUM.md.
      # styles.css colours leaf links: lec* → green, readings → grey,
      # exercises → italic.
      # ----------------------------------------------------------------------
      - section: "Foundations"
        contents:
          - section: "Nucleic acids as a building material"
            contents:
              - text: "Lecture (slides)"
                href: nucleic-acids/lec.qmd
              - text: "Readings"
                href: nucleic-acids/readings.qmd
              - text: "Exercise"
                href: nucleic-acids/exercise.qmd
          - section: "How sequencers read DNA"
            contents:
              - text: "Lecture (slides): Illumina"
                href: sequencers/lec.qmd
              - text: "Lecture (slides): other platforms"
                href: sequencers/lec-platforms.qmd
              - text: "Readings"
                href: sequencers/readings.qmd
              - text: "Exercise"
                href: sequencers/exercise.qmd

format:
  html:
    toc: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github
    theme: cosmo
    css: styles.css

# reveal.js navigation arrows for every lecture deck (lec*.qmd). Plain top-level
# keys, not a `format: revealjs:` block: html pages ignore them, so no page is
# rendered as slides by accident. `controls: true` shows the arrows on desktop
# too (Quarto's default `auto` shows them only on touch devices).
controls: true
controls-layout: edges
controls-back-arrows: visible
