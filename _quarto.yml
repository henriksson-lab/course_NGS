project:
  title: "ngs-libprep"
  # Only these render, so CURRICULUM.md, planning/ and oldpres/ stay off the site.
  output-dir: _site
  render:
    - "index.qmd"
    - "foundations/**/*.qmd"
    - "blocks/**/*.qmd"
    - "usecases/**/*.qmd"
    - "tricks/**/*.qmd"
    - "qc/**/*.qmd"
    - "design/**/*.qmd"

format:
  html:
    theme: yeti
    embed-resources: true
    toc: true
    code-copy: true
    code-overflow: wrap
