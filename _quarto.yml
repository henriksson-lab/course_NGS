project:
  type: website
  output-dir: docs
  render:
    # One folder per unit, one level deep. Order is set by the sidebar below,
    # not by these globs. Teacher-only material is excluded from the site.
    - "index.qmd"
    - "*/*.qmd"
    - "!planning/"
    - "!oldpres/"
    - "!tools/"
    - "!CURRICULUM.md"
    - "!AUDIENCE.md"
    - "!README.md"

