<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 775 210" width="775" height="210" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="210" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Denature, neutralise, dilute, load: the library must be single-stranded and at the right concentration.</text><rect x="40" y="54" width="108" height="54" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="94.0" y="77.625" font-size="12.5" text-anchor="middle" fill="#1f3b57">pool</text><text x="94.0" y="93.125" font-size="12.5" text-anchor="middle" fill="#1f3b57">(nM)</text><line x1="151" y1="81" x2="165" y2="81" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 169 81 L 165 78.2 L 165 83.8 Z" fill="#8a8f94"/><rect x="172" y="54" width="108" height="54" rx="4" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="226.0" y="77.625" font-size="12.5" text-anchor="middle" fill="#b4532a">+ NaOH,</text><text x="226.0" y="93.125" font-size="12.5" text-anchor="middle" fill="#b4532a">5 min</text><line x1="283" y1="81" x2="297" y2="81" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 301 81 L 297 78.2 L 297 83.8 Z" fill="#8a8f94"/><rect x="304" y="54" width="108" height="54" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="358.0" y="77.625" font-size="12.5" text-anchor="middle" fill="#2e6b3f">+ Tris</text><text x="358.0" y="93.125" font-size="12.5" text-anchor="middle" fill="#2e6b3f">neutralise</text><line x1="415" y1="81" x2="429" y2="81" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 433 81 L 429 78.2 L 429 83.8 Z" fill="#8a8f94"/><rect x="436" y="54" width="108" height="54" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="490.0" y="77.625" font-size="12.5" text-anchor="middle" fill="#1f3b57">dilute in</text><text x="490.0" y="93.125" font-size="12.5" text-anchor="middle" fill="#1f3b57">chilled buffer</text><line x1="547" y1="81" x2="561" y2="81" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 565 81 L 561 78.2 L 561 83.8 Z" fill="#8a8f94"/><rect x="568" y="54" width="108" height="54" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="622.0" y="77.625" font-size="12.5" text-anchor="middle" fill="#6b5b8a">load,</text><text x="622.0" y="93.125" font-size="12.5" text-anchor="middle" fill="#6b5b8a">+ PhiX</text><text x="40" y="146" font-size="13.5" fill="#23282d">NaOH separates the strands, so they can hybridise to the flow cell instead of to each other.</text><text x="40" y="168" font-size="13.5" fill="#a33a28">Re-annealing starts as soon as the base is neutralised: load promptly.</text><text x="40" y="190" font-size="13.5" fill="#8a8f94">Final loading concentration depends on the instrument and kit: take it from the instrument guide.</text>
</svg>
