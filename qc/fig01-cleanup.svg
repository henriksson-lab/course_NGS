<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 268" width="842" height="268" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="268" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Four ways to clean a reaction. They differ in what they remove and what they lose.</text><line x1="303.0612954237822" y1="52" x2="303.0612954237822" y2="190" stroke="#e4e6e8" stroke-width="1" stroke-linecap="round"/><text x="303.0612954237822" y="206" font-size="11" text-anchor="middle" fill="#8a8f94">50</text><line x1="350.76532385594555" y1="52" x2="350.76532385594555" y2="190" stroke="#e4e6e8" stroke-width="1" stroke-linecap="round"/><text x="350.76532385594555" y="206" font-size="11" text-anchor="middle" fill="#8a8f94">100</text><line x1="426.3744200542603" y1="52" x2="426.3744200542603" y2="190" stroke="#e4e6e8" stroke-width="1" stroke-linecap="round"/><text x="426.3744200542603" y="206" font-size="11" text-anchor="middle" fill="#8a8f94">300</text><line x1="509.23467614405445" y1="52" x2="509.23467614405445" y2="190" stroke="#e4e6e8" stroke-width="1" stroke-linecap="round"/><text x="509.23467614405445" y="206" font-size="11" text-anchor="middle" fill="#8a8f94">1000</text><line x1="584.8437723423692" y1="52" x2="584.8437723423692" y2="190" stroke="#e4e6e8" stroke-width="1" stroke-linecap="round"/><text x="584.8437723423692" y="206" font-size="11" text-anchor="middle" fill="#8a8f94">3000</text><text x="430.0" y="222" font-size="11" text-anchor="middle" fill="#8a8f94">fragment size (bp), log scale</text><text x="40" y="76" font-size="13" fill="#23282d">SPRI beads</text><rect x="350.76532385594555" y="62" width="269.23467614405445" height="20" rx="3" fill="#2e6b3f" opacity="0.28"/><text x="632" y="76" font-size="11.5" fill="#8a8f94">ratio sets the lower limit</text><text x="40" y="110" font-size="13" fill="#23282d">silica column</text><rect x="315.6090961983147" y="96" width="304.3909038016853" height="20" rx="3" fill="#1f3b57" opacity="0.28"/><text x="632" y="110" font-size="11.5" fill="#8a8f94">fixed lower limit, about 50-100 bp</text><text x="40" y="144" font-size="13" fill="#23282d">alcohol precipitation</text><rect x="378.670391622097" y="130" width="241.329608377903" height="20" rx="3" fill="#b4532a" opacity="0.28"/><text x="632" y="144" font-size="11.5" fill="#8a8f94">short pieces stay in solution</text><text x="40" y="178" font-size="13" fill="#23282d">gel extraction</text><rect x="413.82661927972777" y="164" width="70.86084359722742" height="20" rx="3" fill="#6b5b8a" opacity="0.28"/><text x="494.6874628769552" y="178" font-size="11.5" fill="#8a8f94">any window, exact, lossy</text><text x="40" y="250" font-size="13" fill="#8a8f94">Bars show what is retained, schematically. Exact limits depend on the product and lot.</text>
</svg>
