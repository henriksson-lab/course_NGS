<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 729 260" width="729" height="260" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="260" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Spend a small aliquot, not the sample: test first, then commit.</text><rect x="40" y="70" width="130" height="56" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="105.0" y="94.625" font-size="12.5" text-anchor="middle" fill="#1f3b57">reaction</text><text x="105.0" y="110.125" font-size="12.5" text-anchor="middle" fill="#1f3b57">(whole sample)</text><line x1="176" y1="98" x2="245" y2="98" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 250 98 L 245 94.5 L 245 101.5 Z" fill="#8a8f94"/><rect x="256" y="70" width="130" height="56" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="321.0" y="94.625" font-size="12.5" text-anchor="middle" fill="#1f3b57">next step</text><text x="321.0" y="110.125" font-size="12.5" text-anchor="middle" fill="#1f3b57">(committed)</text><line x1="105" y1="126" x2="105" y2="160" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="105" y1="160" x2="145" y2="160" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 150 160 L 145 156.5 L 145 163.5 Z" fill="#8a8f94"/><rect x="156" y="148" width="96" height="34" rx="4" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="204.0" y="169.2" font-size="12" text-anchor="middle" fill="#b4532a">1 uL aliquot</text><line x1="256" y1="165" x2="301" y2="165" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 306 165 L 301 161.5 L 301 168.5 Z" fill="#8a8f94"/><rect x="312" y="148" width="120" height="34" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="372.0" y="169.2" font-size="12" text-anchor="middle" fill="#23282d">trace / qPCR / gel</text><text x="470" y="98" font-size="13" fill="#23282d">result decides whether</text><text x="470" y="116" font-size="13" fill="#23282d">the sample goes on</text><text x="40" y="218" font-size="14" fill="#23282d">1 uL of 25 uL is 4% of the sample. Cheap insurance against a step that you cannot undo.</text><text x="40" y="240" font-size="13.5" fill="#8a8f94">Examples: 1 uL on a trace after fragmentation; a test digest; 10% of the pre-amplified cDNA to qPCR.</text>
</svg>
