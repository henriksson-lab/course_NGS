<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="720" height="292" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="292" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Why the numbers disagree: each measurement counts a different subset of what is in the tube.</text><text x="300" y="54" font-size="13" text-anchor="middle" fill="#8a8f94">Qubit</text><text x="400" y="54" font-size="13" text-anchor="middle" fill="#8a8f94">qPCR</text><text x="500" y="54" font-size="13" text-anchor="middle" fill="#8a8f94">analyser</text><text x="40" y="74" font-size="13" fill="#23282d">library, both adapters</text><line x1="294" y1="68" x2="298" y2="73" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="298" y1="73" x2="306" y2="62" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="394" y1="68" x2="398" y2="73" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="398" y1="73" x2="406" y2="62" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="494" y1="68" x2="498" y2="73" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="498" y1="73" x2="506" y2="62" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><text x="40" y="102" font-size="13" fill="#23282d">adapter dimer</text><line x1="294" y1="96" x2="298" y2="101" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="298" y1="101" x2="306" y2="90" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="394" y1="96" x2="398" y2="101" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="398" y1="101" x2="406" y2="90" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="494" y1="96" x2="498" y2="101" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="498" y1="101" x2="506" y2="90" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><text x="40" y="130" font-size="13" fill="#23282d">one adapter only</text><line x1="294" y1="124" x2="298" y2="129" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="298" y1="129" x2="306" y2="118" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="395" y1="121" x2="405" y2="131" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="395" y1="131" x2="405" y2="121" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="494" y1="124" x2="498" y2="129" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="498" y1="129" x2="506" y2="118" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><text x="40" y="158" font-size="13" fill="#23282d">no adapter (leftover fragments)</text><line x1="294" y1="152" x2="298" y2="157" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="298" y1="157" x2="306" y2="146" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="395" y1="149" x2="405" y2="159" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="395" y1="159" x2="405" y2="149" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="494" y1="152" x2="498" y2="157" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="498" y1="157" x2="506" y2="146" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><text x="40" y="186" font-size="13" fill="#23282d">single-stranded DNA</text><line x1="295" y1="177" x2="305" y2="187" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="295" y1="187" x2="305" y2="177" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="394" y1="180" x2="398" y2="185" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="398" y1="185" x2="406" y2="174" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="495" y1="177" x2="505" y2="187" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="495" y1="187" x2="505" y2="177" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><text x="40" y="214" font-size="13" fill="#23282d">RNA, free nucleotides</text><line x1="295" y1="205" x2="305" y2="215" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="295" y1="215" x2="305" y2="205" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="395" y1="205" x2="405" y2="215" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="395" y1="215" x2="405" y2="205" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="495" y1="205" x2="505" y2="215" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><line x1="495" y1="215" x2="505" y2="205" stroke="#8a8f94" stroke-width="2.2" stroke-linecap="round"/><text x="40" y="252" font-size="14" fill="#23282d">Qubit high, qPCR low: much of the DNA lacks adapters, or is one-sided. Trace says which.</text><text x="40" y="274" font-size="13.5" fill="#8a8f94">Single-stranded DNA is invisible to dsDNA dyes, but amplifies if adapters are there.</text>
</svg>
