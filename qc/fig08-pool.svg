<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 292" width="700" height="292" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="292" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Equal mass is not equal molecules. Short fragments carry more molecules per nanogram.</text><text x="60" y="54" font-size="13" fill="#8a8f94">pooled by mass (20 ng each)</text><text x="40" y="81" font-size="12.5" fill="#23282d">A  450 bp</text><rect x="130" y="66" width="148" height="20" fill="#1f3b57" opacity="0.4"/><text x="286.14814814814815" y="81" font-size="12" fill="#8a8f94">67 fmol</text><text x="40" y="111" font-size="12.5" fill="#23282d">B  600 bp</text><rect x="130" y="96" width="111" height="20" fill="#2e6b3f" opacity="0.4"/><text x="249.11111111111111" y="111" font-size="12" fill="#8a8f94">51 fmol</text><text x="40" y="141" font-size="12.5" fill="#23282d">C  300 bp</text><rect x="130" y="126" width="222" height="20" fill="#b4532a" opacity="0.4"/><text x="360.22222222222223" y="141" font-size="12" fill="#8a8f94">101 fmol</text><text x="60" y="180" font-size="13" fill="#8a8f94">pooled by moles (20 fmol each)</text><text x="40" y="205" font-size="12.5" fill="#23282d">A  450 bp</text><rect x="130" y="190" width="44" height="20" fill="#1f3b57" opacity="0.4"/><text x="182" y="205" font-size="12" fill="#8a8f94">20 fmol</text><text x="40" y="235" font-size="12.5" fill="#23282d">B  600 bp</text><rect x="130" y="220" width="44" height="20" fill="#2e6b3f" opacity="0.4"/><text x="182" y="235" font-size="12" fill="#8a8f94">20 fmol</text><text x="40" y="265" font-size="12.5" fill="#23282d">C  300 bp</text><rect x="130" y="250" width="44" height="20" fill="#b4532a" opacity="0.4"/><text x="182" y="265" font-size="12" fill="#8a8f94">20 fmol</text><text x="420" y="110" font-size="13" fill="#a33a28">C would get twice the</text><text x="420" y="128" font-size="13" fill="#a33a28">reads of B by mass</text>
</svg>
