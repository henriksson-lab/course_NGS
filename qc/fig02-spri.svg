<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 761 238" width="761" height="238" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="238" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">SPRI: DNA sticks to carboxyl-coated magnetic beads when PEG and salt crowd it out of solution.</text><text x="40" y="58" font-size="13" fill="#2e6b3f">high PEG / NaCl</text><circle cx="150" cy="110" r="24" fill="#8a6f4a"/><path d="M 174.0 110.0 q 11.6 7.9 22.0 0.0" fill="none" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 167.0 127.0 q 2.6 13.8 15.6 15.6" fill="none" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 150.0 134.0 q -7.9 11.6 0.0 22.0" fill="none" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 133.0 127.0 q -13.8 2.6 -15.6 15.6" fill="none" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 126.0 110.0 q -11.6 -7.9 -22.0 0.0" fill="none" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 133.0 93.0 q -2.6 -13.8 -15.6 -15.6" fill="none" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 150.0 86.0 q 7.9 -11.6 -0.0 -22.0" fill="none" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 167.0 93.0 q 13.8 -2.6 15.6 -15.6" fill="none" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="150" y="172" font-size="12" text-anchor="middle" fill="#8a8f94">DNA collapses onto the bead</text><text x="330" y="58" font-size="13" fill="#2e6b3f">wash with 80% ethanol, elute in water or low-salt buffer</text><circle cx="380" cy="110" r="24" fill="#8a6f4a"/><line x1="420" y1="110" x2="475" y2="110" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 480 110 L 475 106.5 L 475 113.5 Z" fill="#8a8f94"/><path d="M 495 100 q 20 -20 40 0 t 40 0" fill="none" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><text x="535" y="132" font-size="12" text-anchor="middle" fill="#8a8f94">DNA released</text><text x="40" y="196" font-size="14" fill="#23282d">Longer DNA binds at lower PEG, so the ratio of bead mix to sample decides the shortest fragment kept.</text><text x="40" y="218" font-size="13" fill="#8a8f94">Reference: DeAngelis et al. 1995, Rohland and Reich 2012.</text>
</svg>
