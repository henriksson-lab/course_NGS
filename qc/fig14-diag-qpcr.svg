<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 763 284" width="763" height="284" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="284" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Diagnostic qPCR: run a small aliquot, stop the real PCR at about one third of maximum.</text><line x1="80" y1="188" x2="500" y2="188" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><line x1="80" y1="48" x2="80" y2="188" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><polyline points="80.0,187.9 90.5,187.9 101.0,187.8 111.5,187.8 122.0,187.7 132.5,187.5 143.0,187.2 153.5,186.9 164.0,186.3 174.5,185.5 185.0,184.3 195.5,182.5 206.0,180.0 216.5,176.4 227.0,171.3 237.5,164.5 248.0,155.6 258.5,144.6 269.0,131.8 279.5,118.0 290.0,104.2 300.5,91.4 311.0,80.4 321.5,71.5 332.0,64.7 342.5,59.6 353.0,56.0 363.5,53.5 374.0,51.7 384.5,50.5 395.0,49.7 405.5,49.1 416.0,48.8 426.5,48.5 437.0,48.3 447.5,48.2 458.0,48.2 468.5,48.1 479.0,48.1 489.5,48.0 500.0,48.0" fill="none" stroke="#1f3b57" stroke-width="2.4"/><line x1="80" y1="141.33333333333334" x2="500" y2="141.33333333333334" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><text x="508" y="145.33333333333334" font-size="12" fill="#b4532a">1/3 max</text><line x1="232.25" y1="141.33333333333334" x2="232.25" y2="188" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><text x="232.25" y="206" font-size="12" text-anchor="middle" fill="#b4532a">extra cycles</text><text x="458.0" y="68" font-size="12" text-anchor="end" fill="#a33a28">plateau: over-amplified</text><text x="290.0" y="224" font-size="11" text-anchor="middle" fill="#8a8f94">cycle</text><text x="40" y="244" font-size="13.5" fill="#23282d">ATAC-seq does five cycles, runs 5 uL in a qPCR, and adds the cycles needed to reach one third of maximum.</text><text x="40" y="266" font-size="13.5" fill="#8a8f94">The aliquot is spent so that the library is not over-amplified.</text>
</svg>
