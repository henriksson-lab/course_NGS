<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 702 230" width="702" height="230" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="230" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Double-sided selection: two bead additions keep a window.</text><rect x="40" y="48" width="195" height="108" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="138" y="70" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1  add 0.6x beads</text><text x="138" y="94" font-size="12" text-anchor="middle" fill="#23282d">long fragments (above ~500) bind</text><text x="138" y="128" font-size="12" text-anchor="middle" fill="#8a8f94">keep the supernatant,</text><text x="138" y="143" font-size="12" text-anchor="middle" fill="#8a8f94">bin the beads</text><line x1="239" y1="102" x2="249" y2="102" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 253 102 L 249 99.2 L 249 104.8 Z" fill="#8a8f94"/><rect x="255" y="48" width="195" height="108" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="353" y="70" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2  add beads to 0.8x total</text><text x="353" y="94" font-size="12" text-anchor="middle" fill="#23282d">medium fragments (above ~250)</text><text x="353" y="109" font-size="12" text-anchor="middle" fill="#23282d">bind from the supernatant</text><text x="353" y="128" font-size="12" text-anchor="middle" fill="#8a8f94">keep the beads,</text><text x="353" y="143" font-size="12" text-anchor="middle" fill="#8a8f94">bin the supernatant</text><line x1="454" y1="102" x2="464" y2="102" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 468 102 L 464 99.2 L 464 104.8 Z" fill="#8a8f94"/><rect x="470" y="48" width="195" height="108" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="568" y="70" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3  wash, elute</text><text x="568" y="94" font-size="12" text-anchor="middle" fill="#23282d">what stuck in step 2:</text><text x="568" y="109" font-size="12" text-anchor="middle" fill="#23282d">~250 to ~500 bp</text><text x="40" y="188" font-size="14" fill="#23282d">Removes both the long fragments and the short ones (adapter dimers) in one clean-up.</text><text x="40" y="210" font-size="13.5" fill="#8a8f94">Cost: recovery is lower than for a single clean-up, so keep it for samples that have enough DNA.</text>
</svg>
