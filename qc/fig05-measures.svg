<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 736 250" width="736" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="250" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Three instruments, three different questions about the same tube.</text><rect x="40" y="48" width="205" height="128" rx="4" fill="#fbfbf9" stroke="#1f3b57" stroke-width="1.2"/><text x="142" y="72" font-size="15" text-anchor="middle" fill="#1f3b57" font-weight="bold">Qubit</text><text x="142" y="92" font-size="12" text-anchor="middle" fill="#23282d">how much double-stranded DNA</text><text x="142" y="118" font-size="12" text-anchor="middle" fill="#8a8f94">a dye lights up in the helix:</text><text x="142" y="133" font-size="12" text-anchor="middle" fill="#8a8f94">mass of everything,</text><text x="142" y="148" font-size="12" text-anchor="middle" fill="#8a8f94">of any length</text><rect x="265" y="48" width="205" height="128" rx="4" fill="#fbfbf9" stroke="#2e6b3f" stroke-width="1.2"/><text x="367" y="72" font-size="15" text-anchor="middle" fill="#2e6b3f" font-weight="bold">qPCR</text><text x="367" y="92" font-size="12" text-anchor="middle" fill="#23282d">how many amplifiable molecules</text><text x="367" y="118" font-size="12" text-anchor="middle" fill="#8a8f94">primers to P5 and P7:</text><text x="367" y="133" font-size="12" text-anchor="middle" fill="#8a8f94">only molecules with</text><text x="367" y="148" font-size="12" text-anchor="middle" fill="#8a8f94">both adapters count</text><rect x="490" y="48" width="205" height="128" rx="4" fill="#fbfbf9" stroke="#b4532a" stroke-width="1.2"/><text x="592" y="72" font-size="15" text-anchor="middle" fill="#b4532a" font-weight="bold">fragment analyser</text><text x="592" y="92" font-size="12" text-anchor="middle" fill="#23282d">what sizes are present</text><text x="592" y="118" font-size="12" text-anchor="middle" fill="#8a8f94">electrophoresis:</text><text x="592" y="133" font-size="12" text-anchor="middle" fill="#8a8f94">size shape, rough mass,</text><text x="592" y="148" font-size="12" text-anchor="middle" fill="#8a8f94">not a precise molarity</text><text x="40" y="208" font-size="14" fill="#23282d">What the sequencer needs is the number of molecules with both adapters. Only qPCR measures that.</text><text x="40" y="230" font-size="13.5" fill="#8a8f94">So use qPCR for the concentration, the analyser for the size, and Qubit for mass where size is clean.</text>
</svg>
