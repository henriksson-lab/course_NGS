<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 645 248" width="645" height="248" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="620" height="248" fill="none"/>
<line x1="60" y1="48" x2="120" y2="48" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><circle cx="60" cy="48" r="5.5" fill="#2e6b3f"/><text x="50" y="52" font-size="11.5" text-anchor="end" fill="#8a8f94">5'</text><text x="136" y="53" font-size="14.5" fill="#2e6b3f" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">5'-P</text><text x="290" y="53" font-size="13.5" fill="#8a8f94">ligatable donor</text><line x1="60" y1="88" x2="120" y2="88" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><circle cx="60" cy="88" r="5.5" fill="#a33a28"/><text x="50" y="92" font-size="11.5" text-anchor="end" fill="#8a8f94">5'</text><text x="136" y="93" font-size="14.5" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">5'-OH</text><text x="290" y="93" font-size="13.5" fill="#8a8f94">ligase cannot use it</text><line x1="60" y1="128" x2="120" y2="128" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><circle cx="120" cy="128" r="5.5" fill="#2e6b3f"/><text x="50" y="132" font-size="11.5" text-anchor="end" fill="#8a8f94">3'</text><text x="136" y="133" font-size="14.5" fill="#2e6b3f" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">3'-OH</text><text x="290" y="133" font-size="13.5" fill="#8a8f94">extendable, ligatable</text><line x1="60" y1="168" x2="120" y2="168" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><circle cx="120" cy="168" r="5.5" fill="#a33a28"/><text x="50" y="172" font-size="11.5" text-anchor="end" fill="#8a8f94">3'</text><text x="136" y="173" font-size="14.5" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">3'-P / 3'-C3</text><text x="290" y="173" font-size="13.5" fill="#8a8f94">blocked: nothing happens</text><text x="50" y="228" font-size="14" fill="#23282d">Two atoms decide almost everything: is there a phosphate at 5', and is the 3' free?</text>
