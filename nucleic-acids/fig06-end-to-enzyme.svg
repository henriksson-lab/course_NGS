<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 242" width="760" height="242" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="242" fill="none"/>
<text x="50" y="32" font-size="13" fill="#8a8f94">what the end is</text><text x="376" y="32" font-size="13" fill="#8a8f94">what can happen to it</text><text x="50" y="60" font-size="13.5" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>free 3'-OH</text><line x1="340" y1="55" x2="361" y2="55" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><path d="M 366 55 L 361 51.5 L 361 58.5 Z" fill="#2e6b3f"/><text x="376" y="60" font-size="14" fill="#2e6b3f">polymerase can extend it</text><text x="50" y="90" font-size="13.5" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>free 3'-OH + 5'-P across a nick</text><line x1="340" y1="85" x2="361" y2="85" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><path d="M 366 85 L 361 81.5 L 361 88.5 Z" fill="#2e6b3f"/><text x="376" y="90" font-size="14" fill="#2e6b3f">ligase can seal it</text><text x="50" y="120" font-size="13.5" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>5'-OH</text><line x1="340" y1="115" x2="361" y2="115" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 366 115 L 361 111.5 L 361 118.5 Z" fill="#b4532a"/><text x="376" y="120" font-size="14" fill="#b4532a">kinase (T4 PNK) must add a phosphate first</text><text x="50" y="150" font-size="13.5" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>3'-P or 3'-C3 spacer</text><line x1="340" y1="145" x2="361" y2="145" stroke="#a33a28" stroke-width="1.6" stroke-linecap="round"/><path d="M 366 145 L 361 141.5 L 361 148.5 Z" fill="#a33a28"/><text x="376" y="150" font-size="14" fill="#a33a28">nothing extends: deliberate dead end</text><text x="50" y="180" font-size="13.5" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>recessed 3' end</text><line x1="340" y1="175" x2="361" y2="175" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 366 175 L 361 171.5 L 361 178.5 Z" fill="#b4532a"/><text x="376" y="180" font-size="14" fill="#b4532a">polymerase fills in, or exonuclease chews back</text><text x="50" y="224" font-size="14" fill="#23282d">Read any protocol step as: which end state goes in, which comes out.</text>
</svg>
