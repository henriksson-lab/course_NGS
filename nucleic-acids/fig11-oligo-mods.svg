<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 214" width="760" height="214" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="214" fill="none"/>
<line x1="120" y1="86" x2="600" y2="86" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="108" y="91" font-size="13" text-anchor="end" fill="#8a8f94">5'</text><text x="612" y="91" font-size="13" fill="#8a8f94">3'</text><circle cx="120" cy="86" r="5.5" fill="#b4532a"/><line x1="120" y1="80" x2="120" y2="70" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="120" y="52" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">biotin</text><text x="120" y="68" font-size="11.5" text-anchor="middle" fill="#8a8f94">grabs streptavidin beads</text><circle cx="216" cy="86" r="5.5" fill="#b4532a"/><line x1="216" y1="92" x2="216" y2="110" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="216" y="132" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">phosphate</text><text x="216" y="148" font-size="11.5" text-anchor="middle" fill="#8a8f94">lets a ligase use this end</text><circle cx="312" cy="86" r="5.5" fill="#b4532a"/><line x1="312" y1="80" x2="312" y2="70" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="312" y="52" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">lipid</text><text x="312" y="68" font-size="11.5" text-anchor="middle" fill="#8a8f94">sits in a cell membrane</text><circle cx="408" cy="86" r="5.5" fill="#b4532a"/><line x1="408" y1="92" x2="408" y2="110" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="408" y="132" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">dU</text><text x="408" y="148" font-size="11.5" text-anchor="middle" fill="#8a8f94">USER excises it, leaving a gap</text><circle cx="504" cy="86" r="5.5" fill="#b4532a"/><line x1="504" y1="80" x2="504" y2="70" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="504" y="52" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">phosphorothioate</text><text x="504" y="68" font-size="11.5" text-anchor="middle" fill="#8a8f94">survives exonucleases</text><circle cx="600" cy="86" r="5.5" fill="#b4532a"/><line x1="600" y1="92" x2="600" y2="110" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="600" y="132" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">C3 / ddC / inv-dT</text><text x="600" y="148" font-size="11.5" text-anchor="middle" fill="#8a8f94">3' blocked: no extension</text><text x="50" y="196" font-size="14" fill="#23282d">An oligo is not just a sequence: its modifications decide what enzymes can do to it.</text>
</svg>
