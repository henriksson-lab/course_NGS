<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 214" width="680" height="214" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="680" height="214" fill="none"/>
<line x1="160" y1="86" x2="530" y2="86" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="148" y="91" font-size="13" text-anchor="end" fill="#8a8f94">5'</text><text x="542" y="91" font-size="13" fill="#8a8f94">3'</text><circle cx="160" cy="86" r="5.5" fill="#b4532a"/><line x1="160" y1="80" x2="160" y2="62" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="160" y="52" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">biotin</text><text x="160" y="68" font-size="11.5" text-anchor="middle" fill="#8a8f94">grabs streptavidin beads</text><circle cx="250" cy="86" r="5.5" fill="#b4532a"/><line x1="250" y1="92" x2="250" y2="110" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="250" y="132" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">phosphate</text><text x="250" y="148" font-size="11.5" text-anchor="middle" fill="#8a8f94">lets a ligase use this end</text><circle cx="350" cy="86" r="5.5" fill="#b4532a"/><line x1="350" y1="80" x2="350" y2="62" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="350" y="52" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">dU</text><text x="350" y="68" font-size="11.5" text-anchor="middle" fill="#8a8f94">cut out later by USER</text><circle cx="440" cy="86" r="5.5" fill="#b4532a"/><line x1="440" y1="92" x2="440" y2="110" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="440" y="132" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">phosphorothioate</text><text x="440" y="148" font-size="11.5" text-anchor="middle" fill="#8a8f94">survives exonucleases</text><circle cx="530" cy="86" r="5.5" fill="#b4532a"/><line x1="530" y1="80" x2="530" y2="62" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="530" y="52" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">C3 / ddC / inv-dT</text><text x="530" y="68" font-size="11.5" text-anchor="middle" fill="#8a8f94">3' blocked: no extension</text><text x="50" y="196" font-size="14" fill="#23282d">An oligo is not just a sequence: its modifications decide what enzymes can do to it.</text>
</svg>
