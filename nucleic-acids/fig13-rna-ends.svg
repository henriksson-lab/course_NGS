<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 254" width="700" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="254" fill="none"/>
<line x1="110" y1="74" x2="420" y2="74" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="round"/><circle cx="104" cy="74" r="9" fill="#b4532a"/><text x="104" y="78" font-size="8.5" text-anchor="middle" fill="#fff" font-weight="bold">m7G</text><text x="104" y="54" font-size="13" text-anchor="middle" fill="#b4532a">cap</text><text x="265" y="54" font-size="13" text-anchor="middle" fill="#8a8f94">coding and untranslated sequence</text><text x="424.0" y="79" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="437.5" y="79" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="451.0" y="79" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="464.5" y="79" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="478.0" y="79" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="491.5" y="79" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="505.0" y="79" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="518.5" y="79" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="532.0" y="79" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="545.5" y="79" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="491.5" y="54" font-size="13" text-anchor="middle" fill="#4a6b8a">poly(A)</text><text x="50" y="136" font-size="14" fill="#23282d">Other 5' ends you will meet:</text><text x="70" y="160" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>5'-PPP</text><text x="150" y="160" font-size="13" fill="#8a8f94">primary transcript, uncapped</text><text x="70" y="182" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>5'-P</text><text x="150" y="182" font-size="13" fill="#8a8f94">cleaved — a ligase can use it</text><text x="70" y="204" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>5'-OH</text><text x="150" y="204" font-size="13" fill="#8a8f94">cleaved another way — ligase cannot</text><text x="360" y="136" font-size="14" fill="#23282d">And 3' ends:</text><text x="380" y="160" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>3'-OH</text><text x="510" y="160" font-size="13" fill="#8a8f94">ready to ligate</text><text x="380" y="182" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>2',3'-cyclic P</text><text x="510" y="182" font-size="13" fill="#8a8f94">must be opened first</text><text x="50" y="236" font-size="14" fill="#23282d">Which end an RNA has decides how you can attach anything to it.</text>
</svg>
