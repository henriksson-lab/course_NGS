<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 258" width="900" height="258" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="258" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Same exercise for RNA: single-cell full-length cDNA (Smart-seq2 style).</text><text x="40" y="67" font-size="13" fill="#23282d">1  mRNA</text><rect x="240" y="52" width="150" height="22" rx="3" fill="#e3edf7" stroke="#1f3b57" stroke-width="1.2"/><text x="315.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">5' cap ... mRNA ...</text><rect x="390" y="52" width="40" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="410.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">AAAA</text><text x="560" y="67" font-size="12" fill="#8a8f94">poly(A) tail at the 3' end</text><text x="40" y="101" font-size="13" fill="#23282d">2  RT with oligo-dT</text><rect x="240" y="86" width="150" height="22" rx="3" fill="#e3edf7" stroke="#1f3b57" stroke-width="1.2"/><text x="315.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">5' cap ... mRNA ...</text><rect x="390" y="86" width="40" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="410.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">AAAA</text><rect x="430" y="86" width="52" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="456.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter</text><text x="560" y="101" font-size="12" fill="#8a8f94">first-strand cDNA grows toward the 5' end</text><text x="40" y="135" font-size="13" fill="#23282d">3  template switch</text><rect x="240" y="120" width="42" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="261.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">TSO</text><rect x="282" y="120" width="150" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="357.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">cDNA</text><rect x="432" y="120" width="40" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="452.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">TTTT</text><rect x="472" y="120" width="52" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="498.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter</text><text x="560" y="135" font-size="12" fill="#8a8f94">5' adapter added by the TSO</text><text x="40" y="169" font-size="13" fill="#23282d">4  PCR (pre-amplify)</text><rect x="240" y="154" width="52" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="266.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="292" y="154" width="150" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="367.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">cDNA</text><rect x="442" y="154" width="52" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="468.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter</text><text x="560" y="169" font-size="12" fill="#8a8f94">one primer pair amplifies all</text><text x="40" y="203" font-size="13" fill="#23282d">5  tagment, index PCR</text><rect x="240" y="188" width="64" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="272.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="304" y="188" width="110" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="359.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">cDNA piece</text><rect x="414" y="188" width="64" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="446.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="560" y="203" font-size="12" fill="#8a8f94">Tn5 cuts the cDNA; index PCR completes</text><text x="40" y="238" font-size="14" fill="#b4532a">The tricks you meet: template switching, pre-amplification, tagmentation, truncated adapters.</text>
</svg>
