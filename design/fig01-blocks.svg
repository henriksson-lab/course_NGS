<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 747 232" width="747" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="232" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Eight blocks cover most library preparations. Each changes the ends or the content of the molecule.</text><rect x="40" y="48" width="156" height="56" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="118.0" y="72.625" font-size="12.5" text-anchor="middle" fill="#1f3b57">fragment</text><text x="118.0" y="88.125" font-size="12.5" text-anchor="middle" fill="#1f3b57">makes ends</text><rect x="212" y="48" width="156" height="56" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="290.0" y="72.625" font-size="12.5" text-anchor="middle" fill="#1f3b57">end prep</text><text x="290.0" y="88.125" font-size="12.5" text-anchor="middle" fill="#1f3b57">blunt, 5'-P, A-tail</text><rect x="384" y="48" width="156" height="56" rx="4" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="462.0" y="72.625" font-size="12.5" text-anchor="middle" fill="#b4532a">ligate</text><text x="462.0" y="88.125" font-size="12.5" text-anchor="middle" fill="#b4532a">adds adapter</text><rect x="556" y="48" width="156" height="56" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="634.0" y="72.625" font-size="12.5" text-anchor="middle" fill="#2e6b3f">reverse transcribe</text><text x="634.0" y="88.125" font-size="12.5" text-anchor="middle" fill="#2e6b3f">RNA to cDNA</text><rect x="40" y="120" width="156" height="56" rx="4" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="118.0" y="144.625" font-size="12.5" text-anchor="middle" fill="#b4532a">amplify</text><text x="118.0" y="160.125" font-size="12.5" text-anchor="middle" fill="#b4532a">copies, adds ends</text><rect x="212" y="120" width="156" height="56" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="290.0" y="144.625" font-size="12.5" text-anchor="middle" fill="#6b5b8a">select</text><text x="290.0" y="160.125" font-size="12.5" text-anchor="middle" fill="#6b5b8a">size or affinity</text><rect x="384" y="120" width="156" height="56" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="462.0" y="144.625" font-size="12.5" text-anchor="middle" fill="#6b5b8a">index</text><text x="462.0" y="160.125" font-size="12.5" text-anchor="middle" fill="#6b5b8a">adds a barcode</text><rect x="556" y="120" width="156" height="56" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="634.0" y="144.625" font-size="12.5" text-anchor="middle" fill="#1f3b57">pool and load</text><text x="634.0" y="160.125" font-size="12.5" text-anchor="middle" fill="#1f3b57">equal moles</text><text x="40" y="212" font-size="14" fill="#23282d">Write the protocol as a string of these. A step that fits none of them is a trick: look it up.</text>
</svg>
