<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 964 264" width="964" height="264" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="264" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Worked outline: which regulatory regions are open in 500 human CD34+ cells? Closest protocol: Omni-ATAC.</text><text x="40" y="67" font-size="13" fill="#23282d">1  nuclei</text><rect x="220" y="52" width="230" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="335.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">nucleus, chromatin intact</text><text x="520" y="67" font-size="12" fill="#8a8f94">permeabilise, keep nuclei</text><text x="40" y="101" font-size="13" fill="#23282d">2  Tn5 + adapters</text><rect x="220" y="86" width="50" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="245.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R1 stub</text><rect x="270" y="86" width="130" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="335.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">open DNA</text><rect x="400" y="86" width="50" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="425.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R2 stub</text><text x="520" y="101" font-size="12" fill="#8a8f94">tagmentation cuts and tags at once</text><text x="40" y="135" font-size="13" fill="#23282d">3  fill, 5 cycles</text><rect x="220" y="120" width="50" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="245.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R1 stub</text><rect x="270" y="120" width="130" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="335.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">open DNA</text><rect x="400" y="120" width="50" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="425.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R2 stub</text><text x="520" y="135" font-size="12" fill="#8a8f94">gap fill, short PCR, aliquot to qPCR</text><text x="40" y="169" font-size="13" fill="#23282d">4  index PCR</text><rect x="220" y="154" width="64" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="252.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="284" y="154" width="130" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="349.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">open DNA</text><rect x="414" y="154" width="64" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="446.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="520" y="169" font-size="12" fill="#8a8f94">extra cycles from the qPCR</text><text x="40" y="203" font-size="13" fill="#23282d">5  read</text><rect x="220" y="188" width="80" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="260.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#b4532a">R1 50</text><rect x="300" y="188" width="40" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="320.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">i7 8</text><rect x="340" y="188" width="40" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="360.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">i5 8</text><rect x="380" y="188" width="80" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="420.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#b4532a">R2 50</text><text x="520" y="203" font-size="12" fill="#8a8f94">cycles per read: 50 / 8 / 8 / 50</text><text x="40" y="244" font-size="13" fill="#23282d">Controls: no-transposase, deproteinised DNA, a reference cell line, dual indexes. Expected failures: mitochondrial reads, over-tagmentation.</text>
</svg>
