<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 206" width="756" height="206" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="206" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A chimera joins pieces that were never together in the cell.</text><rect x="120" y="54" width="36" height="26" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="138.0" y="71.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5</text><rect x="156" y="54" width="120" height="26" rx="3" fill="#e3edf7" stroke="#1f3b57" stroke-width="1.2"/><text x="216.0" y="71.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">piece A (chr 1)</text><rect x="276" y="54" width="120" height="26" rx="3" fill="#fbeee3" stroke="#b4532a" stroke-width="1.2"/><text x="336.0" y="71.025" font-size="11.5" text-anchor="middle" fill="#b4532a">piece B (chr 7)</text><rect x="396" y="54" width="36" height="26" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="414.0" y="71.025" font-size="11.5" text-anchor="middle" fill="#a33a28">P7</text><line x1="276" y1="46" x2="276" y2="90" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3"/><text x="276" y="106" font-size="12.5" text-anchor="middle" fill="#b4532a">junction: a read that maps to both</text><text x="40" y="142" font-size="13.5" fill="#23282d">Made by: ligation of two inserts; a partial PCR product priming on another template; template switching.</text><text x="40" y="164" font-size="13.5" fill="#23282d">Signature: split reads at no known breakpoint, at microhomologies, more at higher cycles.</text><text x="40" y="186" font-size="13.5" fill="#8a8f94">Control: mix human and mouse material before the step: a read with both species is a chimera.</text>
</svg>
