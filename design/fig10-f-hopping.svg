<text x="40" y="26" font-size="14" fill="#23282d">Index hopping: a read gets the wrong index. Unique dual indexes make it visible.</text><text x="60" y="46" font-size="12.5" fill="#23282d">combinatorial dual: every cell is a sample</text><rect x="80" y="72" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="97.0" y="87.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><rect x="120" y="72" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="137.0" y="87.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><rect x="160" y="72" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="177.0" y="87.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><rect x="80" y="102" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="97.0" y="117.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><rect x="120" y="102" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="137.0" y="117.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><rect x="160" y="102" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="177.0" y="117.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><rect x="80" y="132" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="97.0" y="147.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><rect x="120" y="132" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="137.0" y="147.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><rect x="160" y="132" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="177.0" y="147.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><text x="68" y="88" font-size="11" fill="#8a8f94">i5</text><text x="137" y="66" font-size="11" text-anchor="middle" fill="#8a8f94">i7</text><text x="390" y="46" font-size="12.5" fill="#23282d">unique dual: only the diagonal is a sample</text><rect x="410" y="72" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="427.0" y="87.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><rect x="450" y="72" width="34" height="24" rx="3" fill="none" stroke="#d5d8db" stroke-width="1.2"/><rect x="490" y="72" width="34" height="24" rx="3" fill="none" stroke="#d5d8db" stroke-width="1.2"/><rect x="410" y="102" width="34" height="24" rx="3" fill="none" stroke="#d5d8db" stroke-width="1.2"/><rect x="450" y="102" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="467.0" y="117.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><rect x="490" y="102" width="34" height="24" rx="3" fill="none" stroke="#d5d8db" stroke-width="1.2"/><rect x="410" y="132" width="34" height="24" rx="3" fill="none" stroke="#d5d8db" stroke-width="1.2"/><rect x="450" y="132" width="34" height="24" rx="3" fill="none" stroke="#d5d8db" stroke-width="1.2"/><rect x="490" y="132" width="34" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="507.0" y="147.85" font-size="11" text-anchor="middle" fill="#1f3b57">S</text><text x="398" y="88" font-size="11" fill="#8a8f94">i5</text><text x="467" y="66" font-size="11" text-anchor="middle" fill="#8a8f94">i7</text><text x="60" y="178" font-size="13.5" fill="#a33a28">A hopped read lands in a different cell. If that cell is another sample, you cannot tell.</text><text x="60" y="198" font-size="13.5" fill="#2e6b3f">If it is an unused cell, the read is discarded or counted as hopping.</text><text x="40" y="226" font-size="13.5" fill="#23282d">Signature: reads in an empty well; sample-to-sample leakage.</text><text x="40" y="248" font-size="13.5" fill="#8a8f94">Control: an empty or blank library in the pool, unique dual indexes, remove free adapter [Costello et al. 2018].</text>
</svg>
