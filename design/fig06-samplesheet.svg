<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 236" width="760" height="236" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="236" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Sample sheet: paste the index primers, read off the index each sample carries (illustration).</text><text x="40" y="56" font-size="12" fill="#8a8f94">Sample_ID</text><text x="120" y="56" font-size="12" fill="#8a8f94">i7 oligo, 5' to 3'</text><text x="570" y="56" font-size="12" fill="#8a8f94">index</text><text x="120" y="82" font-size="10" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>CAAGCAGAAGACGGCATACGAGAT</text><text x="264.0" y="82" font-size="10" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>CGAGTAAT</text><text x="312.0" y="82" font-size="10" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GTGACTGGAGTTCAGACGTGTGCTCTTCCGATCT</text><text x="40" y="82" font-size="12.5" fill="#23282d">S1</text><text x="570" y="82" font-size="12.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ATTACTCG</text><text x="40" y="120" font-size="12.5" fill="#23282d">S2</text><text x="120" y="120" font-size="12" fill="#8a8f94">i5 oligo, 5' to 3'</text><text x="120" y="142" font-size="10" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AATGATACGGCGACCACCGAGATCTACAC</text><text x="294.0" y="142" font-size="10" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>TATAGCCT</text><text x="342.0" y="142" font-size="10" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ACACTCTTTCCCTACACGACGCTCTTCCGATCT</text><text x="570" y="142" font-size="12.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>TATAGCCT or AGGCTATA</text><text x="40" y="194" font-size="13.5" fill="#23282d">i7 is read as the reverse complement of what sits in the oligo; i5 depends on the instrument.</text><text x="40" y="216" font-size="13.5" fill="#a33a28">Pick the instrument first: the same oligo gives a different sample-sheet entry on different machines.</text>
</svg>
