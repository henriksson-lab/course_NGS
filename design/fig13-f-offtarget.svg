<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 763 250" width="763" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="250" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Off-target ligation: the ligase joins what it likes, not what you meant (schematic).</text><line x1="70" y1="150" x2="370" y2="150" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><line x1="70" y1="50" x2="70" y2="150" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="90" y="60.0" width="44" height="90.0" fill="#1f3b57" opacity="0.4"/><text x="112" y="166" font-size="12" text-anchor="middle" fill="#23282d">A</text><rect x="160" y="115.0" width="44" height="35.0" fill="#1f3b57" opacity="0.4"/><text x="182" y="166" font-size="12" text-anchor="middle" fill="#23282d">C</text><rect x="230" y="90.0" width="44" height="60.0" fill="#1f3b57" opacity="0.4"/><text x="252" y="166" font-size="12" text-anchor="middle" fill="#23282d">G</text><rect x="300" y="130.0" width="44" height="20.0" fill="#1f3b57" opacity="0.4"/><text x="322" y="166" font-size="12" text-anchor="middle" fill="#23282d">T</text><text x="220.0" y="184" font-size="11" text-anchor="middle" fill="#8a8f94">base at the ligating end</text><text x="64" y="58" font-size="11" text-anchor="end" fill="#8a8f94">efficiency</text><text x="420" y="80" font-size="13" fill="#23282d">Result: abundance in the library</text><text x="420" y="98" font-size="13" fill="#23282d">reflects the end sequence, not</text><text x="420" y="116" font-size="13" fill="#23282d">the amount in the cell.</text><text x="40" y="208" font-size="13.5" fill="#23282d">Also: ligation to carry-over nucleic acid, to the wrong end, or to a second insert (chimera).</text><text x="40" y="230" font-size="13.5" fill="#8a8f94">Control: a spike-in mix of known equimolar sequences shows the bias; random ligating ends average it out.</text>
</svg>
