<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 722 212" width="722" height="212" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="212" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Adapter dimer: the read starts in the adapter, and stays there.</text><rect x="120" y="54" width="80" height="26" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="160.0" y="71.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="200" y="54" width="80" height="26" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="240.0" y="71.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><line x1="120" y1="108" x2="195" y2="108" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 200 108 L 195 104.5 L 195 111.5 Z" fill="#b4532a"/><text x="206" y="112" font-size="12.5" fill="#b4532a">Read 1: adapter sequence at once</text><line x1="280" y1="132" x2="205" y2="132" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 200 132 L 205 128.5 L 205 135.5 Z" fill="#b4532a"/><text x="290" y="136" font-size="12.5" fill="#b4532a">Read 2: same</text><text x="40" y="170" font-size="13.5" fill="#23282d">Signature: a 120-140 bp peak; reads that are all adapter; high adapter content from the first base.</text><text x="40" y="192" font-size="13.5" fill="#8a8f94">Control that tells you: a no-insert (adapter-only) reaction makes the dimer without any sample.</text>
</svg>
