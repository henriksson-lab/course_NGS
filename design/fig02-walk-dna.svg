<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 258" width="900" height="258" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="258" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Draw the construct after every step. Genomic DNA, ligation-based library.</text><text x="40" y="67" font-size="13" fill="#23282d">1  shear</text><rect x="240" y="52" width="190" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="335.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert, ragged ends</text><text x="560" y="67" font-size="12" fill="#8a8f94">mixed 5'-P / 5'-OH, overhangs</text><text x="40" y="101" font-size="13" fill="#23282d">2  end repair, A-tail</text><rect x="240" y="86" width="14" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="247.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#b4532a">A</text><rect x="254" y="86" width="190" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="349.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert, blunt, 5'-P</text><rect x="444" y="86" width="14" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="451.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#b4532a">A</text><text x="560" y="101" font-size="12" fill="#8a8f94">3' A overhang on each end</text><text x="40" y="135" font-size="13" fill="#23282d">3  ligate</text><rect x="240" y="120" width="52" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="266.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="292" y="120" width="190" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="387.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="482" y="120" width="52" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="508.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter</text><text x="560" y="135" font-size="12" fill="#8a8f94">T-overhang adapters; dimers also form</text><text x="40" y="169" font-size="13" fill="#23282d">4  bead clean-up</text><rect x="240" y="154" width="52" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="266.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="292" y="154" width="190" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="387.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="482" y="154" width="52" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="508.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter</text><text x="560" y="169" font-size="12" fill="#8a8f94">free adapter removed; dimers partly</text><text x="40" y="203" font-size="13" fill="#23282d">5  PCR with index primers</text><rect x="240" y="188" width="64" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="272.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="304" y="188" width="190" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="399.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="494" y="188" width="64" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="526.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="560" y="203" font-size="12" fill="#8a8f94">indexes and flow-cell ends added</text><text x="40" y="238" font-size="14" fill="#b4532a">Ask at every step: what is on each 5' and 3' end, and which end can the next enzyme use?</text>
</svg>
