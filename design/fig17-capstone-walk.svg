<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 368" width="980" height="368" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="980" height="368" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">The construct after every step: one fragment end of the 500-cell Omni-ATAC library, both strands.</text><text x="40" y="71" font-size="12.5" fill="#23282d">1  nuclei</text><rect x="200" y="56" width="440" height="18" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="420.0" y="68.85" font-size="11" text-anchor="middle" fill="#8a8f94">accessible DNA in the nucleus</text><rect x="200" y="78" width="440" height="18" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="190" y="69" font-size="11" text-anchor="end" fill="#8a8f94">5'</text><text x="190" y="91" font-size="11" text-anchor="end" fill="#8a8f94">3'</text><text x="648" y="69" font-size="11" fill="#8a8f94">3'</text><text x="648" y="91" font-size="11" fill="#8a8f94">5'</text><text x="700" y="67" font-size="11.5" fill="#8a8f94">blunt duplex, nothing to prime on.</text><text x="700" y="82" font-size="11.5" fill="#8a8f94">Tn5 reaches it only where no</text><text x="700" y="97" font-size="11.5" fill="#8a8f94">nucleosome sits.</text><text x="40" y="131" font-size="12.5" fill="#23282d">2  tagment</text><rect x="200" y="116" width="70" height="18" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="235.0" y="128.85" font-size="11" text-anchor="middle" fill="#1f3b57">tail A</text><rect x="270" y="116" width="90" height="18" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="315.0" y="128.85" font-size="11" text-anchor="middle" fill="#8a8f94">ME 19</text><rect x="360" y="116" width="280" height="18" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="500.0" y="128.85" font-size="11" text-anchor="middle" fill="#8a8f94">insert</text><rect x="270" y="138" width="90" height="18" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="315.0" y="150.85" font-size="11" text-anchor="middle" fill="#8a8f94">ME'</text><rect x="390" y="138" width="250" height="18" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><line x1="360" y1="147" x2="388" y2="147" stroke="#b4532a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="362" y="171" font-size="10" fill="#b4532a">9 nt gap, ending at the insert's 3'-OH</text><circle cx="360" cy="125" r="3" fill="#b4532a"/><text x="356" y="112" font-size="10" text-anchor="end" fill="#b4532a">joined here</text><text x="700" y="127" font-size="11.5" fill="#8a8f94">the stub's 3'-OH is joined to the insert's</text><text x="700" y="142" font-size="11.5" fill="#8a8f94">5'-P, with no ligase. Bottom strand: 3'-OH</text><text x="700" y="157" font-size="11.5" fill="#8a8f94">recessed 9 nt, ME' annealed but not joined.</text><text x="40" y="191" font-size="12.5" fill="#23282d">3  fill in</text><rect x="200" y="176" width="70" height="18" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="235.0" y="188.85" font-size="11" text-anchor="middle" fill="#1f3b57">tail A</text><rect x="270" y="176" width="90" height="18" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="315.0" y="188.85" font-size="11" text-anchor="middle" fill="#8a8f94">ME 19</text><rect x="360" y="176" width="280" height="18" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="500.0" y="188.85" font-size="11" text-anchor="middle" fill="#8a8f94">insert</text><rect x="390" y="198" width="250" height="18" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><line x1="388" y1="211" x2="209" y2="211" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 204 211 L 209 207.5 L 209 214.5 Z" fill="#b4532a"/><text x="295.0" y="204" font-size="10" text-anchor="middle" fill="#b4532a">72 °C: 9 nt, then copy the stub</text><text x="700" y="187" font-size="11.5" fill="#8a8f94">ME' is 19 bp, Tm 47 °C: gone at 72 °C.</text><text x="700" y="202" font-size="11.5" fill="#8a8f94">The insert's own 3'-OH is the primer, 9 nt</text><text x="700" y="217" font-size="11.5" fill="#8a8f94">then the stub. A ligase cannot close a gap.</text><text x="40" y="251" font-size="12.5" fill="#23282d">4  index PCR</text><rect x="120" y="236" width="80" height="18" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="160.0" y="248.85" font-size="11" text-anchor="middle" fill="#1f3b57">P5 i5</text><rect x="200" y="236" width="70" height="18" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="235.0" y="248.85" font-size="11" text-anchor="middle" fill="#1f3b57">tail A</text><rect x="270" y="236" width="90" height="18" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="315.0" y="248.85" font-size="11" text-anchor="middle" fill="#8a8f94">ME 19</text><rect x="360" y="236" width="280" height="18" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="500.0" y="248.85" font-size="11" text-anchor="middle" fill="#8a8f94">insert</text><rect x="200" y="258" width="440" height="18" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="420.0" y="270.85" font-size="11" text-anchor="middle" fill="#8a8f94">template strand</text><text x="124" y="232" font-size="10" fill="#b4532a">from the primer's 5' tail</text><text x="700" y="247" font-size="11.5" fill="#8a8f94">the tail A complement now exists, so the</text><text x="700" y="262" font-size="11.5" fill="#8a8f94">index primer has a site. Before this step</text><text x="700" y="277" font-size="11.5" fill="#8a8f94">the primers have nothing to anneal to.</text><text x="40" y="311" font-size="12.5" fill="#23282d">5  finished</text><rect x="200" y="296" width="160" height="18" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="280.0" y="308.85" font-size="11" text-anchor="middle" fill="#1f3b57">P5 i5 tail A ME</text><rect x="360" y="296" width="170" height="18" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="445.0" y="308.85" font-size="11" text-anchor="middle" fill="#8a8f94">insert</text><rect x="530" y="296" width="110" height="18" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="585.0" y="308.85" font-size="11" text-anchor="middle" fill="#a33a28">ME' tail B' i7 P7</text><rect x="200" y="318" width="440" height="18" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="700" y="307" font-size="11.5" fill="#8a8f94">blunt duplex, P5 one end, P7 the other:</text><text x="700" y="322" font-size="11.5" fill="#8a8f94">70 + insert + 66 bp. Different ends, so it</text><text x="700" y="337" font-size="11.5" fill="#8a8f94">bridges and clusters.</text><text x="40" y="354" font-size="13.5" fill="#b4532a">Write the ends, not the step name: the 9 nt gap, not the cut, is why the fill-in is not optional.</text>
</svg>
