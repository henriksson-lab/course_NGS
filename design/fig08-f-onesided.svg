<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 246" width="700" height="246" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="246" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">One-sided products cannot bridge, so qPCR misses them and the sequencer never reads them.</text><text x="40" y="67" font-size="12.5" fill="#23282d">two adapters, different</text><rect x="240" y="52" width="40" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="260.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5</text><rect x="280" y="52" width="150" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="355.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="430" y="52" width="40" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="450.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#a33a28">P7</text><line x1="488" y1="64" x2="492" y2="69" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="492" y1="69" x2="500" y2="58" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><text x="40" y="101" font-size="12.5" fill="#23282d">same adapter at both ends</text><rect x="240" y="86" width="40" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="260.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5</text><rect x="280" y="86" width="150" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="355.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="430" y="86" width="40" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="450.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5</text><line x1="488" y1="91" x2="500" y2="103" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="488" y1="103" x2="500" y2="91" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><text x="40" y="135" font-size="12.5" fill="#23282d">one adapter only</text><rect x="240" y="120" width="40" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="260.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5</text><rect x="280" y="120" width="150" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="355.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><line x1="448" y1="125" x2="460" y2="137" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="448" y1="137" x2="460" y2="125" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><text x="40" y="169" font-size="12.5" fill="#23282d">no adapter</text><rect x="240" y="154" width="150" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="315.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><line x1="408" y1="159" x2="420" y2="171" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="408" y1="171" x2="420" y2="159" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><text x="40" y="204" font-size="13.5" fill="#23282d">Signature: Qubit much higher than qPCR; a clean trace that gives too few clusters.</text><text x="40" y="226" font-size="13.5" fill="#8a8f94">Control: quantify by qPCR, and compare with Qubit-derived molarity.</text>
</svg>
