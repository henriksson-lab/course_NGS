<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 278" width="760" height="278" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="278" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">From symptom to cause: the first thing to check.</text><rect x="40" y="54" width="200" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="140.0" y="70.025" font-size="11.5" text-anchor="middle" fill="#23282d">peak at 130 bp on the trace</text><line x1="246" y1="66" x2="268" y2="66" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 272 66 L 268 63.2 L 268 68.8 Z" fill="#8a8f94"/><rect x="278" y="54" width="170" height="24" rx="4" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="363.0" y="70.2" font-size="12" text-anchor="middle" fill="#b4532a">adapter dimers</text><line x1="454" y1="66" x2="476" y2="66" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 480 66 L 476 63.2 L 476 68.8 Z" fill="#8a8f94"/><text x="486" y="70" font-size="12" fill="#23282d">adapter-only control; clean up</text><rect x="40" y="86" width="200" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="140.0" y="102.025" font-size="11.5" text-anchor="middle" fill="#23282d">Qubit high, qPCR low</text><line x1="246" y1="98" x2="268" y2="98" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 272 98 L 268 95.2 L 268 100.8 Z" fill="#8a8f94"/><rect x="278" y="86" width="170" height="24" rx="4" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="363.0" y="102.2" font-size="12" text-anchor="middle" fill="#b4532a">one-sided or no-adapter DNA</text><line x1="454" y1="98" x2="476" y2="98" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 480 98 L 476 95.2 L 476 100.8 Z" fill="#8a8f94"/><text x="486" y="102" font-size="12" fill="#23282d">trace; re-quantify by qPCR</text><rect x="40" y="118" width="200" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="140.0" y="134.025" font-size="11.5" text-anchor="middle" fill="#23282d">reads with two mappings</text><line x1="246" y1="130" x2="268" y2="130" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 272 130 L 268 127.2 L 268 132.8 Z" fill="#8a8f94"/><rect x="278" y="118" width="170" height="24" rx="4" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="363.0" y="134.2" font-size="12" text-anchor="middle" fill="#b4532a">chimeras</text><line x1="454" y1="130" x2="476" y2="130" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 480 130 L 476 127.2 L 476 132.8 Z" fill="#8a8f94"/><text x="486" y="134" font-size="12" fill="#23282d">species-mix control; fewer cycles</text><rect x="40" y="150" width="200" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="140.0" y="166.025" font-size="11.5" text-anchor="middle" fill="#23282d">reads in the empty well</text><line x1="246" y1="162" x2="268" y2="162" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 272 162 L 268 159.2 L 268 164.8 Z" fill="#8a8f94"/><rect x="278" y="150" width="170" height="24" rx="4" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="363.0" y="166.2" font-size="12" text-anchor="middle" fill="#b4532a">index hopping</text><line x1="454" y1="162" x2="476" y2="162" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 480 162 L 476 159.2 L 476 164.8 Z" fill="#8a8f94"/><text x="486" y="166" font-size="12" fill="#23282d">unique dual indexes; free adapter</text><rect x="40" y="182" width="200" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="140.0" y="198.025" font-size="11.5" text-anchor="middle" fill="#23282d">first cycles all one base</text><line x1="246" y1="194" x2="268" y2="194" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 272 194 L 268 191.2 L 268 196.8 Z" fill="#8a8f94"/><rect x="278" y="182" width="170" height="24" rx="4" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="363.0" y="198.2" font-size="12" text-anchor="middle" fill="#b4532a">low complexity</text><line x1="454" y1="194" x2="476" y2="194" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 480 194 L 476 191.2 L 476 196.8 Z" fill="#8a8f94"/><text x="486" y="198" font-size="12" fill="#23282d">PhiX; stagger the primers</text><rect x="40" y="214" width="200" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="140.0" y="230.025" font-size="11.5" text-anchor="middle" fill="#23282d">duplicates high, GC bowed</text><line x1="246" y1="226" x2="268" y2="226" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 272 226 L 268 223.2 L 268 228.8 Z" fill="#8a8f94"/><rect x="278" y="214" width="170" height="24" rx="4" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="363.0" y="230.2" font-size="12" text-anchor="middle" fill="#b4532a">over-amplification</text><line x1="454" y1="226" x2="476" y2="226" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 480 226 L 476 223.2 L 476 228.8 Z" fill="#8a8f94"/><text x="486" y="230" font-size="12" fill="#23282d">titrate cycles; add UMIs</text><text x="40" y="258" font-size="13.5" fill="#8a8f94">One symptom can have two causes: use a second observation to separate them before changing the protocol.</text>
</svg>
