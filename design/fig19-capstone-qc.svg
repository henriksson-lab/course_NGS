size="10.5" text-anchor="middle" fill="#8a8f94">600</text><line x1="496.0" y1="206" x2="496.0" y2="211" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="496.0" y="225" font-size="10.5" text-anchor="middle" fill="#8a8f94">800</text><line x1="600.0" y1="206" x2="600.0" y2="211" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="600.0" y="225" font-size="10.5" text-anchor="middle" fill="#8a8f94">1000</text><text x="340.0" y="242" font-size="11.5" text-anchor="middle" fill="#8a8f94">library length, bp  (insert + 136 bp of adapter)</text><line x1="147.60000000000002" y1="96" x2="147.60000000000002" y2="206" stroke="#a33a28" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><text x="143.60000000000002" y="198" font-size="10.5" text-anchor="end" fill="#a33a28">130 bp</text><text x="176.72" y="68.21600000000001" font-size="10.5" text-anchor="middle" fill="#b4532a">sub-nucleosomal</text><text x="254.72" y="102.896" font-size="10.5" text-anchor="middle" fill="#b4532a">one nucleosome</text><text x="358.72" y="152.8352" font-size="10.5" text-anchor="middle" fill="#b4532a">two</text><text x="640" y="60.0" font-size="11.5" fill="#23282d">the nucleosome ladder is the check.</text><text x="640" y="76.5" font-size="11.5" fill="#23282d">No ladder, only short pieces: the</text><text x="640" y="93.0" font-size="11.5" fill="#23282d">nuclei were over-tagmented.</text><text x="640" y="126.0" font-size="11.5" fill="#23282d">mean length 400 bp, Qubit 1.5 ng/µL:</text><text x="640" y="142.5" font-size="11.5" fill="#b4532a">1.5 × 10⁶ / (660 × 400) = 5.7 nM</text><text x="640" y="159.0" font-size="11.5" fill="#8a8f94">an upper bound: it counts every duplex.</text><text x="640" y="192.0" font-size="11.5" fill="#23282d">qPCR counts P5 + P7 molecules only.</text><text x="640" y="208.5" font-size="11.5" fill="#23282d">Pool and load on that number, at the</text><text x="640" y="225.0" font-size="11.5" fill="#23282d">concentration in the instrument guide.</text><text x="640" y="241.5" font-size="11.5" fill="#8a8f94">PhiX: this library is diverse, so the</text><text x="640" y="258.0" font-size="11.5" fill="#8a8f94">guide's 1 % is enough.</text><text x="40" y="268" font-size="13" fill="#23282d">No ligation step here, so a 130 bp dimer peak cannot form: a peak there is stub or primer carry-over.</text><text x="40" y="290" font-size="13.5" fill="#b4532a">Write the decision rules before the run: no ladder, stop; Qubit far above qPCR, re-clean.</text>
</svg>
