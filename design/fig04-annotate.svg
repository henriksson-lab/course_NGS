<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 268" width="850" height="268" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="268" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Annotate: paste a sequence, see which known primer and adapter parts it contains (illustration).</text><text x="40" y="64" font-size="11" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AATGATACGGCGACCACCGAGATCTACAC</text><text x="231.4" y="64" font-size="11" fill="#6b5b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>TATAGCCT</text><text x="284.2" y="64" font-size="11" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ACACTCTTTCCCTACACGACGCTCTTCCGATCT</text><text x="502.0" y="64" font-size="11" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GGCATTACCGTA</text><text x="40" y="104" font-size="12.5" fill="#8a8f94">found</text><rect x="40" y="111" width="6" height="6" rx="1" fill="#1f3b57" stroke="#1f3b57" stroke-width="1.2"/><text x="60" y="124" font-size="12.5" fill="#23282d">1-29</text><text x="130" y="124" font-size="12.5" fill="#1f3b57">P5 flow-cell sequence</text><rect x="40" y="133" width="6" height="6" rx="1" fill="#6b5b8a" stroke="#6b5b8a" stroke-width="1.2"/><text x="60" y="146" font-size="12.5" fill="#23282d">30-37</text><text x="130" y="146" font-size="12.5" fill="#6b5b8a">no fixed match (an index)</text><rect x="40" y="155" width="6" height="6" rx="1" fill="#b4532a" stroke="#b4532a" stroke-width="1.2"/><text x="60" y="168" font-size="12.5" fill="#23282d">38-70</text><text x="130" y="168" font-size="12.5" fill="#b4532a">Read 1 sequencing primer site</text><rect x="40" y="177" width="6" height="6" rx="1" fill="#8a8f94" stroke="#8a8f94" stroke-width="1.2"/><text x="60" y="190" font-size="12.5" fill="#23282d">71-82</text><text x="130" y="190" font-size="12.5" fill="#8a8f94">insert: no match</text><text x="40" y="226" font-size="13.5" fill="#23282d">Matches are exact, on both strands, and list protocols that share the part. A shared part does not prove the protocol.</text><text x="40" y="248" font-size="13.5" fill="#8a8f94">Use it on an unknown read, a primer from a paper, or the start of a FASTQ file.</text>
</svg>
