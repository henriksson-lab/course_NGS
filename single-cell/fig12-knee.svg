f94">1e2</text><text x="72" y="122.0" font-size="11.5" text-anchor="end" fill="#8a8f94">1e3</text><text x="72" y="88.0" font-size="11.5" text-anchor="end" fill="#8a8f94">1e4</text><text x="72" y="54.0" font-size="11.5" text-anchor="end" fill="#8a8f94">1e5</text><text x="310.0" y="260" font-size="12" text-anchor="middle" fill="#8a8f94">barcodes ranked by UMI count</text><text x="24" y="58" font-size="12" fill="#8a8f94">UMIs</text><text x="150" y="70" font-size="13" fill="#b4532a" font-weight="bold">cells</text><text x="320" y="204" font-size="13" fill="#8a8f94">empty droplets: ambient RNA</text><text x="270" y="100" font-size="12" fill="#23282d">knee</text><text x="580" y="80" font-size="12.5" fill="#23282d">Ambient RNA is the same in every</text><text x="580" y="98" font-size="12.5" fill="#23282d">droplet, so it also leaks into real</text><text x="580" y="116" font-size="12.5" fill="#23282d">cells. Cells that burst early make</text><text x="580" y="134" font-size="12.5" fill="#23282d">it worse.</text>
