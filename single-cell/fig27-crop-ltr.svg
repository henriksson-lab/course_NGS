<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 245" width="756" height="245" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="245" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">CROP-seq: one cassette in the 3' LTR becomes two, so a Pol II transcript carries the guide.</text><rect x="60" y="50" width="130" height="28" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="125.0" y="68.2" font-size="12" text-anchor="middle" fill="#23282d">5' LTR: U6 + guide</text><rect x="190" y="50" width="100" height="28" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="240.0" y="68.2" font-size="12" text-anchor="middle" fill="#23282d">EF1a promoter</text><rect x="290" y="50" width="70" height="28" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="325.0" y="68.2" font-size="12" text-anchor="middle" fill="#23282d">PuroR</text><rect x="360" y="50" width="130" height="28" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="425.0" y="68.2" font-size="12" text-anchor="middle" fill="#23282d">3' LTR: U6 + guide</text><text x="60" y="96" font-size="12" fill="#8a8f94">after integration both LTRs carry the guide cassette</text><line x1="60" y1="124" x2="185" y2="124" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><path d="M 190 124 L 185 120.5 L 185 127.5 Z" fill="#b4532a"/><text x="200" y="128" font-size="12.5" fill="#b4532a">Pol III from the 5' U6: the working guide RNA, not polyadenylated</text><line x1="290" y1="156" x2="491" y2="156" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 496 156 L 491 152.5 L 491 159.5 Z" fill="#1f3b57"/><text x="60" y="180" font-size="12.5" fill="#1f3b57">Pol II from EF1a: puro mRNA that ends in the 3' LTR copy and is polyadenylated</text><text x="30" y="214.0" font-size="12.5" fill="#23282d">Only the second transcript is captured by oligo(dT). It contains the guide sequence, so the cell's perturbation is</text><text x="30" y="231.5" font-size="12.5" fill="#23282d">read from its own library.</text>
</svg>
