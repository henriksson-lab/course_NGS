<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 298" width="900" height="298" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="298" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Same chemistry, different compartments.</text><line x1="30" y1="40" x2="870" y2="40" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold"></text><text x="236" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">droplets (10x)</text><text x="516" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">split-pool (sci, SPLiT, SHARE)</text><line x1="30" y1="70" x2="870" y2="70" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="91.0" font-size="12.5" fill="#23282d">compartment</text><text x="236" y="91.0" font-size="12.5" fill="#23282d">droplet with a bead</text><text x="516" y="91.0" font-size="12.5" fill="#23282d">the cell itself, by path</text><line x1="30" y1="100" x2="870" y2="100" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="121.0" font-size="12.5" fill="#23282d">barcode comes from</text><text x="236" y="121.0" font-size="12.5" fill="#23282d">bead oligo</text><text x="516" y="121.0" font-size="12.5" fill="#23282d">RT, ligation or PCR primers</text><line x1="30" y1="130" x2="870" y2="130" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="151.0" font-size="12.5" fill="#23282d">input</text><text x="236" y="151.0" font-size="12.5" fill="#23282d">live or fixed cells, nuclei</text><text x="516" y="151.0" font-size="12.5" fill="#23282d">fixed cells or nuclei</text><line x1="30" y1="160" x2="870" y2="160" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="181.0" font-size="12.5" fill="#23282d">scale limit</text><text x="236" y="181.0" font-size="12.5" fill="#23282d">loading and cost per chip</text><text x="516" y="181.0" font-size="12.5" fill="#23282d">barcode collisions</text><line x1="30" y1="190" x2="870" y2="190" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="211.0" font-size="12.5" fill="#23282d">doublets</text><text x="236" y="211.0" font-size="12.5" fill="#23282d">Poisson loading</text><text x="516" y="211.0" font-size="12.5" fill="#23282d">barcode collisions</text><line x1="30" y1="220" x2="870" y2="220" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="241.0" font-size="12.5" fill="#23282d">instrument</text><text x="236" y="241.0" font-size="12.5" fill="#23282d">microfluidic controller</text><text x="516" y="241.0" font-size="12.5" fill="#23282d">pipettes and plates</text><line x1="30" y1="250" x2="870" y2="250" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="271.0" font-size="12.5" fill="#23282d">depth per cell</text><text x="236" y="271.0" font-size="12.5" fill="#23282d">usually higher</text><text x="516" y="271.0" font-size="12.5" fill="#23282d">usually lower</text><line x1="30" y1="280" x2="870" y2="280" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/>
</svg>
