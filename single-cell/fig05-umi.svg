<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 246" width="800" height="246" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="246" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">A UMI turns read counts back into molecule counts. Worked example for one gene in one cell.</text><text x="30" y="54" font-size="12" fill="#8a8f94">UMI</text><text x="110" y="54" font-size="12" fill="#8a8f94">reads</text><text x="30" y="80" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AACG</text><rect x="110" y="66" width="18" height="16" fill="#1f3b57"/><rect x="132" y="66" width="18" height="16" fill="#1f3b57"/><rect x="154" y="66" width="18" height="16" fill="#1f3b57"/><rect x="176" y="66" width="18" height="16" fill="#1f3b57"/><text x="30" y="106" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GTTC</text><rect x="110" y="92" width="18" height="16" fill="#1f3b57"/><rect x="132" y="92" width="18" height="16" fill="#1f3b57"/><rect x="154" y="92" width="18" height="16" fill="#1f3b57"/><text x="30" y="132" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>CCAT</text><rect x="110" y="118" width="18" height="16" fill="#1f3b57"/><text x="30" y="158" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AACC</text><rect x="110" y="144" width="18" height="16" fill="#a33a28"/><text x="330" y="82" font-size="13" fill="#23282d">naive count: 9 reads</text><text x="330" y="106" font-size="13" fill="#23282d">distinct UMIs: 4</text><text x="330" y="130" font-size="13" fill="#a33a28">AACC differs from AACG by one base and has one read:</text><text x="330" y="148" font-size="13" fill="#a33a28">a sequencing error, so merge it into AACG</text><text x="330" y="176" font-size="14" fill="#2e6b3f" font-weight="bold">molecules: 3</text><text x="30" y="210.0" font-size="13" fill="#23282d">A 10-base UMI has 4^10 = 1,048,576 values. For 1,000 molecules of one gene the expected number of collisions</text><text x="30" y="228.2" font-size="13" fill="#23282d">is about 1000^2 / (2 x 4^10) = 0.5, so UMIs are safe at this depth and saturate for very abundant genes.</text>
</svg>
