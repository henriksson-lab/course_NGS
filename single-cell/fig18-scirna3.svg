<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 236" width="860" height="236" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="236" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">sci-RNA-seq3: three barcodes, added by RT, by ligation, and by PCR.</text><rect x="30" y="38" width="142.0" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="101.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">fixed nuclei in wells</text><line x1="175.0" y1="52.0" x2="194.0" y2="52.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 199.0 52.0 L 194.0 48.5 L 194.0 55.5 Z" fill="#8a8f94"/><rect x="202.0" y="38" width="166.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="285.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">RT with indexed oligo(dT)</text><line x1="371.0" y1="52.0" x2="390.0" y2="52.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 395.0 52.0 L 390.0 48.5 L 390.0 55.5 Z" fill="#8a8f94"/><rect x="398.0" y="38" width="124.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="460.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">pool, redistribute</text><rect x="30" y="82" width="148.0" height="28" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="104.0" y="100.2" font-size="12" text-anchor="middle" fill="#23282d">ligate indexed hairpin</text><line x1="181.0" y1="96.0" x2="200.0" y2="96.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 205.0 96.0 L 200.0 92.5 L 200.0 99.5 Z" fill="#8a8f94"/><rect x="208.0" y="82" width="196.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="306.0" y="100.2" font-size="12" text-anchor="middle" fill="#23282d">pool, sort ~25 nuclei per well</text><line x1="407.0" y1="96.0" x2="426.0" y2="96.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 431.0 96.0 L 426.0 92.5 L 426.0 99.5 Z" fill="#8a8f94"/><rect x="434.0" y="82" width="214.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="541.0" y="100.2" font-size="12" text-anchor="middle" fill="#23282d">tagment, PCR with indexed primers</text><text x="30" y="142.0" font-size="12" fill="#8a8f94">library molecule</text><rect x="30" y="148" width="70" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="65.0" y="165.2" font-size="12" text-anchor="middle" fill="#23282d">P5 index</text><rect x="100" y="148" width="80" height="26" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="140.0" y="165.2" font-size="12" text-anchor="middle" fill="#23282d">ligation BC</text><rect x="180" y="148" width="70" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="215.0" y="165.2" font-size="12" text-anchor="middle" fill="#23282d">RT BC</text><rect x="250" y="148" width="50" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="275.0" y="165.2" font-size="12" text-anchor="middle" fill="#23282d">UMI</text><rect x="300" y="148" width="180" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="390.0" y="165.2" font-size="12" text-anchor="middle" fill="#23282d">cDNA</text><rect x="480" y="148" width="70" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="515.0" y="165.2" font-size="12" text-anchor="middle" fill="#23282d">P7 index</text><text x="30" y="204.0" font-size="13" fill="#23282d">Three levels of 384, 384 and 96 x 96 give more barcode combinations than nuclei, so most nuclei have a unique</text><text x="30" y="222.2" font-size="13" fill="#23282d">one.</text>
</svg>
