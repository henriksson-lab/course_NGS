<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 232" width="800" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="232" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">5' capture puts the cell barcode at the end that carries the variable region.</text><rect x="30" y="38" width="316.0" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="188.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">bead oligo: barcode + UMI + template-switch handle</text><line x1="349.0" y1="52.0" x2="368.0" y2="52.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 373.0 52.0 L 368.0 48.5 L 368.0 55.5 Z" fill="#8a8f94"/><rect x="376.0" y="38" width="214.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="483.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">RT, template switch at the 5' cap</text><text x="30" y="100.0" font-size="12" fill="#8a8f94">barcoded cDNA</text><rect x="30" y="106" width="90" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="75.0" y="123.2" font-size="12" text-anchor="middle" fill="#23282d">barcode + UMI</text><rect x="120" y="106" width="50" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="145.0" y="123.2" font-size="12" text-anchor="middle" fill="#23282d">5' UTR</text><rect x="170" y="106" width="140" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="240.0" y="123.2" font-size="12" text-anchor="middle" fill="#23282d">V</text><rect x="310" y="106" width="36" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="328.0" y="123.2" font-size="12" text-anchor="middle" fill="#23282d">CDR3</text><rect x="346" y="106" width="36" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="364.0" y="123.2" font-size="12" text-anchor="middle" fill="#23282d">J</text><rect x="382" y="106" width="160" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="462.0" y="123.2" font-size="12" text-anchor="middle" fill="#23282d">constant region</text><line x1="482" y1="150" x2="85" y2="150" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><path d="M 80 150 L 85 146.5 L 85 153.5 Z" fill="#2e6b3f"/><text x="472" y="168" font-size="12" text-anchor="end" fill="#2e6b3f">constant-region primers</text><text x="30" y="196.0" font-size="13" fill="#23282d">Nested primers in the constant region amplify only receptor cDNA. T cell and B cell receptors use different</text><text x="30" y="214.2" font-size="13" fill="#23282d">primers, and the same barcoded cDNA also gives a normal 5' gene-expression library.</text>
</svg>
