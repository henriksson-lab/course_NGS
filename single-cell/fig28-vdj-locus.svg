<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 798 228" width="798" height="228" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="228" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">A rearranged receptor mRNA: the variable part is far from both ends. Proportions are illustrative.</text><rect x="40" y="52" width="50" height="28" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="65.0" y="70.2" font-size="12" text-anchor="middle" fill="#23282d">5' UTR</text><rect x="90" y="52" width="190" height="28" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="185.0" y="70.2" font-size="12" text-anchor="middle" fill="#23282d">V</text><rect x="280" y="52" width="34" height="28" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="297.0" y="70.2" font-size="12" text-anchor="middle" fill="#23282d">CDR3</text><rect x="314" y="52" width="40" height="28" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="334.0" y="70.2" font-size="12" text-anchor="middle" fill="#23282d">J</text><rect x="354" y="52" width="280" height="28" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="494.0" y="70.2" font-size="12" text-anchor="middle" fill="#23282d">C</text><rect x="634" y="52" width="120" height="28" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="694.0" y="70.2" font-size="12" text-anchor="middle" fill="#23282d">3' UTR</text><text x="760" y="70" font-size="12" fill="#8a8f94">AAAA</text><line x1="756" y1="100" x2="639" y2="100" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><path d="M 634 100 L 639 96.5 L 639 103.5 Z" fill="#8a8f94"/><text x="694" y="120" font-size="12" text-anchor="middle" fill="#8a8f94">3' read (about 90 nt)</text><text x="694" y="138" font-size="12" text-anchor="middle" fill="#8a8f94">stops in the 3' UTR</text><line x1="42" y1="100" x2="125" y2="100" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><path d="M 130 100 L 125 96.5 L 125 103.5 Z" fill="#8a8f94"/><text x="86" y="120" font-size="12" text-anchor="middle" fill="#8a8f94">short 5' read</text><text x="86" y="138" font-size="12" text-anchor="middle" fill="#8a8f94">ends in V</text><text x="300" y="112" font-size="12.5" fill="#b4532a">CDR3 spans the V(D)J junction</text><text x="300" y="130" font-size="12.5" fill="#b4532a">and identifies the clone</text><text x="30" y="190.0" font-size="13.5" fill="#23282d">A standard 3' or 5' gene-expression library cannot reach the junction with a short read.</text><text x="30" y="210.0" font-size="13.5" fill="#23282d">The receptor needs its own library, built by amplifying from constant-region primers.</text>
</svg>
