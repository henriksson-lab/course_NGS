<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 232" width="800" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="232" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">10x 3' v3 as an example: the barcode and UMI sit at the start of read 1.</text><text x="30" y="52" font-size="12" fill="#8a8f94">bead oligo</text><rect x="30" y="58" width="40" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="50.0" y="75.2" font-size="12" text-anchor="middle" fill="#23282d">P5</text><rect x="70" y="58" width="70" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="105.0" y="75.2" font-size="12" text-anchor="middle" fill="#23282d">Read 1</text><rect x="140" y="58" width="130" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="205.0" y="75.2" font-size="12" text-anchor="middle" fill="#23282d">16 nt cell barcode</text><rect x="270" y="58" width="90" height="26" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="315.0" y="75.2" font-size="12" text-anchor="middle" fill="#23282d">12 nt UMI</text><rect x="360" y="58" width="90" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="405.0" y="75.2" font-size="12" text-anchor="middle" fill="#23282d">poly(dT)VN</text><text x="30" y="124.0" font-size="12" fill="#8a8f94">library molecule</text><rect x="30" y="130" width="40" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="50.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">P5</text><rect x="70" y="130" width="70" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="105.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">Read 1</text><rect x="140" y="130" width="80" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="180.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">barcode</text><rect x="220" y="130" width="56" height="26" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="248.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">UMI</text><rect x="276" y="130" width="200" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="376.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">cDNA insert (3' end of mRNA)</text><rect x="476" y="130" width="70" height="26" rx="2" fill="#e8eef5" stroke="#4a6b8a" stroke-width="1.2"/><text x="511.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">Read 2</text><rect x="546" y="130" width="40" height="26" rx="2" fill="#e8eef5" stroke="#4a6b8a" stroke-width="1.2"/><text x="566.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">i7</text><rect x="586" y="130" width="40" height="26" rx="2" fill="#e8eef5" stroke="#4a6b8a" stroke-width="1.2"/><text x="606.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">P7</text><line x1="140" y1="176" x2="271" y2="176" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><path d="M 276 176 L 271 172.5 L 271 179.5 Z" fill="#b4532a"/><text x="140" y="196" font-size="12" fill="#b4532a">Read 1: 28 cycles = barcode + UMI</text><line x1="546" y1="176" x2="291" y2="176" stroke="#1f3b57" stroke-width="2.2" stroke-linecap="round"/><path d="M 286 176 L 291 172.5 L 291 179.5 Z" fill="#1f3b57"/><text x="300" y="214" font-size="12" fill="#1f3b57">Read 2: about 90 cycles into the insert</text><text x="560" y="176" font-size="12" fill="#8a8f94">i7: 8 cycles, sample index</text>
</svg>
