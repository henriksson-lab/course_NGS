<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 246" width="780" height="246" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="246" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Making barcoded beads: split the beads four ways, add one base, pool, repeat.</text><text x="112" y="50" font-size="12" text-anchor="middle" fill="#8a8f94">round 1</text><rect x="90" y="60" width="44" height="26" rx="3" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="112.0" y="77.55" font-size="13" text-anchor="middle" fill="#23282d">A</text><rect x="90" y="94" width="44" height="26" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="112.0" y="111.55" font-size="13" text-anchor="middle" fill="#23282d">C</text><rect x="90" y="128" width="44" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="112.0" y="145.55" font-size="13" text-anchor="middle" fill="#23282d">G</text><rect x="90" y="162" width="44" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="112.0" y="179.55" font-size="13" text-anchor="middle" fill="#23282d">T</text><text x="272" y="50" font-size="12" text-anchor="middle" fill="#8a8f94">round 2</text><rect x="250" y="60" width="44" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="272.0" y="77.55" font-size="13" text-anchor="middle" fill="#23282d">A</text><rect x="250" y="94" width="44" height="26" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="272.0" y="111.55" font-size="13" text-anchor="middle" fill="#23282d">C</text><rect x="250" y="128" width="44" height="26" rx="3" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="272.0" y="145.55" font-size="13" text-anchor="middle" fill="#23282d">G</text><rect x="250" y="162" width="44" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="272.0" y="179.55" font-size="13" text-anchor="middle" fill="#23282d">T</text><text x="432" y="50" font-size="12" text-anchor="middle" fill="#8a8f94">round 3</text><rect x="410" y="60" width="44" height="26" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="432.0" y="77.55" font-size="13" text-anchor="middle" fill="#23282d">A</text><rect x="410" y="94" width="44" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="432.0" y="111.55" font-size="13" text-anchor="middle" fill="#23282d">C</text><rect x="410" y="128" width="44" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="432.0" y="145.55" font-size="13" text-anchor="middle" fill="#23282d">G</text><rect x="410" y="162" width="44" height="26" rx="3" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="432.0" y="179.55" font-size="13" text-anchor="middle" fill="#23282d">T</text><text x="192" y="44" font-size="11.5" text-anchor="middle" fill="#8a8f94">pool, re-split</text><text x="352" y="44" font-size="11.5" text-anchor="middle" fill="#8a8f94">pool, re-split</text><line x1="134" y1="73" x2="250" y2="141" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="294" y1="141" x2="410" y2="175" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="134" y1="107" x2="250" y2="107" stroke="#1f3b57" stroke-width="2.2" stroke-linecap="round"/><line x1="294" y1="107" x2="410" y2="73" stroke="#1f3b57" stroke-width="2.2" stroke-linecap="round"/><text x="500" y="80" font-size="12.5" fill="#b4532a">bead 1 saw A, G, T</text><text x="500" y="98" font-size="12.5" fill="#b4532a">barcode AGT on every oligo</text><text x="500" y="130" font-size="12.5" fill="#1f3b57">bead 2 saw C, C, A</text><text x="500" y="148" font-size="12.5" fill="#1f3b57">barcode CCA</text><text x="30" y="214.0" font-size="13.5" fill="#23282d">Three rounds give 4^3 = 64 barcodes. Twelve rounds give 4^12 = 16.8 million, enough that two beads rarely</text><text x="30" y="232.9" font-size="13.5" fill="#23282d">share one.</text>
</svg>
