<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 280" width="780" height="280" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="280" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Cell hashing: label each sample with an antibody carrying a sample tag, then pool the samples.</text><text x="110" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">tag A</text><text x="156" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">tag B</text><text x="202" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">tag C</text><text x="248" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">tag D</text><text x="30" y="67" font-size="11.5" fill="#8a8f94">cell 1</text><rect x="90" y="54" width="40" height="15" fill="#b4532a"/><rect x="136" y="54" width="40" height="15" fill="#eef0f2"/><rect x="182" y="54" width="40" height="15" fill="#eef0f2"/><rect x="228" y="54" width="40" height="15" fill="#eef0f2"/><text x="282" y="67" font-size="12" fill="#2e6b3f">singlet</text><text x="30" y="85" font-size="11.5" fill="#8a8f94">cell 2</text><rect x="90" y="72" width="40" height="15" fill="#eef0f2"/><rect x="136" y="72" width="40" height="15" fill="#b4532a"/><rect x="182" y="72" width="40" height="15" fill="#eef0f2"/><rect x="228" y="72" width="40" height="15" fill="#eef0f2"/><text x="282" y="85" font-size="12" fill="#2e6b3f">singlet</text><text x="30" y="103.0" font-size="11.5" fill="#8a8f94">cell 3</text><rect x="90" y="90" width="40" height="15" fill="#eef0f2"/><rect x="136" y="90" width="40" height="15" fill="#eef0f2"/><rect x="182" y="90" width="40" height="15" fill="#b4532a"/><rect x="228" y="90" width="40" height="15" fill="#eef0f2"/><text x="282" y="103" font-size="12" fill="#2e6b3f">singlet</text><text x="30" y="121.0" font-size="11.5" fill="#8a8f94">cell 4</text><rect x="90" y="108" width="40" height="15" fill="#eef0f2"/><rect x="136" y="108" width="40" height="15" fill="#eef0f2"/><rect x="182" y="108" width="40" height="15" fill="#eef0f2"/><rect x="228" y="108" width="40" height="15" fill="#b4532a"/><text x="282" y="121" font-size="12" fill="#2e6b3f">singlet</text><text x="30" y="139.0" font-size="11.5" fill="#8a8f94">cell 5</text><rect x="90" y="126" width="40" height="15" fill="#eef0f2"/><rect x="136" y="126" width="40" height="15" fill="#b4532a"/><rect x="182" y="126" width="40" height="15" fill="#eef0f2"/><rect x="228" y="126" width="40" height="15" fill="#eef0f2"/><text x="282" y="139" font-size="12" fill="#2e6b3f">singlet</text><text x="30" y="157.0" font-size="11.5" fill="#8a8f94">cell 6</text><rect x="90" y="144" width="40" height="15" fill="#b4532a"/><rect x="136" y="144" width="40" height="15" fill="#eef0f2"/><rect x="182" y="144" width="40" height="15" fill="#eef0f2"/><rect x="228" y="144" width="40" height="15" fill="#eef0f2"/><text x="282" y="157" font-size="12" fill="#2e6b3f">singlet</text><text x="30" y="175.0" font-size="11.5" fill="#8a8f94">cell 7</text><rect x="90" y="162" width="40" height="15" fill="#b4532a"/><rect x="136" y="162" width="40" height="15" fill="#eef0f2"/><rect x="182" y="162" width="40" height="15" fill="#b4532a"/><rect x="228" y="162" width="40" height="15" fill="#eef0f2"/><text x="282" y="175" font-size="12" fill="#a33a28">doublet</text><text x="30" y="193.0" font-size="11.5" fill="#8a8f94">cell 8</text><rect x="90" y="180" width="40" height="15" fill="#eef0f2"/><rect x="136" y="180" width="40" height="15" fill="#b4532a"/><rect x="182" y="180" width="40" height="15" fill="#eef0f2"/><rect x="228" y="180" width="40" height="15" fill="#b4532a"/><text x="282" y="193" font-size="12" fill="#a33a28">doublet</text><text x="30" y="211.0" font-size="11.5" fill="#8a8f94">cell 9</text><rect x="90" y="198" width="40" height="15" fill="#eef0f2"/><rect x="136" y="198" width="40" height="15" fill="#eef0f2"/><rect x="182" y="198" width="40" height="15" fill="#b4532a"/><rect x="228" y="198" width="40" height="15" fill="#eef0f2"/><text x="282" y="211" font-size="12" fill="#2e6b3f">singlet</text><text x="30" y="229.0" font-size="11.5" fill="#8a8f94">cell 10</text><rect x="90" y="216" width="40" height="15" fill="#eef0f2"/><rect x="136" y="216" width="40" height="15" fill="#eef0f2"/><rect x="182" y="216" width="40" height="15" fill="#eef0f2"/><rect x="228" y="216" width="40" height="15" fill="#eef0f2"/><text x="282" y="229" font-size="12" fill="#a33a28">negative</text><text x="420" y="70" font-size="12.5" fill="#23282d">Two tags on one cell mean two samples</text><text x="420" y="88" font-size="12.5" fill="#23282d">were captured together: a doublet that</text><text x="420" y="106" font-size="12.5" fill="#23282d">can be identified and removed.</text><text x="420" y="138" font-size="12.5" fill="#23282d">Same-sample doublets stay hidden:</text><text x="420" y="156" font-size="12.5" fill="#23282d">with 4 samples that is about 1 in 4</text><text x="420" y="174" font-size="12.5" fill="#23282d">of all doublets.</text><text x="30" y="262.0" font-size="13.5" fill="#23282d">Hashing lets you load more cells per lane and remove the extra doublets afterwards.</text>
</svg>
