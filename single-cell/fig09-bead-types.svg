<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 206" width="800" height="206" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="206" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">The bead decides how well droplets are used and when the barcode is released.</text><rect x="30" y="38" width="180" height="150" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="40" y="60" font-size="13.5" fill="#1f3b57" font-weight="bold">Drop-seq</text><text x="40" y="82" font-size="11.5" fill="#23282d">rigid bead</text><text x="40" y="100.0" font-size="11.5" fill="#23282d">bead loading is random,</text><text x="40" y="118.0" font-size="11.5" fill="#23282d">so most droplets lack one</text><text x="40" y="136.0" font-size="11.5" fill="#23282d">mRNA sticks to the bead;</text><text x="40" y="154.0" font-size="11.5" fill="#23282d">RT after breaking droplets</text><rect x="220" y="38" width="180" height="150" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="230" y="60" font-size="13.5" fill="#b4532a" font-weight="bold">inDrop</text><text x="230" y="82" font-size="11.5" fill="#23282d">hydrogel bead</text><text x="230" y="100" font-size="11.5" fill="#23282d">beads close-pack, so almost</text><text x="230" y="118" font-size="11.5" fill="#23282d">every droplet gets one</text><text x="230" y="136" font-size="11.5" fill="#23282d">oligo freed by UV light;</text><text x="230" y="154" font-size="11.5" fill="#23282d">RT inside the droplet</text><rect x="410" y="38" width="180" height="150" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="420" y="60" font-size="13.5" fill="#2e6b3f" font-weight="bold">10x Chromium</text><text x="420" y="82" font-size="11.5" fill="#23282d">gel bead, dissolves</text><text x="420" y="100" font-size="11.5" fill="#23282d">ordered flow gives most</text><text x="420" y="118" font-size="11.5" fill="#23282d">droplets (GEMs) a bead</text><text x="420" y="136" font-size="11.5" fill="#23282d">oligo released by reducing</text><text x="420" y="154" font-size="11.5" fill="#23282d">agent; RT inside the GEM</text><rect x="600" y="38" width="180" height="150" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="610" y="60" font-size="13.5" fill="#a33a28" font-weight="bold">HyDrop</text><text x="610" y="82" font-size="11.5" fill="#23282d">dissolvable hydrogel bead</text><text x="610" y="100" font-size="11.5" fill="#23282d">made in the lab by</text><text x="610" y="118" font-size="11.5" fill="#23282d">split-pool barcoding</text><text x="610" y="136" font-size="11.5" fill="#23282d">RNA or ATAC from the</text><text x="610" y="154" font-size="11.5" fill="#23282d">same type of bead</text>
</svg>
