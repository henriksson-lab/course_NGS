ight="9" fill="#1f3b57"/><rect x="452" y="74" width="32" height="5" fill="#c9cdd1"/><rect x="442" y="88" width="10" height="9" fill="#b4532a"/><rect x="452" y="90" width="32" height="5" fill="#c9cdd1"/><rect x="442" y="104" width="10" height="9" fill="#2e6b3f"/><rect x="452" y="106" width="32" height="5" fill="#c9cdd1"/><rect x="442" y="120" width="10" height="9" fill="#b4532a"/><rect x="452" y="122" width="32" height="5" fill="#c9cdd1"/><rect x="442" y="136" width="10" height="9" fill="#1f3b57"/><rect x="452" y="138" width="32" height="5" fill="#c9cdd1"/><rect x="498" y="72" width="10" height="9" fill="#2e6b3f"/><rect x="508" y="74" width="32" height="5" fill="#c9cdd1"/><rect x="498" y="88" width="10" height="9" fill="#2e6b3f"/><rect x="508" y="90" width="32" height="5" fill="#c9cdd1"/><rect x="498" y="104" width="10" height="9" fill="#1f3b57"/><rect x="508" y="106" width="32" height="5" fill="#c9cdd1"/><rect x="498" y="120" width="10" height="9" fill="#b4532a"/><rect x="508" y="122" width="32" height="5" fill="#c9cdd1"/><text x="490" y="170" font-size="12" text-anchor="middle" fill="#8a8f94">one pooled library</text><line x1="560" y1="100" x2="615" y2="100" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 620 100 L 615 96.5 L 615 103.5 Z" fill="#8a8f94"/><text x="590" y="84" font-size="11.5" text-anchor="middle" fill="#8a8f94">sequence</text><rect x="632" y="64" width="10" height="9" fill="#1f3b57"/><rect x="642" y="66" width="40" height="5" fill="#c9cdd1"/><rect x="642" y="76" width="30" height="5" fill="#c9cdd1"/><text x="700" y="78" font-size="12" fill="#1f3b57">cell 1</text><rect x="632" y="96" width="10" height="9" fill="#b4532a"/><rect x="642" y="98" width="40" height="5" fill="#c9cdd1"/><rect x="642" y="108" width="30" height="5" fill="#c9cdd1"/><text x="700" y="110" font-size="12" fill="#b4532a">cell 2</text><rect x="632" y="128" width="10" height="9" fill="#2e6b3f"/><rect x="642" y="130" width="40" height="5" fill="#c9cdd1"/><rect x="642" y="140" width="30" height="5" fill="#c9cdd1"/><text x="700" y="142" font-size="12" fill="#2e6b3f">cell 3</text><text x="30" y="204.0" font-size="13.5" fill="#23282d">Without the barcode the pooled reads are one bulk sample. With it, every read goes back to its cell.</text>
