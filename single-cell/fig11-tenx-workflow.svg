<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 222" width="900" height="222" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="222" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Everything before the emulsion breaks is inside a droplet. After that, one bulk pool.</text><rect x="30" y="40" width="202.0" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="131.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">cell + gel bead + RT mix in oil</text><line x1="235.0" y1="54.0" x2="254.0" y2="54.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 259.0 54.0 L 254.0 50.5 L 254.0 57.5 Z" fill="#8a8f94"/><rect x="262.0" y="40" width="208.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="366.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">RT in the droplet: barcoded cDNA</text><line x1="473.0" y1="54.0" x2="492.0" y2="54.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 497.0 54.0 L 492.0 50.5 L 492.0 57.5 Z" fill="#8a8f94"/><rect x="500.0" y="40" width="136.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="568.0" y="58.2" font-size="12" text-anchor="middle" fill="#23282d">break emulsion, pool</text><line x1="30" y1="84" x2="800" y2="84" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="806" y="88" font-size="11.5" fill="#8a8f94">bulk from here</text><rect x="30" y="98" width="190.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="125.0" y="116.2" font-size="12" text-anchor="middle" fill="#23282d">PCR: amplify full-length cDNA</text><line x1="223.0" y1="112.0" x2="242.0" y2="112.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 247.0 112.0 L 242.0 108.5 L 242.0 115.5 Z" fill="#8a8f94"/><rect x="250.0" y="98" width="184.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="342.0" y="116.2" font-size="12" text-anchor="middle" fill="#23282d">fragment, end repair, A-tail</text><line x1="437.0" y1="112.0" x2="456.0" y2="112.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 461.0 112.0 L 456.0 108.5 L 456.0 115.5 Z" fill="#8a8f94"/><rect x="464.0" y="98" width="142.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="535.0" y="116.2" font-size="12" text-anchor="middle" fill="#23282d">ligate Read 2 adapter</text><rect x="30" y="146" width="160.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="110.0" y="164.2" font-size="12" text-anchor="middle" fill="#23282d">index PCR (sample index)</text><line x1="193.0" y1="160.0" x2="212.0" y2="160.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 217.0 160.0 L 212.0 156.5 L 212.0 163.5 Z" fill="#8a8f94"/><rect x="220.0" y="146" width="64.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="252.0" y="164.2" font-size="12" text-anchor="middle" fill="#23282d">sequence</text><text x="30" y="204.0" font-size="13.5" fill="#23282d">The barcode must be on the cDNA before the droplets are pooled: afterwards nothing can tell the cells apart.</text>
</svg>
