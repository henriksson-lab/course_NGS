<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 246" width="820" height="246" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="246" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Split-pool barcoding: a cell's barcode is the path it took through the wells.</text><text x="172" y="52" font-size="12" text-anchor="middle" fill="#8a8f94">round 1</text><rect x="150" y="62" width="44" height="30" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="172.0" y="81.55" font-size="13" text-anchor="middle" fill="#23282d">1</text><rect x="150" y="106" width="44" height="30" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="172.0" y="125.55" font-size="13" text-anchor="middle" fill="#23282d">2</text><rect x="150" y="150" width="44" height="30" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="172.0" y="169.55" font-size="13" text-anchor="middle" fill="#23282d">3</text><text x="262" y="52" font-size="11.5" text-anchor="middle" fill="#8a8f94">pool, re-split</text><text x="352" y="52" font-size="12" text-anchor="middle" fill="#8a8f94">round 2</text><rect x="330" y="62" width="44" height="30" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="352.0" y="81.55" font-size="13" text-anchor="middle" fill="#23282d">1</text><rect x="330" y="106" width="44" height="30" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="352.0" y="125.55" font-size="13" text-anchor="middle" fill="#23282d">2</text><rect x="330" y="150" width="44" height="30" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="352.0" y="169.55" font-size="13" text-anchor="middle" fill="#23282d">3</text><text x="442" y="52" font-size="11.5" text-anchor="middle" fill="#8a8f94">pool, re-split</text><text x="532" y="52" font-size="12" text-anchor="middle" fill="#8a8f94">round 3</text><rect x="510" y="62" width="44" height="30" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="532.0" y="81.55" font-size="13" text-anchor="middle" fill="#23282d">1</text><rect x="510" y="106" width="44" height="30" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="532.0" y="125.55" font-size="13" text-anchor="middle" fill="#23282d">2</text><rect x="510" y="150" width="44" height="30" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="532.0" y="169.55" font-size="13" text-anchor="middle" fill="#23282d">3</text><line x1="194" y1="71.0" x2="330" y2="115.0" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="374" y1="115.0" x2="510" y2="159.0" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><text x="600" y="80" font-size="12.5" fill="#b4532a">cell a: barcode 1-2-3</text><line x1="194" y1="75.0" x2="330" y2="163.0" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><line x1="374" y1="163.0" x2="510" y2="163.0" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="600" y="104" font-size="12.5" fill="#1f3b57">cell b: barcode 1-3-3</text><line x1="194" y1="123.0" x2="330" y2="123.0" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><line x1="374" y1="123.0" x2="510" y2="79.0" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><text x="600" y="128" font-size="12.5" fill="#2e6b3f">cell c: barcode 2-2-1</text><line x1="194" y1="171.0" x2="330" y2="83.0" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><line x1="374" y1="83.0" x2="510" y2="127.0" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><text x="600" y="152" font-size="12.5" fill="#a33a28">cell d: barcode 3-1-2</text><text x="30" y="214.0" font-size="13.5" fill="#23282d">3 rounds of 3 wells give 27 barcodes. With 96 wells per round: 96^3 = 884,736, and no cell was ever</text><text x="30" y="232.9" font-size="13.5" fill="#23282d">isolated.</text>
