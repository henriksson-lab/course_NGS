<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 222" width="860" height="222" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="222" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">SHARE-seq: the same three-round barcode chain is built on both the chromatin and the RNA molecules.</text><text x="30" y="56" font-size="13" fill="#2e6b3f" font-weight="bold">chromatin</text><rect x="30" y="62" width="130" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="95.0" y="79.2" font-size="12" text-anchor="middle" fill="#23282d">genomic fragment</text><rect x="160" y="62" width="80" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="200.0" y="79.2" font-size="12" text-anchor="middle" fill="#23282d">Tn5 adapter</text><rect x="240" y="62" width="74" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="277.0" y="79.2" font-size="12" text-anchor="middle" fill="#23282d">shared arm</text><rect x="314" y="62" width="46" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="337.0" y="79.2" font-size="12" text-anchor="middle" fill="#23282d">BC1</text><rect x="360" y="62" width="46" height="26" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="383.0" y="79.2" font-size="12" text-anchor="middle" fill="#23282d">BC2</text><rect x="406" y="62" width="46" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="429.0" y="79.2" font-size="12" text-anchor="middle" fill="#23282d">BC3</text><text x="30" y="124.0" font-size="13" fill="#b4532a" font-weight="bold">RNA</text><rect x="30" y="130" width="70" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="65.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">cDNA</text><rect x="100" y="130" width="44" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="122.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">UMI</text><rect x="144" y="130" width="100" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="194.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">poly(dT) primer</text><rect x="244" y="130" width="74" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="281.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">shared arm</text><rect x="318" y="130" width="46" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="341.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">BC1</text><rect x="364" y="130" width="46" height="26" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="387.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">BC2</text><rect x="410" y="130" width="46" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="433.0" y="147.2" font-size="12" text-anchor="middle" fill="#23282d">BC3</text><text x="30" y="190.0" font-size="13" fill="#23282d">Both libraries are then separated, but BC1-BC2-BC3 appears on both, so each barcode triplet is one cell in two</text><text x="30" y="208.2" font-size="13" fill="#23282d">assays.</text>
</svg>
