<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 232" width="860" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="232" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">sci-ATAC-seq: Tn5 is the first barcoding step. Its adapters carry an index.</text><rect x="30" y="38" width="106.0" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="83.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">nuclei in wells</text><line x1="139.0" y1="52.0" x2="158.0" y2="52.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 163.0 52.0 L 158.0 48.5 L 158.0 55.5 Z" fill="#8a8f94"/><rect x="166.0" y="38" width="208.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="270.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">Tn5 loaded with index 1 tagments</text><line x1="377.0" y1="52.0" x2="396.0" y2="52.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 401.0 52.0 L 396.0 48.5 L 396.0 55.5 Z" fill="#8a8f94"/><rect x="404.0" y="38" width="196.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="502.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">pool, sort ~20 nuclei per well</text><rect x="30" y="82" width="196.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="128.0" y="100.2" font-size="12" text-anchor="middle" fill="#23282d">lyse, PCR with index 2 primers</text><line x1="229.0" y1="96.0" x2="248.0" y2="96.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 253.0 96.0 L 248.0 92.5 L 248.0 99.5 Z" fill="#8a8f94"/><rect x="256.0" y="82" width="64.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="288.0" y="100.2" font-size="12" text-anchor="middle" fill="#23282d">sequence</text><text x="30" y="138.0" font-size="12" fill="#8a8f94">library molecule</text><rect x="30" y="144" width="36" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="48.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">P5</text><rect x="66" y="144" width="66" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="99.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">PCR index</text><rect x="132" y="144" width="70" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="167.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">Tn5 index</text><rect x="202" y="144" width="150" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="277.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">accessible DNA</text><rect x="352" y="144" width="70" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="387.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">Tn5 index</text><rect x="422" y="144" width="66" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="455.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">PCR index</text><rect x="488" y="144" width="36" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="506.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">P7</text><text x="30" y="200.0" font-size="13" fill="#23282d">Open chromatin is tagmented in place, so only accessible DNA gets adapters. Two indexes give n x m cells; a</text><text x="30" y="218.2" font-size="13" fill="#23282d">third level (sci-ATAC-seq3) reaches hundreds of thousands.</text>
</svg>
