<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 238" width="864" height="238" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="238" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">10x Multiome: tagment nuclei in bulk, then give both products the same bead barcode in a droplet.</text><circle cx="120" cy="120" r="84" fill="none" stroke="#8a8f94" stroke-width="2"/><circle cx="90" cy="120" r="28" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.6"/><text x="90" y="124" font-size="11.5" text-anchor="middle" fill="#1f3b57">nucleus</text><circle cx="152" cy="120" r="14" fill="#23282d"/><line x1="166.0" y1="120.0" x2="180.0" y2="120.0" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="159.0" y1="132.12435565298213" x2="166.0" y2="144.2487113059643" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><line x1="145.0" y1="132.12435565298213" x2="138.0" y2="144.2487113059643" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="138.0" y1="120.0" x2="124.0" y2="120.0" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><line x1="145.0" y1="107.87564434701787" x2="138.0" y2="95.75128869403572" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="159.0" y1="107.87564434701785" x2="166.0" y2="95.75128869403572" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><text x="120" y="222" font-size="11.5" text-anchor="middle" fill="#23282d">bead with two oligo types</text><text x="250" y="56" font-size="13" fill="#b4532a" font-weight="bold">RNA</text><rect x="250" y="64" width="70" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="285.0" y="81.2" font-size="12" text-anchor="middle" fill="#23282d">barcode</text><rect x="320" y="64" width="44" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="342.0" y="81.2" font-size="12" text-anchor="middle" fill="#23282d">UMI</text><rect x="364" y="64" width="130" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="429.0" y="81.2" font-size="12" text-anchor="middle" fill="#23282d">poly(dT) + cDNA</text><rect x="494" y="64" width="40" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="514.0" y="81.2" font-size="12" text-anchor="middle" fill="#23282d">TSO</text><text x="250" y="126" font-size="13" fill="#2e6b3f" font-weight="bold">chromatin</text><rect x="250" y="134" width="70" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="285.0" y="151.2" font-size="12" text-anchor="middle" fill="#23282d">barcode</text><rect x="320" y="134" width="54" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="347.0" y="151.2" font-size="12" text-anchor="middle" fill="#23282d">spacer</text><rect x="374" y="134" width="170" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="459.0" y="151.2" font-size="12" text-anchor="middle" fill="#23282d">tagmented DNA fragment</text><text x="250" y="196" font-size="12.5" fill="#23282d">One incubation in the droplet, one pre-amplification, then the pool is split into two libraries.</text><text x="250" y="214" font-size="12.5" fill="#23282d">The two libraries carry linked, but not identical, barcode sequences.</text>
</svg>
