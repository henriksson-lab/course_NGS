<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 232" width="860" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="232" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">SPLiT-seq: barcodes are ligated onto the RT primer, while the cells stay intact.</text><rect x="30" y="38" width="172.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="116.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">round 1: RT, 48 wells, BC1</text><line x1="205.0" y1="52.0" x2="224.0" y2="52.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 229.0 52.0 L 224.0 48.5 L 224.0 55.5 Z" fill="#8a8f94"/><rect x="232.0" y="38" width="154.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="309.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">pool, split to 96 wells</text><line x1="389.0" y1="52.0" x2="408.0" y2="52.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 413.0 52.0 L 408.0 48.5 L 408.0 55.5 Z" fill="#8a8f94"/><rect x="416.0" y="38" width="130.0" height="28" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="481.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">round 2: ligate BC2</text><rect x="30" y="82" width="154.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="107.0" y="100.2" font-size="12" text-anchor="middle" fill="#23282d">pool, split to 96 wells</text><line x1="187.0" y1="96.0" x2="206.0" y2="96.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 211.0 96.0 L 206.0 92.5 L 206.0 99.5 Z" fill="#8a8f94"/><rect x="214.0" y="82" width="166.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="297.0" y="100.2" font-size="12" text-anchor="middle" fill="#23282d">round 3: ligate BC3 + UMI</text><line x1="383.0" y1="96.0" x2="402.0" y2="96.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 407.0 96.0 L 402.0 92.5 L 402.0 99.5 Z" fill="#8a8f94"/><rect x="410.0" y="82" width="190.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="505.0" y="100.2" font-size="12" text-anchor="middle" fill="#23282d">pool, lyse, streptavidin, PCR</text><text x="30" y="138.0" font-size="12" fill="#8a8f94">library molecule</text><rect x="30" y="144" width="120" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="90.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">cDNA</text><rect x="150" y="144" width="54" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="177.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">BC1</text><rect x="204" y="144" width="40" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="224.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">link</text><rect x="244" y="144" width="54" height="26" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="271.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">BC2</text><rect x="298" y="144" width="40" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="318.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">link</text><rect x="338" y="144" width="54" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="365.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">BC3</text><rect x="392" y="144" width="50" height="26" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="417.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">UMI</text><rect x="442" y="144" width="60" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="472.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">handle</text><text x="30" y="200.0" font-size="13" fill="#23282d">48 x 96 x 96 = 442,368 barcode paths, multiplied by a sublibrary index added at the end. Linkers anneal each new</text><text x="30" y="218.2" font-size="13" fill="#23282d">barcode onto the last; blocking oligos stop free adapters carrying over.</text>
</svg>
