<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 212" width="800" height="212" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="212" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">CITE-seq: an antibody carries an oligo that looks like an mRNA to the capture chemistry.</text><path d="M 30 150 A 80 80 0 0 1 190 150" fill="none" stroke="#8a8f94" stroke-width="2"/><line x1="70" y1="94" x2="70" y2="74" stroke="#23282d" stroke-width="2.2" stroke-linecap="round"/><line x1="70" y1="74" x2="63" y2="62" stroke="#23282d" stroke-width="2.2" stroke-linecap="round"/><line x1="70" y1="74" x2="77" y2="62" stroke="#23282d" stroke-width="2.2" stroke-linecap="round"/><line x1="70" y1="94" x2="70" y2="112" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><text x="70" y="56" font-size="12" text-anchor="middle" fill="#b4532a">CD4</text><line x1="150" y1="94" x2="150" y2="74" stroke="#23282d" stroke-width="2.2" stroke-linecap="round"/><line x1="150" y1="74" x2="143" y2="62" stroke="#23282d" stroke-width="2.2" stroke-linecap="round"/><line x1="150" y1="74" x2="157" y2="62" stroke="#23282d" stroke-width="2.2" stroke-linecap="round"/><line x1="150" y1="94" x2="150" y2="112" stroke="#1f3b57" stroke-width="2.2" stroke-linecap="round"/><text x="150" y="56" font-size="12" text-anchor="middle" fill="#1f3b57">CD8</text><text x="110" y="178" font-size="11.5" text-anchor="middle" fill="#8a8f94">cell surface</text><text x="240" y="50" font-size="12.5" fill="#23282d" font-weight="bold">antibody oligo</text><rect x="240" y="58" width="60" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="270.0" y="75.2" font-size="12" text-anchor="middle" fill="#23282d">handle</text><rect x="300" y="58" width="120" height="26" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="360.0" y="75.2" font-size="12" text-anchor="middle" fill="#23282d">antibody barcode</text><rect x="420" y="58" width="70" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="455.0" y="75.2" font-size="12" text-anchor="middle" fill="#23282d">poly(A)</text><text x="240" y="112" font-size="12.5" fill="#23282d" font-weight="bold">bead oligo</text><rect x="240" y="120" width="60" height="26" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="270.0" y="137.2" font-size="12" text-anchor="middle" fill="#23282d">handle</text><rect x="300" y="120" width="70" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="335.0" y="137.2" font-size="12" text-anchor="middle" fill="#23282d">cell BC</text><rect x="370" y="120" width="50" height="26" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="395.0" y="137.2" font-size="12" text-anchor="middle" fill="#23282d">UMI</text><rect x="420" y="120" width="70" height="26" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="455.0" y="137.2" font-size="12" text-anchor="middle" fill="#23282d">poly(dT)</text><text x="240" y="174" font-size="12.5" fill="#23282d">poly(A) pairs with poly(dT): the antibody barcode is captured, barcoded and counted</text><text x="240" y="192" font-size="12.5" fill="#23282d">exactly like an mRNA, but gives a short library separated by size.</text>
</svg>
