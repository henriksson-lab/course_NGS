<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 268" width="830" height="268" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="830" height="268" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Plates and droplets answer different questions. Numbers are typical orders of magnitude.</text><line x1="30" y1="40" x2="810" y2="40" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold"></text><text x="186" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">SMART-seq2/3 plate</text><text x="356" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">CEL-seq, MARS-seq plate</text><text x="556" y="61.0" font-size="12.5" fill="#23282d" font-weight="bold">droplets, microwells</text><line x1="30" y1="70" x2="810" y2="70" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="36" y="91.0" font-size="12.5" fill="#23282d">cells per experiment</text><text x="186" y="91.0" font-size="12.5" fill="#23282d">hundreds</text><text x="356" y="91.0" font-size="12.5" fill="#23282d">hundreds to thousands</text><text x="556" y="91.0" font-size="12.5" fill="#23282d">thousands to tens of thousands</text><line x1="30" y1="100" x2="810" y2="100" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="121.0" font-size="12.5" fill="#23282d">transcript coverage</text><text x="186" y="121.0" font-size="12.5" fill="#23282d">full length</text><text x="356" y="121.0" font-size="12.5" fill="#23282d">3' end</text><text x="556" y="121.0" font-size="12.5" fill="#23282d">3' end (5' variants exist)</text><line x1="30" y1="130" x2="810" y2="130" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="151.0" font-size="12.5" fill="#23282d">UMIs</text><text x="186" y="151.0" font-size="12.5" fill="#23282d">SMART-seq3 only</text><text x="356" y="151.0" font-size="12.5" fill="#23282d">yes</text><text x="556" y="151.0" font-size="12.5" fill="#23282d">yes</text><line x1="30" y1="160" x2="810" y2="160" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="181.0" font-size="12.5" fill="#23282d">cell choice</text><text x="186" y="181.0" font-size="12.5" fill="#23282d">sorted, known well</text><text x="356" y="181.0" font-size="12.5" fill="#23282d">sorted, known well</text><text x="556" y="181.0" font-size="12.5" fill="#23282d">random, no selection</text><line x1="30" y1="190" x2="810" y2="190" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="211.0" font-size="12.5" fill="#23282d">equipment</text><text x="186" y="211.0" font-size="12.5" fill="#23282d">pipette or robot</text><text x="356" y="211.0" font-size="12.5" fill="#23282d">dispenser or robot</text><text x="556" y="211.0" font-size="12.5" fill="#23282d">microfluidics, or none (microwell)</text><line x1="30" y1="220" x2="810" y2="220" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/><text x="36" y="241.0" font-size="12.5" fill="#23282d">when to pick it</text><text x="186" y="241.0" font-size="12.5" fill="#23282d">isoforms, variants</text><text x="356" y="241.0" font-size="12.5" fill="#23282d">controlled small screens</text><text x="556" y="241.0" font-size="12.5" fill="#23282d">many cells, cell atlas</text><line x1="30" y1="250" x2="810" y2="250" stroke="#8a8f94" stroke-width="1.0" stroke-linecap="round"/>
</svg>
