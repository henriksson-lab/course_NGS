<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" width="760" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="254" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">One barcoded cDNA pool, several libraries, separated by size or by primer.</text><rect x="30" y="70" width="150" height="70" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="105" y="100" font-size="13" text-anchor="middle" fill="#23282d">barcoded cDNA</text><text x="105" y="120" font-size="11.5" text-anchor="middle" fill="#8a8f94">one barcode per cell</text><line x1="180" y1="105" x2="250" y2="60" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="250" y="40" width="480" height="38" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="262" y="56" font-size="13" fill="#1f3b57" font-weight="bold">5' gene expression</text><text x="262" y="72" font-size="11.5" fill="#23282d">fragment, adapter, index</text><line x1="180" y1="105" x2="250" y2="106" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="250" y="86" width="480" height="38" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="262" y="102" font-size="13" fill="#2e6b3f" font-weight="bold">V(D)J</text><text x="262" y="118" font-size="11.5" fill="#23282d">constant-region primers</text><line x1="180" y1="105" x2="250" y2="152" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="250" y="132" width="480" height="38" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="262" y="148" font-size="13" fill="#b4532a" font-weight="bold">antibody / hashtag tags</text><text x="262" y="164" font-size="11.5" fill="#23282d">small fragments, kept apart by size</text><line x1="180" y1="105" x2="250" y2="198" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="250" y="178" width="480" height="38" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="262" y="194" font-size="13" fill="#a33a28" font-weight="bold">guide RNA</text><text x="262" y="210" font-size="11.5" fill="#23282d">guide-specific primers</text><text x="30" y="236.0" font-size="13.5" fill="#23282d">The cell barcode is the thread: whichever library a read comes from, it joins to the same cell.</text>
</svg>
