<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 236" width="804" height="236" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="236" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">SMART-seq: one cell per well, full-length cDNA by template switching.</text><rect x="30" y="38" width="262.0" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="161.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">cell sorted into lysis buffer + oligo(dT)</text><line x1="295.0" y1="52.0" x2="314.0" y2="52.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 319.0 52.0 L 314.0 48.5 L 314.0 55.5 Z" fill="#8a8f94"/><rect x="322.0" y="38" width="232.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="438.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">RT; at the 5' end the enzyme adds Cs</text><line x1="557.0" y1="52.0" x2="576.0" y2="52.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 581.0 52.0 L 576.0 48.5 L 576.0 55.5 Z" fill="#8a8f94"/><rect x="584.0" y="38" width="214.0" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="691.0" y="56.2" font-size="12" text-anchor="middle" fill="#23282d">template-switch oligo (GGG) pairs</text><rect x="30" y="86" width="208.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="134.0" y="104.2" font-size="12" text-anchor="middle" fill="#23282d">PCR with one primer on both ends</text><line x1="241.0" y1="100.0" x2="260.0" y2="100.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 265.0 100.0 L 260.0 96.5 L 260.0 103.5 Z" fill="#8a8f94"/><rect x="268.0" y="86" width="112.0" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="324.0" y="104.2" font-size="12" text-anchor="middle" fill="#23282d">Tn5 tagmentation</text><line x1="383.0" y1="100.0" x2="402.0" y2="100.0" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 407.0 100.0 L 402.0 96.5 L 402.0 103.5 Z" fill="#8a8f94"/><rect x="410.0" y="86" width="166.0" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="493.0" y="104.2" font-size="12" text-anchor="middle" fill="#23282d">index PCR: i5 + i7 = well</text><rect x="130" y="150" width="90" height="28" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="175.0" y="168.2" font-size="12" text-anchor="middle" fill="#23282d">TSO handle</text><rect x="220" y="150" width="250" height="28" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="345.0" y="168.2" font-size="12" text-anchor="middle" fill="#23282d">full-length cDNA</text><rect x="470" y="150" width="110" height="28" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="525.0" y="168.2" font-size="12" text-anchor="middle" fill="#23282d">oligo(dT) handle</text><text x="30" y="168.0" font-size="12.5" fill="#8a8f94">after RT</text><text x="30" y="204.0" font-size="13.5" fill="#23282d">No barcode inside the molecule: the well index is added by PCR at the end, so each cell is a separate</text><text x="30" y="222.9" font-size="13.5" fill="#23282d">library.</text>
</svg>
