<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 214" width="820" height="214" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="214" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Three ways to read which guide a cell received: two ride the poly(A) capture, one has its own handle.</text><text x="30" y="52" font-size="13" fill="#1f3b57" font-weight="bold">Perturb-seq</text><rect x="150" y="38" width="240" height="24" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="270.0" y="54.2" font-size="12" text-anchor="middle" fill="#23282d">guide barcode in a Pol II transcript</text><rect x="390" y="38" width="60" height="24" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="420.0" y="54.2" font-size="12" text-anchor="middle" fill="#23282d">poly(A)</text><text x="470" y="54" font-size="12" fill="#8a8f94">a lookup table links barcode to guide</text><text x="30" y="100.0" font-size="13" fill="#b4532a" font-weight="bold">CROP-seq</text><rect x="150" y="86" width="290" height="24" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="295.0" y="102.2" font-size="12" text-anchor="middle" fill="#23282d">guide sequence inside the transcript's 3' LTR</text><rect x="440" y="86" width="60" height="24" rx="2" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="470.0" y="102.2" font-size="12" text-anchor="middle" fill="#23282d">poly(A)</text><text x="520" y="102" font-size="12" fill="#8a8f94">guide read directly</text><text x="30" y="148.0" font-size="13" fill="#2e6b3f" font-weight="bold">direct capture</text><rect x="150" y="134" width="240" height="24" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="270.0" y="150.2" font-size="12" text-anchor="middle" fill="#23282d">guide RNA with a capture sequence</text><text x="400" y="150" font-size="12" fill="#8a8f94">bead oligo has a matching capture sequence</text><text x="30" y="196.0" font-size="13.5" fill="#23282d">The first two route the guide through an mRNA; the last captures the guide RNA itself.</text>
</svg>
