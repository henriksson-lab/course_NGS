<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 308" width="800" height="308" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="308" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Cells land in droplets at random (Poisson). A low loading rate keeps doublets rare and wastes most droplets.</text><text x="30" y="52" font-size="12" fill="#8a8f94">cells per droplet</text><text x="520" y="52" font-size="12" fill="#8a8f94">doublets among occupied</text><text x="30" y="85" font-size="13" fill="#23282d">0.05</text><rect x="110.0" y="68" width="361.5" height="24" fill="#dfe3e6"/><rect x="471.5" y="68" width="18.1" height="24" fill="#2e6b3f"/><rect x="489.5" y="68" width="1.5" height="24" fill="#a33a28"/><text x="520" y="85" font-size="13" fill="#a33a28">2.5%</text><text x="112" y="106" font-size="10.5" fill="#8a8f94">empty 95.1%   one cell 4.8%   two or more 0.1%</text><text x="30" y="133.0" font-size="13" fill="#23282d">0.10</text><rect x="110.0" y="116" width="343.8" height="24" fill="#dfe3e6"/><rect x="453.8" y="116" width="34.4" height="24" fill="#2e6b3f"/><rect x="488.2" y="116" width="1.8" height="24" fill="#a33a28"/><text x="520" y="133" font-size="13" fill="#a33a28">4.9%</text><text x="112" y="154" font-size="10.5" fill="#8a8f94">empty 90.5%   one cell 9.0%   two or more 0.5%</text><text x="30" y="181.0" font-size="13" fill="#23282d">0.30</text><rect x="110.0" y="164" width="281.5" height="24" fill="#dfe3e6"/><rect x="391.5" y="164" width="84.5" height="24" fill="#2e6b3f"/><rect x="476.0" y="164" width="14.0" height="24" fill="#a33a28"/><text x="520" y="181" font-size="13" fill="#a33a28">14.3%</text><text x="112" y="202" font-size="10.5" fill="#8a8f94">empty 74.1%   one cell 22.2%   two or more 3.7%</text><text x="30" y="229.0" font-size="13" fill="#23282d">1.00</text><rect x="110.0" y="212" width="139.8" height="24" fill="#dfe3e6"/><rect x="249.8" y="212" width="139.8" height="24" fill="#2e6b3f"/><rect x="389.6" y="212" width="100.4" height="24" fill="#a33a28"/><text x="520" y="229" font-size="13" fill="#a33a28">41.8%</text><text x="112" y="250" font-size="10.5" fill="#8a8f94">empty 36.8%   one cell 36.8%   two or more 26.4%</text><text x="30" y="276.0" font-size="13" fill="#23282d">Doublets among occupied droplets = P(2 or more) / (1 - P(0)). At 0.05 cells per droplet, 95% of droplets are</text><text x="30" y="294.2" font-size="13" fill="#23282d">empty.</text>
</svg>
