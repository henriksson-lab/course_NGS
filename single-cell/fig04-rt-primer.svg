<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 228" width="820" height="228" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="228" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">CEL-seq and MARS-seq put the cell barcode into the reverse-transcription primer, then pool.</text><rect x="60" y="44" width="140" height="28" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="130.0" y="62.2" font-size="12" text-anchor="middle" fill="#23282d">T7 promoter + handle</text><rect x="200" y="44" width="90" height="28" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="245.0" y="62.2" font-size="12" text-anchor="middle" fill="#23282d">cell barcode</text><rect x="290" y="44" width="60" height="28" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="320.0" y="62.2" font-size="12" text-anchor="middle" fill="#23282d">UMI</text><rect x="350" y="44" width="80" height="28" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="390.0" y="62.2" font-size="12" text-anchor="middle" fill="#23282d">poly(T)</text><text x="60" y="100" font-size="12" fill="#8a8f94">one primer sequence per well; every primer in a well carries that well's barcode</text><rect x="60" y="120" width="36" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="78" cy="133" r="5" fill="#1f3b57"/><rect x="104" y="120" width="36" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="122" cy="133" r="5" fill="#b4532a"/><rect x="148" y="120" width="36" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="166" cy="133" r="5" fill="#2e6b3f"/><rect x="192" y="120" width="36" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="210" cy="133" r="5" fill="#a33a28"/><rect x="236" y="120" width="36" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="254" cy="133" r="5" fill="#8a8f94"/><rect x="280" y="120" width="36" height="26" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="298" cy="133" r="5" fill="#1f3b57"/><line x1="330" y1="133" x2="395" y2="133" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 400 133 L 395 129.5 L 395 136.5 Z" fill="#8a8f94"/><text x="365" y="118" font-size="11.5" text-anchor="middle" fill="#8a8f94">pool after RT</text><rect x="410" y="112" width="70" height="44" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="445.0" y="138.2" font-size="12" text-anchor="middle" fill="#23282d">one tube</text><line x1="480" y1="133" x2="525" y2="133" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 530 133 L 525 129.5 L 525 136.5 Z" fill="#8a8f94"/><text x="540" y="130" font-size="12" fill="#23282d">second strand, T7 in vitro</text><text x="540" y="148" font-size="12" fill="#23282d">transcription, fragment, RT, PCR</text><text x="30" y="196.0" font-size="13.5" fill="#23282d">All the expensive library steps now happen once on the pool. T7 amplification is linear, so errors do not</text><text x="30" y="214.9" font-size="13.5" fill="#23282d">compound as they do in PCR.</text>
</svg>
