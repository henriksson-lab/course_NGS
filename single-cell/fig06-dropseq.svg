<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 244" width="780" height="244" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="244" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">A GEM: one cell and one gel bead in a droplet of oil, with the barcode on the bead's oligos.</text><circle cx="130" cy="120" r="84" fill="none" stroke="#8a8f94" stroke-width="2"/><circle cx="95" cy="120" r="30" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.6"/><text x="95" y="124" font-size="12" text-anchor="middle" fill="#1f3b57">cell</text><circle cx="170" cy="120" r="14" fill="#23282d"/><line x1="184.0" y1="120.0" x2="198.0" y2="120.0" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><line x1="180.7246222036657" y1="128.99902653561156" x2="191.44924440733138" y2="137.9980530712231" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><line x1="172.431074487337" y1="133.7873085421709" x2="174.86214897467406" y2="147.5746170843418" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><line x1="163.0" y1="132.12435565298213" x2="156.0" y2="144.2487113059643" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><line x1="156.84430330899727" y1="124.78828200655937" x2="143.68860661799457" y2="129.57656401311874" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><line x1="156.84430330899727" y1="115.21171799344064" x2="143.68860661799457" y2="110.42343598688127" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><line x1="163.0" y1="107.87564434701787" x2="156.0" y2="95.75128869403572" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><line x1="172.431074487337" y1="106.21269145782908" x2="174.86214897467403" y2="92.42538291565818" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><line x1="180.7246222036657" y1="111.00097346438845" x2="191.44924440733138" y2="102.00194692877689" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><text x="170" y="172" font-size="12" text-anchor="middle" fill="#23282d">gel bead</text><text x="130" y="224" font-size="11.5" text-anchor="middle" fill="#8a8f94">oil droplet, about 1 nl</text><text x="260" y="60" font-size="12.5" fill="#23282d" font-weight="bold">oligo on the bead</text><rect x="260" y="70" width="100" height="28" rx="2" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="310.0" y="88.2" font-size="12" text-anchor="middle" fill="#23282d">Read 1 primer</text><rect x="360" y="70" width="100" height="28" rx="2" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="410.0" y="88.2" font-size="12" text-anchor="middle" fill="#23282d">cell barcode</text><rect x="460" y="70" width="60" height="28" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="490.0" y="88.2" font-size="12" text-anchor="middle" fill="#23282d">UMI</text><rect x="520" y="70" width="80" height="28" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="560.0" y="88.2" font-size="12" text-anchor="middle" fill="#23282d">poly(dT)VN</text><text x="260" y="126" font-size="11.5" fill="#b4532a">16 nt, the same on every oligo of one bead</text><text x="260" y="144" font-size="11.5" fill="#a33a28">12 nt, different on every oligo</text><text x="260" y="180" font-size="12.5" fill="#23282d">The bead dissolves and frees its oligos; the mRNA primes on poly(dT)VN.</text><text x="260" y="200" font-size="12.5" fill="#23282d">RT runs inside the GEM, so every cDNA carries its cell's barcode.</text>
</svg>
