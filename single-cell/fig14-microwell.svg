<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 264" width="800" height="264" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="264" fill="none"/>
<text x="30" y="22" font-size="14" fill="#23282d">Microwells: cells and beads settle by gravity into wells; no microfluidics needed.</text><rect x="60" y="116" width="460" height="60" fill="#eef0f2" stroke="#8a8f94"/><rect x="80" y="116" width="48" height="44" fill="#ffffff" stroke="#8a8f94"/><circle cx="94" cy="140" r="6" fill="#1f3b57"/><circle cx="116" cy="148" r="6" fill="#23282d"/><rect x="150" y="116" width="48" height="44" fill="#ffffff" stroke="#8a8f94"/><circle cx="164" cy="140" r="6" fill="#1f3b57"/><circle cx="186" cy="148" r="6" fill="#23282d"/><rect x="220" y="116" width="48" height="44" fill="#ffffff" stroke="#8a8f94"/><rect x="290" y="116" width="48" height="44" fill="#ffffff" stroke="#8a8f94"/><circle cx="304" cy="140" r="6" fill="#1f3b57"/><circle cx="318" cy="140" r="6" fill="#1f3b57"/><circle cx="326" cy="148" r="6" fill="#23282d"/><rect x="360" y="116" width="48" height="44" fill="#ffffff" stroke="#8a8f94"/><circle cx="374" cy="140" r="6" fill="#1f3b57"/><circle cx="396" cy="148" r="6" fill="#23282d"/><rect x="430" y="116" width="48" height="44" fill="#ffffff" stroke="#8a8f94"/><circle cx="466" cy="148" r="6" fill="#23282d"/><line x1="60" y1="108" x2="520" y2="108" stroke="#a33a28" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 3"/><text x="540" y="112" font-size="12" fill="#a33a28">semipermeable membrane</text><text x="60" y="94" font-size="12" fill="#8a8f94">lysis buffer flows in; cells lyse in place</text><text x="60" y="198" font-size="11.5" fill="#8a8f94">empty well</text><text x="220" y="198" font-size="11"></text><text x="290" y="198" font-size="11.5" fill="#a33a28">two cells: a doublet</text><text x="430" y="198" font-size="11.5" fill="#8a8f94">bead, no cell</text><text x="30" y="232.0" font-size="13.5" fill="#23282d">mRNA hybridises to the bead in its own well; beads are then pooled and RT is done in bulk. Seq-Well and</text><text x="30" y="250.9" font-size="13.5" fill="#23282d">Microwell-seq work this way.</text>
</svg>
