<text x="30" y="26" font-size="14.5" fill="#23282d">The chart, part 1: what the enzyme does to the DNA it meets</text><text x="30" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Enzyme</text><text x="202.0" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Error rate</text><text x="336.5" y="62" font-size="12.5" fill="#23282d" font-weight="bold">3'→5' exo</text><text x="433.5" y="62" font-size="12.5" fill="#23282d" font-weight="bold">5'→3' exo / flap</text><text x="555.5" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Strand displacement</text><text x="696.25" y="62" font-size="12.5" fill="#23282d" font-weight="bold">RT activity</text><line x1="26" y1="70" x2="783.25" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="89" font-size="12.5" fill="#23282d" font-weight="bold">Taq</text><text x="202.0" y="89" font-size="12.5" fill="#23282d">moderate</text><text x="336.5" y="89" font-size="12.5" fill="#8a8f94">no</text><text x="433.5" y="89" font-size="12.5" fill="#1f3b57">yes (flap endo)</text><text x="555.5" y="89" font-size="12.5" fill="#23282d">weak</text><text x="696.25" y="89" font-size="12.5" fill="#23282d">trace (Mn2+)</text><rect x="24" y="99" width="757.25" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="116" font-size="12.5" fill="#23282d" font-weight="bold">Q5 / Phusion / KAPA HiFi</text><text x="202.0" y="116" font-size="12.5" fill="#23282d">very high fidelity</text><text x="336.5" y="116" font-size="12.5" fill="#1f3b57">yes</text><text x="433.5" y="116" font-size="12.5" fill="#8a8f94">no</text><text x="555.5" y="116" font-size="12.5" fill="#23282d">low</text><text x="696.25" y="116" font-size="12.5" fill="#8a8f94">no</text><text x="30" y="143" font-size="12.5" fill="#23282d" font-weight="bold">Klenow (exo+)</text><text x="202.0" y="143" font-size="12.5" fill="#23282d">high fidelity</text><text x="336.5" y="143" font-size="12.5" fill="#1f3b57">yes</text><text x="433.5" y="143" font-size="12.5" fill="#8a8f94">no</text><text x="555.5" y="143" font-size="12.5" fill="#23282d">moderate</text><text x="696.25" y="143" font-size="12.5" fill="#8a8f94">no</text><rect x="24" y="153" width="757.25" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="170" font-size="12.5" fill="#23282d" font-weight="bold">Klenow exo−</text><text x="202.0" y="170" font-size="12.5" fill="#23282d">moderate</text><text x="336.5" y="170" font-size="12.5" fill="#8a8f94">no</text><text x="433.5" y="170" font-size="12.5" fill="#8a8f94">no</text><text x="555.5" y="170" font-size="12.5" fill="#23282d">moderate</text><text x="696.25" y="170" font-size="12.5" fill="#8a8f94">no</text><text x="30" y="197" font-size="12.5" fill="#23282d" font-weight="bold">T4 DNA polymerase</text><text x="202.0" y="197" font-size="12.5" fill="#23282d">high fidelity</text><text x="336.5" y="197" font-size="12.5" fill="#1f3b57">yes (strong)</text><text x="433.5" y="197" font-size="12.5" fill="#8a8f94">no</text><text x="555.5" y="197" font-size="12.5" fill="#8a8f94">none</text><text x="696.25" y="197" font-size="12.5" fill="#8a8f94">no</text><rect x="24" y="207" width="757.25" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="224" font-size="12.5" fill="#23282d" font-weight="bold">Bst large fragment</text><text x="202.0" y="224" font-size="12.5" fill="#23282d">moderate</text><text x="336.5" y="224" font-size="12.5" fill="#8a8f94">no</text><text x="433.5" y="224" font-size="12.5" fill="#8a8f94">no</text><text x="555.5" y="224" font-size="12.5" fill="#1f3b57">strong</text><text x="696.25" y="224" font-size="12.5" fill="#23282d">weak</text><text x="30" y="251" font-size="12.5" fill="#23282d" font-weight="bold">phi29</text><text x="202.0" y="251" font-size="12.5" fill="#23282d">very high fidelity</text><text x="336.5" y="251" font-size="12.5" fill="#1f3b57">yes</text><text x="433.5" y="251" font-size="12.5" fill="#8a8f94">no</text><text x="555.5" y="251" font-size="12.5" fill="#1f3b57">very strong</text><text x="696.25" y="251" font-size="12.5" fill="#8a8f94">no</text><rect x="24" y="261" width="757.25" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="278" font-size="12.5" fill="#23282d" font-weight="bold">uracil-tolerant HiFi</text><text x="202.0" y="278" font-size="12.5" fill="#23282d">very high fidelity</text><text x="336.5" y="278" font-size="12.5" fill="#1f3b57">yes</text><text x="433.5" y="278" font-size="12.5" fill="#8a8f94">no</text><text x="555.5" y="278" font-size="12.5" fill="#23282d">low</text><text x="696.25" y="278" font-size="12.5" fill="#8a8f94">no</text><text x="30" y="312" font-size="14" fill="#8a8f94">Ranks, not numbers: error rates depend on the assay. Compare rows within one vendor's chart.</text>
