<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 194" width="960" height="194" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="960" height="194" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">T4 PNK does two jobs, and which one you get depends on the buffer</text><text x="40" y="62" font-size="14.5" fill="#2e6b3f" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">5'-OH  →  5'-P</text><text x="290" y="62" font-size="13.5" fill="#23282d">kinase: needs ATP</text><text x="520" y="62" font-size="13.5" fill="#8a8f94">makes an end ligatable as a donor</text><text x="40" y="96" font-size="14.5" fill="#2e6b3f" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">3'-P  →  3'-OH</text><text x="290" y="96" font-size="13.5" fill="#23282d">phosphatase: no ATP needed</text><text x="520" y="96" font-size="13.5" fill="#8a8f94">makes an end extendable and ligatable as an acceptor</text><text x="40" y="130" font-size="14.5" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">5'-P with ATP and ADP</text><text x="290" y="130" font-size="13.5" fill="#23282d">exchange: slow, reversible</text><text x="520" y="130" font-size="13.5" fill="#8a8f94">can also take a phosphate off (kinase reverse)</text><text x="30" y="176" font-size="14" fill="#23282d">Same enzyme, same tube: end repair uses both at once. Use a buffer with ATP when you want the kinase to run.</text>
</svg>
