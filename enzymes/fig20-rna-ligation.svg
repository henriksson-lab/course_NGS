<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="960" height="256" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Small RNA adapters in two ligations: no ATP in the first, so nothing but the adapter can join</text><text x="30" y="42" font-size="13.5" fill="#23282d">1. pre-adenylated 3' adapter + truncated T4 RNA ligase 2, no ATP</text><rect x="60" y="56" width="160" height="28" rx="4" fill="#e6e9ec" stroke="#8a8f94" stroke-width="1.2"/><text x="140.0" y="74.55" font-size="13" text-anchor="middle" fill="#23282d">RNA 5'-P ... 3'-OH</text><rect x="230" y="56" width="220" height="28" rx="4" fill="#f3dcd0" stroke="#8a8f94" stroke-width="1.2"/><text x="340.0" y="74.55" font-size="13" text-anchor="middle" fill="#23282d">5'-App  3' adapter  3'-block</text><line x1="460" y1="70" x2="515" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 520 70 L 515 66.5 L 515 73.5 Z" fill="#b4532a"/><rect x="530" y="56" width="160" height="28" rx="4" fill="#e6e9ec" stroke="#8a8f94" stroke-width="1.2"/><text x="610.0" y="74.55" font-size="13" text-anchor="middle" fill="#23282d">RNA</text><rect x="690" y="56" width="220" height="28" rx="4" fill="#f3dcd0" stroke="#8a8f94" stroke-width="1.2"/><text x="800.0" y="74.55" font-size="13" text-anchor="middle" fill="#23282d">3' adapter  3'-block</text><text x="60" y="108" font-size="12.5" fill="#8a8f94">no ATP: the RNA cannot circularise or join its neighbours; the blocked 3' end stops the adapter joining itself</text><text x="30" y="142" font-size="13.5" fill="#23282d">2. 5' adapter + T4 RNA ligase 1, with ATP (the RNA's own 5'-P is the donor)</text><rect x="60" y="156" width="160" height="28" rx="4" fill="#f3dcd0" stroke="#8a8f94" stroke-width="1.2"/><text x="140.0" y="174.55" font-size="13" text-anchor="middle" fill="#23282d">5' adapter  3'-OH</text><rect x="230" y="156" width="160" height="28" rx="4" fill="#e6e9ec" stroke="#8a8f94" stroke-width="1.2"/><text x="310.0" y="174.55" font-size="13" text-anchor="middle" fill="#23282d">RNA</text><rect x="390" y="156" width="220" height="28" rx="4" fill="#f3dcd0" stroke="#8a8f94" stroke-width="1.2"/><text x="500.0" y="174.55" font-size="13" text-anchor="middle" fill="#23282d">3' adapter  3'-block</text><text x="630" y="175" font-size="12.5" fill="#8a8f94">← remove spare 3' adapter first, or the</text><text x="630" y="192" font-size="12.5" fill="#a33a28">5' adapter joins it: adapter dimer</text><text x="30" y="240" font-size="14" fill="#8a8f94">[Viollet 2011, doi:10.1186/1472-6750-11-72]</text>
</svg>
