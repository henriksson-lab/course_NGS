<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 288" width="820" height="288" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="288" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Meeting a downstream strand: three behaviours, three uses</text><text x="30" y="50" font-size="13.5" fill="#8a8f94" font-weight="bold">stops (T4 DNA pol)</text><line x1="60" y1="90" x2="480" y2="90" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="80" x2="260" y2="80" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="268" y1="80" x2="480" y2="80" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="210" y1="66" x2="253" y2="66" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><path d="M 258 66 L 253 62.5 L 253 69.5 Z" fill="#1f3b57"/><text x="510" y="85" font-size="13.5" fill="#23282d">nick or gap is left intact</text><text x="30" y="118" font-size="13.5" fill="#1f3b57" font-weight="bold">displaces (Klenow, Bst, phi29)</text><line x1="60" y1="158" x2="480" y2="158" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="148" x2="330" y2="148" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="330" y1="148" x2="400" y2="126" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="280" y1="134" x2="323" y2="134" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><path d="M 328 134 L 323 130.5 L 323 137.5 Z" fill="#1f3b57"/><text x="510" y="153" font-size="13.5" fill="#23282d">downstream strand is peeled off as a flap</text><text x="30" y="186" font-size="13.5" fill="#b4532a" font-weight="bold">degrades (Taq, Pol I)</text><line x1="60" y1="226" x2="480" y2="226" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="216" x2="330" y2="216" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="340" y1="216" x2="350" y2="216" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="356" y1="216" x2="366" y2="216" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="372" y1="216" x2="382" y2="216" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="388" y1="216" x2="398" y2="216" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="404" y1="216" x2="414" y2="216" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="430" y1="216" x2="480" y2="216" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="280" y1="202" x2="323" y2="202" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><path d="M 328 202 L 323 198.5 L 323 205.5 Z" fill="#1f3b57"/><text x="510" y="221" font-size="13.5" fill="#23282d">downstream strand is cut away</text><text x="30" y="270" font-size="14" fill="#23282d">Blue: new strand. Orange: the downstream strand that is in the way.</text>
