<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 938 299" width="938" height="299" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="938" height="299" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">A ligase chart reads by donor chemistry and by substrate</text><text x="30" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Ligase</text><text x="252.0" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Donor</text><text x="417.75" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Joins</text><text x="727.25" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Does not do</text><line x1="26" y1="70" x2="908.0" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="89" font-size="12.5" fill="#23282d" font-weight="bold">T4 DNA ligase</text><text x="252.0" y="89" font-size="12.5" fill="#23282d">ATP</text><text x="417.75" y="89" font-size="12.5" fill="#23282d">blunt, TA, cohesive, DNA nicks</text><text x="727.25" y="89" font-size="12.5" fill="#23282d">ssDNA; RNA splints (poorly)</text><rect x="24" y="99" width="882.0" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="116" font-size="12.5" fill="#23282d" font-weight="bold">E. coli DNA ligase</text><text x="252.0" y="116" font-size="12.5" fill="#23282d">NAD+</text><text x="417.75" y="116" font-size="12.5" fill="#23282d">cohesive ends, nicks</text><text x="727.25" y="116" font-size="12.5" fill="#23282d">blunt ends (barely)</text><text x="30" y="143" font-size="12.5" fill="#23282d" font-weight="bold">Taq DNA ligase</text><text x="252.0" y="143" font-size="12.5" fill="#23282d">NAD+, hot</text><text x="417.75" y="143" font-size="12.5" fill="#23282d">nicks only; checks the base at the junction</text><text x="727.25" y="143" font-size="12.5" fill="#23282d">any end that is not a nick</text><rect x="24" y="153" width="882.0" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="170" font-size="12.5" fill="#23282d" font-weight="bold">T4 RNA ligase 1</text><text x="252.0" y="170" font-size="12.5" fill="#23282d">ATP</text><text x="417.75" y="170" font-size="12.5" fill="#23282d">ssRNA and ssDNA ends, intra- or intermolecular</text><text x="727.25" y="170" font-size="12.5" fill="#23282d">duplex ends</text><text x="30" y="197" font-size="12.5" fill="#23282d" font-weight="bold">T4 RNA ligase 2, truncated</text><text x="252.0" y="197" font-size="12.5" fill="#23282d">5'-App (pre-adenylated)</text><text x="417.75" y="197" font-size="12.5" fill="#23282d">adapter 3' to an RNA 3'-OH, no ATP</text><text x="727.25" y="197" font-size="12.5" fill="#23282d">phosphorylated donors</text><rect x="24" y="207" width="882.0" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="224" font-size="12.5" fill="#23282d" font-weight="bold">Chlorella virus ligase (SplintR)</text><text x="252.0" y="224" font-size="12.5" fill="#23282d">ATP</text><text x="417.75" y="224" font-size="12.5" fill="#23282d">nicks in an RNA:DNA hybrid</text><text x="727.25" y="224" font-size="12.5" fill="#23282d">single strands</text><text x="30" y="251" font-size="12.5" fill="#23282d" font-weight="bold">CircLigase-type</text><text x="252.0" y="251" font-size="12.5" fill="#23282d">ATP, hot</text><text x="417.75" y="251" font-size="12.5" fill="#23282d">closes one ssDNA into a circle</text><text x="727.25" y="251" font-size="12.5" fill="#23282d">duplex ends</text><text x="30" y="285" font-size="14" fill="#8a8f94">Names differ between vendors; the properties do not. Read the 'substrate' and 'cofactor' lines of the datasheet.</text>
</svg>
