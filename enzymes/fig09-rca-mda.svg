<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="960" height="240" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Strand displacement lets one template be copied again and again</text><text x="40" y="56" font-size="13.5" fill="#23282d">rolling circle (phi29): a circle becomes a long tandem strand</text><circle cx="90" cy="130" r="34" fill="none" stroke="#4a6b8a" stroke-width="3"/><line x1="124" y1="130" x2="520" y2="130" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="160" y1="120" x2="160" y2="140" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="240" y1="120" x2="240" y2="140" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="320" y1="120" x2="320" y2="140" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="400" y1="120" x2="400" y2="140" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="480" y1="120" x2="480" y2="140" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><text x="124" y="164" font-size="12" fill="#8a8f94">copy 1</text><text x="204" y="164" font-size="12" fill="#8a8f94">copy 2</text><text x="284" y="164" font-size="12" fill="#8a8f94">copy 3</text><text x="364" y="164" font-size="12" fill="#8a8f94">copy 4 ...</text><line x1="480" y1="108" x2="535" y2="108" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 540 108 L 535 104.5 L 535 111.5 Z" fill="#b4532a"/><text x="600" y="56" font-size="13.5" fill="#23282d">MDA: random primers make it branch</text><line x1="600" y1="130" x2="900" y2="130" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="630" y1="130" x2="690" y2="96" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="690" y1="96" x2="730" y2="96" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="700" y1="130" x2="760" y2="164" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="760" y1="164" x2="800" y2="164" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="770" y1="130" x2="830" y2="96" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="830" y1="96" x2="870" y2="96" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="830" y1="130" x2="890" y2="164" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="890" y1="164" x2="930" y2="164" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><text x="30" y="200" font-size="14" fill="#23282d">Each new strand displaces the one ahead of it, which is itself copied. 30 °C, thousands-fold amplification, long fragments.</text><text x="30" y="222" font-size="14" fill="#8a8f94">[Dean 2002, doi:10.1073/pnas.082089499]</text>
</svg>
