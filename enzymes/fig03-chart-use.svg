<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 841 326" width="841" height="326" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="841" height="326" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">The chart, part 2: what you get, and the conditions it needs</text><text x="30" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Enzyme</text><text x="202.0" y="62" font-size="12.5" fill="#23282d" font-weight="bold">3' end made</text><text x="311.5" y="62" font-size="12.5" fill="#23282d" font-weight="bold">RNA primer</text><text x="396.0" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Nick extension</text><text x="511.75" y="62" font-size="12.5" fill="#23282d" font-weight="bold">dU tolerance</text><text x="608.75" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Temperature</text><text x="699.5" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Longest product</text><line x1="26" y1="70" x2="811.5" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="89" font-size="12.5" fill="#23282d" font-weight="bold">Taq</text><text x="202.0" y="89" font-size="12.5" fill="#23282d">mostly +A</text><text x="311.5" y="89" font-size="12.5" fill="#23282d">poor</text><text x="396.0" y="89" font-size="12.5" fill="#8a8f94">no (cuts flap)</text><text x="511.75" y="89" font-size="12.5" fill="#1f3b57">yes</text><text x="608.75" y="89" font-size="12.5" fill="#23282d">68–72 °C</text><text x="699.5" y="89" font-size="12.5" fill="#23282d">~5 kb</text><rect x="24" y="99" width="785.5" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="116" font-size="12.5" fill="#23282d" font-weight="bold">Q5 / Phusion / KAPA HiFi</text><text x="202.0" y="116" font-size="12.5" fill="#23282d">blunt</text><text x="311.5" y="116" font-size="12.5" fill="#23282d">poor</text><text x="396.0" y="116" font-size="12.5" fill="#8a8f94">no</text><text x="511.75" y="116" font-size="12.5" fill="#b4532a">stalls</text><text x="608.75" y="116" font-size="12.5" fill="#23282d">72 °C</text><text x="699.5" y="116" font-size="12.5" fill="#23282d">10–20 kb</text><text x="30" y="143" font-size="12.5" fill="#2328