.5" fill="#1f3b57">yes</text><text x="608.75" y="224" font-size="12.5" fill="#23282d">60–65 °C</text><text x="699.5" y="224" font-size="12.5" fill="#23282d">isothermal, long</text><text x="30" y="251" font-size="12.5" fill="#23282d" font-weight="bold">phi29</text><text x="202.0" y="251" font-size="12.5" fill="#23282d">n/a (circular)</text><text x="311.5" y="251" font-size="12.5" fill="#b4532a">check</text><text x="396.0" y="251" font-size="12.5" fill="#1f3b57">yes (displaces)</text><text x="511.75" y="251" font-size="12.5" fill="#1f3b57">yes</text><text x="608.75" y="251" font-size="12.5" fill="#23282d">30 °C</text><text x="699.5" y="251" font-size="12.5" fill="#23282d">10 kb or more</text><rect x="24" y="261" width="785.5" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="278" font-size="12.5" fill="#23282d" font-weight="bold">uracil-tolerant HiFi</text><text x="202.0" y="278" font-size="12.5" fill="#23282d">blunt</text><text x="311.5" y="278" font-size="12.5" fill="#23282d">poor</text><text x="396.0" y="278" font-size="12.5" fill="#8a8f94">no</text><text x="511.75" y="278" font-size="12.5" fill="#1f3b57">yes</text><text x="608.75" y="278" font-size="12.5" fill="#23282d">72 °C</text><text x="699.5" y="278" font-size="12.5" fill="#23282d">10–20 kb</text><text x="30" y="312" font-size="14" fill="#8a8f94">'check' = depends on the product or the lot: read the datasheet before relying on it.</text>
