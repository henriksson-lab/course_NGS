<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1017 172" width="1017" height="172" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="172" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">A nicking enzyme plus a displacing polymerase copies a site forever</text><line x1="60" y1="102" x2="510" y2="102" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="110" y="62" width="70" height="14" rx="4" fill="#f3dcd0" stroke="#b4532a" stroke-width="1.2"/><text x="145" y="56" font-size="12" text-anchor="middle" fill="#b4532a">site</text><line x1="60" y1="80" x2="262" y2="80" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="262" y1="68" x2="262" y2="92" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><text x="272" y="62" font-size="12.5" fill="#a33a28">nick (top strand only)</text><line x1="262" y1="80" x2="423" y2="80" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><path d="M 430 80 L 423 75.1 L 423 84.9 Z" fill="#1f3b57"/><line x1="430" y1="80" x2="520" y2="46" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><text x="532" y="46" font-size="13.5" fill="#23282d">old top strand is displaced as a single strand</text><text x="532" y="92" font-size="13.5" fill="#23282d">the new copy carries the site again: it is nicked</text><text x="532" y="110" font-size="13.5" fill="#23282d">and copied once more, at one temperature</text><text x="30" y="156" font-size="14" fill="#23282d">Nicks leave a 3'-OH, which is all a displacing polymerase (Bst, Klenow exo−) needs. Amplification at constant temperature, without cycling.</text>
</svg>
