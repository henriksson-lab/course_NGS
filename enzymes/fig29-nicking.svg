<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1017 200" width="1017" height="200" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="200" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">A nicking enzyme plus a displacing polymerase copies a site forever</text><line x1="60" y1="80" x2="540" y2="80" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="102" x2="540" y2="102" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="110" y="62" width="70" height="14" rx="4" fill="#f3dcd0" stroke="#b4532a" stroke-width="1.2"/><text x="145" y="56" font-size="12" text-anchor="middle" fill="#b4532a">site</text><text x="262" y="70" font-size="12.5" fill="#a33a28">↓ nick (top strand only)</text><line x1="262" y1="128" x2="415" y2="128" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><path d="M 420 128 L 415 124.5 L 415 131.5 Z" fill="#1f3b57"/><line x1="262" y1="128" x2="540" y2="128" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="500" y1="80" x2="570" y2="52" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><text x="580" y="56" font-size="13.5" fill="#23282d">old top strand is displaced as a single strand</text><text x="580" y="130" font-size="13.5" fill="#23282d">new copy is nicked again: the cycle repeats</text><text x="30" y="184" font-size="14" fill="#23282d">Nicks leave a 3'-OH, which is all a displacing polymerase (Bst, Klenow exo−) needs. Amplification at constant temperature, without cycling.</text>
</svg>
