<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 264" width="884" height="264" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="736" height="264" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Exonucleases: the end the enzyme needs is the whole story</text><text x="30" y="62" font-size="13" fill="#23282d" font-weight="bold">Enzyme</text><text x="143.0" y="62" font-size="13" fill="#23282d" font-weight="bold">direction</text><text x="223.5" y="62" font-size="13" fill="#23282d" font-weight="bold">substrate</text><text x="499.0" y="62" font-size="13" fill="#23282d" font-weight="bold">blocked by</text><line x1="26" y1="70" x2="686.5" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="92" font-size="13" fill="#23282d" font-weight="bold">Exo I</text><text x="143.0" y="92" font-size="13" fill="#23282d">3'→5'</text><text x="223.5" y="92" font-size="13" fill="#23282d">single strand</text><text x="499.0" y="92" font-size="13" fill="#23282d">phosphorothioate, a duplex</text><rect x="24" y="102" width="660.5" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="122" font-size="13" fill="#23282d" font-weight="bold">Exo III</text><text x="143.0" y="122" font-size="13" fill="#23282d">3'→5'</text><text x="223.5" y="122" font-size="13" fill="#23282d">duplex: blunt, 5' overhang, recessed 3'</text><text x="499.0" y="122" font-size="13" fill="#23282d">3' overhang of 4 nt or more</text><text x="30" y="152" font-size="13" fill="#23282d" font-weight="bold">λ exonuclease</text><text x="143.0" y="152" font-size="13" fill="#23282d">5'→3'</text><text x="223.5" y="152" font-size="13" fill="#23282d">duplex with 5'-P (strongly)</text><text x="499.0" y="152" font-size="13" fill="#23282d">5'-OH or a bound protein</text><rect x="24" y="162" width="660.5" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="182" font-size="13" fill="#23282d" font-weight="bold">T7 exonuclease</text><text x="143.0" y="182" font-size="13" fill="#23282d">5'→3'</text><text x="223.5" y="182" font-size="13" fill="#23282d">duplex, also nicks</text><text x="499.0" y="182" font-size="13" fill="#23282d">phosphorothioate</text><text x="30" y="212" font-size="13" fill="#23282d" font-weight="bold">RecBCD (Exo V)</text><text x="143.0" y="212" font-size="13" fill="#23282d">both, ATP</text><text x="223.5" y="212" font-size="13" fill="#23282d">linear DNA, not circles</text><text x="499.0" y="212" font-size="13" fill="#23282d">circular DNA survives</text><text x="30" y="248" font-size="14" fill="#23282d">Typical uses: clear leftover primers (Exo I), clear linear DNA from a circle prep (RecBCD), make single strands (λ exo).</text>
</svg>
