<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 926 244" width="926" height="244" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="244" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">rRNA depletion with RNase H: DNA oligos mark the rRNA, RNase H destroys what they bind</text><text x="30" y="54" font-size="13.5" fill="#23282d">1. DNA oligos (blue) tile across rRNA (orange); mRNA (green) is left alone</text><line x1="60" y1="84" x2="460" y2="84" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round"/><line x1="64" y1="98" x2="136" y2="98" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="144" y1="98" x2="216" y2="98" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="224" y1="98" x2="296" y2="98" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="304" y1="98" x2="376" y2="98" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="384" y1="98" x2="456" y2="98" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="520" y1="84" x2="800" y2="84" stroke="#2e6b3f" stroke-width="3.2" stroke-linecap="round"/><text x="30" y="150" font-size="13.5" fill="#23282d">2. RNase H cuts only the RNA in each hybrid; DNase I then removes the oligos</text><line x1="64" y1="176" x2="100" y2="176" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round"/><line x1="144" y1="176" x2="180" y2="176" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round"/><line x1="224" y1="176" x2="260" y2="176" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round"/><line x1="304" y1="176" x2="340" y2="176" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round"/><line x1="384" y1="176" x2="420" y2="176" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round"/><line x1="520" y1="176" x2="800" y2="176" stroke="#2e6b3f" stroke-width="3.2" stroke-linecap="round"/><text x="30" y="226" font-size="14" fill="#23282d">Same enzyme, opposite use from second-strand synthesis, where RNase H makes primers. The exercise asks you to compare the two.</text>
</svg>
