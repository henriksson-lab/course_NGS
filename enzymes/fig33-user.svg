<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 214" width="968" height="214" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="214" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">USER opens a dU hairpin: remove the base, then break the backbone</text><text x="60" y="50" font-size="13.5" fill="#23282d">hairpin adapter with U in the loop</text><line x1="60" y1="110" x2="180" y2="110" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="134" x2="180" y2="134" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><path d="M 180 110 C 230 106, 230 138, 180 134" fill="none" stroke="#1f3b57" stroke-width="3"/><circle cx="220" cy="122" r="5" fill="#b4532a"/><text x="236" y="126" font-size="13" fill="#b4532a" font-weight="bold">U</text><text x="480" y="50" font-size="13.5" fill="#23282d">after USER: an open, forked adapter</text><line x1="480" y1="110" x2="600" y2="110" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="480" y1="134" x2="600" y2="134" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="600" y1="110" x2="640" y2="96" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="600" y1="134" x2="640" y2="148" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="420" y1="122" x2="465" y2="122" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 470 122 L 465 118.5 L 465 125.5 Z" fill="#b4532a"/><text x="396" y="100" font-size="12" fill="#b4532a">UDG + EndoVIII</text><text x="30" y="196" font-size="14" fill="#23282d">NEBNext-type kits ligate a closed hairpin so the ends cannot join each other, then open it. The same USER digests dU-marked strands.</text>
</svg>
