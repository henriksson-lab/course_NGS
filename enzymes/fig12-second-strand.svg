<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 318" width="912" height="318" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="318" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Second-strand synthesis from an RNA:DNA hybrid: RNase H makes the primers, Pol I extends them</text><text x="30" y="54" font-size="13.5" fill="#23282d">1. first-strand cDNA (blue) with its RNA (orange)</text><line x1="60" y1="94" x2="620" y2="94" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="round"/><line x1="60" y1="82" x2="620" y2="82" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round"/><text x="30" y="130" font-size="13.5" fill="#23282d">2. RNase H nicks the RNA: its fragments are now primers with 3'-OH</text><line x1="60" y1="170" x2="620" y2="170" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="round"/><line x1="60" y1="158" x2="166" y2="158" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round"/><line x1="200" y1="158" x2="306" y2="158" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round"/><line x1="340" y1="158" x2="446" y2="158" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round"/><line x1="480" y1="158" x2="596" y2="158" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round"/><text x="30" y="206" font-size="13.5" fill="#23282d">3. Pol I extends each fragment and its 5'→3' exo eats the next: all RNA replaced by DNA</text><line x1="60" y1="246" x2="620" y2="246" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="round"/><line x1="60" y1="234" x2="190" y2="234" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="round"/><line x1="200" y1="234" x2="330" y2="234" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="round"/><line x1="340" y1="234" x2="470" y2="234" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="round"/><line x1="480" y1="234" x2="620" y2="234" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="round"/><text x="30" y="280" font-size="14" fill="#23282d">Short RNA pieces left on the strand act as the primers. A kit that skips RNase H and Pol I would leave single-stranded cDNA.</text><text x="30" y="302" font-size="14" fill="#8a8f94">[Gubler and Hoffman 1983, doi:10.1016/0378-1119(83)90230-5]</text>
</svg>
