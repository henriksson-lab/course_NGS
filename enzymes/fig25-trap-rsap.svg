<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 176" width="950" height="176" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="950" height="176" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">The phosphatase that was still active: a silent ligation failure</text><rect x="30" y="54" width="205" height="70" rx="4" fill="#e6e9ec" stroke="#2e6b3f" stroke-width="1.2"/><text x="40" y="80" font-size="13.5" fill="#23282d" font-weight="bold">rSAP on the fragments</text><text x="40" y="104" font-size="13" fill="#2e6b3f">5'-P removed</text><line x1="237" y1="89" x2="253" y2="89" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 258 89 L 253 85.5 L 253 92.5 Z" fill="#8a8f94"/><rect x="260" y="54" width="205" height="70" rx="4" fill="#f3dcd0" stroke="#a33a28" stroke-width="1.2"/><text x="270" y="80" font-size="13.5" fill="#23282d" font-weight="bold">inactivate (65 °C, 5 min)</text><text x="270" y="104" font-size="13" fill="#a33a28">skipped or too cool</text><line x1="467" y1="89" x2="483" y2="89" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 488 89 L 483 85.5 L 483 92.5 Z" fill="#8a8f94"/><rect x="490" y="54" width="205" height="70" rx="4" fill="#f3dcd0" stroke="#a33a28" stroke-width="1.2"/><text x="500" y="80" font-size="13.5" fill="#23282d" font-weight="bold">add 5'-P adapter + ligase</text><text x="500" y="104" font-size="13" fill="#a33a28">adapter 5'-P removed too</text><line x1="697" y1="89" x2="713" y2="89" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 718 89 L 713 85.5 L 713 92.5 Z" fill="#8a8f94"/><rect x="720" y="54" width="205" height="70" rx="4" fill="#f3dcd0" stroke="#a33a28" stroke-width="1.2"/><text x="730" y="80" font-size="13.5" fill="#23282d" font-weight="bold">result</text><text x="730" y="104" font-size="13" fill="#a33a28">no product, no error</text><text x="30" y="160" font-size="14" fill="#23282d">rSAP is heat-labile for exactly this reason. A phosphatase that survives dephosphorylates the very adapters you add next.</text>
</svg>
