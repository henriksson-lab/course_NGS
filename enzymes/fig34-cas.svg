<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 975 274" width="975" height="274" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="274" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Cas9 and Cas12a: where the guide pairs, the PAM sits, and what the cut leaves</text><text x="30" y="44" font-size="13.5" fill="#23282d">Cas9: PAM (NGG) 3' of the target; blunt cut 3 bp from the PAM</text><line x1="60" y1="80" x2="600" y2="80" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="98" x2="600" y2="98" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="500" y="70" width="60" height="14" rx="4" fill="#f3dcd0" stroke="#b4532a" stroke-width="1.2"/><text x="530" y="64" font-size="12" text-anchor="middle" fill="#b4532a">PAM</text><line x1="160" y1="60" x2="500" y2="60" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="154" y="64" font-size="11.5" text-anchor="end" fill="#1f3b57">guide</text><line x1="470" y1="70" x2="470" y2="110" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><text x="30" y="144" font-size="13.5" fill="#23282d">Cas12a: PAM (TTTV) 5' of the target; staggered cut far from the PAM</text><line x1="60" y1="180" x2="600" y2="180" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="198" x2="600" y2="198" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="100" y="170" width="60" height="14" rx="4" fill="#f3dcd0" stroke="#b4532a" stroke-width="1.2"/><text x="130" y="164" font-size="12" text-anchor="middle" fill="#b4532a">PAM</text><line x1="160" y1="160" x2="500" y2="160" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="506" y="164" font-size="11.5" fill="#1f3b57">guide</text><line x1="430" y1="170" x2="430" y2="192" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="460" y1="188" x2="460" y2="210" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><text x="30" y="236" font-size="14" fill="#23282d">A blunt cut ligates to anything; a staggered cut leaves a short 5' overhang. Cas12a also shreds nearby single strands once activated.</text><text x="30" y="258" font-size="14" fill="#8a8f94">[Jinek 2012, doi:10.1126/science.1225829]  [Zetsche 2015, doi:10.1016/j.cell.2015.09.038]</text>
</svg>
