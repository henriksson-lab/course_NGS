<text x="30" y="26" font-size="14.5" fill="#23282d">Cutting chromatin: MNase trims the linkers, DNase I enters open DNA</text><line x1="40" y1="110" x2="740" y2="110" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><circle cx="110" cy="110" r="26" fill="#e6e9ec" stroke="#8a8f94" stroke-width="2"/><circle cx="230" cy="110" r="26" fill="#e6e9ec" stroke="#8a8f94" stroke-width="2"/><circle cx="350" cy="110" r="26" fill="#e6e9ec" stroke="#8a8f94" stroke-width="2"/><circle cx="620" cy="110" r="26" fill="#e6e9ec" stroke="#8a8f94" stroke-width="2"/><text x="170" y="78" font-size="16" text-anchor="middle" fill="#b4532a">✂</text><text x="290" y="78" font-size="16" text-anchor="middle" fill="#b4532a">✂</text><text x="440" y="78" font-size="16" text-anchor="middle" fill="#b4532a">✂</text><text x="565" y="78" font-size="16" text-anchor="middle" fill="#b4532a">✂</text><text x="690" y="78" font-size="16" text-anchor="middle" fill="#b4532a">✂</text><text x="170" y="60" font-size="12.5" text-anchor="middle" fill="#b4532a">MNase</text><text x="500" y="60" font-size="12.5" text-anchor="middle" fill="#b4532a">open region: DNase I</text><text x="110" y="160" font-size="12.5" text-anchor="middle" fill="#8a8f94">~147 bp</text><text x="230" y="160" font-size="12.5" text-anchor="middle" fill="#8a8f94">protected</text><text x="30" y="204" font-size="14" fill="#23282d">MNase leaves 5'-OH and 3'-phosphate: repair before ligation. DNase I leaves 5'-P and 3'-OH. Ca2+ activates MNase, Mg2+ DNase I.</text><text x="30" y="226" font-size="14" fill="#8a8f94">[Boyle 2008, doi:10.1016/j.cell.2007.12.014]</text>
