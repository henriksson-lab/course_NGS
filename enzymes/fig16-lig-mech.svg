<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 212" width="920" height="212" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="920" height="212" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Ligation is three transfers, and the 3 steps explain every requirement</text><rect x="30" y="50" width="270" height="92" rx="4" fill="#e6e9ec" stroke="#8a8f94" stroke-width="1.2"/><text x="42" y="74" font-size="14" fill="#23282d" font-weight="bold">1. enzyme + ATP</text><text x="42" y="100" font-size="13.5" fill="#1f3b57">enzyme–AMP + PPi</text><text x="42" y="124" font-size="12.5" fill="#8a8f94">(NAD+ in bacteria: gives NMN)</text><line x1="302" y1="96" x2="323" y2="96" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 328 96 L 323 92.5 L 323 99.5 Z" fill="#8a8f94"/><rect x="330" y="50" width="270" height="92" rx="4" fill="#e6e9ec" stroke="#8a8f94" stroke-width="1.2"/><text x="342" y="74" font-size="14" fill="#23282d" font-weight="bold">2. AMP moves to the 5'-phosphate</text><text x="342" y="100" font-size="13.5" fill="#1f3b57">5' end becomes 5'–App</text><text x="342" y="124" font-size="12.5" fill="#8a8f94">(an activated pyrophosphate)</text><line x1="602" y1="96" x2="623" y2="96" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 628 96 L 623 92.5 L 623 99.5 Z" fill="#8a8f94"/><rect x="630" y="50" width="270" height="92" rx="4" fill="#e6e9ec" stroke="#8a8f94" stroke-width="1.2"/><text x="642" y="74" font-size="14" fill="#23282d" font-weight="bold">3. the 3'-OH attacks it</text><text x="642" y="100" font-size="13.5" fill="#1f3b57">phosphodiester forms, AMP leaves</text><text x="642" y="124" font-size="12.5" fill="#8a8f94">(a nick is sealed)</text><text x="30" y="172" font-size="14" fill="#23282d">Needs: 5'-phosphate on one side, 3'-OH on the other, both held in a duplex (a nick). No 5'-P, no step 2.</text><text x="30" y="194" font-size="14" fill="#8a8f94">[Lehman 1974, doi:10.1126/science.186.4166.790]</text>
</svg>
