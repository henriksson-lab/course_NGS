<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 573 232" width="573" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="509" height="232" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">EM-seq: no bisulfite. Enzymes protect modified C, then deaminate the rest</text><text x="30" y="62" font-size="13.5" fill="#23282d" font-weight="bold">Base</text><text x="79.0" y="62" font-size="13.5" fill="#23282d" font-weight="bold">TET2 + T4-BGT</text><text x="236.0" y="62" font-size="13.5" fill="#23282d" font-weight="bold">APOBEC3A</text><text x="352.5" y="62" font-size="13.5" fill="#23282d" font-weight="bold">Read after PCR</text><line x1="26" y1="70" x2="459.0" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="94" font-size="13.5" fill="#23282d" font-weight="bold">C</text><text x="79.0" y="94" font-size="13.5" fill="#23282d">unchanged</text><text x="236.0" y="94" font-size="13.5" fill="#23282d">→ U</text><text x="352.5" y="94" font-size="13.5" fill="#23282d">T</text><rect x="24" y="104" width="433.0" height="32" fill="#e6e9ec" opacity="0.55"/><text x="30" y="126" font-size="13.5" fill="#23282d" font-weight="bold">5mC</text><text x="79.0" y="126" font-size="13.5" fill="#23282d">oxidised to 5caC</text><text x="236.0" y="126" font-size="13.5" fill="#8a8f94">not deaminated</text><text x="352.5" y="126" font-size="13.5" fill="#23282d">C</text><text x="30" y="158" font-size="13.5" fill="#23282d" font-weight="bold">5hmC</text><text x="79.0" y="158" font-size="13.5" fill="#23282d">glucosylated to 5gmC</text><text x="236.0" y="158" font-size="13.5" fill="#8a8f94">not deaminated</text><text x="352.5" y="158" font-size="13.5" fill="#23282d">C</text><text x="30" y="194" font-size="14" fill="#23282d">Intact long DNA is the benefit: bisulfite fragments DNA, this does not.</text><text x="30" y="216" font-size="14" fill="#8a8f94">[Vaisvila 2021, doi:10.1101/gr.266551.120]</text>
</svg>
