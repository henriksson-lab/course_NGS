<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1171 272" width="1171" height="272" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="272" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Two loaded adapters, four outcomes: only A at one end and B at the other amplifies</text><line x1="120" y1="64" x2="360" y2="64" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="98" y="55" width="22" height="18" rx="4" fill="#e6e9ec" stroke="#1f3b57" stroke-width="1.2"/><text x="109.0" y="68.55" font-size="13" text-anchor="middle" fill="#23282d">A</text><rect x="360" y="55" width="22" height="18" rx="4" fill="#e6e9ec" stroke="#1f3b57" stroke-width="1.2"/><text x="371.0" y="68.55" font-size="13" text-anchor="middle" fill="#23282d">A</text><text x="400" y="69" font-size="13.5" fill="#8a8f94">25 %  no: the same adapter at both ends folds back</text><line x1="120" y1="104" x2="360" y2="104" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="98" y="95" width="22" height="18" rx="4" fill="#e6e9ec" stroke="#b4532a" stroke-width="1.2"/><text x="109.0" y="108.55" font-size="13" text-anchor="middle" fill="#23282d">B</text><rect x="360" y="95" width="22" height="18" rx="4" fill="#e6e9ec" stroke="#b4532a" stroke-width="1.2"/><text x="371.0" y="108.55" font-size="13" text-anchor="middle" fill="#23282d">B</text><text x="400" y="109" font-size="13.5" fill="#8a8f94">25 %  no: the same</text><line x1="120" y1="144" x2="360" y2="144" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="98" y="135" width="22" height="18" rx="4" fill="#e6e9ec" stroke="#1f3b57" stroke-width="1.2"/><text x="109.0" y="148.55" font-size="13" text-anchor="middle" fill="#23282d">A</text><rect x="360" y="135" width="22" height="18" rx="4" fill="#e6e9ec" stroke="#b4532a" stroke-width="1.2"/><text x="371.0" y="148.55" font-size="13" text-anchor="middle" fill="#23282d">B</text><text x="400" y="149" font-size="13.5" fill="#2e6b3f">25 %  yes</text><line x1="120" y1="184" x2="360" y2="184" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="98" y="175" width="22" height="18" rx="4" fill="#e6e9ec" stroke="#b4532a" stroke-width="1.2"/><text x="109.0" y="188.55" font-size="13" text-anchor="middle" fill="#23282d">B</text><rect x="360" y="175" width="22" height="18" rx="4" fill="#e6e9ec" stroke="#1f3b57" stroke-width="1.2"/><text x="371.0" y="188.55" font-size="13" text-anchor="middle" fill="#23282d">A</text><text x="400" y="189" font-size="13.5" fill="#2e6b3f">25 %  yes</text><text x="30" y="234" font-size="14" fill="#23282d">Half the fragments are productive. A single loaded sequence (identical at both ends) cannot make that distinction, so the second adapter is added by PCR instead.</text><text x="30" y="256" font-size="14" fill="#8a8f94">[Picelli 2014, doi:10.1101/gr.177881.114]</text>
</svg>
