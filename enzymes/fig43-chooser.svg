<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 691 353" width="691" height="353" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="691" height="353" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Choosing an enzyme: name the step, find the deciding property</text><text x="30" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Step</text><text x="214.5" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Deciding property</text><text x="511.5" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Enzyme family</text><line x1="26" y1="70" x2="661.0" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="89" font-size="12.5" fill="#23282d" font-weight="bold">End repair, make blunt</text><text x="214.5" y="89" font-size="12.5" fill="#23282d">3'→5' exo and a 5'→3' pol, no displacement</text><text x="511.5" y="89" font-size="12.5" fill="#23282d">T4 DNA pol (+ Klenow)</text><rect x="24" y="99" width="635.0" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="116" font-size="12.5" fill="#23282d" font-weight="bold">Add one A</text><text x="214.5" y="116" font-size="12.5" fill="#23282d">3' addition without a template, no 3'→5' exo</text><text x="511.5" y="116" font-size="12.5" fill="#23282d">Klenow exo−, Taq</text><text x="30" y="143" font-size="12.5" fill="#23282d" font-weight="bold">Library PCR</text><text x="214.5" y="143" font-size="12.5" fill="#23282d">fidelity, longest product, uracil tolerance</text><text x="511.5" y="143" font-size="12.5" fill="#23282d">HiFi polymerase</text><rect x="24" y="153" width="635.0" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="170" font-size="12.5" fill="#23282d" font-weight="bold">Whole-genome amplification</text><text x="214.5" y="170" font-size="12.5" fill="#23282d">strand displacement, processivity</text><text x="511.5" y="170" font-size="12.5" fill="#23282d">phi29, Bst</text><text x="30" y="197" font-size="12.5" fill="#23282d" font-weight="bold">First-strand cDNA</text><text x="214.5" y="197" font-size="12.5" fill="#23282d">RT activity, RNase H, temperature</text><text x="511.5" y="197" font-size="12.5" fill="#23282d">MMLV-type RT</text><rect x="24" y="207" width="635.0" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="224" font-size="12.5" fill="#23282d" font-weight="bold">Second strand</text><text x="214.5" y="224" font-size="12.5" fill="#23282d">RNA primer extension, nick extension</text><text x="511.5" y="224" font-size="12.5" fill="#23282d">Pol I + RNase H</text><text x="30" y="251" font-size="12.5" fill="#23282d" font-weight="bold">Join DNA ends</text><text x="214.5" y="251" font-size="12.5" fill="#23282d">donor chemistry, end type</text><text x="511.5" y="251" font-size="12.5" fill="#23282d">T4 DNA ligase</text><rect x="24" y="261" width="635.0" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="278" font-size="12.5" fill="#23282d" font-weight="bold">Join a small RNA</text><text x="214.5" y="278" font-size="12.5" fill="#23282d">pre-adenylated donor, no ATP</text><text x="511.5" y="278" font-size="12.5" fill="#23282d">truncated RNA ligase 2</text><text x="30" y="305" font-size="12.5" fill="#23282d" font-weight="bold">Cut and tag at once</text><text x="214.5" y="305" font-size="12.5" fill="#23282d">9 nt stagger, loaded ends</text><text x="511.5" y="305" font-size="12.5" fill="#23282d">Tn5</text><text x="30" y="339" font-size="14" fill="#8a8f94">Then check the chart for the one column that would make the step fail silently.</text>
</svg>
