<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 807 264" width="807" height="264" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="655" height="264" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">One library, one end state at a time</text><text x="30" y="62" font-size="13" fill="#23282d" font-weight="bold">Step</text><text x="104.0" y="62" font-size="13" fill="#23282d" font-weight="bold">Enzyme</text><text x="249.5" y="62" font-size="13" fill="#23282d" font-weight="bold">End state in</text><text x="434.0" y="62" font-size="13" fill="#23282d" font-weight="bold">End state out</text><line x1="26" y1="70" x2="615.0" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="92" font-size="13" fill="#23282d" font-weight="bold">end prep</text><text x="104.0" y="92" font-size="13" fill="#23282d">T4 PNK + T4 DNA pol</text><text x="249.5" y="92" font-size="13" fill="#23282d">ragged, 5'-OH or P</text><text x="434.0" y="92" font-size="13" fill="#23282d">blunt, 5'-P, 3'-OH</text><rect x="24" y="102" width="589.0" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="122" font-size="13" fill="#23282d" font-weight="bold">A-tail</text><text x="104.0" y="122" font-size="13" fill="#23282d">Klenow exo− / Taq</text><text x="249.5" y="122" font-size="13" fill="#23282d">blunt</text><text x="434.0" y="122" font-size="13" fill="#23282d">3'-A overhang</text><text x="30" y="152" font-size="13" fill="#23282d" font-weight="bold">ligate</text><text x="104.0" y="152" font-size="13" fill="#23282d">T4 DNA ligase</text><text x="249.5" y="152" font-size="13" fill="#23282d">3'-A + T-overhang adapter</text><text x="434.0" y="152" font-size="13" fill="#23282d">insert with adapter, nicks</text><rect x="24" y="162" width="589.0" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="182" font-size="13" fill="#23282d" font-weight="bold">cut loop</text><text x="104.0" y="182" font-size="13" fill="#23282d">USER</text><text x="249.5" y="182" font-size="13" fill="#23282d">closed hairpin adapter</text><text x="434.0" y="182" font-size="13" fill="#23282d">open Y-shaped adapter</text><text x="30" y="212" font-size="13" fill="#23282d" font-weight="bold">amplify</text><text x="104.0" y="212" font-size="13" fill="#23282d">HiFi polymerase</text><text x="249.5" y="212" font-size="13" fill="#23282d">adapter-flanked insert</text><text x="434.0" y="212" font-size="13" fill="#23282d">many copies, blunt</text><text x="30" y="248" font-size="14" fill="#23282d">Wrong enzyme at any row and the next row's 'in' does not match. Check a step by comparing its two end states.</text>
</svg>
