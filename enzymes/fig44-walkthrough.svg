<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 891 282" width="891" height="282" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="869" height="282" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">TruSeq DNA PCR-free: one row per step, and the row only the PCR kits use</text><text x="30" y="62" font-size="13" fill="#23282d" font-weight="bold">Step</text><text x="117.0" y="62" font-size="13" fill="#23282d" font-weight="bold">Enzyme</text><text x="431.5" y="62" font-size="13" fill="#23282d" font-weight="bold">End state in</text><text x="616.0" y="62" font-size="13" fill="#23282d" font-weight="bold">End state out</text><line x1="26" y1="70" x2="829.5" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="92" font-size="13" fill="#23282d" font-weight="bold">shear</text><text x="117.0" y="92" font-size="13" fill="#8a8f94">none: acoustic shearing</text><text x="431.5" y="92" font-size="13" fill="#23282d">intact genomic DNA</text><text x="616.0" y="92" font-size="13" fill="#23282d">~350 bp, ragged, 5'-OH or P</text><rect x="24" y="102" width="803.5" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="122" font-size="13" fill="#23282d" font-weight="bold">end repair</text><text x="117.0" y="122" font-size="13" fill="#23282d">T4 DNA pol + T4 PNK</text><text x="431.5" y="122" font-size="13" fill="#23282d">ragged, 5'-OH or P</text><text x="616.0" y="122" font-size="13" fill="#23282d">blunt, 5'-P, 3'-OH</text><text x="30" y="152" font-size="13" fill="#23282d" font-weight="bold">A-tail</text><text x="117.0" y="152" font-size="13" fill="#23282d">Klenow exo− + dATP</text><text x="431.5" y="152" font-size="13" fill="#23282d">blunt</text><text x="616.0" y="152" font-size="13" fill="#23282d">3'-A overhang</text><rect x="24" y="162" width="803.5" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="182" font-size="13" fill="#23282d" font-weight="bold">ligate</text><text x="117.0" y="182" font-size="13" fill="#23282d">T4 DNA ligase</text><text x="431.5" y="182" font-size="13" fill="#23282d">3'-A + T-overhang adapter</text><text x="616.0" y="182" font-size="13" fill="#23282d">full-length adapter on each end</text><text x="30" y="212" font-size="13" fill="#23282d" font-weight="bold">amplify</text><text x="117.0" y="212" font-size="13" fill="#8a8f94">not in PCR-free; HiFi pol with a stub adapter</text><text x="431.5" y="212" font-size="13" fill="#23282d">adapter-flanked insert</text><text x="616.0" y="212" font-size="13" fill="#23282d">many copies, blunt</text><text x="30" y="248" font-size="14" fill="#23282d">Every row's end state out is the next row's end state in. Wrong enzyme at any row and the next row's 'in' does not match.</text><text x="30" y="268" font-size="14" fill="#8a8f94">Tn5 does rows 1 to 4 in one reaction. PCR-free stops after row 4, which is why it needs micrograms of input.</text>
</svg>
