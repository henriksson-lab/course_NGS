<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 373" width="856" height="373" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="794" height="373" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Nucleases sorted by what they need and what they leave</text><text x="30" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Group</text><text x="227.0" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Cuts</text><text x="411.5" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Substrate</text><text x="564.75" y="62" font-size="12.5" fill="#23282d" font-weight="bold">Typical product</text><line x1="26" y1="70" x2="764.25" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="89" font-size="12.5" fill="#23282d" font-weight="bold">Type II (EcoRI, MspI)</text><text x="227.0" y="89" font-size="12.5" fill="#23282d">inside a palindrome</text><text x="411.5" y="89" font-size="12.5" fill="#23282d">dsDNA, a site</text><text x="564.75" y="89" font-size="12.5" fill="#23282d">5'-P, 3'-OH; overhang or blunt</text><rect x="24" y="99" width="738.25" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="116" font-size="12.5" fill="#23282d" font-weight="bold">Type IIS / IIG (BsaI, MmeI)</text><text x="227.0" y="116" font-size="12.5" fill="#23282d">a fixed distance away</text><text x="411.5" y="116" font-size="12.5" fill="#23282d">dsDNA, a site</text><text x="564.75" y="116" font-size="12.5" fill="#23282d">designable overhang</text><text x="30" y="143" font-size="12.5" fill="#23282d" font-weight="bold">Nicking enzymes</text><text x="227.0" y="143" font-size="12.5" fill="#23282d">one strand only</text><text x="411.5" y="143" font-size="12.5" fill="#23282d">dsDNA, a site</text><text x="564.75" y="143" font-size="12.5" fill="#23282d">nick with 3'-OH</text><rect x="24" y="153" width="738.25" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="170" font-size="12.5" fill="#23282d" font-weight="bold">Exonucleases (Exo I, III, λ)</text><text x="227.0" y="170" font-size="12.5" fill="#23282d">from an end</text><text x="411.5" y="170" font-size="12.5" fill="#23282d">ss or ds, by end type</text><text x="564.75" y="170" font-size="12.5" fill="#23282d">shortened molecules</text><text x="30" y="197" font-size="12.5" fill="#23282d" font-weight="bold">RNase H</text><text x="227.0" y="197" font-size="12.5" fill="#23282d">RNA in a hybrid</text><text x="411.5" y="197" font-size="12.5" fill="#23282d">RNA:DNA</text><text x="564.75" y="197" font-size="12.5" fill="#23282d">RNA fragments</text><rect x="24" y="207" width="738.25" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="224" font-size="12.5" fill="#23282d" font-weight="bold">RNase I, S1, mung bean</text><text x="227.0" y="224" font-size="12.5" fill="#23282d">single strands</text><text x="411.5" y="224" font-size="12.5" fill="#23282d">ssRNA / ssDNA</text><text x="564.75" y="224" font-size="12.5" fill="#23282d">short pieces</text><text x="30" y="251" font-size="12.5" fill="#23282d" font-weight="bold">DNase I, MNase</text><text x="227.0" y="251" font-size="12.5" fill="#23282d">anywhere, by accessibility</text><text x="411.5" y="251" font-size="12.5" fill="#23282d">dsDNA (MNase also ss)</text><text x="564.75" y="251" font-size="12.5" fill="#23282d">mixed ends</text><rect x="24" y="261" width="738.25" height="27" fill="#e6e9ec" opacity="0.55"/><text x="30" y="278" font-size="12.5" fill="#23282d" font-weight="bold">USER (UDG + EndoVIII)</text><text x="227.0" y="278" font-size="12.5" fill="#23282d">at a uracil</text><text x="411.5" y="278" font-size="12.5" fill="#23282d">dU in DNA</text><text x="564.75" y="278" font-size="12.5" fill="#23282d">a gap</text><text x="30" y="305" font-size="12.5" fill="#23282d" font-weight="bold">Cas9, Cas12a RNPs</text><text x="227.0" y="305" font-size="12.5" fill="#23282d">where the guide pairs</text><text x="411.5" y="305" font-size="12.5" fill="#23282d">dsDNA + a PAM</text><text x="564.75" y="305" font-size="12.5" fill="#23282d">blunt or staggered</text><text x="30" y="339" font-size="14" fill="#8a8f94">Three questions for any nuclease: what does it need, where does it cut, what end does it leave?</text><text x="30" y="359" font-size="14" fill="#8a8f94">An RNP is the nuclease loaded with its guide RNA before use; a PAM is the short motif it must find beside the match.</text>
</svg>
