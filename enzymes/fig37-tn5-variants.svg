<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 254" width="980" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="980" height="254" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Where Tn5 lands is set by what it is attached to</text><text x="30" y="54" font-size="13.5" fill="#23282d">free transposome: anywhere</text><line x1="40" y1="110" x2="260" y2="110" stroke="#4a6b8a" stroke-width="2.6" stroke-linecap="round"/><rect x="110" y="80" width="30" height="26" rx="4" fill="#f3dcd0" stroke="#b4532a" stroke-width="1.2"/><text x="125.0" y="96.85" font-size="11" text-anchor="middle" fill="#23282d">Tn5</text><text x="310" y="54" font-size="13.5" fill="#23282d">ATAC-seq: only nucleosome-free DNA</text><line x1="320" y1="110" x2="600" y2="110" stroke="#4a6b8a" stroke-width="2.6" stroke-linecap="round"/><circle cx="360" cy="110" r="20" fill="#e6e9ec" stroke="#8a8f94" stroke-width="2"/><circle cx="450" cy="110" r="20" fill="#e6e9ec" stroke="#8a8f94" stroke-width="2"/><circle cx="540" cy="110" r="20" fill="#e6e9ec" stroke="#8a8f94" stroke-width="2"/><rect x="396" y="80" width="30" height="26" rx="4" fill="#f3dcd0" stroke="#b4532a" stroke-width="1.2"/><text x="411.0" y="96.85" font-size="11" text-anchor="middle" fill="#23282d">Tn5</text><rect x="486" y="80" width="30" height="26" rx="4" fill="#f3dcd0" stroke="#b4532a" stroke-width="1.2"/><text x="501.0" y="96.85" font-size="11" text-anchor="middle" fill="#23282d">Tn5</text><text x="650" y="54" font-size="13.5" fill="#23282d">CUT&amp;Tag: protein A–Tn5 on an antibody</text><line x1="660" y1="166" x2="940" y2="166" stroke="#4a6b8a" stroke-width="2.6" stroke-linecap="round"/><circle cx="800" cy="166" r="20" fill="#e6e9ec" stroke="#8a8f94" stroke-width="2"/><line x1="800" y1="146" x2="800" y2="112" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><line x1="800" y1="112" x2="788" y2="96" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><line x1="800" y1="112" x2="812" y2="96" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><rect x="776" y="70" width="48" height="22" rx="4" fill="#f3dcd0" stroke="#b4532a" stroke-width="1.2"/><text x="800.0" y="84.85" font-size="11" text-anchor="middle" fill="#23282d">pA–Tn5</text><text x="30" y="216" font-size="14" fill="#23282d">Loaded: sold with its adapters bound. Fused: Tn5 joined to a targeting protein. Same chemistry, different address.</text><text x="30" y="238" font-size="14" fill="#8a8f94">[Buenrostro 2013, doi:10.1038/nmeth.2688]  [Kaya-Okur 2019, doi:10.1038/s41467-019-09982-5]</text>
</svg>
