<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 923 308" width="923" height="308" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="308" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">dUTP marks the second strand: a polymerase that reads through U keeps both, one that cannot loses it</text><line x1="60" y1="70" x2="460" y2="70" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="92" x2="460" y2="92" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="92" r="4" fill="#b4532a"/><circle cx="128" cy="92" r="4" fill="#b4532a"/><circle cx="176" cy="92" r="4" fill="#b4532a"/><circle cx="224" cy="92" r="4" fill="#b4532a"/><circle cx="272" cy="92" r="4" fill="#b4532a"/><circle cx="320" cy="92" r="4" fill="#b4532a"/><circle cx="368" cy="92" r="4" fill="#b4532a"/><circle cx="416" cy="92" r="4" fill="#b4532a"/><text x="470" y="74" font-size="13" fill="#1f3b57">first strand: dTTP</text><text x="470" y="97" font-size="13" fill="#b4532a">second strand: dUTP (orange dots)</text><text x="30" y="54" font-size="13.5" fill="#23282d">library with a dU-marked second strand</text><text x="30" y="150" font-size="13.5" fill="#2e6b3f">U-intolerant HiFi polymerase (or USER): the dU strand is not copied or is cut</text><line x1="60" y1="170" x2="460" y2="170" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="470" y="174" font-size="13.5" fill="#2e6b3f">only the first strand is amplified: strand of origin is preserved</text><text x="30" y="218" font-size="13.5" fill="#a33a28">U-tolerant polymerase: both strands are amplified</text><line x1="60" y1="238" x2="460" y2="238" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="256" x2="460" y2="256" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="470" y="248" font-size="13.5" fill="#a33a28">strand information is lost, and nothing tells you</text><text x="30" y="292" font-size="14" fill="#8a8f94">[Parkhomchuk 2009, doi:10.1093/nar/gkp596]  [Levin 2010, doi:10.1038/nmeth.1491]  [Greagg 1999, doi:10.1073/pnas.96.16.9045]</text>
</svg>
