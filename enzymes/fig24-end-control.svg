<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 905 234" width="905" height="234" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="602" height="234" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Control which ends can ligate: read the table by end state</text><text x="30" y="62" font-size="13" fill="#23282d" font-weight="bold">End state</text><text x="221.0" y="62" font-size="13" fill="#23282d" font-weight="bold">donor</text><text x="275.5" y="62" font-size="13" fill="#23282d" font-weight="bold">acceptor</text><text x="349.5" y="62" font-size="13" fill="#23282d" font-weight="bold">after rSAP</text><text x="462.5" y="62" font-size="13" fill="#23282d" font-weight="bold">after PNK + ATP</text><line x1="26" y1="70" x2="572.0" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="92" font-size="13" fill="#23282d" font-weight="bold">5'-P, 3'-OH</text><text x="221.0" y="92" font-size="13" fill="#1f3b57">yes</text><text x="275.5" y="92" font-size="13" fill="#1f3b57">yes</text><text x="349.5" y="92" font-size="13" fill="#23282d">5'-OH, 3'-OH</text><text x="462.5" y="92" font-size="13" fill="#23282d">unchanged</text><rect x="24" y="102" width="546.0" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="122" font-size="13" fill="#23282d" font-weight="bold">5'-OH, 3'-OH</text><text x="221.0" y="122" font-size="13" fill="#8a8f94">no</text><text x="275.5" y="122" font-size="13" fill="#1f3b57">yes</text><text x="349.5" y="122" font-size="13" fill="#23282d">unchanged</text><text x="462.5" y="122" font-size="13" fill="#23282d">5'-P, 3'-OH</text><text x="30" y="152" font-size="13" fill="#23282d" font-weight="bold">5'-OH, 3'-P (MNase cut)</text><text x="221.0" y="152" font-size="13" fill="#8a8f94">no</text><text x="275.5" y="152" font-size="13" fill="#8a8f94">no</text><text x="349.5" y="152" font-size="13" fill="#23282d">5'-OH, 3'-OH</text><text x="462.5" y="152" font-size="13" fill="#23282d">5'-P, 3'-OH</text><rect x="24" y="162" width="546.0" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="182" font-size="13" fill="#23282d" font-weight="bold">5'-P, 3'-blocked (adapter)</text><text x="221.0" y="182" font-size="13" fill="#1f3b57">yes</text><text x="275.5" y="182" font-size="13" fill="#8a8f94">no</text><text x="349.5" y="182" font-size="13" fill="#23282d">5'-OH, blocked</text><text x="462.5" y="182" font-size="13" fill="#23282d">unchanged</text><text x="30" y="218" font-size="14" fill="#23282d">Dephosphorylate to stop unwanted joins, re-phosphorylate only what you want to join. Between them, destroy the phosphatase.</text>
</svg>
