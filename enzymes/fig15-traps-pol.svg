<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 853 234" width="853" height="234" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="853" height="234" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Four silent failures: an activity nobody asked for</text><text x="30" y="62" font-size="13" fill="#23282d" font-weight="bold">Step</text><text x="240.5" y="62" font-size="13" fill="#23282d" font-weight="bold">Wrong choice</text><text x="412.0" y="62" font-size="13" fill="#23282d" font-weight="bold">Unwanted activity</text><text x="590.0" y="62" font-size="13" fill="#23282d" font-weight="bold">What you see</text><line x1="26" y1="70" x2="823.0" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="92" font-size="13" fill="#23282d" font-weight="bold">A-tail for TA ligation</text><text x="240.5" y="92" font-size="13" fill="#23282d">HiFi polymerase</text><text x="412.0" y="92" font-size="13" fill="#23282d">3'→5' exo removes the A</text><text x="590.0" y="92" font-size="13" fill="#23282d">blunt ends, adapters do not ligate</text><rect x="24" y="102" width="797.0" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="122" font-size="13" fill="#23282d" font-weight="bold">Keep a nick as a strand mark</text><text x="240.5" y="122" font-size="13" fill="#23282d">Taq or Pol I</text><text x="412.0" y="122" font-size="13" fill="#23282d">5'→3' exo moves the nick</text><text x="590.0" y="122" font-size="13" fill="#23282d">the mark is gone, strand lost</text><text x="30" y="152" font-size="13" fill="#23282d" font-weight="bold">3'-blocked oligo as a blocker</text><text x="240.5" y="152" font-size="13" fill="#23282d">proofreading polymerase</text><text x="412.0" y="152" font-size="13" fill="#23282d">3'→5' exo eats the block</text><text x="590.0" y="152" font-size="13" fill="#23282d">the oligo now primes</text><rect x="24" y="162" width="797.0" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="182" font-size="13" fill="#23282d" font-weight="bold">dU-marked strand to drop</text><text x="240.5" y="182" font-size="13" fill="#23282d">U-tolerant polymerase</text><text x="412.0" y="182" font-size="13" fill="#23282d">reads through uracil</text><text x="590.0" y="182" font-size="13" fill="#23282d">unstranded library, no warning</text><text x="30" y="218" font-size="14" fill="#23282d">None of these produces an error. Each is visible only in a later step or in the data.</text>
</svg>
