<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 206" width="980" height="206" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="980" height="206" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">T7 RNA polymerase as a linear amplifier: a promoter on the primer, then many RNAs per DNA</text><rect x="30" y="56" width="215" height="72" rx="4" fill="#e6e9ec" stroke="#1f3b57" stroke-width="1.2"/><text x="40" y="86" font-size="13" fill="#23282d">oligo-dT primer carries</text><text x="40" y="108" font-size="13" fill="#23282d">a T7 promoter</text><line x1="247" y1="92" x2="263" y2="92" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 268 92 L 263 88.5 L 263 95.5 Z" fill="#8a8f94"/><rect x="270" y="56" width="215" height="72" rx="4" fill="#e6e9ec" stroke="#1f3b57" stroke-width="1.2"/><text x="280" y="86" font-size="13" fill="#23282d">first and second strand</text><text x="280" y="108" font-size="13" fill="#23282d">make dsDNA with the promoter</text><line x1="487" y1="92" x2="503" y2="92" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 508 92 L 503 88.5 L 503 95.5 Z" fill="#8a8f94"/><rect x="510" y="56" width="215" height="72" rx="4" fill="#e6e9ec" stroke="#b4532a" stroke-width="1.2"/><text x="520" y="86" font-size="13" fill="#23282d">T7 polymerase transcribes:</text><text x="520" y="108" font-size="13" fill="#23282d">hundreds of RNAs</text><line x1="727" y1="92" x2="743" y2="92" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 748 92 L 743 88.5 L 743 95.5 Z" fill="#8a8f94"/><rect x="750" y="56" width="215" height="72" rx="4" fill="#e6e9ec" stroke="#2e6b3f" stroke-width="1.2"/><text x="760" y="86" font-size="13" fill="#23282d">RNA is reverse-transcribed</text><text x="760" y="108" font-size="13" fill="#23282d">into a library</text><text x="30" y="168" font-size="14" fill="#23282d">Linear, not exponential: errors do not compound. Used where little RNA must be amplified fairly (CEL-Seq).</text><text x="30" y="190" font-size="14" fill="#8a8f94">[Hashimshony 2012, doi:10.1016/j.celrep.2012.08.003]</text>
</svg>
