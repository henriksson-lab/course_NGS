<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 274" width="720" height="274" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="274" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Mean errors per 300 bp molecule after 10 doublings ≈ length × rate × doublings</text><text x="30" y="71" font-size="13.5" fill="#23282d">Taq-class</text><text x="190" y="71" font-size="13" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>1e-04 / base</text><rect x="300" y="56" width="285" height="20" fill="#1f3b57"/><text x="593.3984878303763" y="71" font-size="13.5" fill="#23282d">0.3 errors</text><text x="30" y="109" font-size="13.5" fill="#23282d">in between</text><text x="190" y="109" font-size="13" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>1e-05 / base</text><rect x="300" y="94" width="215" height="20" fill="#1f3b57"/><text x="523.3984878303763" y="109" font-size="13.5" fill="#23282d">0.03 errors</text><text x="30" y="147" font-size="13.5" fill="#23282d">high-fidelity</text><text x="190" y="147" font-size="13" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>1e-06 / base</text><rect x="300" y="132" width="145" height="20" fill="#1f3b57"/><text x="453.3984878303763" y="147" font-size="13.5" fill="#23282d">0.003 errors</text><text x="30" y="185" font-size="13.5" fill="#23282d">proofreading, best case</text><text x="190" y="185" font-size="13" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>1e-07 / base</text><rect x="300" y="170" width="75" height="20" fill="#1f3b57"/><text x="383.3984878303763" y="185" font-size="13.5" fill="#23282d">0.0003 errors</text><text x="30" y="223" font-size="13.5" fill="#b4532a">sequencing itself</text><text x="190" y="223" font-size="13" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>~1e-3 / base</text><rect x="300" y="208" width="285" height="20" fill="#b4532a"/><text x="593.3984878303763" y="223" font-size="13.5" fill="#b4532a">0.3 per read</text><text x="30" y="258" font-size="14" fill="#23282d">Illustrative orders of magnitude, log scale. Library PCR rarely needs more than ~10 doublings.</text>
</svg>
