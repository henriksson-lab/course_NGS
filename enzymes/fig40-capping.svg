<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 707 234" width="707" height="234" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="707" height="234" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Telling capped mRNA from everything else by what is on the 5' end</text><text x="30" y="62" font-size="13" fill="#23282d" font-weight="bold">Step</text><text x="240.5" y="62" font-size="13" fill="#23282d" font-weight="bold">capped mRNA</text><text x="373.0" y="62" font-size="13" fill="#23282d" font-weight="bold">rRNA, processed RNA</text><text x="518.5" y="62" font-size="13" fill="#23282d" font-weight="bold">result</text><line x1="26" y1="70" x2="667.0" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="92" font-size="13" fill="#23282d" font-weight="bold">1. start</text><text x="240.5" y="92" font-size="13" fill="#23282d">m7G cap</text><text x="373.0" y="92" font-size="13" fill="#23282d">5'-monophosphate</text><text x="518.5" y="92" font-size="13" fill="#23282d"></text><rect x="24" y="102" width="641.0" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="122" font-size="13" fill="#23282d" font-weight="bold">2. 5'-P-dependent exonuclease</text><text x="240.5" y="122" font-size="13" fill="#23282d">survives</text><text x="373.0" y="122" font-size="13" fill="#23282d">destroyed</text><text x="518.5" y="122" font-size="13" fill="#23282d">enriched for cap</text><text x="30" y="152" font-size="13" fill="#23282d" font-weight="bold">3. decapping enzyme</text><text x="240.5" y="152" font-size="13" fill="#23282d">cap removed: 5'-P</text><text x="373.0" y="152" font-size="13" fill="#23282d">gone</text><text x="518.5" y="152" font-size="13" fill="#23282d">cap becomes ligatable</text><rect x="24" y="162" width="641.0" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="182" font-size="13" fill="#23282d" font-weight="bold">4. ligate a 5' adapter</text><text x="240.5" y="182" font-size="13" fill="#23282d">adapter joins</text><text x="373.0" y="182" font-size="13" fill="#8a8f94">–</text><text x="518.5" y="182" font-size="13" fill="#23282d">tags capped RNA only</text><text x="30" y="218" font-size="14" fill="#23282d">Each step needs its end state to be exactly as described: a cap, a phosphate, or a free 5'-P.</text>
</svg>
