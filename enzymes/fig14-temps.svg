<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1101 340" width="1101" height="340" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="340" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Extension temperature: what it buys you, and what limits it</text><text x="30" y="71" font-size="13.5" fill="#23282d">phi29</text><line x1="230" y1="66" x2="700" y2="66" stroke="#e6e9ec" stroke-width="14" stroke-linecap="butt"/><circle cx="406.25" cy="66" r="7" fill="#1f3b57"/><text x="30" y="105" font-size="13.5" fill="#23282d">T4 DNA polymerase</text><line x1="230" y1="100" x2="700" y2="100" stroke="#e6e9ec" stroke-width="14" stroke-linecap="butt"/><line x1="300.5" y1="100" x2="447.375" y2="100" stroke="#1f3b57" stroke-width="14" stroke-linecap="butt"/><text x="30" y="139" font-size="13.5" fill="#23282d">Klenow / exo−</text><line x1="230" y1="134" x2="700" y2="134" stroke="#e6e9ec" stroke-width="14" stroke-linecap="butt"/><circle cx="447.375" cy="134" r="7" fill="#1f3b57"/><text x="30" y="173" font-size="13.5" fill="#23282d">Bst large fragment</text><line x1="230" y1="168" x2="700" y2="168" stroke="#e6e9ec" stroke-width="14" stroke-linecap="butt"/><line x1="582.5" y1="168" x2="611.875" y2="168" stroke="#b4532a" stroke-width="14" stroke-linecap="butt"/><text x="30" y="207" font-size="13.5" fill="#23282d">Taq</text><line x1="230" y1="202" x2="700" y2="202" stroke="#e6e9ec" stroke-width="14" stroke-linecap="butt"/><line x1="629.5" y1="202" x2="653.0" y2="202" stroke="#4a6b8a" stroke-width="14" stroke-linecap="butt"/><text x="30" y="241" font-size="13.5" fill="#23282d">Q5 / Phusion / KAPA HiFi</text><line x1="230" y1="236" x2="700" y2="236" stroke="#e6e9ec" stroke-width="14" stroke-linecap="butt"/><circle cx="653.0" cy="236" r="7" fill="#4a6b8a"/><text x="230.0" y="272" font-size="12" text-anchor="middle" fill="#8a8f94">0 °C</text><text x="347.5" y="272" font-size="12" text-anchor="middle" fill="#8a8f94">20 °C</text><text x="465.0" y="272" font-size="12" text-anchor="middle" fill="#8a8f94">40 °C</text><text x="582.5" y="272" font-size="12" text-anchor="middle" fill="#8a8f94">60 °C</text><text x="700.0" y="272" font-size="12" text-anchor="middle" fill="#8a8f94">80 °C</text><text x="30" y="302" font-size="14" fill="#23282d">Hot extension melts hairpins and GC-rich structure and blocks mispriming. Cool extension keeps a polymerase that denatures at 95 °C out of the picture.</text><text x="30" y="324" font-size="14" fill="#23282d">A high temperature is why Bst and Taq families can copy structured DNA or RNA without help; low temperature is why phi29 never needs cycling.</text>
</svg>
