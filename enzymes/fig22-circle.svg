<text x="30" y="26" font-size="14.5" fill="#23282d">Circularisation: one molecule, two ends, one ligation</text><line x1="60" y1="90" x2="300" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="90" r="6" fill="#2e6b3f"/><circle cx="300" cy="90" r="6" fill="#a33a28"/><text x="60" y="120" font-size="13" text-anchor="middle" fill="#2e6b3f">5'-P</text><text x="300" y="120" font-size="13" text-anchor="middle" fill="#a33a28">3'-OH</text><line x1="330" y1="90" x2="395" y2="90" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 400 90 L 395 86.5 L 395 93.5 Z" fill="#b4532a"/><circle cx="480" cy="90" r="40" fill="none" stroke="#1f3b57" stroke-width="3"/><text x="540" y="94" font-size="13.5" fill="#23282d">dilute: ends find each other, not another molecule</text><text x="540" y="114" font-size="13.5" fill="#a33a28">concentrated: concatemers and chimeras</text><text x="30" y="168" font-size="14" fill="#23282d">Single-strand ligases close ssDNA or cDNA into circles. Used in ribosome profiling libraries and in single-stranded libraries of damaged DNA.</text><text x="30" y="190" font-size="14" fill="#8a8f94">[Ingolia 2009, doi:10.1126/science.1168978]</text>
