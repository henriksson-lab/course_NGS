<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 256" width="884" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="528" height="256" fill="none"/>
<text x="30" y="26" font-size="14.5" fill="#23282d">Same site, different sensitivity: methylation-sensitive pairs read the epigenome</text><text x="30" y="62" font-size="13" fill="#23282d" font-weight="bold">Enzyme</text><text x="130.0" y="62" font-size="13" fill="#23282d" font-weight="bold">site</text><text x="184.5" y="62" font-size="13" fill="#23282d" font-weight="bold">unmethylated</text><text x="284.5" y="62" font-size="13" fill="#23282d" font-weight="bold">CpG-methylated (C in CCGG)</text><line x1="26" y1="70" x2="478.5" y2="70" stroke="#23282d" stroke-width="1" stroke-linecap="round"/><text x="30" y="92" font-size="13" fill="#23282d" font-weight="bold">MspI</text><text x="130.0" y="92" font-size="13" fill="#23282d">C^CGG</text><text x="184.5" y="92" font-size="13" fill="#23282d">cuts</text><text x="284.5" y="92" font-size="13" fill="#23282d">cuts</text><rect x="24" y="102" width="452.5" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="122" font-size="13" fill="#23282d" font-weight="bold">HpaII</text><text x="130.0" y="122" font-size="13" fill="#23282d">C^CGG</text><text x="184.5" y="122" font-size="13" fill="#23282d">cuts</text><text x="284.5" y="122" font-size="13" fill="#8a8f94">no cut</text><text x="30" y="152" font-size="13" fill="#23282d" font-weight="bold">DpnI</text><text x="130.0" y="152" font-size="13" fill="#23282d">GA^TC</text><text x="184.5" y="152" font-size="13" fill="#8a8f94">no cut</text><text x="284.5" y="152" font-size="13" fill="#23282d">cuts (methylated A required)</text><rect x="24" y="162" width="452.5" height="30" fill="#e6e9ec" opacity="0.55"/><text x="30" y="182" font-size="13" fill="#23282d" font-weight="bold">DpnII / MboI</text><text x="130.0" y="182" font-size="13" fill="#23282d">^GATC</text><text x="184.5" y="182" font-size="13" fill="#23282d">cuts</text><text x="284.5" y="182" font-size="13" fill="#8a8f94">no cut (Dam-methylated)</text><text x="30" y="218" font-size="14" fill="#23282d">MspI cuts every CCGG, so MspI digestion enriches CpG-rich DNA for RRBS: HpaII, not MspI, is blocked by the methyl group.</text><text x="30" y="240" font-size="14" fill="#8a8f94">[Meissner 2008, doi:10.1038/nature07107]</text>
</svg>
