<text x="40" y="26" font-size="14" fill="#23282d">DASH: cut the abundant fragments so they lose one of their two primer sites.</text><text x="40" y="52" font-size="12.5" fill="#23282d">library before</text><rect x="60" y="62" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="82" y1="69" x2="190" y2="69" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="190" y="62" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><rect x="60" y="88" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="82" y1="95" x2="190" y2="95" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="190" y="88" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><rect x="60" y="114" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="82" y1="121" x2="190" y2="121" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="190" y="114" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><rect x="60" y="140" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="82" y1="147" x2="190" y2="147" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="190" y="140" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="222" y="98" font-size="11.5" fill="#8a8f94">abundant</text><text x="222" y="152" font-size="11.5" fill="#4a6b8a">rare, wanted</text><line x1="430" y1="108" x2="465" y2="108" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 470 108 L 465 104.5 L 465 111.5 Z" fill="#b4532a"/><text x="440" y="90" font-size="11.5" text-anchor="middle" fill="#b4532a">Cas9 + guides</text><text x="500" y="52" font-size="12.5" fill="#23282d">after cutting, then PCR</text><rect x="500" y="62" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="522" y1="69" x2="548" y2="69" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><line x1="553" y1="64" x2="563" y2="74" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="553" y1="74" x2="563" y2="64" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="568" y1="69" x2="594" y2="69" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="594" y="62" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="630" y="73" font-size="11" fill="#8a8f94">each piece has one adapter: no PCR</text><rect x="500" y="88" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="522" y1="95" x2="548" y2="95" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><line x1="553" y1="90" x2="563" y2="100" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="553" y1="100" x2="563" y2="90" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="568" y1="95" x2="594" y2="95" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="594" y="88" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="630" y="99" font-size="11" fill="#8a8f94">each piece has one adapter: no PCR</text><rect x="500" y="114" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="522" y1="121" x2="548" y2="121" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><line x1="553" y1="116" x2="563" y2="126" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="553" y1="126" x2="563" y2="116" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="568" y1="121" x2="594" y2="121" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="594" y="114" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="630" y="125" font-size="11" fill="#8a8f94">each piece has one adapter: no PCR</text><rect x="500" y="140" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="522" y1="147" x2="594" y2="147" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="594" y="140" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="630" y="151" font-size="11.5" fill="#2e6b3f">intact: amplifies</text><text x="40" y="196" font-size="13.5" fill="#23282d">Cut before amplification and the primers do the selecting for you. Cas9 here is a sequence-specific scissors, not a gene editor.</text><text x="40" y="218" font-size="12.5" fill="#8a8f94">Gu et al. built DASH to remove mitochondrial DNA and other abundant species from ATAC-type libraries.</text>
