<text x="40" y="26" font-size="14" fill="#23282d">MspI cuts CCGG whether or not the CpG is methylated. HpaII does not.</text><text x="60.0" y="70" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="73.5" y="70" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="87.0" y="70" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="100.5" y="70" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="114.0" y="70" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="127.5" y="70" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="141.0" y="70" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="154.5" y="70" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="168.0" y="70" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="181.5" y="70" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="60.0" y="100" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="73.5" y="100" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="87.0" y="100" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="100.5" y="100" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="114.0" y="100" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="127.5" y="100" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="141.0" y="100" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="154.5" y="100" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="168.0" y="100" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="181.5" y="100" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><line x1="64.0" y1="74" x2="64.0" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="77.5" y1="74" x2="77.5" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="91.0" y1="74" x2="91.0" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="104.5" y1="74" x2="104.5" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="118.0" y1="74" x2="118.0" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="131.5" y1="74" x2="131.5" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="145.0" y1="74" x2="145.0" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="158.5" y1="74" x2="158.5" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="172.0" y1="74" x2="172.0" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="185.5" y1="74" x2="185.5" y2="89" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="113.0" y1="52" x2="113.0" y2="76" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="140.0" y1="90" x2="140.0" y2="112" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><text x="211.0" y="76" font-size="12" fill="#b4532a">C^CGG leaves a 2-base 5' overhang</text><text x="40" y="150" font-size="13" fill="#23282d">5-methylcytosine on the inner C:</text><circle cx="118.0" cy="62" r="3.6" fill="#a33a28"/><text x="118.0" y="46" font-size="10.5" text-anchor="middle" fill="#a33a28">m</text><text x="60" y="176" font-size="12.5" fill="#23282d">MspI</text><text x="260" y="176" font-size="12.5" fill="#2e6b3f">cuts</text><text x="60" y="198" font-size="12.5" fill="#23282d">HpaII, unmethylated</text><text x="260" y="198" font-size="12.5" fill="#2e6b3f">cuts</text><text x="60" y="220" font-size="12.5" fill="#23282d">HpaII, methylated</text><text x="260" y="220" font-size="12.5" fill="#a33a28">blocked</text><text x="380" y="176" font-size="12" fill="#8a8f94">In reduced-representation bisulfite sequencing, MspI digests the genome</text><text x="380" y="194" font-size="12" fill="#8a8f94">so CpG-rich regions give short fragments with CGG ends.</text><text x="380" y="212" font-size="12" fill="#8a8f94">Choosing the enzyme chooses what the library contains.</text>
</svg>
