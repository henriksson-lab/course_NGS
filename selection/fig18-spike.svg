<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 254" width="742" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="254" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A spike-in is the only ruler that does not move with the sample.</text><text x="130" y="52" font-size="13" text-anchor="middle" fill="#23282d">raw reads</text><line x1="50" y1="170" x2="220" y2="170" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><rect x="70" y="80" width="40" height="90" fill="#1f3b57" opacity="0.85"/><text x="90" y="186" font-size="11" text-anchor="middle" fill="#8a8f94">control</text><rect x="140" y="125" width="40" height="45" fill="#b4532a" opacity="0.85"/><text x="160" y="186" font-size="11" text-anchor="middle" fill="#8a8f94">treated</text><text x="360" y="52" font-size="13" text-anchor="middle" fill="#23282d">scaled to cell reads</text><line x1="280" y1="170" x2="450" y2="170" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><rect x="300" y="80" width="40" height="90" fill="#1f3b57" opacity="0.85"/><text x="320" y="186" font-size="11" text-anchor="middle" fill="#8a8f94">control</text><rect x="370" y="80" width="40" height="90" fill="#b4532a" opacity="0.85"/><text x="390" y="186" font-size="11" text-anchor="middle" fill="#8a8f94">treated</text><text x="590" y="52" font-size="13" text-anchor="middle" fill="#23282d">scaled to the spike-in</text><line x1="510" y1="170" x2="680" y2="170" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><rect x="530" y="80" width="40" height="90" fill="#1f3b57" opacity="0.85"/><text x="550" y="186" font-size="11" text-anchor="middle" fill="#8a8f94">control</text><rect x="600" y="125" width="40" height="45" fill="#b4532a" opacity="0.85"/><text x="620" y="186" font-size="11" text-anchor="middle" fill="#8a8f94">treated</text><text x="40" y="214" font-size="13.5" fill="#23282d">Treatment halves transcription of both cellular genes. Scaled to cell reads, the genes look unchanged.</text><text x="40" y="234" font-size="13.5" fill="#2e6b3f">Scaled to a fixed spike-in added per cell, the halving appears. Numbers are made up.</text>
</svg>
