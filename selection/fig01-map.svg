<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 915 244" width="915" height="244" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="244" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Four ways to keep what you want. Each one needs a property that differs.</text><rect x="40" y="44" width="156" height="150" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="118" y="70" font-size="15" text-anchor="middle" fill="#1f3b57" font-weight="bold">Affinity</text><text x="118" y="96" font-size="11" text-anchor="middle" fill="#23282d">a handle binds the wanted</text><text x="118" y="111" font-size="11" text-anchor="middle" fill="#23282d">molecule; the rest is washed</text><text x="118" y="148" font-size="11" text-anchor="middle" fill="#8a8f94">biotin, antibody, oligo-dT,</text><text x="118" y="163" font-size="11" text-anchor="middle" fill="#8a8f94">baits</text><rect x="208" y="44" width="156" height="150" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="286" y="70" font-size="15" text-anchor="middle" fill="#a33a28" font-weight="bold">Depletion</text><text x="286" y="96" font-size="11" text-anchor="middle" fill="#23282d">a handle marks the unwanted</text><text x="286" y="111" font-size="11" text-anchor="middle" fill="#23282d">molecule for removal</text><text x="286" y="148" font-size="11" text-anchor="middle" fill="#8a8f94">RNase H, Cas9, blockers,</text><text x="286" y="163" font-size="11" text-anchor="middle" fill="#8a8f94">DSN</text><rect x="376" y="44" width="156" height="150" rx="4" fill="#eaf2ec" stroke="#2e6b3f" stroke-width="1.2"/><text x="454" y="70" font-size="15" text-anchor="middle" fill="#2e6b3f" font-weight="bold">Enzymatic</text><text x="454" y="96" font-size="11" text-anchor="middle" fill="#23282d">an enzyme only acts on a</text><text x="454" y="111" font-size="11" text-anchor="middle" fill="#23282d">particular end or site</text><text x="454" y="148" font-size="11" text-anchor="middle" fill="#8a8f94">exonucleases, MspI,</text><text x="454" y="163" font-size="11" text-anchor="middle" fill="#8a8f94">circularisation</text><rect x="544" y="44" width="156" height="150" rx="4" fill="#f7ede6" stroke="#b4532a" stroke-width="1.2"/><text x="622" y="70" font-size="15" text-anchor="middle" fill="#b4532a" font-weight="bold">Physical</text><text x="622" y="96" font-size="11" text-anchor="middle" fill="#23282d">a size, density or cell</text><text x="622" y="111" font-size="11" text-anchor="middle" fill="#23282d">property separates them</text><text x="622" y="148" font-size="11" text-anchor="middle" fill="#8a8f94">beads, FACS, gradients,</text><text x="622" y="163" font-size="11" text-anchor="middle" fill="#8a8f94">fractionation</text><text x="40" y="224" font-size="14" fill="#23282d">Positive selection keeps the wanted; depletion removes the unwanted. Which one you pick depends on which is easier to name.</text>
</svg>
