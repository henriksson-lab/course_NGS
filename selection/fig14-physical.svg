<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 252" width="740" height="252" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="252" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Physical selection acts on the object, before the chemistry sees it.</text><rect x="40" y="44" width="156" height="156" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="118" y="66" font-size="13.5" text-anchor="middle" fill="#b4532a" font-weight="bold">size</text><rect x="210" y="44" width="156" height="156" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="288" y="66" font-size="13.5" text-anchor="middle" fill="#b4532a" font-weight="bold">FACS</text><rect x="380" y="44" width="156" height="156" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="458" y="66" font-size="13.5" text-anchor="middle" fill="#b4532a" font-weight="bold">fractionation</text><rect x="550" y="44" width="156" height="156" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="628" y="66" font-size="13.5" text-anchor="middle" fill="#b4532a" font-weight="bold">density gradient</text><line x1="60" y1="86" x2="180" y2="86" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="round"/><line x1="60" y1="102" x2="160" y2="102" stroke="#2e6b3f" stroke-width="3.2" stroke-linecap="round"/><line x1="60" y1="118" x2="140" y2="118" stroke="#2e6b3f" stroke-width="3.2" stroke-linecap="round"/><line x1="60" y1="134" x2="120" y2="134" stroke="#2e6b3f" stroke-width="3.2" stroke-linecap="round"/><line x1="60" y1="150" x2="100" y2="150" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="round"/><line x1="60" y1="166" x2="84" y2="166" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="round"/><text x="118" y="192" font-size="11" text-anchor="middle" fill="#8a8f94">beads ratio or gel</text><line x1="288" y1="84" x2="288" y2="130" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><circle cx="288" cy="96" r="4" fill="#2e6b3f"/><circle cx="288" cy="112" r="4" fill="#8a8f94"/><line x1="288" y1="130" x2="250" y2="166" stroke="#2e6b3f" stroke-width="1.8" stroke-linecap="round"/><line x1="288" y1="130" x2="328" y2="166" stroke="#8a8f94" stroke-width="1.8" stroke-linecap="round"/><text x="240" y="180" font-size="11" text-anchor="middle" fill="#2e6b3f">kept</text><text x="336" y="180" font-size="11" text-anchor="middle" fill="#8a8f94">waste</text><text x="288" y="192" font-size="11" text-anchor="middle" fill="#8a8f94">one label per cell</text><rect x="390" y="86" width="24" height="70" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><rect x="391" y="120" width="22" height="35" fill="#e8eef5"/><text x="402" y="172" font-size="10.5" text-anchor="middle" fill="#8a8f94">cyto</text><rect x="440" y="86" width="24" height="70" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><rect x="441" y="112" width="22" height="43" fill="#eaf2ec"/><text x="452" y="172" font-size="10.5" text-anchor="middle" fill="#8a8f94">nuclear</text><rect x="490" y="86" width="24" height="70" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><rect x="491" y="104" width="22" height="51" fill="#f5eae6"/><text x="502" y="172" font-size="10.5" text-anchor="middle" fill="#8a8f94">chrom.</text><text x="458" y="192" font-size="11" text-anchor="middle" fill="#8a8f94">lyse stepwise, spin</text><rect x="604" y="80" width="48" height="90" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><rect x="605" y="82" width="46" height="28" fill="#e8eef5"/><text x="658" y="100" font-size="10" fill="#8a8f94">free</text><rect x="605" y="110" width="46" height="28" fill="#eaf2ec"/><text x="658" y="128" font-size="10" fill="#8a8f94">ribosome</text><rect x="605" y="138" width="46" height="28" fill="#f5eae6"/><text x="658" y="156" font-size="10" fill="#8a8f94">polysome</text><text x="628" y="192" font-size="11" text-anchor="middle" fill="#8a8f94">separate by sedimentation</text><text x="40" y="232" font-size="13.5" fill="#23282d">Spin and filter steps are not enrichment by sequence: they enrich by what the molecule is part of.</text>
</svg>
