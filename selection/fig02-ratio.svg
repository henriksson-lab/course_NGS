<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 240" width="896" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="240" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Selection is a ratio, not a switch: a worked example for a human exome.</text><text x="40" y="70" font-size="12.5" fill="#23282d">before capture</text><rect x="150" y="56" width="560" height="22" fill="#dfe3e6"/><rect x="150" y="56" width="11" height="22" fill="#b4532a"/><text x="720" y="72" font-size="12" fill="#8a8f94">about 2% of reads on target</text><text x="40" y="134" font-size="12.5" fill="#23282d">after capture</text><rect x="150" y="120" width="560" height="22" fill="#dfe3e6"/><rect x="150" y="120" width="364" height="22" fill="#b4532a"/><text x="720" y="136" font-size="12" fill="#8a8f94">about 65% on target</text><text x="40" y="196" font-size="14" fill="#23282d">65% / 2% is roughly 30-fold. The other 35% is still off target, and everything lost along the way is lost for good.</text><text x="40" y="220" font-size="12.5" fill="#8a8f94">The exome is about 2% of the genome; the figures are illustrative, kits differ.</text>
</svg>
