<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 878 252" width="878" height="252" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="252" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Suppression PCR: molecules with identical ends fold into panhandles and stop.</text><text x="40" y="62" font-size="13" fill="#a33a28">same adapter at both ends</text><path d="M 140 106 A 30 30 0 1 1 140 114" fill="none" stroke="#8a8f94" stroke-width="2.6"/><line x1="70" y1="106" x2="140" y2="106" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="70" y1="114" x2="140" y2="114" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="80" y1="107.5" x2="80" y2="112.5" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="94" y1="107.5" x2="94" y2="112.5" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="108" y1="107.5" x2="108" y2="112.5" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="122" y1="107.5" x2="122" y2="112.5" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="136" y1="107.5" x2="136" y2="112.5" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="82" y="136" font-size="11" text-anchor="middle" fill="#8a8f94">the two A ends pair</text><line x1="70" y1="166" x2="101" y2="166" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 106 166 L 101 162.5 L 101 169.5 Z" fill="#b4532a"/><line x1="108" y1="160" x2="120" y2="172" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><line x1="108" y1="172" x2="120" y2="160" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><text x="130" y="170" font-size="11.5" fill="#a33a28">primer cannot compete</text><text x="400" y="62" font-size="13" fill="#2e6b3f">different adapters at the two ends</text><line x1="400" y1="110" x2="600" y2="110" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="round"/><rect x="400" y="102" width="24" height="16" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="412.0" y="113.675" font-size="10.5" text-anchor="middle" fill="#23282d">A</text><rect x="576" y="102" width="24" height="16" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="588.0" y="113.675" font-size="10.5" text-anchor="middle" fill="#23282d">B</text><line x1="400" y1="142" x2="445" y2="142" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><path d="M 450 142 L 445 138.5 L 445 145.5 Z" fill="#2e6b3f"/><line x1="600" y1="160" x2="555" y2="160" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><path d="M 550 160 L 555 156.5 L 555 163.5 Z" fill="#2e6b3f"/><text x="500" y="188" font-size="11.5" text-anchor="middle" fill="#2e6b3f">both primers bind: exponential PCR</text><text x="40" y="232" font-size="13.5" fill="#23282d">The effect is used to suppress the abundant, shorter or unwanted products and to stop one-ended artefacts from amplifying.</text>
</svg>
