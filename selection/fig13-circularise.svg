<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 252" width="918" height="252" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="252" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Selective circularisation: only a probe that finds its target becomes a circle.</text><text x="110" y="52" font-size="11.5" text-anchor="middle" fill="#23282d">1. two arms anneal</text><text x="110" y="66" font-size="11.5" text-anchor="middle" fill="#23282d">next to a gap</text><line x1="40" y1="154" x2="180" y2="154" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="110" y="176" font-size="11" text-anchor="middle" fill="#4a6b8a">genomic target</text><line x1="54" y1="138" x2="84" y2="138" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="136" y1="138" x2="166" y2="138" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><path d="M 54 138 C 54 100, 166 100, 166 138" fill="none" stroke="#b4532a" stroke-width="2.4"/><text x="110" y="96" font-size="11" text-anchor="middle" fill="#b4532a">linker + UMI</text><text x="282" y="52" font-size="11.5" text-anchor="middle" fill="#23282d">2. polymerase fills the gap,</text><text x="282" y="66" font-size="11.5" text-anchor="middle" fill="#23282d">ligase closes the circle</text><line x1="212" y1="154" x2="352" y2="154" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="226" y1="138" x2="338" y2="138" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><path d="M 226 138 C 226 100, 338 100, 338 138" fill="none" stroke="#b4532a" stroke-width="2.4"/><text x="282" y="122" font-size="11" text-anchor="middle" fill="#1f3b57">filled</text><text x="454" y="52" font-size="11.5" text-anchor="middle" fill="#23282d">3. exonuclease removes</text><text x="454" y="66" font-size="11.5" text-anchor="middle" fill="#23282d">linear probe and genomic DNA</text><ellipse cx="454" cy="130" rx="40" ry="22" fill="none" stroke="#2e6b3f" stroke-width="2.8"/><line x1="388" y1="180" x2="424" y2="180" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="427" y1="175" x2="437" y2="185" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><line x1="427" y1="185" x2="437" y2="175" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><text x="454" y="204" font-size="11" text-anchor="middle" fill="#8a8f94">linear DNA gone</text><text x="626" y="52" font-size="11.5" text-anchor="middle" fill="#23282d">4. PCR across the</text><text x="626" y="66" font-size="11.5" text-anchor="middle" fill="#23282d">linker, tagged with a UMI</text><line x1="566" y1="124" x2="611" y2="124" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><path d="M 616 124 L 611 120.5 L 611 127.5 Z" fill="#2e6b3f"/><line x1="686" y1="140" x2="641" y2="140" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><path d="M 636 140 L 641 136.5 L 641 143.5 Z" fill="#2e6b3f"/><text x="626" y="170" font-size="11" text-anchor="middle" fill="#8a8f94">amplicon of the</text><text x="626" y="184" font-size="11" text-anchor="middle" fill="#8a8f94">captured region</text><text x="40" y="232" font-size="13.5" fill="#23282d">The reaction closes only if both arms bind on either side of a gap of the right length, so the ligation is the specificity step.</text>
</svg>
