<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 302" width="744" height="302" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="302" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Biotin on the bait, streptavidin on the bead: hold, wash, release.</text><text x="130" y="54" font-size="13" text-anchor="middle" fill="#23282d">1. bind</text><circle cx="110" cy="200" r="22" fill="#dfe3e6" stroke="#8a8f94" stroke-width="1.2"/><text x="110" y="204" font-size="11" text-anchor="middle" fill="#8a8f94">SA</text><line x1="110" y1="178" x2="110" y2="130" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><circle cx="110" cy="174" r="4" fill="#b4532a"/><line x1="117" y1="130" x2="117" y2="80" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><line x1="117" y1="130" x2="117" y2="174" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 4"/><text x="128" y="106" font-size="11.5" fill="#4a6b8a">target</text><text x="98" y="156" font-size="11.5" text-anchor="end" fill="#1f3b57">bait</text><text x="128" y="172" font-size="11.5" fill="#b4532a">biotin</text><line x1="190" y1="130" x2="212" y2="122" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><line x1="208" y1="170" x2="230" y2="162" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><line x1="180" y1="190" x2="202" y2="182" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><text x="212" y="206" font-size="11.5" text-anchor="middle" fill="#8a8f94">everything else</text><text x="355" y="54" font-size="13" text-anchor="middle" fill="#23282d">2. wash</text><circle cx="335" cy="200" r="22" fill="#dfe3e6" stroke="#8a8f94" stroke-width="1.2"/><text x="335" y="204" font-size="11" text-anchor="middle" fill="#8a8f94">SA</text><line x1="335" y1="178" x2="335" y2="130" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><circle cx="335" cy="174" r="4" fill="#b4532a"/><line x1="342" y1="130" x2="342" y2="80" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><line x1="342" y1="130" x2="342" y2="174" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1 4"/><text x="353" y="106" font-size="11.5" fill="#4a6b8a">target</text><text x="323" y="156" font-size="11.5" text-anchor="end" fill="#1f3b57">bait</text><text x="353" y="172" font-size="11.5" fill="#b4532a">biotin</text><text x="425" y="150" font-size="11.5" fill="#8a8f94">washed</text><text x="425" y="166" font-size="11.5" fill="#8a8f94">away</text><line x1="415" y1="138" x2="450" y2="138" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 455 138 L 450 134.5 L 450 141.5 Z" fill="#8a8f94"/><rect x="265" y="236" width="140" height="8" fill="#23282d" opacity="0.7"/><text x="335" y="258" font-size="11.5" text-anchor="middle" fill="#8a8f94">magnet</text><text x="580" y="54" font-size="13" text-anchor="middle" fill="#23282d">3. release or amplify</text><circle cx="560" cy="200" r="22" fill="#dfe3e6" stroke="#8a8f94" stroke-width="1.2"/><text x="560" y="204" font-size="11" text-anchor="middle" fill="#8a8f94">SA</text><line x1="560" y1="178" x2="560" y2="146" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><circle cx="560" cy="174" r="4" fill="#b4532a"/><line x1="590" y1="110" x2="625" y2="110" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 630 110 L 625 106.5 L 625 113.5 Z" fill="#b4532a"/><text x="638" y="114" font-size="11.5" fill="#b4532a">heat or alkali</text><text x="638" y="130" font-size="11.5" fill="#b4532a">frees the target</text><text x="540" y="240" font-size="11.5" fill="#8a8f94">or PCR straight off the bead</text><text x="40" y="282" font-size="14" fill="#23282d">The bond is so tight it is effectively permanent, so what you release is the target, not the bait.</text>
</svg>
