<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 911 278" width="911" height="278" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="278" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Every step filters on ends. Together they keep one class of molecule.</text><text x="300" y="54" font-size="12" text-anchor="middle" fill="#8a8f94">ligation needs</text><text x="450" y="54" font-size="12" text-anchor="middle" fill="#8a8f94">PCR needs</text><text x="600" y="54" font-size="12" text-anchor="middle" fill="#8a8f94">flow cell needs</text><text x="40" y="84" font-size="12.5" fill="#23282d">adapter A / adapter B</text><text x="300" y="84" font-size="12" text-anchor="middle" fill="#2e6b3f">yes</text><text x="450" y="84" font-size="12" text-anchor="middle" fill="#2e6b3f">yes</text><text x="600" y="84" font-size="12" text-anchor="middle" fill="#2e6b3f">yes</text><text x="40" y="112" font-size="12.5" fill="#23282d">A / A</text><text x="300" y="112" font-size="12" text-anchor="middle" fill="#2e6b3f">yes</text><text x="450" y="112" font-size="12" text-anchor="middle" fill="#b4532a">yes (suppressed)</text><text x="600" y="112" font-size="12" text-anchor="middle" fill="#a33a28">no</text><text x="40" y="140" font-size="12.5" fill="#23282d">B / B</text><text x="300" y="140" font-size="12" text-anchor="middle" fill="#2e6b3f">yes</text><text x="450" y="140" font-size="12" text-anchor="middle" fill="#b4532a">yes (suppressed)</text><text x="600" y="140" font-size="12" text-anchor="middle" fill="#a33a28">no</text><text x="40" y="168" font-size="12.5" fill="#23282d">one end only</text><text x="300" y="168" font-size="12" text-anchor="middle" fill="#2e6b3f">yes</text><text x="450" y="168" font-size="12" text-anchor="middle" fill="#a33a28">no</text><text x="600" y="168" font-size="12" text-anchor="middle" fill="#a33a28">no</text><text x="40" y="196" font-size="12.5" fill="#23282d">no 5' phosphate on insert</text><text x="300" y="196" font-size="12" text-anchor="middle" fill="#a33a28">no</text><text x="450" y="196" font-size="12" text-anchor="middle" fill="#a33a28">no</text><text x="600" y="196" font-size="12" text-anchor="middle" fill="#a33a28">no</text><text x="40" y="238" font-size="13.5" fill="#23282d">In small-RNA cloning, the 5' phosphate does the selecting: only processed RNAs with a 5' phosphate and 3' hydroxyl are ligated.</text><text x="40" y="258" font-size="12" fill="#8a8f94">Illustrative; real protocols differ in which step does the work.</text>
</svg>
