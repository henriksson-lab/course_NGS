<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 240" width="884" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="240" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Exonucleases need a free end. Circles have none, so they survive.</text><text x="40" y="74" font-size="12.5" fill="#23282d">ligated into a circle</text><ellipse cx="300" cy="70" rx="46" ry="14" fill="none" stroke="#2e6b3f" stroke-width="2.8"/><ellipse cx="500" cy="70" rx="46" ry="14" fill="none" stroke="#2e6b3f" stroke-width="2.8"/><line x1="360" y1="70" x2="435" y2="70" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 440 70 L 435 66.5 L 435 73.5 Z" fill="#8a8f94"/><text x="580" y="74" font-size="12" fill="#2e6b3f">survives</text><text x="40" y="126" font-size="12.5" fill="#23282d">linear, unligated</text><line x1="254" y1="122" x2="346" y2="122" stroke="#8a8f94" stroke-width="2.8" stroke-linecap="round"/><line x1="454" y1="122" x2="470" y2="122" stroke="#8a8f94" stroke-width="2.8" stroke-linecap="round"/><line x1="470" y1="122" x2="546" y2="122" stroke="#a33a28" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="547" y1="117" x2="557" y2="127" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><line x1="547" y1="127" x2="557" y2="117" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><line x1="360" y1="122" x2="435" y2="122" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 440 122 L 435 118.5 L 435 125.5 Z" fill="#8a8f94"/><text x="580" y="126" font-size="12" fill="#a33a28">digested from the ends</text><text x="40" y="178" font-size="12.5" fill="#23282d">linear genomic carry-over</text><line x1="254" y1="174" x2="346" y2="174" stroke="#8a8f94" stroke-width="2.8" stroke-linecap="round"/><line x1="454" y1="174" x2="470" y2="174" stroke="#8a8f94" stroke-width="2.8" stroke-linecap="round"/><line x1="470" y1="174" x2="546" y2="174" stroke="#a33a28" stroke-width="2.8" stroke-linecap="round" stroke-dasharray="2 5"/><line x1="547" y1="169" x2="557" y2="179" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><line x1="547" y1="179" x2="557" y2="169" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><line x1="360" y1="174" x2="435" y2="174" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 440 174 L 435 170.5 L 435 177.5 Z" fill="#8a8f94"/><text x="580" y="178" font-size="12" fill="#a33a28">digested from the ends</text><text x="300" y="52" font-size="12" text-anchor="middle" fill="#8a8f94">before</text><text x="500" y="52" font-size="12" text-anchor="middle" fill="#8a8f94">after exonuclease</text><text x="40" y="220" font-size="13.5" fill="#23282d">Select by topology: the only molecules that keep both a template and an intact backbone are the ones you closed on purpose.</text>
</svg>
