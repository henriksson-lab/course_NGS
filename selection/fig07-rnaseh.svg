<text x="40" y="26" font-size="14" fill="#23282d">RNase H cuts RNA only where a DNA oligo has paired with it.</text><text x="40" y="62" font-size="13" fill="#23282d">1. tile DNA oligos along every rRNA</text><line x1="60" y1="90" x2="640" y2="90" stroke="#1f3b57" stroke-width="3.4" stroke-linecap="round"/><text x="50" y="94" font-size="11.5" text-anchor="end" fill="#1f3b57">rRNA</text><line x1="80" y1="100" x2="160" y2="100" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="192" y1="100" x2="272" y2="100" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="304" y1="100" x2="384" y2="100" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="416" y1="100" x2="496" y2="100" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="528" y1="100" x2="608" y2="100" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><text x="60" y="130" font-size="11.5" fill="#8a8f94">mRNA is not touched: no oligo matches it</text><line x1="300" y1="124" x2="600" y2="124" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><text x="40" y="164" font-size="13" fill="#23282d">2. RNase H cuts the RNA strand of every RNA:DNA hybrid</text><text x="60.0" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="73.5" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="87.0" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="100.5" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="114.0" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="127.5" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="141.0" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="154.5" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="168.0" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="181.5" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="195.0" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="208.5" y="188" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="60.0" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="73.5" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="87.0" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="100.5" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="114.0" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="127.5" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="141.0" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="154.5" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="168.0" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="181.5" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="195.0" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="208.5" y="218" font-size="13" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><line x1="64.0" y1="192" x2="64.0" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="77.5" y1="192" x2="77.5" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="91.0" y1="192" x2="91.0" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="104.5" y1="192" x2="104.5" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="118.0" y1="192" x2="118.0" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="131.5" y1="192" x2="131.5" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="145.0" y1="192" x2="145.0" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="158.5" y1="192" x2="158.5" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="172.0" y1="192" x2="172.0" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="185.5" y1="192" x2="185.5" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="199.0" y1="192" x2="199.0" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="212.5" y1="192" x2="212.5" y2="207" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="50" y="188" font-size="13" text-anchor="end" fill="#8a8f94">5'</text><text x="230.0" y="188" font-size="13" fill="#8a8f94">3'</text><text x="50" y="218" font-size="13" text-anchor="end" fill="#8a8f94">3'</text><text x="230.0" y="218" font-size="13" fill="#8a8f94">5'</text><line x1="141.0" y1="170" x2="141.0" y2="184" stroke="#a33a28" stroke-width="2" stroke-linecap="round"/><text x="149.0" y="170" font-size="11.5" fill="#a33a28">cut</text><text x="330" y="196" font-size="12.5" fill="#23282d">then DNase removes the DNA oligos,</text><text x="330" y="214" font-size="12.5" fill="#23282d">and a bead clean-up removes the fragments</text><text x="40" y="252" font-size="13.5" fill="#8a8f94">Works on any RNA you can name. The cost is that you need oligos for every unwanted sequence, and RNase H must leave the mRNA alone.</text>
