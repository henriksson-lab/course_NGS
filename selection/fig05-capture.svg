<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 908 246" width="908" height="246" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="246" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Hybridisation capture: biotinylated baits pull on-target fragments out of the library.</text><text x="130" y="54" font-size="13" text-anchor="middle" fill="#23282d">1. hybridise</text><text x="355" y="54" font-size="13" text-anchor="middle" fill="#23282d">2. pull down</text><text x="580" y="54" font-size="13" text-anchor="middle" fill="#23282d">3. wash, then PCR</text><rect x="60" y="84" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="82" y1="91" x2="150" y2="91" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="150" y="84" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><rect x="60" y="120" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="82" y1="127" x2="150" y2="127" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="150" y="120" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><rect x="60" y="156" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="82" y1="163" x2="150" y2="163" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="150" y="156" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><line x1="96" y1="112" x2="138" y2="112" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><circle cx="96" cy="112" r="4" fill="#b4532a"/><text x="104" y="106" font-size="10"></text><text x="190" y="118" font-size="11.5" fill="#b4532a">bait (biotin)</text><text x="190" y="98" font-size="11.5" fill="#8a8f94">off target</text><circle cx="345" cy="150" r="22" fill="#dfe3e6" stroke="#8a8f94" stroke-width="1.2"/><text x="345" y="154" font-size="11" text-anchor="middle" fill="#8a8f94">bead</text><line x1="345" y1="128" x2="345" y2="98" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><line x1="331" y1="98" x2="363" y2="98" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="309" y="90" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="363" y="90" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="405" y="94" font-size="11.5" fill="#4a6b8a">on target</text><text x="369" y="150" font-size="11.5" fill="#8a8f94">the rest stays in</text><text x="369" y="166" font-size="11.5" fill="#8a8f94">the supernatant</text><rect x="510" y="100" width="22" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="532" y1="107" x2="600" y2="107" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="600" y="100" width="22" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><line x1="536" y1="138" x2="501" y2="138" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><path d="M 496 138 L 501 134.5 L 501 141.5 Z" fill="#1f3b57"/><line x1="596" y1="138" x2="631" y2="138" stroke="#a33a28" stroke-width="1.6" stroke-linecap="round"/><path d="M 636 138 L 631 134.5 L 631 141.5 Z" fill="#a33a28"/><text x="566" y="176" font-size="11.5" text-anchor="middle" fill="#8a8f94">PCR with P5 and P7 primers</text><text x="566" y="194" font-size="11.5" text-anchor="middle" fill="#8a8f94">the baits are not amplified</text><text x="40" y="226" font-size="14" fill="#23282d">The wash is the selection step: too gentle keeps off-target DNA, too harsh loses the on-target fragments that bind weakly.</text>
</svg>
