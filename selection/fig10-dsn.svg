<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 254" width="884" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="254" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Duplex-specific nuclease: abundant sequences find partners first, and are digested.</text><text x="130" y="56" font-size="13" text-anchor="middle" fill="#23282d">1. denature</text><rect x="40" y="66" width="190" height="118" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="355" y="56" font-size="13" text-anchor="middle" fill="#23282d">2. re-anneal briefly</text><rect x="265" y="66" width="190" height="118" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="580" y="56" font-size="13" text-anchor="middle" fill="#23282d">3. DSN, then PCR</text><rect x="490" y="66" width="190" height="118" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><line x1="54" y1="84" x2="80" y2="90" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="100" y1="102" x2="126" y2="108" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="74" y1="126" x2="100" y2="132" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="150" y1="90" x2="176" y2="96" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="180" y1="128" x2="206" y2="134" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="136" y1="150" x2="162" y2="156" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="190" y1="166" x2="216" y2="172" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="64" y1="164" x2="90" y2="170" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="110" y1="170" x2="136" y2="176" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><line x1="166" y1="108" x2="192" y2="114" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><line x1="279" y1="84" x2="305" y2="90" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="279" y1="88" x2="305" y2="94" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="325" y1="102" x2="351" y2="108" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="325" y1="106" x2="351" y2="112" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="299" y1="126" x2="325" y2="132" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="299" y1="130" x2="325" y2="136" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="375" y1="90" x2="401" y2="96" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="375" y1="94" x2="401" y2="100" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="405" y1="128" x2="431" y2="134" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="405" y1="132" x2="431" y2="138" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="361" y1="150" x2="387" y2="156" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="361" y1="154" x2="387" y2="160" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="415" y1="166" x2="441" y2="172" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="415" y1="170" x2="441" y2="176" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="289" y1="164" x2="315" y2="170" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="289" y1="168" x2="315" y2="174" stroke="#a33a28" stroke-width="2.4" stroke-linecap="round"/><line x1="335" y1="170" x2="361" y2="176" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><line x1="391" y1="108" x2="417" y2="114" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><line x1="560" y1="170" x2="586" y2="176" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><line x1="616" y1="108" x2="642" y2="114" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><text x="515" y="100" font-size="11.5" fill="#8a8f94">digested</text><text x="40" y="212" font-size="13.5" fill="#23282d">Reassociation speed depends on concentration, so the common sequences become double-stranded first. DSN cuts only duplexes.</text><text x="40" y="234" font-size="12.5" fill="#8a8f94">Used to normalise cDNA so rare transcripts are not drowned out. Over-incubate and you start eating the rare ones too.</text>
</svg>
