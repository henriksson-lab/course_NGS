<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="920" height="240" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">SMRTbell prep 3.0: six steps from sheared DNA to a loaded polymerase.</text><rect x="30" y="48" width="128" height="100" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="94" y="70" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">shear</text><text x="94" y="96" font-size="11.5" text-anchor="middle" fill="#23282d">to 15 to 20 kb for</text><text x="94" y="112" font-size="11.5" text-anchor="middle" fill="#23282d">human WGS</text><line x1="160" y1="98" x2="170" y2="98" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 174 98 L 170 95.2 L 170 100.8 Z" fill="#8a8f94"/><rect x="176" y="48" width="128" height="100" rx="4" fill="#e9f1ea" stroke="#8a8f94" stroke-width="1.2"/><text x="240" y="70" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">repair + A-tail</text><text x="240" y="96" font-size="11.5" text-anchor="middle" fill="#23282d">37 °C 30 min,</text><text x="240" y="112" font-size="11.5" text-anchor="middle" fill="#23282d">then 65 °C 5 min</text><line x1="306" y1="98" x2="316" y2="98" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 320 98 L 316 95.2 L 316 100.8 Z" fill="#8a8f94"/><rect x="322" y="48" width="128" height="100" rx="4" fill="#f6f0e0" stroke="#8a8f94" stroke-width="1.2"/><text x="386" y="70" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">ligate adapter</text><text x="386" y="96" font-size="11.5" text-anchor="middle" fill="#23282d">hairpins, 20 °C</text><text x="386" y="112" font-size="11.5" text-anchor="middle" fill="#23282d">30 min, then cleanup</text><line x1="452" y1="98" x2="462" y2="98" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 466 98 L 462 95.2 L 462 100.8 Z" fill="#8a8f94"/><rect x="468" y="48" width="128" height="100" rx="4" fill="#f5eae6" stroke="#8a8f94" stroke-width="1.2"/><text x="532" y="70" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">nuclease</text><text x="532" y="96" font-size="11.5" text-anchor="middle" fill="#23282d">37 °C 15 min:</text><text x="532" y="112" font-size="11.5" text-anchor="middle" fill="#23282d">removes free ends</text><line x1="598" y1="98" x2="608" y2="98" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 612 98 L 608 95.2 L 608 100.8 Z" fill="#8a8f94"/><rect x="614" y="48" width="128" height="100" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="678" y="70" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">size select</text><text x="678" y="96" font-size="11.5" text-anchor="middle" fill="#23282d">35% AMPure PB</text><text x="678" y="112" font-size="11.5" text-anchor="middle" fill="#23282d">drops short DNA</text><line x1="744" y1="98" x2="754" y2="98" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 758 98 L 754 95.2 L 754 100.8 Z" fill="#8a8f94"/><rect x="760" y="48" width="128" height="100" rx="4" fill="#e9f1ea" stroke="#8a8f94" stroke-width="1.2"/><text x="824" y="70" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">primer + polymerase</text><text x="824" y="96" font-size="11.5" text-anchor="middle" fill="#23282d">anneal, bind,</text><text x="824" y="112" font-size="11.5" text-anchor="middle" fill="#23282d">clean up</text><text x="30" y="182" font-size="12.5" fill="#23282d">Each ligation and nuclease step is followed by a bead cleanup; the last of them also removes the nuclease.</text><text x="30" y="222" font-size="13.5" fill="#b4532a">The shear size decides the insert size, and therefore the read length and the accuracy.</text>
</svg>
