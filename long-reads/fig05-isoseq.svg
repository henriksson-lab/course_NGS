<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 288" width="1060" height="288" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="960" height="288" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Iso-Seq: a cDNA with a primer at each end, so that full length is something you can test for.</text><rect x="60" y="56" width="80" height="30" rx="4" fill="#e9f1ea" stroke="#2e6b3f" stroke-width="1.2"/><text x="100.0" y="74.85" font-size="11" text-anchor="middle" fill="#2e6b3f">bc primer</text><rect x="140" y="56" width="60" height="30" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="170.0" y="74.85" font-size="11" text-anchor="middle" fill="#1f3b57">5' end, TSO</text><rect x="200" y="56" width="300" height="30" rx="4" fill="none" stroke="#7a3b5e" stroke-width="1.2"/><text x="350.0" y="74.85" font-size="11" text-anchor="middle" fill="#7a3b5e">cDNA, whole transcript</text><rect x="500" y="56" width="56" height="30" rx="4" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.2"/><text x="528.0" y="74.85" font-size="11" text-anchor="middle" fill="#b4532a">poly(A)</text><rect x="556" y="56" width="80" height="30" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="596.0" y="74.85" font-size="11" text-anchor="middle" fill="#1f3b57">3' primer</text><text x="60" y="104" font-size="12" fill="#8a8f94">RT from an oligo-dT primer, template switch with the TSO, ~12 cycles of PCR with barcoded primers</text><text x="60" y="138" font-size="13" fill="#23282d">Read classes after HiFi:</text><text x="60" y="170" font-size="12" fill="#23282d">both primers + poly(A)</text><rect x="280" y="156" width="80" height="18" fill="#e9f1ea" stroke="#8a8f94" stroke-width="0.8"/><rect x="360" y="156" width="300" height="18" fill="#cfd6dc" stroke="#8a8f94" stroke-width="0.8"/><rect x="660" y="156" width="80" height="18" fill="#e8eef5" stroke="#8a8f94" stroke-width="0.8"/><text x="752" y="170" font-size="12" fill="#2e6b3f">full length: keep</text><text x="60" y="202" font-size="12" fill="#23282d">3' primer only</text><rect x="280" y="188" width="200" height="18" fill="#cfd6dc" stroke="#8a8f94" stroke-width="0.8"/><rect x="480" y="188" width="80" height="18" fill="#e8eef5" stroke="#8a8f94" stroke-width="0.8"/><text x="572" y="202" font-size="12" fill="#a33a28">RT stopped early or RNA cut: not full length</text><text x="60" y="234" font-size="12" fill="#23282d">3' primer inside the read</text><rect x="280" y="220" width="80" height="18" fill="#e9f1ea" stroke="#8a8f94" stroke-width="0.8"/><rect x="360" y="220" width="140" height="18" fill="#cfd6dc" stroke="#8a8f94" stroke-width="0.8"/><rect x="500" y="220" width="80" height="18" fill="#e8eef5" stroke="#8a8f94" stroke-width="0.8"/><rect x="580" y="220" width="80" height="18" fill="#e9f1ea" stroke="#8a8f94" stroke-width="0.8"/><rect x="660" y="220" width="120" height="18" fill="#cfd6dc" stroke="#8a8f94" stroke-width="0.8"/><rect x="780" y="220" width="80" height="18" fill="#e8eef5" stroke="#8a8f94" stroke-width="0.8"/><text x="872" y="234" font-size="12" fill="#a33a28">chimera of two cDNAs: discard</text><text x="60" y="270" font-size="13.5" fill="#b4532a">Where the isoform is read in one molecule, a splice junction is no longer inferred from short pieces.</text>
</svg>
