<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 276" width="864" height="276" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="276" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Native barcoding: barcode each sample, pool, then one adapter ligation for all.</text><text x="40" y="52" font-size="12.5" fill="#23282d">1. each sample is end-prepped and gets its own barcode</text><text x="40" y="84" font-size="12" fill="#23282d">sample 1</text><line x1="140" y1="80" x2="330" y2="80" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><rect x="124" y="73" width="16" height="14" rx="4" fill="#1f3b57" stroke="#1f3b57" stroke-width="1.2"/><rect x="330" y="73" width="16" height="14" rx="4" fill="#1f3b57" stroke="#1f3b57" stroke-width="1.2"/><text x="40" y="120" font-size="12" fill="#23282d">sample 2</text><line x1="140" y1="116" x2="330" y2="116" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><rect x="124" y="109" width="16" height="14" rx="4" fill="#b4532a" stroke="#b4532a" stroke-width="1.2"/><rect x="330" y="109" width="16" height="14" rx="4" fill="#b4532a" stroke="#b4532a" stroke-width="1.2"/><text x="40" y="156" font-size="12" fill="#23282d">sample 3</text><line x1="140" y1="152" x2="330" y2="152" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><rect x="124" y="145" width="16" height="14" rx="4" fill="#2e6b3f" stroke="#2e6b3f" stroke-width="1.2"/><rect x="330" y="145" width="16" height="14" rx="4" fill="#2e6b3f" stroke="#2e6b3f" stroke-width="1.2"/><line x1="360" y1="116" x2="415" y2="116" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 420 116 L 415 112.5 L 415 119.5 Z" fill="#8a8f94"/><text x="390" y="100" font-size="11.5" text-anchor="middle" fill="#8a8f94">EDTA, pool</text><text x="430" y="52" font-size="12.5" fill="#23282d">2. one pool, one ligation</text><line x1="470" y1="80" x2="640" y2="80" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><rect x="454" y="73" width="16" height="14" rx="4" fill="#1f3b57" stroke="#1f3b57" stroke-width="1.2"/><rect x="640" y="73" width="16" height="14" rx="4" fill="#1f3b57" stroke="#1f3b57" stroke-width="1.2"/><circle cx="444" cy="80" r="7" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><circle cx="666" cy="80" r="7" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><line x1="470" y1="116" x2="640" y2="116" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><rect x="454" y="109" width="16" height="14" rx="4" fill="#b4532a" stroke="#b4532a" stroke-width="1.2"/><rect x="640" y="109" width="16" height="14" rx="4" fill="#b4532a" stroke="#b4532a" stroke-width="1.2"/><circle cx="444" cy="116" r="7" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><circle cx="666" cy="116" r="7" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><line x1="470" y1="152" x2="640" y2="152" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><rect x="454" y="145" width="16" height="14" rx="4" fill="#2e6b3f" stroke="#2e6b3f" stroke-width="1.2"/><rect x="640" y="145" width="16" height="14" rx="4" fill="#2e6b3f" stroke="#2e6b3f" stroke-width="1.2"/><circle cx="444" cy="152" r="7" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><circle cx="666" cy="152" r="7" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><text x="40" y="204" font-size="12.5" fill="#23282d">Samples are mixed in equimolar amounts before barcoding, because after pooling the barcode is what tells them apart.</text><text x="40" y="224" font-size="12.5" fill="#23282d">No PCR, so base modifications survive; a barcode only tells you which sample, not which molecule.</text><text x="40" y="258" font-size="13.5" fill="#b4532a">Barcodes come before the adapter, because the adapter is added to the pool. Reverse the order and nothing can be pooled.</text>
</svg>
