<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 871 250" width="871" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="250" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Adaptive sampling: decide at the pore, from the first bases of the molecule.</text><rect x="40" y="56" width="160" height="76" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="120" y="82" font-size="12" text-anchor="middle" fill="#23282d">a pore captures</text><text x="120" y="98" font-size="12" text-anchor="middle" fill="#23282d">a molecule</text><line x1="203" y1="94" x2="223" y2="94" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 227 94 L 223 91.2 L 223 96.8 Z" fill="#8a8f94"/><rect x="230" y="56" width="160" height="76" rx="4" fill="#e9f1ea" stroke="#8a8f94" stroke-width="1.2"/><text x="310" y="82" font-size="12" text-anchor="middle" fill="#23282d">the first few</text><text x="310" y="98" font-size="12" text-anchor="middle" fill="#23282d">hundred bases</text><text x="310" y="114" font-size="12" text-anchor="middle" fill="#23282d">are read</text><line x1="393" y1="94" x2="413" y2="94" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 417 94 L 413 91.2 L 413 96.8 Z" fill="#8a8f94"/><rect x="420" y="56" width="160" height="76" rx="4" fill="#f6f0e0" stroke="#8a8f94" stroke-width="1.2"/><text x="500" y="82" font-size="12" text-anchor="middle" fill="#23282d">basecall and</text><text x="500" y="98" font-size="12" text-anchor="middle" fill="#23282d">match to the</text><text x="500" y="114" font-size="12" text-anchor="middle" fill="#23282d">target list</text><line x1="583" y1="94" x2="603" y2="94" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 607 94 L 603 91.2 L 603 96.8 Z" fill="#8a8f94"/><rect x="610" y="40" width="190" height="46" rx="4" fill="#e9f1ea" stroke="#2e6b3f" stroke-width="1.2"/><text x="705" y="68" font-size="12" text-anchor="middle" fill="#2e6b3f">on target: keep reading</text><rect x="610" y="102" width="190" height="46" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="705" y="130" font-size="12" text-anchor="middle" fill="#a33a28">off target: reverse voltage, eject</text><text x="40" y="178" font-size="12.5" fill="#23282d">No wet-lab step: the target list is a file, so changing the target means changing the file.</text><text x="40" y="198" font-size="12.5" fill="#23282d">The cost: ejected molecules still occupy the pore for a moment, and a blocked pore ends the saving.</text><text x="40" y="232" font-size="13.5" fill="#b4532a">Enrichment is a ratio, and it is spent on pore time, so a short run on a rich library beats a long one on a poor library.</text>
</svg>
