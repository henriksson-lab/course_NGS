<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 302" width="860" height="302" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="302" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Rapid kit: a transposase cuts and tags in one step, and the adapter clips on.</text><text x="40" y="56" font-size="12.5" fill="#23282d">1. transposase complexes bind HMW DNA and cut</text><line x1="60" y1="82" x2="560" y2="82" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="60" y1="96" x2="560" y2="96" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><ellipse cx="190" cy="89" rx="14" ry="16" fill="#f6f0e0" stroke="#b4532a"/><ellipse cx="330" cy="89" rx="14" ry="16" fill="#f6f0e0" stroke="#b4532a"/><ellipse cx="450" cy="89" rx="14" ry="16" fill="#f6f0e0" stroke="#b4532a"/><text x="40" y="134" font-size="12.5" fill="#23282d">2. fragments with a tag on each cut end</text><line x1="60" y1="160" x2="180" y2="160" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="60" y1="174" x2="180" y2="174" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><rect x="56" y="154" width="6" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><rect x="178" y="154" width="6" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><line x1="200" y1="160" x2="320" y2="160" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="200" y1="174" x2="320" y2="174" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><rect x="196" y="154" width="6" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><rect x="318" y="154" width="6" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><line x1="340" y1="160" x2="440" y2="160" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="340" y1="174" x2="440" y2="174" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><rect x="336" y="154" width="6" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><rect x="438" y="154" width="6" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><line x1="460" y1="160" x2="560" y2="160" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="460" y1="174" x2="560" y2="174" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><rect x="456" y="154" width="6" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><rect x="558" y="154" width="6" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="40" y="210" font-size="12.5" fill="#23282d">3. adapter with motor attaches to the tag; no enzyme, no cleanup</text><line x1="60" y1="232" x2="180" y2="232" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="60" y1="246" x2="180" y2="246" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><circle cx="52" cy="232" r="6" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><line x1="200" y1="232" x2="320" y2="232" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="200" y1="246" x2="320" y2="246" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><circle cx="192" cy="232" r="6" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><line x1="340" y1="232" x2="440" y2="232" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="340" y1="246" x2="440" y2="246" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><circle cx="332" cy="232" r="6" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><line x1="460" y1="232" x2="560" y2="232" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="460" y1="246" x2="560" y2="246" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><circle cx="452" cy="232" r="6" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><text x="40" y="284" font-size="13" fill="#b4532a">Five minutes of hands-on time is bought with shorter reads and lower yield: the transposase and loose tags stay in the tube.</text>
</svg>
