<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="300" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Kinnex: join cDNAs end to end, so that one long read holds many transcripts.</text><text x="40" y="56" font-size="12.5" fill="#23282d">1. split the cDNA into 8 PCRs, each with its own pair of tails</text><rect x="60" y="66" width="42" height="26" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="81.0" y="83.2" font-size="12" text-anchor="middle" fill="#23282d">A</text><rect x="112" y="66" width="42" height="26" rx="4" fill="#e9f1ea" stroke="#8a8f94" stroke-width="1.2"/><text x="133.0" y="83.2" font-size="12" text-anchor="middle" fill="#23282d">B</text><rect x="164" y="66" width="42" height="26" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="185.0" y="83.2" font-size="12" text-anchor="middle" fill="#23282d">C</text><rect x="216" y="66" width="42" height="26" rx="4" fill="#e9f1ea" stroke="#8a8f94" stroke-width="1.2"/><text x="237.0" y="83.2" font-size="12" text-anchor="middle" fill="#23282d">D</text><rect x="268" y="66" width="42" height="26" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="289.0" y="83.2" font-size="12" text-anchor="middle" fill="#23282d">E</text><rect x="320" y="66" width="42" height="26" rx="4" fill="#e9f1ea" stroke="#8a8f94" stroke-width="1.2"/><text x="341.0" y="83.2" font-size="12" text-anchor="middle" fill="#23282d">F</text><rect x="372" y="66" width="42" height="26" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="393.0" y="83.2" font-size="12" text-anchor="middle" fill="#23282d">G</text><rect x="424" y="66" width="42" height="26" rx="4" fill="#e9f1ea" stroke="#8a8f94" stroke-width="1.2"/><text x="445.0" y="83.2" font-size="12" text-anchor="middle" fill="#23282d">HQ</text><text x="40" y="118" font-size="12.5" fill="#23282d">2. pool, then ligate: matching tails force the order 1, 2, ... 8</text><rect x="60" y="128" width="54" height="16" fill="#e8eef5" stroke="#8a8f94"/><text x="87" y="140" font-size="10.5" text-anchor="middle" fill="#23282d">1</text><rect x="122" y="128" width="54" height="16" fill="#e9f1ea" stroke="#8a8f94"/><text x="149" y="140" font-size="10.5" text-anchor="middle" fill="#23282d">2</text><rect x="184" y="128" width="54" height="16" fill="#f6f0e0" stroke="#8a8f94"/><text x="211" y="140" font-size="10.5" text-anchor="middle" fill="#23282d">3</text><rect x="246" y="128" width="54" height="16" fill="#f5eae6" stroke="#8a8f94"/><text x="273" y="140" font-size="10.5" text-anchor="middle" fill="#23282d">4</text><rect x="308" y="128" width="54" height="16" fill="#e8eef5" stroke="#8a8f94"/><text x="335" y="140" font-size="10.5" text-anchor="middle" fill="#23282d">5</text><rect x="370" y="128" width="54" height="16" fill="#e9f1ea" stroke="#8a8f94"/><text x="397" y="140" font-size="10.5" text-anchor="middle" fill="#23282d">6</text><rect x="432" y="128" width="54" height="16" fill="#f6f0e0" stroke="#8a8f94"/><text x="459" y="140" font-size="10.5" text-anchor="middle" fill="#23282d">7</text><rect x="494" y="128" width="54" height="16" fill="#f5eae6" stroke="#8a8f94"/><text x="521" y="140" font-size="10.5" text-anchor="middle" fill="#23282d">8</text><text x="40" y="172" font-size="12.5" fill="#23282d">3. a SMRTbell around the whole array; the polymerase goes round it</text><line x1="60" y1="192" x2="556" y2="192" stroke="#4a6b8a" stroke-width="4" stroke-linecap="butt"/><path d="M 60 185 C 38 183, 38 201, 60 199" fill="none" stroke="#4a6b8a" stroke-width="3"/><path d="M 556 185 C 578 183, 578 201, 556 199" fill="none" stroke="#4a6b8a" stroke-width="3"/><text x="40" y="224" font-size="12.5" fill="#23282d">4. software cuts each HiFi read back into its 8 transcripts</text><text x="560" y="140" font-size="12" fill="#b4532a">8 transcripts per array</text><rect x="60" y="234" width="54" height="14" fill="#e8eef5" stroke="#8a8f94"/><rect x="122" y="234" width="54" height="14" fill="#e9f1ea" stroke="#8a8f94"/><rect x="184" y="234" width="54" height="14" fill="#f6f0e0" stroke="#8a8f94"/><rect x="246" y="234" width="54" height="14" fill="#f5eae6" stroke="#8a8f94"/><rect x="308" y="234" width="54" height="14" fill="#e8eef5" stroke="#8a8f94"/><rect x="370" y="234" width="54" height="14" fill="#e9f1ea" stroke="#8a8f94"/><rect x="432" y="234" width="54" height="14" fill="#f6f0e0" stroke="#8a8f94"/><rect x="494" y="234" width="54" height="14" fill="#f5eae6" stroke="#8a8f94"/><text x="40" y="282" font-size="13.5" fill="#b4532a">A cDNA is a kilobase or two but a HiFi read can be far longer: joining cDNAs fills the read with transcripts.</text>
</svg>
