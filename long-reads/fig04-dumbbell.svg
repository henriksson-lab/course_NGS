<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 284" width="780" height="284" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="284" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">The nuclease keeps only molecules with no free end: the closed SMRTbell.</text><text x="40" y="72" font-size="13" fill="#23282d">closed SMRTbell</text><line x1="200" y1="60" x2="520" y2="60" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="200" y1="74" x2="520" y2="74" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><path d="M 200 60 C 178 58, 178 76, 200 74" fill="none" stroke="#4a6b8a" stroke-width="3"/><path d="M 520 60 C 542 58, 542 76, 520 74" fill="none" stroke="#4a6b8a" stroke-width="3"/><text x="560" y="72" font-size="12" fill="#2e6b3f">survives: no end to attack</text><text x="40" y="128" font-size="13" fill="#23282d">unligated insert</text><line x1="200" y1="116" x2="520" y2="116" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="200" y1="130" x2="520" y2="130" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><line x1="187" y1="117" x2="197" y2="129" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="187" y1="129" x2="197" y2="117" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="523" y1="117" x2="533" y2="129" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="523" y1="129" x2="533" y2="117" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><text x="560" y="128" font-size="12" fill="#a33a28">digested from both ends</text><text x="40" y="184" font-size="13" fill="#23282d">adapter on one end only</text><line x1="200" y1="172" x2="520" y2="172" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="200" y1="186" x2="520" y2="186" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><path d="M 200 172 C 178 170, 178 188, 200 186" fill="none" stroke="#4a6b8a" stroke-width="3"/><line x1="523" y1="173" x2="533" y2="185" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="523" y1="185" x2="533" y2="173" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><text x="560" y="184" font-size="12" fill="#a33a28">digested from the free end</text><text x="40" y="238" font-size="12.5" fill="#23282d">Closed topology also means the polymerase can go round: forward strand, hairpin, reverse strand, hairpin, again.</text><text x="40" y="266" font-size="13.5" fill="#b4532a">The nuclease is what turns a messy ligation into a clean library.</text>
</svg>
