<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="330" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Direct RNA: the molecule that is sequenced is the RNA itself, read from its 3' end.</text><text x="40" y="56" font-size="12.5" fill="#23282d">1. adapter on the 3' poly(A) end</text><line x1="80" y1="80" x2="440" y2="80" stroke="#7a3b5e" stroke-width="3.5" stroke-linecap="butt"/><circle cx="76" cy="80" r="4.5" fill="#b4532a"/><text x="444" y="84" font-size="11" fill="#7a3b5e" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAA</text><rect x="480" y="70" width="60" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="510.0" y="83.85" font-size="11" text-anchor="middle" fill="#1f3b57">RTA</text><text x="40" y="122" font-size="12.5" fill="#23282d">2. RT makes a cDNA strand: it steadies the RNA and is not sequenced</text><line x1="80" y1="146" x2="440" y2="146" stroke="#7a3b5e" stroke-width="3.5" stroke-linecap="butt"/><line x1="120" y1="160" x2="440" y2="160" stroke="#4a6b8a" stroke-width="3" stroke-linecap="butt"/><rect x="480" y="136" width="60" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="510.0" y="149.85" font-size="11" text-anchor="middle" fill="#1f3b57">RTA</text><text x="40" y="198" font-size="12.5" fill="#23282d">3. the motor adapter ligates to the 3' end, and the RNA strand goes through the pore</text><line x1="80" y1="222" x2="440" y2="222" stroke="#7a3b5e" stroke-width="3.5" stroke-linecap="butt"/><line x1="120" y1="236" x2="440" y2="236" stroke="#4a6b8a" stroke-width="3" stroke-linecap="butt"/><rect x="480" y="212" width="60" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="510.0" y="225.85" font-size="11" text-anchor="middle" fill="#1f3b57">RTA</text><rect x="548" y="212" width="60" height="20" rx="4" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.2"/><text x="578.0" y="225.85" font-size="11" text-anchor="middle" fill="#b4532a">RLA</text><circle cx="626" cy="222" r="8" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><line x1="430" y1="262" x2="95" y2="262" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 90 262 L 95 258.5 L 95 265.5 Z" fill="#b4532a"/><text x="260" y="282" font-size="12" text-anchor="middle" fill="#b4532a">read direction: 3' to 5'</text><text x="40" y="312" font-size="13.5" fill="#b4532a">No RT bias, no PCR, and modifications are in the signal. The price is that the whole RNA must be intact and plentiful.</text>
</svg>
