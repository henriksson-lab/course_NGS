<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 308" width="860" height="308" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="308" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Two nanopore routes from RNA to cDNA: amplify it, or do not.</text><text x="40" y="60" font-size="13.5" fill="#23282d" font-weight="bold">cDNA-PCR (SQK-PCS114)</text><rect x="60" y="72" width="160" height="46" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="140" y="92" font-size="12" text-anchor="middle" fill="#23282d">ligate RT adapter</text><text x="140" y="107" font-size="12" text-anchor="middle" fill="#23282d">to the poly(A)</text><line x1="223" y1="95" x2="243" y2="95" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 247 95 L 243 92.2 L 243 97.8 Z" fill="#8a8f94"/><rect x="250" y="72" width="160" height="46" rx="4" fill="#e9f1ea" stroke="#8a8f94" stroke-width="1.2"/><text x="330" y="92" font-size="12" text-anchor="middle" fill="#23282d">RT and</text><text x="330" y="107" font-size="12" text-anchor="middle" fill="#23282d">strand switch</text><line x1="413" y1="95" x2="433" y2="95" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 437 95 L 433 92.2 L 433 97.8 Z" fill="#8a8f94"/><rect x="440" y="72" width="160" height="46" rx="4" fill="#f6f0e0" stroke="#8a8f94" stroke-width="1.2"/><text x="520" y="92" font-size="12" text-anchor="middle" fill="#23282d">PCR with</text><text x="520" y="107" font-size="12" text-anchor="middle" fill="#23282d">tagged primers</text><line x1="603" y1="95" x2="623" y2="95" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 627 95 L 623 92.2 L 623 97.8 Z" fill="#8a8f94"/><rect x="630" y="72" width="160" height="46" rx="4" fill="#f5eae6" stroke="#8a8f94" stroke-width="1.2"/><text x="710" y="92" font-size="12" text-anchor="middle" fill="#23282d">rapid adapter</text><text x="710" y="107" font-size="12" text-anchor="middle" fill="#23282d">attaches</text><text x="40" y="160" font-size="13.5" fill="#23282d" font-weight="bold">direct cDNA, no PCR</text><rect x="60" y="172" width="160" height="46" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="140" y="192" font-size="12" text-anchor="middle" fill="#23282d">RT +</text><text x="140" y="207" font-size="12" text-anchor="middle" fill="#23282d">strand switch</text><line x1="223" y1="195" x2="243" y2="195" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 247 195 L 243 192.2 L 243 197.8 Z" fill="#8a8f94"/><rect x="250" y="172" width="160" height="46" rx="4" fill="#e9f1ea" stroke="#8a8f94" stroke-width="1.2"/><text x="330" y="192" font-size="12" text-anchor="middle" fill="#23282d">second</text><text x="330" y="207" font-size="12" text-anchor="middle" fill="#23282d">strand</text><line x1="413" y1="195" x2="433" y2="195" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 437 195 L 433 192.2 L 433 197.8 Z" fill="#8a8f94"/><rect x="440" y="172" width="160" height="46" rx="4" fill="#f6f0e0" stroke="#8a8f94" stroke-width="1.2"/><text x="520" y="192" font-size="12" text-anchor="middle" fill="#23282d">end-prep,</text><text x="520" y="207" font-size="12" text-anchor="middle" fill="#23282d">dA-tail</text><line x1="603" y1="195" x2="623" y2="195" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 627 195 L 623 192.2 L 623 197.8 Z" fill="#8a8f94"/><rect x="630" y="172" width="160" height="46" rx="4" fill="#f5eae6" stroke="#8a8f94" stroke-width="1.2"/><text x="710" y="192" font-size="12" text-anchor="middle" fill="#23282d">ligate</text><text x="710" y="207" font-size="12" text-anchor="middle" fill="#23282d">adapter</text><text x="40" y="262" font-size="12" fill="#23282d">cDNA-PCR needs little RNA but PCR favours short transcripts; direct cDNA needs far more RNA and avoids amplification bias.</text><text x="40" y="290" font-size="13.5" fill="#b4532a">RNA to cDNA is the same chemistry as in the RNA unit; what changes is the handle, and whether you amplify.</text>
</svg>
