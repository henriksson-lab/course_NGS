<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 282" width="760" height="282" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="282" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">1 microgram of DNA is a very different number of molecules at different lengths.</text><line x1="160" y1="190" x2="640" y2="190" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="160.0" y1="190" x2="160.0" y2="196" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="160.0" y="212" font-size="11.5" text-anchor="middle" fill="#8a8f94">10</text><line x1="320.0" y1="190" x2="320.0" y2="196" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="320.0" y="212" font-size="11.5" text-anchor="middle" fill="#8a8f94">100</text><line x1="480.0" y1="190" x2="480.0" y2="196" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="480.0" y="212" font-size="11.5" text-anchor="middle" fill="#8a8f94">1000</text><text x="400" y="230" font-size="11.5" text-anchor="middle" fill="#8a8f94">femtomoles of molecules in 1 µg (log scale)</text><text x="40" y="78" font-size="13.5" fill="#23282d">1 kb</text><rect x="160" y="62" width="350" height="24" fill="#8a8f94" opacity="0.8"/><text x="518.003315333834" y="79" font-size="12.5" fill="#23282d">1540 fmol</text><text x="40" y="118" font-size="13.5" fill="#23282d">10 kb</text><rect x="160" y="102" width="190" height="24" fill="#1f3b57" opacity="0.8"/><text x="358.0033153338341" y="119" font-size="12.5" fill="#23282d">154 fmol</text><text x="40" y="158" font-size="13.5" fill="#23282d">100 kb</text><rect x="160" y="142" width="30" height="24" fill="#b4532a" opacity="0.8"/><text x="198.0033153338341" y="159" font-size="12.5" fill="#23282d">15.4 fmol</text><text x="40" y="262" font-size="13.5" fill="#b4532a">A ligation kit that asks for 100 to 200 fmol is asking for about 1 µg at 10 kb, but 10 µg at 100 kb.</text>
</svg>
