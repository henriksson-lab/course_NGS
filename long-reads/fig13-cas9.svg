<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 316" width="860" height="316" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="316" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Cas9 enrichment: only the cut ends can take an adapter.</text><text x="40" y="52" font-size="12.5" fill="#23282d">1. dephosphorylate every existing end</text><line x1="80" y1="76" x2="700" y2="76" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><text x="70" y="80" font-size="10.5" text-anchor="end" fill="#a33a28">OH</text><text x="708" y="80" font-size="10.5" fill="#a33a28">OH</text><text x="40" y="112" font-size="12.5" fill="#23282d">2. Cas9 cuts either side of the target: fresh 5' phosphate ends</text><line x1="80" y1="138" x2="700" y2="138" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><line x1="260" y1="138" x2="520" y2="138" stroke="#b4532a" stroke-width="6" stroke-linecap="butt"/><line x1="255" y1="118" x2="265" y2="130" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="255" y1="130" x2="265" y2="118" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><text x="260" y="160" font-size="11" text-anchor="middle" fill="#2e6b3f">P</text><line x1="515" y1="118" x2="525" y2="130" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="515" y1="130" x2="525" y2="118" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><text x="520" y="160" font-size="11" text-anchor="middle" fill="#2e6b3f">P</text><text x="390" y="124" font-size="12" text-anchor="middle" fill="#b4532a">target</text><text x="40" y="188" font-size="12.5" fill="#23282d">3. A-tail, then ligate: adapters join only where there is a phosphate</text><line x1="80" y1="212" x2="250" y2="212" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><line x1="270" y1="212" x2="510" y2="212" stroke="#b4532a" stroke-width="6" stroke-linecap="butt"/><line x1="530" y1="212" x2="700" y2="212" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><circle cx="262" cy="212" r="7" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><circle cx="518" cy="212" r="7" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><text x="390" y="240" font-size="11.5" text-anchor="middle" fill="#2e6b3f">adapters on the target ends</text><text x="40" y="266" font-size="12.5" fill="#23282d">Background DNA has no phosphate, so it is not sequenced, and no PCR is needed, so modifications survive.</text><text x="40" y="298" font-size="13.5" fill="#b4532a">Enrichment is chemical: the cut is what makes the molecule sequenceable.</text>
</svg>
