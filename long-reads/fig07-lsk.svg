<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 254" width="820" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="254" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Ligation sequencing: repair and A-tail, ligate the adapter, clean up, load.</text><text x="40" y="56" font-size="12.5" fill="#23282d">1. repair damage; every end gets a 5' phosphate and a single 3' A</text><line x1="120" y1="80" x2="520" y2="80" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="120" y1="94" x2="520" y2="94" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><text x="526" y="84" font-size="11" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="108" y="98" font-size="11" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="40" y="130" font-size="12.5" fill="#23282d">2. the adapter has a T overhang, and a motor protein already on it</text><line x1="160" y1="154" x2="480" y2="154" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="160" y1="168" x2="480" y2="168" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><line x1="126" y1="154" x2="160" y2="154" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><circle cx="122" cy="148" r="7" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><line x1="480" y1="154" x2="514" y2="154" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><circle cx="518" cy="148" r="7" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><text x="40" y="204" font-size="12.5" fill="#23282d">3. bead cleanup with long-fragment buffer (~3 kb and up) or short-fragment buffer (all sizes)</text><text x="40" y="236" font-size="13.5" fill="#b4532a">No ethanol after ligation: it denatures the motor protein, so the buffers are part of the chemistry.</text>
</svg>
