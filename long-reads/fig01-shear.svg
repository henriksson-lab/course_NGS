<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="920" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="920" height="250" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Every step that moves the DNA can break it, and a break is a shorter read for good.</text><rect x="30" y="44" width="160" height="160" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="110" y="66" font-size="11.5" text-anchor="middle" fill="#a33a28">fast pipetting, narrow tips</text><line x1="44" y1="118" x2="74" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="79" y1="118" x2="95" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="100" y1="118" x2="109" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="114" y1="118" x2="123" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="128" y1="118" x2="144" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="149" y1="118" x2="179" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><text x="110" y="160" font-size="11" text-anchor="middle" fill="#8a8f94">gentle alternative:</text><text x="110" y="180" font-size="11.5" text-anchor="middle" fill="#2e6b3f">wide-bore tips, slow</text><rect x="202" y="44" width="160" height="160" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="282" y="66" font-size="11.5" text-anchor="middle" fill="#a33a28">vortexing, hard bead mixing</text><line x1="216" y1="118" x2="232" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="237" y1="118" x2="239" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="244" y1="118" x2="260" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="265" y1="118" x2="267" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="272" y1="118" x2="281" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="286" y1="118" x2="295" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="300" y1="118" x2="337" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="342" y1="118" x2="351" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><text x="282" y="160" font-size="11" text-anchor="middle" fill="#8a8f94">gentle alternative:</text><text x="282" y="180" font-size="11.5" text-anchor="middle" fill="#2e6b3f">invert or flick gently</text><rect x="374" y="44" width="160" height="160" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="454" y="66" font-size="11.5" text-anchor="middle" fill="#a33a28">freeze-thaw, old stock</text><line x1="388" y1="118" x2="390" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="395" y1="118" x2="446" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="451" y1="118" x2="467" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="472" y1="118" x2="481" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="486" y1="118" x2="523" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><text x="454" y="160" font-size="11" text-anchor="middle" fill="#8a8f94">gentle alternative:</text><text x="454" y="180" font-size="11.5" text-anchor="middle" fill="#2e6b3f">store cold, aliquot</text><rect x="546" y="44" width="160" height="160" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="626" y="66" font-size="11.5" text-anchor="middle" fill="#a33a28">nucleases, heat, metal ions</text><line x1="560" y1="118" x2="576" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="581" y1="118" x2="618" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="623" y1="118" x2="667" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="672" y1="118" x2="695" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><text x="626" y="160" font-size="11" text-anchor="middle" fill="#8a8f94">gentle alternative:</text><text x="626" y="180" font-size="11.5" text-anchor="middle" fill="#2e6b3f">EDTA, keep cold</text><rect x="718" y="44" width="160" height="160" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="798" y="66" font-size="11.5" text-anchor="middle" fill="#a33a28">dried beads, hard elution</text><line x1="732" y1="118" x2="762" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="767" y1="118" x2="804" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="809" y1="118" x2="867" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><text x="798" y="160" font-size="11" text-anchor="middle" fill="#8a8f94">gentle alternative:</text><text x="798" y="180" font-size="11.5" text-anchor="middle" fill="#2e6b3f">wait, elute warm</text><text x="40" y="232" font-size="13.5" fill="#b4532a">Schematic: the harsher the handling, the more breaks per molecule.</text>
</svg>
