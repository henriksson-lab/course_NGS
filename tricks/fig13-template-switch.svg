 x="435.5" y="120" font-size="13" fill="#8a8f94">5'</text><text x="40" y="190" font-size="14" fill="#23282d">Result: the first strand ends in a known sequence on both sides, so one primer pair amplifies every full-length cDNA.</text><text x="40" y="212" font-size="13.5" fill="#8a8f94">More efficient at a cap, so it favours full-length molecules, but it is not exclusive to caps.</text>
