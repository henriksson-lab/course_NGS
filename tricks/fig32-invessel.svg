<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 782 278" width="782" height="278" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="278" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Fix and permeabilise: the nucleus is the reaction vessel. Crosslinks keep the molecules where they were.</text><text x="40" y="58" font-size="13" fill="#8a8f94">in dilute solution (original Hi-C)</text><path d="M 70 96 q 12 -26 24 0" fill="none" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><path d="M 104 96 q 12 -26 24 0" fill="none" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><path d="M 138 96 q 12 -26 24 0" fill="none" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><path d="M 172 96 q 12 -26 24 0" fill="none" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><text x="70" y="120" font-size="12.5" fill="#8a8f94">ligation of crosslinked fragments in free solution: random joins are possible</text><text x="40" y="158" font-size="13" fill="#2e6b3f">in situ (in situ Hi-C)</text><path d="M 100 200 C 100 170 220 170 220 200 C 220 232 100 232 100 200 Z" fill="#e8eef5" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><circle cx="130" cy="202" r="4.5" fill="#b4532a"/><circle cx="158" cy="202" r="4.5" fill="#b4532a"/><circle cx="186" cy="202" r="4.5" fill="#b4532a"/><text x="240" y="196" font-size="12.5" fill="#8a8f94">digest and ligate inside the nucleus:</text><text x="240" y="212" font-size="12.5" fill="#8a8f94">pieces stay near their neighbours</text><text x="40" y="258" font-size="13.5" fill="#23282d">Same principle in SPLiT-seq (in-cell RT) and 10x Flex (probes hybridised in fixed cells).</text>
</svg>
