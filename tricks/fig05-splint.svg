ine x1="356.5" y1="84" x2="356.5" y2="99" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="140" y="80" font-size="13" text-anchor="end" fill="#8a8f94">5'</text><text x="140" y="110" font-size="13" text-anchor="end" fill="#8a8f94">3'</text><text x="374.0" y="110" font-size="13" fill="#8a8f94">5'</text><text x="204.0" y="58" font-size="12" text-anchor="middle" fill="#1f3b57">end of molecule 1</text><text x="312.0" y="58" font-size="12" text-anchor="middle" fill="#b4532a">end of molecule 2 (5'-P)</text><line x1="256.0" y1="66" x2="256.0" y2="120" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3"/><text x="256.0" y="142" font-size="12.5" text-anchor="middle" fill="#b4532a">nick: ligase seals it</text><text x="258.0" y="164" font-size="12.5" text-anchor="middle" fill="#4a6b8a">splint (bottom strand) is complementary to both ends</text><text x="40" y="196" font-size="13" fill="#8a8f94">Without it, the two ends meet only by diffusion. Used to close libraries into circles (DNBSEQ) and to link barcodes in split-pool protocols.</text>
