<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 878 258" width="878" height="258" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="258" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Duplex tags: a real mutation is on both strands; a polymerase or chemical error is on one.</text><text x="40" y="58" font-size="13" fill="#8a8f94">one original molecule, two strands, each tagged</text><rect x="60" y="68" width="36" height="16" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="78.0" y="79.85" font-size="11" text-anchor="middle" fill="#1f3b57">a</text><line x1="96" y1="76" x2="300" y2="76" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="300" y="68" width="36" height="16" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="318.0" y="79.85" font-size="11" text-anchor="middle" fill="#a33a28">b</text><rect x="60" y="90" width="36" height="16" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="78.0" y="101.85" font-size="11" text-anchor="middle" fill="#a33a28">b</text><line x1="96" y1="98" x2="300" y2="98" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="300" y="90" width="36" height="16" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="318.0" y="101.85" font-size="11" text-anchor="middle" fill="#1f3b57">a</text><circle cx="200" cy="76" r="5" fill="#b4532a"/><circle cx="200" cy="98" r="5" fill="#b4532a"/><text x="350" y="90" font-size="12.5" fill="#b4532a">mutation at the same position, both strands</text><text x="40" y="140" font-size="13" fill="#1f3b57">strand family a-b:  reads agree  -> consensus</text><text x="40" y="162" font-size="13" fill="#a33a28">strand family b-a:  reads agree  -> consensus</text><text x="40" y="190" font-size="14" fill="#2e6b3f">a variant is real only if both families carry it</text><text x="40" y="216" font-size="13.5" fill="#23282d">an error on one strand appears in one family only: discarded. Error rates drop by orders of magnitude.</text><text x="40" y="238" font-size="13.5" fill="#8a8f94">NanoSeq takes the same idea further: restriction fragments and ddNTP A-tailing so that only duplex-able molecules amplify.</text>
</svg>
