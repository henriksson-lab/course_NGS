<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 873 238" width="873" height="238" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="238" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Two-stage encapsulation: pre-index in wells, then overload the droplets, because the pre-index tells the cells apart.</text><rect x="50" y="56" width="120" height="52" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="110.0" y="78.7" font-size="12" text-anchor="middle" fill="#1f3b57">nuclei in wells,</text><text x="110.0" y="93.7" font-size="12" text-anchor="middle" fill="#1f3b57">round-1 barcode</text><line x1="176" y1="82" x2="221" y2="82" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 226 82 L 221 78.5 L 221 85.5 Z" fill="#8a8f94"/><text x="201" y="72" font-size="12" text-anchor="middle" fill="#8a8f94">pool</text><rect x="232" y="50" width="120" height="64" rx="30" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="260" cy="70" r="6" fill="#b4532a"/><circle cx="278" cy="92" r="6" fill="#1f3b57"/><circle cx="296" cy="70" r="6" fill="#2e6b3f"/><circle cx="314" cy="92" r="6" fill="#a33a28"/><circle cx="332" cy="70" r="6" fill="#6b5b8a"/><text x="292" y="134" font-size="12.5" text-anchor="middle" fill="#8a8f94">droplet: many nuclei,</text><text x="292" y="150" font-size="12.5" text-anchor="middle" fill="#8a8f94">each from another well</text><text x="400" y="76" font-size="13" fill="#23282d">droplet barcode + round-1 barcode</text><text x="400" y="96" font-size="13" fill="#23282d">= unique for each nucleus</text><text x="40" y="196" font-size="13.5" fill="#23282d">Normal droplets are kept at about 0.1 cells to avoid doublets. Here a collision needs the same droplet and the same well.</text><text x="40" y="218" font-size="13.5" fill="#8a8f94">scifi-RNA-seq reports this as a way to load many more cells per run (bioRxiv preprint).</text>
</svg>
