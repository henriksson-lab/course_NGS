<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 216" width="831" height="216" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="216" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Position as information: where a read starts, stops or joins is itself the measurement.</text><rect x="40" y="50" width="152" height="112" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="116" y="72" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">RT stop (iCLIP)</text><text x="116" y="128" font-size="11.5" text-anchor="middle" fill="#23282d">cDNA ends one base</text><text x="116" y="143" font-size="11.5" text-anchor="middle" fill="#23282d">before a crosslinked</text><text x="116" y="158" font-size="11.5" text-anchor="middle" fill="#23282d">protein</text><line x1="66" y1="100" x2="126" y2="100" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="138" cy="100" r="7" fill="#a33a28"/><rect x="208" y="50" width="152" height="112" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="284" y="72" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">Tn5 cut (ATAC-seq)</text><text x="284" y="128" font-size="11.5" text-anchor="middle" fill="#23282d">reads start where Tn5</text><text x="284" y="143" font-size="11.5" text-anchor="middle" fill="#23282d">cut open chromatin</text><line x1="234" y1="100" x2="334" y2="100" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><line x1="264" y1="90" x2="264" y2="110" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="304" y1="90" x2="304" y2="110" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><rect x="376" y="50" width="152" height="112" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="452" y="72" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">junction (Hi-C)</text><text x="452" y="128" font-size="11.5" text-anchor="middle" fill="#23282d">a read pair spanning a</text><text x="452" y="143" font-size="11.5" text-anchor="middle" fill="#23282d">join links two loci</text><path d="M 412 104 C 422 80 482 80 492 104" fill="none" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><circle cx="412" cy="104" r="4" fill="#b4532a"/><circle cx="492" cy="104" r="4" fill="#b4532a"/><rect x="544" y="50" width="152" height="112" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="620" y="72" font-size="12.5" text-anchor="middle" fill="#b4532a" font-weight="bold">integration (GUIDE-seq)</text><text x="620" y="128" font-size="11.5" text-anchor="middle" fill="#23282d">a tag inserted at a</text><text x="620" y="143" font-size="11.5" text-anchor="middle" fill="#23282d">Cas9 break marks it</text><line x1="570" y1="100" x2="670" y2="100" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="round"/><rect x="608" y="92" width="24" height="16" rx="2" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="620.0" y="103.5" font-size="10" text-anchor="middle" fill="#b4532a">tag</text><text x="40" y="196" font-size="14" fill="#23282d">No base is chemically changed: the signal is a coordinate, so the design question is how to make the end sharp.</text>
</svg>
