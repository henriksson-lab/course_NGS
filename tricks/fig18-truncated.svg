<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 873 256" width="873" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="256" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Truncated adapters: carry only what the first reaction needs, and add the rest, including the index, in a second PCR.</text><text x="40" y="62" font-size="13" fill="#8a8f94">round 1</text><rect x="130" y="50" width="62" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="161.0" y="65.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R1 stub</text><rect x="192" y="50" width="220" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="302.0" y="65.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">locus or tagmented insert</text><rect x="412" y="50" width="62" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="443.0" y="65.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R2 stub</text><text x="40" y="112" font-size="13" fill="#8a8f94">round 2</text><line x1="130" y1="132" x2="195" y2="132" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 200 132 L 195 128.5 L 195 135.5 Z" fill="#b4532a"/><text x="206" y="136" font-size="12.5" fill="#b4532a">index primers add i5, P5, i7, P7</text><text x="40" y="176" font-size="13" fill="#8a8f94">final</text><rect x="130" y="164" width="36" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="148.0" y="179.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5</text><rect x="166" y="164" width="32" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="182.0" y="179.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">i5</text><rect x="198" y="164" width="40" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="218.0" y="179.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R1</text><rect x="238" y="164" width="190" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="333.0" y="179.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="428" y="164" width="40" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="448.0" y="179.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R2</text><rect x="468" y="164" width="32" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="484.0" y="179.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">i7</text><rect x="500" y="164" width="36" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="518.0" y="179.025" font-size="11.5" text-anchor="middle" fill="#a33a28">P7</text><text x="40" y="214" font-size="14" fill="#23282d">One set of cheap locus primers, many cheap index primers: the combinations are made, not synthesised.</text><text x="40" y="236" font-size="13.5" fill="#8a8f94">Tn5 does this as well: it inserts adapter stubs, PCR completes them (ATAC-seq, Nextera).</text>
</svg>
