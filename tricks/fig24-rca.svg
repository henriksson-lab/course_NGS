<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 761 240" width="761" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="240" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Read the same molecule several times, and the errors, which fall in different places, vote out.</text><path d="M 90 130 C 90 70 200 70 200 130 C 200 180 90 180 90 130 Z" fill="none" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="145" y="130" font-size="13" text-anchor="middle" fill="#8a8f94">circle</text><line x1="214" y1="130" x2="257" y2="130" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 262 130 L 257 126.5 L 257 133.5 Z" fill="#8a8f94"/><text x="238" y="118" font-size="12" text-anchor="middle" fill="#8a8f94">roll</text><rect x="280" y="112" width="126" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="343" y="127" font-size="11.5" text-anchor="middle" fill="#1f3b57">copy 1</text><text x="323.2" y="108" font-size="12" text-anchor="middle" fill="#a33a28">x</text><rect x="410" y="112" width="126" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="473" y="127" font-size="11.5" text-anchor="middle" fill="#1f3b57">copy 2</text><text x="506.0" y="108" font-size="12" text-anchor="middle" fill="#a33a28">x</text><rect x="540" y="112" width="126" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="603" y="127" font-size="11.5" text-anchor="middle" fill="#1f3b57">copy 3</text><text x="559.2" y="108" font-size="12" text-anchor="middle" fill="#a33a28">x</text><rect x="280" y="160" width="378" height="22" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="469.0" y="175.2" font-size="12" text-anchor="middle" fill="#2e6b3f">consensus: each error is outvoted by the other copies</text><text x="40" y="220" font-size="14" fill="#23282d">Used to correct nanopore errors on long cDNA (R2C2); PacBio circular consensus is the same principle.</text>
</svg>
