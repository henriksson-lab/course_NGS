<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 965 224" width="965" height="224" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="224" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Where to put a barcode: inside a read (inline) or in its own index read.</text><text x="40" y="60" font-size="13" fill="#b4532a">inline</text><rect x="130" y="48" width="80" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="170.0" y="63.025" font-size="11.5" text-anchor="middle" fill="#b4532a">cell barcode</text><rect x="210" y="48" width="44" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="232.0" y="63.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">UMI</text><rect x="254" y="48" width="176" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="342.0" y="63.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">polyT / cDNA, read 1</text><text x="130" y="90" font-size="12.5" fill="#8a8f94">costs read cycles, but can be added early, before pooling, by RT or ligation</text><text x="40" y="134" font-size="13" fill="#b4532a">index read</text><rect x="130" y="122" width="36" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="148.0" y="137.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5</text><rect x="166" y="122" width="32" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="182.0" y="137.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">i5</text><rect x="198" y="122" width="190" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="293.0" y="137.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="388" y="122" width="32" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="404.0" y="137.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">i7</text><rect x="420" y="122" width="36" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="438.0" y="137.025" font-size="11.5" text-anchor="middle" fill="#a33a28">P7</text><text x="130" y="164" font-size="12.5" fill="#8a8f94">read by its own primer and cycles; costs no insert bases, but only exists after the index PCR</text><text x="40" y="204" font-size="13.5" fill="#23282d">Rule of thumb: many barcodes added at the start (single cells, split-pool) go inline; sample barcodes added at the end go in the index.</text>
</svg>
