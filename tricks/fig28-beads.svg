<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 891 208" width="891" height="208" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="208" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Keep the molecule on a bead: every buffer change is a wash, never a tube-to-tube transfer.</text><rect x="50" y="60" width="86" height="44" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="93" cy="90" r="8" fill="#b4532a"/><line x1="93" y1="90" x2="74" y2="72" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><line x1="93" y1="90" x2="112" y2="74" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="93" y="124" font-size="12.5" text-anchor="middle" fill="#23282d">bind</text><line x1="140" y1="82" x2="150" y2="82" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 154 82 L 150 79.2 L 150 84.8 Z" fill="#8a8f94"/><rect x="156" y="60" width="86" height="44" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="199" cy="90" r="8" fill="#b4532a"/><line x1="199" y1="90" x2="180" y2="72" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><line x1="199" y1="90" x2="218" y2="74" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="199" y="124" font-size="12.5" text-anchor="middle" fill="#23282d">wash</text><line x1="246" y1="82" x2="256" y2="82" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 260 82 L 256 79.2 L 256 84.8 Z" fill="#8a8f94"/><rect x="262" y="60" width="86" height="44" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="305" cy="90" r="8" fill="#b4532a"/><line x1="305" y1="90" x2="286" y2="72" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><line x1="305" y1="90" x2="324" y2="74" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="305" y="124" font-size="12.5" text-anchor="middle" fill="#23282d">react</text><line x1="352" y1="82" x2="362" y2="82" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 366 82 L 362 79.2 L 362 84.8 Z" fill="#8a8f94"/><rect x="368" y="60" width="86" height="44" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="411" cy="90" r="8" fill="#b4532a"/><line x1="411" y1="90" x2="392" y2="72" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><line x1="411" y1="90" x2="430" y2="74" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="411" y="124" font-size="12.5" text-anchor="middle" fill="#23282d">wash</text><line x1="458" y1="82" x2="468" y2="82" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 472 82 L 468 79.2 L 468 84.8 Z" fill="#8a8f94"/><rect x="474" y="60" width="86" height="44" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="517" cy="90" r="8" fill="#b4532a"/><line x1="517" y1="90" x2="498" y2="72" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><line x1="517" y1="90" x2="536" y2="74" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="517" y="124" font-size="12.5" text-anchor="middle" fill="#23282d">react</text><line x1="564" y1="82" x2="574" y2="82" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 578 82 L 574 79.2 L 574 84.8 Z" fill="#8a8f94"/><rect x="580" y="60" width="86" height="44" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="623" cy="90" r="8" fill="#b4532a"/><line x1="623" y1="90" x2="604" y2="72" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><line x1="623" y1="90" x2="642" y2="74" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="623" y="124" font-size="12.5" text-anchor="middle" fill="#23282d">elute</text><text x="40" y="164" font-size="14" fill="#23282d">Six transfers at 80% recovery leave 0.8^6, about 26% of the sample; six washes on a bead lose almost none.</text><text x="40" y="188" font-size="13.5" fill="#8a8f94">Used by CUT&amp;Tag (cells on concanavalin beads, one tube until PCR), Drop-seq beads, and on-bead fragmentation in NanoSeq.</text>
</svg>
