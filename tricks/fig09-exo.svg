<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 803 232" width="803" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="232" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Exonuclease I eats single-stranded DNA from the 3' end and leaves duplexes alone.</text><text x="40" y="56" font-size="13" fill="#8a8f94">after reverse transcription</text><line x1="60" y1="84" x2="220" y2="84" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="60" y1="98" x2="200" y2="98" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="230" y="90" font-size="12.5" fill="#2e6b3f">cDNA:RNA hybrid, kept</text><line x1="70" y1="128" x2="100" y2="128" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><line x1="110" y1="128" x2="140" y2="128" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><line x1="150" y1="128" x2="180" y2="128" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><line x1="190" y1="128" x2="220" y2="128" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><line x1="230" y1="128" x2="260" y2="128" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><text x="60" y="152" font-size="12.5" fill="#b4532a">leftover single-stranded primers</text><line x1="330" y1="112" x2="395" y2="112" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 400 112 L 395 108.5 L 395 115.5 Z" fill="#8a8f94"/><text x="365" y="104" font-size="12.5" text-anchor="middle" fill="#8a8f94">Exo I</text><line x1="430" y1="84" x2="590" y2="84" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="430" y1="98" x2="570" y2="98" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><circle cx="440" cy="128" r="2.4" fill="#8a8f94"/><circle cx="464" cy="128" r="2.4" fill="#8a8f94"/><circle cx="488" cy="128" r="2.4" fill="#8a8f94"/><circle cx="512" cy="128" r="2.4" fill="#8a8f94"/><circle cx="536" cy="128" r="2.4" fill="#8a8f94"/><text x="430" y="152" font-size="12.5" fill="#8a8f94">primers reduced to nucleotides</text><text x="40" y="190" font-size="13.5" fill="#23282d">Same logic on a bead (Drop-seq): primers that caught no mRNA are removed, bead barcodes that did are protected.</text><text x="40" y="212" font-size="13.5" fill="#8a8f94">Heat-inactivate afterwards, or the enzyme will digest the next primer you add.</text>
</svg>
