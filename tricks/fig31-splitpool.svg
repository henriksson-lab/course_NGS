<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 216" width="708" height="216" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="216" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Split-and-pool: each round puts the cells into wells, adds a barcode and pools them again.</text><rect x="60" y="56" width="120" height="50" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="120" y="76" font-size="13" text-anchor="middle" fill="#1f3b57">round 1</text><text x="120" y="94" font-size="12" text-anchor="middle" fill="#8a8f94">96 wells</text><line x1="186" y1="81" x2="249" y2="81" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 254 81 L 249 77.5 L 249 84.5 Z" fill="#8a8f94"/><text x="220" y="72" font-size="11.5" text-anchor="middle" fill="#8a8f94">pool</text><rect x="260" y="56" width="120" height="50" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="320" y="76" font-size="13" text-anchor="middle" fill="#1f3b57">round 2</text><text x="320" y="94" font-size="12" text-anchor="middle" fill="#8a8f94">96 wells</text><line x1="386" y1="81" x2="449" y2="81" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 454 81 L 449 77.5 L 449 84.5 Z" fill="#8a8f94"/><text x="420" y="72" font-size="11.5" text-anchor="middle" fill="#8a8f94">pool</text><rect x="460" y="56" width="120" height="50" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="520" y="76" font-size="13" text-anchor="middle" fill="#1f3b57">round 3</text><text x="520" y="94" font-size="12" text-anchor="middle" fill="#8a8f94">96 wells</text><text x="60" y="140" font-size="14" fill="#23282d">96 x 96 x 96 = 884,736 combinations, and no cell ever needs its own tube.</text><text x="60" y="166" font-size="13.5" fill="#a33a28">10,000 cells: about 1.1% share their barcode with another cell (a 'collision').</text><text x="60" y="196" font-size="13.5" fill="#8a8f94">SPLiT-seq and sci-RNA-seq3 do this on fixed cells or nuclei, so the cells survive the pooling.</text>
</svg>
