<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 742 234" width="742" height="234" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="234" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Rate depends on concentration. One molecule in a smaller volume is a higher concentration.</text><rect x="70" y="56" width="150" height="100" rx="5" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="150" cy="120" r="6" fill="#b4532a"/><text x="145" y="176" font-size="13" text-anchor="middle" fill="#a33a28">25 uL: 1 copy = 66 fM</text><rect x="330" y="106" width="50" height="50" rx="5" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="355" cy="134" r="6" fill="#b4532a"/><text x="355" y="176" font-size="13" text-anchor="middle" fill="#2e6b3f">1 uL: 1 copy = 1.7 pM</text><text x="440" y="90" font-size="13" fill="#23282d">25 times the concentration,</text><text x="440" y="108" font-size="13" fill="#23282d">so a first-order enzymatic step</text><text x="440" y="126" font-size="13" fill="#23282d">runs about 25 times faster.</text><text x="40" y="214" font-size="13.5" fill="#8a8f94">Enzyme Km values for nucleic acid are far above these figures, so rare molecules are rarely converted.</text>
</svg>
