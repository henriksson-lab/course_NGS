<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 244" width="700" height="244" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="244" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Reads count amplification. Unique molecular identifiers count what you started with.</text><text x="40" y="56" font-size="13" fill="#8a8f94">start: 3 molecules</text><circle cx="60" cy="80" r="7" fill="#b4532a"/><line x1="72" y1="80" x2="134" y2="80" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><text x="102" y="70" font-size="11.5" text-anchor="middle" fill="#8a8f94">gene A</text><circle cx="170" cy="80" r="7" fill="#1f3b57"/><line x1="182" y1="80" x2="244" y2="80" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><text x="212" y="70" font-size="11.5" text-anchor="middle" fill="#8a8f94">gene A</text><circle cx="280" cy="80" r="7" fill="#2e6b3f"/><line x1="292" y1="80" x2="354" y2="80" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><text x="322" y="70" font-size="11.5" text-anchor="middle" fill="#8a8f94">gene B</text><line x1="400" y1="80" x2="435" y2="80" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 440 80 L 435 76.5 L 435 83.5 Z" fill="#8a8f94"/><text x="420" y="66" font-size="12.5" text-anchor="middle" fill="#8a8f94">PCR</text><text x="460" y="56" font-size="13" fill="#8a8f94">after PCR: reads per molecule</text><circle cx="470" cy="74" r="5" fill="#b4532a"/><circle cx="484" cy="74" r="5" fill="#b4532a"/><circle cx="498" cy="74" r="5" fill="#b4532a"/><circle cx="512" cy="74" r="5" fill="#b4532a"/><circle cx="526" cy="74" r="5" fill="#b4532a"/><circle cx="540" cy="74" r="5" fill="#b4532a"/><circle cx="554" cy="74" r="5" fill="#b4532a"/><circle cx="568" cy="74" r="5" fill="#b4532a"/><circle cx="582" cy="74" r="5" fill="#b4532a"/><circle cx="470" cy="94" r="5" fill="#1f3b57"/><circle cx="484" cy="94" r="5" fill="#1f3b57"/><circle cx="470" cy="114" r="5" fill="#2e6b3f"/><circle cx="484" cy="114" r="5" fill="#2e6b3f"/><circle cx="498" cy="114" r="5" fill="#2e6b3f"/><circle cx="512" cy="114" r="5" fill="#2e6b3f"/><text x="40" y="170" font-size="14" fill="#a33a28">count reads:  gene A = 11, gene B = 4</text><text x="40" y="194" font-size="14" fill="#2e6b3f">count UMIs:   gene A = 2, gene B = 1  (each colour is one UMI)</text><text x="40" y="224" font-size="14" fill="#23282d">The UMI must be added before any amplification, and must differ between molecules.</text>
</svg>
