<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 228" width="796" height="228" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="228" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Single-strand library preparation: convert every strand separately, so nicks and breaks do not matter.</text><rect x="40" y="50" width="150" height="108" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="115" y="72" font-size="13.5" text-anchor="middle" fill="#b4532a" font-weight="bold">1  denature</text><text x="115" y="96" font-size="12" text-anchor="middle" fill="#23282d">double strands</text><text x="115" y="112" font-size="12" text-anchor="middle" fill="#23282d">become single</text><text x="115" y="128" font-size="12" text-anchor="middle" fill="#23282d">strands</text><line x1="194" y1="104" x2="202" y2="104" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 206 104 L 202 101.2 L 202 106.8 Z" fill="#8a8f94"/><rect x="208" y="50" width="150" height="108" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="283" y="72" font-size="13.5" text-anchor="middle" fill="#b4532a" font-weight="bold">2  ligate to 3' end</text><text x="283" y="96" font-size="12" text-anchor="middle" fill="#23282d">biotinylated adapter</text><text x="283" y="112" font-size="12" text-anchor="middle" fill="#23282d">joins each strand</text><line x1="362" y1="104" x2="370" y2="104" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 374 104 L 370 101.2 L 370 106.8 Z" fill="#8a8f94"/><rect x="376" y="50" width="150" height="108" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="451" y="72" font-size="13.5" text-anchor="middle" fill="#b4532a" font-weight="bold">3  capture, copy</text><text x="451" y="96" font-size="12" text-anchor="middle" fill="#23282d">beads hold the strand;</text><text x="451" y="112" font-size="12" text-anchor="middle" fill="#23282d">a primer makes the</text><text x="451" y="128" font-size="12" text-anchor="middle" fill="#23282d">complement</text><line x1="530" y1="104" x2="538" y2="104" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 542 104 L 538 101.2 L 538 106.8 Z" fill="#8a8f94"/><rect x="544" y="50" width="150" height="108" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="619" y="72" font-size="13.5" text-anchor="middle" fill="#b4532a" font-weight="bold">4  second adapter</text><text x="619" y="96" font-size="12" text-anchor="middle" fill="#23282d">blunt ligation onto</text><text x="619" y="112" font-size="12" text-anchor="middle" fill="#23282d">the new duplex end</text><text x="40" y="188" font-size="14" fill="#23282d">Ancient and degraded DNA is full of single-strand breaks; a duplex method loses everything that is nicked.</text><text x="40" y="210" font-size="13.5" fill="#8a8f94">Used to sequence an archaic Denisovan genome from a finger bone: the DNA was short and damaged.</text>
</svg>
