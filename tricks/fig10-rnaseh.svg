<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 256" width="740" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="256" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Tile DNA oligos along the abundant RNA; RNase H cuts the RNA only where it is paired to DNA.</text><line x1="60" y1="70" x2="520" y2="70" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="round"/><text x="536" y="74" font-size="12.5" fill="#1f3b57">rRNA</text><line x1="74" y1="84" x2="134" y2="84" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><text x="104" y="104" font-size="12" text-anchor="middle" fill="#a33a28">x</text><line x1="150" y1="84" x2="210" y2="84" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><text x="180" y="104" font-size="12" text-anchor="middle" fill="#a33a28">x</text><line x1="226" y1="84" x2="286" y2="84" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><text x="256" y="104" font-size="12" text-anchor="middle" fill="#a33a28">x</text><line x1="302" y1="84" x2="362" y2="84" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><text x="332" y="104" font-size="12" text-anchor="middle" fill="#a33a28">x</text><line x1="378" y1="84" x2="438" y2="84" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><text x="408" y="104" font-size="12" text-anchor="middle" fill="#a33a28">x</text><line x1="454" y1="84" x2="514" y2="84" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><text x="484" y="104" font-size="12" text-anchor="middle" fill="#a33a28">x</text><text x="60" y="126" font-size="12.5" fill="#b4532a">DNA oligos (reverse complement of rRNA); x = RNase H cut</text><line x1="60" y1="160" x2="520" y2="160" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="round"/><text x="536" y="164" font-size="12.5" fill="#4a6b8a">mRNA</text><text x="60" y="182" font-size="12.5" fill="#2e6b3f">no oligo, no hybrid, no cut: mRNA stays whole</text><text x="40" y="214" font-size="14" fill="#23282d">Then DNase removes the oligos, and what is left is poly(A) and non-poly(A) RNA with the rRNA gone.</text><text x="40" y="236" font-size="14" fill="#8a8f94">Unlike oligo-dT selection this keeps non-poly(A) transcripts, and works on degraded RNA.</text>
</svg>
