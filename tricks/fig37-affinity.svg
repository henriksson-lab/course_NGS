<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 831 238" width="831" height="238" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="238" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Affinity: pull down the molecules that carry the modification. Resolution is the fragment length, not the base.</text><text x="40" y="58" font-size="13" fill="#8a8f94">fragmented RNA, about 100 nt</text><line x1="60" y1="70" x2="160" y2="70" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><line x1="80" y1="82" x2="180" y2="82" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><circle cx="130" cy="82" r="4" fill="#b4532a"/><line x1="100" y1="94" x2="200" y2="94" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><line x1="60" y1="106" x2="160" y2="106" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><line x1="80" y1="118" x2="180" y2="118" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><circle cx="130" cy="118" r="4" fill="#b4532a"/><line x1="100" y1="130" x2="200" y2="130" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><line x1="240" y1="100" x2="285" y2="100" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 290 100 L 285 96.5 L 285 103.5 Z" fill="#8a8f94"/><text x="265" y="90" font-size="12" text-anchor="middle" fill="#8a8f94">antibody + beads</text><line x1="310" y1="100" x2="410" y2="100" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><circle cx="360" cy="100" r="4" fill="#b4532a"/><line x1="310" y1="124" x2="410" y2="124" stroke="#8a8f94" stroke-width="2" stroke-linecap="round"/><circle cx="360" cy="124" r="4" fill="#b4532a"/><text x="310" y="148" font-size="12.5" fill="#8a8f94">only modified fragments kept</text><text x="460" y="76" font-size="13" fill="#23282d">read pile-ups = peaks,</text><text x="460" y="94" font-size="13" fill="#23282d">compared with input</text><text x="40" y="196" font-size="13.5" fill="#23282d">m6A-seq uses an antibody; hmC-Seal labels 5hmC by glucosylation and biotin click, then pulls down.</text><text x="40" y="218" font-size="13.5" fill="#8a8f94">Cheap and works at low input, but the modified base is only known to lie within the fragment.</text>
</svg>
