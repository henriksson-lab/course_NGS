<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 238" width="970" height="238" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="238" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Cut the finished library: a molecule cleaved inside the insert loses one adapter and can no longer be amplified.</text><text x="40" y="58" font-size="13" fill="#a33a28">abundant species, e.g. mitochondrial rRNA cDNA</text><rect x="60" y="70" width="56" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="88.0" y="85.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="116" y="70" width="200" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="216.0" y="85.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">abundant insert</text><rect x="316" y="70" width="56" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="344.0" y="85.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter</text><line x1="276" y1="62" x2="276" y2="104" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 3"/><text x="276" y="122" font-size="12.5" text-anchor="middle" fill="#b4532a">Cas9 + guide cut here</text><line x1="386" y1="82" x2="427" y2="82" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 432 82 L 427 78.5 L 427 85.5 Z" fill="#8a8f94"/><rect x="448" y="62" width="56" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="476.0" y="77.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="504" y="62" width="96" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="552.0" y="77.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">half</text><rect x="448" y="94" width="96" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="496.0" y="109.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">half</text><rect x="544" y="94" width="56" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="572.0" y="109.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter</text><line x1="613" y1="66" x2="627" y2="80" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="613" y1="80" x2="627" y2="66" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="613" y1="98" x2="627" y2="112" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="613" y1="112" x2="627" y2="98" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><text x="40" y="156" font-size="13" fill="#2e6b3f">everything else in the library</text><rect x="60" y="166" width="56" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="88.0" y="181.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="116" y="166" width="200" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="216.0" y="181.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert (rare)</text><rect x="316" y="166" width="56" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="344.0" y="181.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter</text><text x="40" y="218" font-size="13" fill="#23282d">Both adapters are needed for exponential PCR and for clustering, so cut molecules drop out. The guide is chosen to hit the unwanted sequence.</text>
</svg>
