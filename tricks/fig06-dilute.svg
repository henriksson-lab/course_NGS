<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 262" width="700" height="262" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="262" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Concentration decides which end a free end finds.</text><text x="40" y="58" font-size="13" fill="#a33a28">concentrated</text><rect x="60" y="72" width="56" height="14" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="116" y1="79" x2="122" y2="79" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><rect x="122" y="72" width="56" height="14" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="178" y1="79" x2="184" y2="79" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><rect x="184" y="72" width="56" height="14" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="240" y1="79" x2="246" y2="79" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><rect x="246" y="72" width="56" height="14" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="302" y1="79" x2="308" y2="79" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><rect x="308" y="72" width="56" height="14" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="60" y="108" font-size="12.5" fill="#8a8f94">neighbours are close: ends join other molecules (concatemers)</text><text x="40" y="150" font-size="13" fill="#2e6b3f">dilute</text><path d="M 100 190 C 100 150 220 150 220 190 C 220 224 100 224 100 190 Z" fill="none" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="160" cy="223" r="4.5" fill="#b4532a"/><text x="240" y="190" font-size="12.5" fill="#8a8f94">neighbours are far; the other end of the same</text><text x="240" y="206" font-size="12.5" fill="#8a8f94">molecule is nearest: it circularises</text><text x="40" y="246" font-size="14" fill="#23282d">Used for Hi-C (join ends that were crosslinked together), iCLIP and DNBSEQ (make circles).</text>
</svg>
