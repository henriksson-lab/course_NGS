<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 901 210" width="901" height="210" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="210" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Chemical conversion: bisulfite turns unmethylated C into U (read as T). 5mC is protected and still reads as C.</text><text x="40" y="66" font-size="13" fill="#8a8f94">original</text><text x="40" y="106" font-size="13" fill="#8a8f94">after bisulfite</text><text x="190" y="66" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="212" y="66" font-size="18" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="234" y="66" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="256" y="66" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="278" y="66" font-size="18" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="300" y="66" font-size="18" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="322" y="66" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="344" y="66" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="366" y="66" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="212" y="46" font-size="13" text-anchor="middle" fill="#b4532a">m</text><text x="190" y="106" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="212" y="106" font-size="18" fill="#2e6b3f" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="234" y="106" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="256" y="106" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="278" y="106" font-size="18" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="300" y="106" font-size="18" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="322" y="106" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="344" y="106" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="366" y="106" font-size="18" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="430" y="66" font-size="12.5" fill="#b4532a">m = 5-methylcytosine</text><text x="430" y="106" font-size="12.5" fill="#a33a28">red: C read as T (unmethylated)</text><text x="430" y="126" font-size="12.5" fill="#2e6b3f">green: C kept (methylated)</text><text x="40" y="168" font-size="14" fill="#23282d">The read now says which C was methylated, at base resolution. The cost: three-letter reads (C is scarce), and DNA damage.</text><text x="40" y="190" font-size="13.5" fill="#8a8f94">Enzymatic methyl-seq (EM-seq) gives the same readout without chemical damage: TET2 protects, APOBEC deaminates.</text>
</svg>
