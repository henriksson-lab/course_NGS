<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 244" width="770" height="244" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="244" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A spike-in is a known quantity added at the start. Everything is measured against it.</text><text x="40" y="58" font-size="13" fill="#8a8f94">sample 1</text><text x="40" y="118" font-size="13" fill="#8a8f94">sample 2</text><rect x="130" y="46" width="160" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="210.0" y="61" font-size="11.5" text-anchor="middle" fill="#1f3b57">endogenous reads</text><rect x="296" y="46" width="40" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="316.0" y="61" font-size="11" text-anchor="middle" fill="#b4532a">spike</text><rect x="130" y="106" width="320" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="290.0" y="121" font-size="11.5" text-anchor="middle" fill="#1f3b57">endogenous reads</text><rect x="456" y="106" width="40" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="476.0" y="121" font-size="11" text-anchor="middle" fill="#b4532a">spike</text><text x="40" y="176" font-size="14" fill="#23282d">Spike-in reads are the same in both: the true difference in endogenous input is 2x.</text><text x="40" y="198" font-size="14" fill="#a33a28">Without it, per-million normalisation hides a global change.</text><text x="40" y="224" font-size="13.5" fill="#8a8f94">Examples: synthetic ERCC RNA in RNA-seq, foreign chromatin in ChIP, carry-over E. coli DNA in CUT&amp;Tag.</text>
</svg>
