<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 817 206" width="817" height="206" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="206" fill="none"/>
<text x="40" y="28" font-size="14" fill="#23282d">Block one strand of the join: the insert has no 5'-phosphate, so it can only be joined on one strand.</text><rect x="60" y="62" width="60" height="56" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="120" y="62" width="210" height="56" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><rect x="330" y="62" width="60" height="56" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="90" y="52" font-size="12" text-anchor="middle" fill="#1f3b57">adapter</text><text x="225" y="52" font-size="12" text-anchor="middle" fill="#8a8f94">insert, 5'-OH ends</text><text x="360" y="52" font-size="12" text-anchor="middle" fill="#a33a28">adapter</text><line x1="66" y1="78" x2="114" y2="78" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="126" y1="78" x2="384" y2="78" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="66" y1="100" x2="324" y2="100" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="336" y1="100" x2="384" y2="100" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><circle cx="120" cy="78" r="4.5" fill="#b4532a"/><circle cx="330" cy="100" r="4.5" fill="#b4532a"/><text x="120" y="140" font-size="12" text-anchor="middle" fill="#b4532a">nick, top strand</text><text x="330" y="140" font-size="12" text-anchor="middle" fill="#b4532a">nick, bottom strand</text><text x="225" y="160" font-size="12" text-anchor="middle" fill="#8a8f94">one strand joined at each end; the nicks are on opposite strands</text><rect x="470" y="70" width="80" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="510.0" y="85.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="570" y="70" width="80" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="610.0" y="85.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><line x1="553" y1="74" x2="567" y2="88" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="553" y1="88" x2="567" y2="74" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><text x="560" y="112" font-size="12" text-anchor="middle" fill="#8a8f94">no 5'-P to donate:</text><text x="560" y="128" font-size="12" text-anchor="middle" fill="#8a8f94">no concatemers</text><text x="40" y="186" font-size="14" fill="#23282d">The nick is repaired later by the polymerase in the first PCR cycle, or by the cell if the library is cloned.</text>
</svg>
