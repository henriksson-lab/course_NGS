<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 822 224" width="822" height="224" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="224" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Where the UMI goes depends on which step first touches each molecule.</text><text x="40" y="67" font-size="12.5" fill="#23282d">on the RT primer</text><rect x="220" y="52" width="52" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="246.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#b4532a">cell BC</text><rect x="272" y="52" width="40" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="292.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">UMI</text><rect x="312" y="52" width="60" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="342.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">oligo-dT</text><rect x="372" y="52" width="150" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="447.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">cDNA 3' end</text><text x="536" y="67" font-size="12" fill="#8a8f94">10x, Drop-seq, CEL-seq: 3' counting</text><text x="40" y="113" font-size="12.5" fill="#23282d">on the TSO</text><rect x="220" y="98" width="52" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="246.0" y="113.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">adapter</text><rect x="272" y="98" width="40" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="292.0" y="113.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">UMI</text><rect x="312" y="98" width="30" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="327.0" y="113.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">GGG</text><rect x="342" y="98" width="150" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="417.0" y="113.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">cDNA 5' end</text><text x="506" y="113" font-size="12" fill="#8a8f94">Smart-seq3: 5' UMI, full-length body</text><text x="40" y="159" font-size="12.5" fill="#23282d">on the ligated adapter</text><rect x="220" y="144" width="40" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="240.0" y="159.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">UMI</text><rect x="260" y="144" width="52" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="286.0" y="159.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">adapter</text><rect x="312" y="144" width="150" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="387.0" y="159.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">DNA insert</text><rect x="462" y="144" width="52" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="488.0" y="159.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">adapter</text><rect x="514" y="144" width="40" height="22" rx="3" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="534.0" y="159.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">UMI</text><text x="568" y="159" font-size="12" fill="#8a8f94">Safe-SeqS, duplex methods: DNA molecules</text><text x="40" y="204" font-size="14" fill="#23282d">A UMI of L bases gives 4^L labels, but errors in it create false molecules: allow for them when counting.</text>
</svg>
