<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 915 232" width="915" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="232" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Cap trapping: only RNA that carries its cap and a cDNA all the way to it survives the selection.</text><text x="40" y="58" font-size="13" fill="#2e6b3f">full length</text><line x1="130" y1="62" x2="400" y2="62" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="130" y1="78" x2="400" y2="78" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><circle cx="130" cy="62" r="6" fill="#b4532a"/><text x="140" y="52" font-size="12" fill="#b4532a">cap (oxidised, biotinylated)</text><text x="420" y="74" font-size="12.5" fill="#2e6b3f">hybrid fully paired: protected</text><text x="40" y="120" font-size="13" fill="#a33a28">truncated</text><line x1="130" y1="124" x2="400" y2="124" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="240" y1="140" x2="400" y2="140" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><circle cx="130" cy="124" r="6" fill="#b4532a"/><line x1="178" y1="117" x2="192" y2="131" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="178" y1="131" x2="192" y2="117" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><text x="420" y="130" font-size="12.5" fill="#a33a28">single-stranded tail is cut by RNase,</text><text x="420" y="146" font-size="12.5" fill="#a33a28">cap-biotin is lost</text><text x="40" y="190" font-size="14" fill="#23282d">Streptavidin beads then keep only the first kind, and the cDNA is released: every tag now marks a real transcription start.</text><text x="40" y="212" font-size="13.5" fill="#8a8f94">Used for CAGE to map promoters in human cells; periodate is what makes the cap and 3' ribose reactive.</text>
</svg>
