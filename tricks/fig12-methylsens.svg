<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 912 232" width="912" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="232" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Restriction enzymes that read methylation: the cut itself becomes the information.</text><text x="40" y="66" font-size="13" fill="#8a8f94">site</text><text x="130.0" y="66" font-size="16" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="143.5" y="66" font-size="16" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="157.0" y="66" font-size="16" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="170.5" y="66" font-size="16" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="147.5" y="46" font-size="13" text-anchor="middle" fill="#b4532a">m</text><text x="190" y="66" font-size="12.5" fill="#b4532a">methylated (5mC at the inner C)</text><text x="40" y="106" font-size="13" fill="#23282d">MspI</text><line x1="123" y1="100" x2="128" y2="106" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="128" y1="106" x2="137" y2="93" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><text x="160" y="106" font-size="12.5" fill="#8a8f94">cuts whether or not it is methylated</text><text x="40" y="140" font-size="13" fill="#23282d">HpaII</text><line x1="123" y1="128" x2="137" y2="142" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="123" y1="142" x2="137" y2="128" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><text x="160" y="140" font-size="12.5" fill="#8a8f94">blocked by the methyl group; cuts only unmethylated CCGG</text><text x="40" y="190" font-size="13" fill="#23282d">RRBS uses MspI to enrich CpG-rich fragments regardless of state; MSCC uses HpaII so that only unmethylated sites receive an adapter.</text><text x="40" y="212" font-size="13" fill="#8a8f94">Compare the two digests of the same DNA and the difference is the methylation of that site.</text>
</svg>
