<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 824 212" width="824" height="212" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="212" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Pre-amplify while everything is still one tube, then split: the scarce step is shared by every later question.</text><rect x="50" y="60" width="110" height="50" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="105.0" y="81.7" font-size="12" text-anchor="middle" fill="#1f3b57">one cell</text><text x="105.0" y="96.7" font-size="12" text-anchor="middle" fill="#1f3b57">lysate</text><line x1="168" y1="85" x2="213" y2="85" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 218 85 L 213 81.5 L 213 88.5 Z" fill="#8a8f94"/><text x="193" y="74" font-size="12" text-anchor="middle" fill="#8a8f94">RT + PCR</text><rect x="224" y="60" width="110" height="50" rx="4" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="279.0" y="89.375" font-size="12.5" text-anchor="middle" fill="#23282d">cDNA pool</text><line x1="342" y1="85" x2="396" y2="64" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><rect x="404" y="50" width="170" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="489.0" y="68.2" font-size="12" text-anchor="middle" fill="#23282d">sequencing library</text><line x1="342" y1="85" x2="395" y2="85" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 400 85 L 395 81.5 L 395 88.5 Z" fill="#8a8f94"/><rect x="404" y="88" width="170" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="489.0" y="106.2" font-size="12" text-anchor="middle" fill="#23282d">qPCR check of genes</text><line x1="342" y1="85" x2="396" y2="140" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><rect x="404" y="126" width="170" height="28" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="489.0" y="144.2" font-size="12" text-anchor="middle" fill="#23282d">archive for later</text><text x="40" y="170" font-size="13.5" fill="#23282d">Smart-seq2 amplifies cDNA first, then tagments a small part; G&amp;T-seq splits the RNA and DNA of one cell.</text><text x="40" y="192" font-size="13.5" fill="#8a8f94">The price: amplification bias is baked into the pool, so check the pool before spending it.</text>
</svg>
