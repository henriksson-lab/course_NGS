<text x="40" y="28" font-size="14" fill="#23282d">A ligase joins any 5'-phosphate to any 3'-OH it meets. It cannot tell which ones you meant.</text><text x="40" y="73" font-size="13" fill="#23282d">wanted</text><rect x="230" y="58" width="56" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="258.0" y="73.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="286" y="58" width="130" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="351.0" y="73.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="416" y="58" width="56" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="444.0" y="73.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter</text><line x1="489" y1="69" x2="494" y2="75" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="494" y1="75" x2="503" y2="62" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><text x="40" y="113" font-size="13" fill="#23282d">insert + insert</text><rect x="230" y="98" width="56" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="258.0" y="113.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="286" y="98" width="130" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="351.0" y="113.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="416" y="98" width="130" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="481.0" y="113.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="546" y="98" width="56" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="574.0" y="113.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter</text><line x1="619" y1="102" x2="633" y2="116" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="619" y1="116" x2="633" y2="102" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><text x="40" y="153" font-size="13" fill="#23282d">adapter + adapter</text><rect x="230" y="138" width="56" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="258.0" y="153.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="286" y="138" width="56" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="314.0" y="153.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter</text><line x1="359" y1="142" x2="373" y2="156" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="359" y1="156" x2="373" y2="142" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><text x="40" y="196" font-size="14" fill="#8a8f94">Concatemers waste insert; adapter dimers cluster better than anything else in the tube.</text><text x="40" y="220" font-size="14" fill="#b4532a">Each trick below removes one of the unwanted joins by changing a chemical group, not by adding more enzyme.</text>
