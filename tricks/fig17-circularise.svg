<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 979 278" width="979" height="278" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="278" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Circularise, then cut elsewhere: an end that has no handle becomes an internal position with sequence on both sides.</text><text x="40" y="56" font-size="13" fill="#b4532a">1  linear cDNA</text><rect x="60" y="66" width="150" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="135.0" y="81.025" font-size="11.5" text-anchor="middle" fill="#b4532a">primer, barcode, cut site</text><rect x="210" y="66" width="170" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="295.0" y="81.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">cDNA</text><circle cx="388" cy="77" r="6" fill="#a33a28"/><text x="400" y="82" font-size="12.5" fill="#a33a28">truncated end: the informative base</text><text x="40" y="128" font-size="13" fill="#b4532a">2  ligate ends</text><path d="M 110 190 C 110 140 250 140 250 190 C 250 232 110 232 110 190 Z" fill="none" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="180" cy="152" r="6" fill="#a33a28"/><text x="262" y="168" font-size="12.5" fill="#8a8f94">informative end now sits next to</text><text x="262" y="184" font-size="12.5" fill="#8a8f94">the primer part</text><text x="40" y="258" font-size="13.5" fill="#23282d">3  cut at the site in the primer: a new linear molecule, with the informative base next to an adapter that PCR and the sequencer can use.</text><line x1="150" y1="149" x2="150" y2="163" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><text x="150" y="141" font-size="12.5" text-anchor="middle" fill="#b4532a">cut</text>
</svg>
