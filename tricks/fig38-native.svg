<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 796 274" width="796" height="274" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="274" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Native readout: no conversion. A modified base changes the signal the instrument records.</text><polyline points="80,120 106,120 106,120 132,120 132,142 158,142 158,142 184,142 184,142 210,142 210,116 236,116 236,116 262,116 262,150 288,150 288,150 314,150" fill="none" stroke="#1f3b57" stroke-width="2"/><text x="80" y="52" font-size="12.5" fill="#8a8f94">nanopore current while one k-mer passes</text><rect x="210" y="106" width="52" height="60" fill="#b4532a" opacity="0.18"/><line x1="216" y1="136" x2="256" y2="136" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 3"/><text x="272" y="140" font-size="11" fill="#8a8f94">level without the 5mC</text><text x="236.0" y="186" font-size="12" text-anchor="middle" fill="#b4532a">same k-mer,</text><text x="236.0" y="200" font-size="12" text-anchor="middle" fill="#b4532a">5mC: level shifts</text><text x="40" y="232" font-size="14" fill="#23282d">Methylation is called without bisulfite and with long reads, so it can be phased to a haplotype or a read.</text><text x="40" y="254" font-size="13.5" fill="#8a8f94">PacBio reads modifications from polymerase kinetics instead.</text>
</svg>
