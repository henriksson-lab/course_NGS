<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 216" width="838" height="216" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="216" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A hairpin adapter ligates intramolecularly. One cut then opens it into the Y-shaped adapter the flow cell needs.</text><text x="40" y="66" font-size="13" fill="#b4532a">1  ligate</text><text x="40" y="84" font-size="12" fill="#8a8f94">hairpins join both ends</text><line x1="300" y1="60" x2="560" y2="60" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="300" y1="84" x2="560" y2="84" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="430" y="50" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><path d="M 300 60 C 266 60 266 84 300 84" fill="none" stroke="#6b5b8a" stroke-width="2.8" stroke-linecap="round"/><circle cx="274" cy="72" r="4.5" fill="#b4532a"/><path d="M 560 60 C 594 60 594 84 560 84" fill="none" stroke="#6b5b8a" stroke-width="2.8" stroke-linecap="round"/><circle cx="586" cy="72" r="4.5" fill="#b4532a"/><text x="262" y="50" font-size="12" text-anchor="end" fill="#b4532a">U in loop</text><text x="40" y="150" font-size="13" fill="#b4532a">2  USER enzyme mix</text><text x="40" y="168" font-size="12" fill="#8a8f94">cuts at the U, loop opens</text><line x1="340" y1="150" x2="520" y2="150" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="340" y1="174" x2="520" y2="174" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="340" y1="150" x2="310" y2="132" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="340" y1="174" x2="310" y2="192" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><line x1="520" y1="150" x2="550" y2="132" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="520" y1="174" x2="550" y2="192" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="300" y="128" font-size="12" text-anchor="end" fill="#1f3b57">P5 arm</text><text x="300" y="204" font-size="12" text-anchor="end" fill="#8a8f94">unpaired</text><text x="560" y="128" font-size="12" fill="#a33a28">P7 arm</text><text x="570" y="176" font-size="12.5" fill="#23282d">same hairpin on both ends,</text><text x="570" y="192" font-size="12.5" fill="#23282d">forked only after the cut</text>
</svg>
