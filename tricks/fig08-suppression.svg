<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 252" width="884" height="252" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="252" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Suppression PCR: a molecule with the same long sequence on both ends folds on itself before a primer can bind.</text><text x="40" y="56" font-size="13" fill="#a33a28">same end A ... A'</text><path d="M 140 150 L 140 118 C 60 118 60 66 150 66 C 240 66 240 118 160 118 L 160 150" fill="none" stroke="#1f3b57" stroke-width="2.6" stroke-linecap="round"/><line x1="140" y1="124" x2="160" y2="124" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><line x1="140" y1="134" x2="160" y2="134" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="140" y="170" font-size="12" text-anchor="middle" fill="#6b5b8a">A</text><text x="160" y="170" font-size="12" fill="#6b5b8a">A'</text><text x="268" y="92" font-size="12.5" fill="#8a8f94">stem-loop: the ends</text><text x="268" y="108" font-size="12.5" fill="#8a8f94">pair with each other</text><line x1="30" y1="190" x2="95" y2="190" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 100 190 L 95 186.5 L 95 193.5 Z" fill="#b4532a"/><text x="108" y="194" font-size="12.5" fill="#b4532a">a primer cannot compete</text><line x1="233" y1="143" x2="247" y2="157" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><line x1="233" y1="157" x2="247" y2="143" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><text x="430" y="56" font-size="13" fill="#2e6b3f">different ends A ... B'</text><line x1="430" y1="150" x2="640" y2="150" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="430" y="130" width="36" height="16" rx="2" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="448.0" y="141.85" font-size="11" text-anchor="middle" fill="#1f3b57">A</text><rect x="604" y="130" width="36" height="16" rx="2" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="622.0" y="141.85" font-size="11" text-anchor="middle" fill="#a33a28">B'</text><line x1="430" y1="112" x2="465" y2="112" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><path d="M 470 112 L 465 108.5 L 465 115.5 Z" fill="#2e6b3f"/><text x="476" y="116" font-size="12.5" fill="#2e6b3f">primer A binds</text><line x1="640" y1="94" x2="605" y2="94" stroke="#2e6b3f" stroke-width="1.6" stroke-linecap="round"/><path d="M 600 94 L 605 90.5 L 605 97.5 Z" fill="#2e6b3f"/><text x="640" y="80" font-size="12.5" text-anchor="end" fill="#2e6b3f">primer B binds</text><line x1="661" y1="150" x2="666" y2="156" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><line x1="666" y1="156" x2="675" y2="143" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><text x="40" y="232" font-size="13.5" fill="#23282d">Used when many products carry the same end (primer by-products, tailed cDNA): they are suppressed, the useful ones are not.</text>
</svg>
