<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 729 256" width="729" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="256" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Droplets: dilute the cells so that a droplet rarely has two. The price is that most are empty.</text><rect x="70" y="81.41950983568486" width="60" height="108.58049016431514" fill="#8a8f94" opacity="0.35"/><text x="100" y="208" font-size="12.5" text-anchor="middle" fill="#23282d">0 cells</text><text x="100" y="75.41950983568486" font-size="12.5" text-anchor="middle" fill="#23282d">90.5%</text><rect x="170" y="179.14195098356848" width="60" height="10.858049016431515" fill="#2e6b3f" opacity="0.35"/><text x="200" y="208" font-size="12.5" text-anchor="middle" fill="#23282d">1 cell</text><text x="200" y="173.14195098356848" font-size="12.5" text-anchor="middle" fill="#23282d">9.0%</text><rect x="270" y="188" width="60" height="2" fill="#a33a28" opacity="0.35"/><text x="300" y="208" font-size="12.5" text-anchor="middle" fill="#23282d">2 cells</text><text x="300" y="182" font-size="12.5" text-anchor="middle" fill="#23282d">0.5%</text><text x="400" y="80" font-size="13" fill="#23282d">average 0.1 cells per droplet (Poisson)</text><text x="400" y="106" font-size="12.5" fill="#8a8f94">occupied droplets:  9.52%</text><text x="400" y="124" font-size="12.5" fill="#8a8f94">two or more cells:  0.47%</text><text x="400" y="150" font-size="13" fill="#a33a28">doublets among occupied:  4.9%</text><text x="40" y="238" font-size="13.5" fill="#8a8f94">Raise the loading and doublets climb faster than yield. Drop-seq, inDrop and 10x all trade this off.</text>
</svg>
