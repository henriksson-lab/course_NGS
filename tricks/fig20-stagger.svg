<text x="40" y="26" font-size="14" fill="#23282d">Staggered primers: shift the same amplicon by a different number of bases, so each cycle sees all four.</text><text x="40" y="54" font-size="12" fill="#8a8f94">shared amplicon start</text><text x="80.5" y="80" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="94.0" y="80" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="107.5" y="80" font-size="13" fill="#2e6b3f" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="121.0" y="80" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="134.5" y="80" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="148.0" y="80" font-size="13" fill="#2e6b3f" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="161.5" y="80" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="175.0" y="80" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="200.5" y="80" font-size="12" fill="#8a8f94">+0</text><text x="67.0" y="102" font-size="13" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="80.5" y="102" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="94.0" y="102" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="107.5" y="102" font-size="13" fill="#2e6b3f" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="121.0" y="102" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans