ith stagger the mixture looks</text><text x="400" y="172" font-size="12.5" fill="#2e6b3f">like a normal library</text><text x="40" y="206" font-size="13.5" fill="#23282d">Amplicon and CRISPR-screen readouts: the Joung protocol mixes ten forward primers that differ in stagger. PhiX is the alternative.</text>
