<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 891 214" width="891" height="214" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="214" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">The molecule budget: you cannot sequence more unique molecules than you had, however many cycles you run.</text><rect x="60" y="54" width="420.0" height="22" rx="3" fill="none" stroke="#1f3b57" stroke-width="1.2"/><rect x="60" y="54" width="420.0" height="22" fill="#1f3b57" opacity="0.22"/><text x="490.0" y="69" font-size="12.5" fill="#23282d">300 copies of each locus  (1 ng human DNA)</text><rect x="60" y="88" width="125.99999999999999" height="22" rx="3" fill="none" stroke="#4a6b8a" stroke-width="1.2"/><rect x="60" y="88" width="125.99999999999999" height="22" fill="#4a6b8a" opacity="0.22"/><text x="196.0" y="103" font-size="12.5" fill="#23282d">90 copies of each locus  (after ligation, 30% assumed)</text><rect x="60" y="122" width="88.19999999999999" height="22" rx="3" fill="none" stroke="#2e6b3f" stroke-width="1.2"/><rect x="60" y="122" width="88.19999999999999" height="22" fill="#2e6b3f" opacity="0.22"/><text x="158.2" y="137" font-size="12.5" fill="#23282d">63 copies of each locus  (after cleanup, 70% of that)</text><text x="40" y="172" font-size="13.5" fill="#23282d">1 ng is about 300 haploid genome copies (3.3 pg each). 30x coverage of unique molecules needs most of them.</text><text x="40" y="194" font-size="13.5" fill="#23282d">More PCR cycles add reads, not information: duplicates rise instead. A PCR-free preparation skips the loss, and costs input.</text>
</svg>
