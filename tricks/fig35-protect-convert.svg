<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 244" width="756" height="244" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="244" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Protect, then convert: pick the chemistry whose protection step isolates the base you want.</text><text x="200" y="52" font-size="12.5" text-anchor="middle" fill="#8a8f94">unmodified C</text><text x="320" y="52" font-size="12.5" text-anchor="middle" fill="#8a8f94">5mC</text><text x="440" y="52" font-size="12.5" text-anchor="middle" fill="#8a8f94">5hmC</text><text x="40" y="84" font-size="13" fill="#23282d">BS-seq</text><rect x="150" y="64" width="100" height="24" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="200.0" y="80.9" font-size="14" text-anchor="middle" fill="#a33a28">T</text><rect x="270" y="64" width="100" height="24" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="320.0" y="80.9" font-size="14" text-anchor="middle" fill="#2e6b3f">C</text><rect x="390" y="64" width="100" height="24" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="440.0" y="80.9" font-size="14" text-anchor="middle" fill="#2e6b3f">C</text><text x="40" y="114" font-size="13" fill="#23282d">oxBS-seq</text><rect x="150" y="94" width="100" height="24" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="200.0" y="110.9" font-size="14" text-anchor="middle" fill="#a33a28">T</text><rect x="270" y="94" width="100" height="24" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="320.0" y="110.9" font-size="14" text-anchor="middle" fill="#2e6b3f">C</text><rect x="390" y="94" width="100" height="24" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="440.0" y="110.9" font-size="14" text-anchor="middle" fill="#a33a28">T</text><text x="40" y="144" font-size="13" fill="#23282d">TAB-seq</text><rect x="150" y="124" width="100" height="24" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="200.0" y="140.9" font-size="14" text-anchor="middle" fill="#a33a28">T</text><rect x="270" y="124" width="100" height="24" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="320.0" y="140.9" font-size="14" text-anchor="middle" fill="#a33a28">T</text><rect x="390" y="124" width="100" height="24" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="440.0" y="140.9" font-size="14" text-anchor="middle" fill="#2e6b3f">C</text><text x="40" y="174" font-size="13" fill="#23282d">EM-seq</text><rect x="150" y="154" width="100" height="24" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="200.0" y="170.9" font-size="14" text-anchor="middle" fill="#a33a28">T</text><rect x="270" y="154" width="100" height="24" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="320.0" y="170.9" font-size="14" text-anchor="middle" fill="#2e6b3f">C</text><rect x="390" y="154" width="100" height="24" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="440.0" y="170.9" font-size="14" text-anchor="middle" fill="#2e6b3f">C</text><text x="40" y="204" font-size="13.5" fill="#23282d">Table shows what each cytosine reads as. Subtract BS from oxBS to get 5hmC; TAB-seq reads 5hmC directly.</text><text x="40" y="226" font-size="13.5" fill="#8a8f94">oxBS oxidises 5hmC away; TAB protects 5hmC and oxidises 5mC away.</text>
</svg>
