<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 747 238" width="747" height="238" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="238" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">An adapter dimer is a complete library with no insert, and it is the shortest one.</text><text x="40" y="75" font-size="13" fill="#23282d">library</text><rect x="170" y="60" width="62" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="201.0" y="76.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 · i5 · R1</text><rect x="232" y="60" width="186.0" height="24" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="325.0" y="76.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert, about 300 bp</text><rect x="418.0" y="60" width="62" height="24" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="449.0" y="76.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 · i7 · P7</text><text x="40" y="119" font-size="13" fill="#23282d">adapter dimer</text><rect x="170" y="104" width="62" height="24" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="201.0" y="120.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 · i5 · R1</text><rect x="232" y="104" width="62" height="24" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="263.0" y="120.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 · i7 · P7</text><text x="170" y="160" font-size="12.5" fill="#a33a28">about 120-130 bp</text><text x="40" y="194" font-size="14" fill="#23282d">Why it hurts: it amplifies and clusters more efficiently than the library, and reads 100% adapter.</text><text x="40" y="218" font-size="14" fill="#8a8f94">Prevent: titrate adapter to the insert, keep the ends blocked, clean up twice. Rescue: size-select.</text>
</svg>
