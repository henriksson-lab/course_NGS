<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 763 256" width="763" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="640" height="256" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Sequencing errors create near-copies of real UMIs. Merge a small UMI into a large neighbour.</text><line x1="110" y1="146.4" x2="110" y2="119.71801207018598" stroke="#8a8f94" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><line x1="320" y1="147.45441558772842" x2="320" y2="110.6489436095793" stroke="#8a8f94" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 3"/><circle cx="110" cy="90" r="30" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.6"/><text x="110" y="94" font-size="11" text-anchor="middle" fill="#1f3b57">120</text><text x="145.71801207018598" y="94" font-size="12" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ACGTAC</text><circle cx="110" cy="160" r="14" fill="none" stroke="#8a8f94" stroke-width="1.6"/><text x="110" y="164" font-size="11" text-anchor="middle" fill="#8a8f94">4</text><text x="129.6" y="164" font-size="12" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ACGTAG</text><circle cx="320" cy="90" r="21" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.6"/><text x="320" y="94" font-size="11" text-anchor="middle" fill="#1f3b57">35</text><text x="346.6489436095793" y="94" font-size="12" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>TTGCAA</text><circle cx="320" cy="160" r="13" fill="none" stroke="#8a8f94" stroke-width="1.6"/><text x="320" y="164" font-size="11" text-anchor="middle" fill="#8a8f94">2</text><text x="338.5455844122716" y="164" font-size="12" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>TTGCAT</text><circle cx="480" cy="125" r="15" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.6"/><text x="480" y="129" font-size="11" text-anchor="middle" fill="#1f3b57">9</text><text x="501.4" y="129" font-size="12" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GGATCC</text><text x="40" y="212" font-size="14" fill="#2e6b3f">5 distinct UMI strings, 3 real molecules.</text><text x="40" y="236" font-size="13.5" fill="#23282d">UMIs within one mismatch of a much more abundant UMI are read as its errors (a directional network rule).</text>
</svg>
