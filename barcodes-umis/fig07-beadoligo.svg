<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 918 272" width="918" height="272" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="272" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Bead-bound barcodes: one barcode per bead, a different UMI on every oligo.</text><circle cx="90" cy="150" r="52" fill="#dfe3e6" stroke="#8a8f94" stroke-width="1.2"/><text x="90" y="154" font-size="11" text-anchor="middle" fill="#8a8f94">bead</text><line x1="130" y1="150" x2="190" y2="88" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="190" y="75" width="80" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="230.0" y="91.85" font-size="11" text-anchor="middle" fill="#1f3b57">PCR handle</text><rect x="270" y="75" width="100" height="26" rx="4" fill="#f7ede6" stroke="#b4532a" stroke-width="1.2"/><text x="320.0" y="92.025" font-size="11.5" text-anchor="middle" fill="#b4532a">ACGTTGCAGTCA</text><rect x="370" y="75" width="76" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="408.0" y="92.025" font-size="11.5" text-anchor="middle" fill="#a33a28">GTCAGTAA</text><rect x="446" y="75" width="90" height="26" rx="4" fill="#eaf2ec" stroke="#2e6b3f" stroke-width="1.2"/><text x="491.0" y="92.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">TTTTTTTT...</text><line x1="130" y1="150" x2="190" y2="128" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="190" y="115" width="80" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="230.0" y="131.85" font-size="11" text-anchor="middle" fill="#1f3b57">PCR handle</text><rect x="270" y="115" width="100" height="26" rx="4" fill="#f7ede6" stroke="#b4532a" stroke-width="1.2"/><text x="320.0" y="132.025" font-size="11.5" text-anchor="middle" fill="#b4532a">ACGTTGCAGTCA</text><rect x="370" y="115" width="76" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="408.0" y="132.025" font-size="11.5" text-anchor="middle" fill="#a33a28">CCATGAAT</text><rect x="446" y="115" width="90" height="26" rx="4" fill="#eaf2ec" stroke="#2e6b3f" stroke-width="1.2"/><text x="491.0" y="132.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">TTTTTTTT...</text><line x1="130" y1="150" x2="190" y2="168" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><rect x="190" y="155" width="80" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="230.0" y="171.85" font-size="11" text-anchor="middle" fill="#1f3b57">PCR handle</text><rect x="270" y="155" width="100" height="26" rx="4" fill="#f7ede6" stroke="#b4532a" stroke-width="1.2"/><text x="320.0" y="172.025" font-size="11.5" text-anchor="middle" fill="#b4532a">ACGTTGCAGTCA</text><rect x="370" y="155" width="76" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="408.0" y="172.025" font-size="11.5" text-anchor="middle" fill="#a33a28">TAGGCTCA</text><rect x="446" y="155" width="90" height="26" rx="4" fill="#eaf2ec" stroke="#2e6b3f" stroke-width="1.2"/><text x="491.0" y="172.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">TTTTTTTT...</text><text x="230" y="54" font-size="11.5" text-anchor="middle" fill="#1f3b57">handle</text><text x="320" y="54" font-size="11.5" text-anchor="middle" fill="#b4532a">cell barcode</text><text x="320" y="68" font-size="10.5" text-anchor="middle" fill="#b4532a">(same on the bead)</text><text x="448" y="54" font-size="11.5" text-anchor="middle" fill="#a33a28">UMI</text><text x="448" y="68" font-size="10.5" text-anchor="middle" fill="#a33a28">(differs per oligo)</text><text x="530" y="218" font-size="11.5" text-anchor="middle" fill="#2e6b3f">oligo-dT captures poly(A) mRNA</text><text x="40" y="252" font-size="13.5" fill="#23282d">Only the cell barcode is shared. The UMIs make every captured molecule distinct. Drop-seq uses 12 nt of barcode and 8 nt of UMI.</text>
</svg>
