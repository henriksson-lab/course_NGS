<text x="40" y="26" font-size="14" fill="#23282d">One construct, four reads: cycles drawn to scale (28 / 10 / 10 / 90).</text><text x="40" y="73" font-size="12.5" fill="#23282d">Read 1</text><rect x="160" y="56" width="83.2" height="26" rx="4" fill="#f7ede6" stroke="#b4532a" stroke-width="1.2"/><text x="201.6" y="72.85" font-size="11" text-anchor="middle" fill="#b4532a">cell barcode 16</text><rect x="243.2" y="56" width="62.400000000000006" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="274.4" y="72.85" font-size="11" text-anchor="middle" fill="#a33a28">UMI 12</text><text x="40" y="117" font-size="12.5" fill="#23282d">Index 1 (i7)</text><rect x="160" y="100" width="52.0" height="26" rx="4" fill="#eaf2ec" stroke="#2e6b3f" stroke-width="1.2"/><text x="218.0" y="118" font-size="11" fill="#2e6b3f">sample 10</text><text x="40" y="161" font-size="12.5" fill="#23282d">Index 2 (i5)</text><rect x="160" y="144" width="52.0" height="26" rx="4" fill="#eaf2ec" stroke="#2e6b3f" stroke-width="1.2"/><text x="218.0" y="162" font-size="11" fill="#2e6b3f">sample 10</text><text x="40" y="205" font-size="12.5" fill="#23282d">Read 2</text><rect x="160" y="188" width="468.0" height="26" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="394.0" y="204.85" font-size="11" text-anchor="middle" fill="#23282d">cDNA insert  90 cycles</text><text x="40" y="244" font-size="13.5" fill="#23282d">Total: 138 cycles. Only Read 2 reads the transcript; the other 48 cycles say whose it is.</text>
