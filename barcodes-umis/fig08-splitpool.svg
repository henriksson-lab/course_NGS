<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 857 274" width="857" height="274" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="274" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Split-pool: each round appends one barcode, and the path through the wells is the cell's identity.</text><text x="132" y="52" font-size="12.5" text-anchor="middle" fill="#23282d">round 1</text><rect x="110" y="70" width="44" height="30" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="132.0" y="89.2" font-size="12" text-anchor="middle" fill="#8a8f94">A1</text><rect x="110" y="114" width="44" height="30" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="132.0" y="133.2" font-size="12" text-anchor="middle" fill="#8a8f94">B1</text><rect x="110" y="158" width="44" height="30" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="132.0" y="177.2" font-size="12" text-anchor="middle" fill="#8a8f94">C1</text><text x="322" y="52" font-size="12.5" text-anchor="middle" fill="#23282d">round 2</text><rect x="300" y="70" width="44" height="30" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="322.0" y="89.2" font-size="12" text-anchor="middle" fill="#8a8f94">A2</text><rect x="300" y="114" width="44" height="30" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="322.0" y="133.2" font-size="12" text-anchor="middle" fill="#8a8f94">B2</text><rect x="300" y="158" width="44" height="30" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="322.0" y="177.2" font-size="12" text-anchor="middle" fill="#8a8f94">C2</text><text x="512" y="52" font-size="12.5" text-anchor="middle" fill="#23282d">round 3</text><rect x="490" y="70" width="44" height="30" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="512.0" y="89.2" font-size="12" text-anchor="middle" fill="#8a8f94">A3</text><rect x="490" y="114" width="44" height="30" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="512.0" y="133.2" font-size="12" text-anchor="middle" fill="#8a8f94">B3</text><rect x="490" y="158" width="44" height="30" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="512.0" y="177.2" font-size="12" text-anchor="middle" fill="#8a8f94">C3</text><line x1="154" y1="125" x2="300" y2="81" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="344" y1="81" x2="490" y2="169" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><text x="546" y="168" font-size="11.5" fill="#b4532a">cell 1: B1-A2-C3</text><line x1="154" y1="129" x2="300" y2="173" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><line x1="344" y1="173" x2="490" y2="85" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><text x="546" y="90" font-size="11.5" fill="#1f3b57">cell 2: B1-C2-A3</text><line x1="154" y1="89" x2="300" y2="89" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><line x1="344" y1="89" x2="490" y2="177" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><text x="546" y="188" font-size="11.5" fill="#2e6b3f">cell 3: A1-A2-C3</text><text x="40" y="232" font-size="12.5" fill="#8a8f94">Between rounds, all wells are pooled and re-split at random.</text><text x="40" y="254" font-size="13.5" fill="#23282d">3 rounds of 96 wells give 96³ = 884,736 paths. Load 50,000 cells and about 5.5% of them share a path with another cell.</text>
</svg>
