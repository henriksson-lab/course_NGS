<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 270" width="820" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="270" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Where a 12 nt UMI goes changes which read pays for it.</text><text x="40" y="71" font-size="12.5" fill="#23282d" font-weight="bold">in Read 1</text><rect x="200" y="54" width="67.2" height="24" rx="4" fill="#f7ede6" stroke="#b4532a" stroke-width="1.2"/><text x="233.6" y="69.675" font-size="10.5" text-anchor="middle" fill="#b4532a">BC 16</text><rect x="267.2" y="54" width="50.400000000000006" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="292.4" y="69.675" font-size="10.5" text-anchor="middle" fill="#a33a28">UMI 12</text><rect x="329.6" y="54" width="386.40000000000003" height="24" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="522.8000000000001" y="69.675" font-size="10.5" text-anchor="middle" fill="#23282d">insert 92</text><text x="40" y="94" font-size="11" fill="#8a8f94">R1 28, index 0, R2 92</text><text x="40" y="133" font-size="12.5" fill="#23282d" font-weight="bold">in index read 2</text><rect x="200" y="116" width="67.2" height="24" rx="4" fill="#f7ede6" stroke="#b4532a" stroke-width="1.2"/><text x="233.6" y="131.675" font-size="10.5" text-anchor="middle" fill="#b4532a">BC 16</text><rect x="273.2" y="116" width="50.400000000000006" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="298.4" y="131.675" font-size="10.5" text-anchor="middle" fill="#a33a28">UMI 12</text><rect x="329.6" y="116" width="386.40000000000003" height="24" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="522.8000000000001" y="131.675" font-size="10.5" text-anchor="middle" fill="#23282d">insert 92</text><text x="40" y="156" font-size="11" fill="#8a8f94">R1 16, index 12, R2 92</text><text x="40" y="195" font-size="12.5" fill="#23282d" font-weight="bold">at start of Read 2</text><rect x="200" y="178" width="67.2" height="24" rx="4" fill="#f7ede6" stroke="#b4532a" stroke-width="1.2"/><text x="233.6" y="193.675" font-size="10.5" text-anchor="middle" fill="#b4532a">BC 16</text><rect x="279.2" y="178" width="50.400000000000006" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="304.4" y="193.675" font-size="10.5" text-anchor="middle" fill="#a33a28">UMI</text><rect x="329.6" y="178" width="336.0" height="24" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="497.6" y="193.675" font-size="10.5" text-anchor="middle" fill="#23282d">insert 80</text><text x="40" y="218" font-size="11" fill="#8a8f94">R1 16, index 0, R2 92</text><text x="40" y="250" font-size="13.5" fill="#23282d">Index reads cost cycles but do not shorten the insert; the same UMI in Read 2 takes 12 of the 92 insert bases.</text>
</svg>
