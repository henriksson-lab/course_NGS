<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 744 282" width="744" height="282" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="282" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">UMI plus duplex tag: a real variant must appear on both strands of the original molecule.</text><text x="40" y="56" font-size="13" fill="#2e6b3f">true variant</text><line x1="40" y1="84" x2="270" y2="84" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="98" x2="270" y2="98" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="150" y="76" font-size="11" text-anchor="middle" fill="#1f3b57">tag α·β</text><text x="150" y="116" font-size="11" text-anchor="middle" fill="#4a6b8a">tag β·α</text><line x1="40" y1="134" x2="270" y2="134" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><circle cx="190" cy="134" r="3.6" fill="#2e6b3f"/><line x1="40" y1="148" x2="270" y2="148" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><circle cx="190" cy="148" r="3.6" fill="#2e6b3f"/><line x1="40" y1="162" x2="270" y2="162" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><circle cx="190" cy="162" r="3.6" fill="#2e6b3f"/><line x1="40" y1="182" x2="270" y2="182" stroke="#4a6b8a" stroke-width="1.6" stroke-linecap="round"/><circle cx="190" cy="182" r="3.6" fill="#2e6b3f"/><line x1="40" y1="196" x2="270" y2="196" stroke="#4a6b8a" stroke-width="1.6" stroke-linecap="round"/><circle cx="190" cy="196" r="3.6" fill="#2e6b3f"/><line x1="40" y1="210" x2="270" y2="210" stroke="#4a6b8a" stroke-width="1.6" stroke-linecap="round"/><circle cx="190" cy="210" r="3.6" fill="#2e6b3f"/><text x="280" y="150" font-size="11" fill="#1f3b57">top strand family</text><text x="280" y="198" font-size="11" fill="#4a6b8a">bottom strand family</text><text x="40" y="238" font-size="12.5" fill="#2e6b3f">both families agree: keep</text><text x="380" y="56" font-size="13" fill="#a33a28">damage on one strand</text><line x1="380" y1="84" x2="610" y2="84" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="380" y1="98" x2="610" y2="98" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="490" y="76" font-size="11" text-anchor="middle" fill="#1f3b57">tag α·β</text><text x="490" y="116" font-size="11" text-anchor="middle" fill="#4a6b8a">tag β·α</text><line x1="380" y1="134" x2="610" y2="134" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><circle cx="530" cy="134" r="3.6" fill="#a33a28"/><line x1="380" y1="148" x2="610" y2="148" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><circle cx="530" cy="148" r="3.6" fill="#a33a28"/><line x1="380" y1="162" x2="610" y2="162" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><circle cx="530" cy="162" r="3.6" fill="#a33a28"/><line x1="380" y1="182" x2="610" y2="182" stroke="#4a6b8a" stroke-width="1.6" stroke-linecap="round"/><line x1="380" y1="196" x2="610" y2="196" stroke="#4a6b8a" stroke-width="1.6" stroke-linecap="round"/><line x1="380" y1="210" x2="610" y2="210" stroke="#4a6b8a" stroke-width="1.6" stroke-linecap="round"/><text x="620" y="150" font-size="11" fill="#1f3b57">top strand family</text><text x="620" y="198" font-size="11" fill="#4a6b8a">bottom strand family</text><text x="380" y="238" font-size="12.5" fill="#a33a28">one family only: reject</text><text x="40" y="262" font-size="13.5" fill="#23282d">Single-strand damage (deamination, oxidation) and early PCR errors appear on one strand only.</text>
</svg>
