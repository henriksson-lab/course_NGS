<rect width="640" height="252" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Three molecules, amplified unequally: reads count the amplification, UMIs count the molecules.</text><text x="40" y="56" font-size="12.5" fill="#8a8f94">before PCR: 3 molecules, each tagged once</text><rect x="60" y="70" width="52" height="16" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="86.0" y="81.675" font-size="10.5" text-anchor="middle" fill="#1f3b57">AAGTC</text><line x1="112" y1="78" x2="200" y2="78" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="60" y="92" width="52" height="16" rx="4" fill="#e8eef5" stroke="#b4532a" stroke-width="1.2"/><text x="86.0" y="103.675" font-size="10.5" text-anchor="middle" fill="#b4532a">CGTAC</text><line x1="112" y1="100" x2="200" y2="100" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><rect x="60" y="114" width="52" height="16" rx="4" fill="#e8eef5" stroke="#2e6b3f" stroke-width="1.2"/><text x="86.0" y="125.675" font-size="10.5" text-anchor="middle" fill="#2e6b3f">GCATA</text><line x1="112" y1="122" x2="200" y2="122" stroke="#2e6b3f" stroke-width="3" stroke-linecap="round"/><line x1="240" y1="100" x2="285" y2="100" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 290 100 L 285 96.5 L 285 103.5 Z" fill="#8a8f94"/><text x="265" y="90" font-size="11.5" text-anchor="middle" fill="#8a8f94">PCR</text><text x="310" y="56" font-size="12.5" fill="#8a8f94">after PCR and sequencing: 9 reads</text><rect x="320" y="70" width="44" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="342.0" y="80.325" font-size="9.5" text-anchor="middle" fill="#1f3b57">AAGTC</text><rect x="368" y="70" width="44" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="390.0" y="80.325" font-size="9.5" text-anchor="middle" fill="#1f3b57">AAGTC</text><rect x="416" y="70" width="44" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="438.0" y="80.325" font-size="9.5" text-anchor="middle" fill="#1f3b57">AAGTC</text><rect x="464" y="70" width="44" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="486.0" y="80.325" font-size="9.5" text-anchor="middle" fill="#1f3b57">AAGTC</text><rect x="512" y="70" width="44" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="534.0" y="80.325" font-size="9.5" text-anchor="middle" fill="#1f3b57">AAGTC</text><rect x="560" y="70" width="44" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="582.0" y="80.325" font-size="9.5" text-anchor="middle" fill="#1f3b57">AAGTC</text><rect x="320" y="92" width="44" height="14" rx="4" fill="#e8eef5" stroke="#b4532a" stroke-width="1.2"/><text x="342.0" y="102.325" font-size="9.5" text-anchor="middle" fill="#b4532a">CGTAC</text><rect x="368" y="92" width="44" height="14" rx="4" fill="#e8eef5" stroke="#b4532a" stroke-width="1.2"/><text x="390.0" y="102.325" font-size="9.5" text-anchor="middle" fill="#b4532a">CGTAC</text><rect x="320" y="114" width="44" height="14" rx="4" fill="#e8eef5" stroke="#2e6b3f" stroke-width="1.2"/><text x="342.0" y="124.325" font-size="9.5" text-anchor="middle" fill="#2e6b3f">GCATA</text><text x="40" y="176" font-size="14" fill="#a33a28">Reads at this position: 9</text><text x="40" y="200" font-size="14" fill="#2e6b3f">Distinct UMIs at this position: 3</text><text x="40" y="232" font-size="13.5" fill="#23282d">Without UMIs a 6-fold read count cannot be told from 6 independent molecules.</text>
