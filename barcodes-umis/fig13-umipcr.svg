<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 252" width="992" height="252" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="252" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A random tag in a PCR primer is not a molecular label: the template is tagged again every cycle.</text><text x="40" y="58" font-size="12.5" fill="#8a8f94">one template molecule, primers carrying random UMIs</text><line x1="60" y1="92" x2="200" y2="92" stroke="#8a8f94" stroke-width="3.4" stroke-linecap="round"/><text x="54" y="96" font-size="11.5" text-anchor="end" fill="#8a8f94">template</text><text x="40" y="132" font-size="11.5" fill="#8a8f94">cycle 1</text><line x1="110" y1="126" x2="200" y2="126" stroke="#8a8f94" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="210" y="117" width="56" height="18" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="238.0" y="129.85" font-size="11" text-anchor="middle" fill="#1f3b57">CCGAT</text><line x1="266" y1="126" x2="340" y2="126" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="40" y="162" font-size="11.5" fill="#8a8f94">cycle 2</text><line x1="110" y1="156" x2="200" y2="156" stroke="#8a8f94" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="210" y="147" width="56" height="18" rx="4" fill="#e8eef5" stroke="#b4532a" stroke-width="1.2"/><text x="238.0" y="159.85" font-size="11" text-anchor="middle" fill="#b4532a">TAGCA</text><line x1="266" y1="156" x2="340" y2="156" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><text x="40" y="192" font-size="11.5" fill="#8a8f94">cycle 3</text><line x1="110" y1="186" x2="200" y2="186" stroke="#8a8f94" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="210" y="177" width="56" height="18" rx="4" fill="#e8eef5" stroke="#2e6b3f" stroke-width="1.2"/><text x="238.0" y="189.85" font-size="11" text-anchor="middle" fill="#2e6b3f">GGTAC</text><line x1="266" y1="186" x2="340" y2="186" stroke="#2e6b3f" stroke-width="3" stroke-linecap="round"/><text x="380" y="130" font-size="13" fill="#23282d">one molecule</text><text x="380" y="150" font-size="13" fill="#a33a28">now has three UMIs</text><text x="380" y="190" font-size="13" fill="#a33a28">counted as three molecules</text><text x="40" y="232" font-size="13.5" fill="#23282d">Reverse transcription, ligation and template switching each run once per molecule, so the tag is applied once. PCR is a cycle that repeats.</text>
</svg>
