<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 264" width="860" height="264" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="264" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Oligos to buy for 10,000 distinct barcodes (log scale).</text><text x="40" y="69" font-size="12.5" fill="#23282d">one set, one position</text><rect x="230" y="54" width="400" height="22" fill="#8a8f94" opacity="0.85"/><text x="640.0043427276862" y="70" font-size="12.5" fill="#23282d">10,000 oligos  (10000^1 = 10,000)</text><text x="40" y="113" font-size="12.5" fill="#23282d">2 positions of 100</text><rect x="230" y="98" width="230" height="22" fill="#b4532a" opacity="0.85"/><text x="470.3196057420489" y="114" font-size="12.5" fill="#23282d">200 oligos  (100^2 = 10,000)</text><text x="40" y="157" font-size="12.5" fill="#23282d">3 positions of 22</text><rect x="230" y="142" width="183" height="22" fill="#b4532a" opacity="0.85"/><text x="422.60748027008265" y="158" font-size="12.5" fill="#23282d">66 oligos  (22^3 = 10,648)</text><text x="40" y="201" font-size="12.5" fill="#23282d">4 positions of 10</text><rect x="230" y="186" width="161" height="22" fill="#b4532a" opacity="0.85"/><text x="401.2783856719735" y="202" font-size="12.5" fill="#23282d">40 oligos  (10^4 = 10,000)</text><text x="40" y="244" font-size="13.5" fill="#23282d">Each added position multiplies the barcodes while adding oligos linearly. Split-pool and plate designs both use this.</text>
</svg>
