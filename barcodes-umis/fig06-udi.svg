<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 284" width="756" height="284" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="284" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A hopped read is only recognisable if the pair it carries belongs to no sample.</text><text x="40" y="54" font-size="12.5" fill="#23282d">combinatorial: every i7 with every i5</text><text x="52" y="98" font-size="10.5" text-anchor="end" fill="#8a8f94">i7-1</text><rect x="60" y="80" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="100" y="80" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="140" y="80" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="180" y="80" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="52" y="126" font-size="10.5" text-anchor="end" fill="#8a8f94">i7-2</text><rect x="60" y="108" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="100" y="108" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="140" y="108" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="180" y="108" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="52" y="154" font-size="10.5" text-anchor="end" fill="#8a8f94">i7-3</text><rect x="60" y="136" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="100" y="136" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="140" y="136" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="180" y="136" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="52" y="182" font-size="10.5" text-anchor="end" fill="#8a8f94">i7-4</text><rect x="60" y="164" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="100" y="164" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="140" y="164" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="180" y="164" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="77" y="74" font-size="10.5" text-anchor="middle" fill="#8a8f94">i5-1</text><text x="117" y="74" font-size="10.5" text-anchor="middle" fill="#8a8f94">i5-2</text><text x="157" y="74" font-size="10.5" text-anchor="middle" fill="#8a8f94">i5-3</text><text x="197" y="74" font-size="10.5" text-anchor="middle" fill="#8a8f94">i5-4</text><circle cx="117" cy="91" r="14" fill="none" stroke="#a33a28" stroke-width="2.2"/><text x="60" y="214" font-size="12" fill="#8a8f94">hopped read: i7-1 with i5-2</text><text x="60" y="234" font-size="12.5" fill="#a33a28">lands in a real sample: undetectable</text><text x="370" y="54" font-size="12.5" fill="#23282d">unique dual: each pair used once</text><text x="382" y="98" font-size="10.5" text-anchor="end" fill="#8a8f94">i7-1</text><rect x="390" y="80" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="430" y="80" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="470" y="80" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="510" y="80" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><text x="382" y="126" font-size="10.5" text-anchor="end" fill="#8a8f94">i7-2</text><rect x="390" y="108" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="430" y="108" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="470" y="108" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="510" y="108" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><text x="382" y="154" font-size="10.5" text-anchor="end" fill="#8a8f94">i7-3</text><rect x="390" y="136" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="430" y="136" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="470" y="136" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><rect x="510" y="136" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><text x="382" y="182" font-size="10.5" text-anchor="end" fill="#8a8f94">i7-4</text><rect x="390" y="164" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="430" y="164" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="470" y="164" width="34" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="510" y="164" width="34" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="407" y="74" font-size="10.5" text-anchor="middle" fill="#8a8f94">i5-1</text><text x="447" y="74" font-size="10.5" text-anchor="middle" fill="#8a8f94">i5-2</text><text x="487" y="74" font-size="10.5" text-anchor="middle" fill="#8a8f94">i5-3</text><text x="527" y="74" font-size="10.5" text-anchor="middle" fill="#8a8f94">i5-4</text><circle cx="447" cy="91" r="14" fill="none" stroke="#2e6b3f" stroke-width="2.2"/><text x="390" y="214" font-size="12" fill="#8a8f94">hopped read: i7-1 with i5-2</text><text x="390" y="234" font-size="12.5" fill="#2e6b3f">lands in an empty cell: discard it</text><text x="40" y="264" font-size="13.5" fill="#23282d">Cost: unique dual sets need 2 × n index oligos for n samples; combinatorial sets need about 2 × sqrt(n).</text>
</svg>
