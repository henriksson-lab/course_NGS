<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 655 256" width="655" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="640" height="256" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Hamming distance counts substitutions; a lost base shifts everything after it.</text><text x="40" y="66" font-size="12.5" fill="#8a8f94">true barcode</text><text x="200.0" y="66" font-size="15" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="213.5" y="66" font-size="15" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="227.0" y="66" font-size="15" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="240.5" y="66" font-size="15" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="254.0" y="66" font-size="15" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="267.5" y="66" font-size="15" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="40" y="100" font-size="12.5" fill="#8a8f94">read, one T deleted</text><text x="200.0" y="100" font-size="15" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="213.5" y="100" font-size="15" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="227.0" y="100" font-size="15" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="240.5" y="100" font-size="15" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="254.0" y="100" font-size="15" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="267.5" y="100" font-size="15" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="40" y="150" font-size="14" fill="#a33a28">Hamming distance: 5 of 6 positions differ</text><text x="40" y="174" font-size="14" fill="#2e6b3f">Levenshtein (edit) distance: 2, one deletion plus the base that slid in</text><text x="40" y="214" font-size="13.5" fill="#23282d">Substitutions dominate on Illumina, so Hamming is the right design metric there.</text><text x="40" y="236" font-size="13.5" fill="#23282d">Platforms with indel errors (nanopore, long reads) need edit-distance-aware barcode sets.</text>
</svg>
