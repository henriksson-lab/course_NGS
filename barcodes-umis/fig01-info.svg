<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 272" width="880" height="272" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="272" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A read carries four kinds of information. Each has its own address in the molecule.</text><rect x="40" y="70" width="40" height="34" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="60.0" y="91.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="80" y="70" width="50" height="34" rx="4" fill="#eaf2ec" stroke="#2e6b3f" stroke-width="1.2"/><text x="105.0" y="91.2" font-size="12" text-anchor="middle" fill="#2e6b3f">i5</text><rect x="130" y="70" width="78" height="34" rx="4" fill="#f7ede6" stroke="#b4532a" stroke-width="1.2"/><text x="169.0" y="91.2" font-size="12" text-anchor="middle" fill="#b4532a">cell BC</text><rect x="208" y="70" width="60" height="34" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="238.0" y="91.2" font-size="12" text-anchor="middle" fill="#a33a28">UMI</text><rect x="268" y="70" width="230" height="34" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="383.0" y="91.2" font-size="12" text-anchor="middle" fill="#23282d">insert</text><rect x="498" y="70" width="50" height="34" rx="4" fill="#eaf2ec" stroke="#2e6b3f" stroke-width="1.2"/><text x="523.0" y="91.2" font-size="12" text-anchor="middle" fill="#2e6b3f">i7</text><rect x="548" y="70" width="40" height="34" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="568.0" y="91.2" font-size="12" text-anchor="middle" fill="#a33a28">P7</text><text x="40" y="140" font-size="13" fill="#2e6b3f">which sample</text><text x="180" y="140" font-size="13" fill="#8a8f94">= sample index</text><line x1="105.0" y1="106" x2="105.0" y2="124" stroke="#2e6b3f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/><line x1="523.0" y1="106" x2="523.0" y2="124" stroke="#2e6b3f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/><text x="40" y="164" font-size="13" fill="#b4532a">which cell</text><text x="180" y="164" font-size="13" fill="#8a8f94">= cell barcode</text><line x1="169.0" y1="106" x2="169.0" y2="124" stroke="#b4532a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/><text x="40" y="188" font-size="13" fill="#a33a28">which molecule</text><text x="180" y="188" font-size="13" fill="#8a8f94">= UMI</text><line x1="238.0" y1="106" x2="238.0" y2="124" stroke="#a33a28" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/><text x="40" y="212" font-size="13" fill="#23282d">which sequence</text><text x="180" y="212" font-size="13" fill="#8a8f94">= the insert itself</text><line x1="383.0" y1="106" x2="383.0" y2="124" stroke="#23282d" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/><text x="40" y="252" font-size="14" fill="#23282d">Protocols differ in which of these they need, and in which read each one is placed; that choice is the read structure.</text>
</svg>
