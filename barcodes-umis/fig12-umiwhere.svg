<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 264" width="844" height="264" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="264" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A UMI can enter at any single-copy step: ligation, reverse transcription or template switching.</text><text x="40" y="76" font-size="13" fill="#23282d" font-weight="bold">ligation</text><rect x="220" y="56" width="120" height="28" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="280.0" y="74.025" font-size="11.5" text-anchor="middle" fill="#a33a28">adapter + UMI</text><rect x="340" y="56" width="220" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="450.0" y="74.025" font-size="11.5" text-anchor="middle" fill="#23282d">DNA fragment</text><text x="576" y="75" font-size="12" fill="#8a8f94">adapter carries the UMI</text><text x="40" y="134" font-size="13" fill="#23282d" font-weight="bold">reverse transcription</text><rect x="220" y="114" width="54" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="247.0" y="132.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">handle</text><rect x="274" y="114" width="46" height="28" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="297.0" y="132.025" font-size="11.5" text-anchor="middle" fill="#a33a28">UMI</text><rect x="320" y="114" width="50" height="28" rx="4" fill="#eaf2ec" stroke="#2e6b3f" stroke-width="1.2"/><text x="345.0" y="132.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">dT...</text><rect x="370" y="114" width="190" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="465.0" y="132.025" font-size="11.5" text-anchor="middle" fill="#23282d">cDNA</text><text x="576" y="133" font-size="12" fill="#8a8f94">primer carries the UMI</text><text x="40" y="192" font-size="13" fill="#23282d" font-weight="bold">template switching</text><rect x="220" y="172" width="190" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="315.0" y="190.025" font-size="11.5" text-anchor="middle" fill="#23282d">cDNA</text><rect x="410" y="172" width="46" height="28" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="433.0" y="190.025" font-size="11.5" text-anchor="middle" fill="#a33a28">UMI</text><rect x="456" y="172" width="54" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="483.0" y="190.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">TSO</text><text x="526" y="191" font-size="12" fill="#8a8f94">TSO carries the UMI</text><text x="40" y="244" font-size="13.5" fill="#23282d">In each case the tag is attached once per molecule, before the first copy is made. Everything downstream inherits it.</text>
</svg>
