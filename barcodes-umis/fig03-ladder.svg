<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 754 286" width="754" height="286" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="286" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Minimum distance between barcodes decides what an error does.</text><text x="40" y="70" font-size="13" fill="#a33a28">distance 1</text><circle cx="150" cy="66" r="8" fill="#1f3b57"/><text x="150" y="52" font-size="12" text-anchor="middle" fill="#1f3b57">A</text><line x1="158" y1="66" x2="212" y2="66" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><circle cx="220" cy="66" r="8" fill="#a33a28"/><text x="220" y="52" font-size="12" text-anchor="middle" fill="#a33a28">B</text><text x="420" y="62" font-size="12" fill="#23282d">one error turns A into B,</text><text x="420" y="77" font-size="12" fill="#23282d">silently: wrong sample</text><text x="40" y="134" font-size="13" fill="#b4532a">distance 2</text><circle cx="150" cy="130" r="8" fill="#1f3b57"/><text x="150" y="116" font-size="12" text-anchor="middle" fill="#1f3b57">A</text><line x1="158" y1="130" x2="212" y2="130" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><circle cx="220" cy="130" r="6" fill="none" stroke="#8a8f94" stroke-width="1.4"/><line x1="228" y1="130" x2="282" y2="130" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><circle cx="290" cy="130" r="8" fill="#a33a28"/><text x="290" y="116" font-size="12" text-anchor="middle" fill="#a33a28">B</text><circle cx="220" cy="130" r="11" fill="none" stroke="#b4532a" stroke-width="1.8"/><text x="220" y="158" font-size="10.5" text-anchor="middle" fill="#b4532a">read with 1 error</text><text x="420" y="126" font-size="12" fill="#23282d">one error is noticed but sits</text><text x="420" y="141" font-size="12" fill="#23282d">halfway: detect, cannot correct</text><text x="40" y="198" font-size="13" fill="#2e6b3f">distance 3</text><circle cx="150" cy="194" r="8" fill="#1f3b57"/><text x="150" y="180" font-size="12" text-anchor="middle" fill="#1f3b57">A</text><line x1="158" y1="194" x2="212" y2="194" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><circle cx="220" cy="194" r="6" fill="none" stroke="#8a8f94" stroke-width="1.4"/><line x1="228" y1="194" x2="282" y2="194" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><circle cx="290" cy="194" r="6" fill="none" stroke="#8a8f94" stroke-width="1.4"/><line x1="298" y1="194" x2="352" y2="194" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><circle cx="360" cy="194" r="8" fill="#a33a28"/><text x="360" y="180" font-size="12" text-anchor="middle" fill="#a33a28">B</text><circle cx="220" cy="194" r="11" fill="none" stroke="#2e6b3f" stroke-width="1.8"/><text x="220" y="222" font-size="10.5" text-anchor="middle" fill="#2e6b3f">read with 1 error</text><text x="420" y="190" font-size="12" fill="#23282d">one error is still closer to A:</text><text x="420" y="205" font-size="12" fill="#23282d">correct it</text><text x="40" y="266" font-size="14" fill="#23282d">Each hop is one base difference. With errors rare, distance 3 corrects one; distance 5 corrects two.</text>
</svg>
