<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 280" width="830" height="280" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="830" height="280" fill="none"/>
<text x="20" y="24" font-size="13" fill="#8a8f94">starting material</text><text x="300" y="24" font-size="13" fill="#8a8f94">what you do</text><text x="600" y="24" font-size="13" fill="#8a8f94">family</text><rect x="16" y="40" width="800" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="26" y="60" font-size="14" fill="#23282d">intact dsDNA, ng to µg</text><text x="300" y="60" font-size="14" fill="#23282d">end repair + A-tail + adapter ligation</text><text x="600" y="60" font-size="14" fill="#b4532a" font-weight="bold">ligation</text><rect x="16" y="76" width="800" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="26" y="96" font-size="14" fill="#23282d">dsDNA, tens of ng or less, speed</text><text x="300" y="96" font-size="14" fill="#23282d">tagmentation</text><text x="600" y="96" font-size="14" fill="#b4532a" font-weight="bold">transposition</text><rect x="16" y="112" width="800" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="26" y="132" font-size="14" fill="#23282d">a known region</text><text x="300" y="132" font-size="14" fill="#23282d">tailed primers, then index PCR</text><text x="600" y="132" font-size="14" fill="#b4532a" font-weight="bold">primer tails</text><rect x="16" y="148" width="800" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="26" y="168" font-size="14" fill="#23282d">full-length mRNA, low input</text><text x="300" y="168" font-size="14" fill="#23282d">RT with template switching</text><text x="600" y="168" font-size="14" fill="#b4532a" font-weight="bold">template switching</text><rect x="16" y="184" width="800" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="26" y="204" font-size="14" fill="#23282d">small RNA</text><text x="300" y="204" font-size="14" fill="#23282d">3' App adapter + 5' RNA adapter</text><text x="600" y="204" font-size="14" fill="#b4532a" font-weight="bold">RNA ligation</text><rect x="16" y="220" width="800" height="30" rx="3" fill="none" stroke="#d5d8da" stroke-width="1.2"/><text x="26" y="240" font-size="14" fill="#23282d">degraded or single-stranded DNA</text><text x="300" y="240" font-size="14" fill="#23282d">single-strand ligation or tailing</text><text x="600" y="240" font-size="14" fill="#b4532a" font-weight="bold">tailing / ssDNA ligation</text>
</svg>
