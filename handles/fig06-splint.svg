<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 232" width="720" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="232" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Splinted ligation: ligase seals a nick, so give it a nick to seal</text><rect x="40" y="50" width="170" height="18" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="125.0" y="63.2" font-size="12" text-anchor="middle" fill="#23282d">target, 3'-OH</text><rect x="214" y="50" width="150" height="18" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="289.0" y="63.2" font-size="12" text-anchor="middle" fill="#23282d">adapter, 5'-P</text><rect x="150" y="76" width="130" height="14" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><rect x="150" y="76" width="130" height="14" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="215.0" y="86.85" font-size="11" text-anchor="middle" fill="#23282d">splint (3' blocked)</text><line x1="212" y1="44" x2="212" y2="74" stroke="#2e6b3f" stroke-width="2.4" stroke-linecap="round"/><text x="212" y="40" font-size="12" text-anchor="middle" fill="#2e6b3f">nick</text><text x="150" y="106" font-size="12" fill="#8a8f94">half of the splint pairs with each partner</text><text x="30" y="150" font-size="14" fill="#23282d" font-weight="bold">Why use it:</text><text x="30" y="172" font-size="13" fill="#23282d">- only molecules that pair with the splint are joined: the splint carries the selectivity</text><text x="30" y="192" font-size="13" fill="#23282d">- split-and-pool barcoding adds one barcode per round, each round bridged by its own splint</text><text x="30" y="212" font-size="13" fill="#23282d">- a degenerate splint end (N) lets one adapter capture any single-stranded 3' end</text>
</svg>
