<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 278" width="772" height="278" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="278" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">Tagged random priming: the handle rides on a random primer</text><text x="30" y="64" font-size="12" fill="#8a8f94">5'</text><line x1="46" y1="60" x2="560" y2="60" stroke="#6b7075" stroke-width="3" stroke-linecap="round"/><text x="566" y="64" font-size="12" fill="#8a8f94">3'</text><line x1="110" y1="90" x2="150" y2="90" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="150" y1="90" x2="194" y2="90" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><line x1="330" y1="90" x2="370" y2="90" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="370" y1="90" x2="414" y2="90" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><text x="110" y="112" font-size="11" fill="#1f3b57">N9</text><text x="150" y="112" font-size="11" fill="#b4532a">tail</text><text x="330" y="112" font-size="11" fill="#1f3b57">N9</text><text x="370" y="112" font-size="11" fill="#b4532a">tail</text><text x="30" y="150" font-size="12" fill="#8a8f94">the primer anneals wherever its random end finds a match; extension copies the template</text><text x="30" y="190" font-size="12" fill="#8a8f94">Second round: a primer with tail B primes on those copies, so every product has A at one end and B at the other.</text><rect x="100" y="204" width="70" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="135.0" y="219.2" font-size="12" text-anchor="middle" fill="#23282d">tail A</text><rect x="170" y="204" width="24" height="22" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="182.0" y="219.2" font-size="12" text-anchor="middle" fill="#23282d">N9</text><rect x="194" y="204" width="170" height="22" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="279.0" y="219.2" font-size="12" text-anchor="middle" fill="#23282d">copied DNA</text><rect x="364" y="204" width="24" height="22" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="376.0" y="219.2" font-size="12" text-anchor="middle" fill="#23282d">N9</text><rect x="388" y="204" width="70" height="22" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="423.0" y="219.2" font-size="12" text-anchor="middle" fill="#23282d">tail B</text><text x="30" y="258" font-size="13" fill="#23282d">Used after bisulfite (PBAT, scBS-seq, snmC-seq2): bisulfite already fragmented the DNA, so adapters go on after.</text>
</svg>
