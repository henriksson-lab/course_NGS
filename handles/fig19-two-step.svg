<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 230" width="720" height="230" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="230" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">Two-step PCR: do the specific work first, then add the long tails</text><rect x="30" y="48" width="190" height="90" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="125" y="68" font-size="13" text-anchor="middle" fill="#23282d" font-weight="bold">step 1: few cycles</text><rect x="46" y="82" width="30" height="16" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="61.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">U1</text><rect x="76" y="82" width="28" height="16" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="90.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">gene</text><rect x="104" y="82" width="58" height="16" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="133.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">target</text><rect x="162" y="82" width="28" height="16" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="176.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">gene</text><rect x="190" y="82" width="30" height="16" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="205.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">U2</text><text x="125" y="124" font-size="11" text-anchor="middle" fill="#8a8f94">short primers with universal tails</text><text x="244" y="96" font-size="12" fill="#8a8f94">clean up</text><line x1="240" y1="104" x2="290" y2="104" stroke="#8a8f94" stroke-width="1.5" stroke-linecap="round"/><rect x="300" y="48" width="340" height="90" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="470" y="68" font-size="13" text-anchor="middle" fill="#23282d" font-weight="bold">step 2: indexing primers</text><rect x="350" y="82" width="30" height="16" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="365.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">P5</text><rect x="380" y="82" width="30" height="16" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="395.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">i5</text><rect x="410" y="82" width="30" height="16" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="425.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">U1</text><rect x="440" y="82" width="30" height="16" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="455.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">gene</text><rect x="470" y="82" width="30" height="16" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="485.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">ins</text><rect x="500" y="82" width="30" height="16" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="515.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">gene</text><rect x="530" y="82" width="30" height="16" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="545.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">U2</text><rect x="560" y="82" width="30" height="16" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="575.0" y="94.2" font-size="12" text-anchor="middle" fill="#23282d">i7</text><text x="470" y="124" font-size="11" text-anchor="middle" fill="#8a8f94">universal primers only: nothing target-specific can mispair</text><text x="30" y="172" font-size="13" fill="#23282d">- long chimeric primers (tail + gene) are the main source of primer dimers; step 1 keeps them out</text><text x="30" y="192" font-size="13" fill="#23282d">- clean-up between steps removes step-1 primers, so step 2 cannot re-prime on them</text><text x="30" y="212" font-size="13" fill="#23282d">- indexes are added once, in the second step: fewer expensive primers and less index swapping</text>
</svg>
