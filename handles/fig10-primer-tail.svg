<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" width="720" height="370" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="370" fill="none"/>
<text x="30" y="24" font-size="13" fill="#23282d" font-weight="bold">cycle 1: only the 3' part of the primer pairs; the tail hangs free</text><line x1="60" y1="70" x2="520" y2="70" stroke="#6b7075" stroke-width="3" stroke-linecap="round"/><line x1="160" y1="96" x2="230" y2="96" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="110" y1="96" x2="160" y2="96" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><line x1="230" y1="96" x2="395" y2="96" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 400 96 L 395 92.5 L 395 99.5 Z" fill="#1f3b57"/><text x="60" y="118" font-size="11" fill="#b4532a">5' tail (handle)</text><text x="170" y="118" font-size="11" fill="#1f3b57">annealing part</text><text x="30" y="144" font-size="13" fill="#23282d" font-weight="bold">cycle 2: the copy carries the tail, so the complete primer now pairs along its full length</text><line x1="110" y1="190" x2="520" y2="190" stroke="#b4532a" stroke-width="0.1" stroke-linecap="round"/><line x1="110" y1="190" x2="160" y2="190" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="160" y1="190" x2="400" y2="190" stroke="#6b7075" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="214" x2="160" y2="214" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><line x1="160" y1="214" x2="230" y2="214" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="230" y1="214" x2="395" y2="214" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 400 214 L 395 210.5 L 395 217.5 Z" fill="#1f3b57"/><text x="30" y="264" font-size="13" fill="#23282d" font-weight="bold">product: new sequence at the end of every molecule, in whatever order the primers dictate</text><rect x="100" y="300" width="60" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="130.0" y="315.2" font-size="12" text-anchor="middle" fill="#23282d">handle A</text><rect x="160" y="300" width="28" height="22" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="174.0" y="315.2" font-size="12" text-anchor="middle" fill="#23282d">gene</text><rect x="188" y="300" width="150" height="22" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="263.0" y="315.2" font-size="12" text-anchor="middle" fill="#23282d">target</text><rect x="338" y="300" width="28" height="22" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="352.0" y="315.2" font-size="12" text-anchor="middle" fill="#23282d">gene</text><rect x="366" y="300" width="60" height="22" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="396.0" y="315.2" font-size="12" text-anchor="middle" fill="#23282d">handle B</text><text x="30" y="352" font-size="13" fill="#b4532a">The tail does not need to match anything. Tm only matters for the annealing part.</text>
</svg>
