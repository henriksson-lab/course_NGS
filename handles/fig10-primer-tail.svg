<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="300" fill="none"/>
<text x="30" y="24" font-size="13" fill="#23282d" font-weight="bold">cycle 1: only the 3' part of the primer pairs; the tail hangs free</text><line x1="60" y1="52" x2="520" y2="52" stroke="#6b7075" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="76" x2="160" y2="76" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><line x1="160" y1="76" x2="230" y2="76" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="230" y1="76" x2="395" y2="76" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 400 76 L 395 72.5 L 395 79.5 Z" fill="#1f3b57"/><text x="110" y="98" font-size="11" fill="#b4532a">5' tail (handle)</text><text x="210" y="98" font-size="11" fill="#1f3b57">annealing part</text><text x="30" y="132" font-size="13" fill="#23282d" font-weight="bold">cycle 2: the copy carries the tail, so the complete primer now pairs along its full length</text><line x1="110" y1="160" x2="160" y2="160" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="160" y1="160" x2="400" y2="160" stroke="#6b7075" stroke-width="3" stroke-linecap="round"/><line x1="110" y1="184" x2="160" y2="184" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><line x1="160" y1="184" x2="230" y2="184" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="230" y1="184" x2="395" y2="184" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><path d="M 400 184 L 395 180.5 L 395 187.5 Z" fill="#1f3b57"/><text x="30" y="218" font-size="13" fill="#23282d" font-weight="bold">product: new sequence at the end of every molecule, in whatever order the primers dictate</text><rect x="100" y="230" width="60" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="130.0" y="245.2" font-size="12" text-anchor="middle" fill="#23282d">handle A</text><rect x="160" y="230" width="28" height="22" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="174.0" y="245.2" font-size="12" text-anchor="middle" fill="#23282d">gene</text><rect x="188" y="230" width="150" height="22" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="263.0" y="245.2" font-size="12" text-anchor="middle" fill="#23282d">target</text><rect x="338" y="230" width="28" height="22" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="352.0" y="245.2" font-size="12" text-anchor="middle" fill="#23282d">gene</text><rect x="366" y="230" width="60" height="22" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="396.0" y="245.2" font-size="12" text-anchor="middle" fill="#23282d">handle B</text><text x="30" y="282" font-size="13" fill="#b4532a">The tail does not need to match anything. Tm only matters for the annealing part.</text>
</svg>
