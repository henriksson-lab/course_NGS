<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 262" width="720" height="262" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="262" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">Homopolymer tailing: make a known sequence, then use it</text><text x="30" y="62" font-size="13" fill="#1f3b57" font-weight="bold">DNA</text><line x1="80" y1="58" x2="260" y2="58" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><text x="262" y="62" font-size="12" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAAAAAA</text><text x="380" y="62" font-size="12" fill="#8a8f94">TdT + dATP adds a tail to every 3'-OH</text><text x="30" y="100" font-size="13" fill="#8a5a2b" font-weight="bold">RNA</text><line x1="80" y1="96" x2="260" y2="96" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><text x="262" y="100" font-size="12" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAAAAAA</text><text x="380" y="100" font-size="12" fill="#8a8f94">poly(A) polymerase + ATP does the same on RNA</text><text x="30" y="150" font-size="13" fill="#23282d" font-weight="bold">then</text><text x="262" y="154" font-size="12" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>TTTTTTTT</text><rect x="150" y="140" width="110" height="20" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="205.0" y="154.2" font-size="12" text-anchor="middle" fill="#23282d">handle</text><text x="380" y="154" font-size="12" fill="#8a8f94">oligo-dT primer with the handle on its 5' end</text><text x="30" y="204" font-size="13" fill="#23282d">- length of the tail is random, a few dozen to hundreds of nt: sets a limit to read-through</text><text x="30" y="224" font-size="13" fill="#23282d">- the handle sits on the primer, so the tail only has to be pairable</text><text x="30" y="244" font-size="13" fill="#23282d">- the tail must not be at the end where you need the insert read: plan the read direction</text>
</svg>
