<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="240" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">Topoisomerase TA cloning</text><line x1="40" y1="62" x2="200" y2="62" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="76" x2="200" y2="76" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><circle cx="212" cy="62" r="11" fill="#b4532a"/><text x="230" y="66" font-size="11" fill="#b4532a">Topo I on 3'-P of vector</text><text x="40" y="102" font-size="12" fill="#8a8f94">vector: 3' T overhang, enzyme bound to the 3' phosphate</text><line x1="40" y1="140" x2="200" y2="140" stroke="#6b7075" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="154" x2="200" y2="154" stroke="#6b7075" stroke-width="3" stroke-linecap="round"/><text x="206" y="144" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">A</text><text x="40" y="180" font-size="12" fill="#8a8f94">insert (PCR product): 3' A overhang and 5'-OH</text><text x="30" y="218" font-size="12" fill="#2e6b3f">5'-OH attacks the enzyme-DNA bond: strand ligated, enzyme released, no ligase or ATP</text><text x="460" y="26" font-size="14" fill="#23282d" font-weight="bold">Site-specific recombination (Gateway-type)</text><rect x="460" y="54" width="30" height="20" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="475.0" y="67.85" font-size="11" text-anchor="middle" fill="#23282d">attB</text><rect x="492" y="54" width="110" height="20" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="547.0" y="68.2" font-size="12" text-anchor="middle" fill="#23282d">insert</text><rect x="604" y="54" width="30" height="20" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="619.0" y="67.85" font-size="11" text-anchor="middle" fill="#23282d">attB</text><text x="460" y="100" font-size="12" fill="#8a8f94">att sites come on the PCR primers (a primer tail)</text><rect x="460" y="130" width="30" height="20" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="475.0" y="143.85" font-size="11" text-anchor="middle" fill="#23282d">attP</text><rect x="492" y="130" width="110" height="20" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="547.0" y="144.2" font-size="12" text-anchor="middle" fill="#23282d">vector</text><rect x="604" y="130" width="30" height="20" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="619.0" y="143.85" font-size="11" text-anchor="middle" fill="#23282d">attP</text><text x="460" y="176" font-size="12" fill="#8a8f94">integrase + IHF swap the segments between matching sites</text><text x="460" y="218" font-size="12" fill="#23282d">mostly a cloning tool; NGS uses it to build libraries</text>
</svg>
