<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 838 324" width="838" height="324" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="324" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">Template switching: the RT adds the handle by itself</text><text x="30" y="56" font-size="14" fill="#b4532a" font-weight="bold">1</text><text x="30" y="116" font-size="14" fill="#b4532a" font-weight="bold">2</text><text x="30" y="188" font-size="14" fill="#b4532a" font-weight="bold">3</text><text x="30" y="260" font-size="14" fill="#b4532a" font-weight="bold">4</text><text x="170" y="40" font-size="11" fill="#8a8f94">RNA 5'</text><text x="530" y="40" font-size="11" fill="#8a8f94">3' AAAA</text><line x1="170" y1="52" x2="540" y2="52" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><line x1="536" y1="66" x2="175" y2="66" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><path d="M 170 66 L 175 62.5 L 175 69.5 Z" fill="#1f3b57"/><text x="560" y="70" font-size="12" fill="#8a8f94">oligo-dT primes; RT copies to the RNA 5' end</text><line x1="170" y1="112" x2="540" y2="112" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><line x1="142" y1="126" x2="536" y2="126" stroke="#6b7075" stroke-width="3" stroke-linecap="round"/><text x="134" y="130" font-size="12" text-anchor="end" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace' font-weight="bold">CCC</text><text x="560" y="130" font-size="12" fill="#8a8f94">RT adds a few non-templated C</text><line x1="170" y1="184" x2="540" y2="184" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><line x1="142" y1="198" x2="536" y2="198" stroke="#6b7075" stroke-width="3" stroke-linecap="round"/><rect x="40" y="176" width="100" height="18" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="90.0" y="188.85" font-size="11" text-anchor="middle" fill="#23282d">handle</text><rect x="140" y="176" width="30" height="18" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="155.0" y="188.85" font-size="11" text-anchor="middle" fill="#23282d">GGG</text><text x="560" y="198" font-size="12" fill="#8a8f94">TSO pairs through its GGG</text><line x1="170" y1="256" x2="540" y2="256" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><line x1="40" y1="270" x2="536" y2="270" stroke="#6b7075" stroke-width="3" stroke-linecap="round"/><rect x="40" y="266" width="100" height="8" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="560" y="274" font-size="12" fill="#2e6b3f">RT switches template, copies the handle</text><text x="30" y="306" font-size="13" fill="#23282d">No ligase, no extra step: the handle is added in the same tube as RT.</text>
</svg>
