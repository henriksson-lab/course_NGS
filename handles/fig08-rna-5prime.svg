<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 242" width="720" height="242" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="242" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">5' adapter ligation (after the 3' adapter is on)</text><line x1="40" y1="60" x2="140" y2="60" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><text x="40" y="52" font-size="12" fill="#b4532a">5' adapter (RNA), 3'-OH</text><text x="150" y="64" font-size="16" fill="#8a8f94">+</text><text x="170" y="52" font-size="12" fill="#2e6b3f">5'-P</text><line x1="200" y1="60" x2="300" y2="60" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><line x1="300" y1="60" x2="380" y2="60" stroke="#5b4b8a" stroke-width="4" stroke-linecap="round"/><text x="280" y="80" font-size="12" fill="#8a8f94">RNA + 3' adapter</text><text x="30" y="118" font-size="13" fill="#23282d">T4 RNA ligase 1, ATP</text><line x1="30" y1="128" x2="125" y2="128" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 130 128 L 125 124.5 L 125 131.5 Z" fill="#8a8f94"/><line x1="40" y1="162" x2="140" y2="162" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><line x1="140" y1="162" x2="240" y2="162" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><line x1="240" y1="162" x2="320" y2="162" stroke="#5b4b8a" stroke-width="4" stroke-linecap="round"/><text x="340" y="166" font-size="13" fill="#2e6b3f">both handles on, ready for RT</text><text x="30" y="204" font-size="13" fill="#a33a28">Failure mode: free 3' adapter left in the tube also has a 5'-P end,</text><text x="30" y="224" font-size="13" fill="#a33a28">so the 5' adapter joins it: a 5' + 3' adapter dimer that amplifies better than any insert.</text>
</svg>
