<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="268" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">3' adapter ligation to RNA</text><text x="30" y="64" font-size="12" fill="#8a8f94">5'-P</text><line x1="62" y1="60" x2="250" y2="60" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><text x="256" y="64" font-size="12" fill="#8a8f94">OH-3'</text><text x="310" y="64" font-size="12" fill="#b4532a">5'-App</text><line x1="354" y1="60" x2="470" y2="60" stroke="#5b4b8a" stroke-width="4" stroke-linecap="round"/><rect x="470" y="52" width="16" height="16" rx="2" fill="#a33a28" stroke="#a33a28" stroke-width="1.2"/><text x="494" y="64" font-size="12" fill="#a33a28">3' block</text><text x="62" y="92" font-size="13" fill="#8a5a2b">RNA</text><text x="354" y="92" font-size="13" fill="#5b4b8a">pre-adenylated DNA adapter</text><text x="30" y="128" font-size="13" fill="#23282d">truncated T4 RNA ligase 2, no ATP in the tube</text><line x1="30" y1="140" x2="125" y2="140" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 130 140 L 125 136.5 L 125 143.5 Z" fill="#8a8f94"/><text x="30" y="176" font-size="12" fill="#8a8f94">5'-P</text><line x1="62" y1="172" x2="250" y2="172" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><line x1="250" y1="172" x2="366" y2="172" stroke="#5b4b8a" stroke-width="4" stroke-linecap="round"/><rect x="366" y="164" width="16" height="16" rx="2" fill="#a33a28" stroke="#a33a28" stroke-width="1.2"/><text x="30" y="210" font-size="13" fill="#23282d">- the adapter carries the energy (App), so the reaction needs no ATP</text><text x="30" y="230" font-size="13" fill="#23282d">- no ATP: the RNA cannot adenylate and circularise itself</text><text x="30" y="250" font-size="13" fill="#23282d">- blocked 3' end: adapter cannot ligate to another adapter or to RNA</text>
</svg>
