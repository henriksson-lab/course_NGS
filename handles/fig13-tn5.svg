<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" width="720" height="338" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="338" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">Tn5: one enzyme dimer cuts the target and attaches adapter A to both new 5' ends</text><line x1="40" y1="62" x2="380" y2="62" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="76" x2="380" y2="76" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><ellipse cx="210" cy="69" rx="52" ry="24" fill="none" stroke="#b4532a" stroke-width="2" stroke-dasharray="4 3"/><line x1="190" y1="52" x2="190" y2="69" stroke="#b4532a" stroke-width="2.4" stroke-linecap="round"/><line x1="230" y1="69" x2="230" y2="86" stroke="#b4532a" stroke-width="2.4" stroke-linecap="round"/><text x="400" y="66" font-size="12" fill="#b4532a">top strand cut here, bottom strand cut 9 nt away</text><text x="30" y="124" font-size="13" fill="#23282d" font-weight="bold">left fragment, right-hand end</text><line x1="40" y1="148" x2="200" y2="148" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="40" y1="162" x2="236" y2="162" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="236" y="154" width="90" height="16" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="281.0" y="165.85" font-size="11" text-anchor="middle" fill="#23282d">adapter A</text><rect x="236" y="138" width="90" height="12" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="200" y="138" font-size="11" text-anchor="middle" fill="#8a8f94">3'-OH</text><text x="236" y="140" font-size="11" text-anchor="end" fill="#8a8f94">5'-P</text><line x1="202" y1="148" x2="234" y2="148" stroke="#a33a28" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2"/><text x="218" y="190" font-size="12" text-anchor="middle" fill="#a33a28">9-nt gap</text><text x="400" y="160" font-size="12" fill="#8a8f94">adapter joined to the bottom strand's 5' end</text><text x="30" y="226" font-size="13" fill="#23282d" font-weight="bold">right fragment, left-hand end: the mirror image, on the other strand</text><line x1="120" y1="250" x2="330" y2="250" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="156" y1="264" x2="330" y2="264" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="30" y="242" width="90" height="16" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="75.0" y="253.85" font-size="11" text-anchor="middle" fill="#23282d">adapter A</text><rect x="30" y="266" width="90" height="12" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="30" y="292" font-size="12" fill="#8a8f94">The 9 nt between the cuts end up at both new ends: the target duplication.</text><text x="30" y="320" font-size="13" fill="#b4532a">No ligase: the transposase joins the adapter. A polymerase at 72 C must fill the gap before PCR.</text>
</svg>
