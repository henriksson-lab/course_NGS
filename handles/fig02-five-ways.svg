<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="820" height="340" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="340" fill="none"/>
<text x="20" y="24" font-size="13" fill="#8a8f94">way</text><text x="240" y="24" font-size="13" fill="#8a8f94">picture</text><text x="480" y="24" font-size="13" fill="#8a8f94">what does the work</text><text x="20" y="72" font-size="15" fill="#23282d" font-weight="bold">1  DNA ligation</text><rect x="240" y="56" width="40" height="18" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="260.0" y="69.2" font-size="12" text-anchor="middle" fill="#23282d">A</text><rect x="282" y="56" width="90" height="18" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="327.0" y="69.2" font-size="12" text-anchor="middle" fill="#23282d">insert</text><rect x="374" y="56" width="40" height="18" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="394.0" y="69.2" font-size="12" text-anchor="middle" fill="#23282d">B</text><line x1="281" y1="52" x2="281" y2="78" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="373" y1="52" x2="373" y2="78" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><text x="480" y="72" font-size="14" fill="#23282d">T4 DNA ligase, adapters</text><text x="20" y="120" font-size="15" fill="#23282d" font-weight="bold">2  RNA ligation</text><rect x="240" y="104" width="40" height="18" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="260.0" y="117.2" font-size="12" text-anchor="middle" fill="#23282d">5' ad</text><rect x="282" y="104" width="90" height="18" rx="3" fill="#efe0cc" stroke="#8a5a2b" stroke-width="1.2"/><text x="327.0" y="117.2" font-size="12" text-anchor="middle" fill="#23282d">RNA</text><rect x="374" y="104" width="40" height="18" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="394.0" y="117.2" font-size="12" text-anchor="middle" fill="#23282d">3' ad</text><text x="480" y="120" font-size="14" fill="#23282d">T4 RNA ligases, adapters</text><text x="20" y="168" font-size="15" fill="#23282d" font-weight="bold">3  Primer tails</text><rect x="282" y="164" width="90" height="8" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><rect x="240" y="152" width="38" height="9" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><rect x="278" y="152" width="24" height="9" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><rect x="352" y="174" width="24" height="9" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><rect x="376" y="174" width="38" height="9" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="480" y="168" font-size="14" fill="#23282d">any polymerase; the primer is the handle</text><text x="20" y="216" font-size="15" fill="#23282d" font-weight="bold">4  Transposition</text><rect x="240" y="200" width="56" height="18" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><rect x="310" y="200" width="56" height="18" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><rect x="380" y="200" width="56" height="18" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><rect x="296" y="200" width="6" height="18" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><rect x="302" y="200" width="6" height="18" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><rect x="366" y="200" width="6" height="18" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><rect x="372" y="200" width="6" height="18" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="480" y="216" font-size="14" fill="#23282d">Tn5 cuts and tags in one step</text><text x="20" y="264" font-size="15" fill="#23282d" font-weight="bold">5  Template switching</text><rect x="274" y="248" width="140" height="8" rx="3" fill="#efe0cc" stroke="#8a5a2b" stroke-width="1.2"/><rect x="240" y="262" width="34" height="8" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><rect x="274" y="262" width="140" height="8" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="480" y="264" font-size="14" fill="#23282d">RT adds the handle at the cDNA end</text><text x="20" y="304" font-size="13" fill="#8a8f94">Also: homopolymer tailing, topoisomerase, recombination. All use the same three ideas:</text><text x="20" y="324" font-size="13" fill="#8a8f94">join something on, copy with something attached, or insert while cutting.</text>
</svg>
