<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="268" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">Truncated adapters: ligate the part every library shares, add the rest by PCR</text><rect x="100" y="46" width="74" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="137.0" y="61.2" font-size="12" text-anchor="middle" fill="#23282d">read 1 site</text><rect x="174" y="46" width="170" height="22" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="259.0" y="61.2" font-size="12" text-anchor="middle" fill="#23282d">insert</text><rect x="344" y="46" width="74" height="22" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="381.0" y="61.2" font-size="12" text-anchor="middle" fill="#23282d">read 2 site</text><text x="30" y="62" font-size="12" fill="#8a8f94">ligated</text><text x="100" y="90" font-size="12" fill="#8a8f94">the stub is short and identical for every sample</text><rect x="60" y="124" width="46" height="20" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="83.0" y="138.2" font-size="12" text-anchor="middle" fill="#23282d">P5</text><rect x="106" y="124" width="40" height="20" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="126.0" y="138.2" font-size="12" text-anchor="middle" fill="#23282d">i5</text><rect x="146" y="124" width="74" height="20" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="183.0" y="138.2" font-size="12" text-anchor="middle" fill="#23282d">read 1 site</text><rect x="300" y="160" width="74" height="20" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="337.0" y="174.2" font-size="12" text-anchor="middle" fill="#23282d">read 2 site</text><rect x="374" y="160" width="40" height="20" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="394.0" y="174.2" font-size="12" text-anchor="middle" fill="#23282d">i7</text><rect x="414" y="160" width="46" height="20" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="437.0" y="174.2" font-size="12" text-anchor="middle" fill="#23282d">P7</text><text x="30" y="140" font-size="12" fill="#8a8f94">PCR</text><text x="60" y="118" font-size="12" fill="#8a8f94">index primer: 3' end pairs with the stub, 5' tail adds the rest</text><text x="30" y="212" font-size="13" fill="#23282d" font-weight="bold">result:</text><rect x="100" y="198" width="46" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="123.0" y="213.2" font-size="12" text-anchor="middle" fill="#23282d">P5</text><rect x="147" y="198" width="40" height="22" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="167.0" y="213.2" font-size="12" text-anchor="middle" fill="#23282d">i5</text><rect x="188" y="198" width="60" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="218.0" y="213.2" font-size="12" text-anchor="middle" fill="#23282d">read 1</text><rect x="249" y="198" width="150" height="22" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="324.0" y="213.2" font-size="12" text-anchor="middle" fill="#23282d">insert</text><rect x="400" y="198" width="60" height="22" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="430.0" y="213.2" font-size="12" text-anchor="middle" fill="#23282d">read 2</text><rect x="461" y="198" width="40" height="22" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="481.0" y="213.2" font-size="12" text-anchor="middle" fill="#23282d">i7</text><rect x="502" y="198" width="46" height="22" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="525.0" y="213.2" font-size="12" text-anchor="middle" fill="#23282d">P7</text><text x="30" y="250" font-size="13" fill="#b4532a">One adapter stock serves every sample. Index choice is a PCR decision, not a ligation one.</text>
</svg>
