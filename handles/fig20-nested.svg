<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 248" width="720" height="248" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="248" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">Nested handles: each round primes on the previous round's handle</text><text x="30" y="65" font-size="13" fill="#23282d">round 1</text><rect x="110" y="50" width="34" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="127.0" y="65.2" font-size="12" text-anchor="middle" fill="#23282d">H1</text><rect x="145" y="50" width="150" height="22" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="220.0" y="65.2" font-size="12" text-anchor="middle" fill="#23282d">target</text><rect x="296" y="50" width="34" height="22" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="313.0" y="65.2" font-size="12" text-anchor="middle" fill="#23282d">H1'</text><text x="30" y="113" font-size="13" fill="#23282d">round 2</text><rect x="110" y="98" width="34" height="22" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="127.0" y="113.2" font-size="12" text-anchor="middle" fill="#23282d">H2</text><rect x="145" y="98" width="34" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="162.0" y="113.2" font-size="12" text-anchor="middle" fill="#23282d">H1</text><rect x="180" y="98" width="150" height="22" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="255.0" y="113.2" font-size="12" text-anchor="middle" fill="#23282d">target</text><rect x="331" y="98" width="34" height="22" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="348.0" y="113.2" font-size="12" text-anchor="middle" fill="#23282d">H1'</text><rect x="366" y="98" width="34" height="22" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="383.0" y="113.2" font-size="12" text-anchor="middle" fill="#23282d">H2'</text><text x="30" y="161" font-size="13" fill="#23282d">round 3</text><rect x="110" y="146" width="34" height="22" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="127.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">H3</text><rect x="145" y="146" width="34" height="22" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="162.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">H2</text><rect x="180" y="146" width="34" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="197.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">H1</text><rect x="215" y="146" width="150" height="22" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="290.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">target</text><rect x="366" y="146" width="34" height="22" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="383.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">H1'</text><rect x="401" y="146" width="34" height="22" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="418.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">H2'</text><rect x="436" y="146" width="34" height="22" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="453.0" y="161.2" font-size="12" text-anchor="middle" fill="#23282d">H3'</text><text x="30" y="210" font-size="13" fill="#23282d">A product that lacks H1 cannot be primed in round 2, so background from round 1 stops here.</text><text x="30" y="230" font-size="13" fill="#23282d">Used for rare targets (5' RACE, TCR/BCR libraries) and to extend a short handle in steps.</text>
</svg>
