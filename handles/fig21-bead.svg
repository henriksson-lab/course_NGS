<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 268" width="720" height="268" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="268" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">Bead-bound handles: the handle is already on a solid support</text><circle cx="90" cy="120" r="34" fill="#eceeef" stroke="#8a8f94" stroke-width="1.5"/><text x="90" y="124" font-size="12" text-anchor="middle" fill="#23282d">bead</text><line x1="116.04551106604525" y1="98.14522127065766" x2="156.04551106604526" y2="98.14522127065766" stroke="#6b7075" stroke-width="2" stroke-linecap="round"/><line x1="124.0" y1="120.0" x2="164.0" y2="120.0" stroke="#6b7075" stroke-width="2" stroke-linecap="round"/><line x1="116.04551106604525" y1="141.85477872934234" x2="156.04551106604526" y2="141.85477872934234" stroke="#6b7075" stroke-width="2" stroke-linecap="round"/><rect x="150" y="89" width="52" height="18" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="176.0" y="102.2" font-size="12" text-anchor="middle" fill="#23282d">handle</text><rect x="202" y="89" width="62" height="18" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="233.0" y="102.2" font-size="12" text-anchor="middle" fill="#23282d">barcode</text><rect x="264" y="89" width="38" height="18" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="283.0" y="102.2" font-size="12" text-anchor="middle" fill="#23282d">UMI</text><rect x="302" y="89" width="36" height="18" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="320.0" y="102.2" font-size="12" text-anchor="middle" fill="#23282d">T...T</text><text x="150" y="78" font-size="12" fill="#8a8f94">same barcode on every oligo of one bead</text><text x="152" y="125" font-size="14" fill="#8a8f94">...</text><rect x="150" y="133" width="52" height="18" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="176.0" y="146.2" font-size="12" text-anchor="middle" fill="#23282d">handle</text><rect x="202" y="133" width="62" height="18" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="233.0" y="146.2" font-size="12" text-anchor="middle" fill="#23282d">barcode</text><rect x="264" y="133" width="38" height="18" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><text x="283.0" y="146.2" font-size="12" text-anchor="middle" fill="#23282d">UMI</text><rect x="302" y="133" width="36" height="18" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="320.0" y="146.2" font-size="12" text-anchor="middle" fill="#23282d">T...T</text><text x="150" y="168" font-size="12" fill="#8a8f94">a different UMI on every oligo</text><text x="30" y="210" font-size="13" fill="#23282d">- the polyA of a lysed cell's mRNA hybridises to the bead's T-run; RT extends it</text><text x="30" y="230" font-size="13" fill="#23282d">- barcode is chemically attached at synthesis: no ligation, no mixing between beads</text><text x="30" y="250" font-size="13" fill="#23282d">- streptavidin beads can also hold a biotinylated adapter during library steps</text>
</svg>
