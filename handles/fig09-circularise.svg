<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="330" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">Circularisation: one primer supplies both handles</text><rect x="30" y="44" width="34" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="47.0" y="59.2" font-size="12" text-anchor="middle" fill="#23282d">H1a</text><rect x="64" y="44" width="22" height="22" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="75.0" y="59.2" font-size="12" text-anchor="middle" fill="#23282d">cut</text><rect x="86" y="44" width="34" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="103.0" y="59.2" font-size="12" text-anchor="middle" fill="#23282d">H1b</text><rect x="120" y="44" width="150" height="22" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="195.0" y="59.2" font-size="12" text-anchor="middle" fill="#23282d">cDNA</text><text x="30" y="40" font-size="11" fill="#8a8f94">5'-P</text><text x="274" y="60" font-size="11" fill="#8a8f94">3'-OH</text><text x="30" y="90" font-size="12" fill="#8a8f94">primer with 5' phosphate; cDNA ends where RT stopped</text><path d="M 106.8 174.3 A 46 46 0 0 1 150.0 144.0" fill="none" stroke="#b4532a" stroke-width="7"/><path d="M 154.0 144.2 A 46 46 0 0 1 173.0 150.2" fill="none" stroke="#9a7b14" stroke-width="7"/><path d="M 176.4 152.3 A 46 46 0 0 1 193.2 174.3" fill="none" stroke="#b4532a" stroke-width="7"/><path d="M 194.4 178.1 A 46 46 0 1 1 104.7 182.0" fill="none" stroke="#8a8f94" stroke-width="7"/><text x="150" y="195" font-size="12" text-anchor="middle" fill="#23282d">circle</text><text x="216" y="194" font-size="12" fill="#8a8f94">ligase joins the cDNA 3' end to the primer 5' end</text><text x="216" y="212" font-size="12" fill="#8a8f94">(dilute: the two ends are on the same molecule)</text><rect x="30" y="264" width="34" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="47.0" y="279.2" font-size="12" text-anchor="middle" fill="#23282d">H1b</text><rect x="64" y="264" width="150" height="22" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="139.0" y="279.2" font-size="12" text-anchor="middle" fill="#23282d">cDNA</text><rect x="214" y="264" width="34" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="231.0" y="279.2" font-size="12" text-anchor="middle" fill="#23282d">H1a</text><text x="260" y="280" font-size="12" fill="#2e6b3f">cut at the site: handle on each side</text><text x="30" y="312" font-size="13" fill="#23282d">iCLIP: the cDNA 3' end is where RT stopped at the crosslinked nucleotide.</text>
</svg>
