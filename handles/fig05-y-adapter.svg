<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="240" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">two adapters, A and B, mixed</text><rect x="30" y="48" width="36" height="20" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="48.0" y="62.2" font-size="12" text-anchor="middle" fill="#23282d">A</text><rect x="68" y="48" width="100" height="20" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="118.0" y="62.2" font-size="12" text-anchor="middle" fill="#23282d">insert</text><rect x="170" y="48" width="36" height="20" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="188.0" y="62.2" font-size="12" text-anchor="middle" fill="#23282d">A</text><text x="222" y="63" font-size="13" fill="#a33a28">25% same at both ends</text><rect x="30" y="88" width="36" height="20" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="48.0" y="102.2" font-size="12" text-anchor="middle" fill="#23282d">A</text><rect x="68" y="88" width="100" height="20" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="118.0" y="102.2" font-size="12" text-anchor="middle" fill="#23282d">insert</text><rect x="170" y="88" width="36" height="20" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="188.0" y="102.2" font-size="12" text-anchor="middle" fill="#23282d">B</text><text x="222" y="103" font-size="13" fill="#2e6b3f">50% has both ends</text><rect x="30" y="128" width="36" height="20" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="48.0" y="142.2" font-size="12" text-anchor="middle" fill="#23282d">B</text><rect x="68" y="128" width="100" height="20" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="118.0" y="142.2" font-size="12" text-anchor="middle" fill="#23282d">insert</text><rect x="170" y="128" width="36" height="20" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="188.0" y="142.2" font-size="12" text-anchor="middle" fill="#23282d">B</text><text x="222" y="143" font-size="13" fill="#a33a28">25% same at both ends</text><text x="30" y="186" font-size="13" fill="#a33a28">half of the molecules are wasted</text><text x="520" y="26" font-size="14" fill="#23282d" font-weight="bold">one forked (Y) adapter</text><rect x="580" y="70" width="120" height="18" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="640.0" y="83.2" font-size="12" text-anchor="middle" fill="#23282d">insert</text><rect x="554" y="64" width="24" height="30" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><line x1="554" y1="70" x2="518" y2="52" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><line x1="554" y1="88" x2="518" y2="106" stroke="#5b4b8a" stroke-width="2.6" stroke-linecap="round"/><rect x="704" y="64" width="24" height="30" rx="3" fill="#d9dde0" stroke="#6b7075" stroke-width="1.2"/><line x1="728" y1="70" x2="764" y2="52" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><line x1="728" y1="88" x2="764" y2="106" stroke="#5b4b8a" stroke-width="2.6" stroke-linecap="round"/><text x="510" y="46" font-size="12" fill="#b4532a">arm A</text><text x="510" y="124" font-size="12" fill="#5b4b8a">arm B</text><text x="770" y="46" font-size="12" fill="#b4532a">arm A</text><text x="770" y="124" font-size="12" fill="#5b4b8a">arm B</text><text x="520" y="170" font-size="13" fill="#8a8f94">same adapter at both ends; after the first copy,</text><text x="520" y="188" font-size="13" fill="#2e6b3f">one strand ends in A and the other in B</text><text x="30" y="222" font-size="14" fill="#b4532a">Y adapters make asymmetry from a single oligo pair: no wasted combinations.</text>
</svg>
