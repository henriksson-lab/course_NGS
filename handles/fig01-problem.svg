<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="244" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">What you have: molecules of unknown sequence and length</text><rect x="40" y="40" width="90" height="24" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="85.0" y="56.9" font-size="14" text-anchor="middle" fill="#23282d">?</text><rect x="160" y="40" width="150" height="24" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="235.0" y="56.9" font-size="14" text-anchor="middle" fill="#23282d">?</text><rect x="340" y="40" width="60" height="24" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="370.0" y="56.9" font-size="14" text-anchor="middle" fill="#23282d">?</text><rect x="430" y="40" width="120" height="24" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="490.0" y="56.9" font-size="14" text-anchor="middle" fill="#23282d">?</text><text x="30" y="100" font-size="14" fill="#23282d">What an enzyme, a polymerase and a sequencer need: the same known sequence on every molecule</text><rect x="40" y="118" width="46" height="28" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="63.0" y="136.2" font-size="12" text-anchor="middle" fill="#23282d">P5</text><rect x="88" y="118" width="36" height="28" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="106.0" y="136.2" font-size="12" text-anchor="middle" fill="#23282d">index</text><rect x="126" y="118" width="56" height="28" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="154.0" y="136.2" font-size="12" text-anchor="middle" fill="#23282d">read 1</text><rect x="184" y="118" width="170" height="28" rx="3" fill="#eceeef" stroke="#8a8f94" stroke-width="1.2"/><text x="269.0" y="136.2" font-size="12" text-anchor="middle" fill="#23282d">unknown insert</text><rect x="356" y="118" width="56" height="28" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="384.0" y="136.2" font-size="12" text-anchor="middle" fill="#23282d">read 2</text><rect x="414" y="118" width="36" height="28" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="432.0" y="136.2" font-size="12" text-anchor="middle" fill="#23282d">index</text><rect x="452" y="118" width="46" height="28" rx="3" fill="#e1dcef" stroke="#5b4b8a" stroke-width="1.2"/><text x="475.0" y="136.2" font-size="12" text-anchor="middle" fill="#23282d">P7</text><text x="40" y="172" font-size="13" fill="#b4532a">handle</text><text x="446" y="172" font-size="13" text-anchor="end" fill="#5b4b8a">handle</text><text x="30" y="204" font-size="14" fill="#23282d">Handles let you prime on it, amplify it, read it, count it and know which sample it came from.</text><text x="30" y="226" font-size="14" fill="#b4532a">Everything else in a library preparation exists to put them there.</text>
</svg>
