<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 790 222" width="790" height="222" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="790" height="222" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d" font-weight="bold">The RT primer is the handle</text><text x="30" y="64" font-size="12" fill="#8a8f94">5'</text><line x1="46" y1="60" x2="420" y2="60" stroke="#8a5a2b" stroke-width="4" stroke-linecap="round"/><text x="260" y="40" font-size="12" fill="#8a5a2b">mRNA</text><text x="424" y="64" font-size="11" fill="#8a5a2b" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="433" y="64" font-size="11" fill="#8a5a2b" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="442" y="64" font-size="11" fill="#8a5a2b" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="451" y="64" font-size="11" fill="#8a5a2b" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="460" y="64" font-size="11" fill="#8a5a2b" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="469" y="64" font-size="11" fill="#8a5a2b" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="478" y="64" font-size="11" fill="#8a5a2b" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="487" y="64" font-size="11" fill="#8a5a2b" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="498" y="64" font-size="12" fill="#8a8f94">3'</text><line x1="424" y1="92" x2="496" y2="92" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><text x="424" y="114" font-size="11" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T T T T T T T T</text><rect x="496" y="82" width="70" height="22" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="531.0" y="97.2" font-size="12" text-anchor="middle" fill="#23282d">UMI</text><rect x="566" y="82" width="60" height="22" rx="3" fill="#f1e6b8" stroke="#9a7b14" stroke-width="1.2"/><text x="596.0" y="97.2" font-size="12" text-anchor="middle" fill="#23282d">barcode</text><rect x="626" y="82" width="90" height="22" rx="3" fill="#f3dccf" stroke="#b4532a" stroke-width="1.2"/><text x="671.0" y="97.2" font-size="12" text-anchor="middle" fill="#23282d">handle</text><line x1="424" y1="92" x2="245" y2="92" stroke="#1f3b57" stroke-width="2.4" stroke-linecap="round"/><path d="M 240 92 L 245 88.5 L 245 95.5 Z" fill="#1f3b57"/><line x1="240" y1="92" x2="424" y2="92" stroke="#6b7075" stroke-width="3" stroke-linecap="round"/><text x="250" y="120" font-size="12" fill="#8a8f94">RT writes cDNA from the primer</text><text x="30" y="160" font-size="13" fill="#23282d">First-strand cDNA starts with handle, barcode and UMI, then T's, then the transcript.</text><text x="30" y="182" font-size="13" fill="#23282d">CEL-Seq, Drop-seq, 10x 3' and most 3'-end methods use this; no ligation step is needed.</text><text x="30" y="204" font-size="13" fill="#8a8f94">A 'VN' at the primer 3' end anchors it to the start of the poly(A), not inside it.</text>
</svg>
