<text x="30" y="26" font-size="14" fill="#23282d">Tn5 cuts the target and joins an adapter to each new end in one step.</text><line x1="40" y1="90" x2="700" y2="90" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="40" y1="98" x2="700" y2="98" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><rect x="204.0" y="46.0" width="52.0" height="30.0" rx="3" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.4"/><text x="230" y="66" font-size="13" text-anchor="middle" fill="#2e6b3f">Tn5</text><line x1="220" y1="76" x2="220" y2="88" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><line x1="240" y1="76" x2="240" y2="88" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><rect x="454.0" y="46.0" width="52.0" height="30.0" rx="3" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.4"/><text x="480" y="66" font-size="13" text-anchor="middle" fill="#2e6b3f">Tn5</text><line x1="470" y1="76" x2="470" y2="88" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><line x1="490" y1="76" x2="490" y2="88" stroke="#2e6b3f" stroke-width="2" stroke-linecap="round"/><line x1="370" y1="116" x2="370" y2="139" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 370 144 L 366.5 139 L 373.5 139 Z" fill="#8a8f94"/><line x1="40" y1="178" x2="214" y2="178" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="40" y1="186" x2="214" y2="186" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><rect x="34.0" y="170.0" width="14.0" height="24.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1"/><rect x="206.0" y="170.0" width="14.0" height="24.0" rx="3" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1"/><line x1="254" y1="178" x2="464" y2="178" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="254" y1="186" x2="464" y2="186" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><rect x="248.0" y="170.0" width="14.0" height="24.0" rx="3" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1"/><rect x="456.0" y="170.0" width="14.0" height="24.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1"/><text x="222" y="222" font-size="12.5" fill="#8a8f94">9 nt gaps either side of each</text><text x="222" y="238" font-size="12.5" fill="#8a8f94">cut: polymerase fills them at 72 C</text><text x="500" y="182" font-size="13" fill="#23282d">adapters A and B ends already</text><text x="500" y="200" font-size="13" fill="#23282d">present: fragmentation and</text><text x="500" y="218" font-size="13" fill="#23282d">adapter ligation are one step</text><text x="30" y="276" font-size="14" fill="#23282d">The two adapters arrive at random: only the A+B fragments can be amplified with a primer pair.</text>
</svg>
