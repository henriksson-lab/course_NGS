<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 256" width="760" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="256" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">To read long, do not cut. Every handling step is a cut (illustrative).</text><text x="30" y="59" font-size="13.5" fill="#23282d">lysed cells, gentle</text><rect x="230.0" y="47.0" width="461.2" height="14.0" rx="3" fill="#2e6b3f" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="30" y="89" font-size="13.5" fill="#23282d">wide-bore pipetting</text><rect x="230.0" y="77.0" width="362.9" height="14.0" rx="3" fill="#2e6b3f" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="30" y="119" font-size="13.5" fill="#23282d">vortex</text><rect x="230.0" y="107.0" width="212.5" height="14.0" rx="3" fill="#a33a28" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="30" y="149" font-size="13.5" fill="#23282d">column clean-up</text><rect x="230.0" y="137.0" width="163.3" height="14.0" rx="3" fill="#a33a28" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="30" y="179" font-size="13.5" fill="#23282d">syringe or g-TUBE</text><rect x="230.0" y="167.0" width="85.4" height="14.0" rx="3" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><line x1="230" y1="196" x2="720" y2="196" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><line x1="315.4035283957885" y1="196" x2="315.4035283957885" y2="201" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="315.4035283957885" y="216" font-size="12" text-anchor="middle" fill="#8a8f94">10 kb</text><line x1="478.7368617291218" y1="196" x2="478.7368617291218" y2="201" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="478.7368617291218" y="216" font-size="12" text-anchor="middle" fill="#8a8f94">100 kb</text><line x1="642.0701950624551" y1="196" x2="642.0701950624551" y2="201" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="642.0701950624551" y="216" font-size="12" text-anchor="middle" fill="#8a8f94">1 Mb</text><text x="30" y="242" font-size="13.5" fill="#23282d">Bar lengths show the idea, not measurements. Rapid kits use low-ratio transposase to cut once or twice.</text>
</svg>
