<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" width="760" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="254" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">A genome is a few billion bases; a read is a few hundred. Something has to cut.</text><text x="30" y="62" font-size="13" fill="#8a8f94">chromosome</text><line x1="120" y1="58" x2="720" y2="58" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="190" y1="46" x2="190" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="255" y1="46" x2="255" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="330" y1="46" x2="330" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="392" y1="46" x2="392" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="470" y1="46" x2="470" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="540" y1="46" x2="540" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="610" y1="46" x2="610" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="668" y1="46" x2="668" y2="70" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><text x="30" y="112" font-size="13" fill="#8a8f94">fragments</text><line x1="124" y1="108" x2="186" y2="108" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="194" y1="108" x2="251" y2="108" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="259" y1="108" x2="326" y2="108" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="334" y1="108" x2="388" y2="108" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="396" y1="108" x2="466" y2="108" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="474" y1="108" x2="536" y2="108" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="544" y1="108" x2="606" y2="108" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="614" y1="108" x2="664" y2="108" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="672" y1="108" x2="716" y2="108" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><text x="30" y="158" font-size="13" fill="#8a8f94">one library</text><rect x="166.0" y="146.0" width="34.0" height="16.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1"/><rect x="620.0" y="146.0" width="34.0" height="16.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1"/><rect x="200.0" y="150.0" width="420.0" height="8.0" rx="1" fill="#e8eef4" stroke="#1f3b57" stroke-width="1"/><text x="183" y="158" font-size="11" text-anchor="middle" fill="#b4532a">P5</text><text x="637" y="158" font-size="11" text-anchor="middle" fill="#b4532a">P7</text><line x1="200" y1="184" x2="345" y2="184" stroke="#2e6b3f" stroke-width="2.2" stroke-linecap="round"/><path d="M 350 184 L 345 180.5 L 345 187.5 Z" fill="#2e6b3f"/><line x1="620" y1="184" x2="475" y2="184" stroke="#2e6b3f" stroke-width="2.2" stroke-linecap="round"/><path d="M 470 184 L 475 180.5 L 475 187.5 Z" fill="#2e6b3f"/><text x="200" y="206" font-size="12.5" fill="#2e6b3f">read 1</text><text x="570" y="206" font-size="12.5" fill="#2e6b3f">read 2</text><text x="410.0" y="136" font-size="13" text-anchor="middle" fill="#23282d">insert: the part you actually want to know about</text><text x="30" y="238" font-size="14" fill="#23282d">The size of the insert is a design parameter, not an accident of the cutting method.</text>
</svg>
