<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="284" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">What the sequencer wants sets the target (typical working ranges, log scale).</text><text x="30" y="57" font-size="13.5" fill="#23282d">small RNA</text><rect x="237.5" y="46.0" width="20.9" height="12.0" rx="3" fill="#2e6b3f" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="30" y="87" font-size="13.5" fill="#23282d">cell-free DNA (native)</text><rect x="321.5" y="76.0" width="14.6" height="12.0" rx="3" fill="#8a8f94" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="30" y="117" font-size="13.5" fill="#23282d">Illumina, PE150 insert</text><rect x="345.2" y="106.0" width="35.9" height="12.0" rx="3" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="30" y="147" font-size="13.5" fill="#23282d">PacBio HiFi</text><rect x="496.4" y="136.0" width="37.5" height="12.0" rx="3" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="30" y="177" font-size="13.5" fill="#23282d">nanopore, ligation</text><rect x="468.0" y="166.0" width="101.8" height="12.0" rx="3" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="30" y="207" font-size="13.5" fill="#23282d">nanopore, ultra-long</text><rect x="590.7" y="196.0" width="110.9" height="12.0" rx="3" fill="#b4532a" fill-opacity="0.85" stroke="none" stroke-width="0"/><line x1="230" y1="222" x2="730" y2="222" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><line x1="241.78438310200985" y1="222" x2="241.78438310200985" y2="227" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="241.78438310200985" y="242" font-size="12" text-anchor="middle" fill="#8a8f94">20</text><line x1="307.71213722788224" y1="222" x2="307.71213722788224" y2="227" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="307.71213722788224" y="242" font-size="12" text-anchor="middle" fill="#8a8f94">100</text><line x1="402.03342958219434" y1="222" x2="402.03342958219434" y2="227" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="402.03342958219434" y="242" font-size="12" text-anchor="middle" fill="#8a8f94">1 kb</text><line x1="496.35472193650634" y1="222" x2="496.35472193650634" y2="227" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="496.35472193650634" y="242" font-size="12" text-anchor="middle" fill="#8a8f94">10 kb</text><line x1="590.6760142908184" y1="222" x2="590.6760142908184" y2="227" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="590.6760142908184" y="242" font-size="12" text-anchor="middle" fill="#8a8f94">100 kb</text><line x1="684.9973066451305" y1="222" x2="684.9973066451305" y2="227" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><text x="684.9973066451305" y="242" font-size="12" text-anchor="middle" fill="#8a8f94">1 Mb</text><text x="30" y="270" font-size="14" fill="#23282d">Short-read machines need you to cut; long-read machines mostly need you not to.</text>
</svg>
