<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 302" width="760" height="302" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="302" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">RNA carries its own scissors: the 2'-OH. DNA does not.</text><text x="30" y="66" font-size="14" fill="#23282d" font-weight="bold">RNA</text><circle cx="110.0" cy="96.0" r="15" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.4"/><text x="110" y="100" font-size="10.5" text-anchor="middle" fill="#8a8f94">sugar</text><rect x="100.0" y="120.0" width="20.0" height="16.0" rx="3" fill="#dde8f1" stroke="#4a6b8a" stroke-width="1"/><line x1="110" y1="111" x2="110" y2="120" stroke="#4a6b8a" stroke-width="1.4" stroke-linecap="round"/><line x1="125" y1="96" x2="187" y2="96" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><circle cx="156.0" cy="96.0" r="5.5" fill="#fff" stroke="#1f3b57" stroke-width="1.4"/><text x="156" y="86" font-size="10.5" text-anchor="middle" fill="#1f3b57">P</text><circle cx="202.0" cy="96.0" r="15" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.4"/><text x="202" y="100" font-size="10.5" text-anchor="middle" fill="#8a8f94">sugar</text><rect x="192.0" y="120.0" width="20.0" height="16.0" rx="3" fill="#dde8f1" stroke="#4a6b8a" stroke-width="1"/><line x1="202" y1="111" x2="202" y2="120" stroke="#4a6b8a" stroke-width="1.4" stroke-linecap="round"/><line x1="217" y1="96" x2="279" y2="96" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><circle cx="248.0" cy="96.0" r="5.5" fill="#fff" stroke="#1f3b57" stroke-width="1.4"/><text x="248" y="86" font-size="10.5" text-anchor="middle" fill="#1f3b57">P</text><line x1="208" y1="82" x2="220" y2="62" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><text x="224" y="58" font-size="12" fill="#b4532a">2'-OH</text><circle cx="294.0" cy="96.0" r="15" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.4"/><text x="294" y="100" font-size="10.5" text-anchor="middle" fill="#8a8f94">sugar</text><rect x="284.0" y="120.0" width="20.0" height="16.0" rx="3" fill="#dde8f1" stroke="#4a6b8a" stroke-width="1"/><line x1="294" y1="111" x2="294" y2="120" stroke="#4a6b8a" stroke-width="1.4" stroke-linecap="round"/><text x="330" y="100" font-size="13" fill="#b4532a">Mg2+ or Zn2+ with heat, or alkali: 2'-OH attacks the</text><text x="330" y="118" font-size="13" fill="#b4532a">next phosphate, the chain breaks</text><text x="330" y="138" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>2',3'-cyclic phosphate + 5'-OH</text><text x="30" y="186" font-size="14" fill="#23282d" font-weight="bold">DNA</text><circle cx="110.0" cy="214.0" r="15" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.4"/><text x="110" y="218" font-size="10.5" text-anchor="middle" fill="#8a8f94">sugar</text><rect x="100.0" y="238.0" width="20.0" height="16.0" rx="3" fill="#dde8f1" stroke="#4a6b8a" stroke-width="1"/><line x1="110" y1="229" x2="110" y2="238" stroke="#4a6b8a" stroke-width="1.4" stroke-linecap="round"/><line x1="125" y1="214" x2="187" y2="214" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><circle cx="156.0" cy="214.0" r="5.5" fill="#fff" stroke="#1f3b57" stroke-width="1.4"/><text x="156" y="204" font-size="10.5" text-anchor="middle" fill="#1f3b57">P</text><circle cx="202.0" cy="214.0" r="15" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.4"/><text x="202" y="218" font-size="10.5" text-anchor="middle" fill="#8a8f94">sugar</text><rect x="192.0" y="238.0" width="20.0" height="16.0" rx="3" fill="#dde8f1" stroke="#4a6b8a" stroke-width="1"/><line x1="202" y1="229" x2="202" y2="238" stroke="#4a6b8a" stroke-width="1.4" stroke-linecap="round"/><line x1="217" y1="214" x2="279" y2="214" stroke="#1f3b57" stroke-width="2" stroke-linecap="round"/><circle cx="248.0" cy="214.0" r="5.5" fill="#fff" stroke="#1f3b57" stroke-width="1.4"/><text x="248" y="204" font-size="10.5" text-anchor="middle" fill="#1f3b57">P</text><circle cx="294.0" cy="214.0" r="15" fill="#e8eef4" stroke="#4a6b8a" stroke-width="1.4"/><text x="294" y="218" font-size="10.5" text-anchor="middle" fill="#8a8f94">sugar</text><rect x="284.0" y="238.0" width="20.0" height="16.0" rx="3" fill="#dde8f1" stroke="#4a6b8a" stroke-width="1"/><line x1="294" y1="229" x2="294" y2="238" stroke="#4a6b8a" stroke-width="1.4" stroke-linecap="round"/><text x="330" y="214" font-size="13" fill="#23282d">no 2'-OH, nothing to attack with: alkali denatures</text><text x="330" y="232" font-size="13" fill="#23282d">DNA but does not cut it</text><text x="30" y="286" font-size="14" fill="#23282d">This is why RNA is fragmented by hydrolysis, and DNA needs a physical or enzymatic cut.</text>
</svg>
