.0" width="30.0" height="5.0" rx="3" fill="#c9c9c4" stroke="none" stroke-width="0"/><rect x="316.0" y="65.9" width="30.0" height="3.2" rx="1.5" fill="#23282d" fill-opacity="0.8" stroke="none" stroke-width="0"/><rect x="316.0" y="93.4" width="30.0" height="3.2" rx="1.5" fill="#23282d" fill-opacity="0.8" stroke="none" stroke-width="0"/><rect x="316.0" y="112.9" width="30.0" height="3.2" rx="1.5" fill="#23282d" fill-opacity="0.8" stroke="none" stroke-width="0"/><rect x="316.0" y="140.3" width="30.0" height="3.2" rx="1.5" fill="#23282d" fill-opacity="0.8" stroke="none" stroke-width="0"/><rect x="316.0" y="159.8" width="30.0" height="3.2" rx="1.5" fill="#23282d" fill-opacity="0.8" stroke="none" stroke-width="0"/><rect x="316.0" y="187.3" width="30.0" height="3.2" rx="1.5" fill="#23282d" fill-opacity="0.8" stroke="none" stroke-width="0"/><rect x="360.0" y="128.0" width="30.0" height="3.2" rx="1.5" fill="#a33a28" fill-opacity="0.8" stroke="none" stroke-width="0"/><rect x="360.0" y="114.2" width="30.0" height="3.2" rx="1.5" fill="#23282d" fill-opacity="0.8" stroke="none" stroke-width="0"/><rect x="355.0" y="108.0" width="40.0" height="13.6" rx="2" fill="none" stroke="#b4532a" stroke-width="1.6"/><text x="385" y="232" font-size="12.5" text-anchor="middle" fill="#8a8f94">PAGE: small RNA library, product above dimer</text><text x="520" y="70" font-size="13.5" fill="#23282d">Exact windows: a few bp for PAGE.</text><text x="520" y="94" font-size="13.5" fill="#23282d">Costs: losses (often half or more),</text><text x="520" y="114" font-size="13.5" fill="#23282d">an hour or two, a blade and a stain.</text><text x="520" y="150" font-size="13.5" fill="#23282d">Use when beads cannot separate product</text><text x="520" y="170" font-size="13.5" fill="#23282d">from contaminant: a 22 nt insert gives</text><text x="520" y="190" font-size="13.5" fill="#23282d">~145 bp, the adapter dimer ~120 bp.</text>
</svg>
