oke-linecap="round"/><text x="710" y="134" font-size="13" fill="#8a8f94">4 cuts</text><text x="120" y="168" font-size="12.5" fill="#8a8f94">16 kb of random sequence. A 4-cutter (CCGG) cuts about every 256 bases, a 6-cutter (GAATTC) about every 4 kb.</text><text x="30" y="204" font-size="14" fill="#23282d">Fragments pile up near the mean, but a few are very long and many are tiny.</text><text x="30" y="228" font-size="14" fill="#23282d">Useful when you want the same ends in every cell (RRBS, Hi-C, ddRAD).</text>
