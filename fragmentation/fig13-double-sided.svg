="#b4532a" stroke="none" stroke-width="0"/><text x="490" y="138" font-size="12" fill="#2e6b3f">bound: keep, elute</text><rect x="600.0" y="120.0" width="11.0" height="0.0" rx="1" fill="#1f3b57" stroke="none" stroke-width="0"/><rect x="614.0" y="120.0" width="11.0" height="0.0" rx="1" fill="#1f3b57" stroke="none" stroke-width="0"/><rect x="628.0" y="120.0" width="11.0" height="0.0" rx="1" fill="#2e6b3f" stroke="none" stroke-width="0"/><rect x="642.0" y="120.0" width="11.0" height="0.0" rx="1" fill="#2e6b3f" stroke="none" stroke-width="0"/><rect x="656.0" y="120.0" width="11.0" height="0.0" rx="1" fill="#2e6b3f" stroke="none" stroke-width="0"/><rect x="670.0" y="94.0" width="11.0" height="26.0" rx="1" fill="#b4532a" stroke="none" stroke-width="0"/><rect x="684.0" y="102.0" width="11.0" height="18.0" rx="1" fill="#b4532a" stroke="none" stroke-width="0"/><text x="600" y="138" font-size="12" fill="#a33a28">supernatant: discard</text><text x="30" y="158" font-size="12" fill="#1f3b57">long</text><text x="60" y="158" font-size="12" fill="#2e6b3f">target</text><text x="104" y="158" font-size="12" fill="#b4532a">short</text><rect x="20.0" y="176.0" width="700.0" height="66.0" rx="3" fill="none" stroke="#8a8f94" stroke-width="1"/><text x="34" y="198" font-size="13.5" fill="#23282d">The second addition is counted against the original sample volume:</text><text x="34" y="218" font-size="13.5" fill="#23282d">0.8x of 50 ul is 40 ul of beads in total, and 30 ul is already in, so add 10 ul.</text><text x="34" y="236" font-size="13.5" fill="#b4532a">Do not recompute from the 80 ul supernatant.</text>
