<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 297" width="760" height="297" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="297" fill="none"/>
<text x="30" y="24" font-size="13" fill="#8a8f94" font-weight="bold">method</text><text x="190" y="24" font-size="13" fill="#8a8f94" font-weight="bold">what cuts</text><text x="430" y="24" font-size="13" fill="#8a8f94" font-weight="bold">ends left behind</text><text x="600" y="24" font-size="13" fill="#8a8f94" font-weight="bold">bias</text><line x1="30" y1="32" x2="740" y2="32" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><circle cx="20" cy="52" r="4" fill="#b4532a"/><text x="30" y="56" font-size="14" fill="#23282d" font-weight="bold">Acoustic shear</text><text x="190" y="56" font-size="13.5" fill="#23282d">bubble collapse snaps the backbone</text><text x="430" y="56" font-size="13.5" fill="#23282d">ragged, damaged</text><text x="600" y="56" font-size="13.5" fill="#23282d">near-random</text><circle cx="20" cy="83" r="4" fill="#b4532a"/><text x="30" y="87" font-size="14" fill="#23282d" font-weight="bold">Enzymatic (FS-type)</text><text x="190" y="87" font-size="13.5" fill="#23282d">paired nicks become a break</text><text x="430" y="87" font-size="13.5" fill="#23282d">ragged, repaired in kit</text><text x="600" y="87" font-size="13.5" fill="#23282d">mild sequence bias</text><circle cx="20" cy="114" r="4" fill="#b4532a"/><text x="30" y="118" font-size="14" fill="#23282d" font-weight="bold">Tagmentation</text><text x="190" y="118" font-size="13.5" fill="#23282d">transposase cuts and tags</text><text x="430" y="118" font-size="13.5" fill="#23282d">adapter already on</text><text x="600" y="118" font-size="13.5" fill="#23282d">ratio sets size; bias</text><circle cx="20" cy="145" r="4" fill="#1f3b57"/><text x="30" y="149" font-size="14" fill="#23282d" font-weight="bold">Restriction enzyme</text><text x="190" y="149" font-size="13.5" fill="#23282d">recognition site</text><text x="430" y="149" font-size="13.5" fill="#23282d">defined, 5'-P 3'-OH</text><text x="600" y="149" font-size="13.5" fill="#23282d">set by the genome</text><circle cx="20" cy="176" r="4" fill="#1f3b57"/><text x="30" y="180" font-size="14" fill="#23282d" font-weight="bold">MNase</text><text x="190" y="180" font-size="13.5" fill="#23282d">linker DNA between nucleosomes</text><text x="430" y="180" font-size="13.5" fill="#23282d">5'-OH, 3'-P</text><text x="600" y="180" font-size="13.5" fill="#23282d">A/T-preferring</text><circle cx="20" cy="207" r="4" fill="#1f3b57"/><text x="30" y="211" font-size="14" fill="#23282d" font-weight="bold">DNase I</text><text x="190" y="211" font-size="13.5" fill="#23282d">accessible DNA</text><text x="430" y="211" font-size="13.5" fill="#23282d">5'-P, 3'-OH</text><text x="600" y="211" font-size="13.5" fill="#23282d">reports openness</text><circle cx="20" cy="238" r="4" fill="#2e6b3f"/><text x="30" y="242" font-size="14" fill="#23282d" font-weight="bold">Hydrolysis (RNA)</text><text x="190" y="242" font-size="13.5" fill="#23282d">2'-OH attacks the backbone</text><text x="430" y="242" font-size="13.5" fill="#23282d">2',3'-cyclic P, 5'-OH</text><text x="600" y="242" font-size="13.5" fill="#23282d">near-random</text><text x="30" y="279" font-size="13.5" fill="#23282d">The first three work on anything; the next three also report on the sample; the last one is for RNA.</text>
</svg>
