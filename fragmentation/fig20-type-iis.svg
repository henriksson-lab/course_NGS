<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="250" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Type IIS and IIG enzymes cut a fixed distance away from where they bind.</text><line x1="190" y1="84" x2="700" y2="84" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="190" y1="92" x2="700" y2="92" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><rect x="40.0" y="72.0" width="150.0" height="32.0" rx="3" fill="#f6e6dc" stroke="#b4532a" stroke-width="1.4"/><text x="115" y="92" font-size="12.5" text-anchor="middle" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>TCCRAC</text><text x="115" y="64" font-size="12" text-anchor="middle" fill="#b4532a">linker with MmeI site</text><rect x="190.0" y="74.0" width="170.0" height="28.0" rx="2" fill="#e3efe6" fill-opacity="0.8" stroke="#2e6b3f" stroke-width="1.2"/><text x="275" y="92" font-size="12" text-anchor="middle" fill="#2e6b3f">20 bp of genome</text><line x1="360" y1="62" x2="360" y2="116" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><text x="360" y="56" font-size="12" text-anchor="middle" fill="#b4532a">cut</text><text x="30" y="160" font-size="14" fill="#23282d">The enzyme binds to the linker, which you control, and cuts into the</text><text x="30" y="182" font-size="14" fill="#23282d">genome, which you do not. Every molecule yields a tag of the same length.</text><text x="30" y="214" font-size="13.5" fill="#8a8f94">SAGE (about 10 bp tags from human transcripts), DNase-seq (20 bp, MmeI) and</text><text x="30" y="234" font-size="13.5" fill="#8a8f94">CAGE (27 nt, EcoP15I) all rest on this: short tags, cheap to read, one per molecule.</text>
</svg>
