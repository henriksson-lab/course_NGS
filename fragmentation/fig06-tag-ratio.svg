<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="284" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">More transposase per DNA means more cuts and shorter fragments.</text><rect x="60.0" y="44.0" width="280.0" height="190.0" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><rect x="76.0" y="49.0" width="30.0" height="5.0" rx="3" fill="#c9c9c4" stroke="none" stroke-width="0"/><rect x="124.0" y="49.0" width="30.0" height="5.0" rx="3" fill="#c9c9c4" stroke="none" stroke-width="0"/><rect x="172.0" y="49.0" width="30.0" height="5.0" rx="3" fill="#c9c9c4" stroke="none" stroke-width="0"/><rect x="220.0" y="49.0" width="30.0" height="5.0" rx="3" fill="#c9c9c4" stroke="none" stroke-width="0"/><rect x="268.0" y="49.0" width="30.0" height="5.0" rx="3" fill="#c9c9c4" stroke="none" stroke-width="0"/><rect x="76.0" y="78.5" width="30.0" height="77.0" rx="3" fill="#23282d" fill-opacity="0.28" stroke="none" stroke-width="0"/><rect x="124.0" y="98.0" width="30.0" height="84.0" rx="3" fill="#23282d" fill-opacity="0.28" stroke="none" stroke-width="0"/><rect x="172.0" y="120.5" width="30.0" height="72.5" rx="3" fill="#23282d" fill-opacity="0.28" stroke="none" stroke-width="0"/><rect x="220.0" y="147.0" width="30.0" height="61.5" rx="3" fill="#23282d" fill-opacity="0.28" stroke="none" stroke-width="0"/><rect x="268.0" y="166.5" width="30.0" height="50.5" rx="3" fill="#23282d" fill-opacity="0.28" stroke="none" stroke-width="0"/><text x="91.0" y="252" font-size="12" text-anchor="middle" fill="#8a8f94">low</text><text x="139.0" y="252" font-size="12" text-anchor="middle" fill="#8a8f94"></text><text x="187.0" y="252" font-size="12" text-anchor="middle" fill="#8a8f94"></text><text x="235.0" y="252" font-size="12" text-anchor="middle" fill="#8a8f94"></text><text x="283.0" y="252" font-size="12" text-anchor="middle" fill="#8a8f94">high</text><text x="200" y="270" font-size="12.5" text-anchor="middle" fill="#8a8f94">enzyme : DNA</text><text x="380" y="90" font-size="13.5" fill="#23282d">Too little DNA for the enzyme: over-tagmented,</text><text x="380" y="110" font-size="13.5" fill="#23282d">fragments too short, many below read length.</text><text x="380" y="146" font-size="13.5" fill="#23282d">Too much DNA: under-tagmented, long fragments</text><text x="380" y="166" font-size="13.5" fill="#23282d">that cluster poorly.</text><text x="380" y="204" font-size="13.5" fill="#b4532a">So the DNA input must be measured, and measured</text><text x="380" y="224" font-size="13.5" fill="#b4532a">by fluorescence, not by absorbance.</text>
</svg>
