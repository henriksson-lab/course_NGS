<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 254" width="760" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="254" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">A bead ratio is a final PEG concentration (bead stock assumed 20 % PEG).</text><text x="30" y="57" font-size="13.5" fill="#23282d">0.6x in water</text><rect x="220.0" y="45.0" width="270.0" height="14.0" rx="3" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="498.0" y="57" font-size="13" fill="#8a8f94">7.5 %</text><text x="30" y="87" font-size="13.5" fill="#23282d">0.8x in water</text><rect x="220.0" y="75.0" width="320.0" height="14.0" rx="3" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="548.0" y="87" font-size="13" fill="#8a8f94">8.9 %</text><text x="30" y="117" font-size="13.5" fill="#23282d">1.0x in water</text><rect x="220.0" y="105.0" width="360.0" height="14.0" rx="3" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="588.0" y="117" font-size="13" fill="#8a8f94">10.0 %</text><text x="30" y="147" font-size="13.5" fill="#23282d">1.8x in water</text><rect x="220.0" y="135.0" width="462.9" height="14.0" rx="3" fill="#1f3b57" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="690.8571428571429" y="147" font-size="13" fill="#8a8f94">12.9 %</text><text x="30" y="177" font-size="13.5" fill="#23282d">0.8x in 5 % PEG buffer</text><rect x="220.0" y="165.0" width="420.0" height="14.0" rx="3" fill="#a33a28" fill-opacity="0.85" stroke="none" stroke-width="0"/><text x="648.0" y="177" font-size="13" fill="#8a8f94">11.7 %</text><text x="30" y="214" font-size="13.5" fill="#a33a28">The last row behaves like a 1.4x clean-up: the PEG carried in the sample counts too.</text><text x="30" y="238" font-size="13.5" fill="#23282d">Ligation mixes often contain PEG. Check the datasheet before a size-selective clean-up.</text>
</svg>
