<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 238" width="880" height="238" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="880" height="238" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Three readouts, three kinds of answer.</text><rect x="40" y="40" width="110" height="34" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="95.0" y="61.375" font-size="12.5" text-anchor="middle" fill="#23282d">readout</text><rect x="150" y="40" width="160" height="34" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="230.0" y="61.375" font-size="12.5" text-anchor="middle" fill="#23282d">answers</text><rect x="310" y="40" width="110" height="34" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="365.0" y="61.375" font-size="12.5" text-anchor="middle" fill="#23282d">resolution</text><rect x="420" y="40" width="130" height="34" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="485.0" y="61.375" font-size="12.5" text-anchor="middle" fill="#23282d">input</text><rect x="550" y="40" width="300" height="34" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="700.0" y="61.375" font-size="12.5" text-anchor="middle" fill="#23282d">main weakness</text><rect x="40" y="74" width="110" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="95.0" y="95.375" font-size="12.5" text-anchor="middle" fill="#23282d">conversion</text><rect x="150" y="74" width="160" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="230.0" y="95.375" font-size="12.5" text-anchor="middle" fill="#23282d">which base, how often</text><rect x="310" y="74" width="110" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="365.0" y="95.375" font-size="12.5" text-anchor="middle" fill="#23282d">one base</text><rect x="420" y="74" width="130" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="485.0" y="95.375" font-size="12.5" text-anchor="middle" fill="#23282d">ng to pg</text><rect x="550" y="74" width="300" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="700.0" y="95.375" font-size="12.5" text-anchor="middle" fill="#23282d">a read is mostly one chemistry</text><rect x="40" y="108" width="110" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="95.0" y="129.375" font-size="12.5" text-anchor="middle" fill="#23282d">antibody</text><rect x="150" y="108" width="160" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="230.0" y="129.375" font-size="12.5" text-anchor="middle" fill="#23282d">where it is enriched</text><rect x="310" y="108" width="110" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="365.0" y="129.375" font-size="12.5" text-anchor="middle" fill="#23282d">100 to 500 bp</text><rect x="420" y="108" width="130" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="485.0" y="129.375" font-size="12.5" text-anchor="middle" fill="#23282d">ng, more for IP</text><rect x="550" y="108" width="300" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="700.0" y="129.375" font-size="12.5" text-anchor="middle" fill="#23282d">antibody specificity, density bias</text><rect x="40" y="142" width="110" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="95.0" y="163.375" font-size="12.5" text-anchor="middle" fill="#23282d">native</text><rect x="150" y="142" width="160" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="230.0" y="163.375" font-size="12.5" text-anchor="middle" fill="#23282d">which base, per molecule</text><rect x="310" y="142" width="110" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="365.0" y="163.375" font-size="12.5" text-anchor="middle" fill="#23282d">one base</text><rect x="420" y="142" width="130" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="485.0" y="163.375" font-size="12.5" text-anchor="middle" fill="#23282d">ug of DNA</text><rect x="550" y="142" width="300" height="34" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="700.0" y="163.375" font-size="12.5" text-anchor="middle" fill="#23282d">needs trained basecalling</text><text x="40" y="206" font-size="13" fill="#8a8f94">Pick the readout by the question: a map of where, a fraction at a base, or a pattern</text><text x="40" y="224" font-size="13" fill="#8a8f94">along one molecule.</text>
</svg>
