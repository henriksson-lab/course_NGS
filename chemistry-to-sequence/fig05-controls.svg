<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 269" width="900" height="269" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="269" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Spike in two DNAs of known state. They tell you how far to trust every other number.</text><rect x="70" y="60" width="70" height="110" fill="none" stroke="#dfe3e6"/><rect x="70" y="168" width="70" height="2" fill="#a33a28"/><text x="105.0" y="188" font-size="12.5" text-anchor="middle" fill="#23282d">unmethylated spike-in</text><text x="105.0" y="204" font-size="11.5" text-anchor="middle" fill="#8a8f94">e.g. phage lambda DNA</text><text x="105.0" y="54" font-size="12.5" text-anchor="middle" fill="#a33a28">0.6% read as C</text><rect x="250" y="60" width="70" height="110" fill="none" stroke="#dfe3e6"/><rect x="250" y="62.2" width="70" height="107.8" fill="#2e6b3f"/><text x="285.0" y="188" font-size="12.5" text-anchor="middle" fill="#23282d">methylated spike-in</text><text x="285.0" y="204" font-size="11.5" text-anchor="middle" fill="#8a8f94">fully methylated control</text><text x="285.0" y="54" font-size="12.5" text-anchor="middle" fill="#2e6b3f">98% read as C</text><rect x="430" y="60" width="70" height="110" fill="none" stroke="#dfe3e6"/><rect x="430" y="168" width="70" height="2" fill="#8a8f94"/><text x="465.0" y="188" font-size="12.5" text-anchor="middle" fill="#23282d">human non-CpG C</text><text x="465.0" y="204" font-size="11.5" text-anchor="middle" fill="#8a8f94">almost never methylated</text><text x="465.0" y="54" font-size="12.5" text-anchor="middle" fill="#8a8f94">1% read as C</text><text x="560" y="84" font-size="12.5" fill="#23282d">Unmethylated spike-in read as C:</text><text x="560" y="102" font-size="12.5" fill="#a33a28">conversion failed, so false methylation.</text><text x="560" y="126" font-size="12.5" fill="#23282d">Methylated spike-in read as T:</text><text x="560" y="144" font-size="12.5" fill="#a33a28">the chemistry destroyed real signal.</text><text x="560" y="168" font-size="12" fill="#8a8f94">Values shown are an example of a good run.</text><text x="40" y="236" font-size="14" fill="#b4532a">Conversion rate = T / (T + C) at spike-in cytosines: 99.4% here, so about 0.6% false</text><text x="40" y="255" font-size="14" fill="#b4532a">methylation.</text>
</svg>
