<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 252" width="780" height="252" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="252" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">The same trick on RNA: make the modified base behave differently in the copy.</text><text x="40" y="60" font-size="13" fill="#8a8f94">RNA with one m6A</text><text x="190.0" y="60" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="203.5" y="60" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="217.0" y="60" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="230.5" y="60" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="244.0" y="60" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="257.5" y="60" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="271.0" y="60" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="284.5" y="60" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="298.0" y="60" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="311.5" y="60" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="325.0" y="60" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="221.0" y="42" font-size="11.5" text-anchor="middle" fill="#b4532a">m6A</text><text x="40" y="104" font-size="13" fill="#8a8f94">GLORI: nitrite</text><text x="40" y="120" font-size="12" fill="#8a8f94">deaminates A to I</text><text x="190.0" y="108" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="203.5" y="108" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="217.0" y="108" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="230.5" y="108" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="244.0" y="108" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="257.5" y="108" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="271.0" y="108" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="284.5" y="108" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="298.0" y="108" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="311.5" y="108" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="325.0" y="108" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="368.0" y="108" font-size="12.5" fill="#23282d">A read as G: not modified. A still read as A: m6A.</text><text x="40" y="164" font-size="13" fill="#8a8f94">DART-seq: a deaminase</text><text x="40" y="180" font-size="12" fill="#8a8f94">tethered to m6A</text><text x="190.0" y="168" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="203.5" y="168" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="217.0" y="168" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="230.5" y="168" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="244.0" y="168" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="257.5" y="168" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="271.0" y="168" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="284.5" y="168" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="298.0" y="168" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="311.5" y="168" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="325.0" y="168" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="368.0" y="168" font-size="12.5" fill="#23282d">C next to m6A read as T: marks a nearby m6A.</text><text x="40" y="220" font-size="13" fill="#8a8f94">GLORI works on every adenosine and counts the fraction modified. DART-seq edits only</text><text x="40" y="238" font-size="13" fill="#8a8f94">beside a bound m6A reader.</text>
</svg>
