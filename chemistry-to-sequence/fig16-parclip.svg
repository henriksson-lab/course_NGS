 y="162" width="11.5" height="8" fill="#a33a28"/><text x="383.0" y="108" font-size="12.5" fill="#a33a28">T to C at the</text><text x="383.0" y="124" font-size="12.5" fill="#a33a28">crosslinked base in</text><text x="383.0" y="140" font-size="12.5" fill="#a33a28">most reads</text><text x="70" y="206" font-size="13" fill="#23282d">Crosslinked 4sU is read as C. An ordinary T to C mismatch elsewhere is background; a</text><text x="70" y="224" font-size="13" fill="#23282d">pile of them at one base is the site.</text>
