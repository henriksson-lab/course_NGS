<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 233" width="840" height="233" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="840" height="233" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Three ways to write a position into a read.</text><text x="40" y="58" font-size="13.5" fill="#23282d">1. an enzyme stalls</text><line x1="40" y1="100" x2="270" y2="100" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="130" cy="100" r="7" fill="#b4532a"/><line x1="270" y1="118" x2="130" y2="118" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><line x1="130" y1="112" x2="130" y2="124" stroke="#a33a28" stroke-width="3" stroke-linecap="round"/><text x="40" y="146" font-size="12" fill="#8a8f94">extension stops at a lesion,</text><text x="40" y="162" font-size="12" fill="#8a8f94">so the cDNA end marks it</text><text x="310" y="58" font-size="13.5" fill="#23282d">2. an enzyme cuts</text><line x1="310" y1="100" x2="540" y2="100" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="380" y1="86" x2="380" y2="114" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="410" y1="86" x2="410" y2="114" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="440" y1="86" x2="440" y2="114" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><text x="410" y="76" font-size="11.5" text-anchor="middle" fill="#b4532a">cuts only where accessible</text><text x="310" y="146" font-size="12" fill="#8a8f94">each fragment end is a</text><text x="310" y="162" font-size="12" fill="#8a8f94">cut, hence a position</text><text x="580" y="58" font-size="13.5" fill="#23282d">3. a ligase joins</text><line x1="580" y1="100" x2="810" y2="100" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="620" y="90" width="70" height="20" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="655.0" y="104.2" font-size="12" text-anchor="middle" fill="#1f3b57">A</text><rect x="690" y="90" width="70" height="20" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="725.0" y="104.2" font-size="12" text-anchor="middle" fill="#b4532a">B</text><text x="690" y="84" font-size="11.5" text-anchor="middle" fill="#a33a28">junction</text><text x="580" y="146" font-size="12" fill="#8a8f94">the read crosses from A to B,</text><text x="580" y="162" font-size="12" fill="#8a8f94">so A and B were together</text><text x="40" y="200" font-size="14" fill="#b4532a">In each case the base sequence is ordinary. The information is where the read starts</text><text x="40" y="219" font-size="14" fill="#b4532a">or ends.</text>
</svg>
