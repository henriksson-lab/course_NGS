<text x="40" y="26" font-size="14" fill="#23282d">TAPS: convert only the modified bases. A T now marks a modification.</text><text x="40" y="70" font-size="12" fill="#8a8f94">starting base</text><text x="40" y="100" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="40" y="134" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>5mC</text><text x="40" y="168" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>5hmC</text><text x="150" y="58" font-size="12" text-anchor="middle" fill="#8a8f94">start</text><text x="150" y="100" font-size="14" text-anchor="middle" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="150" y="134" font-size="14" text-anchor="middle" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>5mC</text><text x="150" y="168" font-size="14" text-anchor="middle" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>5hmC</text><line x1="194" y1="94" x2="252" y2="94" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><path d="M 256 94 L 252 91.2 L 252 96.8 Z" fill="#8a8f94"/><text x="225.0" y="84" font-size="11.5" text-anchor="middle" fill="#8a8f94">TET</text><text x="300" y="58" font-size="12" text-anchor="middle" fill="#8a8f94">oxidise</text><text x="300" y="100" font-size="14" text-anchor="middle" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="300" y="134" font-size="14" text-anchor="middle" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>5caC</text><text x="300" y="168" font-size="14" text-anchor="middle" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>5caC</text><line x1="344" y1="94" x2="402" y2="94" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><path d="M 406 94 L 402 91.2 L 402 96.8 Z" fill="#8a8f94"/><text x="375.0" y="84" font-size="11.5" text-anchor="middle" fill="#8a8f94">pyridine borane</text><text x="450" y="58" font-size="12" text-anchor="middle" fill="#8a8f94">reduce</text><text x="450" y="100" font-size="14" text-anchor="middle" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="450" y="134" font-size="14" text-anchor="middle" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>DHU</text><text x="450" y="168" font-size="14" text-anchor="middle" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>DHU</text><line x1="494" y1="94" x2="552" y2="94" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><path d="M 556 94 L 552 91.2 L 552 96.8 Z" fill="#8a8f94"/><text x="525.0" y="84" font-size="11.5" text-anchor="middle" fill="#8a8f94">PCR</text><text x="600" y="58" font-size="12" text-anchor="middle" fill="#8a8f94">read after PCR</text><text x="600" y="100" font-size="14" text-anchor="middle" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="600" y="134" font-size="14" text-anchor="middle" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="600" y="168" font-size="14" text-anchor="middle" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="40" y="226" font-size="14" fill="#b4532a">Unmodified C is never touched, so the genome stays four-letter.</text>
