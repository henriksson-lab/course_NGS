<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 237" width="720" height="237" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="237" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Click chemistry turns a small tag into a handle you can pull on.</text><line x1="40" y1="90" x2="250" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="90" cy="90" r="5" fill="#b4532a"/><line x1="90" y1="90" x2="90" y2="66" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><circle cx="160" cy="90" r="5" fill="#b4532a"/><line x1="160" y1="90" x2="160" y2="66" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><circle cx="220" cy="90" r="5" fill="#b4532a"/><line x1="220" y1="90" x2="220" y2="66" stroke="#b4532a" stroke-width="1.5" stroke-linecap="round"/><text x="145" y="56" font-size="12" text-anchor="middle" fill="#b4532a">alkyne-labelled nucleoside</text><text x="145" y="116" font-size="12" text-anchor="middle" fill="#8a8f94">in newly made RNA</text><line x1="260" y1="90" x2="325" y2="90" stroke="#8a8f94" stroke-width="1.5" stroke-linecap="round"/><path d="M 330 90 L 325 86.5 L 325 93.5 Z" fill="#8a8f94"/><rect x="336" y="74" width="110" height="32" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="391.0" y="94.55" font-size="13" text-anchor="middle" fill="#2e6b3f">azide-biotin</text><text x="391" y="126" font-size="11.5" text-anchor="middle" fill="#8a8f94">covalent triazole link</text><line x1="456" y1="90" x2="515" y2="90" stroke="#8a8f94" stroke-width="1.5" stroke-linecap="round"/><path d="M 520 90 L 515 86.5 L 515 93.5 Z" fill="#8a8f94"/><circle cx="580" cy="90" r="34" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><text x="580" y="86" font-size="11.5" text-anchor="middle" fill="#1f3b57">streptavidin</text><text x="580" y="101" font-size="11.5" text-anchor="middle" fill="#1f3b57">bead</text><text x="580" y="148" font-size="12" text-anchor="middle" fill="#8a8f94">keep what was labelled,</text><text x="580" y="164" font-size="12" text-anchor="middle" fill="#8a8f94">wash the rest away</text><text x="40" y="204" font-size="14" fill="#b4532a">This is enrichment by a covalent tag. It survives stringent washes that would strip</text><text x="40" y="223" font-size="14" fill="#b4532a">an antibody.</text>
</svg>
