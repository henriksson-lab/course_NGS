<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 246" width="960" height="246" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="960" height="246" fill="none"/>
<text x="40" y="28" font-size="14" fill="#23282d">A polymerase reads the base it meets. It cannot read a methyl group.</text><text x="40" y="52" font-size="13" fill="#8a8f94">Before conversion</text><rect x="40" y="62" width="110" height="120" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="95" y="108" font-size="26" text-anchor="middle" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="95" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">template</text><line x1="95" y1="116" x2="95" y2="132" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 95 136 L 91 128 L 99 128 Z" fill="#8a8f94"/><text x="95" y="160" font-size="26" text-anchor="middle" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="95" y="176" font-size="11" text-anchor="middle" fill="#8a8f94">polymerase puts</text><text x="95" y="198" font-size="11.5" text-anchor="middle" fill="#8a8f94">unmodified</text><rect x="170" y="62" width="110" height="120" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225" y="108" font-size="26" text-anchor="middle" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>mC</text><text x="225" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">template</text><line x1="225" y1="116" x2="225" y2="132" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 225 136 L 221 128 L 229 128 Z" fill="#8a8f94"/><text x="225" y="160" font-size="26" text-anchor="middle" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="225" y="176" font-size="11" text-anchor="middle" fill="#8a8f94">polymerase puts</text><text x="225" y="198" font-size="11.5" text-anchor="middle" fill="#8a8f94">modified: same copy</text><text x="330" y="118" font-size="13" fill="#a33a28">indistinguishable</text><text x="330" y="136" font-size="13" fill="#a33a28">in the sequence</text><text x="520" y="52" font-size="13" fill="#8a8f94">After conversion</text><rect x="520" y="62" width="110" height="120" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="575" y="108" font-size="26" text-anchor="middle" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="575" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">template</text><line x1="575" y1="116" x2="575" y2="132" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 575 136 L 571 128 L 579 128 Z" fill="#8a8f94"/><text x="575" y="160" font-size="26" text-anchor="middle" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="575" y="176" font-size="11" text-anchor="middle" fill="#8a8f94">polymerase puts</text><text x="575" y="198" font-size="11.5" text-anchor="middle" fill="#8a8f94">C was converted</text><rect x="650" y="62" width="110" height="120" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="705" y="108" font-size="26" text-anchor="middle" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>mC</text><text x="705" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">template</text><line x1="705" y1="116" x2="705" y2="132" stroke="#8a8f94" stroke-width="1.3" stroke-linecap="round"/><path d="M 705 136 L 701 128 L 709 128 Z" fill="#8a8f94"/><text x="705" y="160" font-size="26" text-anchor="middle" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="705" y="176" font-size="11" text-anchor="middle" fill="#8a8f94">polymerase puts</text><text x="705" y="198" font-size="11.5" text-anchor="middle" fill="#8a8f94">protected, still C</text><text x="780" y="118" font-size="13" fill="#2e6b3f">the property is now</text><text x="780" y="136" font-size="13" fill="#2e6b3f">a base difference</text><text x="40" y="226" font-size="14" fill="#b4532a">Conversion chemistry is a way of changing the template so that the copy differs.</text>
</svg>
