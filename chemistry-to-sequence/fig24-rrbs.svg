<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 257" width="740" height="257" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="257" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Cut at a CpG-containing site, keep only small fragments: read where it matters.</text><line x1="40" y1="76" x2="700" y2="76" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="110" y="62" width="70" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><rect x="420" y="62" width="110" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="145" y="54" font-size="11.5" text-anchor="middle" fill="#2e6b3f">CpG island</text><text x="475" y="54" font-size="11.5" text-anchor="middle" fill="#2e6b3f">CpG island</text><line x1="70" y1="66" x2="70" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="100" y1="66" x2="100" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="130" y1="66" x2="130" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="150" y1="66" x2="150" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="170" y1="66" x2="170" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="250" y1="66" x2="250" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="330" y1="66" x2="330" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="440" y1="66" x2="440" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="460" y1="66" x2="460" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="480" y1="66" x2="480" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="500" y1="66" x2="500" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="520" y1="66" x2="520" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="610" y1="66" x2="610" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="650" y1="66" x2="650" y2="86" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><text x="40" y="108" font-size="12" fill="#b4532a">MspI sites (CCGG), dense in CpG islands</text><line x1="40" y1="150" x2="700" y2="150" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="40" y="140" font-size="12" fill="#8a8f94">fragments, 40 to 220 bp kept</text><rect x="72" y="156" width="26" height="9" fill="#a33a28"/><rect x="102" y="156" width="26" height="9" fill="#a33a28"/><rect x="132" y="156" width="16" height="9" fill="#a33a28"/><rect x="152" y="156" width="16" height="9" fill="#a33a28"/><rect x="442" y="156" width="16" height="9" fill="#a33a28"/><rect x="462" y="156" width="16" height="9" fill="#a33a28"/><rect x="482" y="156" width="16" height="9" fill="#a33a28"/><rect x="502" y="156" width="16" height="9" fill="#a33a28"/><rect x="172" y="156" width="76" height="9" fill="#dfe3e6"/><rect x="252" y="156" width="76" height="9" fill="#dfe3e6"/><rect x="332" y="156" width="106" height="9" fill="#dfe3e6"/><rect x="522" y="156" width="86" height="9" fill="#dfe3e6"/><rect x="612" y="156" width="36" height="9" fill="#dfe3e6"/><text x="310" y="190" font-size="12" text-anchor="middle" fill="#8a8f94">long fragments are discarded</text><text x="40" y="224" font-size="14" fill="#b4532a">A small, CpG-rich fraction of the genome, read deeply, for a fraction of the</text><text x="40" y="243" font-size="14" fill="#b4532a">sequencing cost.</text>
</svg>
