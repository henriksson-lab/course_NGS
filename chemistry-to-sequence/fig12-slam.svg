amily='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="281.0" y="196" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="294.5" y="196" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="308.0" y="196" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="321.5" y="196" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="335.0" y="196" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="372.5" y="196" font-size="12.5" fill="#8a8f94">reverse transcriptase pairs G opposite</text><text x="372.5" y="212" font-size="12.5" fill="#8a8f94">the alkylated base, so T reads as C</text><text x="40" y="244" font-size="14" fill="#b4532a">T to C mismatches within a read are the age of that molecule. The label is read, not</text><text x="40" y="263" font-size="14" fill="#b4532a">enriched.</text>
