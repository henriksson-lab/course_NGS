<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 260" width="740" height="260" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="260" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">An enzyme that cuts only where it can reach turns accessibility into read starts.</text><line x1="40" y1="92" x2="700" y2="92" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><ellipse cx="60" cy="92" rx="23" ry="15" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><ellipse cx="120" cy="92" rx="23" ry="15" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><ellipse cx="180" cy="92" rx="23" ry="15" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><ellipse cx="480" cy="92" rx="23" ry="15" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><ellipse cx="540" cy="92" rx="23" ry="15" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><ellipse cx="600" cy="92" rx="23" ry="15" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><ellipse cx="660" cy="92" rx="23" ry="15" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="120" y="130" font-size="12" text-anchor="middle" fill="#8a8f94">nucleosomes protect DNA</text><text x="340" y="130" font-size="12" text-anchor="middle" fill="#b4532a">open region</text><line x1="250" y1="68" x2="250" y2="88" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="290" y1="68" x2="290" y2="88" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="320" y1="68" x2="320" y2="88" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="340" y1="68" x2="340" y2="88" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="370" y1="68" x2="370" y2="88" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><line x1="420" y1="68" x2="420" y2="88" stroke="#b4532a" stroke-width="2" stroke-linecap="round"/><text x="340" y="60" font-size="12" text-anchor="middle" fill="#b4532a">Tn5, DNase I or MNase cut here</text><line x1="40" y1="196" x2="700" y2="196" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><rect x="246" y="174" width="8" height="22" fill="#a33a28"/><rect x="286" y="162" width="8" height="34" fill="#a33a28"/><rect x="316" y="152" width="8" height="44" fill="#a33a28"/><rect x="336" y="144" width="8" height="52" fill="#a33a28"/><rect x="366" y="156" width="8" height="40" fill="#a33a28"/><rect x="416" y="176" width="8" height="20" fill="#a33a28"/><text x="40" y="216" font-size="12" fill="#8a8f94">read-start count per base</text><text x="40" y="242" font-size="14" fill="#b4532a">Cuts inside nucleosomes are rare, so the read track is the accessibility map.</text>
</svg>
