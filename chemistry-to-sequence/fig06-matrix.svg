<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 276" width="640" height="276" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="640" height="276" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">What each kind of cytosine is read as after PCR.</text><rect x="40" y="40" width="120" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="100.0" y="59.55" font-size="13" text-anchor="middle" fill="#23282d">method</text><rect x="160" y="40" width="80" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="200.0" y="59.55" font-size="13" text-anchor="middle" fill="#23282d">C</text><rect x="240" y="40" width="80" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="280.0" y="59.55" font-size="13" text-anchor="middle" fill="#23282d">5mC</text><rect x="320" y="40" width="80" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="360.0" y="59.55" font-size="13" text-anchor="middle" fill="#23282d">5hmC</text><rect x="400" y="40" width="200" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="500.0" y="59.55" font-size="13" text-anchor="middle" fill="#23282d">reads C means</text><rect x="40" y="70" width="120" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="100.0" y="89.55" font-size="13" text-anchor="middle" fill="#23282d">bisulfite</text><rect x="160" y="70" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="200.0" y="89.55" font-size="13" text-anchor="middle" fill="#1f3b57">T</text><rect x="240" y="70" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="280.0" y="89.55" font-size="13" text-anchor="middle" fill="#b4532a">C</text><rect x="320" y="70" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="360.0" y="89.55" font-size="13" text-anchor="middle" fill="#b4532a">C</text><rect x="400" y="70" width="200" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="500.0" y="89.55" font-size="13" text-anchor="middle" fill="#23282d">5mC or 5hmC</text><rect x="40" y="100" width="120" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="100.0" y="119.55" font-size="13" text-anchor="middle" fill="#23282d">oxBS-seq</text><rect x="160" y="100" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="200.0" y="119.55" font-size="13" text-anchor="middle" fill="#1f3b57">T</text><rect x="240" y="100" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="280.0" y="119.55" font-size="13" text-anchor="middle" fill="#b4532a">C</text><rect x="320" y="100" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="360.0" y="119.55" font-size="13" text-anchor="middle" fill="#1f3b57">T</text><rect x="400" y="100" width="200" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="500.0" y="119.55" font-size="13" text-anchor="middle" fill="#23282d">5mC only</text><rect x="40" y="130" width="120" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="100.0" y="149.55" font-size="13" text-anchor="middle" fill="#23282d">TAB-seq</text><rect x="160" y="130" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="200.0" y="149.55" font-size="13" text-anchor="middle" fill="#1f3b57">T</text><rect x="240" y="130" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="280.0" y="149.55" font-size="13" text-anchor="middle" fill="#1f3b57">T</text><rect x="320" y="130" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="360.0" y="149.55" font-size="13" text-anchor="middle" fill="#b4532a">C</text><rect x="400" y="130" width="200" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="500.0" y="149.55" font-size="13" text-anchor="middle" fill="#23282d">5hmC only</text><rect x="40" y="160" width="120" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="100.0" y="179.55" font-size="13" text-anchor="middle" fill="#23282d">EM-seq</text><rect x="160" y="160" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="200.0" y="179.55" font-size="13" text-anchor="middle" fill="#1f3b57">T</text><rect x="240" y="160" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="280.0" y="179.55" font-size="13" text-anchor="middle" fill="#b4532a">C</text><rect x="320" y="160" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="360.0" y="179.55" font-size="13" text-anchor="middle" fill="#b4532a">C</text><rect x="400" y="160" width="200" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="500.0" y="179.55" font-size="13" text-anchor="middle" fill="#23282d">5mC or 5hmC</text><rect x="40" y="190" width="120" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="100.0" y="209.55" font-size="13" text-anchor="middle" fill="#23282d">TAPS</text><rect x="160" y="190" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="200.0" y="209.55" font-size="13" text-anchor="middle" fill="#b4532a">C</text><rect x="240" y="190" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="280.0" y="209.55" font-size="13" text-anchor="middle" fill="#1f3b57">T</text><rect x="320" y="190" width="80" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="360.0" y="209.55" font-size="13" text-anchor="middle" fill="#1f3b57">T</text><rect x="400" y="190" width="200" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="500.0" y="209.55" font-size="13" text-anchor="middle" fill="#23282d">unmodified C</text><text x="40" y="244" font-size="13" fill="#8a8f94">5mC = 5-methylcytosine, 5hmC = 5-hydroxymethylcytosine. TAPS inverts the logic: a T</text><text x="40" y="262" font-size="13" fill="#8a8f94">marks a modification.</text>
</svg>
