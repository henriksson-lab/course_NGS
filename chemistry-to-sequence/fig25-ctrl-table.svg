<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="310" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Every readout has a control that measures its false positives.</text><rect x="40" y="40" width="140" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="110.0" y="59.375" font-size="12.5" text-anchor="middle" fill="#23282d">readout</text><rect x="180" y="40" width="280" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="320.0" y="59.375" font-size="12.5" text-anchor="middle" fill="#23282d">control</text><rect x="460" y="40" width="340" height="30" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="630.0" y="59.375" font-size="12.5" text-anchor="middle" fill="#23282d">what it tells you</text><rect x="40" y="70" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="110.0" y="89.375" font-size="12.5" text-anchor="middle" fill="#23282d">conversion</text><rect x="180" y="70" width="280" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="320.0" y="89.375" font-size="12.5" text-anchor="middle" fill="#23282d">unmethylated and methylated spike-ins</text><rect x="460" y="70" width="340" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="630.0" y="89.375" font-size="12.5" text-anchor="middle" fill="#23282d">conversion rate, over-conversion</text><rect x="40" y="100" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="110.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#23282d">metabolic label</text><rect x="180" y="100" width="280" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="320.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#23282d">same cells, no label</text><rect x="460" y="100" width="340" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="630.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#23282d">background T to C from errors and SNPs</text><rect x="40" y="130" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="110.0" y="149.375" font-size="12.5" text-anchor="middle" fill="#23282d">crosslinking</text><rect x="180" y="130" width="280" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="320.0" y="149.375" font-size="12.5" text-anchor="middle" fill="#23282d">size-matched input, no-UV sample</text><rect x="460" y="130" width="340" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="630.0" y="149.375" font-size="12.5" text-anchor="middle" fill="#23282d">what sticks without the protein</text><rect x="40" y="160" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="110.0" y="179.375" font-size="12.5" text-anchor="middle" fill="#23282d">antibody</text><rect x="180" y="160" width="280" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="320.0" y="179.375" font-size="12.5" text-anchor="middle" fill="#23282d">input and non-specific IgG</text><rect x="460" y="160" width="340" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="630.0" y="179.375" font-size="12.5" text-anchor="middle" fill="#23282d">fragment bias, sticky background</text><rect x="40" y="190" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="110.0" y="209.375" font-size="12.5" text-anchor="middle" fill="#23282d">probing</text><rect x="180" y="190" width="280" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="320.0" y="209.375" font-size="12.5" text-anchor="middle" fill="#23282d">no reagent, DMSO only</text><rect x="460" y="190" width="340" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="630.0" y="209.375" font-size="12.5" text-anchor="middle" fill="#23282d">reverse transcriptase error rate</text><rect x="40" y="220" width="140" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="110.0" y="239.375" font-size="12.5" text-anchor="middle" fill="#23282d">native</text><rect x="180" y="220" width="280" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="320.0" y="239.375" font-size="12.5" text-anchor="middle" fill="#23282d">amplified unmodified DNA</text><rect x="460" y="220" width="340" height="30" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="630.0" y="239.375" font-size="12.5" text-anchor="middle" fill="#23282d">the signal with no modification</text><text x="40" y="278" font-size="13" fill="#8a8f94">Run the control in the same tube series. A control run on another day measures the</text><text x="40" y="296" font-size="13" fill="#8a8f94">day, not the method.</text>
</svg>
