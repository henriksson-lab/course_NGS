<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 227" width="720" height="227" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="227" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Proximity ligation turns contact into a chimeric read.</text><ellipse cx="140" cy="120" rx="88" ry="15" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><path d="M 60 120 C 60 50, 220 50, 220 120" fill="none" stroke="#1f3b57" stroke-width="3"/><line x1="20" y1="120" x2="60" y2="120" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="220" y1="120" x2="330" y2="120" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><circle cx="60" cy="120" r="7" fill="#b4532a"/><circle cx="220" cy="120" r="7" fill="#a33a28"/><text x="60" y="148" font-size="12" text-anchor="middle" fill="#b4532a">locus A</text><text x="220" y="148" font-size="12" text-anchor="middle" fill="#a33a28">locus B</text><text x="140" y="96" font-size="11.5" text-anchor="middle" fill="#8a8f94">held by protein</text><line x1="340" y1="90" x2="395" y2="90" stroke="#8a8f94" stroke-width="1.5" stroke-linecap="round"/><path d="M 400 90 L 395 86.5 L 395 93.5 Z" fill="#8a8f94"/><text x="370" y="80" font-size="11.5" text-anchor="middle" fill="#8a8f94">cut, ligate</text><rect x="420" y="76" width="70" height="22" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="455.0" y="91.55" font-size="13" text-anchor="middle" fill="#b4532a">A</text><rect x="490" y="76" width="70" height="22" rx="4" fill="#f3e3df" stroke="#a33a28" stroke-width="1.2"/><text x="525.0" y="91.55" font-size="13" text-anchor="middle" fill="#a33a28">B</text><text x="490" y="70" font-size="11.5" text-anchor="middle" fill="#8a8f94">junction</text><text x="420" y="126" font-size="12" fill="#23282d">one read, two alignments:</text><text x="420" y="144" font-size="12" fill="#8a8f94">chr1 at A, and chr1 800 kb away at B</text><text x="40" y="194" font-size="14" fill="#b4532a">The ligase writes the contact into a single molecule. No property is measured; the</text><text x="40" y="213" font-size="14" fill="#b4532a">join is the measurement.</text>
</svg>
