<text x="40" y="26" font-size="14" fill="#23282d">Crosslinked protein stops reverse transcriptase one base short of the contact.</text><line x1="60" y1="94" x2="560" y2="94" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="48" y="98" font-size="12" text-anchor="end" fill="#8a8f94">5'</text><text x="570" y="98" font-size="12" fill="#8a8f94">3'</text><circle cx="300" cy="64" r="20" fill="#f5eae6" stroke="#b4532a" stroke-width="1.4"/><text x="300" y="68" font-size="12" text-anchor="middle" fill="#b4532a">RBP</text><line x1="300" y1="84" x2="300" y2="94" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 2"/><text x="328" y="82" font-size="11.5" fill="#b4532a">UV crosslink</text><line x1="298" y1="116" x2="540" y2="116" stroke="#4a6b8a" stroke-width="2.2" stroke-linecap="round"/><line x1="298" y1="112" x2="298" y2="120" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="298" y1="127" x2="540" y2="127" stroke="#4a6b8a" stroke-width="2.2" stroke-linecap="round"/><line x1="298" y1="123" x2="298" y2="131" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="298" y1="138" x2="540" y2="138" stroke="#4a6b8a" stroke-width="2.2" stroke-linecap="round"/><line x1="298" y1="134" x2="298" y2="142" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="298" y1="149" x2="540" y2="149" stroke="#4a6b8a" stroke-width="2.2" stroke-linecap="round"/><line x1="298" y1="145" x2="298" y2="153" stroke="#a33a28" stroke-width="2.6" stroke-linecap="round"/><line x1="120" y1="160" x2="540" y2="160" stroke="#4a6b8a" stroke-width="2.2" stroke-linecap="round"/><text x="570" y="134" font-size="12" fill="#8a8f94">cDNA</text><text x="570" y="164" font-size="11.5" fill="#8a8f94">read-through</text><line x1="60" y1="212" x2="560" y2="212" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><rect x="293" y="170" width="9" height="42" fill="#a33a28"/><rect x="110" y="207" width="180" height="5" fill="#8a8f94"/><text x="312" y="204" font-size="12" fill="#a33a28">read starts pile up</text><text x="60" y="234" font-size="13" fill="#23282d">Read 5' ends, one count per molecule. The peak is the binding site at</text><text x="60" y="252" font-size="13" fill="#23282d">single-nucleotide resolution.</text>
