<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 252" width="760" height="252" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="252" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">In a pore, a modified base shifts the current for every k-mer it sits in.</text><text x="60" y="52" font-size="13" fill="#23282d">unmodified</text><line x1="60" y1="160" x2="360" y2="160" stroke="#dfe3e6" stroke-width="1" stroke-linecap="round"/><line x1="60" y1="100" x2="96" y2="100" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="96" y1="100" x2="96" y2="80" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="96" y1="80" x2="132" y2="80" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="132" y1="80" x2="132" y2="110" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="132" y1="110" x2="168" y2="110" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="168" y1="110" x2="168" y2="88" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="168" y1="88" x2="204" y2="88" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="204" y1="88" x2="204" y2="120" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="204" y1="120" x2="240" y2="120" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="240" y1="120" x2="240" y2="94" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="240" y1="94" x2="276" y2="94" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="276" y1="94" x2="276" y2="106" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="276" y1="106" x2="312" y2="106" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="312" y1="106" x2="312" y2="82" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="312" y1="82" x2="348" y2="82" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="420" y="52" font-size="13" fill="#23282d">5mC present</text><line x1="420" y1="160" x2="720" y2="160" stroke="#dfe3e6" stroke-width="1" stroke-linecap="round"/><line x1="420" y1="100" x2="456" y2="100" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="456" y1="100" x2="456" y2="80" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="456" y1="80" x2="492" y2="80" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="492" y1="80" x2="492" y2="110" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="492" y1="110" x2="528" y2="110" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="528" y1="110" x2="528" y2="72" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="528" y1="72" x2="564" y2="72" stroke="#a33a28" stroke-width="3" stroke-linecap="round"/><line x1="564" y1="72" x2="564" y2="104" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="564" y1="104" x2="600" y2="104" stroke="#a33a28" stroke-width="3" stroke-linecap="round"/><line x1="600" y1="104" x2="600" y2="78" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="600" y1="78" x2="636" y2="78" stroke="#a33a28" stroke-width="3" stroke-linecap="round"/><line x1="636" y1="78" x2="636" y2="106" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="636" y1="106" x2="672" y2="106" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="672" y1="106" x2="672" y2="82" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="672" y1="82" x2="708" y2="82" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="60" y="182" font-size="11.5" fill="#8a8f94">time, one level per k-mer in the pore</text><text x="60" y="220" font-size="13" fill="#23282d">A model trained on known modified DNA reads the shift as 5mC or C. The read is the</text><text x="60" y="238" font-size="13" fill="#23282d">molecule itself, no copy.</text>
</svg>
