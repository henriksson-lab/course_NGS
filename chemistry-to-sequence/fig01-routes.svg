<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 265" width="780" height="265" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="265" fill="none"/>
<text x="40" y="28" font-size="14" fill="#23282d">The sequencer reads bases and read ends. A property must become one of them.</text><text x="40" y="76" font-size="13" fill="#8a8f94">methylated C, newly made RNA</text><line x1="300" y1="70" x2="335" y2="70" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 340 70 L 335 66.5 L 335 73.5 Z" fill="#8a8f94"/><text x="640" y="76" font-size="15" text-anchor="middle" fill="#b4532a" font-weight="bold">a base change</text><text x="40" y="134" font-size="13" fill="#8a8f94">protein footprint, cut site, stalled enzyme</text><line x1="300" y1="128" x2="335" y2="128" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 340 128 L 335 124.5 L 335 131.5 Z" fill="#8a8f94"/><text x="640" y="134" font-size="15" text-anchor="middle" fill="#b4532a" font-weight="bold">an end</text><text x="40" y="192" font-size="13" fill="#8a8f94">two loci in contact, a barcode on a cell</text><line x1="300" y1="186" x2="335" y2="186" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 340 186 L 335 182.5 L 335 189.5 Z" fill="#8a8f94"/><text x="640" y="192" font-size="15" text-anchor="middle" fill="#b4532a" font-weight="bold">a ligation junction</text><text x="352.0" y="76" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="365.5" y="76" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>C</text><text x="379.0" y="76" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="392.5" y="76" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><line x1="410" y1="70" x2="431" y2="70" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 436 70 L 431 66.5 L 431 73.5 Z" fill="#8a8f94"/><text x="442.0" y="76" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A</text><text x="455.5" y="76" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><text x="469.0" y="76" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>G</text><text x="482.5" y="76" font-size="13" fill="#23282d" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>T</text><line x1="352" y1="134" x2="440" y2="134" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="440" y1="124" x2="440" y2="144" stroke="#a33a28" stroke-width="3" stroke-linecap="round"/><text x="448" y="138" font-size="11.5" fill="#8a8f94">read starts here</text><rect x="352" y="174" width="44" height="18" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="374.0" y="186.85" font-size="11" text-anchor="middle" fill="#1f3b57">locus A</text><rect x="396" y="174" width="44" height="18" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="418.0" y="186.85" font-size="11" text-anchor="middle" fill="#b4532a">locus B</text><text x="40" y="232" font-size="14" fill="#23282d">Illumina copies and reads. Anything the copy does not carry across is lost unless</text><text x="40" y="251" font-size="14" fill="#23282d">chemistry first writes it into the sequence.</text>
</svg>
