<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 803 248" width="803" height="248" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="466" height="248" fill="none"/>
<text x="20" y="24" font-size="14" fill="#23282d">No sequencer: the identity is a code read out over rounds of hybridisation.</text><text x="110" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">1</text><text x="152" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">2</text><text x="194" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">3</text><text x="236" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">4</text><text x="278" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">5</text><text x="320" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">6</text><text x="362" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">7</text><text x="404" y="50" font-size="11" text-anchor="middle" fill="#8a8f94">8</text><text x="40" y="50" font-size="11" fill="#8a8f94">round</text><text x="40" y="69" font-size="12" fill="#23282d">gene A</text><circle cx="110" cy="64" r="9" fill="#b4532a"/><circle cx="152" cy="64" r="9" fill="#b4532a"/><circle cx="194" cy="64" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="236" cy="64" r="9" fill="#b4532a"/><circle cx="278" cy="64" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="320" cy="64" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="362" cy="64" r="9" fill="#b4532a"/><circle cx="404" cy="64" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="40" y="103" font-size="12" fill="#23282d">gene B</text><circle cx="110" cy="98" r="9" fill="#b4532a"/><circle cx="152" cy="98" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="194" cy="98" r="9" fill="#b4532a"/><circle cx="236" cy="98" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="278" cy="98" r="9" fill="#b4532a"/><circle cx="320" cy="98" r="9" fill="#b4532a"/><circle cx="362" cy="98" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="404" cy="98" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="40" y="137" font-size="12" fill="#23282d">gene C</text><circle cx="110" cy="132" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="152" cy="132" r="9" fill="#b4532a"/><circle cx="194" cy="132" r="9" fill="#b4532a"/><circle cx="236" cy="132" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="278" cy="132" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><circle cx="320" cy="132" r="9" fill="#b4532a"/><circle cx="362" cy="132" r="9" fill="#b4532a"/><circle cx="404" cy="132" r="9" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="20" y="192" font-size="12.5" fill="#23282d">Filled: the gene lights up in that round. Each gene gets its own on/off pattern, and the patterns are chosen</text><text x="20" y="210" font-size="12.5" fill="#23282d">far apart, so one missed or spurious round still points at one gene — the edit-distance idea, in colours rather than bases.</text><text x="20" y="234" font-size="12.5" fill="#8a8f94">Nothing is amplified, nothing is sequenced, and the panel is fixed before the experiment starts.</text>
</svg>
