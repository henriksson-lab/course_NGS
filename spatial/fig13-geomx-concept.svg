.5" fill="#8a8f94">one aspirate per region,</text><text x="380" y="193" font-size="12.5" fill="#8a8f94">Seq Code primers per well</text><text x="30" y="240" font-size="14" fill="#b4532a">Resolution is the region you draw, not a grid.</text>
