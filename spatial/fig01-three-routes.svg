<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" width="760" height="288" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="288" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Three ways to put position into a sequence.</text><g transform="translate(0,26)"><rect x="30" y="30" width="200" height="34" rx="6" fill="#f3ecd9" stroke="#8a8f94"/><circle cx="45.0" cy="106" r="7" fill="#1f3b57"/><line x1="45.0" y1="68" x2="45.0" y2="94" stroke="#8a8f94" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="69.3" cy="106" r="7" fill="#b4532a"/><line x1="69.3" y1="68" x2="69.3" y2="94" stroke="#8a8f94" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="93.6" cy="106" r="7" fill="#2e6b3f"/><line x1="93.6" y1="68" x2="93.6" y2="94" stroke="#8a8f94" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="117.9" cy="106" r="7" fill="#4a6b8a"/><line x1="117.9" y1="68" x2="117.9" y2="94" stroke="#8a8f94" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="142.2" cy="106" r="7" fill="#a33a28"/><line x1="142.2" y1="68" x2="142.2" y2="94" stroke="#8a8f94" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="166.5" cy="106" r="7" fill="#7a5c99"/><line x1="166.5" y1="68" x2="166.5" y2="94" stroke="#8a8f94" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="190.8" cy="106" r="7" fill="#b08a1e"/><line x1="190.8" y1="68" x2="190.8" y2="94" stroke="#8a8f94" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/><circle cx="215.1" cy="106" r="7" fill="#2c7d83"/><line x1="215.1" y1="68" x2="215.1" y2="94" stroke="#8a8f94" stroke-width="1.1" stroke-linecap="round" stroke-dasharray="3 3"/><text x="30" y="140" font-size="14" fill="#b4532a">1  Capture on an array</text><text x="30" y="160" font-size="12.5" fill="#8a8f94">RNA leaves the section and is</text><text x="30" y="177" font-size="12.5" fill="#8a8f94">caught by oligos whose barcode</text><text x="30" y="194" font-size="12.5" fill="#8a8f94">is the coordinate</text><rect x="280" y="30" width="200" height="90" rx="6" fill="#f3ecd9" stroke="#8a8f94"/><line x1="280" y1="40" x2="480" y2="40" stroke="#1f3b57" stroke-width="5" stroke-linecap="butt" opacity="0.45"/><line x1="300" y1="30" x2="300" y2="120" stroke="#b4532a" stroke-width="5" stroke-linecap="butt" opacity="0.45"/><line x1="280" y1="58" x2="480" y2="58" stroke="#1f3b57" stroke-width="5" stroke-linecap="butt" opacity="0.45"/><line x1="340" y1="30" x2="340" y2="120" stroke="#b4532a" stroke-width="5" stroke-linecap="butt" opacity="0.45"/><line x1="280" y1="76" x2="480" y2="76" stroke="#1f3b57" stroke-width="5" stroke-linecap="butt" opacity="0.45"/><line x1="380" y1="30" x2="380" y2="120" stroke="#b4532a" stroke-width="5" stroke-linecap="butt" opacity="0.45"/><line x1="280" y1="94" x2="480" y2="94" stroke="#1f3b57" stroke-width="5" stroke-linecap="butt" opacity="0.45"/><line x1="420" y1="30" x2="420" y2="120" stroke="#b4532a" stroke-width="5" stroke-linecap="butt" opacity="0.45"/><line x1="280" y1="112" x2="480" y2="112" stroke="#1f3b57" stroke-width="5" stroke-linecap="butt" opacity="0.45"/><line x1="460" y1="30" x2="460" y2="120" stroke="#b4532a" stroke-width="5" stroke-linecap="butt" opacity="0.45"/><text x="280" y="140" font-size="14" fill="#b4532a">2  Barcode inside the tissue</text><text x="280" y="160" font-size="12.5" fill="#8a8f94">Two perpendicular flows tag</text><text x="280" y="177" font-size="12.5" fill="#8a8f94">each pixel with a row and a</text><text x="280" y="194" font-size="12.5" fill="#8a8f94">column barcode</text><rect x="530" y="30" width="200" height="90" rx="6" fill="#f3ecd9" stroke="#8a8f94"/><circle cx="580" cy="60" r="17" fill="none" stroke="#8a8f94"/><circle cx="640" cy="85" r="17" fill="none" stroke="#8a8f94"/><circle cx="690" cy="55" r="17" fill="none" stroke="#8a8f94"/><circle cx="605" cy="100" r="17" fill="none" stroke="#8a8f94"/><circle cx="670" cy="100" r="17" fill="none" stroke="#8a8f94"/><circle cx="575" cy="55" r="3.4" fill="#b4532a"/><circle cx="588" cy="66" r="3.4" fill="#2e6b3f"/><circle cx="635" cy="82" r="3.4" fill="#4a6b8a"/><circle cx="648" cy="92" r="3.4" fill="#a33a28"/><circle cx="685" cy="50" r="3.4" fill="#b4532a"/><circle cx="696" cy="60" r="3.4" fill="#2e6b3f"/><circle cx="600" cy="98" r="3.4" fill="#4a6b8a"/><circle cx="670" cy="98" r="3.4" fill="#a33a28"/><text x="530" y="140" font-size="14" fill="#b4532a">3  Read it where it sits</text><text x="530" y="160" font-size="12.5" fill="#8a8f94">Copy the RNA in the cell, amplify</text><text x="530" y="177" font-size="12.5" fill="#8a8f94">it in place, and sequence it</text><text x="530" y="194" font-size="12.5" fill="#8a8f94">under a microscope</text><text x="30" y="236" font-size="14" fill="#23282d">Routes 1 and 2 turn position into sequence before the library is made; route 3 skips the library.</text></g>
</svg>
