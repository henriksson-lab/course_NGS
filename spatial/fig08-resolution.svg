<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="260" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Spot or pixel size on a log scale (micrometres)</text><line x1="60" y1="150" x2="680" y2="150" stroke="#23282d" stroke-width="1.4" stroke-linecap="round"/><line x1="60.0" y1="146" x2="60.0" y2="154" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="60.0" y="170" font-size="12.5" text-anchor="middle" fill="#8a8f94">0.1</text><line x1="215.0" y1="146" x2="215.0" y2="154" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="215.0" y="170" font-size="12.5" text-anchor="middle" fill="#8a8f94">1</text><line x1="370.0" y1="146" x2="370.0" y2="154" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="370.0" y="170" font-size="12.5" text-anchor="middle" fill="#8a8f94">10</text><line x1="525.0" y1="146" x2="525.0" y2="154" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="525.0" y="170" font-size="12.5" text-anchor="middle" fill="#8a8f94">100</text><line x1="680.0" y1="146" x2="680.0" y2="154" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="680.0" y="170" font-size="12.5" text-anchor="middle" fill="#8a8f94">1000</text><rect x="355" y="58" width="38" height="92" fill="#f3ecd9" opacity="0.8"/><text x="370.0" y="52" font-size="12" text-anchor="middle" fill="#8a8f94">a cell, ~10</text><circle cx="168.3403506720829" cy="150" r="5" fill="#b4532a"/><line x1="168.3403506720829" y1="145" x2="168.3403506720829" y2="131" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="168.3403506720829" y="128" font-size="12.5" text-anchor="middle" fill="#23282d">Stereo-seq</text><circle cx="261.6596493279171" cy="150" r="5" fill="#b4532a"/><line x1="261.6596493279171" y1="145" x2="261.6596493279171" y2="105" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="261.6596493279171" y="102" font-size="12.5" text-anchor="middle" fill="#23282d">HDST</text><circle cx="370.0" cy="150" r="5" fill="#b4532a"/><line x1="370.0" y1="145" x2="370.0" y2="131" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="370.0" y="128" font-size="12.5" text-anchor="middle" fill="#23282d">Slide-seq</text><circle cx="416.6596493279171" cy="150" r="5" fill="#b4532a"/><line x1="416.6596493279171" y1="145" x2="416.6596493279171" y2="105" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="416.6596493279171" y="102" font-size="12.5" text-anchor="middle" fill="#23282d">DBiT-seq</text><circle cx="484.7562168716078" cy="150" r="5" fill="#b4532a"/><line x1="484.7562168716078" y1="145" x2="484.7562168716078" y2="131" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="484.7562168716078" y="128" font-size="12.5" text-anchor="middle" fill="#23282d">Visium</text><circle cx="598.9537944815477" cy="150" r="5" fill="#b4532a"/><line x1="598.9537944815477" y1="145" x2="598.9537944815477" y2="105" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="598.9537944815477" y="102" font-size="12.5" text-anchor="middle" fill="#23282d">GeoMx region</text><text x="30" y="200" font-size="12.5" fill="#8a8f94">Stereo-seq pitch 0.5; HDST bead 2; Slide-seq bead 10; DBiT 10 to 50;</text><text x="30" y="216" font-size="12.5" fill="#8a8f94">Visium spot 55 (100 centre to centre); GeoMx: the area you draw.</text><text x="30" y="242" font-size="14" fill="#b4532a">Smaller spots do not mean more RNA: each one catches proportionally less.</text>
</svg>
