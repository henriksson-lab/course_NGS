<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" width="740" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="270" fill="none"/>
<text x="30" y="28" font-size="15" fill="#b4532a" font-weight="bold">too short</text><rect x="30" y="40" width="200" height="16" rx="4" fill="#f3ecd9" stroke="#8a8f94"/><circle cx="130" cy="48" r="4" fill="#23282d"/><line x1="130" y1="62" x2="130" y2="74" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="40" y="161" width="30" height="9" fill="#4a6b8a" opacity="0.85"/><rect x="78" y="161" width="30" height="9" fill="#4a6b8a" opacity="0.85"/><rect x="116" y="143" width="30" height="27" fill="#b4532a" opacity="0.85"/><rect x="154" y="161" width="30" height="9" fill="#4a6b8a" opacity="0.85"/><rect x="192" y="161" width="30" height="9" fill="#4a6b8a" opacity="0.85"/><line x1="30" y1="170" x2="230" y2="170" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="130" y="188" font-size="11.5" text-anchor="middle" fill="#8a8f94">five adjacent spots</text><text x="30" y="210" font-size="12.5" fill="#23282d">RNA stays in the cells.</text><text x="30" y="227" font-size="12.5" fill="#8a8f94">Weak, biased to easy transcripts.</text><text x="270" y="28" font-size="15" fill="#b4532a" font-weight="bold">right</text><rect x="270" y="40" width="200" height="16" rx="4" fill="#f3ecd9" stroke="#8a8f94"/><circle cx="370" cy="48" r="4" fill="#23282d"/><line x1="370" y1="62" x2="370" y2="74" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="280" y="166.4" width="30" height="3.6" fill="#4a6b8a" opacity="0.85"/><rect x="318" y="161" width="30" height="9" fill="#4a6b8a" opacity="0.85"/><rect x="356" y="89" width="30" height="81" fill="#b4532a" opacity="0.85"/><rect x="394" y="161" width="30" height="9" fill="#4a6b8a" opacity="0.85"/><rect x="432" y="166.4" width="30" height="3.6" fill="#4a6b8a" opacity="0.85"/><line x1="270" y1="170" x2="470" y2="170" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="370" y="188" font-size="11.5" text-anchor="middle" fill="#8a8f94">five adjacent spots</text><text x="270" y="210" font-size="12.5" fill="#23282d">RNA drops straight down.</text><text x="270" y="227" font-size="12.5" fill="#8a8f94">Signal sits under its cell.</text><text x="510" y="28" font-size="15" fill="#b4532a" font-weight="bold">too long</text><rect x="510" y="40" width="200" height="16" rx="4" fill="#f3ecd9" stroke="#8a8f94"/><circle cx="610" cy="48" r="4" fill="#23282d"/><line x1="610" y1="62" x2="610" y2="74" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><rect x="520" y="134" width="30" height="36" fill="#4a6b8a" opacity="0.85"/><rect x="558" y="125" width="30" height="45" fill="#4a6b8a" opacity="0.85"/><rect x="596" y="116" width="30" height="54" fill="#b4532a" opacity="0.85"/><rect x="634" y="125" width="30" height="45" fill="#4a6b8a" opacity="0.85"/><rect x="672" y="134" width="30" height="36" fill="#4a6b8a" opacity="0.85"/><line x1="510" y1="170" x2="710" y2="170" stroke="#23282d" stroke-width="1.2" stroke-linecap="round"/><text x="610" y="188" font-size="11.5" text-anchor="middle" fill="#8a8f94">five adjacent spots</text><text x="510" y="210" font-size="12.5" fill="#23282d">RNA spreads sideways.</text><text x="510" y="227" font-size="12.5" fill="#8a8f94">Signal smeared over neighbours.</text><text x="30" y="252" font-size="14" fill="#23282d">Bar height = reads for one gene in each spot.</text>
</svg>
