<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 765 240" width="765" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="240" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">STARmap: two probes read adjacent RNA bases; only a correct pair closes a circle</text><line x1="40" y1="56" x2="600" y2="56" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><text x="34" y="48" font-size="12" fill="#8a8f94">5'</text><text x="606" y="60" font-size="12" fill="#8a8f94">3'</text><text x="630" y="60" font-size="12.5" fill="#4a6b8a">mRNA</text><line x1="110" y1="78" x2="290" y2="78" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><text x="200" y="100" font-size="12.5" text-anchor="middle" fill="#1f3b57">primer probe</text><line x1="296" y1="78" x2="420" y2="78" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><line x1="130" y1="60" x2="130" y2="74" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="170" y1="60" x2="170" y2="74" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="210" y1="60" x2="210" y2="74" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="250" y1="60" x2="250" y2="74" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="310" y1="60" x2="310" y2="74" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="350" y1="60" x2="350" y2="74" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="390" y1="60" x2="390" y2="74" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><path d="M 296 80 C 280 190, 440 190, 420 80" fill="none" stroke="#b4532a" stroke-width="3"/><text x="358" y="128" font-size="12.5" text-anchor="middle" fill="#b4532a">padlock probe</text><text x="358" y="144" font-size="12.5" text-anchor="middle" fill="#b4532a">gene code</text><line x1="262" y1="90" x2="330" y2="90" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="446" y="96" font-size="12.5" fill="#1f3b57">12-nt tail of the primer pairs</text><text x="446" y="113" font-size="12.5" fill="#1f3b57">with both padlock ends</text><text x="446" y="136" font-size="12.5" fill="#8a8f94">T4 ligase then closes the circle:</text><text x="446" y="153" font-size="12.5" fill="#8a8f94">no match at the junction, no circle</text><text x="30" y="222" font-size="14" fill="#b4532a">Phi29 copies the circle from the primer, the amplicon is cast in a gel, and the code is read in rounds.</text>
</svg>
