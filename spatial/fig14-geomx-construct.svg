<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 755 250" width="755" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="250" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">The released tag is already a short barcode; PCR only adds the sequencer handles</text><text x="30" y="66" font-size="12.5" fill="#8a8f94">released tag</text><rect x="150" y="50" width="68.0" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="184.0" y="68.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">SPR1 20</text><rect x="218.0" y="50" width="88.39999999999999" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="262.2" y="68.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">UMI+ID 26</text><rect x="306.4" y="50" width="68.0" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="340.4" y="68.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">SPR2 20</text><text x="30" y="142" font-size="12.5" fill="#8a8f94">after PCR</text><rect x="110" y="126" width="98.6" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="159.3" y="144.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 29</text><rect x="208.6" y="126" width="27.2" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="222.2" y="168" font-size="11" text-anchor="middle" fill="#2e6b3f">i5 8</text><rect x="235.79999999999998" y="126" width="112.2" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="291.9" y="144.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">SPR1 33</text><rect x="348.0" y="126" width="47.6" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="371.8" y="144.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">UMI 14</text><rect x="395.6" y="126" width="40.8" height="28" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="416.0" y="144.025" font-size="11.5" text-anchor="middle" fill="#b4532a">ID 12</text><rect x="436.40000000000003" y="126" width="115.6" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="494.20000000000005" y="144.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">SPR2 34</text><rect x="552.0" y="126" width="27.2" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="565.6" y="168" font-size="11" text-anchor="middle" fill="#2e6b3f">i7 8</text><rect x="579.2" y="126" width="81.6" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="620.0" y="144.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P7 24</text><text x="110" y="200" font-size="12.5" fill="#8a8f94">162 bp in all. The 12-nt RTS ID names the target gene or antibody; the well's index names the region.</text><text x="30" y="232" font-size="14" fill="#b4532a">Short paired-end reads are enough, because what is read is an identifier, not a transcript.</text>
</svg>
