<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 236" width="740" height="236" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="236" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Stereo-seq: build the array first, decode it, then add the part that catches RNA</text><rect x="30" y="50" width="150" height="34" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="105.0" y="71.55" font-size="13" text-anchor="middle" fill="#23282d">1  CID circle</text><text x="30" y="108" font-size="12.5" fill="#8a8f94">rolling-circle amplify</text><text x="30" y="125" font-size="12.5" fill="#8a8f94">into a nanoball (DNB)</text><line x1="182" y1="67" x2="201" y2="67" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 206 67 L 201 63.5 L 201 70.5 Z" fill="#8a8f94"/><rect x="210" y="50" width="150" height="34" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="285.0" y="71.55" font-size="13" text-anchor="middle" fill="#23282d">2  decode</text><text x="210" y="108" font-size="12.5" fill="#8a8f94">sequence the CID of</text><text x="210" y="125" font-size="12.5" fill="#8a8f94">every DNB: map = position</text><line x1="362" y1="67" x2="381" y2="67" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 386 67 L 381 63.5 L 381 70.5 Z" fill="#8a8f94"/><rect x="390" y="50" width="150" height="34" rx="4" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><text x="465.0" y="71.55" font-size="13" text-anchor="middle" fill="#23282d">3  ligate capture</text><text x="390" y="108" font-size="12.5" fill="#8a8f94">add MID and poly(T)</text><text x="390" y="125" font-size="12.5" fill="#8a8f94">to each DNB oligo</text><line x1="542" y1="67" x2="561" y2="67" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 566 67 L 561 63.5 L 561 70.5 Z" fill="#8a8f94"/><rect x="570" y="50" width="150" height="34" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="645.0" y="71.55" font-size="13" text-anchor="middle" fill="#23282d">4  tissue on top</text><text x="570" y="108" font-size="12.5" fill="#8a8f94">RNA caught, RT,</text><text x="570" y="125" font-size="12.5" fill="#8a8f94">library for DNBSEQ</text><line x1="60" y1="190" x2="560" y2="190" stroke="#23282d" stroke-width="3" stroke-linecap="round"/><rect x="60" y="160" width="180" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="150.0" y="177.55" font-size="13" text-anchor="middle" fill="#a33a28">CID  (coordinate)</text><rect x="240" y="160" width="100" height="26" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="290.0" y="177.55" font-size="13" text-anchor="middle" fill="#2e6b3f">MID  (UMI)</text><rect x="340" y="160" width="140" height="26" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="410.0" y="177.55" font-size="13" text-anchor="middle" fill="#b4532a">poly(T)</text><text x="30" y="218" font-size="14" fill="#b4532a">The coordinate is a sequence that is read twice: once to build the map, once with the sample.</text>
</svg>
