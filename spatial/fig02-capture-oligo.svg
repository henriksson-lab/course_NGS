<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 755 242" width="755" height="242" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="640" height="242" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">One capture oligo on the slide. Every spot carries millions, all with the same barcode.</text><line x1="30" y1="73" x2="70" y2="73" stroke="#23282d" stroke-width="3" stroke-linecap="round"/><text x="30" y="52" font-size="12.5" fill="#8a8f94">slide</text><text x="72" y="52" font-size="12.5" fill="#8a8f94">5'</text><rect x="70" y="60" width="120" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="130.0" y="77.55" font-size="13" text-anchor="middle" fill="#1f3b57">handle</text><text x="130.0" y="160" font-size="12.5" text-anchor="middle" fill="#8a8f94">Read 1 site</text><text x="130.0" y="177" font-size="12.5" text-anchor="middle" fill="#1f3b57">same everywhere</text><rect x="190" y="60" width="170" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="275.0" y="77.55" font-size="13" text-anchor="middle" fill="#a33a28">spatial barcode</text><text x="275.0" y="160" font-size="12.5" text-anchor="middle" fill="#8a8f94">16 nt</text><text x="275.0" y="177" font-size="12.5" text-anchor="middle" fill="#a33a28">differs per spot: where</text><rect x="360" y="60" width="130" height="26" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="425.0" y="77.55" font-size="13" text-anchor="middle" fill="#2e6b3f">UMI</text><text x="425.0" y="160" font-size="12.5" text-anchor="middle" fill="#8a8f94">12 nt</text><text x="425.0" y="177" font-size="12.5" text-anchor="middle" fill="#2e6b3f">differs per molecule</text><rect x="490" y="60" width="160" height="26" rx="4" fill="#f3ecd9" stroke="#b4532a" stroke-width="1.2"/><text x="570.0" y="77.55" font-size="13" text-anchor="middle" fill="#b4532a">poly(T) VN</text><text x="570.0" y="160" font-size="12.5" text-anchor="middle" fill="#8a8f94">30 T + anchor</text><text x="570.0" y="177" font-size="12.5" text-anchor="middle" fill="#b4532a">catches poly(A)</text><text x="656" y="52" font-size="12.5" fill="#8a8f94">3'</text><line x1="498" y1="90" x2="498" y2="102" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="514" y1="90" x2="514" y2="102" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="530" y1="90" x2="530" y2="102" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="546" y1="90" x2="546" y2="102" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="562" y1="90" x2="562" y2="102" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="578" y1="90" x2="578" y2="102" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="594" y1="90" x2="594" y2="102" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="610" y1="90" x2="610" y2="102" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="626" y1="90" x2="626" y2="102" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="642" y1="90" x2="642" y2="102" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="480" y1="108" x2="660" y2="108" stroke="#4a6b8a" stroke-width="2.6" stroke-linecap="round"/><text x="474" y="112" font-size="12.5" text-anchor="end" fill="#4a6b8a">mRNA</text><text x="666" y="112" font-size="12.5" fill="#4a6b8a">poly(A) tail</text><text x="30" y="222" font-size="14" fill="#b4532a">RNA is reverse transcribed from the oligo, so the cDNA inherits barcode and UMI in one step.</text>
</svg>
