<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 262" width="760" height="262" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="262" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">The same transcript, three tissue histories</text><text x="30" y="68" font-size="13.5" fill="#b4532a" font-weight="bold">Fresh frozen</text><line x1="250" y1="64" x2="368" y2="64" stroke="#4a6b8a" stroke-width="2.6" stroke-linecap="round"/><text x="372" y="68" font-size="12" fill="#4a6b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAA</text><text x="430" y="61" font-size="12.5" fill="#23282d">intact mRNA, poly(A) tail free</text><text x="430" y="79" font-size="12.5" fill="#2e6b3f">capture with oligo-dT</text><text x="30" y="130" font-size="13.5" fill="#b4532a" font-weight="bold">Formalin, paraffin (FFPE)</text><line x1="250" y1="126" x2="290" y2="126" stroke="#4a6b8a" stroke-width="2.6" stroke-linecap="round"/><line x1="302" y1="126" x2="340" y2="126" stroke="#4a6b8a" stroke-width="2.6" stroke-linecap="round"/><line x1="354" y1="126" x2="400" y2="126" stroke="#4a6b8a" stroke-width="2.6" stroke-linecap="round"/><text x="296" y="118" font-size="14" text-anchor="middle" fill="#a33a28">x</text><line x1="296" y1="130" x2="296" y2="144" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="347" y="118" font-size="14" text-anchor="middle" fill="#a33a28">x</text><line x1="347" y1="130" x2="347" y2="144" stroke="#8a8f94" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2"/><text x="430" y="123" font-size="12.5" fill="#23282d">crosslinked and fragmented, tails often lost</text><text x="430" y="141" font-size="12.5" fill="#2e6b3f">capture with probe pairs</text><text x="30" y="192" font-size="13.5" fill="#b4532a" font-weight="bold">Fixed on purpose (in situ)</text><line x1="250" y1="174" x2="250" y2="208" stroke="#c9ced2" stroke-width="1.2" stroke-linecap="round"/><line x1="276" y1="174" x2="276" y2="208" stroke="#c9ced2" stroke-width="1.2" stroke-linecap="round"/><line x1="302" y1="174" x2="302" y2="208" stroke="#c9ced2" stroke-width="1.2" stroke-linecap="round"/><line x1="328" y1="174" x2="328" y2="208" stroke="#c9ced2" stroke-width="1.2" stroke-linecap="round"/><line x1="354" y1="174" x2="354" y2="208" stroke="#c9ced2" stroke-width="1.2" stroke-linecap="round"/><line x1="380" y1="174" x2="380" y2="208" stroke="#c9ced2" stroke-width="1.2" stroke-linecap="round"/><line x1="250" y1="184" x2="400" y2="184" stroke="#c9ced2" stroke-width="1.2" stroke-linecap="round"/><line x1="250" y1="200" x2="400" y2="200" stroke="#c9ced2" stroke-width="1.2" stroke-linecap="round"/><line x1="260" y1="191" x2="390" y2="191" stroke="#4a6b8a" stroke-width="2.4" stroke-linecap="round"/><circle cx="276" cy="191" r="3.4" fill="#a33a28"/><circle cx="328" cy="191" r="3.4" fill="#a33a28"/><circle cx="380" cy="191" r="3.4" fill="#a33a28"/><text x="430" y="185" font-size="12.5" fill="#23282d">crosslinked to a protein mesh on purpose</text><text x="430" y="203" font-size="12.5" fill="#2e6b3f">copy it, anchor it, read it</text><text x="30" y="244" font-size="14" fill="#b4532a">Fixation is not a preliminary. It decides which RNA is still there to be captured, and how.</text>
</svg>
