<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="230" fill="none"/>
<text x="30" y="28" font-size="13.5" fill="#b4532a" font-weight="bold">1  RT in situ</text><line x1="35" y1="90" x2="135" y2="90" stroke="#4a6b8a" stroke-width="2.6" stroke-linecap="round"/><line x1="45" y1="98" x2="110" y2="98" stroke="#1f3b57" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="4 2"/><text x="30" y="150" font-size="12.5" fill="#8a8f94">random primer,</text><text x="30" y="167" font-size="12.5" fill="#8a8f94">aminoallyl-dUTP</text><text x="175" y="28" font-size="13.5" fill="#b4532a" font-weight="bold">2  Crosslink</text><line x1="185" y1="62" x2="185" y2="118" stroke="#c9ced2" stroke-width="1.4" stroke-linecap="round"/><line x1="215" y1="62" x2="215" y2="118" stroke="#c9ced2" stroke-width="1.4" stroke-linecap="round"/><line x1="245" y1="62" x2="245" y2="118" stroke="#c9ced2" stroke-width="1.4" stroke-linecap="round"/><line x1="275" y1="62" x2="275" y2="118" stroke="#c9ced2" stroke-width="1.4" stroke-linecap="round"/><line x1="185" y1="90" x2="275" y2="90" stroke="#1f3b57" stroke-width="2.2" stroke-linecap="round"/><circle cx="215" cy="90" r="3.6" fill="#a33a28"/><circle cx="245" cy="90" r="3.6" fill="#a33a28"/><text x="175" y="150" font-size="12.5" fill="#8a8f94">cDNA amines to</text><text x="175" y="167" font-size="12.5" fill="#8a8f94">cell protein</text><text x="320" y="28" font-size="13.5" fill="#b4532a" font-weight="bold">3  Circularise</text><circle cx="375" cy="90" r="26" fill="none" stroke="#1f3b57" stroke-width="2.4"/><circle cx="401" cy="90" r="4" fill="#b4532a"/><text x="320" y="150" font-size="12.5" fill="#8a8f94">CircLigase joins</text><text x="320" y="167" font-size="12.5" fill="#8a8f94">the cDNA ends</text><text x="465" y="28" font-size="13.5" fill="#b4532a" font-weight="bold">4  Rolling circle</text><circle cx="520" cy="90" r="12" fill="none" stroke="#1f3b57" stroke-width="1.6" opacity="0.7"/><circle cx="520" cy="90" r="20" fill="none" stroke="#1f3b57" stroke-width="1.6" opacity="0.7"/><circle cx="520" cy="90" r="28" fill="none" stroke="#1f3b57" stroke-width="1.6" opacity="0.7"/><circle cx="520" cy="90" r="4" fill="#b4532a"/><text x="465" y="150" font-size="12.5" fill="#8a8f94">phi29: a 'rolony'</text><text x="465" y="167" font-size="12.5" fill="#8a8f94">of repeated cDNA</text><text x="610" y="28" font-size="13.5" fill="#b4532a" font-weight="bold">5  Read</text><circle cx="630" cy="90" r="9" fill="#2e6b3f"/><circle cx="652" cy="90" r="9" fill="#b4532a"/><circle cx="674" cy="90" r="9" fill="#a33a28"/><circle cx="696" cy="90" r="9" fill="#1f3b57"/><text x="665" y="126" font-size="12" text-anchor="middle" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>A  C  T  G</text><text x="610" y="150" font-size="12.5" fill="#8a8f94">sequencing by</text><text x="610" y="167" font-size="12.5" fill="#8a8f94">ligation, imaged</text><text x="30" y="212" font-size="14" fill="#b4532a">Step 2 is the point: the amplicon must stay where the RNA was, through every wash.</text>
