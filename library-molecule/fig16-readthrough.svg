<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950.0 266" width="950.0" height="266" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="950.0" height="266" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">When the insert is shorter than the read, the read keeps going into the adapter.</text><text x="40" y="66" font-size="13.5" fill="#23282d" font-weight="bold">Read 1 (100 cycles)</text><rect x="190" y="52" width="150.0" height="22" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="265.0" y="66.85" font-size="11" text-anchor="middle" fill="#8a8f94">insert 30</text><rect x="340.0" y="52" width="170.0" height="22" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="425.0" y="66.85" font-size="11" text-anchor="middle" fill="#8a8f94">Read 2 site</text><rect x="510.0" y="52" width="40.0" height="22" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="530.0" y="66.85" font-size="11" text-anchor="middle" fill="#6b5b8a">i7</text><rect x="550.0" y="52" width="120.0" height="22" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="610.0" y="66.85" font-size="11" text-anchor="middle" fill="#a33a28">P7′</text><line x1="690.0" y1="48" x2="690.0" y2="78" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><text x="696.0" y="67" font-size="12" fill="#b4532a">cycle 100; molecule ends at 96</text><text x="40" y="148" font-size="13.5" fill="#23282d" font-weight="bold">Read 2 (100 cycles)</text><rect x="190" y="134" width="150.0" height="22" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="265.0" y="148.85" font-size="11" text-anchor="middle" fill="#8a8f94">insert 30</text><rect x="340.0" y="134" width="165.0" height="22" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="422.5" y="148.85" font-size="11" text-anchor="middle" fill="#8a8f94">Read 1 site′</text><rect x="505.0" y="134" width="40.0" height="22" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="525.0" y="148.85" font-size="11" text-anchor="middle" fill="#6b5b8a">i5′</text><rect x="545.0" y="134" width="145.0" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="617.5" y="148.85" font-size="11" text-anchor="middle" fill="#1f3b57">P5′</text><line x1="690.0" y1="130" x2="690.0" y2="160" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><text x="696.0" y="149" font-size="12" fill="#b4532a">cycle 100; molecule ends at 100</text><text x="340.0" y="112" font-size="10.5" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC</text><text x="554.914" y="112" font-size="10.5" fill="#6b5b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>[i7]</text><text x="580.198" y="112" font-size="10.5" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ATCTCGTATGCCGTCTTCTGCTTG</text><text x="340.0" y="194" font-size="10.5" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT</text><text x="548.593" y="194" font-size="10.5" fill="#6b5b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>[i5′]</text><text x="580.198" y="194" font-size="10.5" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GTGTAGATCTCGGTGGTCGCCGTATCATT</text><text x="40" y="228" font-size="13" fill="#23282d">Both reads start the same way, AGATCGGAAGAGC, then diverge: that is how a trimmer knows which read it is looking at.</text><text x="40" y="248" font-size="13" fill="#8a8f94">R1's read-through also contains the i7 index, in the same orientation as the Index 1 read.</text>
</svg>
