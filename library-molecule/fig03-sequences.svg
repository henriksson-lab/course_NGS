<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 312" width="960" height="312" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="960" height="312" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">The TruSeq arms, base by base (the index is shown as a placeholder).</text><text x="130" y="62" font-size="13.5" text-anchor="end" fill="#23282d">P5</text><text x="150" y="62" font-size="13" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AATGATACGGCGACCACCGAGATCTACAC</text><text x="450" y="62" font-size="12.5" fill="#8a8f94">29 nt · same as the P5 lawn oligo</text><text x="130" y="90" font-size="13.5" text-anchor="end" fill="#23282d">i5</text><text x="150" y="90" font-size="13" fill="#6b5b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>[ 8 nt ]</text><text x="450" y="90" font-size="12.5" fill="#8a8f94">8 nt · chosen per sample</text><text x="130" y="118" font-size="13.5" text-anchor="end" fill="#23282d">Read 1 site</text><text x="150" y="118" font-size="13" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ACACTCTTTCCCTACACGAC</text><text x="306.52" y="118" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GCTCTTCCGATCT</text><text x="450" y="118" font-size="12.5" fill="#8a8f94">33 nt · ends in the stem (orange)</text><text x="130" y="146" font-size="13.5" text-anchor="end" fill="#23282d">insert</text><text x="150" y="146" font-size="13" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>&#8230; your DNA or cDNA &#8230;</text><text x="450" y="146" font-size="12.5" fill="#8a8f94"></text><text x="130" y="174" font-size="13.5" text-anchor="end" fill="#23282d">Read 2 site</text><text x="150" y="174" font-size="13" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AGATCGGAAGAGC</text><text x="251.738" y="174" font-size="13" fill="#8a8f94" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ACACGTCTGAACTCCAGTCAC</text><text x="450" y="174" font-size="12.5" fill="#8a8f94">34 nt · starts with the stem; the first A is the insert's own A-tail</text><text x="130" y="202" font-size="13.5" text-anchor="end" fill="#23282d">i7</text><text x="150" y="202" font-size="13" fill="#6b5b8a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>[ 8 nt ]</text><text x="450" y="202" font-size="12.5" fill="#8a8f94">8 nt · chosen per sample</text><text x="130" y="230" font-size="13.5" text-anchor="end" fill="#23282d">P7′</text><text x="150" y="230" font-size="13" fill="#a33a28" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>ATCTCGTATGCCGTCTTCTGCTTG</text><text x="450" y="230" font-size="12.5" fill="#8a8f94">24 nt · reverse complement of the P7 lawn oligo</text><text x="40" y="272" font-size="13.5" fill="#23282d">Orange: the 12 bp stem of the Y adapter, and the same 13 letters you see when a trimmer reports adapter content.</text><text x="40" y="294" font-size="13.5" fill="#8a8f94">Both ends are the lawn oligos in disguise: P5 as written, P7 reverse-complemented.</text>
</svg>
