<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 216" width="900" height="216" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="216" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Tn5 puts tag A or tag B on each end at random; only A at one end and B at the other can become P5 … P7.</text><rect x="40" y="54" width="70" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="75.0" y="71.2" font-size="12" text-anchor="middle" fill="#1f3b57">tag A</text><rect x="110" y="54" width="150" height="26" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="185.0" y="71.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="260" y="54" width="70" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="295.0" y="71.2" font-size="12" text-anchor="middle" fill="#a33a28">tag B′</text><text x="346" y="72" font-size="13" fill="#2e6b3f" font-weight="bold">50 %</text><text x="392" y="72" font-size="13" fill="#2e6b3f">i5 primer binds tag A, i7 primer binds tag B: P5 … P7</text><rect x="40" y="98" width="70" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="75.0" y="115.2" font-size="12" text-anchor="middle" fill="#1f3b57">tag A</text><rect x="110" y="98" width="150" height="26" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="185.0" y="115.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="260" y="98" width="70" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="295.0" y="115.2" font-size="12" text-anchor="middle" fill="#1f3b57">tag A′</text><text x="346" y="116" font-size="13" fill="#a33a28" font-weight="bold">25 %</text><text x="392" y="116" font-size="13" fill="#a33a28">only the i5 primer fits: P5 … P5, cannot bridge</text><rect x="40" y="142" width="70" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="75.0" y="159.2" font-size="12" text-anchor="middle" fill="#a33a28">tag B</text><rect x="110" y="142" width="150" height="26" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="185.0" y="159.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="260" y="142" width="70" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="295.0" y="159.2" font-size="12" text-anchor="middle" fill="#a33a28">tag B′</text><text x="346" y="160" font-size="13" fill="#a33a28" font-weight="bold">25 %</text><text x="392" y="160" font-size="13" fill="#a33a28">only the i7 primer fits: P7 … P7, cannot bridge</text><text x="40" y="198" font-size="13.5" fill="#23282d">Tag A = 14-nt tail + mosaic end; tag B = 15-nt tail + the same mosaic end. The tails are what the index primers recognise.</text>
</svg>
