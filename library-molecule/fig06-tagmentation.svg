<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 232" width="890" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="890" height="232" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Tagmentation: Tn5 cuts and tags in one step, and leaves a 9-nt gap.</text><text x="150" y="56" font-size="13.5" text-anchor="middle" fill="#23282d">1  Tn5 on the DNA</text><line x1="30" y1="118" x2="280" y2="118" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="round"/><line x1="30" y1="134" x2="280" y2="134" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="round"/><ellipse cx="100" cy="126" rx="22" ry="30" fill="#f3e3d9" stroke="#b4532a" stroke-width="1.4"/><text x="100" y="130" font-size="12" text-anchor="middle" fill="#b4532a">Tn5</text><ellipse cx="210" cy="126" rx="22" ry="30" fill="#f3e3d9" stroke="#b4532a" stroke-width="1.4"/><text x="210" y="130" font-size="12" text-anchor="middle" fill="#b4532a">Tn5</text><text x="155" y="190" font-size="12" text-anchor="middle" fill="#8a8f94">each dimer holds two</text><text x="155" y="206" font-size="12" text-anchor="middle" fill="#8a8f94">transposon ends</text><line x1="288" y1="126" x2="311" y2="126" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 316 126 L 311 122.5 L 311 129.5 Z" fill="#8a8f94"/><text x="440" y="56" font-size="13.5" text-anchor="middle" fill="#23282d">2  cut and tagged</text><line x1="320" y1="118" x2="360" y2="118" stroke="#c9ccd0" stroke-width="2.6" stroke-linecap="round"/><line x1="320" y1="134" x2="360" y2="134" stroke="#c9ccd0" stroke-width="2.6" stroke-linecap="round"/><line x1="530" y1="118" x2="570" y2="118" stroke="#c9ccd0" stroke-width="2.6" stroke-linecap="round"/><line x1="530" y1="134" x2="570" y2="134" stroke="#c9ccd0" stroke-width="2.6" stroke-linecap="round"/><line x1="390" y1="118" x2="482" y2="118" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="round"/><line x1="408" y1="134" x2="500" y2="134" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="round"/><line x1="356" y1="118" x2="390" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="500" y1="134" x2="534" y2="134" stroke="#a33a28" stroke-width="4" stroke-linecap="round"/><line x1="390" y1="142" x2="408" y2="142" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><text x="399" y="158" font-size="12" text-anchor="middle" fill="#b4532a">gap</text><line x1="482" y1="110" x2="500" y2="110" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><text x="491" y="104" font-size="12" text-anchor="middle" fill="#b4532a">gap</text><text x="445" y="196" font-size="12" text-anchor="middle" fill="#8a8f94">tags are on the 5′ ends only</text><text x="373" y="106" font-size="12" text-anchor="middle" fill="#1f3b57">tag A</text><text x="517" y="156" font-size="12" text-anchor="middle" fill="#a33a28">tag B</text><line x1="578" y1="126" x2="601" y2="126" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 606 126 L 601 122.5 L 601 129.5 Z" fill="#8a8f94"/><text x="730" y="56" font-size="13.5" text-anchor="middle" fill="#23282d">3  72 °C fill-in</text><line x1="610" y1="118" x2="650" y2="118" stroke="#c9ccd0" stroke-width="2.6" stroke-linecap="round"/><line x1="610" y1="134" x2="650" y2="134" stroke="#c9ccd0" stroke-width="2.6" stroke-linecap="round"/><line x1="820" y1="118" x2="860" y2="118" stroke="#c9ccd0" stroke-width="2.6" stroke-linecap="round"/><line x1="820" y1="134" x2="860" y2="134" stroke="#c9ccd0" stroke-width="2.6" stroke-linecap="round"/><line x1="680" y1="118" x2="772" y2="118" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="round"/><line x1="698" y1="134" x2="790" y2="134" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="round"/><line x1="646" y1="118" x2="680" y2="118" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="790" y1="134" x2="824" y2="134" stroke="#a33a28" stroke-width="4" stroke-linecap="round"/><line x1="772" y1="118" x2="824" y2="118" stroke="#a33a28" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="698" y1="134" x2="646" y2="134" stroke="#1f3b57" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 3"/><text x="824" y="108" font-size="12" text-anchor="end" fill="#a33a28">copy of B</text><text x="646" y="156" font-size="12" fill="#1f3b57">copy of A</text><text x="735" y="196" font-size="12" text-anchor="middle" fill="#8a8f94">dashed: new strand copied across the gap</text><text x="735" y="212" font-size="12" text-anchor="middle" fill="#8a8f94">and the other end's tag</text><text x="663" y="106" font-size="12" text-anchor="middle" fill="#1f3b57">tag A</text><text x="807" y="156" font-size="12" text-anchor="middle" fill="#a33a28">tag B</text>
</svg>
