<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1083 254" width="1083" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="708" height="254" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">The finished Nextera / Tn5 molecule: the Read 1 and Read 2 sites are built from tail + mosaic end.</text><rect x="50" y="100" width="66" height="30" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="83.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#1f3b57">P5</text><rect x="116" y="100" width="50" height="30" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="141.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#6b5b8a">i5</text><rect x="166" y="100" width="56" height="30" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="194.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#8a8f94">tail A</text><rect x="222" y="100" width="52" height="30" rx="4" fill="#eef0e4" stroke="#6f7a3a" stroke-width="1.2"/><text x="248.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#6f7a3a">ME</text><rect x="274" y="100" width="150" height="30" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="349.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="424" y="100" width="52" height="30" rx="4" fill="#eef0e4" stroke="#6f7a3a" stroke-width="1.2"/><text x="450.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#6f7a3a">ME′</text><rect x="476" y="100" width="56" height="30" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="504.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#8a8f94">tail B′</text><rect x="532" y="100" width="50" height="30" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="557.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#6b5b8a">i7</text><rect x="582" y="100" width="66" height="30" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="615.0" y="119.375" font-size="12.5" text-anchor="middle" fill="#a33a28">P7</text><line x1="166" y1="88" x2="274" y2="88" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="166" y1="88" x2="166" y2="94" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><line x1="274" y1="88" x2="274" y2="94" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><text x="220.0" y="82" font-size="13" text-anchor="middle" fill="#1f3b57">Read 1 site</text><line x1="424" y1="88" x2="532" y2="88" stroke="#a33a28" stroke-width="1.6" stroke-linecap="round"/><line x1="424" y1="88" x2="424" y2="94" stroke="#a33a28" stroke-width="1.6" stroke-linecap="round"/><line x1="532" y1="88" x2="532" y2="94" stroke="#a33a28" stroke-width="1.6" stroke-linecap="round"/><text x="478.0" y="82" font-size="13" text-anchor="middle" fill="#a33a28">Read 2 site</text><line x1="222" y1="142" x2="274" y2="142" stroke="#6f7a3a" stroke-width="1.6" stroke-linecap="round"/><line x1="424" y1="142" x2="476" y2="142" stroke="#6f7a3a" stroke-width="1.6" stroke-linecap="round"/><text x="248" y="158" font-size="12" text-anchor="middle" fill="#6f7a3a">the Tn5 part</text><text x="450" y="158" font-size="12" text-anchor="middle" fill="#6f7a3a">the Tn5 part</text><text x="50" y="186" font-size="13" fill="#23282d">mosaic end (ME) AGATGTGTATAAGAGACAG  · 19 nt, the sequence Tn5 binds</text><text x="50" y="208" font-size="13" fill="#23282d">tail A TCGTCGGCAGCGTC   tail B GTCTCGTGGGCTCGG</text><text x="50" y="234" font-size="13.5" fill="#8a8f94">Same idea as TruSeq: P5 … P7 at the ends, an index inside each, a primer site next to the insert. Different part: the primer sites contain the Tn5 end.</text>
</svg>
