<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 867 258" width="867" height="258" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="258" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Six molecules in one tube. Only one of them is what you wanted.</text><rect x="40" y="44" width="54" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="67.0" y="60.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="94" y="44" width="150" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="169.0" y="60.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert  300 bp</text><rect x="244" y="44" width="54" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="271.0" y="60.2" font-size="12" text-anchor="middle" fill="#a33a28">P7′</text><text x="450" y="61" font-size="13" fill="#2e6b3f">clusters and reads</text><rect x="40" y="78" width="54" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="67.0" y="94.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="94" y="78" width="150" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="169.0" y="94.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="244" y="78" width="54" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="271.0" y="94.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5′</text><text x="450" y="95" font-size="13" fill="#a33a28">same end twice: cannot bridge, no cluster</text><rect x="40" y="112" width="54" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="67.0" y="128.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="94" y="112" width="150" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="169.0" y="128.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><text x="450" y="129" font-size="13" fill="#a33a28">one end only: washes away</text><rect x="40" y="146" width="54" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="67.0" y="162.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5 arm</text><rect x="94" y="146" width="54" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="121.0" y="162.2" font-size="12" text-anchor="middle" fill="#a33a28">P7′ arm</text><text x="450" y="163" font-size="13" fill="#a33a28">adapter dimer: ~135 bp, clusters very well, reads only adapter</text><rect x="40" y="180" width="54" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="67.0" y="196.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="94" y="180" width="250" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="219.0" y="196.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert  1.5 kb</text><rect x="344" y="180" width="54" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="371.0" y="196.2" font-size="12" text-anchor="middle" fill="#a33a28">P7′</text><text x="450" y="197" font-size="13" fill="#a33a28">too long: bridges poorly and is outcompeted by short molecules</text><rect x="40" y="214" width="54" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="67.0" y="230.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="94" y="214" width="50" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="119.0" y="230.2" font-size="12" text-anchor="middle" fill="#8a8f94">ins 20</text><rect x="144" y="214" width="54" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="171.0" y="230.2" font-size="12" text-anchor="middle" fill="#a33a28">P7′</text><text x="450" y="231" font-size="13" fill="#8a6a1f">clusters, but a 100-cycle read runs through into the adapter</text>
</svg>
