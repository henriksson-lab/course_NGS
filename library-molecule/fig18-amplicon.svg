<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 242" width="900" height="242" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="242" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">When both ends are already known, the library is one PCR.</text><text x="30" y="70" font-size="12.5" fill="#23282d">1  the target</text><rect x="190" y="54" width="300" height="24" rx="4" fill="#f4f6f8" stroke="#8a8f94" stroke-width="1.2"/><text x="340.0" y="70.025" font-size="11.5" text-anchor="middle" fill="#23282d">known sequence you chose</text><text x="640" y="70" font-size="11.5" fill="#8a8f94">no fragmentation, no ligation</text><text x="30" y="122" font-size="12.5" fill="#23282d">2  tailed primers</text><rect x="190" y="106" width="96" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="238.0" y="121.85" font-size="11" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="286" y="106" width="46" height="24" rx="4" fill="none" stroke="#b4532a" stroke-width="1.2"/><text x="309.0" y="121.85" font-size="11" text-anchor="middle" fill="#b4532a">fwd</text><line x1="338" y1="118" x2="371" y2="118" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 376 118 L 371 114.5 L 371 121.5 Z" fill="#b4532a"/><line x1="458" y1="118" x2="425" y2="118" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 420 118 L 425 114.5 L 425 121.5 Z" fill="#b4532a"/><rect x="458" y="106" width="46" height="24" rx="4" fill="none" stroke="#b4532a" stroke-width="1.2"/><text x="481.0" y="121.85" font-size="11" text-anchor="middle" fill="#b4532a">rev</text><rect x="504" y="106" width="98" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="553.0" y="121.85" font-size="11" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="640" y="122" font-size="11.5" fill="#8a8f94">the tail is not on the template</text><text x="30" y="174" font-size="12.5" fill="#23282d">3  after two cycles</text><rect x="190" y="158" width="96" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="238.0" y="173.85" font-size="11" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="286" y="158" width="218" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="395.0" y="174.025" font-size="11.5" text-anchor="middle" fill="#23282d">the target</text><rect x="504" y="158" width="98" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="553.0" y="173.85" font-size="11" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="640" y="174" font-size="11.5" fill="#8a8f94">a finished library molecule</text><text x="30" y="224" font-size="13.5" fill="#b4532a">Every later method in this course answers one question: what do you do when you do not know the ends?</text>
</svg>
