<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 296" width="932" height="296" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="730" height="296" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A library is double-stranded; each read primer sits on one strand and copies the other.</text><rect x="70" y="84" width="60" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="100.0" y="101.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="130" y="84" width="44" height="26" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="152.0" y="101.2" font-size="12" text-anchor="middle" fill="#6b5b8a">i5</text><rect x="174" y="84" width="76" height="26" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="212.0" y="101.2" font-size="12" text-anchor="middle" fill="#8a8f94">R1 site</text><rect x="250" y="84" width="150" height="26" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="325.0" y="101.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="400" y="84" width="76" height="26" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="438.0" y="101.2" font-size="12" text-anchor="middle" fill="#8a8f94">R2 site′</text><rect x="476" y="84" width="44" height="26" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="498.0" y="101.2" font-size="12" text-anchor="middle" fill="#6b5b8a">i7</text><rect x="520" y="84" width="60" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="550.0" y="101.2" font-size="12" text-anchor="middle" fill="#a33a28">P7′</text><rect x="70" y="128" width="60" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="100.0" y="145.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5′</text><rect x="130" y="128" width="44" height="26" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="152.0" y="145.2" font-size="12" text-anchor="middle" fill="#6b5b8a">i5′</text><rect x="174" y="128" width="76" height="26" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="212.0" y="145.2" font-size="12" text-anchor="middle" fill="#8a8f94">R1 site′</text><rect x="250" y="128" width="150" height="26" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="325.0" y="145.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert′</text><rect x="400" y="128" width="76" height="26" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="438.0" y="145.2" font-size="12" text-anchor="middle" fill="#8a8f94">R2 site</text><rect x="476" y="128" width="44" height="26" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="498.0" y="145.2" font-size="12" text-anchor="middle" fill="#6b5b8a">i7′</text><rect x="520" y="128" width="60" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="550.0" y="145.2" font-size="12" text-anchor="middle" fill="#a33a28">P7</text><text x="62" y="102" font-size="12" text-anchor="end" fill="#8a8f94">5′</text><text x="588" y="102" font-size="12" fill="#8a8f94">3′</text><text x="62" y="146" font-size="12" text-anchor="end" fill="#8a8f94">3′</text><text x="588" y="146" font-size="12" fill="#8a8f94">5′</text><text x="614" y="102" font-size="12.5" fill="#1f3b57">top strand</text><text x="614" y="146" font-size="12.5" fill="#4a6b8a">bottom strand</text><line x1="174" y1="172" x2="391" y2="172" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><path d="M 396 172 L 391 168.5 L 391 175.5 Z" fill="#b4532a"/><text x="174" y="190" font-size="12.5" fill="#b4532a">Read 1: anneals to the bottom strand, so it reads the top-strand sequence</text><line x1="400" y1="212" x2="515" y2="212" stroke="#6b5b8a" stroke-width="2.2" stroke-linecap="round"/><path d="M 520 212 L 515 208.5 L 515 215.5 Z" fill="#6b5b8a"/><text x="394" y="216" font-size="12.5" text-anchor="end" fill="#6b5b8a">Index 1 (i7)</text><line x1="476" y1="66" x2="185" y2="66" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><path d="M 180 66 L 185 62.5 L 185 69.5 Z" fill="#a33a28"/><text x="476" y="56" font-size="12.5" text-anchor="end" fill="#a33a28">Read 2: anneals to the top strand and reads leftwards, from the other end</text><text x="40" y="256" font-size="13.5" fill="#23282d">The two ends of the top strand pair with the lawn: P7′ at its 3′ end with a P7 oligo, and the bottom strand's P5′ with a P5 oligo.</text><text x="40" y="276" font-size="13.5" fill="#8a8f94">Index 2 (i5) is read in the turnaround between Index 1 and Read 2; which way round it comes out depends on the instrument.</text>
</svg>
