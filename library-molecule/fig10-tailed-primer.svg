<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1094 232" width="1094" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="920" height="232" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A tailed primer works in three stages.</text><text x="140" y="56" font-size="13" text-anchor="middle" fill="#23282d">cycle 1: only the 3′ part pairs</text><line x1="90" y1="130" x2="260" y2="130" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="round"/><text x="84" y="134" font-size="11.5" text-anchor="end" fill="#8a8f94">3′</text><line x1="135.0" y1="127" x2="135.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="144.5" y1="127" x2="144.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="154.0" y1="127" x2="154.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="163.5" y1="127" x2="163.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="173.0" y1="127" x2="173.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="182.5" y1="127" x2="182.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="192.0" y1="127" x2="192.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="201.5" y1="127" x2="201.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="130" y1="112" x2="210" y2="112" stroke="#23282d" stroke-width="3" stroke-linecap="round"/><line x1="208" y1="112" x2="217" y2="112" stroke="#23282d" stroke-width="3" stroke-linecap="round"/><path d="M 222 112 L 217 108.5 L 217 115.5 Z" fill="#23282d"/><line x1="130" y1="112" x2="92" y2="78" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><text x="86" y="72" font-size="12" text-anchor="middle" fill="#b4532a">tail</text><text x="140" y="160" font-size="12" text-anchor="middle" fill="#8a8f94">the tail hangs free</text><text x="430" y="56" font-size="13" text-anchor="middle" fill="#23282d">cycle 2: the copy carries the tail</text><line x1="380" y1="130" x2="550" y2="130" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="round"/><text x="374" y="134" font-size="11.5" text-anchor="end" fill="#8a8f94">3′</text><line x1="425.0" y1="127" x2="425.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="434.5" y1="127" x2="434.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="444.0" y1="127" x2="444.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="453.5" y1="127" x2="453.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="463.0" y1="127" x2="463.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="472.5" y1="127" x2="472.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="482.0" y1="127" x2="482.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="491.5" y1="127" x2="491.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="420" y1="112" x2="500" y2="112" stroke="#23282d" stroke-width="3" stroke-linecap="round"/><line x1="498" y1="112" x2="507" y2="112" stroke="#23282d" stroke-width="3" stroke-linecap="round"/><path d="M 512 112 L 507 108.5 L 507 115.5 Z" fill="#23282d"/><line x1="380" y1="144" x2="550" y2="144" stroke="#4a6b8a" stroke-width="2.6" stroke-linecap="round"/><line x1="380" y1="144" x2="340" y2="144" stroke="#b4532a" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="4 3"/><text x="358" y="164" font-size="12" text-anchor="middle" fill="#b4532a">tail, now in the DNA</text><text x="460" y="182" font-size="12" text-anchor="middle" fill="#8a8f94">the opposite primer copies this strand</text><text x="720" y="56" font-size="13" text-anchor="middle" fill="#23282d">cycle 3 on: the whole primer pairs</text><line x1="670" y1="130" x2="840" y2="130" stroke="#8a8f94" stroke-width="2.6" stroke-linecap="round"/><text x="664" y="134" font-size="11.5" text-anchor="end" fill="#8a8f94">3′</text><line x1="715.0" y1="127" x2="715.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="724.5" y1="127" x2="724.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="734.0" y1="127" x2="734.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="743.5" y1="127" x2="743.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="753.0" y1="127" x2="753.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="762.5" y1="127" x2="762.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="772.0" y1="127" x2="772.0" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="781.5" y1="127" x2="781.5" y2="116" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="710" y1="112" x2="790" y2="112" stroke="#23282d" stroke-width="3" stroke-linecap="round"/><line x1="788" y1="112" x2="797" y2="112" stroke="#23282d" stroke-width="3" stroke-linecap="round"/><path d="M 802 112 L 797 108.5 L 797 115.5 Z" fill="#23282d"/><line x1="710" y1="112" x2="672" y2="112" stroke="#b4532a" stroke-width="3" stroke-linecap="round"/><line x1="678.0" y1="127" x2="678.0" y2="116" stroke="#b4532a" stroke-width="1" stroke-linecap="round"/><line x1="683.2" y1="127" x2="683.2" y2="116" stroke="#b4532a" stroke-width="1" stroke-linecap="round"/><line x1="688.4" y1="127" x2="688.4" y2="116" stroke="#b4532a" stroke-width="1" stroke-linecap="round"/><line x1="693.6" y1="127" x2="693.6" y2="116" stroke="#b4532a" stroke-width="1" stroke-linecap="round"/><line x1="698.8" y1="127" x2="698.8" y2="116" stroke="#b4532a" stroke-width="1" stroke-linecap="round"/><line x1="704.0" y1="127" x2="704.0" y2="116" stroke="#b4532a" stroke-width="1" stroke-linecap="round"/><text x="720" y="160" font-size="12" text-anchor="middle" fill="#8a8f94">full-length products amplify</text><text x="720" y="178" font-size="12" text-anchor="middle" fill="#8a8f94">with the whole primer pairing</text><text x="40" y="214" font-size="13" fill="#8a8f94">Only molecules made from cycle 2 onward carry both tails; after a few more cycles they dominate the tube, which is why index PCR needs only a handful of cycles.</text>
</svg>
