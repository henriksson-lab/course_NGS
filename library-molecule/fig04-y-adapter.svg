<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 264" width="884" height="264" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="264" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A Y adapter on each end of an A-tailed insert.</text><line x1="270" y1="112" x2="510" y2="112" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><line x1="270" y1="128" x2="510" y2="128" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><text x="390.0" y="100" font-size="12.5" text-anchor="middle" fill="#8a8f94">insert, 3′ A overhangs</text><line x1="190" y1="112" x2="270" y2="112" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="190" y1="128" x2="270" y2="128" stroke="#a33a28" stroke-width="3" stroke-linecap="round"/><line x1="190" y1="112" x2="120" y2="66" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="190" y1="128" x2="120" y2="174" stroke="#a33a28" stroke-width="3" stroke-linecap="round"/><line x1="510" y1="112" x2="590" y2="112" stroke="#a33a28" stroke-width="3" stroke-linecap="round"/><line x1="510" y1="128" x2="590" y2="128" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="590" y1="112" x2="660" y2="66" stroke="#a33a28" stroke-width="3" stroke-linecap="round"/><line x1="590" y1="128" x2="660" y2="174" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><line x1="270" y1="104" x2="270" y2="136" stroke="#b4532a" stroke-width="2.4" stroke-linecap="round"/><line x1="510" y1="104" x2="510" y2="136" stroke="#b4532a" stroke-width="2.4" stroke-linecap="round"/><text x="270" y="154" font-size="12" text-anchor="middle" fill="#b4532a">ligation</text><text x="510" y="154" font-size="12" text-anchor="middle" fill="#b4532a">ligation</text><text x="230" y="154" font-size="12"></text><text x="230" y="98" font-size="12.5" text-anchor="middle" fill="#8a8f94">12 bp stem</text><text x="30" y="54" font-size="12.5" fill="#1f3b57">P5 arm: i5 + Read 1 site</text><text x="30" y="196" font-size="12.5" fill="#a33a28">P7 arm: Read 2 site + i7</text><text x="670" y="62" font-size="12.5" fill="#a33a28">P7 arm</text><text x="670" y="182" font-size="12.5" fill="#1f3b57">P5 arm</text><text x="126" y="80" font-size="12" text-anchor="end" fill="#8a8f94">5′</text><text x="654" y="80" font-size="12" fill="#8a8f94">3′</text><text x="126" y="166" font-size="12" text-anchor="end" fill="#8a8f94">3′</text><text x="654" y="166" font-size="12" fill="#8a8f94">5′</text><text x="40" y="226" font-size="13.5" fill="#23282d">The two arms are not complementary, so they stay single-stranded. Whichever way round the insert went in, each strand reads</text><text x="40" y="246" font-size="13.5" fill="#23282d">5′ P5 arm … insert … P7 arm 3′, and the adapter's own 3′ T pairs with the insert's 3′ A.</text>
</svg>
