<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 328" width="900" height="328" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="900" height="328" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Three places to put a label, and what each one costs.</text><text x="40" y="56" font-size="13.5" fill="#23282d" font-weight="bold">In an index read</text><rect x="40" y="64" width="50" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="65.0" y="81.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5</text><rect x="90" y="64" width="40" height="26" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="110.0" y="81.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">i5</text><rect x="130" y="64" width="64" height="26" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="162.0" y="81.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R1 site</text><rect x="194" y="64" width="120" height="26" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="254.0" y="81.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="314" y="64" width="64" height="26" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="346.0" y="81.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R2 site</text><rect x="378" y="64" width="40" height="26" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="398.0" y="81.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">i7</text><rect x="418" y="64" width="50" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="443.0" y="81.025" font-size="11.5" text-anchor="middle" fill="#a33a28">P7</text><text x="40" y="108" font-size="12.5" fill="#8a8f94">added by the adapter or index PCR, the last step; read separately, so no insert cycles are used</text><text x="40" y="142" font-size="13.5" fill="#23282d" font-weight="bold">At the start of Read 1</text><rect x="40" y="150" width="50" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="65.0" y="167.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5</text><rect x="90" y="150" width="64" height="26" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="122.0" y="167.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R1 site</text><rect x="154" y="150" width="60" height="26" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="184.0" y="167.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">barcode</text><rect x="214" y="150" width="44" height="26" rx="4" fill="#f7eedc" stroke="#8a6a1f" stroke-width="1.2"/><text x="236.0" y="167.025" font-size="11.5" text-anchor="middle" fill="#8a6a1f">UMI</text><rect x="258" y="150" width="140" height="26" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="328.0" y="167.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="398" y="150" width="64" height="26" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="430.0" y="167.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R2 site</text><rect x="462" y="150" width="40" height="26" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="482.0" y="167.025" font-size="11.5" text-anchor="middle" fill="#6b5b8a">i7</text><rect x="502" y="150" width="50" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="527.0" y="167.025" font-size="11.5" text-anchor="middle" fill="#a33a28">P7</text><text x="40" y="194" font-size="12.5" fill="#8a8f94">added by the RT primer, the first step, so cells can be pooled early; costs read cycles</text><text x="40" y="228" font-size="13.5" fill="#23282d" font-weight="bold">In-line, next to the insert</text><rect x="40" y="236" width="50" height="26" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="65.0" y="253.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5</text><rect x="90" y="236" width="64" height="26" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="122.0" y="253.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R1 site</text><rect x="154" y="236" width="36" height="26" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="172.0" y="253.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">bc</text><rect x="190" y="236" width="150" height="26" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="265.0" y="253.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="340" y="236" width="64" height="26" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="372.0" y="253.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">R2 site</text><rect x="404" y="236" width="50" height="26" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="429.0" y="253.025" font-size="11.5" text-anchor="middle" fill="#a33a28">P7</text><text x="40" y="280" font-size="12.5" fill="#8a8f94">added by a barcoded adapter; no index primer needed, but few barcodes means low diversity</text><text x="40" y="310" font-size="13.5" fill="#b4532a">The earlier in the protocol a label is added, the earlier samples can share one tube.</text>
</svg>
