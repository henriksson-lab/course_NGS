<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 250" width="864" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="740" height="250" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Full adapters: the ligation delivers the whole molecule.</text><rect x="60" y="36" width="60" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="90.0" y="52.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="120" y="36" width="44" height="24" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="142.0" y="52.2" font-size="12" text-anchor="middle" fill="#6b5b8a">i5</text><rect x="164" y="36" width="76" height="24" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="202.0" y="52.2" font-size="12" text-anchor="middle" fill="#8a8f94">R1 site</text><rect x="240" y="36" width="150" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="315.0" y="52.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="390" y="36" width="76" height="24" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="428.0" y="52.2" font-size="12" text-anchor="middle" fill="#8a8f94">R2 site′</text><rect x="466" y="36" width="44" height="24" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="488.0" y="52.2" font-size="12" text-anchor="middle" fill="#6b5b8a">i7</text><rect x="510" y="36" width="60" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="540.0" y="52.2" font-size="12" text-anchor="middle" fill="#a33a28">P7′</text><text x="588" y="54" font-size="12.5" fill="#8a8f94">PCR-free is possible (TruSeq DNA PCR-free)</text><text x="40" y="106" font-size="14" fill="#23282d">Truncated adapters: ligation delivers only the primer sites ...</text><rect x="164" y="116" width="76" height="24" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="202.0" y="132.2" font-size="12" text-anchor="middle" fill="#8a8f94">R1 site</text><rect x="240" y="116" width="150" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="315.0" y="132.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="390" y="116" width="76" height="24" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="428.0" y="132.2" font-size="12" text-anchor="middle" fill="#8a8f94">R2 site′</text><text x="40" y="170" font-size="14" fill="#23282d">... and two tailed primers add the rest during index PCR.</text><rect x="60" y="180" width="60" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="90.0" y="195.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5</text><rect x="120" y="180" width="44" height="22" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="142.0" y="195.2" font-size="12" text-anchor="middle" fill="#6b5b8a">i5</text><rect x="164" y="180" width="76" height="22" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="202.0" y="195.2" font-size="12" text-anchor="middle" fill="#8a8f94">R1 site</text><line x1="160" y1="214" x2="245" y2="214" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 250 214 L 245 210.5 L 245 217.5 Z" fill="#b4532a"/><text x="164" y="230" font-size="12" fill="#b4532a">primer: tail + 3′ part that pairs</text><rect x="390" y="180" width="76" height="22" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="428.0" y="195.2" font-size="12" text-anchor="middle" fill="#8a8f94">R2 site′</text><rect x="466" y="180" width="44" height="22" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="488.0" y="195.2" font-size="12" text-anchor="middle" fill="#6b5b8a">i7</text><rect x="510" y="180" width="60" height="22" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="540.0" y="195.2" font-size="12" text-anchor="middle" fill="#a33a28">P7′</text><line x1="396" y1="214" x2="311" y2="214" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 306 214 L 311 210.5 L 311 217.5 Z" fill="#b4532a"/><text x="480" y="230" font-size="12" text-anchor="middle" fill="#b4532a">its own tailed primer</text><text x="590" y="197" font-size="12.5" fill="#a33a28">cost: needs PCR</text><text x="590" y="133" font-size="12.5" fill="#2e6b3f">adapters can be generic</text>
</svg>
