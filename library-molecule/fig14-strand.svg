<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 939 284" width="939" height="284" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="920" height="284" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Which strand does Read 1 read? It depends on how the orientation is fixed.</text><text x="560" y="54" font-size="12" text-anchor="middle" fill="#8a8f94">transcript 5′ → 3′</text><text x="40" y="88" font-size="13" fill="#23282d">Y adapters ligated to ds cDNA</text><text x="40" y="106" font-size="12" fill="#8a8f94">nothing fixes it</text><line x1="480" y1="80" x2="635" y2="80" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 640 80 L 635 76.5 L 635 83.5 Z" fill="#8a8f94"/><line x1="480" y1="96" x2="640" y2="96" stroke="#c9ccd0" stroke-width="6" stroke-linecap="round"/><line x1="484" y1="110" x2="529" y2="110" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><path d="M 534 110 L 529 106.5 L 529 113.5 Z" fill="#b4532a"/><line x1="636" y1="110" x2="591" y2="110" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><path d="M 586 110 L 591 106.5 L 591 113.5 Z" fill="#a33a28"/><text x="656" y="98" font-size="12.5" fill="#a33a28">or the other way round: R1 on either strand</text><text x="40" y="150" font-size="13" fill="#23282d">dUTP second strand, then Y adapters</text><text x="40" y="168" font-size="12" fill="#8a8f94">only the first strand survives</text><line x1="480" y1="142" x2="635" y2="142" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 640 142 L 635 138.5 L 635 145.5 Z" fill="#8a8f94"/><line x1="480" y1="158" x2="640" y2="158" stroke="#c9ccd0" stroke-width="6" stroke-linecap="round"/><line x1="636" y1="172" x2="591" y2="172" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><path d="M 586 172 L 591 168.5 L 591 175.5 Z" fill="#b4532a"/><line x1="484" y1="172" x2="529" y2="172" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><path d="M 534 172 L 529 168.5 L 529 175.5 Z" fill="#a33a28"/><text x="656" y="160" font-size="12.5" fill="#2e6b3f">R1 antisense, R2 sense, every time</text><text x="40" y="212" font-size="13" fill="#23282d">barcoded oligo(dT) priming (10x 3′)</text><text x="40" y="230" font-size="12" fill="#8a8f94">the primer defines the end</text><line x1="480" y1="204" x2="635" y2="204" stroke="#8a8f94" stroke-width="1.4" stroke-linecap="round"/><path d="M 640 204 L 635 200.5 L 635 207.5 Z" fill="#8a8f94"/><line x1="480" y1="220" x2="640" y2="220" stroke="#c9ccd0" stroke-width="6" stroke-linecap="round"/><line x1="636" y1="234" x2="609" y2="234" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><path d="M 604 234 L 609 230.5 L 609 237.5 Z" fill="#b4532a"/><line x1="484" y1="234" x2="529" y2="234" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round"/><path d="M 534 234 L 529 230.5 L 529 237.5 Z" fill="#a33a28"/><text x="656" y="222" font-size="12.5" fill="#2e6b3f">R1 reads barcode + UMI; R2 sense</text><text x="40" y="266" font-size="12.5" fill="#8a8f94">Arrows: Read 1 (orange) and Read 2 (red) drawn on a fragment cut from the transcript.</text>
</svg>
