<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 270" width="780" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="270" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Why the adapter is forked: the flow cell needs different ends.</text><text x="40" y="58" font-size="13.5" fill="#23282d">One straight adapter, ligated to both ends</text><rect x="40" y="68" width="90" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="84.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5 adapter</text><rect x="130" y="68" width="150" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="205.0" y="84.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="280" y="68" width="90" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="325.0" y="84.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5 adapter′</text><text x="394" y="86" font-size="18" text-anchor="middle" fill="#a33a28">&#215;</text><text x="414" y="85" font-size="13" fill="#a33a28">P5-type at both ends: cannot bridge, no cluster</text><text x="40" y="128" font-size="13.5" fill="#23282d">A forked adapter, ligated to both ends</text><rect x="40" y="138" width="90" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="154.2" font-size="12" text-anchor="middle" fill="#1f3b57">P5 arm</text><rect x="130" y="138" width="150" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="205.0" y="154.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="280" y="138" width="90" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="325.0" y="154.2" font-size="12" text-anchor="middle" fill="#a33a28">P7′ arm</text><text x="394" y="156" font-size="18" text-anchor="middle" fill="#2e6b3f">&#10003;</text><text x="414" y="155" font-size="13" fill="#2e6b3f">P5 at one end, P7 at the other, on every strand</text><text x="40" y="198" font-size="13.5" fill="#23282d">Two straight adapters, A and B, ligated at random</text><rect x="40" y="208" width="36" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="58.0" y="224.2" font-size="12" text-anchor="middle" fill="#1f3b57">A</text><rect x="76" y="208" width="80" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="116.0" y="224.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="156" y="208" width="36" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="174.0" y="224.2" font-size="12" text-anchor="middle" fill="#1f3b57">A</text><text x="40" y="252" font-size="12.5" fill="#a33a28">A / A  25 %</text><rect x="240" y="208" width="36" height="24" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="258.0" y="224.2" font-size="12" text-anchor="middle" fill="#1f3b57">A</text><rect x="276" y="208" width="80" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="316.0" y="224.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="356" y="208" width="36" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="374.0" y="224.2" font-size="12" text-anchor="middle" fill="#a33a28">B</text><text x="240" y="252" font-size="12.5" fill="#2e6b3f">A / B  50 %</text><rect x="440" y="208" width="36" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="458.0" y="224.2" font-size="12" text-anchor="middle" fill="#a33a28">B</text><rect x="476" y="208" width="80" height="24" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="516.0" y="224.2" font-size="12" text-anchor="middle" fill="#8a8f94">insert</text><rect x="556" y="208" width="36" height="24" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="574.0" y="224.2" font-size="12" text-anchor="middle" fill="#a33a28">B</text><text x="440" y="252" font-size="12.5" fill="#a33a28">B / B  25 %</text><text x="650" y="228" font-size="13" fill="#a33a28">half is wasted</text>
</svg>
