<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 292" width="808" height="292" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="808" height="292" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">The molecule every Illumina library must end up as, drawn on one strand, 5′ to 3′.</text><rect x="60" y="52" width="84" height="32" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="102.0" y="72.55" font-size="13" text-anchor="middle" fill="#1f3b57">P5</text><rect x="144" y="52" width="60" height="32" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="174.0" y="72.55" font-size="13" text-anchor="middle" fill="#6b5b8a">i5</text><rect x="204" y="52" width="100" height="32" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="254.0" y="72.55" font-size="13" text-anchor="middle" fill="#8a8f94">Read 1 site</text><rect x="304" y="52" width="200" height="32" rx="4" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="404.0" y="72.55" font-size="13" text-anchor="middle" fill="#8a8f94">insert</text><rect x="504" y="52" width="100" height="32" rx="4" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="554.0" y="72.55" font-size="13" text-anchor="middle" fill="#8a8f94">Read 2 site</text><rect x="604" y="52" width="60" height="32" rx="4" fill="#efe9f3" stroke="#6b5b8a" stroke-width="1.2"/><text x="634.0" y="72.55" font-size="13" text-anchor="middle" fill="#6b5b8a">i7</text><rect x="664" y="52" width="84" height="32" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="706.0" y="72.55" font-size="13" text-anchor="middle" fill="#a33a28">P7</text><line x1="60" y1="100" x2="743" y2="100" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 748 100 L 743 96.5 L 743 103.5 Z" fill="#8a8f94"/><text x="60" y="118" font-size="12" fill="#8a8f94">5′</text><text x="748" y="118" font-size="12" text-anchor="end" fill="#8a8f94">3′</text><text x="102.0" y="118" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1</text><text x="174.0" y="118" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2</text><text x="254.0" y="118" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3</text><text x="404.0" y="118" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4</text><text x="554.0" y="118" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">5</text><text x="634.0" y="118" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">6</text><text x="706.0" y="118" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">7</text><text x="60" y="148" font-size="13" fill="#23282d">1  P5 · pairs with the P5 lawn oligo, so this end can start a cluster</text><text x="60" y="167" font-size="13" fill="#23282d">2  i5 · sample index, read as Index 2</text><text x="60" y="186" font-size="13" fill="#23282d">3  Read 1 site · where the Read 1 primer anneals; the read starts just after it</text><text x="60" y="205" font-size="13" fill="#b4532a">4  insert · the sample's DNA or cDNA, the only part of the molecule nobody designed</text><text x="60" y="224" font-size="13" fill="#23282d">5  Read 2 site · where the Read 2 primer anneals, from the other end</text><text x="60" y="243" font-size="13" fill="#23282d">6  i7 · sample index, read as Index 1</text><text x="60" y="262" font-size="13" fill="#23282d">7  P7 · pairs with the P7 lawn oligo, so the other end can bridge</text>
</svg>
