<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 325" width="728" height="325" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="325" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Dose and time: more crosslinking is more signal until it is less of everything else.</text><line x1="60" y1="206" x2="380" y2="206" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><line x1="60" y1="56" x2="60" y2="206" stroke="#8a8f94" stroke-width="1.2" stroke-linecap="round"/><path d="M 60.0 206.0 L 68.0 194.5 L 76.0 183.8 L 84.0 174.0 L 92.0 164.9 L 100.0 156.5 L 108.0 148.8 L 116.0 141.7 L 124.0 135.1 L 132.0 129.0 L 140.0 123.4 L 148.0 118.2 L 156.0 113.4 L 164.0 109.0 L 172.0 104.9 L 180.0 101.2 L 188.0 97.7 L 196.0 94.5 L 204.0 91.5 L 212.0 88.8 L 220.0 86.3 L 228.0 84.0 L 236.0 81.8 L 244.0 79.8 L 252.0 78.0 L 260.0 76.3 L 268.0 74.7 L 276.0 73.3 L 284.0 72.0 L 292.0 70.7 L 300.0 69.6 L 308.0 68.6 L 316.0 67.6 L 324.0 66.7 L 332.0 65.9 L 340.0 65.1 L 348.0 64.4 L 356.0 63.8 L 364.0 63.2 L 372.0 62.6 L 380.0 62.1" stroke="#2e6b3f" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M 60.0 56.0 L 68.0 64.7 L 76.0 73.0 L 84.0 80.7 L 92.0 88.0 L 100.0 94.9 L 108.0 101.3 L 116.0 107.4 L 124.0 113.2 L 132.0 118.6 L 140.0 123.7 L 148.0 128.5 L 156.0 133.0 L 164.0 137.2 L 172.0 141.2 L 180.0 145.0 L 188.0 148.6 L 196.0 151.9 L 204.0 155.1 L 212.0 158.0 L 220.0 160.8 L 228.0 163.5 L 236.0 165.9 L 244.0 168.3 L 252.0 170.5 L 260.0 172.5 L 268.0 174.5 L 276.0 176.3 L 284.0 178.0 L 292.0 179.7 L 300.0 181.2 L 308.0 182.6 L 316.0 184.0 L 324.0 185.3 L 332.0 186.5 L 340.0 187.6 L 348.0 188.7 L 356.0 189.7 L 364.0 190.7 L 372.0 191.6 L 380.0 192.4" stroke="#a33a28" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4"/><text x="220.0" y="228" font-size="12.5" text-anchor="middle" fill="#8a8f94">formaldehyde dose × time</text><line x1="152" y1="56" x2="152" y2="206" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="3 3"/><text x="156" y="198" font-size="12" fill="#b4532a">the window</text><line x1="60" y1="250" x2="84" y2="250" stroke="#2e6b3f" stroke-width="2.2" stroke-linecap="round"/><text x="92" y="254" font-size="12" fill="#2e6b3f">specific signal recovered</text><line x1="240" y1="250" x2="264" y2="250" stroke="#a33a28" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="5 4"/><text x="272" y="254" font-size="12" fill="#a33a28">shearing and epitope access</text><text x="420" y="62" font-size="13" fill="#23282d">A common chromatin starting point</text><text x="420" y="86" font-size="12.5" fill="#8a8f94">– 1% formaldehyde, 10 min, room temperature</text><text x="420" y="108" font-size="12.5" fill="#8a8f94">– quench with 125 mM glycine, which stops it</text><text x="420" y="130" font-size="12.5" fill="#8a8f94">– sonicate to a few hundred base pairs</text><text x="420" y="152" font-size="12.5" fill="#8a8f94">– reverse at 65 °C, then proteinase K</text><text x="420" y="190" font-size="12.5" fill="#a33a28">Crosslinking does not stop when the clock does.</text><text x="420" y="210" font-size="12.5" fill="#a33a28">It stops when the quench goes in.</text><text x="36" y="292" font-size="14" fill="#b4532a">Fixation is not an on/off step but a titration, and the right point depends on the</text><text x="36" y="311" font-size="14" fill="#b4532a">target, the cell type and the shearing that follows.</text>
</svg>
