<text x="30" y="26" font-size="14" fill="#23282d">Why a second reagent: the factor you want may never touch the DNA.</text><text x="30" y="56" font-size="13" fill="#8a8f94">Formaldehyde alone</text><line x1="30" y1="150" x2="260" y2="150" stroke="#1f3b57" stroke-width="2.0" stroke-linecap="round"/><line x1="30" y1="162" x2="260" y2="162" stroke="#1f3b57" stroke-width="2.0" stroke-linecap="round"/><line x1="41" y1="151" x2="41" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="52" y1="151" x2="52" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="63" y1="151" x2="63" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="74" y1="151" x2="74" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="85" y1="151" x2="85" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="96" y1="151" x2="96" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="107" y1="151" x2="107" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="118" y1="151" x2="118" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="129" y1="151" x2="129" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="140" y1="151" x2="140" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="151" y1="151" x2="151" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="162" y1="151" x2="162" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="173" y1="151" x2="173" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="184" y1="151" x2="184" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="195" y1="151" x2="195" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="206" y1="151" x2="206" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="217" y1="151" x2="217" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="228" y1="151" x2="228" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="239" y1="151" x2="239" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><circle cx="80" cy="142" r="17" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.8"/><text x="80" y="146.5" font-size="11.5" text-anchor="middle" fill="#2e6b3f">A</text><line x1="80" y1="159" x2="80" y2="150" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><circle cx="150" cy="104" r="19" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.8"/><text x="150" y="108.5" font-size="11.5" text-anchor="middle" fill="#2e6b3f">B</text><text x="30" y="188" font-size="12" fill="#2e6b3f">A is held to the DNA</text><text x="30" y="206" font-size="12" fill="#a33a28">B touches A, not the DNA, and is</text><text x="30" y="224" font-size="12" fill="#a33a28">lost in the first wash</text><text x="330" y="56" font-size="13" fill="#8a8f94">DSG first, then formaldehyde</text><line x1="330" y1="150" x2="560" y2="150" stroke="#1f3b57" stroke-width="2.0" stroke-linecap="round"/><line x1="330" y1="162" x2="560" y2="162" stroke="#1f3b57" stroke-width="2.0" stroke-linecap="round"/><line x1="341" y1="151" x2="341" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="352" y1="151" x2="352" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="363" y1="151" x2="363" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="374" y1="151" x2="374" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="385" y1="151" x2="385" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="396" y1="151" x2="396" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="407" y1="151" x2="407" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="418" y1="151" x2="418" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="429" y1="151" x2="429" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="440" y1="151" x2="440" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="451" y1="151" x2="451" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="462" y1="151" x2="462" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="473" y1="151" x2="473" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="484" y1="151" x2="484" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="495" y1="151" x2="495" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="506" y1="151" x2="506" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="517" y1="151" x2="517" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="528" y1="151" x2="528" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><line x1="539" y1="151" x2="539" y2="161" stroke="#8a8f94" stroke-width="0.9" stroke-linecap="round"/><circle cx="380" cy="142" r="17" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.8"/><text x="380" y="146.5" font-size="11.5" text-anchor="middle" fill="#2e6b3f">A</text><line x1="380" y1="159" x2="380" y2="150" stroke="#b4532a" stroke-width="2.6" stroke-linecap="round"/><circle cx="450" cy="104" r="19" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.8"/><text x="450" y="108.5" font-size="11.5" text-anchor="middle" fill="#2e6b3f">B</text><line x1="395" y1="131" x2="434" y2="114" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="round"/><circle cx="395" cy="131" r="3.5" fill="#1f3b57"/><circle cx="434" cy="114" r="3.5" fill="#1f3b57"/><text x="330" y="188" font-size="12" fill="#2e6b3f">DSG bridges amine to amine over</text><text x="330" y="206" font-size="12" fill="#2e6b3f">7.7 Å, so B is tethered to A</text><text x="330" y="224" font-size="12" fill="#2e6b3f">An antibody against B now pulls A's DNA</text><text x="30" y="258" font-size="14" fill="#b4532a">Two reagents, two jobs: the long arm holds the protein assembly together, the short arm pins it</text><text x="30" y="277" font-size="14" fill="#b4532a">to the nucleic acid. Heat does not break the DSG bond, but proteinase K digests the proteins it</text><text x="30" y="296" font-size="14" fill="#b4532a">joined.</text>
</svg>
