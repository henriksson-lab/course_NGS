<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 301" width="728" height="301" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="660" height="301" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">What a reagent can join is set by how far its arms reach.</text><text x="36" y="67" font-size="13" fill="#23282d">UV, 254 nm</text><line x1="176" y1="62" x2="176" y2="63" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><circle cx="176" cy="62" r="4" fill="#6b4e8f"/><circle cx="176" cy="62" r="4" fill="#6b4e8f"/><text x="400" y="67" font-size="12.5" fill="#6b4e8f">0 Å</text><text x="452" y="67" font-size="11.5" fill="#8a8f94">no linker at all</text><text x="36" y="101" font-size="13" fill="#23282d">formaldehyde</text><line x1="176" y1="96" x2="176" y2="97" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="176" y1="96" x2="205.9" y2="96" stroke="#b4532a" stroke-width="5" stroke-linecap="round"/><circle cx="176" cy="96" r="4" fill="#b4532a"/><circle cx="205.9" cy="96" r="4" fill="#b4532a"/><text x="400" y="101" font-size="12.5" fill="#b4532a">2.3 Å</text><text x="452" y="101" font-size="11.5" fill="#8a8f94">one carbon</text><text x="36" y="135" font-size="13" fill="#23282d">DSG</text><line x1="176" y1="130" x2="176" y2="131" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="176" y1="130" x2="276.1" y2="130" stroke="#1f3b57" stroke-width="5" stroke-linecap="round"/><circle cx="176" cy="130" r="4" fill="#1f3b57"/><circle cx="276.1" cy="130" r="4" fill="#1f3b57"/><text x="400" y="135" font-size="12.5" fill="#1f3b57">7.7 Å</text><text x="452" y="135" font-size="11.5" fill="#8a8f94">glutarate</text><text x="36" y="169" font-size="13" fill="#23282d">DSS</text><line x1="176" y1="164" x2="176" y2="165" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="176" y1="164" x2="324.20000000000005" y2="164" stroke="#1f3b57" stroke-width="5" stroke-linecap="round"/><circle cx="176" cy="164" r="4" fill="#1f3b57"/><circle cx="324.20000000000005" cy="164" r="4" fill="#1f3b57"/><text x="400" y="169" font-size="12.5" fill="#1f3b57">11.4 Å</text><text x="452" y="169" font-size="11.5" fill="#8a8f94">suberate</text><text x="36" y="203" font-size="13" fill="#23282d">EGS</text><line x1="176" y1="198" x2="176" y2="199" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><line x1="176" y1="198" x2="385.3" y2="198" stroke="#1f3b57" stroke-width="5" stroke-linecap="round"/><circle cx="176" cy="198" r="4" fill="#1f3b57"/><circle cx="385.3" cy="198" r="4" fill="#1f3b57"/><text x="400" y="203" font-size="12.5" fill="#1f3b57">16.1 Å</text><text x="452" y="203" font-size="11.5" fill="#8a8f94">ethylene glycol bis</text><text x="36" y="242" font-size="12" fill="#8a8f94">Spacer-arm figures are the lengths quoted on crosslinker datasheets; the formaldehyde value is the bridge itself.</text><text x="36" y="268" font-size="14" fill="#b4532a">A short arm reports contact. A long arm reports a neighbourhood, and cannot tell you which</text><text x="36" y="287" font-size="14" fill="#b4532a">protein was touching which.</text>
</svg>
