<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 709 291" width="709" height="291" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="620" height="291" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">A crosslinker datasheet answers four questions, and they decide the protocol.</text><rect x="30" y="50" width="116" height="27" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="88.0" y="67.7" font-size="12" text-anchor="middle" fill="#23282d">reagent</text><rect x="146" y="50" width="136" height="27" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="214.0" y="67.7" font-size="12" text-anchor="middle" fill="#23282d">joins</text><rect x="282" y="50" width="58" height="27" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="311.0" y="67.7" font-size="12" text-anchor="middle" fill="#23282d">arm</text><rect x="340" y="50" width="104" height="27" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="392.0" y="67.7" font-size="12" text-anchor="middle" fill="#23282d">cell permeable</text><rect x="444" y="50" width="136" height="27" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="512.0" y="67.7" font-size="12" text-anchor="middle" fill="#23282d">reversed by</text><rect x="30" y="77" width="116" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="88.0" y="94.7" font-size="12" text-anchor="middle" fill="#23282d">formaldehyde</text><rect x="146" y="77" width="136" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="214.0" y="94.7" font-size="12" text-anchor="middle" fill="#23282d">amine to amine</text><rect x="282" y="77" width="58" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="311.0" y="94.7" font-size="12" text-anchor="middle" fill="#23282d">2.3 Å</text><rect x="340" y="77" width="104" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="392.0" y="94.7" font-size="12" text-anchor="middle" fill="#23282d">yes</text><rect x="444" y="77" width="136" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="512.0" y="94.7" font-size="12" text-anchor="middle" fill="#23282d">heat, 65 °C</text><rect x="30" y="104" width="116" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="88.0" y="121.7" font-size="12" text-anchor="middle" fill="#23282d">DSG</text><rect x="146" y="104" width="136" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="214.0" y="121.7" font-size="12" text-anchor="middle" fill="#23282d">amine to amine</text><rect x="282" y="104" width="58" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="311.0" y="121.7" font-size="12" text-anchor="middle" fill="#23282d">7.7 Å</text><rect x="340" y="104" width="104" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="392.0" y="121.7" font-size="12" text-anchor="middle" fill="#23282d">yes</text><rect x="444" y="104" width="136" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="512.0" y="121.7" font-size="12" text-anchor="middle" fill="#23282d">nothing (protease)</text><rect x="30" y="131" width="116" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="88.0" y="148.7" font-size="12" text-anchor="middle" fill="#23282d">DSS</text><rect x="146" y="131" width="136" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="214.0" y="148.7" font-size="12" text-anchor="middle" fill="#23282d">amine to amine</text><rect x="282" y="131" width="58" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="311.0" y="148.7" font-size="12" text-anchor="middle" fill="#23282d">11.4 Å</text><rect x="340" y="131" width="104" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="392.0" y="148.7" font-size="12" text-anchor="middle" fill="#23282d">yes</text><rect x="444" y="131" width="136" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="512.0" y="148.7" font-size="12" text-anchor="middle" fill="#23282d">nothing (protease)</text><rect x="30" y="158" width="116" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="88.0" y="175.7" font-size="12" text-anchor="middle" fill="#23282d">DSP</text><rect x="146" y="158" width="136" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="214.0" y="175.7" font-size="12" text-anchor="middle" fill="#23282d">amine to amine</text><rect x="282" y="158" width="58" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="311.0" y="175.7" font-size="12" text-anchor="middle" fill="#23282d">12.0 Å</text><rect x="340" y="158" width="104" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="392.0" y="175.7" font-size="12" text-anchor="middle" fill="#23282d">yes</text><rect x="444" y="158" width="136" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="512.0" y="175.7" font-size="12" text-anchor="middle" fill="#23282d">a reducing agent</text><rect x="30" y="185" width="116" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="88.0" y="202.7" font-size="12" text-anchor="middle" fill="#23282d">UV 254 nm</text><rect x="146" y="185" width="136" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="214.0" y="202.7" font-size="12" text-anchor="middle" fill="#23282d">base to side chain</text><rect x="282" y="185" width="58" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="311.0" y="202.7" font-size="12" text-anchor="middle" fill="#23282d">0 Å</text><rect x="340" y="185" width="104" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="392.0" y="202.7" font-size="12" text-anchor="middle" fill="#23282d">no reagent</text><rect x="444" y="185" width="136" height="27" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="512.0" y="202.7" font-size="12" text-anchor="middle" fill="#23282d">nothing</text><text x="30" y="232" font-size="12" fill="#8a8f94">Charged NHS esters such as BS3 do not cross a membrane, so they label surfaces rather than nuclei.</text><text x="30" y="258" font-size="14" fill="#b4532a">Four questions answer themselves from the table: can it reach, can it get in, what will it hit,</text><text x="30" y="277" font-size="14" fill="#b4532a">and can you get rid of it afterwards.</text>
</svg>
