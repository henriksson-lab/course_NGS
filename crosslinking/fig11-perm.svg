<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 719 331" width="719" height="331" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="680" height="331" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Permeabilisation pulls against fixation: hold things in, let enzymes in.</text><circle cx="110" cy="112" r="52" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.8"/><rect x="172" y="100" width="26" height="24" rx="4" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="185.0" y="116.2" font-size="12" text-anchor="middle" fill="#b4532a">E</text><circle cx="133.0" cy="131.3" r="4" fill="#8a8f94"/><circle cx="87.0" cy="131.3" r="4" fill="#8a8f94"/><circle cx="95.0" cy="86.0" r="4" fill="#8a8f94"/><circle cx="133.0" cy="92.7" r="4" fill="#8a8f94"/><text x="110" y="182" font-size="13" text-anchor="middle" fill="#1f3b57">under-permeabilised</text><text x="110" y="200" font-size="11.5" text-anchor="middle" fill="#8a8f94">enzyme stays outside</text><text x="110" y="218" font-size="11.5" text-anchor="middle" fill="#8a8f94">few molecules captured</text><circle cx="310" cy="112" r="52" fill="#e3efe6" stroke="#2e6b3f" stroke-width="2.6"/><rect x="296" y="100" width="26" height="24" rx="4" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="309.0" y="116.2" font-size="12" text-anchor="middle" fill="#b4532a">E</text><circle cx="334.5" cy="132.6" r="4" fill="#8a8f94"/><circle cx="285.5" cy="132.6" r="4" fill="#8a8f94"/><circle cx="294.0" cy="84.3" r="4" fill="#8a8f94"/><circle cx="334.5" cy="91.4" r="4" fill="#8a8f94"/><text x="310" y="182" font-size="13" text-anchor="middle" fill="#2e6b3f">the window</text><text x="310" y="200" font-size="11.5" text-anchor="middle" fill="#8a8f94">enzyme in, contents in</text><text x="310" y="218" font-size="11.5" text-anchor="middle" fill="#8a8f94">what the step is titrated for</text><circle cx="510" cy="112" r="52" fill="#f4e0dc" stroke="#a33a28" stroke-width="1.8"/><rect x="496" y="100" width="26" height="24" rx="4" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="509.0" y="116.2" font-size="12" text-anchor="middle" fill="#b4532a">E</text><circle cx="570.6" cy="147.0" r="4" fill="#a33a28"/><circle cx="449.4" cy="147.0" r="4" fill="#a33a28"/><circle cx="510.0" cy="42.0" r="4" fill="#a33a28"/><text x="510" y="182" font-size="13" text-anchor="middle" fill="#a33a28">over-permeabilised</text><text x="510" y="200" font-size="11.5" text-anchor="middle" fill="#8a8f94">contents diffuse out</text><text x="510" y="218" font-size="11.5" text-anchor="middle" fill="#8a8f94">signal spreads or is lost</text><text x="30" y="250" font-size="12.5" fill="#23282d">The dial is the detergent and the time: digitonin binds cholesterol and largely spares the nuclear membrane,</text><text x="30" y="270" font-size="12.5" fill="#23282d">NP-40 and IGEPAL are the same stronger non-ionic detergent under two names, Tween-20 is milder.</text><text x="30" y="298" font-size="14" fill="#b4532a">Crosslinks make the membrane harder to open and the enzyme's path narrower, so the two steps</text><text x="30" y="317" font-size="14" fill="#b4532a">have to be optimised together.</text>
</svg>
