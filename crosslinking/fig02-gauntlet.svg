<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 701 216" width="701" height="216" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="640" height="216" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">The bond is asked to hold through every step that destroys the cell.</text><rect x="36" y="56" width="100" height="46" rx="4" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.2"/><text x="86" y="76" font-size="13.5" text-anchor="middle" fill="#1f3b57">lyse</text><text x="86" y="93" font-size="11.5" text-anchor="middle" fill="#8a8f94">detergent</text><line x1="139" y1="79" x2="146" y2="79" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 151 79 L 146 75.5 L 146 82.5 Z" fill="#8a8f94"/><rect x="154" y="56" width="100" height="46" rx="4" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.2"/><text x="204" y="76" font-size="13.5" text-anchor="middle" fill="#1f3b57">shear</text><text x="204" y="93" font-size="11.5" text-anchor="middle" fill="#8a8f94">sonication</text><line x1="257" y1="79" x2="264" y2="79" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 269 79 L 264 75.5 L 264 82.5 Z" fill="#8a8f94"/><rect x="272" y="56" width="100" height="46" rx="4" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.2"/><text x="322" y="76" font-size="13.5" text-anchor="middle" fill="#1f3b57">wash</text><text x="322" y="93" font-size="11.5" text-anchor="middle" fill="#8a8f94">0.5 M salt</text><line x1="375" y1="79" x2="382" y2="79" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 387 79 L 382 75.5 L 382 82.5 Z" fill="#8a8f94"/><rect x="390" y="56" width="100" height="46" rx="4" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.2"/><text x="440" y="76" font-size="13.5" text-anchor="middle" fill="#1f3b57">elute</text><text x="440" y="93" font-size="11.5" text-anchor="middle" fill="#8a8f94">1% SDS, 65 °C</text><line x1="493" y1="79" x2="500" y2="79" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 505 79 L 500 75.5 L 500 82.5 Z" fill="#8a8f94"/><rect x="508" y="56" width="100" height="46" rx="4" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="558" y="76" font-size="13.5" text-anchor="middle" fill="#b4532a">reverse</text><text x="558" y="93" font-size="11.5" text-anchor="middle" fill="#8a8f94">on purpose</text><text x="36" y="132" font-size="13" fill="#a33a28">A non-covalent contact survives none of these.</text><text x="36" y="154" font-size="13" fill="#2e6b3f">A covalent bond survives the first four, which is why the fifth has to be a step of its own.</text><text x="36" y="186" font-size="14" fill="#b4532a">This is the whole argument for the block: the bond is not the point, surviving the workup is.</text>
</svg>
