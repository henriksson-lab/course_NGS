<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 705 263" width="705" height="263" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="690" height="263" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Formaldehyde joins two amines in two steps, through a one-carbon bridge.</text><rect x="26" y="56" width="150" height="44" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="101" y="72" font-size="11.5" text-anchor="middle" fill="#8a8f94">lysine side chain</text><text x="101" y="90" font-size="13.5" text-anchor="middle" fill="#2e6b3f">Pro–NH2</text><text x="196" y="82" font-size="14" fill="#8a8f94">+</text><rect x="216" y="56" width="96" height="44" rx="4" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="264" y="72" font-size="11.5" text-anchor="middle" fill="#8a8f94">formaldehyde</text><text x="264" y="90" font-size="13.5" text-anchor="middle" fill="#b4532a">H2C=O</text><line x1="322" y1="78" x2="363" y2="78" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 368 78 L 363 74.5 L 363 81.5 Z" fill="#8a8f94"/><text x="345" y="68" font-size="11" text-anchor="middle" fill="#8a8f94">fast</text><rect x="376" y="56" width="170" height="44" rx="4" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="461" y="72" font-size="11.5" text-anchor="middle" fill="#8a8f94">methylol adduct, reversible</text><text x="461" y="90" font-size="13.5" text-anchor="middle" fill="#b4532a">Pro–NH–CH2–OH</text><text x="26" y="138" font-size="13" fill="#23282d">then the adduct finds a second amine that is already touching it:</text><rect x="26" y="158" width="170" height="44" rx="4" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="111" y="174" font-size="13.5" text-anchor="middle" fill="#b4532a">Pro–NH–CH2–OH</text><text x="216" y="184" font-size="14" fill="#8a8f94">+</text><rect x="236" y="158" width="150" height="44" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="311" y="174" font-size="13.5" text-anchor="middle" fill="#1f3b57">H2N–cytosine</text><text x="311" y="192" font-size="11" text-anchor="middle" fill="#8a8f94">or a second lysine</text><line x1="396" y1="180" x2="437" y2="180" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 442 180 L 437 176.5 L 437 183.5 Z" fill="#8a8f94"/><text x="419" y="170" font-size="11" text-anchor="middle" fill="#8a8f94">slow</text><rect x="450" y="158" width="210" height="44" rx="4" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.2"/><text x="555" y="174" font-size="13" text-anchor="middle" fill="#2e6b3f">Pro–NH–CH2–NH–cytosine</text><text x="555" y="192" font-size="11" text-anchor="middle" fill="#8a8f94">methylene bridge, plus water</text><text x="26" y="230" font-size="14" fill="#b4532a">The bridge is one carbon long, so the two amines must already be in contact. Heating hydrolyses</text><text x="26" y="249" font-size="14" fill="#b4532a">it again, which is why formaldehyde is the reversible case.</text>
</svg>
