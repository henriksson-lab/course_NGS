<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 332" width="760" height="332" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="332" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Three methods are shaped by the decision not to crosslink at all.</text><rect x="30" y="56" width="220" height="118" rx="4" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.2"/><text x="140" y="82" font-size="14" text-anchor="middle" fill="#1f3b57">ATAC-seq</text><text x="140" y="102" font-size="12" text-anchor="middle" fill="#8a8f94">nuclei, no fixation</text><text x="42" y="126.0" font-size="11.5" fill="#23282d">Tn5 needs open chromatin, and</text><text x="42" y="142.5" font-size="11.5" fill="#23282d">a crosslink closes it</text><rect x="270" y="56" width="220" height="118" rx="4" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.2"/><text x="380" y="82" font-size="14" text-anchor="middle" fill="#2e6b3f">CUT&amp;RUN</text><text x="380" y="102" font-size="12" text-anchor="middle" fill="#8a8f94">permeabilised, not fixed</text><text x="282" y="126.0" font-size="11.5" fill="#23282d">the antibody binds a native</text><text x="282" y="142.5" font-size="11.5" fill="#23282d">epitope; cut fragments diffuse</text><text x="282" y="159.0" font-size="11.5" fill="#23282d">out</text><rect x="510" y="56" width="220" height="118" rx="4" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.2"/><text x="620" y="82" font-size="14" text-anchor="middle" fill="#2e6b3f">CUT&amp;Tag</text><text x="620" y="102" font-size="12" text-anchor="middle" fill="#8a8f94">permeabilised, not fixed</text><text x="522" y="126.0" font-size="11.5" fill="#23282d">pA-Tn5 tagments in place, so</text><text x="522" y="142.5" font-size="11.5" fill="#23282d">no chromatin release is needed</text><text x="30" y="200" font-size="13" fill="#23282d">What they pay instead</text><text x="30" y="222" font-size="12.5" fill="#8a8f94">– the target must survive native conditions, so weakly bound factors are under-reported</text><text x="30" y="242" font-size="12.5" fill="#8a8f94">– the epitope must work without fixation, which is a different antibody-validation problem</text><text x="30" y="262" font-size="12.5" fill="#8a8f94">– fixed or archival material cannot be used at all</text><text x="30" y="296" font-size="14" fill="#b4532a">Each of these is a protocol built around the costs on the previous slide. Some targets and some</text><text x="30" y="315" font-size="14" fill="#b4532a">samples leave no choice in either direction.</text>
</svg>
