<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 745 300" width="745" height="300" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="300" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">UV makes the bond the molecules were already close enough to make.</text><text x="30" y="50" font-size="13" fill="#8a8f94">254 nm, absorbed by the base itself</text><path d="M 36 136 C 70 116, 110 156, 150 136 C 190 116, 230 156, 266 136" stroke="#1f3b57" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="36" y="166" font-size="12" fill="#1f3b57">single-stranded RNA</text><circle cx="150" cy="100" r="20" fill="#ece7f3" stroke="#6b4e8f" stroke-width="1.8"/><text x="150" y="104.5" font-size="11.5" text-anchor="middle" fill="#6b4e8f">RBP</text><line x1="214" y1="74" x2="206" y2="88" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="228" y1="74" x2="220" y2="88" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="242" y1="74" x2="234" y2="88" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><line x1="256" y1="74" x2="248" y2="88" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><text x="276" y="78" font-size="11.5" fill="#b4532a">UV photons</text><line x1="286" y1="124" x2="321" y2="124" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 326 124 L 321 120.5 L 321 127.5 Z" fill="#8a8f94"/><path d="M 340 136 C 374 116, 414 156, 454 136 C 494 116, 534 156, 570 136" stroke="#1f3b57" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="454" cy="100" r="20" fill="#ece7f3" stroke="#6b4e8f" stroke-width="1.8"/><text x="454" y="104.5" font-size="11.5" text-anchor="middle" fill="#6b4e8f">RBP</text><line x1="454" y1="120" x2="454" y2="128" stroke="#b4532a" stroke-width="3.4" stroke-linecap="round"/><circle cx="454" cy="124" r="3.5" fill="#b4532a"/><text x="340" y="166" font-size="12" fill="#b4532a">one direct bond, no linker between them</text><text x="340" y="186" font-size="12" fill="#8a8f94">nothing one atom away is joined</text><text x="30" y="220" font-size="13" fill="#23282d">Proteinase K then cuts the protein away, but not the bond:</text><path d="M 36 260 C 70 240, 110 280, 150 260" stroke="#1f3b57" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="94" cy="250" r="4" fill="#b4532a"/><rect x="104" y="230" width="86" height="20" rx="4" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="147.0" y="243.85" font-size="11" text-anchor="middle" fill="#b4532a">peptide stub</text><text x="206" y="256" font-size="12.5" fill="#b4532a">the stub stays on the crosslinked nucleotide, and the reverse transcriptase meets it</text><text x="206" y="276" font-size="12.5" fill="#b4532a">as a stop or a mis-insertion: the crosslink has become the readout</text>
</svg>
