<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 282" width="780" height="282" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="282" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">The five costs, and what each one looks like in the data.</text><rect x="30" y="50" width="150" height="28" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="105.0" y="68.2" font-size="12" text-anchor="middle" fill="#23282d">cost</text><rect x="180" y="50" width="300" height="28" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="330.0" y="68.2" font-size="12" text-anchor="middle" fill="#23282d">what happens</text><rect x="480" y="50" width="282" height="28" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="621.0" y="68.2" font-size="12" text-anchor="middle" fill="#23282d">what you see</text><rect x="30" y="78" width="150" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="105.0" y="96.2" font-size="12" text-anchor="middle" fill="#23282d">epitope masking</text><rect x="180" y="78" width="300" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="330.0" y="96.2" font-size="12" text-anchor="middle" fill="#23282d">the amine the antibody needs is bridged</text><rect x="480" y="78" width="282" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="621.0" y="96.2" font-size="12" text-anchor="middle" fill="#23282d">no enrichment with a validated antibody</text><rect x="30" y="106" width="150" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="105.0" y="124.2" font-size="12" text-anchor="middle" fill="#23282d">over-fixation</text><rect x="180" y="106" width="300" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="330.0" y="124.2" font-size="12" text-anchor="middle" fill="#23282d">chromatin will not shear or solubilise</text><rect x="480" y="106" width="282" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="621.0" y="124.2" font-size="12" text-anchor="middle" fill="#23282d">low yield, fragments far too long</text><rect x="30" y="134" width="150" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="105.0" y="152.2" font-size="12" text-anchor="middle" fill="#23282d">lost accessibility</text><rect x="180" y="134" width="300" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="330.0" y="152.2" font-size="12" text-anchor="middle" fill="#23282d">enzyme or oligo cannot reach the target</text><rect x="480" y="134" width="282" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="621.0" y="152.2" font-size="12" text-anchor="middle" fill="#23282d">weak signal that more cycles do not rescue</text><rect x="30" y="162" width="150" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="105.0" y="180.2" font-size="12" text-anchor="middle" fill="#23282d">chimeras</text><rect x="180" y="162" width="300" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="330.0" y="180.2" font-size="12" text-anchor="middle" fill="#23282d">two separate complexes are joined as one</text><rect x="480" y="162" width="282" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="621.0" y="180.2" font-size="12" text-anchor="middle" fill="#23282d">junctions between unrelated places</text><rect x="30" y="190" width="150" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="105.0" y="208.2" font-size="12" text-anchor="middle" fill="#23282d">nucleic-acid damage</text><rect x="180" y="190" width="300" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="330.0" y="208.2" font-size="12" text-anchor="middle" fill="#23282d">65 °C and UV both attack the backbone</text><rect x="480" y="190" width="282" height="28" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="621.0" y="208.2" font-size="12" text-anchor="middle" fill="#23282d">short inserts, low complexity</text><text x="30" y="240" font-size="14" fill="#b4532a">Four of the five are made worse by the same thing, more crosslinking, and the fifth by the step</text><text x="30" y="259" font-size="14" fill="#b4532a">that undoes it. There is no setting at which none of them applies.</text>
</svg>
