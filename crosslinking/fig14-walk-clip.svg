<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" width="1000" height="364" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="1000" height="364" fill="none"/>
<text x="34" y="26" font-size="14" fill="#23282d">UV CLIP: the ChIP walk step for step, and the one step that cannot exist.</text><text x="34" y="65" font-size="12" fill="#23282d">1  irradiate: UV-C 254 nm, on ice</text><rect x="300" y="50" width="300" height="22" rx="3" fill="#ece7f3" stroke="#6b4e8f" stroke-width="1.2"/><text x="450.0" y="65.025" font-size="11.5" text-anchor="middle" fill="#6b4e8f">intact cells, RNA bonded to touching protein</text><text x="620" y="65" font-size="11.5" fill="#8a8f94">zero-length bond, no linker</text><text x="34" y="97" font-size="12" fill="#23282d">2  (no quench: the lamp is the dose)</text><rect x="300" y="82" width="300" height="22" rx="3" fill="#ece7f3" stroke="#6b4e8f" stroke-width="1.2"/><text x="450.0" y="97.025" font-size="11.5" text-anchor="middle" fill="#6b4e8f">the same cells; the lamp is off</text><text x="620" y="97" font-size="11.5" fill="#8a8f94">nothing is left over to compete with</text><text x="34" y="129" font-size="12" fill="#23282d">3  lyse, release complexes</text><rect x="300" y="114" width="300" height="22" rx="3" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.2"/><text x="450.0" y="129.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">protein-RNA complexes in detergent</text><text x="620" y="129" font-size="11.5" fill="#8a8f94">membranes gone, crosslinks not</text><text x="34" y="161" font-size="12" fill="#23282d">4  partial RNase digestion</text><rect x="300" y="146" width="300" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="450.0" y="161.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">RNA trimmed to the protected footprint</text><text x="620" y="161" font-size="11.5" fill="#8a8f94">the fragmentation step, as sonication is for ChIP</text><text x="34" y="193" font-size="12" fill="#23282d">5  bind antibody, then beads</text><rect x="300" y="178" width="300" height="22" rx="3" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.2"/><text x="450.0" y="193.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">beads: one protein and its RNA</text><text x="620" y="193" font-size="11.5" fill="#8a8f94">the only selective step in the protocol</text><text x="34" y="225" font-size="12" fill="#23282d">6  wash hard, ligate the 3' adapter</text><rect x="300" y="210" width="56" height="22" rx="3" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="328.0" y="225.025" font-size="11.5" text-anchor="middle" fill="#b4532a">adapter</text><rect x="356" y="210" width="244" height="22" rx="3" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.2"/><text x="478.0" y="225.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">protein still attached to its RNA</text><text x="620" y="225" font-size="11.5" fill="#8a8f94">the adapter goes on before the protein leaves</text><text x="34" y="257" font-size="12" fill="#8a8f94">7  —  there is no reversal  —</text><rect x="300" y="242" width="300" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2" stroke-dasharray="5 4"/><text x="450" y="257" font-size="11.5" text-anchor="middle" fill="#8a8f94">no step here: the bond cannot be undone</text><text x="620" y="257" font-size="11.5" fill="#8a8f94">this is the step ChIP has and CLIP cannot</text><text x="34" y="289" font-size="12" fill="#23282d">8  proteinase K, then reverse transcribe</text><rect x="300" y="274" width="52" height="22" rx="3" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="326.0" y="289.025" font-size="11.5" text-anchor="middle" fill="#b4532a">stub</text><rect x="352" y="274" width="248" height="22" rx="3" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.2"/><text x="476.0" y="289.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">cDNA stops here, or mis-reads it</text><text x="620" y="289" font-size="11.5" fill="#8a8f94">the crosslink has become the measurement</text><text x="34" y="326.0" font-size="13.5" fill="#b4532a">ChIP throws the crosslink away and keeps the DNA. CLIP cannot throw it away, so it reads it instead. One</text><text x="34" y="344.5" font-size="13.5" fill="#b4532a">bond that will not come off, two opposite protocols.</text>
</svg>
