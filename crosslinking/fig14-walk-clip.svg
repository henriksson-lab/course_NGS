<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 332" width="1000" height="332" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="1000" height="332" fill="none"/>
<text x="34" y="26" font-size="14" fill="#23282d">UV CLIP, the same walk with the reversal removed.</text><text x="34" y="65" font-size="12" fill="#23282d">1  irradiate: UV-C, on ice</text><rect x="300" y="50" width="300" height="22" rx="3" fill="#ece7f3" stroke="#6b4e8f" stroke-width="1.2"/><text x="450.0" y="65.025" font-size="11.5" text-anchor="middle" fill="#6b4e8f">intact cells, RNA bonded to touching protein</text><text x="620" y="65" font-size="11.5" fill="#8a8f94">zero-length bond, no linker</text><text x="34" y="97" font-size="12" fill="#23282d">2  (no quench needed)</text><rect x="300" y="82" width="300" height="22" rx="3" fill="#ece7f3" stroke="#6b4e8f" stroke-width="1.2"/><text x="450.0" y="97.025" font-size="11.5" text-anchor="middle" fill="#6b4e8f">the same cells; the lamp is off</text><text x="620" y="97" font-size="11.5" fill="#8a8f94">the dose is the exposure</text><text x="34" y="129" font-size="12" fill="#23282d">3  lyse, partial RNase digestion</text><rect x="300" y="114" width="300" height="22" rx="3" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.2"/><text x="450.0" y="129.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">protein-RNA complexes, RNA trimmed to a footprint</text><text x="620" y="129" font-size="11.5" fill="#8a8f94">only bound RNA is protected</text><text x="34" y="161" font-size="12" fill="#23282d">4  immunoprecipitate, wash hard</text><rect x="300" y="146" width="300" height="22" rx="3" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.2"/><text x="450.0" y="161.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">beads: one protein and its RNA</text><text x="620" y="161" font-size="11.5" fill="#8a8f94">denaturing washes are survivable</text><text x="34" y="193" font-size="12" fill="#23282d">5  ligate the 3' adapter on the beads</text><rect x="300" y="178" width="40" height="22" rx="3" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="320.0" y="193.025" font-size="11.5" text-anchor="middle" fill="#b4532a">ad</text><rect x="340" y="178" width="260" height="22" rx="3" fill="#ece7f3" stroke="#6b4e8f" stroke-width="1.2"/><text x="470.0" y="193.025" font-size="11.5" text-anchor="middle" fill="#6b4e8f">footprint RNA, protein still attached</text><text x="620" y="193" font-size="11.5" fill="#8a8f94">the complex is still a complex</text><text x="34" y="225" font-size="12" fill="#23282d">6  proteinase K</text><rect x="300" y="210" width="40" height="22" rx="3" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="320.0" y="225.025" font-size="11.5" text-anchor="middle" fill="#b4532a">ad</text><rect x="340" y="210" width="260" height="22" rx="3" fill="#f4e0dc" stroke="#a33a28" stroke-width="1.2"/><text x="470.0" y="225.025" font-size="11.5" text-anchor="middle" fill="#a33a28">footprint RNA with a peptide stub</text><text x="620" y="225" font-size="11.5" fill="#8a8f94">no heat step will undo the bond</text><text x="34" y="257" font-size="12" fill="#23282d">7  reverse transcribe</text><rect x="300" y="242" width="300" height="22" rx="3" fill="#f4e0dc" stroke="#a33a28" stroke-width="1.2"/><text x="450.0" y="257.025" font-size="11.5" text-anchor="middle" fill="#a33a28">cDNA that stops at, or mis-reads, the stub</text><text x="620" y="257" font-size="11.5" fill="#8a8f94">the crosslink is now the measurement</text><text x="34" y="294.0" font-size="13.5" fill="#b4532a">ChIP throws the crosslink away and keeps the DNA. CLIP cannot throw it away, so it reads it instead. One</text><text x="34" y="312.5" font-size="13.5" fill="#b4532a">bond that will not come off, two opposite protocols.</text>
</svg>
