<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 364" width="1000" height="364" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="1000" height="364" fill="none"/>
<text x="34" y="26" font-size="14" fill="#23282d">Formaldehyde ChIP: what is in the tube after each step. HeLa cells, one antibody.</text><text x="34" y="65" font-size="12" fill="#23282d">1  fix: 1% formaldehyde, 10 min</text><rect x="300" y="50" width="300" height="22" rx="3" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="450.0" y="65.025" font-size="11.5" text-anchor="middle" fill="#b4532a">intact cells, chromatin now a covalent network</text><text x="620" y="65" font-size="11.5" fill="#8a8f94">every contact within one carbon is joined</text><text x="34" y="97" font-size="12" fill="#23282d">2  quench: 125 mM glycine</text><rect x="300" y="82" width="300" height="22" rx="3" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="450.0" y="97.025" font-size="11.5" text-anchor="middle" fill="#b4532a">the same cells, reaction stopped</text><text x="620" y="97" font-size="11.5" fill="#8a8f94">glycine competes for the aldehyde</text><text x="34" y="129" font-size="12" fill="#23282d">3  lyse, release nuclei</text><rect x="300" y="114" width="300" height="22" rx="3" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.2"/><text x="450.0" y="129.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">nuclei in detergent, crosslinks intact</text><text x="620" y="129" font-size="11.5" fill="#8a8f94">membranes gone, chromatin not</text><text x="34" y="161" font-size="12" fill="#23282d">4  sonicate</text><rect x="300" y="146" width="62" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><rect x="362" y="146" width="196" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="460.0" y="161.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">chromatin pieces, ~700 bp average</text><rect x="558" y="146" width="42" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="620" y="161" font-size="11.5" fill="#8a8f94">each piece still carries its proteins</text><text x="34" y="193" font-size="12" fill="#23282d">5  bind antibody, then beads</text><rect x="300" y="178" width="300" height="22" rx="3" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.2"/><text x="450.0" y="193.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">beads: pieces whose protein shows the epitope</text><text x="620" y="193" font-size="11.5" fill="#8a8f94">the only selective step in the protocol</text><text x="34" y="225" font-size="12" fill="#23282d">6  wash in rising salt</text><rect x="300" y="210" width="300" height="22" rx="3" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.2"/><text x="450.0" y="225.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">beads: the same pieces, less of everything else</text><text x="620" y="225" font-size="11.5" fill="#8a8f94">non-covalent passengers come off</text><text x="34" y="257" font-size="12" fill="#23282d">7  elute, reverse at 65 °C overnight</text><rect x="300" y="242" width="300" height="22" rx="3" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.2"/><text x="450.0" y="257.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">protein released from DNA, still in the tube</text><text x="620" y="257" font-size="11.5" fill="#8a8f94">methylene bridges hydrolysed</text><text x="34" y="289" font-size="12" fill="#23282d">8  RNase A, proteinase K, purify</text><rect x="300" y="274" width="300" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="450.0" y="289.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">naked DNA fragments, a few hundred bp</text><text x="620" y="289" font-size="11.5" fill="#8a8f94">now an ordinary input for end repair</text><text x="34" y="326.0" font-size="13.5" fill="#b4532a">The crosslink exists only between steps 1 and 7. Everything the protocol selects on happens while it is</text><text x="34" y="344.5" font-size="13.5" fill="#b4532a">there, and the library is built from what is left once it is gone.</text>
</svg>
