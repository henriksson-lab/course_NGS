<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 811 266" width="811" height="266" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="266" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">4-thiouridine moves the crosslink to a wavelength the cell tolerates.</text><rect x="30" y="60" width="148" height="54" rx="4" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="104" y="82" font-size="13" text-anchor="middle" fill="#b4532a">UV-C, 254 nm</text><text x="104" y="100" font-size="11" text-anchor="middle" fill="#8a8f94">zero length either way</text><line x1="182" y1="87" x2="209" y2="87" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 214 87 L 209 83.5 L 209 90.5 Z" fill="#8a8f94"/><text x="222" y="80" font-size="13" fill="#23282d">every pyrimidine absorbs</text><text x="222" y="100" font-size="12" fill="#8a8f94">also damages DNA and protein; irradiate on ice, briefly</text><rect x="30" y="136" width="148" height="54" rx="4" fill="#ece7f3" stroke="#6b4e8f" stroke-width="1.2"/><text x="104" y="158" font-size="13" text-anchor="middle" fill="#6b4e8f">UV-A, 365 nm</text><text x="104" y="176" font-size="11" text-anchor="middle" fill="#8a8f94">zero length either way</text><line x1="182" y1="163" x2="209" y2="163" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 214 163 L 209 159.5 L 209 166.5 Z" fill="#8a8f94"/><text x="222" y="156" font-size="13" fill="#23282d">only the thiol of 4sU absorbs</text><text x="222" y="176" font-size="12" fill="#8a8f94">cells feed on 4sU first, so the label marks new RNA as well</text><text x="30" y="222" font-size="13" fill="#23282d">Either way the bond cannot be undone, so the library is built around it rather than after it:</text><text x="30" y="246" font-size="13" fill="#b4532a">a truncation at the stub, or a mismatch read through it. The CLIP family differs mainly in which of the two it scores.</text>
</svg>
