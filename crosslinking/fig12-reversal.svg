<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 357" width="700" height="357" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="700" height="357" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Two different bonds, two different tools, in this order.</text><rect x="30" y="54" width="180" height="70" rx="4" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.2"/><text x="120" y="76" font-size="13" text-anchor="middle" fill="#b4532a">65 °C, overnight</text><text x="120" y="96" font-size="11.5" text-anchor="middle" fill="#8a8f94">hydrolyses the methylene</text><text x="120" y="112" font-size="11.5" text-anchor="middle" fill="#8a8f94">bridge: protein lets go</text><line x1="216" y1="89" x2="247" y2="89" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 252 89 L 247 85.5 L 247 92.5 Z" fill="#8a8f94"/><rect x="258" y="54" width="180" height="70" rx="4" fill="#e3efe6" stroke="#2e6b3f" stroke-width="1.2"/><text x="348" y="76" font-size="13" text-anchor="middle" fill="#2e6b3f">proteinase K, 45–55 °C</text><text x="348" y="96" font-size="11.5" text-anchor="middle" fill="#8a8f94">cuts the peptide backbone:</text><text x="348" y="112" font-size="11.5" text-anchor="middle" fill="#8a8f94">removes the protein itself</text><line x1="444" y1="89" x2="475" y2="89" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 480 89 L 475 85.5 L 475 92.5 Z" fill="#8a8f94"/><rect x="486" y="54" width="170" height="70" rx="4" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.2"/><text x="571" y="84" font-size="13" text-anchor="middle" fill="#1f3b57">clean nucleic acid,</text><text x="571" y="104" font-size="13" text-anchor="middle" fill="#1f3b57">ready for a library</text><text x="30" y="158" font-size="13" fill="#23282d">What must survive the reversal</text><rect x="30" y="172" width="92" height="26" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><rect x="122" y="172" width="206" height="26" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="189.2" font-size="12" text-anchor="middle" fill="#23282d">at 65 °C</text><rect x="328" y="172" width="262" height="26" rx="4" fill="#eef2f6" stroke="#8a8f94" stroke-width="1.2"/><text x="459.0" y="189.2" font-size="12" text-anchor="middle" fill="#23282d">consequence</text><rect x="30" y="198" width="92" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="76.0" y="215.2" font-size="12" text-anchor="middle" fill="#23282d">DNA</text><rect x="122" y="198" width="206" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="215.2" font-size="12" text-anchor="middle" fill="#23282d">survives 65 °C overnight</text><rect x="328" y="198" width="262" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="459.0" y="215.2" font-size="12" text-anchor="middle" fill="#23282d">this is why ChIP works</text><rect x="30" y="224" width="92" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="76.0" y="241.2" font-size="12" text-anchor="middle" fill="#23282d">RNA</text><rect x="122" y="224" width="206" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="241.2" font-size="12" text-anchor="middle" fill="#23282d">hydrolyses and fragments</text><rect x="328" y="224" width="262" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="459.0" y="241.2" font-size="12" text-anchor="middle" fill="#23282d">RNA methods shorten or avoid the heat</text><rect x="30" y="250" width="92" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="76.0" y="267.2" font-size="12" text-anchor="middle" fill="#23282d">protein</text><rect x="122" y="250" width="206" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="267.2" font-size="12" text-anchor="middle" fill="#23282d">not meant to survive</text><rect x="328" y="250" width="262" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="459.0" y="267.2" font-size="12" text-anchor="middle" fill="#23282d">digested, so DSG needs no reversal</text><rect x="30" y="276" width="92" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="76.0" y="293.2" font-size="12" text-anchor="middle" fill="#23282d">UV bond</text><rect x="122" y="276" width="206" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="225.0" y="293.2" font-size="12" text-anchor="middle" fill="#23282d">survives both</text><rect x="328" y="276" width="262" height="26" rx="4" fill="none" stroke="#dfe3e6" stroke-width="1.2"/><text x="459.0" y="293.2" font-size="12" text-anchor="middle" fill="#23282d">a peptide stub is left behind</text><text x="30" y="324" font-size="14" fill="#b4532a">Reverse before the protease and the protein comes off the nucleic acid first; reverse</text><text x="30" y="343" font-size="14" fill="#b4532a">after it and the stub stays, which is the difference between ChIP and CLIP.</text>
</svg>
