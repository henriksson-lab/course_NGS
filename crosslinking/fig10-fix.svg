<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 884 292" width="884" height="292" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="292" fill="none"/>
<text x="30" y="26" font-size="14" fill="#23282d">Fixation makes the cell a container that holds its contents and its state.</text><circle cx="120" cy="118" r="58" fill="#eef2f6" stroke="#1f3b57" stroke-width="1.8"/><circle cx="120" cy="118" r="26" fill="none" stroke="#1f3b57" stroke-width="1.4"/><text x="120" y="122" font-size="10.5" text-anchor="middle" fill="#8a8f94">nucleus</text><text x="120" y="196" font-size="13.5" text-anchor="middle" fill="#1f3b57">live</text><circle cx="380" cy="118" r="58" fill="#f7e7dd" stroke="#b4532a" stroke-width="1.8"/><circle cx="380" cy="118" r="26" fill="none" stroke="#b4532a" stroke-width="1.4"/><text x="380" y="122" font-size="10.5" text-anchor="middle" fill="#8a8f94">nucleus</text><text x="380" y="196" font-size="13.5" text-anchor="middle" fill="#b4532a">fixed</text><circle cx="163.2" cy="133.7" r="4" fill="#8a8f94"/><circle cx="128.0" cy="163.3" r="4" fill="#8a8f94"/><circle cx="80.2" cy="141.0" r="4" fill="#8a8f94"/><circle cx="84.8" cy="88.4" r="4" fill="#8a8f94"/><circle cx="143.0" cy="78.2" r="4" fill="#8a8f94"/><line x1="140" y1="60" x2="191" y2="60" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 196 60 L 191 56.5 L 191 63.5 Z" fill="#8a8f94"/><text x="168" y="50" font-size="11.5" text-anchor="middle" fill="#a33a28">RNA leaks, profile drifts</text><circle cx="423.2" cy="133.7" r="4" fill="#b4532a"/><line x1="423.2" y1="133.7" x2="434.5" y2="137.8" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><circle cx="388.0" cy="163.3" r="4" fill="#b4532a"/><line x1="388.0" y1="163.3" x2="390.1" y2="175.1" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><circle cx="340.2" cy="141.0" r="4" fill="#b4532a"/><line x1="340.2" y1="141.0" x2="329.8" y2="147.0" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><circle cx="344.8" cy="88.4" r="4" fill="#b4532a"/><line x1="344.8" y1="88.4" x2="335.6" y2="80.7" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><circle cx="403.0" cy="78.2" r="4" fill="#b4532a"/><line x1="403.0" y1="78.2" x2="409.0" y2="67.8" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><text x="470" y="70" font-size="13" fill="#2e6b3f">What fixation buys</text><text x="470" y="92" font-size="12.5" fill="#8a8f94">– the transcript profile stops changing at that moment</text><text x="470" y="112" font-size="12.5" fill="#8a8f94">– the cell survives handling, freezing and batching</text><text x="470" y="132" font-size="12.5" fill="#8a8f94">– the cell itself can be the compartment</text><text x="470" y="170" font-size="13" fill="#a33a28">What it costs</text><text x="470" y="192" font-size="12.5" fill="#8a8f94">– crosslinked RNA is a poorer template for reverse transcription</text><text x="470" y="212" font-size="12.5" fill="#8a8f94">– sensitivity per cell falls, and the loss is not uniform</text><text x="30" y="248" font-size="14" fill="#b4532a">Methanol is the other common fixative: it precipitates protein instead of crosslinking, so</text><text x="30" y="267" font-size="14" fill="#b4532a">nothing has to be reversed, and nothing is held in place either.</text>
</svg>
