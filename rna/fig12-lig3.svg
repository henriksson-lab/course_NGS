<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 845 256" width="845" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="840" height="256" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Step 1: a pre-adenylated 3' adapter is ligated with no ATP in the tube.</text><line x1="60" y1="90" x2="200" y2="90" stroke="#7a3b5e" stroke-width="4" stroke-linecap="butt"/><text x="50" y="94" font-size="11.5" text-anchor="end" fill="#8a8f94">5' P</text><text x="206" y="94" font-size="11.5" fill="#2e6b3f">3' OH</text><text x="60" y="70" font-size="12" fill="#7a3b5e">small RNA</text><line x1="290" y1="90" x2="470" y2="90" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><rect x="284" y="80" width="14" height="20" rx="4" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.2"/><text x="291" y="114" font-size="11" text-anchor="middle" fill="#b4532a">App</text><rect x="466" y="80" width="14" height="20" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="473" y="114" font-size="11" text-anchor="middle" fill="#a33a28">3' block</text><text x="380" y="70" font-size="12" text-anchor="middle" fill="#8a8f94">3' adapter, 5' adenylated</text><line x1="500" y1="90" x2="555" y2="90" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 560 90 L 555 86.5 L 555 93.5 Z" fill="#b4532a"/><text x="530" y="76" font-size="11.5" text-anchor="middle" fill="#b4532a">T4 Rnl2 (truncated)</text><line x1="580" y1="90" x2="700" y2="90" stroke="#7a3b5e" stroke-width="4" stroke-linecap="butt"/><line x1="700" y1="90" x2="800" y2="90" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><rect x="796" y="80" width="14" height="20" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="640" y="70" font-size="11.5" text-anchor="middle" fill="#7a3b5e">RNA</text><text x="750" y="70" font-size="11.5" text-anchor="middle" fill="#8a8f94">adapter</text><text x="40" y="152" font-size="12.5" fill="#23282d">Why it works: the adenylate that ligation normally needs ATP to make is already on the adapter.</text><text x="40" y="174" font-size="12.5" fill="#23282d">Truncated Rnl2 cannot adenylate its own substrates, so the RNA does not circularise and cannot join other RNAs.</text><text x="40" y="196" font-size="12.5" fill="#23282d">The 3' block on the adapter stops it from ligating to itself.</text><text x="40" y="238" font-size="14" fill="#b4532a">Without this design, T4 RNA ligase with ATP would make circles and concatemers of the sample as well as products.</text>
</svg>
