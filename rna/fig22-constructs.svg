<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 322" width="860" height="322" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="322" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Where the barcode sits, and which end of the RNA is read.</text><text x="40" y="76" font-size="13.5" fill="#23282d" font-weight="bold">CEL-Seq2</text><text x="40" y="94" font-size="11.5" fill="#8a8f94">3' tag; barcode in the RT primer</text><line x1="260" y1="76" x2="520" y2="76" stroke="#7a3b5e" stroke-width="4" stroke-linecap="butt"/><circle cx="262" cy="76" r="4.5" fill="#b4532a"/><text x="526" y="64" font-size="10.5" fill="#7a3b5e" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAA</text><rect x="566" y="62" width="36" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="584.0" y="79.675" font-size="10.5" text-anchor="middle" fill="#1f3b57">dT</text><rect x="602" y="62" width="40" height="28" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="622.0" y="79.675" font-size="10.5" text-anchor="middle" fill="#a33a28">UMI</text><rect x="642" y="62" width="60" height="28" rx="4" fill="#e9f1ea" stroke="#2e6b3f" stroke-width="1.2"/><text x="672.0" y="79.675" font-size="10.5" text-anchor="middle" fill="#2e6b3f">cell BC</text><rect x="702" y="62" width="60" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="732.0" y="79.675" font-size="10.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="762" y="62" width="40" height="28" rx="4" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.2"/><text x="782.0" y="79.675" font-size="10.5" text-anchor="middle" fill="#b4532a">T7</text><text x="40" y="148" font-size="13.5" fill="#23282d" font-weight="bold">STRT-seq</text><text x="40" y="166" font-size="11.5" fill="#8a8f94">5' tag; barcode in the TSO</text><rect x="260" y="134" width="60" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="290.0" y="151.675" font-size="10.5" text-anchor="middle" fill="#1f3b57">adapter</text><rect x="320" y="134" width="60" height="28" rx="4" fill="#e9f1ea" stroke="#2e6b3f" stroke-width="1.2"/><text x="350.0" y="151.675" font-size="10.5" text-anchor="middle" fill="#2e6b3f">cell BC</text><rect x="380" y="134" width="40" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="400.0" y="151.675" font-size="10.5" text-anchor="middle" fill="#1f3b57">GGG</text><line x1="420" y1="148" x2="680" y2="148" stroke="#7a3b5e" stroke-width="4" stroke-linecap="butt"/><circle cx="422" cy="148" r="4.5" fill="#b4532a"/><text x="686" y="152" font-size="10.5" fill="#7a3b5e" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAA 3'</text><text x="40" y="220" font-size="13.5" fill="#23282d" font-weight="bold">SMART-seq2</text><text x="40" y="238" font-size="11.5" fill="#8a8f94">full length; no barcode in the RT</text><line x1="260" y1="220" x2="520" y2="220" stroke="#7a3b5e" stroke-width="4" stroke-linecap="butt"/><circle cx="262" cy="220" r="4.5" fill="#b4532a"/><text x="526" y="208" font-size="10.5" fill="#7a3b5e" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAA</text><rect x="566" y="206" width="66" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="599.0" y="223.675" font-size="10.5" text-anchor="middle" fill="#1f3b57">dT30VN</text><rect x="632" y="206" width="60" height="28" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="662.0" y="223.675" font-size="10.5" text-anchor="middle" fill="#1f3b57">ISPCR</text><text x="40" y="280" font-size="12" fill="#23282d">The UMI marks a single starting molecule; the cell barcode lets many cells share a tube from the RT onwards. STRT-C1 added a UMI.</text><text x="40" y="304" font-size="13.5" fill="#b4532a">Barcode in the first primer means pooling before amplification: cheaper, but reads only one end.</text>
</svg>
