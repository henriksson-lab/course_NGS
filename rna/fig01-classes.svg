<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 761 312" width="761" height="312" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="760" height="312" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Total RNA from a mammalian cell: what is there, and which handles it carries.</text><text x="40" y="52" font-size="12.5" fill="#8a8f94">class</text><text x="250" y="52" font-size="12.5" fill="#8a8f94">length</text><text x="370" y="52" font-size="12.5" fill="#8a8f94">5' cap</text><text x="440" y="52" font-size="12.5" fill="#8a8f94">poly(A)</text><text x="520" y="52" font-size="12.5" fill="#8a8f94">share of total RNA (approximate)</text><line x1="40" y1="58" x2="740" y2="58" stroke="#8a8f94" stroke-width="1" stroke-linecap="round"/><text x="40" y="82" font-size="13.5" fill="#23282d">rRNA (28S, 18S, 5.8S, 5S)</text><text x="250" y="82" font-size="13" fill="#23282d">0.12 to 5 kb</text><text x="370" y="82" font-size="13" fill="#a33a28">no</text><text x="440" y="82" font-size="13" fill="#a33a28">no</text><rect x="520" y="71" width="152" height="13" fill="#4a6b8a" opacity="0.8"/><text x="680.0" y="82" font-size="12" fill="#8a8f94">~80%</text><text x="40" y="110" font-size="13.5" fill="#23282d">tRNA</text><text x="250" y="110" font-size="13" fill="#23282d">70 to 90 nt</text><text x="370" y="110" font-size="13" fill="#a33a28">no</text><text x="440" y="110" font-size="13" fill="#a33a28">no</text><rect x="520" y="99" width="23" height="13" fill="#4a6b8a" opacity="0.8"/><text x="550.8" y="110" font-size="12" fill="#8a8f94">~10%</text><text x="40" y="138" font-size="13.5" fill="#b4532a" font-weight="bold">mRNA</text><text x="250" y="138" font-size="13" fill="#23282d">0.5 to 10 kb</text><text x="370" y="138" font-size="13" fill="#2e6b3f">yes</text><text x="440" y="138" font-size="13" fill="#2e6b3f">yes</text><rect x="520" y="127" width="8" height="13" fill="#b4532a" opacity="0.8"/><text x="535.6" y="138" font-size="12" fill="#8a8f94">1 to 5%</text><text x="40" y="166" font-size="13.5" fill="#23282d">histone mRNA</text><text x="250" y="166" font-size="13" fill="#23282d">~0.5 kb</text><text x="370" y="166" font-size="13" fill="#2e6b3f">yes</text><text x="440" y="166" font-size="13" fill="#a33a28">no</text><rect x="520" y="155" width="3" height="13" fill="#4a6b8a" opacity="0.8"/><text x="531" y="166" font-size="12" fill="#8a8f94">small</text><text x="40" y="194" font-size="13.5" fill="#23282d">lncRNA</text><text x="250" y="194" font-size="13" fill="#23282d">0.2 to >10 kb</text><text x="370" y="194" font-size="13" fill="#2e6b3f">yes</text><text x="440" y="194" font-size="13" fill="#b4532a">mostly</text><rect x="520" y="183" width="3" height="13" fill="#4a6b8a" opacity="0.8"/><text x="531" y="194" font-size="12" fill="#8a8f94">small</text><text x="40" y="222" font-size="13.5" fill="#23282d">miRNA</text><text x="250" y="222" font-size="13" fill="#23282d">21 to 23 nt</text><text x="370" y="222" font-size="13" fill="#a33a28">no</text><text x="440" y="222" font-size="13" fill="#a33a28">no</text><rect x="520" y="211" width="3" height="13" fill="#4a6b8a" opacity="0.8"/><text x="531" y="222" font-size="12" fill="#8a8f94">under 1%</text><text x="40" y="250" font-size="13.5" fill="#23282d">circRNA</text><text x="250" y="250" font-size="13" fill="#23282d">100 nt to kb</text><text x="370" y="250" font-size="13" fill="#a33a28">no</text><text x="440" y="250" font-size="13" fill="#a33a28">no</text><rect x="520" y="239" width="3" height="13" fill="#4a6b8a" opacity="0.8"/><text x="531" y="250" font-size="12" fill="#8a8f94">small</text><text x="40" y="294" font-size="14" fill="#b4532a">Poly(A) selection keeps one row and loses every 'no' in the poly(A) column; depletion keeps them all.</text>
</svg>
