<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 902 270" width="902" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="270" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Two genes overlap on opposite strands. Which one made this read?</text><text x="40" y="62" font-size="12" fill="#8a8f94">genome</text><line x1="120" y1="62" x2="660" y2="62" stroke="#8a8f94" stroke-width="1.5" stroke-linecap="butt"/><line x1="220" y1="80" x2="520" y2="80" stroke="#1f3b57" stroke-width="8" stroke-linecap="butt"/><line x1="500" y1="80" x2="518" y2="80" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><path d="M 524 80 L 518 75.8 L 518 84.2 Z" fill="#1f3b57"/><text x="224" y="100" font-size="11.5" fill="#1f3b57">gene A, sense strand</text><line x1="380" y1="120" x2="640" y2="120" stroke="#b4532a" stroke-width="8" stroke-linecap="butt"/><line x1="400" y1="120" x2="382" y2="120" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 376 120 L 382 115.8 L 382 124.2 Z" fill="#b4532a"/><text x="420" y="140" font-size="11.5" fill="#b4532a">gene B, antisense, overlapping</text><text x="40" y="178" font-size="12.5" fill="#23282d">unstranded</text><line x1="410" y1="174" x2="436" y2="174" stroke="#a33a28" stroke-width="5" stroke-linecap="butt"/><line x1="440" y1="174" x2="466" y2="174" stroke="#a33a28" stroke-width="5" stroke-linecap="butt"/><line x1="470" y1="174" x2="496" y2="174" stroke="#a33a28" stroke-width="5" stroke-linecap="butt"/><line x1="500" y1="174" x2="526" y2="174" stroke="#a33a28" stroke-width="5" stroke-linecap="butt"/><text x="540" y="178" font-size="12" fill="#a33a28">reads in the overlap: A or B? counted for both, or neither</text><text x="40" y="216" font-size="12.5" fill="#23282d">stranded</text><line x1="410" y1="212" x2="436" y2="212" stroke="#1f3b57" stroke-width="5" stroke-linecap="butt"/><line x1="440" y1="212" x2="466" y2="212" stroke="#1f3b57" stroke-width="5" stroke-linecap="butt"/><line x1="470" y1="212" x2="496" y2="212" stroke="#b4532a" stroke-width="5" stroke-linecap="butt"/><line x1="500" y1="212" x2="526" y2="212" stroke="#b4532a" stroke-width="5" stroke-linecap="butt"/><text x="540" y="216" font-size="12" fill="#2e6b3f">orientation of the read gives the gene</text><text x="40" y="252" font-size="13.5" fill="#8a8f94">Many human genes have an overlapping antisense partner, so this is not a corner case.</text>
</svg>
