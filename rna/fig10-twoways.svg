<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 246" width="820" height="246" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="246" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Two ways to silence the U-marked strand after adapter ligation.</text><rect x="40" y="40" width="360" height="160" rx="4" fill="#e9f1ea" stroke="#8a8f94" stroke-width="1.2"/><text x="220" y="62" font-size="13.5" text-anchor="middle" fill="#23282d" font-weight="bold">TruSeq Stranded mRNA</text><rect x="70" y="84" width="16" height="12" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="86" y1="90" x2="340" y2="90" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><rect x="340" y="84" width="16" height="12" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><line x1="86" y1="110" x2="340" y2="110" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><text x="130" y="124" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="190" y="124" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="250" y="124" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="300" y="124" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="220" y="150" font-size="11.5" text-anchor="middle" fill="#8a8f94">PCR primers anneal to adapters</text><text x="220" y="170" font-size="11.5" text-anchor="middle" fill="#a33a28">the enzyme stalls at U on the marked strand</text><text x="220" y="188" font-size="11.5" text-anchor="middle" fill="#2e6b3f">the unmarked strand copies fully</text><rect x="440" y="40" width="360" height="160" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="620" y="62" font-size="13.5" text-anchor="middle" fill="#23282d" font-weight="bold">NEBNext Ultra II Directional</text><rect x="470" y="84" width="16" height="12" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="486" y1="90" x2="740" y2="90" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><rect x="740" y="84" width="16" height="12" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><line x1="486" y1="110" x2="740" y2="110" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><text x="530" y="124" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="590" y="124" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="650" y="124" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="700" y="124" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><line x1="550" y1="104" x2="560" y2="116" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="550" y1="116" x2="560" y2="104" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="670" y1="104" x2="680" y2="116" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="670" y1="116" x2="680" y2="104" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><text x="620" y="150" font-size="11.5" text-anchor="middle" fill="#a33a28">cut strand cannot be amplified end to end</text><text x="620" y="170" font-size="11.5" text-anchor="middle" fill="#8a8f94">done in the ligation tube, before PCR</text><text x="620" y="188" font-size="11.5" text-anchor="middle" fill="#2e6b3f">the unmarked strand is untouched</text><text x="40" y="228" font-size="14" fill="#b4532a">Both give the same orientation in the data; the choice is a matter of enzymes and workflow, not of result.</text>
</svg>
