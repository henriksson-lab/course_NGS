<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 868 244" width="868" height="244" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="840" height="244" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">dUTP in the second strand: the library remembers which strand was the RNA's complement.</text><text x="40" y="62" font-size="12.5" fill="#23282d">1. first strand: dATP dCTP dGTP dTTP (plus actinomycin D)</text><line x1="60" y1="82" x2="340" y2="82" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><line x1="60" y1="96" x2="340" y2="96" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><text x="350" y="90" font-size="11.5" fill="#8a8f94">RNA + first-strand cDNA</text><text x="40" y="128" font-size="12.5" fill="#23282d">2. second strand: dUTP replaces dTTP</text><line x1="60" y1="148" x2="340" y2="148" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="60" y1="162" x2="340" y2="162" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><text x="80" y="175" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="118" y="175" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="156" y="175" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="194" y="175" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="232" y="175" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="270" y="175" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="308" y="175" font-size="9.5" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>U</text><text x="350" y="156" font-size="11.5" fill="#b4532a">U-containing second strand</text><text x="40" y="198" font-size="12.5" fill="#23282d">3. ligate adapters, then stop the U strand from being amplified</text><rect x="60" y="206" width="18" height="30" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="78" y1="214" x2="300" y2="214" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><rect x="300" y="206" width="18" height="30" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><line x1="78" y1="228" x2="300" y2="228" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><text x="330" y="222" font-size="11.5" fill="#2e6b3f">only the first-strand copy templates PCR</text><text x="560" y="62" font-size="12.5" fill="#23282d">4. what the reads look like</text><line x1="560" y1="90" x2="800" y2="90" stroke="#7a3b5e" stroke-width="4" stroke-linecap="butt"/><text x="560" y="78" font-size="11" fill="#7a3b5e">mRNA, sense</text><line x1="580" y1="120" x2="800" y2="120" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="700" y1="140" x2="605" y2="140" stroke="#1f3b57" stroke-width="1.8" stroke-linecap="round"/><path d="M 600 140 L 605 136.5 L 605 143.5 Z" fill="#1f3b57"/><text x="710" y="144" font-size="11.5" fill="#1f3b57">read 1: antisense to mRNA</text><line x1="640" y1="170" x2="735" y2="170" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><path d="M 740 170 L 735 166.5 L 735 173.5 Z" fill="#b4532a"/><text x="560" y="190" font-size="11.5" fill="#b4532a">read 2: sense</text><text x="560" y="218" font-size="11.5" fill="#8a8f94">TruSeq Stranded mRNA and NEBNext Ultra II</text><text x="560" y="234" font-size="11.5" fill="#8a8f94">Directional give this orientation</text>
</svg>
