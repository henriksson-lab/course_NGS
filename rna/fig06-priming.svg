<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 834 296" width="834" height="296" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="296" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Where the first-strand primer anneals decides which part of the RNA becomes cDNA.</text><text x="40" y="74" font-size="13" fill="#23282d">oligo-dT, anchored</text><line x1="220" y1="70" x2="620" y2="70" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="216" cy="70" r="4.5" fill="#b4532a"/><text x="626" y="74" font-size="10.5" fill="#7a3b5e" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAAAAAA</text><text x="40" y="140" font-size="13" fill="#23282d">random hexamers</text><line x1="220" y1="136" x2="620" y2="136" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="216" cy="136" r="4.5" fill="#b4532a"/><text x="626" y="140" font-size="10.5" fill="#7a3b5e" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAAAAAA</text><text x="40" y="206" font-size="13" fill="#23282d">gene-specific</text><line x1="220" y1="202" x2="620" y2="202" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="216" cy="202" r="4.5" fill="#b4532a"/><text x="626" y="206" font-size="10.5" fill="#7a3b5e" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAAAAAA</text><line x1="626" y1="64" x2="704" y2="64" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><text x="706" y="68" font-size="10.5" fill="#1f3b57" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>TTTTVN</text><line x1="626" y1="58" x2="425" y2="58" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 420 58 L 425 54.5 L 425 61.5 Z" fill="#b4532a"/><text x="520" y="48" font-size="11.5" text-anchor="middle" fill="#b4532a">one cDNA per mRNA, from the 3' end</text><line x1="250" y1="130" x2="268" y2="130" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="250" y1="130" x2="210" y2="130" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><path d="M 206 130 L 210 127.2 L 210 132.8 Z" fill="#b4532a"/><line x1="310" y1="130" x2="328" y2="130" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="310" y1="130" x2="270" y2="130" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><path d="M 266 130 L 270 127.2 L 270 132.8 Z" fill="#b4532a"/><line x1="380" y1="130" x2="398" y2="130" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="380" y1="130" x2="340" y2="130" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><path d="M 336 130 L 340 127.2 L 340 132.8 Z" fill="#b4532a"/><line x1="440" y1="130" x2="458" y2="130" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="440" y1="130" x2="400" y2="130" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><path d="M 396 130 L 400 127.2 L 400 132.8 Z" fill="#b4532a"/><line x1="500" y1="130" x2="518" y2="130" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="500" y1="130" x2="460" y2="130" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><path d="M 456 130 L 460 127.2 L 460 132.8 Z" fill="#b4532a"/><line x1="570" y1="130" x2="588" y2="130" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="570" y1="130" x2="530" y2="130" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><path d="M 526 130 L 530 127.2 L 530 132.8 Z" fill="#b4532a"/><text x="420" y="158" font-size="11.5" text-anchor="middle" fill="#b4532a">many short cDNAs, spread along the whole RNA</text><line x1="420" y1="196" x2="442" y2="196" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="420" y1="196" x2="305" y2="196" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 300 196 L 305 192.5 L 305 199.5 Z" fill="#b4532a"/><text x="420" y="224" font-size="11.5" text-anchor="middle" fill="#b4532a">only the gene you asked about</text><text x="40" y="256" font-size="13" fill="#8a8f94">VN anchor: without it, oligo-dT can anneal anywhere along the poly(A) tail and the cDNA begins with a variable run of A.</text><text x="40" y="278" font-size="13" fill="#b4532a">Oligo-dT needs a tail. Hexamers do not, but they also prime on rRNA, so total RNA gives rRNA reads.</text>
</svg>
