<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 294" width="780" height="294" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="294" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Tn5 can fragment and tag an RNA:DNA hybrid, so the second strand is not needed.</text><text x="40" y="62" font-size="12.5" fill="#23282d">1. RT gives an RNA:cDNA hybrid; the usual route would now synthesise a second strand</text><line x1="60" y1="96" x2="400" y2="96" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><line x1="60" y1="110" x2="400" y2="110" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><text x="40" y="148" font-size="12.5" fill="#23282d">2. Tn5, loaded with adapters, cuts the hybrid and attaches its adapters</text><line x1="60" y1="176" x2="400" y2="176" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><line x1="60" y1="190" x2="400" y2="190" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><ellipse cx="150" cy="183" rx="20" ry="17" fill="#f6f0e0" stroke="#b4532a"/><text x="150" y="187" font-size="11" text-anchor="middle" fill="#b4532a">Tn5</text><ellipse cx="280" cy="183" rx="20" ry="17" fill="#f6f0e0" stroke="#b4532a"/><text x="280" y="187" font-size="11" text-anchor="middle" fill="#b4532a">Tn5</text><text x="40" y="240" font-size="12.5" fill="#23282d">3. complete the adapters and amplify the library by PCR</text><text x="440" y="96" font-size="12" fill="#2e6b3f">Saves a second-strand reaction and its cleanup</text><text x="440" y="116" font-size="12" fill="#8a8f94">Caveat: Tn5 prefers some sequences,</text><text x="440" y="134" font-size="12" fill="#8a8f94">so insert-size distribution reflects the enzyme</text><text x="40" y="276" font-size="13" fill="#b4532a">Di et al. 2020 show that Tn5 accepts RNA/DNA hybrids as a substrate.</text>
</svg>
