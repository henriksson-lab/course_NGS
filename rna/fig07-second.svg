<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 957 232" width="957" height="232" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="840" height="232" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Second strand: use the RNA you have as its own primer.</text><text x="36" y="56" font-size="12" fill="#23282d">1. RNA:DNA hybrid</text><line x1="36" y1="110" x2="206" y2="110" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="36" y1="90" x2="206" y2="90" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><text x="236" y="56" font-size="12" fill="#23282d">2. RNase H nicks the RNA</text><line x1="236" y1="110" x2="406" y2="110" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="236" y1="90" x2="274" y2="90" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><line x1="280" y1="90" x2="326" y2="90" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><line x1="334" y1="90" x2="364" y2="90" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><line x1="370" y1="90" x2="406" y2="90" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><line x1="272" y1="72" x2="282" y2="84" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="272" y1="84" x2="282" y2="72" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="325" y1="72" x2="335" y2="84" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="325" y1="84" x2="335" y2="72" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="362" y1="72" x2="372" y2="84" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="362" y1="84" x2="372" y2="72" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><text x="436" y="56" font-size="12" fill="#23282d">3. DNA Pol I extends and replaces</text><line x1="436" y1="110" x2="606" y2="110" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="436" y1="90" x2="474" y2="90" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><line x1="474" y1="90" x2="606" y2="90" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><line x1="474" y1="78" x2="581" y2="78" stroke="#b4532a" stroke-width="1.4" stroke-linecap="round"/><path d="M 586 78 L 581 74.5 L 581 81.5 Z" fill="#b4532a"/><text x="636" y="56" font-size="12" fill="#23282d">4. ligase seals: ds cDNA</text><line x1="636" y1="110" x2="806" y2="110" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="636" y1="90" x2="806" y2="90" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><text x="636" y="138" font-size="11.5" fill="#2e6b3f">cDNA now double-stranded</text><text x="40" y="176" font-size="12.5" fill="#8a8f94">RNA fragments left by RNase H act as primers (Gubler and Hoffman). Pol I's 5' to 3' exonuclease replaces them.</text><text x="40" y="212" font-size="14" fill="#b4532a">The product carries the first-strand sequence on one strand and its complement on the other, with no way to tell which was which.</text>
</svg>
