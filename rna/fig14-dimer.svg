<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="300" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">The 5' adapter ligates to any 3' adapter left over, and the product is an adapter dimer.</text><line x1="60" y1="80" x2="130" y2="80" stroke="#b4532a" stroke-width="4" stroke-linecap="butt"/><line x1="130" y1="80" x2="220" y2="80" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><text x="40" y="84" font-size="11" text-anchor="end" fill="#8a8f94">5'</text><text x="240" y="84" font-size="12" fill="#a33a28">dimer: no insert, only a few tens of bp shorter than the true product</text><line x1="60" y1="130" x2="130" y2="130" stroke="#b4532a" stroke-width="4" stroke-linecap="butt"/><line x1="130" y1="130" x2="160" y2="130" stroke="#7a3b5e" stroke-width="4" stroke-linecap="butt"/><line x1="160" y1="130" x2="250" y2="130" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><text x="270" y="134" font-size="12" fill="#2e6b3f">the product you want: insert in between</text><text x="40" y="178" font-size="13" fill="#23282d">Countermeasures, and where each acts</text><text x="60" y="202" font-size="12" fill="#1f3b57">less adapter</text><text x="330" y="202" font-size="12" fill="#8a8f94">fewer leftovers, but less ligation</text><text x="60" y="222" font-size="12" fill="#1f3b57">enzymatic removal of free 3' adapter</text><text x="330" y="222" font-size="12" fill="#8a8f94">before the 5' ligation</text><text x="60" y="242" font-size="12" fill="#1f3b57">size selection</text><text x="330" y="242" font-size="12" fill="#8a8f94">after PCR; the dimer is only slightly shorter</text><text x="60" y="262" font-size="12" fill="#1f3b57">RT primer blocks excess adapter</text><text x="330" y="262" font-size="12" fill="#8a8f94">kit-specific; mechanism not always published</text>
</svg>
