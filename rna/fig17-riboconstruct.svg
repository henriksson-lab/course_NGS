<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 952 270" width="952" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="270" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">From footprint to library: repair, ligate, copy, circularise, amplify.</text><text x="40" y="70" font-size="12.5" fill="#23282d">1. T4 PNK repair, then 3' linker ligation</text><line x1="60" y1="94" x2="120" y2="94" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><line x1="120" y1="94" x2="220" y2="94" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><text x="240" y="98" font-size="11.5" fill="#8a8f94">footprint + 3' linker</text><text x="40" y="134" font-size="12.5" fill="#23282d">2. RT from a primer on the linker; the cDNA runs to the 5' end of the footprint</text><line x1="60" y1="158" x2="120" y2="158" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><line x1="120" y1="158" x2="220" y2="158" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><line x1="60" y1="172" x2="220" y2="172" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><text x="240" y="176" font-size="11.5" fill="#8a8f94">gel-purify the full-length cDNA</text><text x="440" y="70" font-size="12.5" fill="#23282d">3. circularise with CircLigase</text><circle cx="530" cy="126" r="32" fill="none" stroke="#1f3b57" stroke-width="3.2"/><text x="530" y="126" font-size="11" text-anchor="middle" fill="#1f3b57">ss cDNA</text><text x="590" y="110" font-size="11.5" fill="#8a8f94">the end with no adapter on it</text><text x="590" y="126" font-size="11.5" fill="#8a8f94">now sits beside the linker</text><text x="440" y="174" font-size="12.5" fill="#23282d">4. PCR with primers pointing outwards</text><line x1="515" y1="196" x2="475" y2="196" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><path d="M 470 196 L 475 192.5 L 475 199.5 Z" fill="#1f3b57"/><line x1="545" y1="196" x2="585" y2="196" stroke="#b4532a" stroke-width="1.6" stroke-linecap="round"/><path d="M 590 196 L 585 192.5 L 585 199.5 Z" fill="#b4532a"/><text x="40" y="252" font-size="13.5" fill="#b4532a">Circularisation joins the unadapted end to the linker, so no second ligation is needed and one primer pair reads across the junction.</text>
</svg>
