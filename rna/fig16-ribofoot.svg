<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 334" width="812" height="334" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="780" height="334" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Ribo-seq: freeze the ribosomes, digest what they do not cover, sequence the footprints.</text><text x="40" y="62" font-size="12.5" fill="#23282d">1. lysate: mRNA with ribosomes on the ORF</text><line x1="60" y1="100" x2="640" y2="100" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="56" cy="100" r="4.5" fill="#b4532a"/><text x="646" y="104" font-size="10.5" fill="#7a3b5e" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>AAAA</text><ellipse cx="200" cy="96" rx="26" ry="20" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3" opacity="0.9"/><ellipse cx="300" cy="96" rx="26" ry="20" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3" opacity="0.9"/><ellipse cx="400" cy="96" rx="26" ry="20" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3" opacity="0.9"/><text x="40" y="148" font-size="12.5" fill="#23282d">2. RNase I digests exposed RNA</text><line x1="60" y1="180" x2="172" y2="180" stroke="#7a3b5e" stroke-width="2" stroke-linecap="butt"/><ellipse cx="200" cy="176" rx="26" ry="20" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><line x1="185" y1="176" x2="215" y2="176" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><line x1="155" y1="170" x2="165" y2="182" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="155" y1="182" x2="165" y2="170" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="235" y1="170" x2="245" y2="182" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="235" y1="182" x2="245" y2="170" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="300" cy="176" rx="26" ry="20" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><line x1="285" y1="176" x2="315" y2="176" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><line x1="255" y1="170" x2="265" y2="182" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="255" y1="182" x2="265" y2="170" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="335" y1="170" x2="345" y2="182" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="335" y1="182" x2="345" y2="170" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><ellipse cx="400" cy="176" rx="26" ry="20" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.3"/><line x1="385" y1="176" x2="415" y2="176" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><line x1="355" y1="170" x2="365" y2="182" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="355" y1="182" x2="365" y2="170" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="435" y1="170" x2="445" y2="182" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="435" y1="182" x2="445" y2="170" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><text x="40" y="224" font-size="12.5" fill="#23282d">3. purify monosomes, release the ~28 nt footprints</text><line x1="185" y1="250" x2="215" y2="250" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><line x1="285" y1="250" x2="315" y2="250" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><line x1="385" y1="250" x2="415" y2="250" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><text x="450" y="254" font-size="12" fill="#a33a28">footprints, 5' OH and 3' P, with rRNA fragments among them</text><text x="40" y="290" font-size="13" fill="#8a8f94">Position of the 5' end gives the reading frame: three-base periodicity along the coding sequence.</text><text x="40" y="316" font-size="13.5" fill="#b4532a">Much of what you purify is rRNA fragments. How well you remove them sets how many reads you waste.</text>
</svg>
