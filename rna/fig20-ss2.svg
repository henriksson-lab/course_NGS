<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="880" height="250" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">SMART-seq2 for one cell: five reactions in one tube, then a library by tagmentation.</text><rect x="40" y="50" width="132" height="90" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="106" y="88" font-size="12" text-anchor="middle" fill="#23282d">lyse, oligo-dT-ISPCR</text><text x="106" y="106" font-size="12" text-anchor="middle" fill="#23282d">primer anneals</text><text x="106" y="70" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1</text><line x1="176" y1="95" x2="187" y2="95" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 192 95 L 187 91.5 L 187 98.5 Z" fill="#8a8f94"/><rect x="196" y="50" width="132" height="90" rx="4" fill="#e9f1ea" stroke="#8a8f94" stroke-width="1.2"/><text x="262" y="88" font-size="12" text-anchor="middle" fill="#23282d">RT + template</text><text x="262" y="106" font-size="12" text-anchor="middle" fill="#23282d">switching (TSO)</text><text x="262" y="70" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2</text><line x1="332" y1="95" x2="343" y2="95" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 348 95 L 343 91.5 L 343 98.5 Z" fill="#8a8f94"/><rect x="352" y="50" width="132" height="90" rx="4" fill="#f6f0e0" stroke="#8a8f94" stroke-width="1.2"/><text x="418" y="88" font-size="12" text-anchor="middle" fill="#23282d">pre-amplify by PCR,</text><text x="418" y="106" font-size="12" text-anchor="middle" fill="#23282d">ISPCR primer only</text><text x="418" y="70" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3</text><line x1="488" y1="95" x2="499" y2="95" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 504 95 L 499 91.5 L 499 98.5 Z" fill="#8a8f94"/><rect x="508" y="50" width="132" height="90" rx="4" fill="#e8eef5" stroke="#8a8f94" stroke-width="1.2"/><text x="574" y="88" font-size="12" text-anchor="middle" fill="#23282d">bead cleanup,</text><text x="574" y="106" font-size="12" text-anchor="middle" fill="#23282d">check full length</text><text x="574" y="70" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4</text><line x1="644" y1="95" x2="655" y2="95" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 660 95 L 655 91.5 L 655 98.5 Z" fill="#8a8f94"/><rect x="664" y="50" width="132" height="90" rx="4" fill="#f5eae6" stroke="#8a8f94" stroke-width="1.2"/><text x="730" y="88" font-size="12" text-anchor="middle" fill="#23282d">Tn5 tagmentation,</text><text x="730" y="106" font-size="12" text-anchor="middle" fill="#23282d">index PCR</text><text x="730" y="70" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">5</text><text x="40" y="174" font-size="12.5" fill="#23282d">Result: reads across the whole transcript, so isoforms, SNPs and splice junctions are visible.</text><text x="40" y="196" font-size="12.5" fill="#23282d">Price: no UMIs, because Tn5 cuts the cDNA and PCR duplicates cannot be separated from real ones.</text><text x="40" y="232" font-size="13.5" fill="#b4532a">Pre-amplifying from one cell to nanograms is what makes it possible to fragment and index at all.</text>
</svg>
