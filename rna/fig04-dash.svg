<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 272" width="800" height="272" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="272" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Cas9 depletion acts on cDNA: cut what you do not want between RT and PCR.</text><text x="40" y="74" font-size="12.5" fill="#23282d">1. adapter-flanked cDNA library,</text><text x="40" y="92" font-size="12.5" fill="#8a8f94">rRNA-derived molecules are most of it</text><rect x="300" y="64" width="22" height="16" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="322" y1="72" x2="520" y2="72" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><rect x="520" y="64" width="22" height="16" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="560" y="76" font-size="12" fill="#8a8f94">rRNA cDNA</text><rect x="300" y="104" width="22" height="16" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="322" y1="112" x2="520" y2="112" stroke="#7a3b5e" stroke-width="3" stroke-linecap="butt"/><rect x="520" y="104" width="22" height="16" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="560" y="116" font-size="12" fill="#7a3b5e">mRNA cDNA</text><text x="40" y="158" font-size="12.5" fill="#23282d">2. Cas9 with guides against rRNA</text><text x="40" y="176" font-size="12.5" fill="#8a8f94">cuts inside the insert</text><rect x="300" y="148" width="22" height="16" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="322" y1="156" x2="400" y2="156" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="406" y1="150" x2="416" y2="162" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="406" y1="162" x2="416" y2="150" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="422" y1="156" x2="520" y2="156" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><rect x="520" y="148" width="22" height="16" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="560" y="160" font-size="12" fill="#a33a28">two pieces, each with one adapter</text><text x="40" y="212" font-size="12.5" fill="#23282d">3. PCR with adapter primers</text><text x="40" y="230" font-size="12.5" fill="#8a8f94">needs an adapter at both ends</text><rect x="300" y="202" width="22" height="16" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><line x1="322" y1="210" x2="520" y2="210" stroke="#7a3b5e" stroke-width="3" stroke-linecap="butt"/><rect x="520" y="202" width="22" height="16" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="560" y="214" font-size="12" fill="#2e6b3f">amplified</text><text x="40" y="254" font-size="13" fill="#b4532a">Cut pieces fail to amplify exponentially. No oligo, no hybrid, no bead: the target is defined by the guide RNAs.</text>
</svg>
