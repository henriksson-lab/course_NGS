<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="1000" height="360" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">TruSeq Stranded mRNA: the molecule after every step. 100 ng of total RNA.</text><text x="40" y="67" font-size="12" fill="#23282d">1  oligo-dT beads, twice</text><rect x="270" y="52" width="34" height="22" rx="3" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="287.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">cap</text><rect x="304" y="52" width="212" height="22" rx="3" fill="#f3e7ec" stroke="#7a3b5e" stroke-width="1.2"/><text x="410.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#7a3b5e">mRNA, intact</text><rect x="516" y="52" width="44" height="22" rx="3" fill="#f1f1ee" stroke="#8a8f94" stroke-width="1.2"/><text x="538.0" y="67.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">AAAA</text><text x="680" y="67" font-size="11.5" fill="#8a8f94">rRNA and everything untailed is washed away</text><text x="40" y="101" font-size="12" fill="#23282d">2  heat + Mg2+, with hexamers</text><rect x="270" y="86" width="260" height="22" rx="3" fill="#f3e7ec" stroke="#7a3b5e" stroke-width="1.2"/><text x="400.0" y="101.025" font-size="11.5" text-anchor="middle" fill="#7a3b5e">mRNA fragment, a few hundred nt</text><text x="680" y="101" font-size="11.5" fill="#8a8f94">the RNA is cut, not the cDNA: this sets the insert</text><text x="40" y="135" font-size="12" fill="#23282d">3  first strand, actinomycin D</text><rect x="270" y="120" width="260" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="400.0" y="135.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">first-strand cDNA on its RNA template</text><text x="680" y="135" font-size="11.5" fill="#8a8f94">the RT copies RNA only, so the strand is remembered</text><text x="40" y="169" font-size="12" fill="#23282d">4  second strand, dUTP for dTTP</text><rect x="270" y="154" width="260" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="400.0" y="169.025" font-size="11.5" text-anchor="middle" fill="#b4532a">double-stranded cDNA, U in one strand</text><text x="680" y="169" font-size="11.5" fill="#8a8f94">RNase H nicks the RNA, Pol I replaces it; blunt</text><text x="40" y="203" font-size="12" fill="#23282d">5  dA-tail</text><rect x="270" y="188" width="14" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="277.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#b4532a">A</text><rect x="284" y="188" width="232" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="400.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">blunt ds cDNA, U-marked</text><rect x="516" y="188" width="14" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="523.0" y="203.025" font-size="11.5" text-anchor="middle" fill="#b4532a">A</text><text x="680" y="203" font-size="11.5" fill="#8a8f94">one 3' A, so only a T-overhang can ligate</text><text x="40" y="237" font-size="12" fill="#23282d">6  ligate the indexed adapter</text><rect x="270" y="222" width="66" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="303.0" y="237.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="336" y="222" width="228" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="450.0" y="237.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert, U-marked strand</text><rect x="564" y="222" width="66" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="597.0" y="237.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="680" y="237" font-size="11.5" fill="#8a8f94">the index is on before PCR, not added by it</text><text x="40" y="271" font-size="12" fill="#23282d">7  PCR, 15 cycles</text><rect x="270" y="256" width="66" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="303.0" y="271.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="336" y="256" width="228" height="22" rx="3" fill="#f7ece5" stroke="#b4532a" stroke-width="1.2"/><text x="450.0" y="271.025" font-size="11.5" text-anchor="middle" fill="#b4532a">only the first strand is copied</text><rect x="564" y="256" width="66" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="597.0" y="271.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="680" y="271" font-size="11.5" fill="#8a8f94">the U strand is not a template: one orientation left</text><text x="40" y="305" font-size="12" fill="#23282d">8  the finished molecule</text><rect x="270" y="290" width="66" height="22" rx="3" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="303.0" y="305.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">P5 i5 R1</text><rect x="336" y="290" width="228" height="22" rx="3" fill="none" stroke="#8a8f94" stroke-width="1.2"/><text x="450.0" y="305.025" font-size="11.5" text-anchor="middle" fill="#8a8f94">insert</text><rect x="564" y="290" width="66" height="22" rx="3" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="597.0" y="305.025" font-size="11.5" text-anchor="middle" fill="#a33a28">R2 i7 P7</text><text x="680" y="305" font-size="11.5" fill="#8a8f94">read 1 lands antisense to the mRNA</text><text x="40" y="340" font-size="13.5" fill="#b4532a">Cutting the RNA sets the insert size; marking the second strand with U is what makes the library stranded.</text>
</svg>
