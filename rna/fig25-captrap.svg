<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 342" width="860" height="342" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="342" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Cap trapping: biotin on the cap survives only where the cDNA reached it.</text><text x="60" y="56" font-size="12" fill="#2e6b3f">full-length cDNA</text><text x="470" y="56" font-size="12" fill="#a33a28">cDNA that stopped early</text><text x="40" y="80" font-size="12.5" fill="#23282d">1. RT: some cDNAs reach the cap, some stop early</text><line x1="60" y1="98" x2="390" y2="98" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="56" cy="98" r="4.5" fill="#b4532a"/><line x1="60" y1="112" x2="360" y2="112" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="470" y1="98" x2="800" y2="98" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="466" cy="98" r="4.5" fill="#b4532a"/><line x1="580" y1="112" x2="770" y2="112" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><text x="40" y="132" font-size="12.5" fill="#23282d">2. oxidise the cap diol and attach biotin</text><line x1="60" y1="150" x2="390" y2="150" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="56" cy="150" r="4.5" fill="#b4532a"/><line x1="60" y1="164" x2="360" y2="164" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><circle cx="56" cy="140" r="3" fill="#2e6b3f"/><line x1="470" y1="150" x2="800" y2="150" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="466" cy="150" r="4.5" fill="#b4532a"/><line x1="580" y1="164" x2="770" y2="164" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><circle cx="466" cy="140" r="3" fill="#2e6b3f"/><text x="40" y="184" font-size="12.5" fill="#23282d">3. RNase I digests RNA that is not paired</text><line x1="60" y1="202" x2="390" y2="202" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="56" cy="202" r="4.5" fill="#b4532a"/><line x1="60" y1="216" x2="360" y2="216" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><circle cx="56" cy="192" r="3" fill="#2e6b3f"/><line x1="470" y1="202" x2="560" y2="202" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><line x1="580" y1="202" x2="800" y2="202" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><line x1="565" y1="196" x2="575" y2="208" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="565" y1="208" x2="575" y2="196" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="580" y1="216" x2="800" y2="216" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><circle cx="466" cy="202" r="4.5" fill="#b4532a"/><circle cx="466" cy="192" r="3" fill="#2e6b3f"/><text x="40" y="236" font-size="12.5" fill="#23282d">4. streptavidin beads keep what still has biotin</text><line x1="60" y1="254" x2="390" y2="254" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="56" cy="254" r="4.5" fill="#b4532a"/><line x1="60" y1="268" x2="360" y2="268" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><circle cx="56" cy="244" r="3" fill="#2e6b3f"/><circle cx="34" cy="256" r="9" fill="#e9f1ea" stroke="#2e6b3f"/><line x1="580" y1="254" x2="800" y2="254" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><line x1="580" y1="268" x2="770" y2="268" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><text x="490" y="258" font-size="11.5" fill="#a33a28">washed away</text><text x="40" y="300" font-size="12" fill="#23282d">A fragment with no cap never carries biotin. A cDNA that stopped early leaves the cap on a single-stranded tail that RNase I removes.</text><text x="40" y="324" font-size="13.5" fill="#b4532a">Result: reads that start at transcription start sites. CAGE counts them; CapTrap-seq makes them long reads.</text>
</svg>
