<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 911 280" width="911" height="280" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="280" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Template switching: the RT finishes the RNA, adds a few extra bases, and jumps.</text><text x="40" y="56" font-size="12" fill="#23282d">1. RT reaches the cap</text><line x1="70" y1="100" x2="270" y2="100" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="66" cy="100" r="4.5" fill="#b4532a"/><line x1="110" y1="116" x2="270" y2="116" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><text x="52" y="90" font-size="11" text-anchor="end" fill="#8a8f94">5'</text><text x="310" y="56" font-size="12" fill="#23282d">2. adds extra C, not templated</text><line x1="340" y1="100" x2="540" y2="100" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="336" cy="100" r="4.5" fill="#b4532a"/><line x1="380" y1="116" x2="540" y2="116" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><text x="322" y="90" font-size="11" text-anchor="end" fill="#8a8f94">5'</text><text x="362" y="128" font-size="11" text-anchor="middle" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>CCC</text><text x="580" y="56" font-size="12" fill="#23282d">3. the TSO pairs and RT copies it</text><line x1="610" y1="100" x2="810" y2="100" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><circle cx="606" cy="100" r="4.5" fill="#b4532a"/><line x1="650" y1="116" x2="810" y2="116" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><text x="592" y="90" font-size="11" text-anchor="end" fill="#8a8f94">5'</text><text x="632" y="128" font-size="11" text-anchor="middle" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>CCC</text><line x1="584" y1="146" x2="624" y2="146" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><rect x="574" y="139" width="12" height="14" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="632" y="150" font-size="11" text-anchor="middle" fill="#b4532a" font-family='ui-monospace, "DejaVu Sans Mono", "Courier New", monospace'>GGG</text><text x="680" y="158" font-size="11" fill="#b4532a">TSO</text><text x="40" y="186" font-size="12" fill="#23282d">At the end of the template the RT adds a few non-templated Cs, most often at a capped 5' end.</text><text x="40" y="206" font-size="12" fill="#23282d">TSO: a primer with a handle and a 3' run of G (often riboG or LNA-G) that pairs with the extra C.</text><text x="40" y="226" font-size="12" fill="#23282d">The cDNA now has a known sequence at both ends; one PCR primer pair amplifies it without ligation.</text><text x="40" y="262" font-size="13.5" fill="#b4532a">Where to be careful: an RNA fragment with no cap also receives extra C, so template switching alone does not prove full length.</text>
</svg>
