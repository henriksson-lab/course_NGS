<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 823 300" width="823" height="300" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="300" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Linear amplification by in vitro transcription: one template, many RNA copies.</text><text x="40" y="62" font-size="12.5" fill="#23282d">1. RT with an oligo-dT primer carrying a T7 promoter, then second strand</text><rect x="60" y="76" width="70" height="18" rx="4" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.2"/><text x="95.0" y="88.675" font-size="10.5" text-anchor="middle" fill="#b4532a">T7 promoter</text><line x1="130" y1="85" x2="330" y2="85" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="60" y1="99" x2="330" y2="99" stroke="#b4532a" stroke-width="3.2" stroke-linecap="butt"/><text x="340" y="92" font-size="11.5" fill="#8a8f94">ds cDNA with a promoter at the 3' end</text><text x="40" y="134" font-size="12.5" fill="#23282d">2. T7 RNA polymerase transcribes the antisense strand, over and over</text><line x1="110" y1="150" x2="176" y2="150" stroke="#7a3b5e" stroke-width="1.8" stroke-linecap="round"/><path d="M 180 150 L 176 147.2 L 176 152.8 Z" fill="#7a3b5e"/><line x1="110" y1="160" x2="216" y2="160" stroke="#7a3b5e" stroke-width="1.8" stroke-linecap="round"/><path d="M 220 160 L 216 157.2 L 216 162.8 Z" fill="#7a3b5e"/><line x1="110" y1="170" x2="256" y2="170" stroke="#7a3b5e" stroke-width="1.8" stroke-linecap="round"/><path d="M 260 170 L 256 167.2 L 256 172.8 Z" fill="#7a3b5e"/><line x1="110" y1="180" x2="296" y2="180" stroke="#7a3b5e" stroke-width="1.8" stroke-linecap="round"/><path d="M 300 180 L 296 177.2 L 296 182.8 Z" fill="#7a3b5e"/><line x1="110" y1="190" x2="336" y2="190" stroke="#7a3b5e" stroke-width="1.8" stroke-linecap="round"/><path d="M 340 190 L 336 187.2 L 336 192.8 Z" fill="#7a3b5e"/><text x="430" y="160" font-size="11.5" fill="#7a3b5e">many aRNA copies, each made from the original template</text><text x="40" y="224" font-size="12.5" fill="#23282d">Why linear matters: each copy comes from the starting molecule, so an early error is not itself copied again and again.</text><text x="40" y="246" font-size="12.5" fill="#23282d">PCR gives exponential growth; its small efficiency differences compound into ratio bias. IVT trades yield for faithfulness.</text><text x="40" y="282" font-size="13.5" fill="#b4532a">Price: early protocols needed repeated rounds, and coverage is biased to the 3' end. CEL-Seq2 uses one round.</text>
</svg>
