<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 256" width="860" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="860" height="256" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A small RNA is ligation-ready only if its ends are the ones a ligase wants.</text><text x="40" y="66" font-size="13" fill="#23282d">miRNA, siRNA</text><line x1="330" y1="62" x2="400" y2="62" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><text x="320" y="66" font-size="11.5" text-anchor="end" fill="#2e6b3f">5' P</text><text x="408" y="66" font-size="11.5" fill="#2e6b3f">3' OH</text><text x="530" y="66" font-size="11.5" fill="#2e6b3f">Dicer product: ready to ligate</text><text x="40" y="106" font-size="13" fill="#23282d">piRNA</text><line x1="330" y1="102" x2="430" y2="102" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><text x="320" y="106" font-size="11.5" text-anchor="end" fill="#2e6b3f">5' P</text><text x="438" y="106" font-size="11.5" fill="#a33a28">3' 2'-O-methyl</text><text x="530" y="106" font-size="11.5" fill="#a33a28">blocked 3' end: ligates poorly with some enzymes</text><text x="40" y="146" font-size="13" fill="#23282d">tRNA fragments, RNase products</text><line x1="330" y1="142" x2="430" y2="142" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><text x="320" y="146" font-size="11.5" text-anchor="end" fill="#a33a28">5' OH</text><text x="438" y="146" font-size="11.5" fill="#a33a28">3' cyclic P</text><text x="530" y="146" font-size="11.5" fill="#a33a28">a 3' phosphate blocks the ligase</text><text x="40" y="186" font-size="13" fill="#23282d">ribosome footprint (Ribo-seq)</text><line x1="330" y1="182" x2="420" y2="182" stroke="#7a3b5e" stroke-width="5" stroke-linecap="butt"/><text x="320" y="186" font-size="11.5" text-anchor="end" fill="#a33a28">5' OH</text><text x="428" y="186" font-size="11.5" fill="#a33a28">3' P</text><text x="530" y="186" font-size="11.5" fill="#a33a28">needs T4 PNK repair first</text><text x="40" y="238" font-size="14" fill="#b4532a">The library has to ligate to whatever ends the sample has. Ends that fail are invisible in the data, not just weak.</text>
</svg>
