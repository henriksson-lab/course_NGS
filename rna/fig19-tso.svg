<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 866 262" width="866" height="262" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="800" height="262" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">A TSO is a short oligo with four parts, and each part has a job.</text><rect x="60" y="80" width="120" height="36" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="120.0" y="102.025" font-size="11.5" text-anchor="middle" fill="#a33a28">5' biotin or blocker</text><rect x="180" y="80" width="120" height="36" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="240.0" y="102.025" font-size="11.5" text-anchor="middle" fill="#1f3b57">PCR handle</text><rect x="300" y="80" width="110" height="36" rx="4" fill="#f6f0e0" stroke="#b4532a" stroke-width="1.2"/><text x="355.0" y="102.025" font-size="11.5" text-anchor="middle" fill="#b4532a">barcode / UMI</text><rect x="410" y="80" width="120" height="36" rx="4" fill="#e9f1ea" stroke="#2e6b3f" stroke-width="1.2"/><text x="470.0" y="102.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">GGG (rG or LNA)</text><text x="60" y="140" font-size="11" fill="#a33a28">blocks 5' end</text><text x="180" y="140" font-size="11" fill="#1f3b57">shared primer site</text><text x="300" y="140" font-size="11" fill="#b4532a">identity information</text><text x="412" y="140" font-size="11" fill="#2e6b3f">binds the C-overhang</text><text x="40" y="186" font-size="12.5" fill="#23282d">Smart-seq3 puts a UMI and a tag in the TSO, so each 5' end is counted once and 5' reads can be told apart.</text><text x="40" y="208" font-size="12.5" fill="#23282d">Failure to watch: the TSO can also be copied by the RT, giving a strand-invasion artefact, and can prime on A-rich internal sites.</text><text x="40" y="244" font-size="13.5" fill="#b4532a">A TSO is part of the primer budget: too little leaves cDNA without a handle, too much makes by-products.</text>
</svg>
