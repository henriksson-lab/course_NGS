<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 288" width="820" height="288" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="820" height="288" fill="none"/>
<text x="40" y="26" font-size="14" fill="#23282d">Step 2: a 5' RNA adapter is added with T4 RNA ligase 1 and ATP, then RT and PCR.</text><text x="340" y="74" font-size="12" fill="#23282d">after step 1</text><line x1="60" y1="70" x2="160" y2="70" stroke="#7a3b5e" stroke-width="4" stroke-linecap="butt"/><line x1="160" y1="70" x2="250" y2="70" stroke="#8a8f94" stroke-width="4" stroke-linecap="butt"/><text x="340" y="116" font-size="12" fill="#23282d">5' adapter ligated</text><line x1="50" y1="112" x2="98" y2="112" stroke="#b4532a" stroke-width="4" stroke-linecap="butt"/><line x1="98" y1="112" x2="198" y2="112" stroke="#7a3b5e" stroke-width="4" stroke-linecap="butt"/><line x1="198" y1="112" x2="288" y2="112" stroke="#8a8f94" stroke-width="4" stroke-linecap="butt"/><text x="340" y="158" font-size="12" fill="#23282d">RT primer anneals to the 3' adapter</text><line x1="50" y1="154" x2="98" y2="154" stroke="#b4532a" stroke-width="4" stroke-linecap="butt"/><line x1="98" y1="154" x2="198" y2="154" stroke="#7a3b5e" stroke-width="4" stroke-linecap="butt"/><line x1="198" y1="154" x2="288" y2="154" stroke="#8a8f94" stroke-width="4" stroke-linecap="butt"/><line x1="220" y1="172" x2="288" y2="172" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="220" y1="172" x2="75" y2="172" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><path d="M 70 172 L 75 168.5 L 75 175.5 Z" fill="#1f3b57"/><text x="340" y="176" font-size="12" fill="#1f3b57">first-strand cDNA, now carrying both adapter sequences</text><text x="40" y="214" font-size="12.5" fill="#23282d">T4 Rnl1 joins the adapter's 3' OH to the small RNA's 5' phosphate. The RNA's 3' end is already taken by the first adapter.</text><text x="40" y="234" font-size="12.5" fill="#23282d">Only RNAs that carry a 3' adapter can be reverse transcribed, so they are the ones that end up in the library.</text><text x="40" y="270" font-size="14" fill="#b4532a">Order matters: the 3' adapter goes on first so the 5' step can only act on molecules that already carry one.</text>
</svg>
