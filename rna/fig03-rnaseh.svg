<text x="40" y="26" font-size="14" fill="#23282d">RNase H depletion: DNA oligos define the target; only RNA in an RNA:DNA hybrid is cut.</text><text x="40" y="52" font-size="12.5" fill="#23282d">1. anneal DNA oligos tiled along the rRNA</text><line x1="60" y1="74" x2="660" y2="74" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><text x="40" y="78" font-size="11" text-anchor="end" fill="#8a8f94">5'</text><text x="670" y="78" font-size="11" fill="#8a8f94">3'</text><text x="700" y="78" font-size="12" fill="#8a8f94">rRNA</text><line x1="66" y1="81" x2="112" y2="81" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="126" y1="81" x2="172" y2="81" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="186" y1="81" x2="232" y2="81" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="246" y1="81" x2="292" y2="81" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="306" y1="81" x2="352" y2="81" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="366" y1="81" x2="412" y2="81" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="426" y1="81" x2="472" y2="81" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="486" y1="81" x2="532" y2="81" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="546" y1="81" x2="592" y2="81" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="606" y1="81" x2="652" y2="81" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><text x="40" y="114" font-size="12.5" fill="#23282d">2. RNase H cuts the RNA strand</text><line x1="60" y1="136" x2="660" y2="136" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><text x="40" y="140" font-size="11" text-anchor="end" fill="#8a8f94">5'</text><text x="670" y="140" font-size="11" fill="#8a8f94">3'</text><text x="700" y="140" font-size="12" fill="#8a8f94">rRNA</text><line x1="66" y1="143" x2="112" y2="143" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="126" y1="143" x2="172" y2="143" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="186" y1="143" x2="232" y2="143" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="246" y1="143" x2="292" y2="143" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="306" y1="143" x2="352" y2="143" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="366" y1="143" x2="412" y2="143" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="426" y1="143" x2="472" y2="143" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="486" y1="143" x2="532" y2="143" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="546" y1="143" x2="592" y2="143" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="606" y1="143" x2="652" y2="143" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><line x1="118" y1="118" x2="128" y2="130" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="118" y1="130" x2="128" y2="118" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="178" y1="118" x2="188" y2="130" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="178" y1="130" x2="188" y2="118" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="238" y1="118" x2="248" y2="130" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="238" y1="130" x2="248" y2="118" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="298" y1="118" x2="308" y2="130" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="298" y1="130" x2="308" y2="118" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="358" y1="118" x2="368" y2="130" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="358" y1="130" x2="368" y2="118" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="418" y1="118" x2="428" y2="130" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="418" y1="130" x2="428" y2="118" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="478" y1="118" x2="488" y2="130" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="478" y1="130" x2="488" y2="118" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="538" y1="118" x2="548" y2="130" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="538" y1="130" x2="548" y2="118" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="598" y1="118" x2="608" y2="130" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><line x1="598" y1="130" x2="608" y2="118" stroke="#a33a28" stroke-width="1.8" stroke-linecap="round"/><text x="40" y="176" font-size="12.5" fill="#23282d">3. DNase removes the oligos; beads clean up</text><line x1="60" y1="198" x2="660" y2="198" stroke="#8a8f94" stroke-width="3.2" stroke-linecap="butt"/><text x="40" y="202" font-size="11" text-anchor="end" fill="#8a8f94">5'</text><text x="670" y="202" font-size="11" fill="#8a8f94">3'</text><text x="700" y="202" font-size="12" fill="#8a8f94">rRNA</text><rect x="117" y="192" width="6" height="12" fill="#ffffff"/><rect x="177" y="192" width="6" height="12" fill="#ffffff"/><rect x="237" y="192" width="6" height="12" fill="#ffffff"/><rect x="297" y="192" width="6" height="12" fill="#ffffff"/><rect x="357" y="192" width="6" height="12" fill="#ffffff"/><rect x="417" y="192" width="6" height="12" fill="#ffffff"/><rect x="477" y="192" width="6" height="12" fill="#ffffff"/><rect x="537" y="192" width="6" height="12" fill="#ffffff"/><rect x="597" y="192" width="6" height="12" fill="#ffffff"/><line x1="60" y1="262" x2="660" y2="262" stroke="#7a3b5e" stroke-width="3.2" stroke-linecap="butt"/><text x="700" y="266" font-size="12" fill="#7a3b5e">mRNA</text><text x="60" y="286" font-size="12" fill="#2e6b3f">no oligo anneals, so no hybrid forms and RNase H leaves it alone</text><text x="60" y="308" font-size="13" fill="#b4532a">Oligos must cover the whole rRNA: a gap leaves a fragment that survives and is still sequenced.</text>
</svg>
