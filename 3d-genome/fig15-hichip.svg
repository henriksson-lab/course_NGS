<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 813 250" width="813" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="250" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">HiChIP: make contacts first, then select the ones a protein is part of.</text><rect x="30" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="89.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1  contacts</text><text x="89.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">in situ: MboI,</text><text x="89.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">biotin fill, ligate</text><line x1="150" y1="75" x2="159" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 164 75 L 159 71.5 L 159 78.5 Z" fill="#8a8f94"/><rect x="166" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2  shear</text><text x="225.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">sonicate the</text><text x="225.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">nuclei</text><line x1="286" y1="75" x2="295" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 300 75 L 295 71.5 L 295 78.5 Z" fill="#8a8f94"/><rect x="302" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="361.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3  ChIP</text><text x="361.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">antibody to H3K27ac,</text><text x="361.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">cohesin, a TF</text><line x1="422" y1="75" x2="431" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 436 75 L 431 71.5 L 431 78.5 Z" fill="#8a8f94"/><rect x="438" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="497.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4  reverse</text><text x="497.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">free the DNA;</text><text x="497.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">biotin capture</text><line x1="558" y1="75" x2="567" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 572 75 L 567 71.5 L 567 78.5 Z" fill="#8a8f94"/><rect x="574" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="633.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">5  tagment</text><text x="633.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">Tn5 on the</text><text x="633.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">bead, PCR</text><line x1="40" y1="164" x2="300" y2="164" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="340" y1="164" x2="600" y2="164" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><path d="M 220 164 C 240 104, 400 104, 420 164" fill="none" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><rect x="205" y="170" width="30" height="14" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="30" y="212" font-size="12.5" fill="#23282d">Only contacts anchored at the protein you chose survive the pull-down. A Hi-C library has to be deep to see the same thing.</text><text x="30" y="234" font-size="12.5" fill="#b4532a">The map is no longer unbiased: peaks of the target protein shape the pattern.</text>
</svg>
