<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 819 240" width="819" height="240" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="240" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">4C: fix one viewpoint, find everything it touches.</text><rect x="30" y="40" width="150" height="66" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="105.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1  3C library</text><text x="105.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">digest with enzyme 1,</text><text x="105.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">ligate, reverse</text><line x1="183" y1="73" x2="191" y2="73" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 196 73 L 191 69.5 L 191 76.5 Z" fill="#8a8f94"/><rect x="198" y="40" width="150" height="66" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="273.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2  cut again</text><text x="273.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">enzyme 2 shortens</text><text x="273.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">the fragments</text><line x1="351" y1="73" x2="359" y2="73" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 364 73 L 359 69.5 L 359 76.5 Z" fill="#8a8f94"/><rect x="366" y="40" width="150" height="66" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="441.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3  circularise</text><text x="441.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">dilute ligation makes</text><text x="441.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">small circles</text><line x1="519" y1="73" x2="527" y2="73" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 532 73 L 527 69.5 L 527 76.5 Z" fill="#8a8f94"/><rect x="534" y="40" width="150" height="66" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="609.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4  inverse PCR</text><text x="609.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">primers in the</text><text x="609.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">viewpoint, facing out</text><circle cx="200" cy="188" r="38" fill="none" stroke="#8a8f94" stroke-width="3"/><path d="M 162 188 A 38 38 0 0 1 200 150" fill="none" stroke="#1f3b57" stroke-width="5"/><path d="M 200 150 A 38 38 0 0 1 238 188" fill="none" stroke="#4a6b8a" stroke-width="5"/><text x="154" y="148" font-size="12" text-anchor="end" fill="#1f3b57">viewpoint</text><text x="246" y="148" font-size="12" fill="#4a6b8a">unknown partner</text><line x1="170" y1="136" x2="191" y2="136" stroke="#1f3b57" stroke-width="1.6" stroke-linecap="round"/><path d="M 196 136 L 191 132.5 L 191 139.5 Z" fill="#1f3b57"/><text x="330" y="168" font-size="12.5" fill="#23282d">The primers lie in the known viewpoint, but read outward across the junction</text><text x="330" y="190" font-size="12.5" fill="#23282d">into whatever it was ligated to. Result: one viewpoint, all partners.</text><text x="330" y="216" font-size="12" fill="#8a8f94">Zhao et al. 2006; Simonis et al. 2006</text>
</svg>
