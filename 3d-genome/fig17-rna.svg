<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 292" width="720" height="292" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="292" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">RNA–chromatin contacts: the bridge carries RNA to DNA.</text><line x1="40" y1="150" x2="700" y2="150" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><ellipse cx="150" cy="150" rx="12" ry="13.8" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><ellipse cx="190" cy="150" rx="12" ry="13.8" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><path d="M 300 120 C 330 60, 420 60, 440 100" fill="none" stroke="#7a3b5e" stroke-width="3" stroke-linecap="round"/><text x="350" y="50" font-size="12" text-anchor="middle" fill="#7a3b5e">chromatin-associated RNA</text><rect x="436" y="94" width="56" height="18" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="464.0" y="107.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">bridge</text><circle cx="464" cy="88" r="4" fill="#2e6b3f"/><line x1="464" y1="112" x2="464" y2="148" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><text x="480" y="130" font-size="12" fill="#1f3b57">DNA nearby</text><text x="30" y="204" font-size="12.5" fill="#23282d">1  fragment the RNA in fixed nuclei; join its 3' end to one end of the bridge</text><text x="30" y="224" font-size="12.5" fill="#23282d">2  cut the DNA and join the other end of the bridge to it</text><text x="30" y="244" font-size="12.5" fill="#23282d">3  reverse-transcribe, capture the biotin, sequence: one read = RNA part + DNA part</text><text x="30" y="276" font-size="12.5" fill="#8a8f94">ChAR-seq, GRID-seq and iMARGI differ mainly in the design of the bridge and in the enzymes used.</text>
</svg>
