<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 769 268" width="769" height="268" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="268" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Proximity ligation: the block, in four moves.</text><rect x="30" y="40" width="150" height="66" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="105.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1  crosslink</text><text x="105.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">formaldehyde holds</text><text x="105.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">neighbours together</text><line x1="183" y1="73" x2="191" y2="73" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 196 73 L 191 69.5 L 191 76.5 Z" fill="#8a8f94"/><rect x="198" y="40" width="150" height="66" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="273.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2  digest</text><text x="273.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">cut the DNA into</text><text x="273.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">fragments</text><line x1="351" y1="73" x2="359" y2="73" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 364 73 L 359 69.5 L 359 76.5 Z" fill="#8a8f94"/><rect x="366" y="40" width="150" height="66" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="441.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3  ligate</text><text x="441.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">join ends that are</text><text x="441.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">held close together</text><line x1="519" y1="73" x2="527" y2="73" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 532 73 L 527 69.5 L 527 76.5 Z" fill="#8a8f94"/><rect x="534" y="40" width="150" height="66" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="609.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4  pull down</text><text x="609.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">keep the molecules</text><text x="609.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">with a junction</text><text x="30" y="128" font-size="12" fill="#8a8f94">what the DNA looks like</text><path d="M 40 176 C 60 146, 100 146, 120 176" fill="none" stroke="#1f3b57" stroke-width="3" stroke-linecap="round"/><path d="M 40 191 C 60 221, 100 221, 120 191" fill="none" stroke="#4a6b8a" stroke-width="3" stroke-linecap="round"/><circle cx="80" cy="184" r="6" fill="#b4532a"/><line x1="210" y1="176" x2="245" y2="176" stroke="#1f3b57" stroke-width="3" stroke-linecap="butt"/><line x1="255" y1="176" x2="290" y2="176" stroke="#1f3b57" stroke-width="3" stroke-linecap="butt"/><line x1="210" y1="198" x2="245" y2="198" stroke="#4a6b8a" stroke-width="3" stroke-linecap="butt"/><line x1="255" y1="198" x2="290" y2="198" stroke="#4a6b8a" stroke-width="3" stroke-linecap="butt"/><line x1="246" y1="178" x2="254" y2="196" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="254" y1="178" x2="246" y2="196" stroke="#b4532a" stroke-width="2.2" stroke-linecap="round"/><line x1="380" y1="182" x2="460" y2="182" stroke="#1f3b57" stroke-width="3" stroke-linecap="butt"/><line x1="380" y1="198" x2="460" y2="198" stroke="#4a6b8a" stroke-width="3" stroke-linecap="butt"/><circle cx="420" cy="190" r="5" fill="#b4532a"/><line x1="560" y1="190" x2="640" y2="190" stroke="#1f3b57" stroke-width="3" stroke-linecap="butt"/><circle cx="600" cy="190" r="5" fill="#2e6b3f"/><text x="600" y="214" font-size="12" text-anchor="middle" fill="#2e6b3f">junction kept</text><text x="30" y="252" font-size="12.5" fill="#23282d">Every protocol below changes one of these four moves: how it is held, what cuts, how it is joined, what is selected.</text>
</svg>
