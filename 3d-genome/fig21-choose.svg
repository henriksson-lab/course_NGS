<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 278" width="720" height="278" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="278" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Pick the method from the question.</text><rect x="30" y="34" width="340" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="200.0" y="52.375" font-size="12.5" text-anchor="middle" fill="#23282d">Where are TADs and compartments genome-wide?</text><line x1="376" y1="48" x2="397" y2="48" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 402 48 L 397 44.5 L 397 51.5 Z" fill="#8a8f94"/><rect x="408" y="34" width="282" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="549.0" y="52.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">Hi-C or in situ Hi-C</text><rect x="30" y="74" width="340" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="200.0" y="92.375" font-size="12.5" text-anchor="middle" fill="#23282d">Which enhancers touch this one gene?</text><line x1="376" y1="88" x2="397" y2="88" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 402 88 L 397 84.5 L 397 91.5 Z" fill="#8a8f94"/><rect x="408" y="74" width="282" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="549.0" y="92.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">4C-seq, Capture-C</text><rect x="30" y="114" width="340" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="200.0" y="132.375" font-size="12.5" text-anchor="middle" fill="#23282d">Fine-scale loops and stripes?</text><line x1="376" y1="128" x2="397" y2="128" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 402 128 L 397 124.5 L 397 131.5 Z" fill="#8a8f94"/><rect x="408" y="114" width="282" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="549.0" y="132.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">Micro-C</text><rect x="30" y="154" width="340" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="200.0" y="172.375" font-size="12.5" text-anchor="middle" fill="#23282d">Contacts at active enhancers, from few cells?</text><line x1="376" y1="168" x2="397" y2="168" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 402 168 L 397 164.5 L 397 171.5 Z" fill="#8a8f94"/><rect x="408" y="154" width="282" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="549.0" y="172.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">HiChIP</text><rect x="30" y="194" width="340" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="200.0" y="212.375" font-size="12.5" text-anchor="middle" fill="#23282d">Many-way contacts, and what is at a nuclear body?</text><line x1="376" y1="208" x2="397" y2="208" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 402 208 L 397 204.5 L 397 211.5 Z" fill="#8a8f94"/><rect x="408" y="194" width="282" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="549.0" y="212.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">SPRITE, GAM</text><rect x="30" y="234" width="340" height="28" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="200.0" y="252.375" font-size="12.5" text-anchor="middle" fill="#23282d">Which RNAs sit on which DNA?</text><line x1="376" y1="248" x2="397" y2="248" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 402 248 L 397 244.5 L 397 251.5 Z" fill="#8a8f94"/><rect x="408" y="234" width="282" height="28" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="549.0" y="252.375" font-size="12.5" text-anchor="middle" fill="#2e6b3f">ChAR-seq, GRID-seq, iMARGI</text>
</svg>
