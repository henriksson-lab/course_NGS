<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 875 266" width="875" height="266" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="266" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">GAM: slice the nucleus, sequence the slices, and count who turns up together.</text><circle cx="110" cy="120" r="74" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><rect x="96" y="40" width="28" height="160" fill="#f5eae6" stroke="#b4532a" stroke-width="1.2"/><circle cx="110" cy="90" r="6" fill="#1f3b57"/><circle cx="110" cy="120" r="6" fill="#4a6b8a"/><circle cx="70" cy="150" r="6" fill="#2e6b3f"/><text x="122" y="92" font-size="12" fill="#1f3b57">A</text><text x="122" y="124" font-size="12" fill="#4a6b8a">B</text><text x="76" y="170" font-size="12" fill="#2e6b3f">C</text><text x="110" y="214" font-size="12" text-anchor="middle" fill="#b4532a">a thin slice through one nucleus</text><text x="290" y="48" font-size="12" text-anchor="end" fill="#8a8f94">slice:</text><text x="290" y="76" font-size="13" text-anchor="end" fill="#1f3b57" font-weight="bold">A</text><rect x="300" y="60" width="30" height="24" rx="3" fill="#1f3b57" stroke="#8a8f94" stroke-width="1"/><rect x="340" y="60" width="30" height="24" rx="3" fill="#1f3b57" stroke="#8a8f94" stroke-width="1"/><rect x="380" y="60" width="30" height="24" rx="3" fill="none" stroke="#8a8f94" stroke-width="1"/><rect x="420" y="60" width="30" height="24" rx="3" fill="#1f3b57" stroke="#8a8f94" stroke-width="1"/><rect x="460" y="60" width="30" height="24" rx="3" fill="#1f3b57" stroke="#8a8f94" stroke-width="1"/><rect x="500" y="60" width="30" height="24" rx="3" fill="none" stroke="#8a8f94" stroke-width="1"/><rect x="540" y="60" width="30" height="24" rx="3" fill="#1f3b57" stroke="#8a8f94" stroke-width="1"/><rect x="580" y="60" width="30" height="24" rx="3" fill="none" stroke="#8a8f94" stroke-width="1"/><text x="290" y="110" font-size="13" text-anchor="end" fill="#4a6b8a" font-weight="bold">B</text><rect x="300" y="94" width="30" height="24" rx="3" fill="#4a6b8a" stroke="#8a8f94" stroke-width="1"/><rect x="340" y="94" width="30" height="24" rx="3" fill="#4a6b8a" stroke="#8a8f94" stroke-width="1"/><rect x="380" y="94" width="30" height="24" rx="3" fill="none" stroke="#8a8f94" stroke-width="1"/><rect x="420" y="94" width="30" height="24" rx="3" fill="#4a6b8a" stroke="#8a8f94" stroke-width="1"/><rect x="460" y="94" width="30" height="24" rx="3" fill="#4a6b8a" stroke="#8a8f94" stroke-width="1"/><rect x="500" y="94" width="30" height="24" rx="3" fill="none" stroke="#8a8f94" stroke-width="1"/><rect x="540" y="94" width="30" height="24" rx="3" fill="#4a6b8a" stroke="#8a8f94" stroke-width="1"/><rect x="580" y="94" width="30" height="24" rx="3" fill="none" stroke="#8a8f94" stroke-width="1"/><text x="290" y="144" font-size="13" text-anchor="end" fill="#2e6b3f" font-weight="bold">C</text><rect x="300" y="128" width="30" height="24" rx="3" fill="none" stroke="#8a8f94" stroke-width="1"/><rect x="340" y="128" width="30" height="24" rx="3" fill="#2e6b3f" stroke="#8a8f94" stroke-width="1"/><rect x="380" y="128" width="30" height="24" rx="3" fill="#2e6b3f" stroke="#8a8f94" stroke-width="1"/><rect x="420" y="128" width="30" height="24" rx="3" fill="none" stroke="#8a8f94" stroke-width="1"/><rect x="460" y="128" width="30" height="24" rx="3" fill="none" stroke="#8a8f94" stroke-width="1"/><rect x="500" y="128" width="30" height="24" rx="3" fill="#2e6b3f" stroke="#8a8f94" stroke-width="1"/><rect x="540" y="128" width="30" height="24" rx="3" fill="none" stroke="#8a8f94" stroke-width="1"/><rect x="580" y="128" width="30" height="24" rx="3" fill="#2e6b3f" stroke="#8a8f94" stroke-width="1"/><text x="315" y="48" font-size="11.5" text-anchor="middle" fill="#8a8f94">1</text><text x="355" y="48" font-size="11.5" text-anchor="middle" fill="#8a8f94">2</text><text x="395" y="48" font-size="11.5" text-anchor="middle" fill="#8a8f94">3</text><text x="435" y="48" font-size="11.5" text-anchor="middle" fill="#8a8f94">4</text><text x="475" y="48" font-size="11.5" text-anchor="middle" fill="#8a8f94">5</text><text x="515" y="48" font-size="11.5" text-anchor="middle" fill="#8a8f94">6</text><text x="555" y="48" font-size="11.5" text-anchor="middle" fill="#8a8f94">7</text><text x="595" y="48" font-size="11.5" text-anchor="middle" fill="#8a8f94">8</text><text x="300" y="190" font-size="12.5" fill="#23282d">A and B are found together in the same slices far more often than chance</text><text x="300" y="210" font-size="12.5" fill="#23282d">would give: they are close in space. C is not tied to them.</text><text x="30" y="250" font-size="12.5" fill="#b4532a">Each slice is cut out by laser, its DNA amplified and sequenced: no crosslinking to ligate, no restriction enzyme, only co-detection.</text>
</svg>
