<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 226" width="720" height="226" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="226" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">3C: is this one place in contact with that one?</text><line x1="40" y1="70" x2="300" y2="70" stroke="#1f3b57" stroke-width="5" stroke-linecap="butt"/><line x1="300" y1="70" x2="600" y2="70" stroke="#4a6b8a" stroke-width="5" stroke-linecap="butt"/><circle cx="300" cy="70" r="6" fill="#b4532a"/><text x="300" y="56" font-size="12" text-anchor="middle" fill="#b4532a">junction</text><line x1="150" y1="94" x2="225" y2="94" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><path d="M 230 94 L 225 90.0 L 225 98.0 Z" fill="#1f3b57"/><line x1="450" y1="94" x2="375" y2="94" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><path d="M 370 94 L 375 90.0 L 375 98.0 Z" fill="#4a6b8a"/><text x="150" y="120" font-size="12" fill="#1f3b57">forward primer, fragment A</text><text x="450" y="120" font-size="12" text-anchor="end" fill="#4a6b8a">reverse primer, fragment B</text><text x="30" y="164" font-size="12.5" fill="#23282d">A PCR product exists only if A and B were ligated, which happened only if they were close.</text><text x="30" y="186" font-size="12.5" fill="#23282d">Read out by qPCR or a gel, one pair of primers at a time: one-versus-one.</text><text x="30" y="212" font-size="12.5" fill="#8a8f94">Dekker et al. 2002 introduced the method.</text>
</svg>
