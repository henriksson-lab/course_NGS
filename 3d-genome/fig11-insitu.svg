<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 788 256" width="788" height="256" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="256" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">In situ Hi-C: do every enzymatic step inside intact nuclei.</text><rect x="30" y="40" width="103" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="81.5" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1  crosslink</text><text x="81.5" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">cells, 1%</text><text x="81.5" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">formaldehyde</text><line x1="135" y1="75" x2="138" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 142 75 L 138 72.2 L 138 77.8 Z" fill="#8a8f94"/><rect x="143" y="40" width="103" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="194.5" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2  permeabilise</text><text x="194.5" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">mild detergent;</text><text x="194.5" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">nuclei stay whole</text><line x1="248" y1="75" x2="251" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 255 75 L 251 72.2 L 251 77.8 Z" fill="#8a8f94"/><rect x="256" y="40" width="103" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="307.5" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3  MboI</text><text x="307.5" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">4-cutter, GATC,</text><text x="307.5" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">in the nucleus</text><line x1="361" y1="75" x2="364" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 368 75 L 364 72.2 L 364 77.8 Z" fill="#8a8f94"/><rect x="369" y="40" width="103" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="420.5" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4  biotin fill-in</text><text x="420.5" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">mark the ends,</text><text x="420.5" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">in the nucleus</text><line x1="474" y1="75" x2="477" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 481 75 L 477 72.2 L 477 77.8 Z" fill="#8a8f94"/><rect x="482" y="40" width="103" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="533.5" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">5  ligate</text><text x="533.5" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">in the nucleus</text><line x1="587" y1="75" x2="590" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 594 75 L 590 72.2 L 590 77.8 Z" fill="#8a8f94"/><rect x="595" y="40" width="103" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="646.5" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">6  release</text><text x="646.5" y="76" font-size="11" text-anchor="middle" fill="#8a8f94">reverse, shear,</text><text x="646.5" y="91" font-size="11" text-anchor="middle" fill="#8a8f94">streptavidin</text><ellipse cx="360" cy="170" rx="200" ry="46" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><text x="360" y="156" font-size="12.5" text-anchor="middle" fill="#1f3b57">the nucleus is the reaction vessel</text><text x="360" y="180" font-size="12" text-anchor="middle" fill="#23282d">no dilution needed: each fragment is still held in place</text><text x="30" y="240" font-size="12.5" fill="#23282d">Compared with the original, in-solution protocol this gives fewer random ligations and more informative pairs per read.</text>
</svg>
