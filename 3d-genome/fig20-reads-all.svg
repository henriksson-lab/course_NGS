<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 270" width="720" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="270" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">What one read, or read pair, means.</text><rect x="30" y="32" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="47.2" font-size="12" text-anchor="middle" fill="#1f3b57">Hi-C</text><text x="152" y="48" font-size="12.5" fill="#23282d">two ends of a ligated molecule: a pairwise contact</text><rect x="30" y="60" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="75.2" font-size="12" text-anchor="middle" fill="#1f3b57">in situ Hi-C</text><text x="152" y="76" font-size="12.5" fill="#23282d">the same, with fewer random joins</text><rect x="30" y="88" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="103.2" font-size="12" text-anchor="middle" fill="#1f3b57">Micro-C</text><text x="152" y="104" font-size="12.5" fill="#23282d">the same at nucleosome resolution</text><rect x="30" y="116" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="131.2" font-size="12" text-anchor="middle" fill="#1f3b57">4C-seq</text><text x="152" y="132" font-size="12.5" fill="#23282d">one viewpoint joined to a partner</text><rect x="30" y="144" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="159.2" font-size="12" text-anchor="middle" fill="#1f3b57">HiChIP</text><text x="152" y="160" font-size="12.5" fill="#23282d">a contact, anchored at a protein-bound site</text><rect x="30" y="172" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="187.2" font-size="12" text-anchor="middle" fill="#1f3b57">ChAR-seq</text><text x="152" y="188" font-size="12.5" fill="#23282d">an RNA joined to a nearby DNA piece</text><rect x="30" y="200" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="215.2" font-size="12" text-anchor="middle" fill="#1f3b57">SPRITE</text><text x="152" y="216" font-size="12.5" fill="#23282d">a DNA piece; same barcodes = same complex</text><rect x="30" y="228" width="110" height="22" rx="4" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.2"/><text x="85.0" y="243.2" font-size="12" text-anchor="middle" fill="#1f3b57">GAM</text><text x="152" y="244" font-size="12.5" fill="#23282d">a window present in one slice; co-presence = contact</text>
</svg>
