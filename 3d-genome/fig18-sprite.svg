<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 244" width="720" height="244" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="244" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">SPRITE: no ligation between neighbours, only shared barcodes.</text><text x="30" y="52" font-size="12.5" fill="#23282d">crosslinked complexes on beads: three, each with several DNA pieces</text><line x1="60" y1="78" x2="80" y2="78" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="86" y1="86" x2="106" y2="86" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="112" y1="78" x2="132" y2="78" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><ellipse cx="90" cy="84" rx="48" ry="18" fill="none" stroke="#1f3b57" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="230" y1="78" x2="250" y2="78" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><line x1="256" y1="86" x2="276" y2="86" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><line x1="282" y1="78" x2="302" y2="78" stroke="#b4532a" stroke-width="4" stroke-linecap="round"/><ellipse cx="260" cy="84" rx="48" ry="18" fill="none" stroke="#b4532a" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="400" y1="78" x2="420" y2="78" stroke="#2e6b3f" stroke-width="4" stroke-linecap="round"/><line x1="426" y1="86" x2="446" y2="86" stroke="#2e6b3f" stroke-width="4" stroke-linecap="round"/><line x1="452" y1="78" x2="472" y2="78" stroke="#2e6b3f" stroke-width="4" stroke-linecap="round"/><ellipse cx="430" cy="84" rx="48" ry="18" fill="none" stroke="#2e6b3f" stroke-width="1.2" stroke-dasharray="3 3"/><text x="30" y="128" font-size="12.5" fill="#23282d">round 1: split into 96 wells, ligate a tag; pool. Round 2: split again, tag again; pool ...</text><rect x="40" y="150" width="168" height="22" rx="4" fill="#fbfbf9" stroke="#1f3b57" stroke-width="1.2"/><text x="124.0" y="165.2" font-size="12" text-anchor="middle" fill="#1f3b57">A7 · B3 · C12 · D5</text><rect x="230" y="150" width="168" height="22" rx="4" fill="#fbfbf9" stroke="#b4532a" stroke-width="1.2"/><text x="314.0" y="165.2" font-size="12" text-anchor="middle" fill="#b4532a">A41 · B88 · C2 · D60</text><rect x="420" y="150" width="168" height="22" rx="4" fill="#fbfbf9" stroke="#2e6b3f" stroke-width="1.2"/><text x="504.0" y="165.2" font-size="12" text-anchor="middle" fill="#2e6b3f">A19 · B9 · C77 · D31</text><text x="30" y="204" font-size="12.5" fill="#23282d">Every piece in one complex carries the same tag chain. Reads with the same chain come from one complex.</text><text x="30" y="228" font-size="12.5" fill="#b4532a">Complexes of 2 pieces or of 200 are both captured: clusters, not pairs.</text>
</svg>
