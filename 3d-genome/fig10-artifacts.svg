<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 286" width="750" height="286" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="286" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Not every read pair is a contact: look at where and which way.</text><line x1="40" y1="70" x2="640" y2="70" stroke="#dfe3e6" stroke-width="4" stroke-linecap="butt"/><line x1="60" y1="61" x2="60" y2="79" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="230" y1="61" x2="230" y2="79" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="400" y1="61" x2="400" y2="79" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="570" y1="61" x2="570" y2="79" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="70" y1="58" x2="125" y2="58" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><path d="M 130 58 L 125 54.0 L 125 62.0 Z" fill="#1f3b57"/><line x1="580" y1="58" x2="525" y2="58" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><path d="M 520 58 L 525 54.0 L 525 62.0 Z" fill="#4a6b8a"/><text x="40" y="104" font-size="12.5" fill="#2e6b3f" font-weight="bold">valid pair</text><text x="140" y="104" font-size="12" fill="#23282d">two different fragments, any orientation</text><line x1="40" y1="132" x2="640" y2="132" stroke="#dfe3e6" stroke-width="4" stroke-linecap="butt"/><line x1="60" y1="123" x2="60" y2="141" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="230" y1="123" x2="230" y2="141" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="400" y1="123" x2="400" y2="141" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="570" y1="123" x2="570" y2="141" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="240" y1="120" x2="285" y2="120" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><path d="M 290 120 L 285 116.0 L 285 124.0 Z" fill="#1f3b57"/><line x1="390" y1="120" x2="345" y2="120" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><path d="M 340 120 L 345 116.0 L 345 124.0 Z" fill="#4a6b8a"/><text x="40" y="166" font-size="12.5" fill="#a33a28" font-weight="bold">dangling end</text><text x="140" y="166" font-size="12" fill="#23282d">both reads on one fragment, facing inward: never ligated</text><line x1="40" y1="194" x2="640" y2="194" stroke="#dfe3e6" stroke-width="4" stroke-linecap="butt"/><line x1="60" y1="185" x2="60" y2="203" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="230" y1="185" x2="230" y2="203" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="400" y1="185" x2="400" y2="203" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="570" y1="185" x2="570" y2="203" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><line x1="340" y1="182" x2="295" y2="182" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><path d="M 290 182 L 295 178.0 L 295 186.0 Z" fill="#1f3b57"/><line x1="300" y1="208" x2="345" y2="208" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><path d="M 350 208 L 345 204.0 L 345 212.0 Z" fill="#4a6b8a"/><text x="40" y="228" font-size="12.5" fill="#a33a28" font-weight="bold">self-circle</text><text x="140" y="228" font-size="12" fill="#23282d">both reads on one fragment, facing outward: ligated to itself</text><text x="30" y="270" font-size="12.5" fill="#8a8f94">Ticks are restriction sites. Pairs inside one fragment, or very close with unusual orientation, are filtered out.</text>
</svg>
