<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 288" width="844" height="288" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="288" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Most DNA in the tube is not a junction.</text><line x1="40" y1="70" x2="240" y2="70" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="240" y1="70" x2="400" y2="70" stroke="#4a6b8a" stroke-width="4" stroke-linecap="butt"/><circle cx="240" cy="70" r="6" fill="#2e6b3f"/><text x="430" y="64" font-size="12.5" fill="#23282d">junction fragment</text><text x="430" y="82" font-size="12" fill="#2e6b3f">kept: biotin in the middle</text><line x1="40" y1="122" x2="240" y2="122" stroke="#8a8f94" stroke-width="4" stroke-linecap="butt"/><text x="430" y="116" font-size="12.5" fill="#23282d">unligated fragment</text><text x="430" y="134" font-size="12" fill="#8a8f94">no biotin: washed away</text><line x1="40" y1="174" x2="240" y2="174" stroke="#8a8f94" stroke-width="4" stroke-linecap="butt"/><circle cx="40" cy="174" r="6" fill="#2e6b3f"/><text x="430" y="168" font-size="12.5" fill="#23282d">dangling end, biotin at the end</text><text x="430" y="186" font-size="12" fill="#8a8f94">stripped or sequenced as noise</text><rect x="40" y="214" width="230" height="30" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="155.0" y="233.2" font-size="12" text-anchor="middle" fill="#2e6b3f">streptavidin beads hold the biotin</text><text x="290" y="233" font-size="12.5" fill="#23282d">wash hard, then release the DNA for the library</text><text x="30" y="272" font-size="12.5" fill="#8a8f94">Hi-C libraries are mostly the first kind only because of this step. Protocols vary in how they strip biotin from unligated ends.</text>
</svg>
