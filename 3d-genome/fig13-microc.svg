<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="250" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Micro-C: cut with MNase, so the unit is the nucleosome.</text><rect x="30" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="89.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">1  fix</text><text x="89.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">formaldehyde, then</text><text x="89.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">DSG as well</text><line x1="150" y1="75" x2="159" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 164 75 L 159 71.5 L 159 78.5 Z" fill="#8a8f94"/><rect x="166" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="225.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">2  MNase</text><text x="225.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">digest to</text><text x="225.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">mononucleosomes</text><line x1="286" y1="75" x2="295" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 300 75 L 295 71.5 L 295 78.5 Z" fill="#8a8f94"/><rect x="302" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="361.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">3  repair + biotin</text><text x="361.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">make blunt ends,</text><text x="361.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">label them</text><line x1="422" y1="75" x2="431" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 436 75 L 431 71.5 L 431 78.5 Z" fill="#8a8f94"/><rect x="438" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="497.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">4  ligate</text><text x="497.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">join neighbouring</text><text x="497.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">nucleosomes</text><line x1="558" y1="75" x2="567" y2="75" stroke="#8a8f94" stroke-width="1.6" stroke-linecap="round"/><path d="M 572 75 L 567 71.5 L 567 78.5 Z" fill="#8a8f94"/><rect x="574" y="40" width="118" height="70" rx="4" fill="#fbfbf9" stroke="#8a8f94" stroke-width="1.2"/><text x="633.0" y="57" font-size="13" text-anchor="middle" fill="#b4532a" font-weight="bold">5  pull down</text><text x="633.0" y="76" font-size="11.5" text-anchor="middle" fill="#8a8f94">streptavidin, then</text><text x="633.0" y="91" font-size="11.5" text-anchor="middle" fill="#8a8f94">library</text><line x1="30" y1="164" x2="690" y2="164" stroke="#8a8f94" stroke-width="2.4" stroke-linecap="butt"/><ellipse cx="70" cy="164" rx="14" ry="16.1" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><ellipse cx="130" cy="164" rx="14" ry="16.1" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><ellipse cx="190" cy="164" rx="14" ry="16.1" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><ellipse cx="250" cy="164" rx="14" ry="16.1" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><ellipse cx="310" cy="164" rx="14" ry="16.1" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><ellipse cx="370" cy="164" rx="14" ry="16.1" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><ellipse cx="430" cy="164" rx="14" ry="16.1" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><ellipse cx="490" cy="164" rx="14" ry="16.1" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><ellipse cx="550" cy="164" rx="14" ry="16.1" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><ellipse cx="610" cy="164" rx="14" ry="16.1" fill="#e9dcc6" stroke="#a08560" stroke-width="1.4"/><text x="30" y="212" font-size="12.5" fill="#23282d">No fixed restriction site, so a junction can fall between any two nucleosomes, and the ends are mixed: repair first.</text><text x="30" y="234" font-size="12.5" fill="#b4532a">The result resolves features finer than a restriction digest can: single enhancer-promoter contacts, stripes, nucleosome-scale structure.</text>
</svg>
