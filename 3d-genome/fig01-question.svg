<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 266" width="720" height="266" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="266" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Far apart along the chromosome, next to each other in the nucleus.</text><line x1="30" y1="70" x2="690" y2="70" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><rect x="140" y="48" width="66" height="18" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="173.0" y="60.85" font-size="11" text-anchor="middle" fill="#a33a28">enhancer</text><rect x="520" y="48" width="66" height="18" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="553.0" y="60.85" font-size="11" text-anchor="middle" fill="#2e6b3f">gene</text><text x="360" y="92" font-size="12" text-anchor="middle" fill="#8a8f94">300 kb of DNA in between</text><path d="M 30 200 L 330 200 C 240 100, 480 100, 390 200 L 690 200" fill="none" stroke="#8a8f94" stroke-width="3" stroke-linecap="round"/><rect x="262" y="204" width="66" height="18" rx="4" fill="#f5eae6" stroke="#a33a28" stroke-width="1.2"/><text x="295.0" y="216.85" font-size="11" text-anchor="middle" fill="#a33a28">enhancer</text><rect x="392" y="204" width="66" height="18" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="425.0" y="216.85" font-size="11" text-anchor="middle" fill="#2e6b3f">gene</text><text x="360" y="112" font-size="12" text-anchor="middle" fill="#1f3b57">folded: the two sit side by side, and the enhancer can act</text><text x="30" y="250" font-size="12.5" fill="#23282d">Sequencing the genome cannot tell you this. Proximity ligation turns "close in space" into a molecule.</text>
</svg>
