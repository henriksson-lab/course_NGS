<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 252" width="720" height="252" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="252" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">A read pair across a junction is one observed contact.</text><line x1="30" y1="60" x2="690" y2="60" stroke="#8a8f94" stroke-width="3" stroke-linecap="butt"/><line x1="140" y1="60" x2="230" y2="60" stroke="#1f3b57" stroke-width="5" stroke-linecap="butt"/><line x1="480" y1="60" x2="570" y2="60" stroke="#4a6b8a" stroke-width="5" stroke-linecap="butt"/><text x="185" y="46" font-size="12" text-anchor="middle" fill="#1f3b57">fragment A</text><text x="525" y="46" font-size="12" text-anchor="middle" fill="#4a6b8a">fragment B</text><text x="360" y="82" font-size="12" text-anchor="middle" fill="#8a8f94">far apart on the chromosome, close in the nucleus</text><line x1="250" y1="140" x2="360" y2="140" stroke="#1f3b57" stroke-width="5" stroke-linecap="butt"/><line x1="360" y1="140" x2="470" y2="140" stroke="#4a6b8a" stroke-width="5" stroke-linecap="butt"/><circle cx="360" cy="140" r="6" fill="#b4532a"/><text x="360" y="168" font-size="12" text-anchor="middle" fill="#b4532a">ligation junction</text><line x1="252" y1="126" x2="307" y2="126" stroke="#1f3b57" stroke-width="3.2" stroke-linecap="butt"/><path d="M 312 126 L 307 122.0 L 307 130.0 Z" fill="#1f3b57"/><line x1="468" y1="126" x2="413" y2="126" stroke="#4a6b8a" stroke-width="3.2" stroke-linecap="butt"/><path d="M 408 126 L 413 122.0 L 413 130.0 Z" fill="#4a6b8a"/><line x1="252" y1="120" x2="150" y2="66" stroke="#1f3b57" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><line x1="468" y1="120" x2="560" y2="66" stroke="#4a6b8a" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 3"/><text x="30" y="214" font-size="12.5" fill="#23282d">Read 1 aligns to A and read 2 aligns to B. A normal fragment would put both reads side by side.</text><text x="30" y="236" font-size="12.5" fill="#b4532a">Count such pairs between every two places in the genome: that is the contact map.</text>
</svg>
