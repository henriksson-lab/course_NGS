<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="270" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">A bridge linker makes the junction a known sequence.</text><text x="30" y="46" font-size="12.5" fill="#23282d" font-weight="bold">direct ligation: the junction is just two ends joined</text><line x1="40" y1="74" x2="300" y2="74" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><line x1="300" y1="74" x2="560" y2="74" stroke="#4a6b8a" stroke-width="4" stroke-linecap="butt"/><text x="300" y="100" font-size="11.5" text-anchor="middle" fill="#8a8f94">no mark</text><text x="30" y="128" font-size="12.5" fill="#23282d" font-weight="bold">bridge linker: two ligations through a short biotinylated duplex</text><line x1="40" y1="160" x2="280" y2="160" stroke="#1f3b57" stroke-width="4" stroke-linecap="butt"/><rect x="280" y="151" width="70" height="18" rx="4" fill="#e6f0e8" stroke="#2e6b3f" stroke-width="1.2"/><text x="315.0" y="164.025" font-size="11.5" text-anchor="middle" fill="#2e6b3f">linker</text><circle cx="315" cy="144" r="4" fill="#2e6b3f"/><line x1="350" y1="160" x2="590" y2="160" stroke="#4a6b8a" stroke-width="4" stroke-linecap="butt"/><text x="315" y="190" font-size="11.5" text-anchor="middle" fill="#2e6b3f">biotin and a sequence we chose</text><text x="30" y="232" font-size="12.5" fill="#23282d">Pull-down and junction detection no longer depend on a restriction site, so nearly any cut will do, and the linker can carry other cargo.</text><text x="30" y="254" font-size="12.5" fill="#b4532a">The linker can also join DNA to something that is not DNA: an RNA, for example.</text>
</svg>
