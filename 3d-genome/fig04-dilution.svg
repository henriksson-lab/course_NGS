<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 863 254" width="863" height="254" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="254" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">Ligate what was close, not what met by chance.</text><text x="130" y="52" font-size="13" text-anchor="middle" fill="#23282d" font-weight="bold">concentrated lysate</text><line x1="60" y1="110" x2="80" y2="110" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="90" y1="115" x2="110" y2="115" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><line x1="120" y1="108" x2="140" y2="108" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="150" y1="120" x2="170" y2="120" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><line x1="180" y1="110" x2="200" y2="110" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="80" y1="145" x2="100" y2="145" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><line x1="110" y1="150" x2="130" y2="150" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="145" y1="142" x2="165" y2="142" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><line x1="175" y1="150" x2="195" y2="150" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="100" y1="132" x2="120" y2="132" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><line x1="160" y1="132" x2="180" y2="132" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><text x="354" y="52" font-size="13" text-anchor="middle" fill="#23282d" font-weight="bold">dilute lysate</text><line x1="264" y1="100" x2="284" y2="100" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="344" y1="110" x2="364" y2="110" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><line x1="414" y1="100" x2="434" y2="100" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="284" y1="160" x2="304" y2="160" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><line x1="359" y1="155" x2="379" y2="155" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="419" y1="160" x2="439" y2="160" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><text x="578" y="52" font-size="13" text-anchor="middle" fill="#23282d" font-weight="bold">inside intact nuclei</text><ellipse cx="578" cy="122" rx="92" ry="52" fill="#e8eef5" stroke="#1f3b57" stroke-width="1.4"/><line x1="518" y1="110" x2="538" y2="110" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="543" y1="120" x2="563" y2="120" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><line x1="588" y1="106" x2="608" y2="106" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="613" y1="122" x2="633" y2="122" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><line x1="533" y1="150" x2="553" y2="150" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><line x1="568" y1="146" x2="588" y2="146" stroke="#4a6b8a" stroke-width="4" stroke-linecap="round"/><line x1="608" y1="150" x2="628" y2="150" stroke="#1f3b57" stroke-width="4" stroke-linecap="round"/><circle cx="553" cy="121" r="4" fill="#b4532a"/><circle cx="598" cy="107" r="4" fill="#b4532a"/><text x="30" y="216" font-size="12.5" fill="#23282d">Concentrated: ends meet at random, so most junctions are noise. Dilute: one-molecule events, but the neighbours have drifted apart.</text><text x="30" y="238" font-size="12.5" fill="#b4532a">In nuclei: the crosslinked structure is still intact when ligase acts, so random joins are rare.</text>
</svg>
