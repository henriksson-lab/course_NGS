<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 270" width="844" height="270" font-family='"Palatino Linotype", "Book Antiqua", Palatino, FreeSerif, serif' fill="#23282d">
<rect width="720" height="270" fill="none"/>
<text x="30" y="24" font-size="14" fill="#23282d">The cutter sets how fine the map can be.</text><line x1="40" y1="64" x2="600" y2="64" stroke="#dfe3e6" stroke-width="4" stroke-linecap="butt"/><line x1="60" y1="56" x2="60" y2="72" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="230" y1="56" x2="230" y2="72" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="380" y1="56" x2="380" y2="72" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="560" y1="56" x2="560" y2="72" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><text x="612" y="61" font-size="12" fill="#23282d">6-cutter, e.g. HindIII</text><text x="612" y="77" font-size="11.5" fill="#8a8f94">one cut per ~4 kb on average</text><line x1="40" y1="118" x2="600" y2="118" stroke="#dfe3e6" stroke-width="4" stroke-linecap="butt"/><line x1="52" y1="110" x2="52" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="78" y1="110" x2="78" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="104" y1="110" x2="104" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="130" y1="110" x2="130" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="156" y1="110" x2="156" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="182" y1="110" x2="182" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="208" y1="110" x2="208" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="234" y1="110" x2="234" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="260" y1="110" x2="260" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="286" y1="110" x2="286" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="312" y1="110" x2="312" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="338" y1="110" x2="338" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="364" y1="110" x2="364" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="390" y1="110" x2="390" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="416" y1="110" x2="416" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="442" y1="110" x2="442" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="468" y1="110" x2="468" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="494" y1="110" x2="494" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="520" y1="110" x2="520" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="546" y1="110" x2="546" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="572" y1="110" x2="572" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="598" y1="110" x2="598" y2="126" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><text x="612" y="115" font-size="12" fill="#23282d">4-cutter, e.g. MboI</text><text x="612" y="131" font-size="11.5" fill="#8a8f94">one cut per ~256 bp</text><line x1="40" y1="172" x2="600" y2="172" stroke="#dfe3e6" stroke-width="4" stroke-linecap="butt"/><line x1="52" y1="164" x2="52" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="72" y1="164" x2="72" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="92" y1="164" x2="92" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="112" y1="164" x2="112" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="132" y1="164" x2="132" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="152" y1="164" x2="152" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="172" y1="164" x2="172" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="192" y1="164" x2="192" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="212" y1="164" x2="212" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="232" y1="164" x2="232" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="252" y1="164" x2="252" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="272" y1="164" x2="272" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="292" y1="164" x2="292" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="312" y1="164" x2="312" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="332" y1="164" x2="332" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="352" y1="164" x2="352" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="372" y1="164" x2="372" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="392" y1="164" x2="392" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="412" y1="164" x2="412" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="432" y1="164" x2="432" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="452" y1="164" x2="452" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="472" y1="164" x2="472" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="492" y1="164" x2="492" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="512" y1="164" x2="512" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="532" y1="164" x2="532" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="552" y1="164" x2="552" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="572" y1="164" x2="572" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><line x1="592" y1="164" x2="592" y2="180" stroke="#b4532a" stroke-width="1.8" stroke-linecap="round"/><text x="612" y="169" font-size="12" fill="#23282d">MNase (Micro-C)</text><text x="612" y="185" font-size="11.5" fill="#8a8f94">cuts linkers: one piece per nucleosome</text><text x="30" y="232" font-size="12.5" fill="#23282d">In a random sequence an n-base site occurs once per 4^n bases; real genomes deviate, and sites cluster unevenly.</text><text x="30" y="254" font-size="12.5" fill="#b4532a">A fragment is the smallest unit of the map, so fragment length is the limit on resolution.</text>
</svg>
